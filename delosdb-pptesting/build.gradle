plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// The inherited Derby package-private tests are intentionally moved into this
// Gradle module as source layout first. Compilation/execution is deferred
// because these tests are tied to legacy harness wiring and package-private
// access assumptions.
def packagePrivateTestSourceRoot = file('src/test/java')
def legacyBuildFile = file('src/test/legacy/build.xml')

tasks.register('verifyDerbyPackagePrivateTestsSourceLayout') {
    group = 'verification'
    description = 'Verifies that the inherited Derby package-private test tree is owned by delosdb-pptesting.'
    inputs.dir(packagePrivateTestSourceRoot)
    inputs.file(legacyBuildFile)
    doLast {
        if (!packagePrivateTestSourceRoot.isDirectory()) {
            throw new GradleException("Missing Derby package-private test source root: ${packagePrivateTestSourceRoot}")
        }
        if (!legacyBuildFile.isFile()) {
            throw new GradleException("Missing moved package-private legacy build file: ${legacyBuildFile}")
        }
        def suite = new File(packagePrivateTestSourceRoot, 'org/apache/derby/PackagePrivateTestSuite.java')
        if (!suite.isFile()) {
            throw new GradleException("Missing package-private test suite: ${suite}")
        }
        def clientSuite = new File(packagePrivateTestSourceRoot, 'org/apache/derby/client/am/_Suite.java')
        if (!clientSuite.isFile()) {
            throw new GradleException("Missing package-private client test suite: ${clientSuite}")
        }
        def clobTest = new File(packagePrivateTestSourceRoot, 'org/apache/derby/impl/jdbc/InternalClobTest.java')
        if (!clobTest.isFile()) {
            throw new GradleException("Missing package-private JDBC CLOB test: ${clobTest}")
        }
    }
}


tasks.register('verifyDerbyPackagePrivateTestsAssets') {
    group = 'verification'
    description = 'Verifies the inherited Derby package-private test inventory without compiling it.'
    inputs.dir(packagePrivateTestSourceRoot)
    inputs.file(legacyBuildFile)
    doLast {
        if (!packagePrivateTestSourceRoot.isDirectory()) {
            throw new GradleException("Missing Derby package-private test source root: ${packagePrivateTestSourceRoot}")
        }
        if (!legacyBuildFile.isFile()) {
            throw new GradleException("Missing moved package-private legacy build file: ${legacyBuildFile}")
        }

        def javaFiles = fileTree(packagePrivateTestSourceRoot) {
            include '**/*.java'
        }.files
        if (javaFiles.size() != 10) {
            throw new GradleException("Expected 10 package-private Java test files, found ${javaFiles.size()}")
        }

        [
            'org/apache/derby/PackagePrivateTestSuite.java',
            'org/apache/derby/client/am/_Suite.java',
            'org/apache/derby/client/am/LogicalStatementEntityTest.java',
            'org/apache/derby/impl/jdbc/_Suite.java',
            'org/apache/derby/impl/jdbc/InternalClobTest.java',
            'org/apache/derby/impl/jdbc/UTF8ReaderTest.java',
            'org/apache/derby/impl/jdbc/SmallStoreStreamClobTest.java',
            'org/apache/derby/impl/jdbc/BiggerStoreStreamClobTest.java',
            'org/apache/derby/impl/jdbc/SmallTemporaryClobTest.java',
            'org/apache/derby/impl/jdbc/BiggerTemporaryClobTest.java'
        ].each { relativePath ->
            def source = new File(packagePrivateTestSourceRoot, relativePath)
            if (!source.isFile()) {
                throw new GradleException("Missing package-private test source: ${source}")
            }
        }

        if (legacyBuildFile.length() == 0L) {
            throw new GradleException("Moved package-private legacy build file is empty: ${legacyBuildFile}")
        }
    }
}



// Compile the small inherited package-private test island. These tests are
// classpath-compiled intentionally because they live in production packages to
// exercise package-private behavior.
def packagePrivateTestClassDir = layout.buildDirectory.dir('classes/pptesting')
def testSupportClassDir = rootProject.project(':delosdb-tests').layout.buildDirectory.dir('classes/test-support')
def junitClasspath = rootProject.files('tools/java/junit.jar')
def externalTestClasspath = rootProject.files(
        'tools/java/geronimo-spec-servlet-2.4-rc4.jar',
        'tools/java/json_simple-1.1.jar',
        'tools/java/lucene-analyzers-common.jar',
        'tools/java/lucene-core.jar',
        'tools/java/lucene-queryparser.jar'
)
def commonsModuleClassDir = rootProject.project(':delosdb-commons').layout.buildDirectory.dir('classes/modules/org.apache.derby.commons')
def engineModuleClassDir = rootProject.project(':delosdb-engine').layout.buildDirectory.dir('classes/modules/org.apache.derby.engine')
def clientModuleClassDir = rootProject.project(':delosdb-client').layout.buildDirectory.dir('classes/modules/org.apache.derby.client')
def serverModuleClassDir = rootProject.project(':delosdb-server').layout.buildDirectory.dir('classes/modules/org.apache.derby.server')
def toolsModuleClassDir = rootProject.project(':delosdb-tools').layout.buildDirectory.dir('classes/modules/org.apache.derby.tools')
def optionalToolsModuleClassDir = rootProject.project(':delosdb-optionaltools').layout.buildDirectory.dir('classes/modules/org.apache.derby.optionaltools')
def runnerModuleClassDir = rootProject.project(':delosdb-runner').layout.buildDirectory.dir('classes/modules/org.apache.derby.runner')

tasks.register('compileDerbyPackagePrivateTests', JavaCompile) {
    dependsOn 'verifyDerbyPackagePrivateTestsAssets',
            ':delosdb-tests:compileDerbyTestSupport',
            ':delosdb-commons:compileDerbyCommons',
            ':delosdb-client:compileDerbyClient',
            ':delosdb-server:compileDerbyServer',
            ':delosdb-tools:compileDerbyTools',
            ':delosdb-optionaltools:compileDerbyOptionalTools',
            ':delosdb-runner:compileDerbyRunner',
            ':delosdb-engine:compileDerbyEngine',
            ':delosdb-engine:compileClassSizeCatalog',
            ':splitEngineMessages'
    source = fileTree(packagePrivateTestSourceRoot) { include '**/*.java' }
    destinationDirectory = packagePrivateTestClassDir
    sourceCompatibility = rootProject.ext.javaRelease.toString()
    targetCompatibility = rootProject.ext.javaRelease.toString()
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    classpath = rootProject.files(
            commonsModuleClassDir,
            engineModuleClassDir,
            clientModuleClassDir,
            serverModuleClassDir,
            toolsModuleClassDir,
            optionalToolsModuleClassDir,
            runnerModuleClassDir,
            testSupportClassDir,
            junitClasspath,
            externalTestClasspath
    )
}

tasks.register('classes') {
    dependsOn 'compileDerbyPackagePrivateTests'
}

tasks.named('assemble') {
    dependsOn 'classes'
}

tasks.named('check') {
    dependsOn 'verifyDerbyPackagePrivateTestsSourceLayout', 'verifyDerbyPackagePrivateTestsAssets', 'compileDerbyPackagePrivateTests'
}
