plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// The inherited Derby package-private tests are intentionally moved into this
// Gradle module as source layout first. Compilation/execution is deferred
// because these tests are tied to legacy harness wiring and package-private
// access assumptions.
def packagePrivateTestSourceRoot = file('src/test/java')
def legacyBuildFile = file('src/test/legacy/build.xml')






// Compile the small inherited package-private test island. These tests are
// classpath-compiled intentionally because they live in production packages to
// exercise package-private behavior.
def packagePrivateTestClassDir = layout.buildDirectory.dir('classes/pptesting')
// The active Gradle test support now lives in the compiled inherited test module.
// Keep package-private tests classpath-compiled, but depend on the proven
// compileDerbyTestsModule task instead of the removed compileDerbyTestSupport task.
def testSupportClassDir = rootProject.project(':delosdb-tests').layout.buildDirectory.dir('classes/modules/org.apache.derby.tests')
def junitClasspath = rootProject.files('tools/java/junit.jar')
def externalTestClasspath = rootProject.files(
        'tools/java/geronimo-spec-servlet-2.4-rc4.jar',
        'tools/java/json_simple-1.1.jar',
        'tools/java/lucene-analyzers-common.jar',
        'tools/java/lucene-core.jar',
        'tools/java/lucene-queryparser.jar'
)
def commonsModuleClassDir = rootProject.project(':delosdb-commons').layout.buildDirectory.dir('classes/modules/org.apache.derby.commons')
def kernelModuleClassDir = rootProject.project(':delosdb-engine-kernel').layout.buildDirectory.dir('classes/modules/io.github.ggeorg.delosdb.engine.kernel')
def storageDerbyClassDir = rootProject.project(':delosdb-storage-derby').layout.buildDirectory.dir('classes/main')
def storeApiClassDir = rootProject.project(':delosdb-derby-store-api').layout.buildDirectory.dir('classes/store-api')
def engineStorageApiClassDir = rootProject.project(':delosdb-engine-storage-api').layout.buildDirectory.dir('classes/engine-storage-api')
def engineModuleClassDir = rootProject.project(':delosdb-engine').layout.buildDirectory.dir('classes/modules/org.apache.derby.engine')
def clientModuleClassDir = rootProject.project(':delosdb-client').layout.buildDirectory.dir('classes/modules/org.apache.derby.client')
def serverModuleClassDir = rootProject.project(':delosdb-server').layout.buildDirectory.dir('classes/modules/org.apache.derby.server')
def toolsModuleClassDir = rootProject.project(':delosdb-tools').layout.buildDirectory.dir('classes/modules/org.apache.derby.tools')
def optionalToolsModuleClassDir = rootProject.project(':delosdb-optionaltools').layout.buildDirectory.dir('classes/modules/org.apache.derby.optionaltools')
def runnerModuleClassDir = rootProject.project(':delosdb-runner').layout.buildDirectory.dir('classes/modules/org.apache.derby.runner')

tasks.register('compileDerbyPackagePrivateTests', JavaCompile) {
    dependsOn ':delosdb-tests:compileDerbyTestsModule',
            ':delosdb-commons:compileDerbyCommons',
            ':delosdb-client:compileDerbyClient',
            ':delosdb-server:compileDerbyServer',
            ':delosdb-tools:compileDerbyTools',
            ':delosdb-optionaltools:compileDerbyOptionalTools',
            ':delosdb-runner:compileDerbyRunner',
            ':delosdb-engine-kernel:compileDelosDbEngineKernel',
            ':delosdb-engine-kernel:compileDelosDbEngineKernelClassSizeCatalog',
            ':delosdb-engine-storage-api:compileEngineStorageApi',
            ':delosdb-derby-store-api:compileDerbyStoreApi',
            ':delosdb-storage-derby:compileLegacyDerbyStorage',
            ':delosdb-engine:compileDerbyEngine',
            ':delosdb-engine:copyEngineServiceDescriptors',
            ':delosdb-engine:compileClassSizeCatalog',
            ':splitEngineMessages'
    source = fileTree(packagePrivateTestSourceRoot) { include '**/*.java' }
    destinationDirectory = packagePrivateTestClassDir
    sourceCompatibility = rootProject.ext.javaRelease.toString()
    targetCompatibility = rootProject.ext.javaRelease.toString()
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    classpath = rootProject.files(
            commonsModuleClassDir,
            kernelModuleClassDir,
            engineStorageApiClassDir,
            storeApiClassDir,
            storageDerbyClassDir,
            engineModuleClassDir,
            clientModuleClassDir,
            serverModuleClassDir,
            toolsModuleClassDir,
            optionalToolsModuleClassDir,
            runnerModuleClassDir,
            testSupportClassDir,
            junitClasspath,
            externalTestClasspath
    )
}

tasks.register('classes') {
    dependsOn 'compileDerbyPackagePrivateTests'
}

tasks.named('assemble') {
    dependsOn 'classes'
}

tasks.named('check') {
    dependsOn 'compileDerbyPackagePrivateTests'
}
