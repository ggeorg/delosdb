plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.testing.Test

version = rootProject.version
group = rootProject.group

// Real Gradle Java module for the inherited Derby package-private test island.
// These tests are intentionally classpath-compiled because they live inside
// production packages to exercise package-private behavior.
def packagePrivateTestSourceRoot = file('src/test/java')
def packagePrivateTestClassDir = layout.buildDirectory.dir('classes/pptesting')

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

dependencies {
    testImplementation project(':delosdb-client')
    testImplementation project(':delosdb-commons')
    testImplementation project(':delosdb-engine')
    testImplementation project(':delosdb-runtime-api')
    // Required by StringDataValue's inherited Store* interfaces used by UTF8ReaderTest.
    // Source-import analysis cannot see this classfile-signature dependency.
    testImplementation project(':delosdb-derby-store-api')
    testImplementation project(path: ':delosdb-tests', configuration: 'derbyTestsClasses')

    testImplementation rootProject.files('tools/java/junit.jar')
    testImplementation rootProject.files('tools/java/geronimo-spec-servlet-2.4-rc4.jar')
    testImplementation rootProject.files('tools/java/json_simple-1.1.jar')
    testImplementation rootProject.files('tools/java/lucene-analyzers-common.jar')
    testImplementation rootProject.files('tools/java/lucene-core.jar')
    testImplementation rootProject.files('tools/java/lucene-queryparser.jar')
}

sourceSets {
    main {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
    test {
        java {
            setSrcDirs([packagePrivateTestSourceRoot])
            include '**/*.java'
            destinationDirectory.set(packagePrivateTestClassDir)
        }
        resources.setSrcDirs([])
    }
}

tasks.named('compileTestJava', JavaCompile) {
    destinationDirectory.set(packagePrivateTestClassDir)
    modularity.inferModulePath = false
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
}

// Package-private tests are compiled as a structural proof. They are not part
// of the default catch-all Gradle test task.
tasks.named('test', Test) {
    enabled = false
}

// Compatibility alias used by the root build and existing scripts.
tasks.register('compileDerbyPackagePrivateTests') {
    dependsOn tasks.named('compileTestJava')
}


tasks.named('assemble') {
    dependsOn tasks.named('compileDerbyPackagePrivateTests')
}

tasks.named('check') {
    dependsOn tasks.named('compileDerbyPackagePrivateTests')
}
