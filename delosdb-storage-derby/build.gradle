plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// Real Gradle Java module for the inherited Derby heap/raw/access/WAL store
// implementation. It remains classpath-compiled because derby.jar still patches
// this implementation into org.apache.derby.engine for Derby compatibility.
def sourceRoot = file('src/main/java')
def mainClassDir = layout.buildDirectory.dir('classes/main')

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

dependencies {
    implementation project(':delosdb-commons')
    implementation project(':delosdb-spi')
    implementation project(':delosdb-engine-api')
    implementation project(':delosdb-storage-io')
    implementation project(':delosdb-engine-storage-api')
    implementation project(':delosdb-derby-store-api')
}

sourceSets {
    main {
        java {
            srcDir sourceRoot
            include 'org/apache/derby/impl/store/**/*.java'
            exclude 'module-info.java'
            destinationDirectory.set(mainClassDir)
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    destinationDirectory.set(mainClassDir)
    modularity.inferModulePath = false
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

// Compatibility alias used by the existing root build and patch-module tasks.
tasks.register('compileLegacyDerbyStorage') {
    dependsOn tasks.named('compileJava')
}

tasks.named('jar', Jar) {
    archiveFileName = 'delosdb-storage-derby.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Legacy Derby Storage')
    }
}

// Compatibility runtime jar used by the root `jars` task.
tasks.register('legacyDerbyStorageJar', Jar) {
    dependsOn tasks.named('compileJava'), tasks.named('processResources')
    archiveFileName = 'delosdb-storage-derby.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(mainClassDir)
    from(sourceSets.main.output.resourcesDir)
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Legacy Derby Storage')
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('legacyDerbyStorageJar')
}

tasks.named('check') {
    dependsOn tasks.named('classes')
}
