plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

def sourceRoot = file('src/main/java')
def mainClassDir = layout.buildDirectory.dir('classes/main')

// Use exact compile task dependencies but plain output locations. Avoid both
// sibling task-provider lookup during project evaluation and lifecycle outputs
// such as :delosdb-engine-kernel:classes, which would pull ClassSizeCatalog and
// re-enter delosdb-engine after B6n.
def kernelModuleClassDir = rootProject.project(':delosdb-engine-kernel').layout.buildDirectory.dir('classes/modules/io.github.ggeorg.delosdb.engine.kernel')
def commonsModuleClassDir = rootProject.project(':delosdb-commons').layout.buildDirectory.dir('classes/modules/org.apache.derby.commons')
def spiModuleClassDir = rootProject.project(':delosdb-spi').layout.buildDirectory.dir('classes/spi')
def storeApiClassDir = rootProject.project(':delosdb-derby-store-api').layout.buildDirectory.dir('classes/store-api')
def engineStorageApiClassDir = rootProject.project(':delosdb-engine-storage-api').layout.buildDirectory.dir('classes/engine-storage-api')

tasks.register('compileLegacyDerbyStorage', JavaCompile) {
    // B6n closes the source-owner boundary: the storage module compiles the
    // relocated Derby store without depending on delosdb-engine output.
    // Depend only on exact compile producers, never on :classes lifecycle tasks.
    dependsOn ':delosdb-engine-kernel:compileDelosDbEngineKernel'
    dependsOn ':delosdb-commons:compileDerbyCommons'
    dependsOn ':delosdb-spi:compileDelosDbSpi'
    dependsOn ':delosdb-engine-storage-api:compileEngineStorageApi'
    dependsOn ':delosdb-derby-store-api:compileDerbyStoreApi'
    source = fileTree(sourceRoot) {
        include 'org/apache/derby/impl/store/**/*.java'
        exclude 'module-info.java'
    }
    destinationDirectory = mainClassDir
    sourceCompatibility = rootProject.ext.javaRelease.toString()
    targetCompatibility = rootProject.ext.javaRelease.toString()
    // Keep the storage compile itself classpath-based for now. The engine
    // compatibility module consumes this compiled output through --patch-module
    // so derby.jar remains runtime-compatible while source ownership is cut.
    modularity.inferModulePath = false
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
    classpath = rootProject.files(
            kernelModuleClassDir,
            commonsModuleClassDir,
            spiModuleClassDir,
            engineStorageApiClassDir,
            storeApiClassDir)
}

tasks.register('classes') {
    dependsOn 'compileLegacyDerbyStorage'
}

tasks.register('legacyDerbyStorageJar', Jar) {
    dependsOn 'compileLegacyDerbyStorage'
    archiveFileName = 'delosdb-storage-derby.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from mainClassDir
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Legacy Derby Storage')
    }
}

tasks.named('assemble') {
    dependsOn 'legacyDerbyStorageJar'
}

tasks.named('check') {
    dependsOn 'compileLegacyDerbyStorage'
}
