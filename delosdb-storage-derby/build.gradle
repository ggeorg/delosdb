plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// Gradle subproject for inherited Derby storage implementations patched into
// org.apache.derby.engine, including heap/raw/access/WAL code. This source set is
// compiled on the classpath because the current runtime still packages these
// classes into the Derby engine jar. Derby-facing MVCC access-method glue lives
// in delosdb-storage-bridge so this inherited storage module does not depend on
// native MVCC storage.
def sourceRoot = file('src/main/java')
def mainClassDir = layout.buildDirectory.dir('classes/main')

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}


configurations {
    derbyRuntimePatchElements {
        canBeConsumed = true
        canBeResolved = false
        transitive = false
    }
}

dependencies {
    implementation project(':delosdb-commons')
    implementation project(':delosdb-annotations')
    implementation project(':delosdb-runtime-api')
    implementation project(':delosdb-storage-api')
    implementation project(':delosdb-derby-store-api')
}

sourceSets {
    main {
        java {
            srcDir sourceRoot
            include 'org/apache/derby/impl/store/**/*.java'
            // Defensive only: older checkouts may still contain the removed
            // JPMS scaffold descriptor. It is not part of this classpath-compiled
            // inherited storage source set.
            exclude 'module-info.java'
            destinationDirectory.set(mainClassDir)
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    destinationDirectory.set(mainClassDir)
    modularity.inferModulePath = false
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

// Compatibility alias used by the existing root build and patch-module tasks.
tasks.register('compileLegacyDerbyStorage') {
    dependsOn tasks.named('compileJava')
}

tasks.named('jar', Jar) {
    archiveFileName = 'delosdb-storage-derby.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Derby Storage')
    }
}

artifacts {
    derbyRuntimePatchElements(tasks.named('jar')) {
        builtBy tasks.named('jar')
    }
}


tasks.named('check') {
    dependsOn tasks.named('classes')
}

tasks.register('runAccessMethodTransactionLifecycleTest', JavaExec) {
    group = 'verification'
    description = 'Runs the neutral access-method transaction lifecycle contract test.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.apache.derby.impl.store.access.AccessMethodTransactionLifecycleTest'
}

tasks.named('check') {
    dependsOn tasks.named('runAccessMethodTransactionLifecycleTest')
}
