plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

def sourceRoot = file('src/main/java')
def mainClassDir = layout.buildDirectory.dir('classes/main')

tasks.register('compileLegacyDerbyStorage', JavaCompile) {
    source = fileTree(sourceRoot) {
        include '**/*.java'
        // DS8/DS9 move legacy store API and implementation source ownership
        // here, but those packages still compile into org.apache.derby.engine
        // until kernel extraction/runtime packaging is complete. Compiling them
        // into this scaffold module as well would create runtime split packages.
        exclude 'org/apache/derby/iapi/store/**/*.java'
        exclude 'org/apache/derby/impl/store/**/*.java'
    }
    destinationDirectory = mainClassDir
    rootProject.ext.delosdbConfigureJavaCompile(delegate)
    classpath = rootProject.files()
}

tasks.register('classes') {
    dependsOn 'compileLegacyDerbyStorage'
}

tasks.register('legacyDerbyStorageJar', Jar) {
    dependsOn 'compileLegacyDerbyStorage'
    archiveFileName = 'delosdb-storage-derby.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from mainClassDir
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Legacy Derby Storage')
    }
}

tasks.named('assemble') {
    dependsOn 'legacyDerbyStorageJar'
}

tasks.named('check') {
    dependsOn 'compileLegacyDerbyStorage'
}
