plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile
import java.util.zip.ZipFile

version = rootProject.version
group = rootProject.group

// Gradle Java module and canonical artifact owner for derbyclient.jar.
def moduleName = 'org.apache.derby.client'
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

dependencies {
    implementation project(':delosdb-commons')
}

sourceSets {
    main {
        java {
            destinationDirectory.set(moduleClassDir)
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    destinationDirectory.set(moduleClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}


class DelosDbClientJarVerifier {
    private static final List<String> REQUIRED_RESOURCES = [
            'META-INF/services/java.sql.Driver',
            'org/apache/derby/info/client/info.properties',
            'org/apache/derby/loc/client/clientmessages.properties',
            'org/apache/derby/loc/client/clientmessages_en.properties'
    ]

    static void assertBootResourcesPresent(File jarFile) {
        new ZipFile(jarFile).withCloseable { zip ->
            def missing = REQUIRED_RESOURCES.findAll { zip.getEntry(it) == null }
            if (!missing.isEmpty()) {
                throw new GradleException("${jarFile.name} is missing required client resources: ${missing}")
            }

            def serviceLines = zip.getInputStream(zip.getEntry('META-INF/services/java.sql.Driver'))
                    .getText('UTF-8')
                    .readLines()
                    .collect { it.trim() }
                    .findAll { it && !it.startsWith('#') }
            if (!serviceLines.contains('org.apache.derby.client.ClientAutoloadedDriver')) {
                throw new GradleException("${jarFile.name} does not advertise the network client JDBC driver; found ${serviceLines}")
            }
        }
    }
}

ext.delosdbProductInfo = [
        taskName      : 'generateClientInfoProperties',
        resourcePath  : 'org/apache/derby/info/client/info.properties',
        technologyName: 'DelosDB Network Client',
        productFile   : 'derbyclient.jar'
]
apply from: rootProject.file('gradle/delosdb-product-info.gradle')

def generatedClientMessageResourceDir = layout.buildDirectory.dir('generated/resources/messages')

tasks.named('processResources') {
    dependsOn rootProject.tasks.named('splitEngineMessages')
    dependsOn project.ext.delosdbProductInfoTask
    from project.ext.delosdbProductInfoResourceDir
    from generatedClientMessageResourceDir
}

// Compatibility alias used by the existing root build.
tasks.register('compileDerbyClient') {
    dependsOn tasks.named('compileJava')
}

def clientArchiveName = 'derbyclient.jar'

tasks.named('jar', Jar) {
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    archiveFileName = clientArchiveName
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Network Client')
    }
    doLast {
        DelosDbClientJarVerifier.assertBootResourcesPresent(archiveFile.get().asFile)
    }
}

tasks.named('check') {
    dependsOn tasks.named('classes')
}
