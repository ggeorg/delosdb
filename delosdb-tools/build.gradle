plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.file.FileSystemOperations
import org.gradle.process.ExecOperations
import javax.inject.Inject
import java.nio.file.Files

abstract class DelosDbToolsBuildServices {
    @Inject
    abstract ExecOperations getExecOperations()

    @Inject
    abstract FileSystemOperations getFileSystemOperations()
}

version = rootProject.version
group = rootProject.group

// Real Gradle Java module for derbytools.jar. The generated ij parsers remain
// local generated sources; legacy task names remain as aliases for the root
// Derby compatibility build.
def moduleName = 'org.apache.derby.tools'
def generatedSourceRoot = layout.buildDirectory.dir("generated/sources/${moduleName}")
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")
def javaccClasspath = rootProject.files('tools/java/javacc.jar')
def toolsBuildServices = objects.newInstance(DelosDbToolsBuildServices)
def ijGrammarDir = layout.projectDirectory.dir('src/main/java/org/apache/derby/impl/tools/ij')
def ijGrammarFile = ijGrammarDir.file('ij.jj')
def mtGrammarFile = ijGrammarDir.file('mtGrammar.jj')

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

dependencies {
    implementation project(':delosdb-commons')
    compileOnly project(':delosdb-runtime-api')
    compileOnly project(':delosdb-client')
    compileOnly project(path: ':delosdb-engine', configuration: 'derbyEngineClasses')
    compileOnly "org.ow2.asm:asm:${rootProject.ext.asmVersion}"
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir generatedSourceRoot
            destinationDirectory.set(moduleClassDir)
        }
    }
}

tasks.register('generateIjParsers') {
    def outputDir = generatedSourceRoot.map {
        it.dir('org/apache/derby/impl/tools/ij')
    }
    inputs.files(ijGrammarFile, mtGrammarFile)
    inputs.files(javaccClasspath).withPropertyName('javaccClasspath')
    outputs.dir(outputDir)
    doLast {
        def generatedDir = outputDir.get().asFile
        toolsBuildServices.fileSystemOperations.delete {
            delete generatedDir
        }
        generatedDir.mkdirs()

        ['ij.jj', 'mtGrammar.jj'].each { grammarName ->
            toolsBuildServices.execOperations.javaexec { spec ->
                spec.classpath = javaccClasspath
                spec.mainClass.set('javacc')
                spec.workingDir(ijGrammarDir.asFile)
                spec.args "-OUTPUT_DIRECTORY=${generatedDir.absolutePath}", grammarName
            }
        }

        Files.deleteIfExists(new File(generatedDir, 'ParseException.java').toPath())

        def replaceText = { String fileName, Closure<String> transform ->
            def generated = new File(generatedDir, fileName)
            if (generated.isFile()) {
                generated.setText(transform(generated.getText('UTF-8')), 'UTF-8')
            }
        }
        replaceText('ijConstants.java') { it.replace('public interface', 'interface') }
        replaceText('ijTokenManager.java') { it.replace('public class', 'class') }
        replaceText('ij.java') { it.replace('tokenImage', 'ijConstants.tokenImage') }
        replaceText('mtGrammar.java') { it.replace('tokenImage', 'mtGrammarConstants.tokenImage') }
        replaceText('CharStream.java') { text ->
            text
                    .replace('  int getColumn();', '  @Deprecated\n  int getColumn();')
                    .replace('  int getLine();', '  @Deprecated\n  int getLine();')
        }
        replaceText('SimpleCharStream.java') { text ->
            text
                    .replace('  public int getColumn() {', '  @Deprecated\n  public int getColumn() {')
                    .replace('  public int getLine() {', '  @Deprecated\n  public int getLine() {')
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn tasks.named('generateIjParsers')
    destinationDirectory.set(moduleClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

ext.delosdbProductInfo = [
        taskName      : 'generateToolsInfoProperties',
        resourcePath  : 'org/apache/derby/info/tools/info.properties',
        technologyName: 'DelosDB Tools',
        productFile   : 'derbytools.jar'
]
apply from: rootProject.file('gradle/delosdb-product-info.gradle')

tasks.named('processResources') {
    dependsOn project.ext.delosdbProductInfoTask
    from('src/main/java') {
        include '**/*.properties'
        include '**/*.policy'
        include '**/*.xml'
        exclude '**/messages.xml'
        exclude '**/*.tmpl'
    }
    from('src/main/java/org/apache/derby/loc') {
        include 'sysinfoMessages.properties'
        include 'toolsmessages.properties'
        into 'org/apache/derby/loc/tools'
    }
    from project.ext.delosdbProductInfoResourceDir
}

// Compatibility alias used by the existing root build.
tasks.register('compileDerbyTools') {
    dependsOn tasks.named('compileJava')
}

def toolsArchiveName = 'derbytools.jar'

tasks.named('jar', Jar) {
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    archiveFileName = toolsArchiveName
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Tools')
    }
}
