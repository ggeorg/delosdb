plugins {
    id 'java-library'
}

version = rootProject.version
group = rootProject.group

// Gradle Java module for inherited Derby store contracts. The retained
// compile alias is consumed by patch-module build wiring.
def mainClassDir = layout.buildDirectory.dir('classes/store-api')

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

dependencies {
    api project(':delosdb-commons')
    api project(':delosdb-runtime-api')
    api project(':delosdb-storage-api')
}

sourceSets {
    main {
        java {
            destinationDirectory.set(mainClassDir)
        }
    }
}

tasks.named('compileJava') {
    destinationDirectory.set(mainClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

// Compatibility alias used by the existing root build and extracted modules.
tasks.register('compileDerbyStoreApi') {
    dependsOn tasks.named('compileJava')
}

tasks.named('jar') {
    archiveFileName = 'delosdb-derby-store-api.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Derby Store API')
    }
}


tasks.named('check') {
    dependsOn tasks.named('classes')
}
