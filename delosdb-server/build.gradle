plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// Real Gradle Java module for derbynet.jar. Patch-module inputs are resolved
// through Gradle configurations instead of hard-coded sibling output dirs.
def moduleName = 'org.apache.derby.server'
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")
def servletModulePath = rootProject.files(
        'tools/java/geronimo-spec-servlet-2.4-rc4.jar'
)

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

configurations {
    enginePatchModule {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation project(':delosdb-commons')
    implementation project(':delosdb-tools')
    implementation project(':delosdb-runtime-api')
    compileOnly project(path: ':delosdb-engine', configuration: 'derbyEngineClasses')
    compileOnly servletModulePath

    enginePatchModule(project(':delosdb-derby-store-api')) { transitive = false }
}

def compileModulePathFiles = objects.fileCollection().from(configurations.compileClasspath)
def enginePatchModuleFiles = objects.fileCollection().from(configurations.enginePatchModule)

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            destinationDirectory.set(moduleClassDir)
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    inputs.files(compileModulePathFiles).withPropertyName('compileModulePath')
    inputs.files(enginePatchModuleFiles).withPropertyName('enginePatchModule')
    destinationDirectory.set(moduleClassDir)
    modularity.inferModulePath = false
    classpath = files()
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
    doFirst {
        options.compilerArgs.addAll(['--module-path', compileModulePathFiles.asPath])
        options.compilerArgs.addAll(['--patch-module', "org.apache.derby.engine=${enginePatchModuleFiles.asPath}"])
    }
}

ext.delosdbProductInfo = [
        taskName      : 'generateServerInfoProperties',
        resourcePath  : 'org/apache/derby/info/net/info.properties',
        technologyName: 'DelosDB Network Server',
        productFile   : 'derbynet.jar'
]
apply from: rootProject.file('gradle/delosdb-product-info.gradle')

tasks.named('processResources') {
    dependsOn project.ext.delosdbProductInfoTask
    from('src/main/java') {
        include '**/*.properties'
        include '**/*.policy'
        include '**/*.xml'
        exclude '**/messages.xml'
        exclude '**/*.tmpl'
    }
    from project.ext.delosdbProductInfoResourceDir
}

// Compatibility alias used by the existing root build.
tasks.register('compileDerbyServer') {
    dependsOn tasks.named('compileJava')
}

def serverArchiveName = 'derbynet.jar'

tasks.named('jar', Jar) {
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    archiveFileName = serverArchiveName
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Network Server')
    }
}
