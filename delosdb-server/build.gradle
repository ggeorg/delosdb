plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

def javaRelease = rootProject.ext.javaRelease as Integer
def moduleName = 'org.apache.derby.server'
def sourceRoot = rootProject.file('java/org.apache.derby.server')
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")
def commonsModuleClassDir = rootProject.project(':delosdb-commons').layout.buildDirectory.dir('classes/modules/org.apache.derby.commons')
def engineModuleClassDir = rootProject.project(':delosdb-engine').layout.buildDirectory.dir('classes/modules/org.apache.derby.engine')
def toolsModuleClassDir = rootProject.project(':delosdb-tools').layout.buildDirectory.dir('classes/modules/org.apache.derby.tools')
def externalModulePath = rootProject.files(
        'tools/java/geronimo-spec-servlet-2.4-rc4.jar',
        'tools/java/json_simple-1.1.jar',
        'tools/java/lucene-analyzers-common.jar',
        'tools/java/lucene-core.jar',
        'tools/java/lucene-queryparser.jar'
)

def configureJavaCompile = { JavaCompile task ->
    task.sourceCompatibility = javaRelease.toString()
    task.targetCompatibility = javaRelease.toString()
    task.options.release = javaRelease
    task.options.encoding = 'UTF-8'
    task.options.deprecation = false
    task.options.warnings = true
    task.classpath = files()
    task.doFirst {
        task.options.compilerArgs.addAll(['--module-path', files(
                commonsModuleClassDir,
                engineModuleClassDir,
                toolsModuleClassDir,
                externalModulePath
        ).asPath])
        task.options.compilerArgs.add('-Xlint:deprecation')
    }
}

tasks.register('compileDerbyServer', JavaCompile) {
    dependsOn ':delosdb-commons:compileDerbyCommons', ':delosdb-engine:compileDerbyEngine', ':delosdb-tools:compileDerbyTools'
    source = fileTree(sourceRoot) { include '**/*.java' }
    destinationDirectory = moduleClassDir
    configureJavaCompile(delegate)
}

tasks.register('classes') {
    dependsOn 'compileDerbyServer'
}

tasks.named('assemble') {
    dependsOn 'classes'
}
