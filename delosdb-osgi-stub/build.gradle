plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// Real Gradle Java module for the small OSGi API stub used by inherited Derby
// module descriptors. Keep the legacy task names while the wider build stops
// using custom JavaCompile tasks directly.
def moduleName = 'org.osgi.framework'
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

sourceSets {
    main {
        java {
            destinationDirectory.set(moduleClassDir)
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    destinationDirectory.set(moduleClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

// Compatibility alias used by the existing root build.
tasks.register('compileOsgiStubs') {
    dependsOn tasks.named('compileJava')
}

def osgiArchiveName = 'osgi-framework-stub.jar'

tasks.named('jar', Jar) {
    archiveFileName = osgiArchiveName
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB OSGi Framework Stub')
    }
}

// Compatibility alias used by the root `jars` task.
tasks.register('osgiFrameworkStubJar') {
    dependsOn tasks.named('jar')
}

tasks.named('check') {
    dependsOn tasks.named('classes')
}
