plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// Quarantined experimental versioned-storage SPI. This is intentionally separate
// from delosdb-spi so the public SPI module no longer owns the old MVCC
// execution-provider contract.
def moduleName = 'io.github.ggeorg.delosdb.versioned.storage.spi'
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

dependencies {
    api project(':delosdb-annotations')
}

sourceSets {
    main {
        java {
            destinationDirectory.set(moduleClassDir)
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    destinationDirectory.set(moduleClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.register('compileDelosDbVersionedStorageSpi') {
    dependsOn tasks.named('compileJava')
}

tasks.named('jar', Jar) {
    archiveFileName = 'delosdb-versioned-storage-spi.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Versioned Storage SPI')
    }
}

tasks.register('delosDbVersionedStorageSpiJar') {
    dependsOn tasks.named('jar')
}

tasks.named('check') {
    dependsOn tasks.named('classes')
}
