plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// Real Gradle Java module for shared inherited Derby engine/kernel API
// contracts. The legacy compile/jar task names remain while the wider build is
// migrated away from custom task wiring.
def moduleName = 'io.github.ggeorg.delosdb.engine.api'
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")
def generatedClassSizeCatalogSource = rootProject.layout.buildDirectory.file("generated/sources/${moduleName}/org/apache/derby/iapi/services/cache/ClassSizeCatalogImpl.java")

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

dependencies {
    api project(':delosdb-commons')
    api project(':delosdb-spi')
}

sourceSets {
    main {
        java {
            destinationDirectory.set(moduleClassDir)
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    destinationDirectory.set(moduleClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

// Compatibility alias used by the existing root build and extracted modules.
tasks.register('compileDelosDbEngineApi') {
    dependsOn tasks.named('compileJava')
}

// Keep generated ClassSizeCatalog out of the normal Java lifecycle. Gradle
// project dependencies must be able to consume delosdb-engine-api without
// pulling the root Derby resource/build-tools graph back through this module.
tasks.register('compileDelosDbEngineApiClassSizeCatalog', JavaCompile) {
    dependsOn tasks.named('compileJava'), ':delosdb-engine:compileDerbyEngine', ':generateClassSizeCatalog',
            project(':delosdb-commons').tasks.named('jar'),
            project(':delosdb-spi').tasks.named('jar')
    source = files(generatedClassSizeCatalogSource)
    destinationDirectory.set(moduleClassDir)
    rootProject.ext.delosdbConfigureJavaCompile(delegate, [
            project(':delosdb-commons').tasks.named('jar'),
            project(':delosdb-spi').tasks.named('jar'),
            moduleClassDir
    ])
}

tasks.named('jar', Jar) {
    archiveFileName = 'delosdb-engine-api.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Engine API')
    }
}

// Compatibility runtime jar used by the root `jars` task. This is separate from
// the normal Gradle `jar` artifact so project dependencies do not depend on the
// generated ClassSizeCatalog path.
tasks.register('delosDbEngineApiJar', Jar) {
    dependsOn tasks.named('compileJava'), tasks.named('processResources'), tasks.named('compileDelosDbEngineApiClassSizeCatalog')
    archiveFileName = 'delosdb-engine-api.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(moduleClassDir)
    from(sourceSets.main.output.resourcesDir)
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Engine API')
    }
}
