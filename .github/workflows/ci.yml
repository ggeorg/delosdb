name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Full verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # fullVerification includes check, which runs the runtime smokes and the
      # Derby language suite. --continue and collectAllFailures report every
      # failing suite and test instead of stopping at the first.
      - name: Full verification
        run: ./gradlew --no-daemon --continue fullVerification -Pdelosdb.derby.collectAllFailures=true
