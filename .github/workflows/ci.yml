name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, smoke, and inherited suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check cleanup invariants
        run: |
          ./scripts/remove-checkpoint-docs.sh
          git diff --exit-code

      - name: Full verification
        run: ./gradlew --no-daemon fullVerification

      - name: Run DelosDB runtime smokes
        run: ./gradlew --no-daemon derbyRuntimeSmoke

      - name: Run inherited Derby language suite
        run: ./gradlew --no-daemon :delosdb-tests:runDerbyLangSuite

      - name: Sysinfo from jars
        run: ./gradlew --no-daemon sysinfoFromJars
