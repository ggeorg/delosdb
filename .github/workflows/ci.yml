name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Verify release artifacts
        run: ./gradlew --no-daemon verifyReleaseArtifacts

      - name: Verify binary distribution
        run: ./gradlew --no-daemon verifyReleaseDistribution

      - name: Verify Maven Local publications
        run: ./gradlew --no-daemon verifyMavenPublications

      - name: Verify Maven Local consumer
        run: ./gradlew --no-daemon verifyMavenLocalConsumer

      - name: Verify centralized Gradle conventions
        run: ./gradlew --no-daemon verifyCentralizedReleaseMetadata verifyCentralizedJavaCompileConventions

      - name: Verify artifact inventory
        run: ./gradlew --no-daemon verifyArtifactInventory printArtifactInventory

      - name: Sysinfo from jars
        run: ./gradlew --no-daemon sysinfoFromJars
