plugins {
    id 'java-library'
}

version = rootProject.version
group = rootProject.group

// Gradle Java module for Derby shared utilities. The retained compile alias
// is consumed by existing root generation and verification tasks.
def moduleName = 'org.apache.derby.commons'
def generatedSourceRoot = layout.buildDirectory.dir("generated/sources/${moduleName}")
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir generatedSourceRoot
            destinationDirectory.set(moduleClassDir)
        }
    }
}

def saneBuild = providers.gradleProperty('delosdb.sane')
        .map { value ->
            def normalized = value.trim().toLowerCase(Locale.ROOT)
            if (!(normalized in ['true', 'false'])) {
                throw new GradleException(
                        "delosdb.sane must be either true or false: ${value}")
            }
            return normalized
        }
        .orElse('true')

tasks.register('generateSanityState') {
    def templateFile = file('src/main/java/org/apache/derby/shared/common/sanity/SanityState.tmpl')
    def outputFile = generatedSourceRoot.map {
        it.file('org/apache/derby/shared/common/sanity/SanityState.java')
    }
    inputs.file(templateFile)
    inputs.property('delosdb.sane', saneBuild)
    outputs.file(outputFile)
    doLast {
        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        target.text = templateFile.text.replace('@SANE@', saneBuild.get())
    }
}

tasks.named('compileJava') {
    dependsOn 'generateSanityState'
    destinationDirectory.set(moduleClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

// Compatibility alias used by the existing root build and extracted modules.
tasks.register('compileDerbyCommons') {
    dependsOn tasks.named('compileJava')
}

ext.delosdbProductInfo = [
        taskName      : 'generateCommonsInfoProperties',
        resourcePath  : 'org/apache/derby/info/shared/info.properties',
        technologyName: 'DelosDB Shared Utilities',
        productFile   : 'derbyshared.jar'
]
apply from: rootProject.file('gradle/delosdb-product-info.gradle')

tasks.named('processResources') {
    dependsOn project.ext.delosdbProductInfoTask
    from project.ext.delosdbProductInfoResourceDir
}

def commonsArchiveName = 'derbyshared.jar'

tasks.named('jar') {
    archiveFileName = commonsArchiveName
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Shared Utilities')
    }
}

