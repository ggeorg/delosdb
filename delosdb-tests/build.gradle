tasks.register('runDelosJdbcGate10lcMvccCurrentRowAnchorPairedAcceptanceProof') {
    group = 'benchmark'
    description = 'Runs balanced Gate 10L-C MVCC current-row anchor OFF/ON performance acceptance across HOT, DISJOINT and RANDOM.'
    dependsOn gate10lcMvccAnchorExecutionOrder
    outputs.upToDateWhen { false }

    doLast {
        File root = rootProject.layout.buildDirectory
                .dir(gate10lcMvccAnchorPairedRoot).get().asFile

        def loadCsv = { File file ->
            if (!file.isFile()) {
                throw new GradleException("Missing Gate 10L-C paired report: ${file}")
            }
            def lines = file.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            if (lines.size() < 2) {
                throw new GradleException("Gate 10L-C paired report has no rows: ${file}")
            }
            def header = (lines[0].split(',', -1) as List).collect {
                it.toString().trim().replace('\uFEFF', '')
            }
            lines.drop(1).collect { line ->
                def fields = line.split(',', -1)
                if (fields.length != header.size()) {
                    throw new GradleException(
                            "Gate 10L-C malformed CSV row in ${file}: ${line}")
                }
                def row = [:]
                header.eachWithIndex { name, fieldIndex ->
                    row[name] = fields[fieldIndex].toString().trim()
                }
                row
            }
        }

        def loadPhase = { String phase ->
            def rows = []
            (1..3).each { run ->
                File file = new File(root,
                        "${phase}/run-${run}/delos_mvcc-run-${run}.csv")
                def phaseRows = loadCsv(file)
                if (phaseRows.size() != 15) {
                    throw new GradleException(
                            "Gate 10L-C paired phase ${phase} run ${run} expected 15 rows, observed ${phaseRows.size()}.")
                }
                rows.addAll(phaseRows)
            }
            if (rows.size() != 45) {
                throw new GradleException(
                        "Gate 10L-C paired phase ${phase} expected 45 rows, observed ${rows.size()}.")
            }
            rows
        }

        def phaseRows = [:]
        phaseRows['off-a'] = loadPhase('off-a')
        phaseRows['on-a'] = loadPhase('on-a')
        phaseRows['on-b'] = loadPhase('on-b')
        phaseRows['off-b'] = loadPhase('off-b')
        def offRows = phaseRows['off-a'] + phaseRows['off-b']
        def onRows = phaseRows['on-a'] + phaseRows['on-b']
        def allRows = offRows + onRows
        if (offRows.size() != 90 || onRows.size() != 90 || allRows.size() != 180) {
            throw new GradleException(
                    "Gate 10L-C paired proof expected 90 rows/mode and 180 total, observed off=${offRows.size()} on=${onRows.size()} total=${allRows.size()}.")
        }

        def grouped = allRows.groupBy { row ->
            "${row.workload}:${Integer.parseInt(row.clients)}".toString()
        }
        if (grouped.size() != 15) {
            throw new GradleException(
                    "Gate 10L-C paired proof expected 15 workload/client cells, observed ${grouped.keySet()}.")
        }
        grouped.each { cell, values ->
            if (values.size() != 12) {
                throw new GradleException(
                        "Gate 10L-C paired ${cell} expected 12 observations, observed ${values.size()}.")
            }
            def fingerprints = values.collect { it.semanticFingerprint }.toSet()
            if (fingerprints.size() != 1) {
                throw new GradleException(
                        "Gate 10L-C paired semantic mismatch for ${cell}: ${fingerprints}")
            }
            def operationCounts = values.collect { it.measuredOperations }.toSet()
            if (operationCounts.size() != 1) {
                throw new GradleException(
                        "Gate 10L-C paired measured-operation mismatch for ${cell}: ${operationCounts}")
            }
            long retries = values.sum { Long.parseLong(it.retryableConflictRetries) } as long
            if (retries != 0L) {
                throw new GradleException(
                        "Gate 10L-C paired observed retryable conflicts for ${cell}: ${retries}")
            }
        }

        def median = { List<Double> input ->
            def sorted = input.collect { it as double }.sort()
            int n = sorted.size()
            if (n == 0) {
                return Double.NaN
            }
            n % 2 == 1 ? sorted[n.intdiv(2)] :
                    (sorted[n.intdiv(2) - 1] + sorted[n.intdiv(2)]) / 2.0d
        }
        def valuesFor = { rows, String workload, String clients, int expected ->
            def values = rows.findAll {
                it.workload == workload && it.clients == clients
            }.collect { Double.parseDouble(it.operationsPerSecond) }
            if (values.size() != expected) {
                throw new GradleException(
                        "Gate 10L-C paired expected ${expected} observations for ${workload}:${clients}, observed ${values.size()}.")
            }
            values
        }
        def dispersion = { List<Double> input ->
            def sorted = input.collect { it as double }.sort()
            double med = median(sorted)
            int n = sorted.size()
            def lower = sorted.subList(0, n.intdiv(2))
            def upper = sorted.subList((n + 1).intdiv(2), n)
            double q1 = median(lower)
            double q3 = median(upper)
            double iqr = q3 - q1
            def deviations = sorted.collect { Math.abs(it - med) }
            double mad = median(deviations)
            [median: med, q1: q1, q3: q3, iqr: iqr, mad: mad]
        }
        def phaseMedian = { String phase, String workload, String clients ->
            median(valuesFor(phaseRows[phase], workload, clients, 3))
        }

        def decision = [
                'Gate 10L-C balanced experimental MVCC Current-Row Anchor performance acceptance',
                'Exact current MVCC tree in both modes; RawStore directory/version history remains authoritative fallback.',
                "Only delosdb.experimental.mvccCurrentRowAnchor changes: OFF=false versus ON=true with ${gate10lcMvccAnchorSlots} transient anchor slots.",
                'Balanced execution: OFF-A -> ON-A -> ON-B -> OFF-B; three runs per phase; six observations/mode/cell.',
                'Acceptance authority: pooled six-vs-six median. HOT 8c and HOT 16c must each improve by at least 20%.',
                'No workload/client >=2c may regress >10%; 1c guard is -15%. Balanced-half deltas and IQR/MAD are diagnostic only.'
        ]
        def failures = []
        ['PRIMARY_KEY_READ_HOT',
         'PRIMARY_KEY_READ_DISJOINT',
         'PRIMARY_KEY_READ_RANDOM'].each { workload ->
            ['1', '2', '4', '8', '16'].each { clients ->
                def offStats = dispersion(valuesFor(offRows, workload, clients, 6))
                def onStats = dispersion(valuesFor(onRows, workload, clients, 6))
                double ratio = onStats.median / offStats.median
                double delta = (ratio - 1.0d) * 100.0d
                double halfARatio = phaseMedian('on-a', workload, clients) /
                        phaseMedian('off-a', workload, clients)
                double halfBRatio = phaseMedian('on-b', workload, clients) /
                        phaseMedian('off-b', workload, clients)
                double offIqrPct = offStats.median == 0.0d ? Double.NaN :
                        offStats.iqr / offStats.median * 100.0d
                double onIqrPct = onStats.median == 0.0d ? Double.NaN :
                        onStats.iqr / onStats.median * 100.0d
                double offMadPct = offStats.median == 0.0d ? Double.NaN :
                        offStats.mad / offStats.median * 100.0d
                double onMadPct = onStats.median == 0.0d ? Double.NaN :
                        onStats.mad / onStats.median * 100.0d

                def line = String.format(java.util.Locale.ROOT,
                        '%s %sc: OFF=%.2f ON=%.2f ratio=%.4f delta=%+.2f%% halfA=%+.2f%% halfB=%+.2f%% OFF-IQR=%.2f%% ON-IQR=%.2f%% OFF-MAD=%.2f%% ON-MAD=%.2f%%',
                        workload, clients, offStats.median, onStats.median, ratio, delta,
                        (halfARatio - 1.0d) * 100.0d, (halfBRatio - 1.0d) * 100.0d,
                        offIqrPct, onIqrPct, offMadPct, onMadPct)
                decision.add(line)
                logger.lifecycle('Gate 10L-C paired ' + line)

                double regressionFloor = clients == '1' ? 0.85d : 0.90d
                if (ratio < regressionFloor) {
                    failures.add(String.format(java.util.Locale.ROOT,
                            '%s %sc regressed %.2f%%',
                            workload, clients, (1.0d - ratio) * 100.0d))
                }
                if (workload == 'PRIMARY_KEY_READ_HOT' &&
                        (clients == '8' || clients == '16') && ratio < 1.20d) {
                    failures.add(String.format(java.util.Locale.ROOT,
                            '%s %sc improved only %.2f%%; required >=20.00%%',
                            workload, clients, delta))
                }
            }
        }

        File decisionFile = new File(root, 'gate10lc-mvcc-current-row-anchor-paired-decision.txt')
        if (!failures.isEmpty()) {
            decision.add('FAIL: ' + failures.join('; '))
            decisionFile.setText(
                    decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            throw new GradleException(
                    'Gate 10L-C paired performance acceptance failed: ' + failures.join('; '))
        }

        def passLine = 'PASS: the experimental bounded transient MVCC Current-Row Anchor delivers material HOT 8c/16c gains while preserving HOT/DISJOINT/RANDOM performance within the frozen guards. Proceed to final/persistent Current-Row Anchor architecture design and broader correctness/recovery/vacuum gates.'
        decision.add(passLine)
        decisionFile.setText(
                decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10L-C paired ' + passLine)
    }
}

