tasks.register('runDelosJdbcGate10llMvccPermanentArchitectureProof') {
    group = 'verification'
    description = 'Runs Gate 10L-L permanent-default semantic, lifecycle, boundedness, and zero-latch mechanism proof.'
    dependsOn tasks.named('runDelosMvccCurrentRowArchitecturePermanentDefaultTest')
    dependsOn tasks.named('runDelosMvccCurrentRowArchitectureLifecycleSafetyTest')
    dependsOn tasks.named('runDelosMvccCurrentRowArchitectureBoundedCacheTest')
    dependsOn tasks.named('runDelosJdbcGate10llMvccPermanentDefaultMechanism')
    outputs.upToDateWhen { false }

    doLast {
        File root = rootProject.layout.buildDirectory.dir(gate10llMvccPermanentRoot).get().asFile
        def loadCsv = { File file ->
            if (!file.isFile()) {
                throw new GradleException("Missing Gate 10L-L report: ${file}")
            }
            def lines = file.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            if (lines.size() < 2) {
                throw new GradleException("Gate 10L-L report has no rows: ${file}")
            }
            def header = (lines[0].split(',', -1) as List).collect {
                it.toString().trim().replace('\uFEFF', '')
            }
            lines.drop(1).collect { line ->
                def fields = line.split(',', -1)
                if (fields.length != header.size()) {
                    throw new GradleException("Gate 10L-L malformed CSV row in ${file}: ${line}")
                }
                def row = [:]
                header.eachWithIndex { name, index -> row[name] = fields[index].toString().trim() }
                row
            }
        }

        def measurements = loadCsv(new File(root, 'delos_mvcc-run-1.csv'))
        def latches = loadCsv(new File(root, 'page-latch-diagnostics-delos_mvcc-run-1.csv'))
        if (measurements.size() != 4 || latches.size() != 4) {
            throw new GradleException(
                    "Gate 10L-L expected four HOT rows; measurements=${measurements.size()} latches=${latches.size()}")
        }

        def failures = []
        def decision = [
                'Gate 10L-L permanent-v1 MVCC current-row architecture proof',
                'Experimental enable switches are retired from production authority.',
                'Permanent MVCC cache: Current-Row Anchor + current-version image, 4096 slots by default.',
                'Permanent B-tree facilities: exact-prefix leaf snapshot + level-1 branch-routing snapshot, restricted by the existing read-shape and locking-policy eligibility checks.',
                'Frozen mechanism guard: steady HOT physical page latches/read <= 0.10 at 1c/4c/8c/16c; retryable conflicts must remain zero.'
        ]

        ['1', '4', '8', '16'].each { clients ->
            def measurement = measurements.find { it.clients == clients }
            def latch = latches.find { it.clients == clients }
            if (measurement == null || latch == null) {
                throw new GradleException("Gate 10L-L missing ${clients}c HOT cell")
            }
            long operations = Long.parseLong(measurement.measuredOperations)
            long latchRequests = Long.parseLong(latch.latchRequests)
            double latchesPerRead = latchRequests / (double) operations
            if (Long.parseLong(measurement.retryableConflictRetries) != 0L) {
                failures.add("${clients}c observed retryable conflicts")
            }
            if (latchesPerRead > 0.10d) {
                failures.add(String.format(java.util.Locale.ROOT,
                        '%sc latches/read %.6f exceeds 0.10', clients, latchesPerRead))
            }
            def line = String.format(java.util.Locale.ROOT,
                    '%sc: throughput=%.2f op/s latches/read=%.6f retries=%s fingerprint=%s operations=%s',
                    clients,
                    Double.parseDouble(measurement.operationsPerSecond),
                    latchesPerRead,
                    measurement.retryableConflictRetries,
                    measurement.semanticFingerprint,
                    measurement.measuredOperations)
            decision.add(line)
            logger.lifecycle('Gate 10L-L ' + line)
        }

        File decisionFile = new File(root,
                'gate10ll-mvcc-permanent-current-row-architecture-decision.txt')
        if (!failures.isEmpty()) {
            decision.add('')
            decision.add('FAIL: ' + failures.join('; '))
            decisionFile.setText(
                    decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            throw new GradleException(
                    'Gate 10L-L permanent architecture proof failed: ' + failures.join('; '))
        }
        def passLine = 'PASS: the permanent default current-row architecture preserves lifecycle/boundedness semantics and the accepted zero-latch HOT mechanism with no experimental enable switches. Proceed to repository integrity, then the fresh five-engine checkpoint.'
        decision.add('')
        decision.add(passLine)
        decisionFile.setText(
                decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10L-L ' + passLine)
    }
}


// Gate 10L-M: fresh five-engine read checkpoint after the permanent-v1 MVCC
// current-row architecture transition. Keep the accepted Gate 10K-D workload
// geometry so the new MVCC numbers remain directly comparable to the accepted
// heap checkpoint. The Delos heap child JVM retains its two accepted read fast
// paths; Delos MVCC runs the permanent default architecture with no experimental
// enable switches. Eight runs provide two complete target-order balance blocks
// and feed the existing median/IQR/MAD dispersion reporting.
def gate10lmFiveEngineRoot =
        'reports/delosdb/benchmarks/gate10lm-five-engine-read-checkpoint'

tasks.register('runDelosJdbcGate10lmFiveEngineReadCheckpoint', JavaExec) {
    group = 'benchmark'
    description = 'Runs the fresh five-engine HOT/DISJOINT/RANDOM checkpoint after permanent MVCC current-row architecture.'
    dependsOn tasks.named('compileTestJava'), ':jars'

    mainClass = 'io.github.ggeorg.delosdb.benchmark.jdbc.DelosJdbcCrossEngineConcurrency'
    classpath = rootProject.files(derbyTestsClassDir)
    outputs.upToDateWhen { false }
    outputs.dir(rootProject.layout.buildDirectory.dir(gate10lmFiveEngineRoot))

    doFirst {
        def saneValue = providers.gradleProperty('delosdb.sane')
                .getOrElse('true')
                .trim()
                .toLowerCase(java.util.Locale.ROOT)
        if (saneValue != 'false') {
            throw new GradleException(
                    'Gate 10L-M five-engine checkpoint requires a release build; ' +
                            'rerun with -Pdelosdb.sane=false')
        }

        def reportDir = rootProject.layout.buildDirectory
                .dir(gate10lmFiveEngineRoot)
                .get().asFile
        def databaseRoot = rootProject.layout.buildDirectory
                .dir('tmp/delos-jdbc-gate10lm-five-engine-read-checkpoint')
                .get().asFile
        project.delete(reportDir)
        project.delete(databaseRoot)
        reportDir.mkdirs()
        databaseRoot.mkdirs()

        def javaExecutable = new File(System.getProperty('java.home'), 'bin/java').absolutePath
        systemProperties([
                // Accepted Delos heap architecture from Gates 10I-A / 10K-B..G.
                'delosdb.experimental.heapPageReadImage': 'true',
                'delosdb.experimental.fastRecordReadLock': 'true',

                // Delos MVCC intentionally receives no experimental enable property.
                // Gate 10L-L made the bounded current-row architecture permanent.
                'delosdb.benchmark.crossEngineConcurrency.sane': saneValue,
                'delosdb.benchmark.crossEngineConcurrency.projectDirectory': rootProject.projectDir.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.javaExecutable': javaExecutable,
                'delosdb.benchmark.crossEngineConcurrency.benchmarkClasses':
                        derbyTestsClassDir.get().asFile.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.delosClasspath':
                        rootProject.files(derbyRuntimeJars).asPath,
                'delosdb.benchmark.crossEngineConcurrency.upstreamDerbyClasspath':
                        upstreamDerbyBenchmarkRuntime.asPath,
                'delosdb.benchmark.crossEngineConcurrency.h2Classpath': h2BenchmarkRuntime.asPath,
                'delosdb.benchmark.crossEngineConcurrency.sqliteClasspath': sqliteBenchmarkRuntime.asPath,
                'delosdb.benchmark.crossEngineConcurrency.targets':
                        'delos_heap,delos_mvcc,upstream_derby,h2,sqlite',
                'delosdb.benchmark.crossEngineConcurrency.databaseRoot': databaseRoot.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.reportDirectory': reportDir.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.rows': '10000',
                'delosdb.benchmark.crossEngineConcurrency.clients': '1,2,4,8,16',
                'delosdb.benchmark.crossEngineConcurrency.widths': '10',
                'delosdb.benchmark.crossEngineConcurrency.workloads':
                        'PRIMARY_KEY_READ_HOT,PRIMARY_KEY_READ_DISJOINT,PRIMARY_KEY_READ_RANDOM',
                'delosdb.benchmark.crossEngineConcurrency.transactionsPerClient': '5000',
                'delosdb.benchmark.crossEngineConcurrency.payload': '128',
                'delosdb.benchmark.crossEngineConcurrency.fixtureBatch': '100',
                'delosdb.benchmark.crossEngineConcurrency.warmups': '1',
                'delosdb.benchmark.crossEngineConcurrency.iterations': '2',
                'delosdb.benchmark.crossEngineConcurrency.runs': '8',
                'delosdb.benchmark.crossEngineConcurrency.caseTimeoutSeconds': '120',
                'delosdb.benchmark.crossEngineConcurrency.childHeap': '1g'
        ])
    }

    doLast {
        File root = rootProject.layout.buildDirectory.dir(gate10lmFiveEngineRoot).get().asFile
        File resultsFile = new File(root, 'cross-engine-concurrency-results.csv')
        File dispersionFile = new File(root, 'cross-engine-concurrency-dispersion.csv')
        File standardRatiosFile = new File(root, 'cross-engine-concurrency-ratios.csv')
        File scalingFile = new File(root, 'cross-engine-concurrency-scaling.csv')
        [resultsFile, dispersionFile, standardRatiosFile, scalingFile].each { file ->
            if (!file.isFile()) {
                throw new GradleException("Gate 10L-M missing checkpoint report: ${file}")
            }
        }

        def lines = resultsFile.readLines('UTF-8').findAll { !it.trim().isEmpty() }
        if (lines.size() < 2) {
            throw new GradleException('Gate 10L-M merged results contain no measurements')
        }
        def header = (lines[0].split(',', -1) as List).collect {
            it.toString().trim().replace('\uFEFF', '')
        }
        def rows = lines.drop(1).collect { line ->
            def fields = line.split(',', -1)
            if (fields.length != header.size()) {
                throw new GradleException("Gate 10L-M malformed CSV row: ${line}")
            }
            def row = [:]
            header.eachWithIndex { name, index -> row[name] = fields[index].toString().trim() }
            row
        }

        final def targets = ['delos_heap', 'delos_mvcc', 'upstream_derby', 'h2', 'sqlite']
        final def workloads = [
                'PRIMARY_KEY_READ_HOT',
                'PRIMARY_KEY_READ_DISJOINT',
                'PRIMARY_KEY_READ_RANDOM'
        ]
        final def clients = ['1', '2', '4', '8', '16']
        final int expectedRows = targets.size() * workloads.size() * clients.size() * 8
        if (rows.size() != expectedRows) {
            throw new GradleException(
                    "Gate 10L-M expected ${expectedRows} measurements but found ${rows.size()}")
        }

        def median = { List<Double> values ->
            def sorted = values.sort(false)
            int size = sorted.size()
            if ((size & 1) == 1) {
                return sorted[size / 2]
            }
            return (sorted[size / 2 - 1] + sorted[size / 2]) / 2.0d
        }

        def failures = []
        def ratioCsv = new StringBuilder(
                'workload,clients,delosHeapMedianOpsPerSecond,delosMvccMedianOpsPerSecond,' +
                        'upstreamDerbyMedianOpsPerSecond,h2MedianOpsPerSecond,sqliteMedianOpsPerSecond,' +
                        'mvccToHeap,mvccToDerby,mvccToH2,mvccToSqlite,heapToMvcc\n')
        def decision = [
                'Gate 10L-M fresh five-engine read checkpoint',
                'Architecture: accepted Delos heap fast paths + permanent default Delos MVCC current-row architecture.',
                'Matrix: HOT/DISJOINT/RANDOM x 1/2/4/8/16 clients x five engines x eight balanced runs.',
                'Measurement authority: pooled median throughput with existing IQR/MAD dispersion report.',
                'Correctness guards frozen before measurement: complete 600-row matrix, identical cross-engine semantic fingerprints (enforced by the benchmark coordinator), identical operation counts within each cell, and zero retryable conflicts.',
                'Performance is diagnostic in this checkpoint: no post-hoc throughput threshold is introduced. Residual gaps determine the next measured gate.'
        ]

        workloads.each { workload ->
            clients.each { clientCount ->
                def cell = rows.findAll {
                    it.workload == workload && it.clients == clientCount
                }
                if (cell.size() != targets.size() * 8) {
                    failures.add("${workload} ${clientCount}c expected 40 rows, found ${cell.size()}")
                    return
                }

                def operationCounts = cell.collect { Long.parseLong(it.measuredOperations) }.unique()
                if (operationCounts.size() != 1) {
                    failures.add("${workload} ${clientCount}c measured operation counts differ: ${operationCounts}")
                }
                def retryCount = cell.sum { Long.parseLong(it.retryableConflictRetries) } as long
                if (retryCount != 0L) {
                    failures.add("${workload} ${clientCount}c observed ${retryCount} retryable conflicts")
                }

                def medians = [:]
                targets.each { target ->
                    def targetRows = cell.findAll { it.target == target }
                    if (targetRows.size() != 8) {
                        failures.add("${workload} ${clientCount}c ${target} expected 8 runs, found ${targetRows.size()}")
                    } else {
                        medians[target] = median(targetRows.collect {
                            Double.parseDouble(it.operationsPerSecond)
                        })
                    }
                }
                if (medians.size() == targets.size()) {
                    double heap = medians.delos_heap as double
                    double mvcc = medians.delos_mvcc as double
                    double derby = medians.upstream_derby as double
                    double h2 = medians.h2 as double
                    double sqlite = medians.sqlite as double
                    ratioCsv.append(workload).append(',').append(clientCount).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', heap)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', mvcc)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', derby)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', h2)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', sqlite)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', mvcc / heap)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', mvcc / derby)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', mvcc / h2)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', mvcc / sqlite)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', heap / mvcc)).append('\n')

                    def summary = String.format(java.util.Locale.ROOT,
                            '%s %sc: heap=%.0f mvcc=%.0f derby=%.0f h2=%.0f sqlite=%.0f ' +
                                    'mvcc/heap=%.3f mvcc/derby=%.3f mvcc/h2=%.3f mvcc/sqlite=%.3f',
                            workload, clientCount, heap, mvcc, derby, h2, sqlite,
                            mvcc / heap, mvcc / derby, mvcc / h2, mvcc / sqlite)
                    decision.add(summary)
                    logger.lifecycle('Gate 10L-M ' + summary)
                }
            }
        }

        new File(root, 'gate10lm-mvcc-cross-engine-ratios.csv').setText(
                ratioCsv.toString(), 'UTF-8')
        File decisionFile = new File(root, 'gate10lm-five-engine-read-checkpoint-decision.txt')
        if (!failures.isEmpty()) {
            decision.add('')
            decision.add('FAIL: ' + failures.join('; '))
            decisionFile.setText(
                    decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            throw new GradleException(
                    'Gate 10L-M five-engine checkpoint correctness guard failed: ' +
                            failures.join('; '))
        }

        def passLine = 'PASS: the fresh five-engine checkpoint matrix is complete and semantically stable with zero retryable conflicts. Review median/IQR/MAD and cross-engine ratios to decide the next pre-v1 performance gate.'
        decision.add('')
        decision.add(passLine)
        decisionFile.setText(
                decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10L-M ' + passLine)
    }
}

