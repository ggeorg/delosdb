tasks.register('runDelosJdbcGate10iHot8cConfirmation') {
    group = 'benchmark'
    description = 'Confirms the frozen Gate 10I-A HOT 8c >=10% acceptance criterion with longer balanced observations.'
    dependsOn gate10iHot8cConfirmationWorkers
    outputs.upToDateWhen { false }

    doLast {
        def root = rootProject.layout.buildDirectory
                .dir(gate10iHot8cConfirmationRoot)
                .get().asFile

        def loadSingleRow = { File directory, int sequence ->
            def file = new File(directory, "delos_heap-run-${sequence}.csv")
            if (!file.isFile()) {
                throw new GradleException("Missing Gate 10I-A HOT 8c confirmation report: ${file}")
            }
            def lines = file.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            if (lines.size() != 2) {
                throw new GradleException(
                        "Gate 10I-A HOT 8c confirmation expected one row in ${file}, observed ${lines.size() - 1}")
            }
            def header = lines[0].split(',', -1) as List
            def fields = lines[1].split(',', -1)
            def row = [:]
            header.eachWithIndex { name, index -> row[name] = fields[index] }
            row
        }

        def offRows = []
        def onRows = []
        def cycleRows = [:].withDefault { [off: [], on: []] }
        int sequence = 0
        (1..4).each { cycle ->
            [['off-a', false], ['on-a', true], ['on-b', true], ['off-b', false]].each { slot ->
                sequence++
                String slotName = slot[0] as String
                boolean enabled = slot[1] as boolean
                def row = loadSingleRow(new File(root, "cycle-${cycle}/${slotName}"), sequence)
                if (row.workload != 'PRIMARY_KEY_READ_HOT' || row.clients != '8') {
                    throw new GradleException(
                            "Gate 10I-A HOT 8c confirmation unexpected row shape: ${row.workload}:${row.clients}")
                }
                if (enabled) {
                    onRows.add(row)
                    cycleRows[cycle].on.add(row)
                } else {
                    offRows.add(row)
                    cycleRows[cycle].off.add(row)
                }
            }
        }

        if (offRows.size() != 8 || onRows.size() != 8) {
            throw new GradleException(
                    "Gate 10I-A HOT 8c confirmation expected 8 rows/mode, observed off=${offRows.size()} on=${onRows.size()}")
        }

        def allRows = offRows + onRows
        def fingerprints = allRows.collect { it.semanticFingerprint }.toSet()
        long retries = allRows.sum { Long.parseLong(it.retryableConflictRetries) } as long
        if (fingerprints.size() != 1) {
            throw new GradleException(
                    "Gate 10I-A HOT 8c confirmation semantic mismatch: ${fingerprints}")
        }
        if (retries != 0L) {
            throw new GradleException(
                    "Gate 10I-A HOT 8c confirmation observed retryable conflicts: ${retries}")
        }

        def median = { List<Double> values ->
            def sorted = values.sort()
            int n = sorted.size()
            n % 2 == 1 ? sorted[n.intdiv(2)] :
                    (sorted[n.intdiv(2) - 1] + sorted[n.intdiv(2)]) / 2.0d
        }
        def throughputMedian = { rows ->
            median(rows.collect { Double.parseDouble(it.operationsPerSecond) })
        }

        double off = throughputMedian(offRows)
        double on = throughputMedian(onRows)
        double ratio = on / off
        double delta = (ratio - 1.0d) * 100.0d
        def decision = [
                'Gate 10I-A focused HOT 8c confirmation',
                'Four repeated balanced OFF -> ON -> ON -> OFF quartets; eight OFF and eight ON observations.',
                'Each observation: HOT 8c only, 10,000 transactions/client, one warmup, three measured iterations.',
                'Frozen acceptance criterion: pooled ON median must improve >=10% over pooled OFF median.'
        ]

        (1..4).each { cycle ->
            double cycleOff = throughputMedian(cycleRows[cycle].off)
            double cycleOn = throughputMedian(cycleRows[cycle].on)
            double cycleDelta = (cycleOn / cycleOff - 1.0d) * 100.0d
            def cycleLine = String.format(java.util.Locale.ROOT,
                    'cycle %d: OFF=%.2f ON=%.2f delta=%+.2f%%',
                    cycle, cycleOff, cycleOn, cycleDelta)
            decision.add(cycleLine)
            logger.lifecycle('Gate 10I-A HOT 8c ' + cycleLine)
        }

        def pooledLine = String.format(java.util.Locale.ROOT,
                'pooled: OFF=%.2f ON=%.2f ratio=%.4f delta=%+.2f%%',
                off, on, ratio, delta)
        decision.add(pooledLine)
        logger.lifecycle('Gate 10I-A HOT 8c ' + pooledLine)

        def decisionFile = new File(root, 'gate10i-hot8c-confirmation-decision.txt')
        if (ratio < 1.10d) {
            def failLine = String.format(java.util.Locale.ROOT,
                    'FAIL: HOT 8c improved only %.2f%%; Gate 10I-A remains acceptance-pending.', delta)
            decision.add(failLine)
            decisionFile.setText(
                    decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            throw new GradleException(failLine)
        }

        def passLine = 'PASS: HOT 8c reproduces the frozen >=10% gain. Combined with the clean broad paired safety matrix, Gate 10I-A may proceed to repository integrity and formal acceptance.'
        decision.add(passLine)
        decisionFile.setText(
                decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10I-A HOT 8c ' + passLine)
    }
}


