tasks.register('runDelosJdbcGate10lfMvccPostLeafResidualAuthorityProof') {
    group = 'benchmark'
    description = 'Diagnoses the two remaining physical latches after Gate 10L-E removes the MVCC hidden-index hot leaf latch.'
    dependsOn tasks.named('runDelosJdbcGate10lfMvccPostLeafResidualWorker')
    outputs.upToDateWhen { false }

    doLast {
        File root = rootProject.layout.buildDirectory
                .dir(gate10lfMvccPostLeafResidualRoot).get().asFile

        def loadCsv = { File file ->
            if (!file.isFile()) {
                throw new GradleException("Missing Gate 10L-F report: ${file}")
            }
            def lines = file.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            if (lines.size() < 2) {
                throw new GradleException("Gate 10L-F report has no rows: ${file}")
            }
            def header = (lines[0].split(',', -1) as List).collect {
                it.toString().trim().replace('\uFEFF', '')
            }
            lines.drop(1).collect { line ->
                def fields = line.split(',', -1)
                if (fields.length != header.size()) {
                    throw new GradleException("Gate 10L-F malformed CSV row in ${file}: ${line}")
                }
                def row = [:]
                header.eachWithIndex { name, index -> row[name] = fields[index].toString().trim() }
                row
            }
        }

        def parseContainerId = { String pageKey ->
            def matcher = (pageKey =~ /Container\(0;\s*(\d+)\)/)
            matcher.find() ? Long.parseLong(matcher.group(1)) : -1L
        }
        def simpleName = { String name ->
            name.contains('.') ? name.substring(name.lastIndexOf('.') + 1) : name
        }
        def clientsList = ['1', '4', '8', '16']

        def measurements = loadCsv(new File(root, 'delos_mvcc-run-1.csv'))
        def latches = loadCsv(new File(root, 'page-latch-diagnostics-delos_mvcc-run-1.csv'))
        def pages = loadCsv(new File(root, 'page-latch-authority-by-page-delos_mvcc-run-1.csv'))
        def layouts = loadCsv(new File(root, 'mvcc-physical-layout-delos_mvcc-run-1.csv'))
        def entries = loadCsv(new File(root, 'lock-entry-diagnostics-delos_mvcc-run-1.csv'))
        def waits = loadCsv(new File(root, 'logical-lock-wait-diagnostics-delos_mvcc-run-1.csv'))
        def caches = loadCsv(new File(root, 'cache-entry-diagnostics-delos_mvcc-run-1.csv'))

        if (measurements.size() != 4 || latches.size() != 4) {
            throw new GradleException(
                    "Gate 10L-F expected four HOT measurements/latch rows, observed measurements=${measurements.size()} latches=${latches.size()}")
        }

        def decision = [
                'Gate 10L-F MVCC post-leaf residual authority proof',
                'Diagnostic only: Current-Row Anchor and exact-prefix leaf snapshot are both enabled.',
                'Gate 10L-E proved physical activation by reducing HOT latches/read from 4.0 to 2.0, but its frozen total-wait ratio <=0.35 did not pass.',
                'Identify the exact two remaining physical latch authorities before changing routing or version reads.'
        ]

        clientsList.each { clients ->
            def measurement = measurements.find { it.clients == clients }
            def latch = latches.find { it.clients == clients }
            if (measurement == null || latch == null) {
                throw new GradleException("Gate 10L-F missing ${clients}c HOT row")
            }
            if (Long.parseLong(measurement.retryableConflictRetries) != 0L) {
                throw new GradleException(
                        "Gate 10L-F ${clients}c observed retryable conflicts: ${measurement.retryableConflictRetries}")
            }

            long operations = Long.parseLong(measurement.measuredOperations)
            double throughput = Double.parseDouble(measurement.operationsPerSecond)
            long latchRequests = Long.parseLong(latch.latchRequests)
            long latchWaitNanos = Long.parseLong(latch.ownerWaitNanos)
            double latchesPerRead = latchRequests / (double) operations
            double latchWaitPerRead = latchWaitNanos / (double) operations

            def rolesByContainer = layouts.findAll { it.clients == clients }
                    .groupBy { Long.parseLong(it.containerId) }
                    .collectEntries { containerId, values ->
                        [(containerId): values.collect { it.role }.unique().sort().join('+')]
                    }
            def pageRows = pages.findAll { it.clients == clients }
                    .sort { a, b -> Long.parseLong(b.ownerWaitNanos) <=> Long.parseLong(a.ownerWaitNanos) }

            def entryRows = entries.findAll { it.clients == clients }
            def dominantEntry = entryRows.isEmpty() ? null :
                    entryRows.max { Long.parseLong(it.entryMutexWaitNanos) }
            String entryClass = dominantEntry == null ? 'none' : simpleName(dominantEntry.lockableClass)
            double entryWaitPerRead = dominantEntry == null ? 0.0d :
                    Long.parseLong(dominantEntry.entryMutexWaitNanos) / (double) operations

            def waitRows = waits.findAll { it.clients == clients }
            long logicalWaitNanos = waitRows.inject(0L) { total, row ->
                total + Long.parseLong(row.totalWaitNanos)
            }
            double logicalWaitPerRead = logicalWaitNanos / (double) operations

            def cacheRows = caches.findAll { it.clients == clients }
            def dominantCache = cacheRows.isEmpty() ? null :
                    cacheRows.max { Long.parseLong(it.entryMutexWaitNanos) }
            String cacheName = dominantCache == null ? 'none' : dominantCache.cacheName
            double cacheWaitPerRead = dominantCache == null ? 0.0d :
                    Long.parseLong(dominantCache.entryMutexWaitNanos) / (double) operations

            def line = String.format(java.util.Locale.ROOT,
                    '%sc: throughput=%.2f op/s latches/read=%.6f latchWait/read=%.1f ns dominantEntry=%s entryWait/read=%.1f ns logicalWait/read=%.1f ns dominantCache=%s cacheWait/read=%.1f ns',
                    clients, throughput, latchesPerRead, latchWaitPerRead,
                    entryClass, entryWaitPerRead, logicalWaitPerRead, cacheName, cacheWaitPerRead)
            decision.add(line)
            logger.lifecycle('Gate 10L-F ' + line)

            pageRows.take(6).eachWithIndex { page, rank ->
                long containerId = parseContainerId(page.pageKey)
                def role = rolesByContainer.get(containerId, 'unknown')
                def detail = String.format(java.util.Locale.ROOT,
                        '  page#%d %s role=%s requests/read=%.6f contended=%s%% wait/read=%.1f ns maxWait=%s ns',
                        rank + 1, page.pageKey, role,
                        Long.parseLong(page.latchRequests) / (double) operations,
                        page.contendedPercent,
                        Long.parseLong(page.ownerWaitNanos) / (double) operations,
                        page.maxOwnerWaitNanos)
                decision.add(detail)
                logger.lifecycle('Gate 10L-F ' + detail)
            }
        }

        def fingerprints = measurements.collect { it.semanticFingerprint }.toSet()
        // Fingerprints differ by client count because operation counts/seeds are encoded
        // in the benchmark signature; each individual cell has exactly one measured row.
        decision.add('Interpretation rule: the physical page with the largest wait/read at 8c/16c is the next candidate authority. Do not optimize low-share version/cache/lock work if routing still dominates.')
        def passLine = 'PASS: Gate 10L-F captured the residual physical/lock/cache authorities after the immutable MVCC prefix leaf snapshot removed the hot leaf latch. Choose the next experiment from the measured 8c/16c authority.'
        decision.add(passLine)
        new File(root, 'gate10lf-mvcc-post-leaf-residual-authority-decision.txt').setText(
                decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10L-F ' + passLine)
    }
}

