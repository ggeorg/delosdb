def isPortAvailable = { int port ->
    ServerSocket socket = null
    try {
        socket = new ServerSocket(port)
        socket.setReuseAddress(true)
        return true
    } catch (IOException ignored) {
        return false
    } finally {
        if (socket != null) {
            try { socket.close() } catch (IOException ignored) { }
        }
    }
}

def findAvailablePortBlock = {
    int hash = Math.abs(rootProject.projectDir.absolutePath.hashCode())
    int start = 20000 + (hash % 20000)
    int maxPort = 64000

    for (int base = start; base < maxPort - 32; base += 32) {
        boolean blockAvailable = true
        for (int offset = 0; offset < 24; offset++) {
            if (!isPortAvailable(base + offset)) {
                blockAvailable = false
                break
            }
        }
        if (blockAvailable) {
            return base
        }
    }

    for (int base = 20000; base < maxPort - 32; base += 32) {
        boolean blockAvailable = true
        for (int offset = 0; offset < 24; offset++) {
            if (!isPortAvailable(base + offset)) {
                blockAvailable = false
                break
            }
        }
        if (blockAvailable) {
            return base
        }
    }

    throw new GradleException('Could not find an available Derby test port block')
}

def derbyLangBasePort = providers.gradleProperty('delosdb.derby.basePort')
