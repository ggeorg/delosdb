tasks.register('runDelosJdbcCrossEngineConcurrencyComparison', JavaExec) {
    group = 'benchmark'
    description = 'Compares DelosDB heap/MVCC with upstream Derby, H2, and native SQLite through JDBC under concurrent clients.'
    dependsOn tasks.named('compileTestJava'), ':jars'

    mainClass = 'io.github.ggeorg.delosdb.benchmark.jdbc.DelosJdbcCrossEngineConcurrency'
    classpath = rootProject.files(derbyTestsClassDir)
    outputs.upToDateWhen { false }
    outputs.dir(rootProject.layout.buildDirectory.dir(
            'reports/delosdb/benchmarks/cross-engine-concurrency'))

    doFirst {
        def saneValue = providers.gradleProperty('delosdb.sane')
                .getOrElse('true')
                .trim()
                .toLowerCase(java.util.Locale.ROOT)
        if (saneValue != 'false') {
            throw new GradleException(
                    'Cross-engine concurrency comparison requires a release build; ' +
                            'rerun with -Pdelosdb.sane=false')
