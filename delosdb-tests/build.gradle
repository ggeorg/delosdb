tasks.register('runDelosJdbcGate10lkMvccCurrentRowArchitectureLifecycleProof') {
    group = 'verification'
    description = 'Runs Gate 10L-K complete current-row architecture lifecycle and bounded-cache safety proof.'
    dependsOn tasks.named('runDelosMvccCurrentRowArchitectureLifecycleSafetyTest'),
            tasks.named('runDelosMvccCurrentRowArchitectureBoundedCacheTest')
    outputs.upToDateWhen { false }

    doLast {
        def root = rootProject.layout.buildDirectory
                .dir('reports/delosdb/gate10lk-mvcc-current-row-architecture-lifecycle')
                .get().asFile
        project.delete(root)
        root.mkdirs()
        def decision = [
                'Gate 10L-K MVCC current-row architecture lifecycle safety proof',
                'PASS: all focused lifecycle and bounded-cache tests completed.',
                'Permanent path: bounded Current-Row Anchor/current-version image cache=4096 slots; exact-prefix leaf and level-1 branch snapshots are normal shape-gated B-tree behavior.',
                'Bounded collision proof: same permanent architecture with current-row read-cache slots=4.',
