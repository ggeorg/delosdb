plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.testing.Test

version = rootProject.version
group = rootProject.group

/*
 * Derby tests are compiled as one inherited test module. The Java plugin now
 * owns the real test compilation task; the old Derby task name is kept only as
 * a compatibility alias for root/pptesting wiring.
 */

def testSourceRoot = file('src/test/java')

def legacyHarnessQuarantineExcludes = [
        'org/apache/derbyTesting/functionTests/harness/RunSuite.java',
        'org/apache/derbyTesting/functionTests/harness/ibm13.java',
        'org/apache/derbyTesting/functionTests/harness/ibm14.java',
        'org/apache/derbyTesting/functionTests/harness/ibm15.java',
        'org/apache/derbyTesting/functionTests/harness/ibm16.java',
        'org/apache/derbyTesting/functionTests/harness/ibm17.java',
        'org/apache/derbyTesting/functionTests/harness/ibm18.java',
        'org/apache/derbyTesting/functionTests/harness/j9_13.java',
        'org/apache/derbyTesting/functionTests/harness/j9_22.java',
        'org/apache/derbyTesting/functionTests/harness/j9_foundation.java',
        'org/apache/derbyTesting/functionTests/harness/j9_foundation11.java',
        'org/apache/derbyTesting/functionTests/harness/j9dee15.java',
        'org/apache/derbyTesting/functionTests/harness/jdk110.java',
        'org/apache/derbyTesting/functionTests/harness/jdk111.java',
        'org/apache/derbyTesting/functionTests/harness/jdk112.java',
        'org/apache/derbyTesting/functionTests/harness/jdk113.java',
        'org/apache/derbyTesting/functionTests/harness/jdk114.java',
        'org/apache/derbyTesting/functionTests/harness/jdk115.java',
        'org/apache/derbyTesting/functionTests/harness/jdk116.java',
        'org/apache/derbyTesting/functionTests/harness/jdk117.java',
        'org/apache/derbyTesting/functionTests/harness/jdk118.java',
        'org/apache/derbyTesting/functionTests/harness/jdk119.java',
        'org/apache/derbyTesting/functionTests/harness/jdk120.java',
        'org/apache/derbyTesting/functionTests/harness/jdk121.java',
        'org/apache/derbyTesting/functionTests/harness/jdk13.java',
        'org/apache/derbyTesting/functionTests/harness/jdk14.java',
        'org/apache/derbyTesting/functionTests/harness/jdk15.java',
        'org/apache/derbyTesting/functionTests/harness/jdk16.java',
        'org/apache/derbyTesting/functionTests/harness/jdk17.java',
        'org/apache/derbyTesting/functionTests/harness/jdk18.java',
        'org/apache/derbyTesting/functionTests/harness/jdk19.java'
]

def toursDbSourceRoot = rootProject.project(':delosdb-demos').file('src/main/demo/toursdb')
def derbyTestsClassDir = layout.buildDirectory.dir('classes/modules/org.apache.derby.tests')

// Derby's inherited tests compile against the bundled JUnit 3 jar because that
// is what the upstream test sources import. Gradle's Test worker, however,
// requires JUnit 4 on the runtime classpath in modern Gradle releases. Keep
// the two roles separate so the compile-time automatic module remains stable.
def gradleJUnitRuntime = configurations.create('gradleJUnitRuntime') {
    canBeConsumed = false
    canBeResolved = true
    transitive = true
}

def thirdPartyTestModules = rootProject.files(
        'tools/java/junit.jar',
        'tools/java/geronimo-spec-servlet-2.4-rc4.jar',
        'tools/java/json_simple-1.1.jar',
        'tools/java/lucene-analyzers-common.jar',
        'tools/java/lucene-core.jar',
        'tools/java/lucene-queryparser.jar',
        rootProject.configurations.delosdbAsm
)

// Compile and execute inherited Derby tests against the assembled runtime jars.
// The runtime jars are the supported Derby-compatible shape and include the
// generated/copy-only boot resources and patched store implementation classes.
def derbyRuntimeJars = rootProject.files(
        rootProject.layout.buildDirectory.file('libs/delosdb-spi.jar'),
        rootProject.layout.buildDirectory.file('libs/osgi-framework-stub.jar'),
        rootProject.layout.buildDirectory.file('libs/derbyshared.jar'),
        rootProject.layout.buildDirectory.file('libs/delosdb-runtime-api.jar'),
        rootProject.layout.buildDirectory.file('libs/delosdb-storage-io.jar'),
        rootProject.layout.buildDirectory.file('libs/derby.jar'),
        rootProject.layout.buildDirectory.file('libs/derbyclient.jar'),
        rootProject.layout.buildDirectory.file('libs/derbytools.jar'),
        rootProject.layout.buildDirectory.file('libs/derbynet.jar'),
        rootProject.layout.buildDirectory.file('libs/derbyoptionaltools.jar'),
        rootProject.layout.buildDirectory.file('libs/derbyrun.jar')
)

def testModulePath = {
    rootProject.files(derbyRuntimeJars, thirdPartyTestModules)
}

def testRuntimeClasspath = {
    rootProject.files(
            derbyTestsClassDir,
            derbyRuntimeJars,
            testSourceRoot,
            toursDbSourceRoot,
            thirdPartyTestModules,
            gradleJUnitRuntime
    )
}

// A small set of inherited Derby unit tests imports store implementation
// classes directly. Keep that access local to the test module compile instead
// of re-exporting implementation packages from delosdb-engine.
def inheritedStoreImplementationExports = [
        'org.apache.derby.impl.store.access.btree',
        'org.apache.derby.impl.store.access.btree.index',
        'org.apache.derby.impl.store.access.conglomerate',
        'org.apache.derby.impl.store.access.heap',
        'org.apache.derby.impl.store.raw.data',
        'org.apache.derby.impl.store.raw.log'
].collectMany { packageName ->
    ['--add-exports', "org.apache.derby.engine/${packageName}=org.apache.derby.tests"]
}

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

configurations {
    derbyTestsClasses {
        canBeConsumed = true
        canBeResolved = false
    }
}

dependencies {
    add('gradleJUnitRuntime', 'junit:junit:4.13.2')

    testImplementation project(':delosdb-client')
    testImplementation project(':delosdb-commons')
    testImplementation project(':delosdb-derby-store-api')
    testImplementation project(':delosdb-engine')
    testImplementation project(':delosdb-runtime-api')
    testImplementation project(':delosdb-storage-api')
    testImplementation project(':delosdb-optionaltools')
    testImplementation project(':delosdb-runner')
    testImplementation project(':delosdb-server')
    testImplementation project(':delosdb-spi')
    testImplementation project(':delosdb-storage-io')
    testImplementation project(':delosdb-storage-derby')
    testImplementation project(':delosdb-tools')

    testCompileOnly rootProject.files('tools/java/junit.jar')
    testCompileOnly rootProject.files('tools/java/geronimo-spec-servlet-2.4-rc4.jar')
    testCompileOnly rootProject.files('tools/java/json_simple-1.1.jar')
    testCompileOnly rootProject.files('tools/java/lucene-analyzers-common.jar')
    testCompileOnly rootProject.files('tools/java/lucene-core.jar')
    testCompileOnly rootProject.files('tools/java/lucene-queryparser.jar')
    testCompileOnly "org.ow2.asm:asm:${rootProject.ext.asmVersion}"
}

sourceSets {
    main {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
    test {
        java {
            setSrcDirs([testSourceRoot, toursDbSourceRoot])
            include '**/*.java'
            exclude legacyHarnessQuarantineExcludes
            destinationDirectory.set(derbyTestsClassDir)
        }
        resources.setSrcDirs([])
    }
}

artifacts {
    derbyTestsClasses(derbyTestsClassDir) {
        builtBy tasks.named('compileTestJava')
    }
}

tasks.named('compileTestJava', JavaCompile) {
    dependsOn ':jars'
    destinationDirectory.set(derbyTestsClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    classpath = files()
    modularity.inferModulePath = false

    doFirst {
        options.compilerArgs = [
                '--module-path', testModulePath().asPath,
                '-proc:none'
        ] + inheritedStoreImplementationExports
    }
}

// The inherited Derby test suite is exposed through named Test tasks below.
// Disable Gradle's default catch-all test task so build/check stay focused on
// the selected compatibility gates.
tasks.named('test', Test) {
    enabled = false
}

// Compatibility alias used by pptesting and root verification wiring.
tasks.register('compileDerbyTestsModule') {
    group = 'verification'
    description = 'Compatibility alias for compileTestJava.'
    dependsOn tasks.named('compileTestJava')
}

tasks.register('runDerbyLangSuite', Test) {
    group = 'verification'
    description = 'Runs the original Derby lang JUnit suite through Gradle using the default bytecode backend.'
    dependsOn tasks.named('compileTestJava'), ':jars'

    modularity.inferModulePath = false
    testClassesDirs = files(derbyTestsClassDir)
    classpath = testRuntimeClasspath()
    useJUnit()
    include 'org/apache/derbyTesting/functionTests/tests/lang/_Suite.class'

    workingDir = layout.buildDirectory.dir('test-work/runDerbyLangSuite').get().asFile
    maxHeapSize = '1536m'
    binaryResultsDirectory.set(layout.buildDirectory.dir('test-results/binary/runDerbyLangSuite'))
    reports {
        junitXml.required.set(true)
        junitXml.outputLocation.set(layout.buildDirectory.dir('test-results/runDerbyLangSuite'))
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.dir('reports/tests/runDerbyLangSuite'))
    }

    doFirst {
        delete workingDir
        workingDir.mkdirs()
    }

    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

