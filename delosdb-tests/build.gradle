            if (attemptsPerOperation < 0.98d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10G %sc fast path was not attempted for the real HOT workload: %.6f/op',
                        clients, attemptsPerOperation))
            }
            if (hitRatio < 0.99d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10G %sc fast-path hit ratio too low: %.6f', clients, hitRatio))
            }
            if (fallbackRatio > 0.01d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10G %sc fallback ratio too high: %.6f', clients, fallbackRatio))
            }
            if (leafFetchesPerOperation > 0.02d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10G %sc still fetches the physical B-tree leaf: %.6f/op',
                        clients, leafFetchesPerOperation))
            }
            if (latchesPerOperation < 0.80d || latchesPerOperation > 1.20d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10G %sc did not reduce physical page latches to ~1/read: %.6f',
                        clients, latchesPerOperation))
            }

            long hotLeafContended = pages.findAll {
                it.clients == clients && it.pageKey.startsWith('Page(2;Container(')
            }.sum { Long.parseLong(it.contendedLatchRequests) } ?: 0L
            double hotLeafContentionPerOperation = hotLeafContended / (double) operations
            if (hotLeafContentionPerOperation > 0.01d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10G %sc page-2 contention remains material: %.6f/op',
                        clients, hotLeafContentionPerOperation))
            }

            def line = String.format(java.util.Locale.ROOT,
                    '%sc: attempts/op=%.6f hitRatio=%.6f leafFetches/op=%.6f latches/op=%.6f page2Contention/op=%.6f',
                    clients, attemptsPerOperation, hitRatio,
                    leafFetchesPerOperation, latchesPerOperation,
                    hotLeafContentionPerOperation)
            decision.add(line)
            logger.lifecycle('Gate 10G ' + line)
        }
        def passLine = 'PASS: default held HOT singleton reads use the immutable leaf fast path; physical B-tree leaf latching is removed.'
        decision.add(passLine)
        new File(reportDir, 'gate10g-decision.txt').setText(
                decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10G ' + passLine)
    }
}

// Gate 10H proof-only tranche. Gate 10G removed the B-tree leaf latch; this
// gate proves whether the remaining HOT serializer is the base heap page,
// separates physical page blocking from logical lock waits, and records the
// actual SQLite/Xerial runtime plus a default-private vs shared-cache control.
def configureGate10hHotWorker = { JavaExec task, String reportName, String target, boolean sharedCache ->
    task.group = 'benchmark'
    task.dependsOn tasks.named('compileTestJava'), tasks.named('compileRawStoreInternalTestSupport'), ':jars'
    task.mainClass = 'io.github.ggeorg.delosdb.benchmark.jdbc.DelosJdbcCrossEngineConcurrency'
    task.classpath = rootProject.files(
            derbyTestsClassDir,
            rawStoreInternalTestSupportClassDir,
            derbyRuntimeJars,
            sqliteBenchmarkRuntime)
    task.args 'worker'
    task.outputs.upToDateWhen { false }
    task.outputs.dir(rootProject.layout.buildDirectory.dir(
            "reports/delosdb/benchmarks/gate10h-residual-hot-authority/${reportName}"))

    task.doFirst {
        def saneValue = providers.gradleProperty('delosdb.sane')
                .getOrElse('true')
                .trim()
                .toLowerCase(java.util.Locale.ROOT)
        if (saneValue != 'false') {
            throw new GradleException(
                    'Gate 10H residual HOT authority proof requires a release build; ' +
                            'rerun with -Pdelosdb.sane=false')
        }
        def reportDir = rootProject.layout.buildDirectory
                .dir("reports/delosdb/benchmarks/gate10h-residual-hot-authority/${reportName}")
                .get().asFile
        def databaseRoot = rootProject.layout.buildDirectory
                .dir("tmp/delos-jdbc-gate10h-${reportName}").get().asFile
        project.delete(reportDir)
        project.delete(databaseRoot)
        reportDir.mkdirs()
        databaseRoot.mkdirs()

        def properties = [
                'delosdb.benchmark.crossEngineConcurrency.sane': saneValue,
                'delosdb.benchmark.crossEngineConcurrency.target': target,
                'delosdb.benchmark.crossEngineConcurrency.targets': target,
                'delosdb.benchmark.crossEngineConcurrency.run': '1',
                'delosdb.benchmark.crossEngineConcurrency.projectDirectory': rootProject.projectDir.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.javaExecutable':
                        new File(System.getProperty('java.home'), 'bin/java').absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.benchmarkClasses':
                        derbyTestsClassDir.get().asFile.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.delosClasspath':
                        rootProject.files(derbyRuntimeJars).asPath,
                'delosdb.benchmark.crossEngineConcurrency.sqliteClasspath': sqliteBenchmarkRuntime.asPath,
                'delosdb.benchmark.crossEngineConcurrency.databaseRoot': databaseRoot.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.reportDirectory': reportDir.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.rows': providers.gradleProperty(
                        'delosdb.benchmark.gate10h.rows').getOrElse('10000'),
                'delosdb.benchmark.crossEngineConcurrency.clients': '4,8',
                'delosdb.benchmark.crossEngineConcurrency.widths': '1',
                'delosdb.benchmark.crossEngineConcurrency.workloads': 'PRIMARY_KEY_READ_HOT',
                'delosdb.benchmark.crossEngineConcurrency.transactionsPerClient':
                        providers.gradleProperty('delosdb.benchmark.gate10h.operationBudgetPerClient')
                                .getOrElse('500000'),
                'delosdb.benchmark.crossEngineConcurrency.payload': '128',
                'delosdb.benchmark.crossEngineConcurrency.fixtureBatch': '100',
                'delosdb.benchmark.crossEngineConcurrency.warmups': '1',
                'delosdb.benchmark.crossEngineConcurrency.iterations': '2',
                'delosdb.benchmark.crossEngineConcurrency.runs': '1',
                'delosdb.benchmark.crossEngineConcurrency.caseTimeoutSeconds': '300',
                'delosdb.benchmark.crossEngineConcurrency.childHeap': '1g',
                'delosdb.benchmark.crossEngineConcurrency.sqliteSharedCache': Boolean.toString(sharedCache)
        ]
        if (target == 'delos_heap') {
            properties.putAll([
                    'delosdb.diagnostic.pageLatch': 'true',
                    'delosdb.diagnostic.lockWait': 'true',
                    'delosdb.diagnostic.btreePointReadPath': 'true',
                    'delosdb.benchmark.crossEngineConcurrency.pageLatchDiagnostics': 'true',
                    'delosdb.benchmark.crossEngineConcurrency.heapAuthorityDiagnostics': 'true',
                    'delosdb.benchmark.crossEngineConcurrency.lockWaitDiagnostics': 'true',
                    'delosdb.benchmark.crossEngineConcurrency.btreePointReadPathDiagnostics': 'true'
            ])
        }
        task.systemProperties(properties)
    }
}

