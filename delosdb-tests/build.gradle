tasks.register('runDelosJdbcGate10lnMvccResidualReadGapDiagnosis') {
    group = 'benchmark'
    description = 'Diagnoses remaining permanent-MVCC RANDOM cache-capacity and resident HOT/DISJOINT CPU authorities.'
    dependsOn 'runDelosJdbcGate10lnRandomSlots4096',
            'runDelosJdbcGate10lnRandomSlots16384',
            'runDelosJdbcGate10lnRandomSlots65536',
            'runDelosJdbcGate10lnResidentProfile'
    outputs.upToDateWhen { false }

    doLast {
        File root = rootProject.layout.buildDirectory.dir(gate10lnRoot).get().asFile
        def median = { List<Double> values ->
            def sorted = values.sort(false)
            int n = sorted.size()
            return (n & 1) == 1 ? sorted[n / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2.0d
        }
        def failures = []
        def cacheRows = []
        [4096, 16384, 65536].each { slots ->
            File results = new File(root, "random-slots-${slots}/cross-engine-concurrency-results.csv")
            if (!results.isFile()) {
                failures.add("missing RANDOM slot-sweep results for ${slots}")
                return
            }
            def lines = results.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            def header = lines[0].split(',', -1) as List
            def rows = lines.drop(1).collect { line ->
                def fields = line.split(',', -1)
                def row = [:]
                header.eachWithIndex { name, index -> row[name.trim()] = fields[index].trim() }
                row
            }
            ['1', '8', '16'].each { clients ->
                def cell = rows.findAll { it.target == 'delos_mvcc' && it.clients == clients }
                if (cell.size() != 6) {
                    failures.add("RANDOM slots=${slots} ${clients}c expected 6 runs, found ${cell.size()}")
                    return
                }
                long retries = cell.sum { Long.parseLong(it.retryableConflictRetries) } as long
                if (retries != 0L) failures.add("RANDOM slots=${slots} ${clients}c retries=${retries}")
                if (cell.collect { it.semanticFingerprint }.unique().size() != 1) {
                    failures.add("RANDOM slots=${slots} ${clients}c semantic fingerprints differ")
                }
                cacheRows.add([slots: slots, clients: clients,
                        median: median(cell.collect { Double.parseDouble(it.operationsPerSecond) })])
            }
        }

        def by = { int slots, String clients ->
            cacheRows.find { it.slots == slots && it.clients == clients }?.median as Double
        }
        def decision = [
                'Gate 10L-N permanent-MVCC residual read-gap diagnosis',
                'Part A: RANDOM cache-slot sensitivity at 4096 / 16384 / 65536 slots.',
                'Part B: JFR profile for fully resident 16c HOT/DISJOINT at 65536 slots.',
                'This is a diagnosis gate: production architecture is not changed and no throughput acceptance threshold is introduced.',
                'Correctness guards frozen before measurement: six RANDOM observations per slot/client cell, identical semantics within each cell, zero retries, and a readable JFR recording.'
        ]
        ['1', '8', '16'].each { clients ->
            double base = by(4096, clients)
            double s16 = by(16384, clients)
            double s64 = by(65536, clients)
            double d16 = (s16 / base - 1.0d) * 100.0d
            double d64 = (s64 / base - 1.0d) * 100.0d
            decision.add(String.format(java.util.Locale.ROOT,
                    'RANDOM %sc: 4096=%.0f 16384=%.0f (%+.2f%%) 65536=%.0f (%+.2f%%)',
                    clients, base, s16, d16, s64, d64))
        }
        boolean capacityMaterial = ['8', '16'].any { clients ->
            double base = by(4096, clients)
            Math.max(by(16384, clients), by(65536, clients)) / base >= 1.20d
        }
        decision.add('RANDOM capacity hypothesis: ' +
                (capacityMaterial ? 'MATERIAL-CONTRIBUTOR (>=20% gain at 8c or 16c)' :
                        'NOT-MATERIAL by the predeclared >=20% diagnostic criterion'))

        File profileDir = new File(root, 'resident-profile/profiles')
        def recordings = profileDir.isDirectory()
                ? profileDir.listFiles().findAll { it.name.endsWith('.jfr') }
                : []
        if (recordings.size() != 1) {
            failures.add("expected exactly one resident-profile JFR recording, found ${recordings.size()}")
        } else {
            File jfr = recordings[0]
            File jfrTool = new File(System.getProperty('java.home'), 'bin/jfr')
            ['hot-methods', 'allocation-by-site', 'contention-by-site'].each { view ->
                def execOutput = providers.exec {
                    commandLine jfrTool.absolutePath, 'view', '--width', '220',
                            '--cell-height', '30', view, jfr.absolutePath
                    ignoreExitValue = true
                }
                def result = execOutput.result.get()
                def output = execOutput.standardOutput.asText.get()
                def error = execOutput.standardError.asText.get()
                if (result.exitValue != 0) {
                    failures.add("jfr view ${view} failed: ${error.trim()}")
                } else {
                    new File(root, "resident-profile/${view}.txt")
                            .setText(output, 'UTF-8')
                }
            }
            decision.add("Resident JFR recording: ${jfr.name} (${jfr.length()} bytes)")
        }

        File decisionFile = new File(root, 'gate10ln-mvcc-residual-read-gap-decision.txt')
        if (!failures.isEmpty()) {
            decision.add('')
            decision.add('FAIL: ' + failures.join('; '))
            decisionFile.setText(decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            throw new GradleException('Gate 10L-N diagnostic evidence incomplete: ' + failures.join('; '))
        }
        decision.add('')
        decision.add('PASS: diagnostic evidence complete. Use the slot sensitivity plus JFR hot/allocation/contention views to choose the next focused optimization gate; do not change production defaults from this diagnosis alone.')
        decisionFile.setText(decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10L-N diagnostic evidence complete: ' + decisionFile)
    }
}

