def clientModuleClassDir = rootProject.project(':delosdb-client').layout.buildDirectory.dir('classes/modules/org.apache.derby.client')
def serverModuleClassDir = rootProject.project(':delosdb-server').layout.buildDirectory.dir('classes/modules/org.apache.derby.server')
def toolsModuleClassDir = rootProject.project(':delosdb-tools').layout.buildDirectory.dir('classes/modules/org.apache.derby.tools')
def optionalToolsModuleClassDir = rootProject.project(':delosdb-optionaltools').layout.buildDirectory.dir('classes/modules/org.apache.derby.optionaltools')
def runnerModuleClassDir = rootProject.project(':delosdb-runner').layout.buildDirectory.dir('classes/modules/org.apache.derby.runner')

tasks.register('compileDerbyTestSupport', JavaCompile) {
    dependsOn 'verifyDerbyTestsAssets',
            ':delosdb-commons:compileDerbyCommons',
            ':delosdb-client:compileDerbyClient',
            ':delosdb-server:compileDerbyServer',
            ':delosdb-tools:compileDerbyTools',
            ':delosdb-optionaltools:compileDerbyOptionalTools',
            ':delosdb-runner:compileDerbyRunner',
            ':delosdb-engine:compileDerbyEngine',
            ':delosdb-engine:compileClassSizeCatalog',
            ':splitEngineMessages'
    source = files(
            fileTree(new File(testSourceRoot, 'org/apache/derbyTesting/junit')) { include '**/*.java' },
            fileTree(new File(testSourceRoot, 'org/apache/derbyTesting/functionTests/util/streams')) { include '**/*.java' },
            new File(testSourceRoot, 'org/apache/derbyTesting/functionTests/harness/JavaVersionHolder.java'),
            new File(testSourceRoot, 'org/apache/derbyTesting/functionTests/util/PrivilegedFileOpsForTests.java'),
            new File(testSourceRoot, 'org/apache/derbyTesting/functionTests/util/SQLStateConstants.java'),
            new File(testSourceRoot, 'org/apache/derbyTesting/functionTests/util/TestNullOutputStream.java'),
            new File(testSourceRoot, 'org/apache/derbyTesting/functionTests/util/Barrier.java'),
            new File(testSourceRoot, 'org/apache/derbyTesting/functionTests/util/JarUtil.java'),
            new File(testSourceRoot, 'org/apache/derbyTesting/functionTests/util/CanonTestCase.java'),
            new File(testSourceRoot, 'org/apache/derbyTesting/functionTests/util/ScriptTestCase.java')
    )
    destinationDirectory = testSupportClassDir
    sourceCompatibility = rootProject.ext.javaRelease.toString()
    targetCompatibility = rootProject.ext.javaRelease.toString()
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    classpath = rootProject.files(
            commonsModuleClassDir,
            engineModuleClassDir,
            clientModuleClassDir,
            serverModuleClassDir,
            toolsModuleClassDir,
            optionalToolsModuleClassDir,
            runnerModuleClassDir,
            junitClasspath,
            externalTestClasspath
    )
}

