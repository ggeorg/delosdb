tasks.register('runDelosJdbcGate10loMvccSnapshotLeaseRegistryProof') {
    group = 'verification'
    description = 'Runs Gate 10L-O source/runtime/removability proof for the residual MVCC snapshot-lease publication-lock authority.'
    dependsOn tasks.named('runDelosMvccSnapshotLeaseRegistrySafetyTest')
    dependsOn tasks.named('runDelosMvccSnapshotLeaseRegistryFallbackTest')
    dependsOn tasks.named('runDelosJdbcGate10loSnapshotLeaseRegistryOffProfile')
    dependsOn tasks.named('runDelosJdbcGate10loSnapshotLeaseRegistryOnProfile')
    outputs.upToDateWhen { false }

    doLast {
        File root = rootProject.layout.buildDirectory.dir(gate10loRoot).get().asFile
        def loadRows = { String suffix ->
            File csv = new File(root, "${suffix}/cross-engine-concurrency-results.csv")
            if (!csv.isFile()) {
                throw new GradleException("Missing Gate 10L-O result: ${csv}")
            }
            def lines = csv.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            def header = (lines[0].split(',', -1) as List).collect { it.trim() }
            lines.drop(1).collect { line ->
                def fields = line.split(',', -1)
                def row = [:]
                header.eachWithIndex { name, index -> row[name] = fields[index].trim() }
                row
            }
        }
        def rowsOff = loadRows('off')
        def rowsOn = loadRows('on')
        def byWorkload = { rows, workload ->
            def matches = rows.findAll { it.workload == workload && it.clients == '16' }
            if (matches.size() != 1) {
                throw new GradleException(
                        "Gate 10L-O expected exactly one ${workload} 16c row, found ${matches.size()}")
            }
            matches[0]
        }

        def failures = []
        def decision = [
                'Gate 10L-O residual MVCC snapshot-lease authority proof',
                'Source authority from Gate 10L-N JFR: READ COMMITTED scan open/close parks on MvccRawStoreRuntime.commitPublicationLock.',
                'Experimental ON path: bounded atomic snapshot-lease slots; slot exhaustion conservatively falls back to the locked legacy lease map.',
                'Frozen mechanism criteria: OFF open/close lease parks >=100; ON open/close lease parks =0; identical fingerprints/operation counts; zero retries; focused history/vacuum/lifecycle/isolation suites green.',
                'Throughput is diagnostic in 10L-O; balanced performance acceptance remains separate.'
        ]

        ['PRIMARY_KEY_READ_HOT', 'PRIMARY_KEY_READ_DISJOINT'].each { workload ->
            def off = byWorkload(rowsOff, workload)
            def on = byWorkload(rowsOn, workload)
            if (off.semanticFingerprint != on.semanticFingerprint) {
                failures.add("${workload} semantic fingerprint changed")
            }
            if (off.measuredOperations != on.measuredOperations) {
                failures.add("${workload} measured operation count changed")
            }
            if (off.retryableConflictRetries != '0' || on.retryableConflictRetries != '0') {
                failures.add("${workload} retryable conflicts were non-zero")
            }
            double offOps = off.operationsPerSecond as double
            double onOps = on.operationsPerSecond as double
            decision.add(String.format(java.util.Locale.ROOT,
                    '%s 16c: OFF=%.0f ON=%.0f delta=%+.2f%%',
                    workload, offOps, onOps, (onOps / offOps - 1.0d) * 100.0d))
        }

        File jfrTool = new File(System.getProperty('java.home'), 'bin/jfr')
        def parkCount = { String suffix ->
            File profileDir = new File(root, "${suffix}/profiles")
            def recordings = profileDir.isDirectory()
                    ? profileDir.listFiles().findAll { it.name.endsWith('.jfr') }
                    : []
            if (recordings.size() != 1) {
                failures.add("${suffix}: expected exactly one JFR recording, found ${recordings.size()}")
                return [open: -1, close: -1, total: -1]
            }
            def execOutput = providers.exec {
                commandLine jfrTool.absolutePath, 'print', '--events', 'jdk.ThreadPark',
                        '--stack-depth', '32', recordings[0].absolutePath
                ignoreExitValue = true
            }
            def result = execOutput.result.get()
            String output = execOutput.standardOutput.asText.get()
            String error = execOutput.standardError.asText.get()
            if (result.exitValue != 0) {
                failures.add("${suffix}: jfr ThreadPark print failed: ${error.trim()}")
                return [open: -1, close: -1, total: -1]
            }
            def events = output.split(/(?=jdk\.ThreadPark \{)/).findAll {
                it.startsWith('jdk.ThreadPark {')
            }
            int open = events.count { event ->
                event.contains('MvccRawStoreRuntime.openSnapshotLease()')
                        || event.contains('MvccRawStoreRuntime.openLockedSnapshotLease()')
            }
            int close = events.count { event ->
                event.contains('MvccRawStoreRuntime.closeSnapshotLease(')
            }
            int total = events.size()
            new File(root, "${suffix}/thread-parks.txt").setText(output, 'UTF-8')
            new File(root, "${suffix}/thread-park-summary.txt").setText(
                    "total=${total}\nleaseOpen=${open}\nleaseClose=${close}\n",
                    'UTF-8')
            return [open: open, close: close, total: total]
        }

        def offParks = parkCount('off')
        def onParks = parkCount('on')
        int offLeaseParks = offParks.open + offParks.close
        int onLeaseParks = onParks.open + onParks.close
        decision.add("OFF lease parks: open=${offParks.open} close=${offParks.close} total=${offLeaseParks}")
        decision.add("ON lease parks: open=${onParks.open} close=${onParks.close} total=${onLeaseParks}")
        if (offLeaseParks < 100) {
            failures.add("OFF snapshot-lease parks ${offLeaseParks} < frozen authority floor 100")
        }
        if (onLeaseParks != 0) {
            failures.add("ON snapshot-lease parks ${onLeaseParks} != 0")
        }

        File decisionFile = new File(root, 'gate10lo-mvcc-snapshot-lease-registry-decision.txt')
        if (!failures.isEmpty()) {
            decision.add('')
            decision.add('FAIL: ' + failures.join('; '))
            decisionFile.setText(decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            throw new GradleException('Gate 10L-O failed: ' + failures.join('; '))
        }
        decision.add('')
        decision.add('PASS: the bounded atomic lease registry removes the measured READ COMMITTED open/close snapshot-lease park authority while preserving snapshot/vacuum semantics. Proceed to balanced performance acceptance before making it permanent.')
        decisionFile.setText(decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10L-O PASS: residual snapshot-lease publication-lock authority removed in the experimental path.')
    }
}

