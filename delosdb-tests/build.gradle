// Gate 10I-A paired acceptance proof. Compare the exact current Delos heap with
// the immutable heap-page image disabled versus enabled using a balanced
// OFF -> ON -> ON -> OFF phase order. Each observation is a direct single-
// target worker run because the shared coordinator intentionally accepts only
