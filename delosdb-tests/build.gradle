tasks.register('runDelosJdbcGate10iPairedImageAcceptanceProof') {
    group = 'benchmark'
    description = 'Runs balanced image OFF/ON acceptance proof for HOT, DISJOINT and RANDOM exact PK reads.'
    dependsOn gate10iPairedExecutionOrder
    outputs.upToDateWhen { false }

    doLast {
        def root = rootProject.layout.buildDirectory
                .dir('reports/delosdb/benchmarks/gate10i-paired-image-acceptance')
                .get().asFile

        def loadCsv = { File file ->
            if (!file.isFile()) {
                throw new GradleException("Missing Gate 10I-A paired report: ${file}")
            }
            def lines = file.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            if (lines.size() < 2) {
                throw new GradleException("Gate 10I-A paired report has no rows: ${file}")
            }
            def header = lines[0].split(',', -1) as List
            lines.drop(1).collect { line ->
                def fields = line.split(',', -1)
                def row = [:]
                header.eachWithIndex { name, index -> row[name] = fields[index] }
                row
            }
        }

        def loadPhase = { String phase ->
            def rows = []
            (1..3).each { run ->
                rows.addAll(loadCsv(new File(
                        root, "${phase}/run-${run}/delos_heap-run-${run}.csv")))
            }
            rows
        }

        def offRows = []
        def onRows = []
        ['off-a', 'off-b'].each { phase -> offRows.addAll(loadPhase(phase)) }
        ['on-a', 'on-b'].each { phase -> onRows.addAll(loadPhase(phase)) }

        if (offRows.size() != 90 || onRows.size() != 90) {
            throw new GradleException(
                    "Gate 10I-A paired proof expected 90 rows/mode, observed off=${offRows.size()} on=${onRows.size()}.")
        }

        def validateSemantics = { String mode, rows ->
            def groups = rows.groupBy { it.workload + ':' + it.clients }
            groups.each { key, values ->
                def fingerprints = values.collect { it.semanticFingerprint }.toSet()
                long retries = values.sum { Long.parseLong(it.retryableConflictRetries) } as long
                if (fingerprints.size() != 1) {
                    throw new GradleException(
                            "Gate 10I-A paired ${mode} semantic mismatch for ${key}: ${fingerprints}")
                }
                if (retries != 0L) {
                    throw new GradleException(
                            "Gate 10I-A paired ${mode} observed retryable conflicts for ${key}: ${retries}")
                }
            }
        }
        validateSemantics('OFF', offRows)
        validateSemantics('ON', onRows)

        def median = { List<Double> values ->
            def sorted = values.sort()
            int n = sorted.size()
            n == 0 ? Double.NaN :
                    (n % 2 == 1 ? sorted[n.intdiv(2)] :
                            (sorted[n.intdiv(2) - 1] + sorted[n.intdiv(2)]) / 2.0d)
        }

        def modeMedian = { rows, String workload, String clients ->
            def values = rows.findAll {
                it.workload == workload && it.clients == clients
            }.collect { Double.parseDouble(it.operationsPerSecond) }
            if (values.size() != 6) {
                throw new GradleException(
                        "Gate 10I-A paired expected six observations for ${workload}:${clients}, observed ${values.size()}.")
            }
            median(values)
        }

        def decision = [
                'Gate 10I-A paired immutable heap-page image acceptance proof',
                'Balanced execution order: OFF-A -> ON-A -> ON-B -> OFF-B; three direct Delos-heap worker runs per phase; six observations per mode/cell.',
                'Acceptance: HOT 4c/8c/16c must improve >=10%; no workload/client >=2c may regress >10%; 1c guard is -15% because the established harness has high 1c JVM variance.'
        ]

        def failures = []
        ['PRIMARY_KEY_READ_HOT',
         'PRIMARY_KEY_READ_DISJOINT',
         'PRIMARY_KEY_READ_RANDOM'].each { workload ->
            ['1', '2', '4', '8', '16'].each { clients ->
                double off = modeMedian(offRows, workload, clients)
                double on = modeMedian(onRows, workload, clients)
                double ratio = on / off
                double delta = (ratio - 1.0d) * 100.0d
                def line = String.format(java.util.Locale.ROOT,
                        '%s %sc: OFF=%.2f ON=%.2f ratio=%.4f delta=%+.2f%%',
                        workload, clients, off, on, ratio, delta)
                decision.add(line)
                logger.lifecycle('Gate 10I-A paired ' + line)

                double regressionFloor = clients == '1' ? 0.85d : 0.90d
                if (ratio < regressionFloor) {
                    failures.add(String.format(java.util.Locale.ROOT,
                            '%s %sc regressed %.2f%%',
                            workload, clients, (1.0d - ratio) * 100.0d))
                }
                if (workload == 'PRIMARY_KEY_READ_HOT'
                        && ['4', '8', '16'].contains(clients)
                        && ratio < 1.10d) {
                    failures.add(String.format(java.util.Locale.ROOT,
                            'HOT %sc improved only %.2f%%',
                            clients, delta))
                }
            }
        }

        if (!failures.isEmpty()) {
            decision.add('FAIL: ' + failures.join('; '))
            new File(root, 'gate10i-paired-decision.txt').setText(
                    decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            throw new GradleException(
                    'Gate 10I-A paired acceptance failed: ' + failures.join('; '))
        }

        def passLine = 'PASS: the shared immutable heap-page image reproduces the HOT gain on the same current tree without a material broad-read regression. Gate 10I-A may be accepted; only then profile the remaining post-latch HOT authority.'
        decision.add(passLine)
        new File(root, 'gate10i-paired-decision.txt').setText(
                decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10I-A paired ' + passLine)
    }
}


