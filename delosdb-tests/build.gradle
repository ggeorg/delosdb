def delosV1GitOutput = { List<String> command ->
    try {
        def process = new ProcessBuilder(command)
                .directory(rootProject.projectDir)
                .redirectErrorStream(true)
                .start()
        def text = process.inputStream.getText('UTF-8').trim()
        return process.waitFor() == 0 ? text : ''
    } catch (IOException ignored) {
        return ''
    }
}



def delosV1VerifyBundleChecksums = { File bundleRoot, String label ->
    File checksumsFile = new File(bundleRoot, 'checksums.sha256')
    if (!checksumsFile.isFile()) {
        throw new GradleException("${label} is missing checksums.sha256: ${bundleRoot}")
    }
    def listed = [] as Set
    def failures = []
    checksumsFile.readLines('UTF-8').eachWithIndex { String line, int index ->
        def matcher = java.util.regex.Pattern.compile('^([0-9a-f]{64})  (.+)$').matcher(line)
        if (!matcher.matches()) {
            failures << "Malformed checksum row ${index + 1}: ${line}"
            return
        }
        String expected = matcher.group(1)
        String relative = matcher.group(2)
        if (relative.startsWith('/') || relative.contains('..')) {
            failures << "Unsafe checksum path: ${relative}"
            return
        }
        if (!listed.add(relative)) {
            failures << "Duplicate checksum path: ${relative}"
            return
        }
        File evidence = new File(bundleRoot, relative)
        if (!evidence.isFile()) {
            failures << "Missing checksummed file: ${relative}"
        } else {
            String actual = delosV1Sha256(evidence)
            if (actual != expected) {
                failures << "Checksum mismatch for ${relative}: expected ${expected}, found ${actual}"
            }
        }
    }
    def actual = [] as Set
    bundleRoot.eachFileRecurse { file ->
        if (file.isFile()) {
            String relative = bundleRoot.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            if (relative != 'checksums.sha256') {
                actual.add(relative)
            }
        }
    }
    def missingRows = actual - listed
    def staleRows = listed - actual
    if (!missingRows.isEmpty()) {
        failures << 'Files missing from checksums.sha256: ' + missingRows.sort().join(', ')
    }
    if (!staleRows.isEmpty()) {
        failures << 'Checksum rows without files: ' + staleRows.sort().join(', ')
    }
    if (!failures.isEmpty()) {
        throw new GradleException("${label} checksum verification failed:\n- " + failures.join('\n- '))
    }
    [fileCount: actual.size(), checksumFileSha256: delosV1Sha256(checksumsFile)]
}

