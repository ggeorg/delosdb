tasks.register('runDelosJdbcGate10lrMvccPostRegistryArchitectureDiagnosis') {
    group = 'verification'
    description = 'Assembles Gate 10L-R clean post-registry HOT/DISJOINT JFR evidence for the next architecture decision.'
    dependsOn tasks.named('runDelosJdbcGate10lrMvccPostRegistryResidentProfile')
    outputs.upToDateWhen { false }

    doLast {
        File root = rootProject.layout.buildDirectory.dir(gate10lrRoot).get().asFile
        def failures = []
        def decision = [
                'Gate 10L-R permanent-MVCC post-registry resident architecture diagnosis',
                'Purpose: profile the clean permanent path after removal of temporary snapshot-lease counters.',
                '10L-P remains the performance acceptance authority; this gate chooses the next architecture question from clean runtime evidence.',
                'Profile geometry: Delos MVCC only, 65536 current-row cache slots, HOT + DISJOINT, 16 clients, 20,000 transactions/client, 1 warmup, 3 measured iterations.'
        ]

        File results = new File(root, 'cross-engine-concurrency-results.csv')
        if (!results.isFile()) {
            failures.add('missing cross-engine-concurrency-results.csv')
        } else {
            def lines = results.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            if (lines.size() < 2) {
                failures.add('resident profile results are empty')
            } else {
                def header = (lines[0].split(',', -1) as List).collect { it.trim() }
                def rows = lines.drop(1).collect { line ->
                    def fields = line.split(',', -1)
                    def row = [:]
                    header.eachWithIndex { name, index -> row[name] = fields[index].trim() }
                    row
                }.findAll { it.target == 'delos_mvcc' && it.clients == '16' }
                ['PRIMARY_KEY_READ_HOT', 'PRIMARY_KEY_READ_DISJOINT'].each { workload ->
                    def cell = rows.findAll { it.workload == workload }
                    if (cell.size() != 1) {
                        failures.add("${workload} expected one 16c MVCC observation, found ${cell.size()}")
                    } else {
                        def row = cell[0]
                        long retries = Long.parseLong(row.retryableConflictRetries)
                        long operations = Long.parseLong(row.measuredOperations)
                        double throughput = Double.parseDouble(row.operationsPerSecond)
                        if (retries != 0L) {
                            failures.add("${workload} retryable conflicts=${retries}")
                        }
                        if (operations != 9600000L) {
                            failures.add("${workload} measured operations expected 9600000, found ${operations}")
                        }
                        decision.add(String.format(java.util.Locale.ROOT,
                                '%s 16c: throughput=%.0f op/s operations=%d retries=%d fingerprint=%s',
                                workload, throughput, operations, retries, row.semanticFingerprint))
                    }
                }
            }
        }

        File profileDir = new File(root, 'profiles')
        def recordings = profileDir.isDirectory()
                ? profileDir.listFiles().findAll { it.name.endsWith('.jfr') }
                : []
        if (recordings.size() != 1) {
            failures.add("expected exactly one JFR recording, found ${recordings.size()}")
        } else {
            File jfr = recordings[0]
            File jfrTool = new File(System.getProperty('java.home'), 'bin/jfr')
            ['hot-methods', 'allocation-by-site', 'contention-by-site'].each { view ->
                def execOutput = providers.exec {
                    commandLine jfrTool.absolutePath, 'view', '--width', '220',
                            '--cell-height', '30', view, jfr.absolutePath
                    ignoreExitValue = true
                }
                def result = execOutput.result.get()
                def output = execOutput.standardOutput.asText.get()
                def error = execOutput.standardError.asText.get()
                if (result.exitValue != 0) {
                    failures.add("jfr view ${view} failed: ${error.trim()}")
                } else {
                    new File(root, "${view}.txt").setText(output, 'UTF-8')
                }
            }
            [
                    'execution-samples': 'jdk.ExecutionSample',
                    'allocation-samples': 'jdk.ObjectAllocationSample',
                    'thread-parks': 'jdk.ThreadPark',
                    'garbage-collections': 'jdk.GarbageCollection'
            ].each { name, event ->
                def execOutput = providers.exec {
                    commandLine jfrTool.absolutePath, 'print', '--events', event, jfr.absolutePath
                    ignoreExitValue = true
                }
                def result = execOutput.result.get()
                def output = execOutput.standardOutput.asText.get()
                def error = execOutput.standardError.asText.get()
                if (result.exitValue != 0) {
                    failures.add("jfr print ${event} failed: ${error.trim()}")
                } else {
                    new File(root, "${name}.txt").setText(output, 'UTF-8')
                }
            }
            decision.add("JFR recording: ${jfr.name} (${jfr.length()} bytes)")
        }

        File decisionFile = new File(root,
                'gate10lr-mvcc-post-registry-resident-profile-decision.txt')
        if (!failures.isEmpty()) {
            decision.add('')
            decision.add('FAIL: ' + failures.join('; '))
            decisionFile.setText(
                    decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            throw new GradleException(
                    'Gate 10L-R evidence incomplete: ' + failures.join('; '))
        }
        decision.add('')
        decision.add('PASS: clean post-registry resident profile captured. Inspect the JFR stacks against the current-first MVCC source/research model before selecting the next production experiment.')
        decisionFile.setText(
                decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10L-R PASS: clean post-registry resident HOT/DISJOINT architecture profile captured.')
    }
}

