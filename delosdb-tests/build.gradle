// Derby's inherited tests compile against the bundled JUnit 3 jar because that
// is what the upstream test sources import. Gradle's Test worker, however,
// requires JUnit 4 on the runtime classpath in modern Gradle releases. Keep
// the two roles separate so the compile-time automatic module remains stable.
def gradleJUnitRuntime = configurations.create('gradleJUnitRuntime') {
    canBeConsumed = false
    canBeResolved = true
    transitive = true
}

