                    "Gate 10L-S expected ${expectedRows} measurements but found ${rows.size()}")
        }

        def median = { List<Double> values ->
            def sorted = values.sort(false)
            int size = sorted.size()
            if ((size & 1) == 1) {
                return sorted[size / 2]
            }
            return (sorted[size / 2 - 1] + sorted[size / 2]) / 2.0d
        }

