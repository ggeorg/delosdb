    task.description = 'Maps the post-Gate-10G HOT latch to the Derby heap and measures page-vs-logical-lock blocking.'
    configureGate10hHotWorker(task, 'delos-residual-authority', 'delos_heap', false)
}

tasks.register('runDelosJdbcGate10hSqlitePrivateCacheProof', JavaExec) { task ->
    task.description = 'Records SQLite/Xerial runtime metadata and HOT throughput with the normal private-cache configuration.'
    configureGate10hHotWorker(task, 'sqlite-private-cache', 'sqlite', false)
    task.mustRunAfter tasks.named('runDelosJdbcGate10hDelosResidualAuthorityProof')
}

tasks.register('runDelosJdbcGate10hSqliteSharedCacheProof', JavaExec) { task ->
