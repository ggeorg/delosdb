}


def registerDelosFocusedTest = { String taskName,
                                String descriptionText,
                                List<String> includePatterns,
                                Map<String, String> jvmSystemProperties = [:],
                                List<String> testPatterns = [] ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = descriptionText
        dependsOn tasks.named('compileTestJava'), ':jars'

        modularity.inferModulePath = false
        testClassesDirs = files(derbyTestsClassDir)
        classpath = testRuntimeClasspath()
        useJUnit()
        includePatterns.each { pattern -> include pattern }
        if (!testPatterns.isEmpty()) {
            filter {
                testPatterns.each { pattern -> includeTestsMatching pattern }
            }
        }

        workingDir = layout.buildDirectory.dir("test-work/${taskName}").get().asFile
        maxHeapSize = '1536m'
        jvmSystemProperties.each { key, value -> systemProperty key, value }
        binaryResultsDirectory.set(layout.buildDirectory.dir("test-results/binary/${taskName}"))
        reports {
            junitXml.required.set(true)
            junitXml.outputLocation.set(layout.buildDirectory.dir("test-results/${taskName}"))
            html.required.set(true)
            html.outputLocation.set(layout.buildDirectory.dir("reports/tests/${taskName}"))
        }

        doFirst {
            delete workingDir
            workingDir.mkdirs()
        }

        testLogging {
            events 'failed'
            exceptionFormat = 'full'
            showStandardStreams = true
        }
    }
}


