tasks.register('generateNativeAuthenticationTestDatabase', JavaExec) {
    group = 'verification'
    description = 'Generates the native-authentication jar database used by inherited Derby lang tests.'
    dependsOn ':jars'

    def ijOutput = layout.buildDirectory.file('reports/native-authentication/nast_init.out')
    def ijError = layout.buildDirectory.file('reports/native-authentication/nast_init.err')

    mainClass = 'org.apache.derby.tools.ij'
    classpath = nativeAuthenticationGeneratorClasspath()
    workingDir = generatedNativeAuthWorkDir.get().asFile
    args new File(inheritedTestSourceRoot, 'org/apache/derbyTesting/functionTests/tests/lang/nast_init.sql').absolutePath
    outputs.upToDateWhen { false }
    outputs.file(ijOutput)
    outputs.file(ijError)
    outputs.dir(generatedNativeAuthWorkDir)

    doFirst {
        delete generatedNativeAuthWorkDir
        workingDir.mkdirs()
        ijOutput.get().asFile.parentFile.mkdirs()
        standardOutput = new FileOutputStream(ijOutput.get().asFile)
        errorOutput = new FileOutputStream(ijError.get().asFile)
    }

    doLast {
        String combinedOutput = ''
        if (ijOutput.get().asFile.exists()) {
            combinedOutput += ijOutput.get().asFile.getText('UTF-8')
        }
        if (ijError.get().asFile.exists()) {
            combinedOutput += '\n' + ijError.get().asFile.getText('UTF-8')
        }
        def unexpectedErrors = combinedOutput.readLines().findAll { line ->
            line.contains('ERROR ') && !line.contains('ERROR XJ015')
        }
        if (!unexpectedErrors.isEmpty()) {
            throw new GradleException(
                    "Native-authentication fixture generation failed; see ${ijOutput.get().asFile} and ${ijError.get().asFile}; first unexpected error: ${unexpectedErrors.first()}")
        }

        def plainDatabase = generatedNativeAuthWorkDir.get().dir('nast/nast').asFile
        def encryptedDatabase = generatedNativeAuthWorkDir.get().dir('nast/nastEncrypted').asFile
        if (!plainDatabase.isDirectory() || !encryptedDatabase.isDirectory()) {
            throw new GradleException(
                    "Native-authentication fixture generation did not create both expected databases under ${generatedNativeAuthWorkDir.get().asFile}")
        }
    }
}

tasks.register('generateNativeAuthenticationTestJar', Jar) {
    group = 'verification'
    description = 'Packages the generated native-authentication test database as nast1.jar.'
    dependsOn tasks.named('generateNativeAuthenticationTestDatabase')

    archiveFileName = 'nast1.jar'
    destinationDirectory = generatedNativeAuthResourceDir.map {
