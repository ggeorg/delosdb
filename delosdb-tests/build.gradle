                'delosdb.benchmark.crossEngineConcurrency.pageLatchDiagnostics': 'true',
                'delosdb.benchmark.crossEngineConcurrency.btreePointReadPathDiagnostics': 'true',
                'delosdb.benchmark.crossEngineConcurrency.heapPageReadImageDiagnostics': 'true'
        ])
    }

    doLast {
        def reportDir = rootProject.layout.buildDirectory
                .dir('reports/delosdb/benchmarks/gate10i-shared-heap-page-read-image-proof')
                .get().asFile
        def loadCsv = { File file ->
            if (!file.isFile()) {
                throw new GradleException("Missing Gate 10I-A report: ${file}")
            }
            def lines = file.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            if (lines.size() < 2) {
                throw new GradleException("Gate 10I-A report has no measurements: ${file}")
            }
            def header = lines[0].split(',', -1) as List
            lines.drop(1).collect { line ->
                def fields = line.split(',', -1)
                def row = [:]
                header.eachWithIndex { name, index -> row[name] = fields[index] }
                row
            }
        }

        def images = loadCsv(new File(
                reportDir, 'heap-page-read-image-diagnostics-delos_heap-run-1.csv'))
        def latches = loadCsv(new File(
                reportDir, 'page-latch-diagnostics-delos_heap-run-1.csv'))
        def btree = loadCsv(new File(
                reportDir, 'btree-point-read-path-diagnostics-delos_heap-run-1.csv'))
        if (images.size() != 2 || latches.size() != 2 || btree.size() != 2) {
            throw new GradleException('Gate 10I-A expected exactly 4c and 8c measurements.')
        }
        def imageByClients = images.collectEntries { [(it.clients): it] }
        def latchByClients = latches.collectEntries { [(it.clients): it] }
        def btreeByClients = btree.collectEntries { [(it.clients): it] }
        def decision = ['Gate 10I-A shared immutable heap-page read-image proof']

        ['4', '8'].each { clients ->
            def image = imageByClients[clients]
            def latch = latchByClients[clients]
            def b = btreeByClients[clients]
            if (image == null || latch == null || b == null) {
                throw new GradleException("Gate 10I-A missing ${clients}c measurement.")
            }
            long operations = Long.parseLong(image.measuredOperations)
            long attempts = Long.parseLong(image.attempts)
            long hits = Long.parseLong(image.hits)
            long fallbacks = Long.parseLong(image.fallbacks)
            long latchRequests = Long.parseLong(latch.latchRequests)
            long leafFetches = Long.parseLong(b.indexLeafRowFetches)
            long currentBytes = Long.parseLong(image.currentImageBytes)
            long peakBytes = Long.parseLong(image.peakImageBytes)
            long copiedBytes = Long.parseLong(image.bytesCopied)
            if (operations == 0L || attempts == 0L) {
                throw new GradleException("Gate 10I-A ${clients}c observed no heap-image work.")
            }
            double attemptsPerOperation = attempts / (double) operations
            double hitRatio = hits / (double) attempts
            double fallbackRatio = fallbacks / (double) attempts
            double latchesPerOperation = latchRequests / (double) operations
            double leafFetchesPerOperation = leafFetches / (double) operations
            double copiedBytesPerOperation = copiedBytes / (double) operations

            if (attemptsPerOperation < 0.98d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10I-A %sc heap image was not attempted for the HOT workload: %.6f/op',
                        clients, attemptsPerOperation))
            }
            if (hitRatio < 0.99d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10I-A %sc heap-image hit ratio too low: %.6f', clients, hitRatio))
            }
            if (fallbackRatio > 0.01d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10I-A %sc heap-image fallback ratio too high: %.6f',
                        clients, fallbackRatio))
            }
            if (leafFetchesPerOperation > 0.02d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10I-A %sc regressed into physical B-tree leaf fetches: %.6f/op',
                        clients, leafFetchesPerOperation))
            }
            if (latchesPerOperation > 0.05d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10I-A %sc did not remove the residual heap-page latch: %.6f latches/op',
                        clients, latchesPerOperation))
            }
            if (currentBytes <= 0L || peakBytes <= 0L || peakBytes > 8L * 1024L * 1024L) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10I-A %sc image memory is outside the bounded proof envelope: current=%d peak=%d',
                        clients, currentBytes, peakBytes))
            }
            if (copiedBytesPerOperation > 0.05d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10I-A %sc copies too many page bytes in steady state: %.6f bytes/op',
                        clients, copiedBytesPerOperation))
            }

            def line = String.format(java.util.Locale.ROOT,
                    '%sc: attempts/op=%.6f hitRatio=%.6f fallbackRatio=%.6f latches/op=%.6f leafFetches/op=%.6f currentBytes=%d peakBytes=%d copiedBytes/op=%.6f',
                    clients, attemptsPerOperation, hitRatio, fallbackRatio,
                    latchesPerOperation, leafFetchesPerOperation,
                    currentBytes, peakBytes, copiedBytesPerOperation)
            decision.add(line)
            logger.lifecycle('Gate 10I-A ' + line)
        }

        def passLine = 'PASS: the real held HOT workload reads the shared immutable heap-page image with ~0 physical page latches, while the image stays transient and bounded. Run the five-engine checkpoint before considering private/session images.'
        decision.add(passLine)
        new File(reportDir, 'gate10i-decision.txt').setText(
                decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10I-A ' + passLine)
    }
}


