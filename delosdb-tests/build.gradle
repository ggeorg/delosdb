    outputs.upToDateWhen { false }
    outputs.dir(rootProject.layout.buildDirectory.dir(
            'reports/delosdb/benchmarks/range-scan-baseline'))

    doFirst {
        def saneValue = providers.gradleProperty('delosdb.sane')
                .getOrElse('true')
                .trim()
                .toLowerCase(java.util.Locale.ROOT)
        if (saneValue != 'false') {
            throw new GradleException(
                    'Range-scan baseline requires a release build; rerun with -Pdelosdb.sane=false')
