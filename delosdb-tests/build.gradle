tasks.register('runDelosJdbcGate10keRecordReadFootprintProof') {
    group = 'benchmark'
    description = 'Measures retained dormant RecordId fast controls under HOT, DISJOINT, and RANDOM reads at 10k and 100k rows.'
    dependsOn gate10keRows10k, gate10keRows100k
    outputs.upToDateWhen { false }

    doLast {
        def root = rootProject.layout.buildDirectory.dir(gate10keFootprintRoot).get().asFile
        def loadCsv = { File file ->
            if (!file.isFile()) {
                throw new GradleException("Missing Gate 10K-E report: ${file}")
            }
            def lines = file.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            if (lines.size() < 2) {
                throw new GradleException("Gate 10K-E report has no rows: ${file}")
            }
            def header = (lines[0].split(',', -1) as List).collect {
                it.toString().trim().replace('\uFEFF', '')
            }
            lines.drop(1).collect { line ->
                def fields = line.split(',', -1)
                if (fields.length != header.size()) {
                    throw new GradleException("Gate 10K-E malformed CSV row in ${file}: ${line}")
                }
                def row = [:]
                header.eachWithIndex { name, index -> row[name] = fields[index].toString().trim() }
                row
            }
        }
        def metric = { List rows, String workload, String metricName ->
            def row = rows.find {
                it.workload == workload
                        && it.component == 'FastRecordReadControl'
                        && it.metric == metricName
            }
            if (row == null) {
                throw new GradleException(
                        "Gate 10K-E missing ${metricName} for ${workload}")
            }
            Long.parseLong(row.value)
        }

        def decision = [
                'Gate 10K-E dormant RecordId fast-control retained-footprint proof',
                'Diagnostic-only: no warmup, read-only width=1, 16 clients; no product threshold is invented here.',
                'In this shape, promotions minus freezes/retirements is the retained dormant-control estimate at the measurement snapshot.'
        ]

        [10000, 100000].each { rowCount ->
            def dir = new File(root, "rows-${rowCount}")
            def measurements = loadCsv(new File(dir, 'delos_heap-run-1.csv'))
            def hotState = loadCsv(new File(dir, 'hot-state-diagnostics-delos_heap-run-1.csv'))
            if (measurements.size() != 3) {
                throw new GradleException(
                        "Gate 10K-E expected 3 measurements for rows=${rowCount}, found ${measurements.size()}")
            }
            measurements.each { row ->
                if (Long.parseLong(row.retryableConflictRetries) != 0L) {
                    throw new GradleException(
                            "Gate 10K-E ${row.workload} rows=${rowCount} observed retryable conflicts")
                }
            }

            ['PRIMARY_KEY_READ_HOT', 'PRIMARY_KEY_READ_DISJOINT', 'PRIMARY_KEY_READ_RANDOM'].each { workload ->
                def measurement = measurements.find { it.workload == workload }
                if (measurement == null) {
                    throw new GradleException(
                            "Gate 10K-E missing measurement for ${workload} rows=${rowCount}")
                }
                long operations = Long.parseLong(measurement.measuredOperations)
                long promotions = metric(hotState, workload, 'promotions')
                long acquireHits = metric(hotState, workload, 'acquireHits')
                long releaseHits = metric(hotState, workload, 'releaseHits')
                long freezes = metric(hotState, workload, 'freezes')
                long retirements = metric(hotState, workload, 'retirements')
                long retained = promotions - freezes - retirements
                if (retained < 0L) {
                    throw new GradleException(String.format(java.util.Locale.ROOT,
                            'Gate 10K-E lifecycle accounting underflow for %s rows=%d: promotions=%d freezes=%d retirements=%d',
                            workload, rowCount, promotions, freezes, retirements))
                }
                if (workload == 'PRIMARY_KEY_READ_HOT' && promotions < 1L) {
                    throw new GradleException(
                            "Gate 10K-E HOT rows=${rowCount} never promoted despite 16-client overlap")
                }
                if (workload == 'PRIMARY_KEY_READ_DISJOINT'
                        && (promotions != 0L || acquireHits != 0L || releaseHits != 0L)) {
                    throw new GradleException(String.format(java.util.Locale.ROOT,
                            'Gate 10K-E DISJOINT rows=%d unexpectedly entered fast state: promotions=%d acquireHits=%d releaseHits=%d',
                            rowCount, promotions, acquireHits, releaseHits))
                }
                double retainedPctRows = retained * 100.0d / rowCount
                double promotionsPerMillionReads = promotions * 1_000_000.0d / operations
                double throughput = Double.parseDouble(measurement.operationsPerSecond)
                def line = String.format(java.util.Locale.ROOT,
                        'rows=%d %s: reads=%d throughput=%.2f op/s promotions=%d freezes=%d retirements=%d retainedEstimate=%d retainedRows=%.3f%% promotionsPerMillionReads=%.2f acquireHits/read=%.6f releaseHits/read=%.6f',
                        rowCount, workload, operations, throughput, promotions, freezes,
                        retirements, retained, retainedPctRows, promotionsPerMillionReads,
                        acquireHits / (double) operations, releaseHits / (double) operations)
                decision.add(line)
                logger.lifecycle('Gate 10K-E ' + line)
            }
        }

        def pass = 'PASS: retained-control footprint evidence captured. Gate 10K-E is diagnostic-only; inspect RANDOM retainedEstimate growth at 10k versus 100k rows before deciding whether 10K-B needs bounded dormant-state reclamation.'
        decision.add(pass)
        new File(root, 'gate10ke-decision.txt').setText(
                decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10K-E ' + pass)
    }
}


