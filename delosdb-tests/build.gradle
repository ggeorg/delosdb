tasks.register('runDelosJdbcHotHoldabilityRemovabilityProof') {
    group = 'benchmark'
    description = 'Proves whether JDBC holdability is the Gate 10C HOT singleton-path blocker.'
    dependsOn tasks.named('runDelosJdbcHotHoldabilityDefaultProof')
    dependsOn tasks.named('runDelosJdbcHotCloseCursorsProof')
    outputs.upToDateWhen { false }

    doLast {
        def reportRoot = rootProject.layout.buildDirectory
                .dir('reports/delosdb/benchmarks/hot-holdability-removability-proof')
                .get().asFile
        def loadCsv = { File file ->
            if (!file.isFile()) {
                throw new GradleException("Missing Gate 10F report: ${file}")
            }
            def lines = file.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            if (lines.size() < 2) {
                throw new GradleException("Gate 10F report has no measurements: ${file}")
            }
            def header = lines[0].split(',', -1) as List
            lines.drop(1).collect { line ->
                def fields = line.split(',', -1)
                def row = [:]
                header.eachWithIndex { name, index -> row[name] = fields[index] }
                row
            }
        }
        def diagnosticFile = { String variant ->
            new File(reportRoot,
                    "${variant}/btree-point-read-path-diagnostics-delos_heap-run-1.csv")
        }
        def latchFile = { String variant ->
            new File(reportRoot,
                    "${variant}/page-latch-diagnostics-delos_heap-run-1.csv")
        }
        def defaults = loadCsv(diagnosticFile('default-holdability'))
        def closes = loadCsv(diagnosticFile('close-cursors-at-commit'))
        def defaultLatches = loadCsv(latchFile('default-holdability'))
        def closeLatches = loadCsv(latchFile('close-cursors-at-commit'))
        if (defaults.size() != 2 || closes.size() != 2 ||
                defaultLatches.size() != 2 || closeLatches.size() != 2) {
            throw new GradleException('Gate 10F expected exactly 4c and 8c measurements per variant.')
        }

        def byClients = { rows -> rows.collectEntries { [(it.clients): it] } }
        def defaultByClients = byClients(defaults)
        def closeByClients = byClients(closes)
        def defaultLatchByClients = byClients(defaultLatches)
        def closeLatchByClients = byClients(closeLatches)
        def decisionLines = ['Gate 10F HOT holdability removability proof']
        ['4', '8'].each { clients ->
            def d = defaultByClients[clients]
            def c = closeByClients[clients]
            def dl = defaultLatchByClients[clients]
            def cl = closeLatchByClients[clients]
            if (d == null || c == null || dl == null || cl == null) {
                throw new GradleException("Gate 10F missing ${clients}c measurement.")
            }
            long dScans = Long.parseLong(d.scanInitSingleRowCalls)
            long cScans = Long.parseLong(c.scanInitSingleRowCalls)
            long dHeld = Long.parseLong(d.rejectHeld)
            long cHeld = Long.parseLong(c.rejectHeld)
            long dEligible = Long.parseLong(d.eligibleExactPointShapes)
            long cEligible = Long.parseLong(c.eligibleExactPointShapes)
            if (dScans == 0L || cScans == 0L) {
                throw new GradleException("Gate 10F ${clients}c did not observe singleton B-tree scans.")
            }
            double defaultHeldRatio = dHeld / (double) dScans
            double closeHeldRatio = cHeld / (double) cScans
            double closeEligibleRatio = cEligible / (double) cScans
            if (defaultHeldRatio < 0.95d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10F %sc default holdability did not prove held-scan rejection: %.3f',
                        clients, defaultHeldRatio))
            }
            if (closeHeldRatio > 0.01d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10F %sc CLOSE_CURSORS still rejected held scans: %.3f',
                        clients, closeHeldRatio))
            }
            if (closeEligibleRatio < 0.95d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10F %sc CLOSE_CURSORS did not expose exact-point eligibility: %.3f',
                        clients, closeEligibleRatio))
            }

            long dOps = Long.parseLong(dl.measuredOperations)
            long cOps = Long.parseLong(cl.measuredOperations)
            double dLatchesPerOperation = dOps == 0L
                    ? 0d : Long.parseLong(dl.latchRequests) / (double) dOps
            double cLatchesPerOperation = cOps == 0L
                    ? 0d : Long.parseLong(cl.latchRequests) / (double) cOps
            if (dLatchesPerOperation < 1.8d || cLatchesPerOperation < 1.8d) {
                throw new GradleException(String.format(java.util.Locale.ROOT,
                        'Gate 10F %sc unexpectedly changed the physical leaf-latch path: default=%.3f close=%.3f',
                        clients, dLatchesPerOperation, cLatchesPerOperation))
            }
            def decisionLine = String.format(java.util.Locale.ROOT,
                    '%sc: default rejectHeld=%.6f, CLOSE eligible=%.6f, latches/op default=%.6f close=%.6f',
                    clients, defaultHeldRatio, closeEligibleRatio,
                    dLatchesPerOperation, cLatchesPerOperation)
            decisionLines.add(decisionLine)
            logger.lifecycle('Gate 10F ' + decisionLine)
        }
        def passLine = 'PASS: JDBC holdability is proven removable from exact HOT point-read eligibility; B-tree leaf latching remains physically unchanged.'
        decisionLines.add(passLine)
        new File(reportRoot, 'gate10f-decision.txt').setText(
                decisionLines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10F ' + passLine)
    }
}

