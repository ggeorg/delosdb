plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.testing.Test

version = rootProject.version
group = rootProject.group

/*
 * Derby tests are compiled as one inherited test module, not as hand-picked
 * Gradle islands. The only source changes needed here are real modernization
 * fixes in the inherited tests themselves.
 */

def testSourceRoot = file('src/test/java')

// Keep the historical Derby harness sources in the repository for reference, but
// do not compile the stale VM launcher/adaptor layer in the active Gradle test
// module. The active DelosDB gate is the JUnit language suite, not the old
// Ant-era RunSuite process launcher. RunTest/RunList/NetServer remain compiled
// for inherited utility compatibility; only the proven-unused VM adapters and
// RunSuite entrypoint are quarantined from active compilation.
def legacyHarnessQuarantineExcludes = [
        'org/apache/derbyTesting/functionTests/harness/RunSuite.java',
        'org/apache/derbyTesting/functionTests/harness/ibm13.java',
        'org/apache/derbyTesting/functionTests/harness/ibm14.java',
        'org/apache/derbyTesting/functionTests/harness/ibm15.java',
        'org/apache/derbyTesting/functionTests/harness/ibm16.java',
        'org/apache/derbyTesting/functionTests/harness/ibm17.java',
        'org/apache/derbyTesting/functionTests/harness/ibm18.java',
        'org/apache/derbyTesting/functionTests/harness/j9_13.java',
        'org/apache/derbyTesting/functionTests/harness/j9_22.java',
        'org/apache/derbyTesting/functionTests/harness/j9_foundation.java',
        'org/apache/derbyTesting/functionTests/harness/j9_foundation11.java',
        'org/apache/derbyTesting/functionTests/harness/j9dee15.java',
        'org/apache/derbyTesting/functionTests/harness/jdk110.java',
        'org/apache/derbyTesting/functionTests/harness/jdk111.java',
        'org/apache/derbyTesting/functionTests/harness/jdk112.java',
        'org/apache/derbyTesting/functionTests/harness/jdk113.java',
        'org/apache/derbyTesting/functionTests/harness/jdk114.java',
        'org/apache/derbyTesting/functionTests/harness/jdk115.java',
        'org/apache/derbyTesting/functionTests/harness/jdk116.java',
        'org/apache/derbyTesting/functionTests/harness/jdk117.java',
        'org/apache/derbyTesting/functionTests/harness/jdk118.java',
        'org/apache/derbyTesting/functionTests/harness/jdk119.java',
        'org/apache/derbyTesting/functionTests/harness/jdk120.java',
        'org/apache/derbyTesting/functionTests/harness/jdk121.java',
        'org/apache/derbyTesting/functionTests/harness/jdk13.java',
        'org/apache/derbyTesting/functionTests/harness/jdk14.java',
        'org/apache/derbyTesting/functionTests/harness/jdk15.java',
        'org/apache/derbyTesting/functionTests/harness/jdk16.java',
        'org/apache/derbyTesting/functionTests/harness/jdk17.java',
        'org/apache/derbyTesting/functionTests/harness/jdk18.java',
        'org/apache/derbyTesting/functionTests/harness/jdk19.java'
]
def toursDbSourceRoot = rootProject.project(':delosdb-demos').file('src/main/demo/toursdb')
def derbyTestsClassDir = layout.buildDirectory.dir('classes/modules/org.apache.derby.tests')

def derbyRuntimeModuleClassDirs = rootProject.files(
        rootProject.project(':delosdb-commons').layout.buildDirectory.dir('classes/modules/org.apache.derby.commons'),
        rootProject.project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
        rootProject.project(':delosdb-engine').layout.buildDirectory.dir('classes/modules/org.apache.derby.engine'),
        rootProject.project(':delosdb-client').layout.buildDirectory.dir('classes/modules/org.apache.derby.client'),
        rootProject.project(':delosdb-server').layout.buildDirectory.dir('classes/modules/org.apache.derby.server'),
        rootProject.project(':delosdb-tools').layout.buildDirectory.dir('classes/modules/org.apache.derby.tools'),
        rootProject.project(':delosdb-optionaltools').layout.buildDirectory.dir('classes/modules/org.apache.derby.optionaltools'),
        rootProject.project(':delosdb-runner').layout.buildDirectory.dir('classes/modules/org.apache.derby.runner')
)

def thirdPartyTestModules = rootProject.files(
        'tools/java/junit.jar',
        'tools/java/geronimo-spec-servlet-2.4-rc4.jar',
        'tools/java/json_simple-1.1.jar',
        'tools/java/lucene-analyzers-common.jar',
        'tools/java/lucene-core.jar',
        'tools/java/lucene-queryparser.jar'
)

// Execute the inherited Derby JUnit suite against the assembled runtime jars,
// not the exploded module output trees. The jars are the supported runtime
// shape and contain the generated/copy-only boot resources such as
// org/apache/derby/modules.properties and catalog metadata resources.
def derbyRuntimeJars = rootProject.files(
        rootProject.layout.buildDirectory.file('libs/delosdb-spi.jar'),
        rootProject.layout.buildDirectory.file('libs/osgi-framework-stub.jar'),
        rootProject.layout.buildDirectory.file('libs/derbyshared.jar'),
        rootProject.layout.buildDirectory.file('libs/derby.jar'),
        rootProject.layout.buildDirectory.file('libs/derbyclient.jar'),
        rootProject.layout.buildDirectory.file('libs/derbytools.jar'),
        rootProject.layout.buildDirectory.file('libs/derbynet.jar'),
        rootProject.layout.buildDirectory.file('libs/derbyoptionaltools.jar'),
        rootProject.layout.buildDirectory.file('libs/derbyrun.jar')
)

def compilePrerequisites = [
        ':delosdb-commons:compileDerbyCommons',
        ':delosdb-spi:compileDelosDbSpi',
        ':delosdb-engine:compileDerbyEngine',
        ':delosdb-engine:compileClassSizeCatalog',
        ':delosdb-client:compileDerbyClient',
        ':delosdb-server:compileDerbyServer',
        ':delosdb-tools:compileDerbyTools',
        ':delosdb-optionaltools:compileDerbyOptionalTools',
        ':delosdb-runner:compileDerbyRunner',
        ':processDerbyResources',
        ':splitEngineMessages',
        ':generateOdbcMetadata',
        ':ensureCatalogMetadataResources'
]

def testModulePath = {
    rootProject.files(derbyRuntimeModuleClassDirs, thirdPartyTestModules)
}

def testRuntimeClasspath = {
    rootProject.files(
            derbyTestsClassDir,
            derbyRuntimeJars,
            testSourceRoot,
            toursDbSourceRoot,
            thirdPartyTestModules
    )
}

tasks.register('compileDerbyTestsModule', JavaCompile) {
    group = 'verification'
    description = 'Compiles the inherited Derby test module.'
    dependsOn compilePrerequisites

    source = files(
            fileTree(testSourceRoot) {
                include '**/*.java'
                exclude legacyHarnessQuarantineExcludes
            },
            new File(toursDbSourceRoot, 'insertMaps.java')
    )
    destinationDirectory = derbyTestsClassDir

    sourceCompatibility = rootProject.ext.javaRelease.toString()
    targetCompatibility = rootProject.ext.javaRelease.toString()
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    classpath = files()
    modularity.inferModulePath = false

    doFirst {
        options.compilerArgs = [
                '--module-path', testModulePath().asPath,
                '-proc:none'
        ]
    }
}
tasks.register('runDerbyLangSuite', Test) {
    group = 'verification'
    description = 'Runs the original Derby lang JUnit suite through Gradle.'
    dependsOn 'compileDerbyTestsModule', ':jars'

    // Derby's inherited JUnit tests are classpath-era tests. Compile the test
    // sources as a module for source correctness, but execute them on the
    // classpath to avoid JPMS split-package failures from Derby locale/resource
    // packages in exploded module directories.
    modularity.inferModulePath = false
    testClassesDirs = files(derbyTestsClassDir)
    classpath = testRuntimeClasspath()
    useJUnit()
    include 'org/apache/derbyTesting/functionTests/tests/lang/_Suite.class'

    workingDir = layout.buildDirectory.dir('test-work/runDerbyLangSuite').get().asFile
    maxHeapSize = '1536m'
    binaryResultsDirectory.set(layout.buildDirectory.dir('test-results/binary/runDerbyLangSuite'))
    reports {
        junitXml.required.set(true)
        junitXml.outputLocation.set(layout.buildDirectory.dir('test-results/runDerbyLangSuite'))
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.dir('reports/tests/runDerbyLangSuite'))
    }

    doFirst {
        delete workingDir
        workingDir.mkdirs()
    }

    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}


tasks.register('runTransactionLockingRecoveryProofTest', Test) {
    group = 'verification'
    description = 'Runs focused transaction, locking, checkpoint, and restart recovery boundary proof tests.'
    dependsOn 'compileDerbyTestsModule', ':jars'

    modularity.inferModulePath = false
    testClassesDirs = files(derbyTestsClassDir)
    classpath = testRuntimeClasspath()
    useJUnit()
    include 'org/apache/derbyTesting/functionTests/tests/store/TransactionLockingRecoveryProofTest.class'
    include 'org/apache/derbyTesting/functionTests/tests/store/RecoveryTest.class'

    workingDir = layout.buildDirectory.dir('test-work/runTransactionLockingRecoveryProofTest').get().asFile
    maxHeapSize = '1536m'
    binaryResultsDirectory.set(layout.buildDirectory.dir('test-results/binary/runTransactionLockingRecoveryProofTest'))
    reports {
        junitXml.required.set(true)
        junitXml.outputLocation.set(layout.buildDirectory.dir('test-results/runTransactionLockingRecoveryProofTest'))
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.dir('reports/tests/runTransactionLockingRecoveryProofTest'))
    }

    doFirst {
        delete workingDir
        workingDir.mkdirs()
    }

    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}


tasks.register('runBTreeSearchRefactorProofTests', Test) {
    group = 'verification'
    description = 'Runs focused B-tree search, split, max-scan, and reposition proof tests before any ControlRow refactor.'
    dependsOn 'compileDerbyTestsModule', ':jars'

    modularity.inferModulePath = false
    testClassesDirs = files(derbyTestsClassDir)
    classpath = testRuntimeClasspath()
    useJUnit()
    include 'org/apache/derbyTesting/functionTests/tests/store/BTreeDirectionalBoundaryScanTest.class'
    include 'org/apache/derbyTesting/functionTests/tests/store/BTreeMaxScanTest.class'
    include 'org/apache/derbyTesting/functionTests/tests/store/IndexSplitDeadlockTest.class'

    workingDir = layout.buildDirectory.dir('test-work/runBTreeSearchRefactorProofTests').get().asFile
    maxHeapSize = '1536m'
    binaryResultsDirectory.set(layout.buildDirectory.dir('test-results/binary/runBTreeSearchRefactorProofTests'))
    reports {
        junitXml.required.set(true)
        junitXml.outputLocation.set(layout.buildDirectory.dir('test-results/runBTreeSearchRefactorProofTests'))
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.dir('reports/tests/runBTreeSearchRefactorProofTests'))
    }

    doFirst {
        delete workingDir
        workingDir.mkdirs()
    }

    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}


tasks.register('classes') {
    dependsOn 'compileDerbyTestsModule'
}

tasks.named('assemble') {
    dependsOn 'classes'
}

tasks.named('check') {
    dependsOn 'runDerbyLangSuite'
}
