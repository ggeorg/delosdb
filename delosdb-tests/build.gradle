        rootProject.configurations.delosdbAsm
)

// Compile and execute inherited Derby tests against the assembled runtime jars.
// The runtime jars are the supported Derby-compatible shape and include the
// generated/copy-only boot resources, patched store implementation classes, and
// ServiceLoader-visible DelosDB storage-provider jars. Keep this derived from
// the root runtime model so focused SQL gates cannot drift from binary packaging.
def derbyRuntimeJars = rootProject.ext.delosdbRuntimeJarFiles.call()

