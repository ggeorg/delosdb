tasks.register('runDelosJdbcGate10lqMvccPermanentSnapshotLeaseRegistryProof') {
    group = 'verification'
    description = 'Runs Gate 10L-Q permanent snapshot-lease registry transition/lifecycle proof.'
    dependsOn tasks.named('runDelosMvccSnapshotLeaseRegistrySafetyTest')
    dependsOn tasks.named('runDelosMvccSnapshotLeaseRegistryFallbackTest')
    dependsOn tasks.named('runDelosJdbcGate10lqMvccPermanentSnapshotLeaseMechanism')
    outputs.upToDateWhen { false }

    doLast {
        File root = rootProject.layout.buildDirectory.dir(gate10lqRoot).get().asFile
        File resultCsv = new File(root, 'mechanism/cross-engine-concurrency-results.csv')
        File counterCsv = new File(root,
                'mechanism/workers/mvcc-snapshot-lease-diagnostics-delos_mvcc-run-1.csv')
        def loadOne = { File file ->
            if (!file.isFile()) {
                throw new GradleException("Missing Gate 10L-Q evidence: ${file}")
            }
            def lines = file.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            if (lines.size() != 2) {
                throw new GradleException(
                        "Gate 10L-Q expected exactly one evidence row in ${file}, observed ${lines.size() - 1}")
            }
            def header = (lines[0].split(',', -1) as List).collect { it.trim() }
            def fields = lines[1].split(',', -1)
            def row = [:]
            header.eachWithIndex { name, index -> row[name] = fields[index].trim() }
            row
        }
        def result = loadOne(resultCsv)
        def counters = loadOne(counterCsv)
        long expected = result.measuredOperations as long
        def failures = []
        if (result.retryableConflictRetries != '0') {
            failures.add("retryable conflicts ${result.retryableConflictRetries} != 0")
        }
        if ((counters.slottedCurrentOpens as long) != expected
                || (counters.slottedCloses as long) != expected) {
            failures.add("slotted opens/closes expected ${expected}/${expected} but were ${counters.slottedCurrentOpens}/${counters.slottedCloses}")
        }
        if ((counters.lockedCurrentOpens as long) != 0L
                || (counters.lockedCloses as long) != 0L) {
            failures.add("permanent default used locked fallback ${counters.lockedCurrentOpens}/${counters.lockedCloses}")
        }
        if ((counters.currentSlotClaimFailures as long) != 0L) {
            failures.add("current slot-claim failures ${counters.currentSlotClaimFailures} != 0")
        }
        long retained = (counters.lockedRetainedOpens as long)
                + (counters.slottedRetainedOpens as long)
                + (counters.retainedSlotClaimFailures as long)
        if (retained != 0L) {
            failures.add("unexpected retained-snapshot activity ${retained}")
        }

        def decision = [
                'Gate 10L-Q permanent-v1 MVCC snapshot-lease registry transition',
                'Gate 10L-P balanced acceptance passed before this transition.',
                'Production no longer reads the experimental snapshot-lease enable switch. The bounded slotted registry is the permanent first path; the locked map remains only as conservative overflow fallback.',
                'READ COMMITTED statement-snapshot semantics are unchanged: every scan still captures/releases its own statement snapshot.',
                "Permanent-default mechanism: operations=${expected} slotted=${counters.slottedCurrentOpens}/${counters.slottedCloses} locked=${counters.lockedCurrentOpens}/${counters.lockedCloses} claimFailures=${counters.currentSlotClaimFailures} retries=${result.retryableConflictRetries}."
        ]
        File decisionFile = new File(root, 'gate10lq-mvcc-permanent-snapshot-lease-registry-decision.txt')
        if (!failures.isEmpty()) {
            decision.add('')
            decision.add('FAIL: ' + failures.join('; '))
            decisionFile.parentFile.mkdirs()
            decisionFile.setText(decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            throw new GradleException('Gate 10L-Q failed: ' + failures.join('; '))
        }
        decision.add('')
        decision.add('PASS: permanent default snapshot-lease registry is active with zero locked fallback in the focused statement-snapshot mechanism proof. Proceed to integrity and then a fresh resident profile with temporary lease counters removed.')
        decisionFile.parentFile.mkdirs()
        decisionFile.setText(decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10L-Q PASS: permanent MVCC snapshot-lease registry transition proved.')
    }
}

