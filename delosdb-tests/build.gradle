plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.testing.Test

version = rootProject.version
group = rootProject.group

/*
 * DelosDB test module policy:
 * - keep the original Derby tests as the source of truth;
 * - compile DerbyTesting once;
 * - run original Derby JUnit suite entrypoints through Gradle;
 * - do not rebuild the old Ant/derbyall harness in Gradle;
 * - do not grow hand-picked compile islands in this file.
 */

def testSourceRoot = file('src/test/java')
def derbyFunctionTestSuiteClassDir = layout.buildDirectory.dir('classes/derby-function-test-suite')

def moduleClassDirs = rootProject.files(
        rootProject.project(':delosdb-commons').layout.buildDirectory.dir('classes/modules/org.apache.derby.commons'),
        rootProject.project(':delosdb-engine').layout.buildDirectory.dir('classes/modules/org.apache.derby.engine'),
        rootProject.project(':delosdb-client').layout.buildDirectory.dir('classes/modules/org.apache.derby.client'),
        rootProject.project(':delosdb-server').layout.buildDirectory.dir('classes/modules/org.apache.derby.server'),
        rootProject.project(':delosdb-tools').layout.buildDirectory.dir('classes/modules/org.apache.derby.tools'),
        rootProject.project(':delosdb-optionaltools').layout.buildDirectory.dir('classes/modules/org.apache.derby.optionaltools'),
        rootProject.project(':delosdb-runner').layout.buildDirectory.dir('classes/modules/org.apache.derby.runner')
)

def thirdPartyTestClasspath = rootProject.files(
        'tools/java/junit.jar',
        'tools/java/geronimo-spec-servlet-2.4-rc4.jar',
        'tools/java/json_simple-1.1.jar',
        'tools/java/lucene-analyzers-common.jar',
        'tools/java/lucene-core.jar',
        'tools/java/lucene-queryparser.jar'
)

def compilePrerequisites = [
        ':delosdb-commons:compileDerbyCommons',
        ':delosdb-engine:compileDerbyEngine',
        ':delosdb-engine:compileClassSizeCatalog',
        ':delosdb-client:compileDerbyClient',
        ':delosdb-server:compileDerbyServer',
        ':delosdb-tools:compileDerbyTools',
        ':delosdb-optionaltools:compileDerbyOptionalTools',
        ':delosdb-runner:compileDerbyRunner',
        ':splitEngineMessages'
]

def derbyCompileClasspath = {
    rootProject.files(moduleClassDirs, thirdPartyTestClasspath)
}

def derbyRuntimeClasspath = {
    rootProject.files(
            derbyFunctionTestSuiteClassDir,
            moduleClassDirs,
            testSourceRoot,
            thirdPartyTestClasspath
    )
}

tasks.register('compileDerbyFunctionTestSuite', JavaCompile) {
    group = 'verification'
    description = 'Compiles the original DerbyTesting tree once for Gradle-run suite entrypoints.'
    dependsOn compilePrerequisites

    source = fileTree(testSourceRoot) {
        include 'org/apache/derbyTesting/**/*.java'
        exclude 'module-info.java'
    }
    destinationDirectory = derbyFunctionTestSuiteClassDir

    sourceCompatibility = rootProject.ext.javaRelease.toString()
    targetCompatibility = rootProject.ext.javaRelease.toString()
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs += ['-proc:none']
    modularity.inferModulePath = false
    classpath = derbyCompileClasspath()
}

// Compatibility aliases kept only so old commands fail less painfully while the
// build file is reset. They are aliases, not separate compile islands.
tasks.register('compileDerbyTestSupport') {
    group = 'verification'
    description = 'Alias for compileDerbyFunctionTestSuite.'
    dependsOn 'compileDerbyFunctionTestSuite'
}

tasks.register('compileDerbyFunctionTestRuntimeSupport') {
    group = 'verification'
    description = 'Alias for compileDerbyFunctionTestSuite.'
    dependsOn 'compileDerbyFunctionTestSuite'
}

def registerDerbySuiteTask = { String taskName, String suiteClassName ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = "Runs original Derby JUnit suite ${suiteClassName} through Gradle."
        dependsOn 'compileDerbyFunctionTestSuite'

        testClassesDirs = derbyFunctionTestSuiteClassDir
        classpath = derbyRuntimeClasspath()
        useJUnit()
        include suiteClassName.replace('.', '/') + '.class'

        workingDir = layout.buildDirectory.dir("test-work/${taskName}").get().asFile
        maxHeapSize = '1536m'
        systemProperty 'derby.tests.trace', 'true'

        doFirst {
            delete workingDir
            workingDir.mkdirs()
        }
        testLogging {
            events 'failed'
            exceptionFormat 'full'
            showStandardStreams = true
        }
    }
}

[
        runDerbyUnitSuite   : 'org.apache.derbyTesting.unitTests.junit._Suite',
        runDerbyEngineSuite : 'org.apache.derbyTesting.functionTests.tests.engine._Suite',
        runDerbyLangSuite   : 'org.apache.derbyTesting.functionTests.tests.lang._Suite',
        runDerbyJdbcApiSuite: 'org.apache.derbyTesting.functionTests.tests.jdbcapi._Suite',
        runDerbyJdbc4Suite  : 'org.apache.derbyTesting.functionTests.tests.jdbc4._Suite'
].each { taskName, suiteClassName ->
    registerDerbySuiteTask(taskName, suiteClassName)
}

tasks.register('runDerbyFunctionSuites') {
    group = 'verification'
    description = 'Runs the currently wired original Derby function-test suites through Gradle.'
    dependsOn 'runDerbyEngineSuite',
            'runDerbyLangSuite',
            'runDerbyJdbcApiSuite',
            'runDerbyJdbc4Suite'
}

// Keep the old aggregate task names as tiny aliases. No hidden island list.
tasks.register('compileActivatedDerbyTests') {
    group = 'verification'
    description = 'Compiles the original DerbyTesting tree.'
    dependsOn 'compileDerbyFunctionTestSuite'
}

tasks.register('runActivatedDerbyLangExecutionIslands') {
    group = 'verification'
    description = 'Alias for the original Derby lang suite.'
    dependsOn 'runDerbyLangSuite'
}

tasks.register('runActivatedDerbySmokeExecutionIslands') {
    group = 'verification'
    description = 'Runs a small original-Derby suite smoke set.'
    dependsOn 'runDerbyUnitSuite', 'runDerbyLangSuite'
}

tasks.register('runActivatedDerbyExecutionIslands') {
    group = 'verification'
    description = 'Alias for the wired original Derby suites.'
    dependsOn 'runDerbyUnitSuite', 'runDerbyFunctionSuites'
}

tasks.register('classes') {
    dependsOn 'compileDerbyFunctionTestSuite'
}

tasks.named('assemble') {
    dependsOn 'classes'
}

tasks.named('check') {
    dependsOn 'runActivatedDerbySmokeExecutionIslands'
}
