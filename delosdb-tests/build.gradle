            }
            def lines = file.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            if (lines.size() < 2) {
                throw new GradleException("Gate 10G report has no measurements: ${file}")
            }
            def header = lines[0].split(',', -1) as List
            lines.drop(1).collect { line ->
                def fields = line.split(',', -1)
                def row = [:]
                header.eachWithIndex { name, index -> row[name] = fields[index] }
                row
            }
        }
        def diagnostics = loadCsv(new File(
                reportDir, 'btree-point-read-path-diagnostics-delos_heap-run-1.csv'))
        def latches = loadCsv(new File(
                reportDir, 'page-latch-diagnostics-delos_heap-run-1.csv'))
        def pages = loadCsv(new File(
                reportDir, 'page-latch-contention-by-page-delos_heap-run-1.csv'))
        if (diagnostics.size() != 2 || latches.size() != 2) {
            throw new GradleException('Gate 10G expected exactly 4c and 8c measurements.')
        }

        def diagByClients = diagnostics.collectEntries { [(it.clients): it] }
        def latchByClients = latches.collectEntries { [(it.clients): it] }
        def decision = ['Gate 10G HOT held-singleton fast-path proof']
        ['4', '8'].each { clients ->
            def d = diagByClients[clients]
            def l = latchByClients[clients]
            if (d == null || l == null) {
                throw new GradleException("Gate 10G missing ${clients}c measurement.")
            }
            long operations = Long.parseLong(d.measuredOperations)
            long attempts = Long.parseLong(d.snapshotPointAttempts)
            long hits = Long.parseLong(d.snapshotPointHits)
            long snapshotMisses = Long.parseLong(d.snapshotPointSnapshotMisses)
