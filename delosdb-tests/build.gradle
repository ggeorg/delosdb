tasks.register('captureDelosV1Baseline') {
    group = 'benchmark'
    description = 'Runs and packages the production-closeout v1 baseline, including modular DRDA and split decision/publication timing evidence.'

    dependsOn tasks.named('runDelosV1BaselineOperationalCapture'),
            tasks.named('runDelosJdbcBenchmarkBaseline'),
            tasks.named('runDelosJdbcBenchmarkBatchScaling'),
            tasks.named('runDelosJdbcBenchmarkTransactions'),
            tasks.named('runDelosJdbcBenchmarkRowScaling'),
            tasks.named('runDelosDrdaConcurrentClientStressTest'),
            tasks.named('runDelosV1ModularImageDrdaTest'),
            rootProject.tasks.named('verifyDelosRuntimeStorageProviders'),
            tasks.named('runDelosSharedRawStorePageIoRepresentationDecisionTest'),
            tasks.named('runDelosSharedRawStoreIoFaultInjectionTest'),
            tasks.named('runDelosMvccRawStoreDecisionWalCrashTest')

    outputs.upToDateWhen { false }
    outputs.dir(delosV1BaselineCaptureDirectory)

    doLast {
        File captureRoot = delosV1BaselineCaptureDirectory.get().asFile
        delete captureRoot
        File rawRoot = new File(captureRoot, 'raw')
        rawRoot.mkdirs()

        def lanes = [
                [id: 'operational', source: delosV1BaselineOperationalReportDirectory.get().asFile],
                [id: 'jdbc-lifecycle', source: rootProject.layout.buildDirectory
                        .dir('reports/delosdb/benchmarks').get().asFile,
                 include: ['benchmark-results.json', 'benchmark-results.csv', 'benchmark-summary.txt']],
                [id: 'jdbc-batch-scaling', source: rootProject.layout.buildDirectory
                        .dir('reports/delosdb/benchmarks/batch-scaling').get().asFile],
                [id: 'jdbc-transactions', source: rootProject.layout.buildDirectory
                        .dir('reports/delosdb/benchmarks/transactions').get().asFile],
                [id: 'jdbc-row-scaling', source: rootProject.layout.buildDirectory
                        .dir('reports/delosdb/benchmarks/row-scaling').get().asFile],
                [id: 'page-io-representation', source: layout.buildDirectory
                        .dir('test-results/runDelosSharedRawStorePageIoRepresentationDecisionTest').get().asFile],
                [id: 'rawstore-fault-injection', source: layout.buildDirectory
                        .dir('test-results/runDelosSharedRawStoreIoFaultInjectionTest').get().asFile],
                [id: 'rawstore-decision-wal-crash', source: layout.buildDirectory
                        .dir('test-results/runDelosMvccRawStoreDecisionWalCrashTest').get().asFile],
                [id: 'drda-stress', source: layout.buildDirectory
                        .dir('test-results/runDelosDrdaConcurrentClientStressTest').get().asFile],
                [id: 'modular-image-drda', source: delosV1ModularImageReportDirectory.get().asFile]
        ]

        def missing = []
        lanes.each { lane ->
            if (!lane.source.isDirectory()) {
                missing << "${lane.id}: ${lane.source}"
                return
            }
            File target = new File(rawRoot, lane.id)
            copy {
                from lane.source
                into target
                if (lane.include != null) {
                    lane.include.each { pattern -> include pattern }
                }
            }
            if (!target.isDirectory() || target.listFiles() == null || target.listFiles().length == 0) {
                missing << "${lane.id}: no copied evidence from ${lane.source}"
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException('Incomplete v1 baseline capture lanes:\n- ' + missing.join('\n- '))
        }

        File thresholdSource = rootProject.file('benchmarks/v1-baseline/provisional-thresholds.json')
        if (!thresholdSource.isFile()) {
            throw new GradleException('Missing tracked v1 baseline threshold policy: ' + thresholdSource)
        }
        copy {
            from thresholdSource
            into captureRoot
        }

        String revision = delosV1GitOutput(['git', 'rev-parse', 'HEAD'])
        if (!(revision ==~ /[0-9a-f]{40,64}/)) {
            throw new GradleException('The v1 baseline capture requires a Git source revision')
        }
        String status = delosV1GitOutput(['git', 'status', '--porcelain'])
        boolean dirty = !status.isBlank()

        def rawFiles = []
        captureRoot.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            if (file.name != 'manifest.json' && file.name != 'checksums.sha256') {
                String relative = captureRoot.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                rawFiles << [
                        path: relative,
                        bytes: file.length(),
                        sha256: delosV1Sha256(file)
                ]
            }
        }
        rawFiles.sort { left, right -> left.path <=> right.path }

        def semanticTokens = []
        rawFiles.findAll { it.path.endsWith('.json') }.each { entry ->
            String text = new File(captureRoot, entry.path).getText('UTF-8')
            (text =~ /"semanticFingerprint"\s*:\s*(-?\d+)/).each { match ->
                semanticTokens << "${entry.path}:fingerprint:${match[1]}"
            }
            (text =~ /"semanticDigest"\s*:\s*"([0-9a-f]{64})"/).each { match ->
                semanticTokens << "${entry.path}:digest:${match[1]}"
            }
        }
        semanticTokens.sort()
        if (semanticTokens.isEmpty()) {
            throw new GradleException('No semantic fingerprints or digests were captured')
        }
        def semanticDigest = java.security.MessageDigest.getInstance('SHA-256')
        semanticTokens.each { token ->
            semanticDigest.update(token.getBytes(java.nio.charset.StandardCharsets.UTF_8))
            semanticDigest.update((byte) '\n')
        }
        String semanticChecksum = java.util.HexFormat.of().formatHex(semanticDigest.digest())

        def runtimeArtifacts = rootProject.ext.delosdbRuntimeJarFiles.call()
                .files
                .findAll { it.isFile() }
                .sort { left, right -> left.name <=> right.name }
                .collect { jar -> [name: jar.name, bytes: jar.length(), sha256: delosV1Sha256(jar)] }

        def manifest = [
                schemaVersion: 1,
                baselineId: project.providers.gradleProperty('delosdb.v1Baseline.captureId')
                        .getOrElse('phase8-v1-production-closeout'),
                status: 'CAPTURED_NOT_ACCEPTED',
                source: [revision: revision, dirty: dirty],
                environment: [
                        capturedAtUtc: java.time.Instant.now().toString(),
                        javaVersion: System.getProperty('java.version'),
                        javaVendor: System.getProperty('java.vendor'),
                        vmName: System.getProperty('java.vm.name'),
                        osName: System.getProperty('os.name'),
                        osVersion: System.getProperty('os.version'),
                        osArch: System.getProperty('os.arch'),
                        processors: Runtime.getRuntime().availableProcessors(),
                        maxHeapBytes: Runtime.getRuntime().maxMemory(),
                        gradleVersion: gradle.gradleVersion
                ],
                matrix: [
                        writers: [1, 2, 4, 8, 16],
                        providers: ['heap', 'delos_mvcc'],
                        topologies: ['same-table', 'different-tables', 'different-databases'],
                        workloads: ['single-row-insert', 'multi-row-insert', 'mixed-insert-update']
                ],
                lanes: lanes.collect { it.id },
                profilingAndFaultDefaults: [
                        runtimeStatisticsDefault: 'disabled',
                        failureControls: 'test-only-unreachable'
                ],
                semanticChecksum: semanticChecksum,
                semanticTokenCount: semanticTokens.size(),
                runtimeArtifacts: runtimeArtifacts,
                files: rawFiles
        ]

        File manifestFile = new File(captureRoot, 'manifest.json')
        manifestFile.setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n',
                'UTF-8')

        def checksums = new ArrayList(rawFiles)
        checksums << [path: 'manifest.json', sha256: delosV1Sha256(manifestFile)]
        checksums.sort { left, right -> left.path <=> right.path }
        new File(captureRoot, 'checksums.sha256').withWriter('UTF-8') { writer ->
            checksums.each { entry -> writer.println("${entry.sha256}  ${entry.path}") }
        }

        logger.lifecycle('DelosDB v1 baseline capture written to {}', captureRoot)
        logger.lifecycle('Semantic checksum: {}', semanticChecksum)
        if (dirty) {
            logger.warn('The capture is marked dirty and cannot be frozen as the accepted v1 baseline.')
        }
    }
}


def delosV1AcceptanceCandidateFile = rootProject.layout.projectDirectory.file(
        'benchmarks/v1-baseline/acceptance-candidate.json')
def delosV1AcceptedBaselineDirectory = rootProject.layout.projectDirectory.dir(
        'benchmarks/v1-baseline/accepted')

tasks.register('promoteDelosV1Baseline') {
    group = 'benchmark'
    description = 'Promotes the reviewed clean v1 capture into the tracked immutable accepted baseline bundle.'

    inputs.dir(delosV1BaselineCaptureDirectory)
    inputs.file(delosV1AcceptanceCandidateFile)
    outputs.dir(delosV1AcceptedBaselineDirectory)
    outputs.upToDateWhen { false }

    doLast {
        File captureRoot = delosV1BaselineCaptureDirectory.get().asFile
        File candidateFile = delosV1AcceptanceCandidateFile.asFile
        File acceptedRoot = delosV1AcceptedBaselineDirectory.asFile
        File acceptedTemp = new File(acceptedRoot.parentFile, acceptedRoot.name + '.tmp')

        if (!captureRoot.isDirectory()) {
            throw new GradleException('Missing v1 capture bundle: ' + captureRoot
                    + '. Run :delosdb-tests:captureDelosV1Baseline first.')
        }
        if (!candidateFile.isFile()) {
            throw new GradleException('Missing reviewed v1 acceptance candidate: ' + candidateFile)
        }
        if (acceptedRoot.exists()) {
            File[] acceptedEntries = acceptedRoot.listFiles()
            if (acceptedEntries == null) {
                throw new GradleException('Unable to inspect the accepted v1 baseline directory: ' + acceptedRoot)
            }
            if (acceptedEntries.length > 0) {
                throw new GradleException('The accepted v1 baseline already exists and is immutable: ' + acceptedRoot)
            }
            if (!acceptedRoot.delete()) {
                throw new GradleException('Unable to remove Gradle-created empty accepted baseline directory: '
                        + acceptedRoot)
            }
        }

        def captureVerification = delosV1VerifyBundleChecksums(captureRoot, 'Captured v1 baseline')
        File captureManifestFile = new File(captureRoot, 'manifest.json')
        def captureManifest = new groovy.json.JsonSlurper().parse(captureManifestFile)
        def candidate = new groovy.json.JsonSlurper().parse(candidateFile)

        if (captureManifest.schemaVersion != 1) {
            throw new GradleException('Unsupported capture manifest schema: ' + captureManifest.schemaVersion)
        }
        if (captureManifest.status != candidate.requiredCaptureStatus) {
            throw new GradleException('Capture status is not promotable: ' + captureManifest.status)
        }
        if (captureManifest.baselineId != candidate.baselineId) {
            throw new GradleException('Capture baseline id does not match the reviewed candidate')
        }
        if (captureManifest.semanticChecksum != candidate.expectedSemanticChecksum) {
            throw new GradleException('Capture semantic checksum does not match the reviewed candidate. Expected '
                    + candidate.expectedSemanticChecksum + ', found ' + captureManifest.semanticChecksum)
        }
        if (captureManifest.source?.dirty != false) {
            throw new GradleException('Only a capture produced from a clean source tree can be promoted')
        }
        String captureRevision = captureManifest.source?.revision ?: ''
        if (!java.util.regex.Pattern.matches('[0-9a-f]{40,64}', captureRevision)) {
            throw new GradleException('Capture source revision is missing or malformed')
        }
        if (!delosV1GitCommandSucceeded(['git', 'merge-base', '--is-ancestor', captureRevision, 'HEAD'])) {
            throw new GradleException('Capture source revision is not an ancestor of the current checkout: '
                    + captureRevision)
        }
        String javaVersion = String.valueOf(captureManifest.environment?.javaVersion ?: '')
        String javaMajor = javaVersion.tokenize('.')[0]
        if (javaMajor != String.valueOf(candidate.requiredJavaMajor)) {
            throw new GradleException('Capture must use JDK ' + candidate.requiredJavaMajor
                    + ', found ' + javaVersion)
        }
        if (!(captureManifest.semanticTokenCount instanceof Number)
                || captureManifest.semanticTokenCount.intValue() <= 0) {
            throw new GradleException('Capture contains no semantic evidence tokens')
        }
        if (!(captureManifest.runtimeArtifacts instanceof Collection)
                || captureManifest.runtimeArtifacts.isEmpty()) {
            throw new GradleException('Capture contains no runtime artifact fingerprints')
        }

        delete acceptedTemp
        acceptedTemp.mkdirs()
        copy {
            from captureRoot
            into acceptedTemp
        }
        copy {
            from candidateFile
            into acceptedTemp
            rename { 'acceptance-policy.json' }
        }

        String currentRevision = delosV1GitOutput(['git', 'rev-parse', 'HEAD'])
        def acceptedManifest = new LinkedHashMap(captureManifest as Map)
        acceptedManifest.status = candidate.acceptedStatus
        acceptedManifest.acceptance = [
                policyVersion: candidate.policyVersion,
                acceptedAtUtc: java.time.Instant.now().toString(),
                promotedByTask: ':delosdb-tests:promoteDelosV1Baseline',
                promotionRevision: currentRevision,
                captureManifestSha256: delosV1Sha256(captureManifestFile),
                captureChecksumsSha256: captureVerification.checksumFileSha256,
                acceptancePolicySha256: delosV1Sha256(candidateFile)
        ]

        def acceptedEvidenceFiles = []
        acceptedTemp.eachFileRecurse { file ->
            if (file.isFile()) {
                String relative = acceptedTemp.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                if (relative != 'manifest.json' && relative != 'checksums.sha256') {
                    acceptedEvidenceFiles << [
                            path: relative,
                            bytes: file.length(),
                            sha256: delosV1Sha256(file)
                    ]
                }
            }
        }
        acceptedEvidenceFiles.sort { left, right -> left.path <=> right.path }
        acceptedManifest.files = acceptedEvidenceFiles

        File acceptedManifestFile = new File(acceptedTemp, 'manifest.json')
        acceptedManifestFile.setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(acceptedManifest)) + '\n',
                'UTF-8')

        def acceptedChecksums = []
        acceptedTemp.eachFileRecurse { file ->
            if (file.isFile()) {
                String relative = acceptedTemp.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                if (relative != 'checksums.sha256') {
                    acceptedChecksums << [path: relative, sha256: delosV1Sha256(file)]
                }
            }
        }
        acceptedChecksums.sort { left, right -> left.path <=> right.path }
        new File(acceptedTemp, 'checksums.sha256').withWriter('UTF-8') { writer ->
            acceptedChecksums.each { entry -> writer.println("${entry.sha256}  ${entry.path}") }
        }
        delosV1VerifyBundleChecksums(acceptedTemp, 'Accepted v1 baseline candidate')

        try {
            java.nio.file.Files.move(
                    acceptedTemp.toPath(),
                    acceptedRoot.toPath(),
                    java.nio.file.StandardCopyOption.ATOMIC_MOVE)
        } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
            java.nio.file.Files.move(acceptedTemp.toPath(), acceptedRoot.toPath())
        }

        logger.lifecycle('Accepted DelosDB v1 baseline written to {}', acceptedRoot)
        logger.lifecycle('Accepted semantic checksum: {}', acceptedManifest.semanticChecksum)
        logger.lifecycle('Accepted source revision: {}', captureRevision)
    }
}

