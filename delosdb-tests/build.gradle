    group = 'build'
    description = 'Compiles package-private engine proof bridges as an org.apache.derby.engine test patch.'
    dependsOn tasks.named('prepareRawStoreInternalTestSupportSources'), ':jars'

    source rawStoreInternalTestSupportGeneratedSourceDir
    destinationDirectory.set(rawStoreInternalTestSupportClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    classpath = files()
    modularity.inferModulePath = false

    doFirst {
        options.compilerArgs = [
                '--module-path', testModulePath().asPath,
                '--patch-module',
                "org.apache.derby.engine=${rawStoreInternalTestSupportGeneratedSourceDir.get().asFile.absolutePath}",
                '-proc:none'
