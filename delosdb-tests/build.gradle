tasks.register('assembleDelosV1ModularRuntimeImage') {
    group = 'benchmark'
    description = 'Builds the jlink runtime image used by the modular DRDA baseline lane.'
    dependsOn rootProject.tasks.named('jars')

    inputs.files(delosV1ModularRuntimeJars)
    outputs.dir(delosV1ModularImageRoot)

    doLast {
        File imageRoot = delosV1ModularImageRoot.get().asFile
        delete imageRoot
        imageRoot.parentFile.mkdirs()

        String executableName = System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT).contains('win')
                ? 'jlink.exe'
                : 'jlink'
        File jlink = new File(System.getProperty('java.home'), 'bin/' + executableName)
        if (!jlink.isFile()) {
            throw new GradleException('JDK jlink executable is unavailable: ' + jlink)
        }
        def command = [
                jlink.absolutePath,
                '--add-modules',
                'java.base,java.logging,java.management,java.naming,java.security.jgss,java.sql,java.sql.rowset,java.xml,jdk.charsets,jdk.crypto.ec,jdk.jfr,jdk.localedata,jdk.management,jdk.unsupported',
                '--bind-services',
                '--no-header-files',
                '--no-man-pages',
                '--output', imageRoot.absolutePath
        ]
        def process = new ProcessBuilder(command)
                .directory(rootProject.projectDir)
                .redirectErrorStream(true)
                .start()
        String output = process.inputStream.getText('UTF-8')
        int exitCode = process.waitFor()
        if (exitCode != 0) {
            throw new GradleException('jlink runtime-image assembly failed (' + exitCode
                    + '):\n' + output)
        }

        File appModules = new File(imageRoot, 'app-modules')
        copy {
            from delosV1ModularRuntimeJars
            into appModules
        }
        def copied = appModules.listFiles()?.findAll { it.isFile() && it.name.endsWith('.jar') } ?: []
        if (copied.isEmpty()) {
            throw new GradleException('The modular runtime image contains no DelosDB runtime jars')
        }
        new File(imageRoot, 'delosdb-image.properties').withWriter('UTF-8') { writer ->
            writer.println('image.kind=jlink-runtime-image')
            writer.println('application.launch=JPMS-module-path')
            writer.println('application.jar.count=' + copied.size())
            copied.sort { left, right -> left.name <=> right.name }.each { jar ->
                writer.println('application.jar=' + jar.name)
            }
        }
    }
}

