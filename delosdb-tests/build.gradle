// Test-only bridges which need package-private engine seams are compiled as a patch of
// org.apache.derby.engine. They remain test runtime inputs and are never packaged into a
// production artifact. Keep the established task name because existing verification wiring
// already depends on it.
tasks.register('prepareRawStoreInternalTestSupportSources', Sync) {
    from(rawStoreIoFaultInjectionTestSupportSource) {
