        def ratioCsv = new StringBuilder(
                'workload,clients,delosHeapMedianOpsPerSecond,delosMvccMedianOpsPerSecond,' +
                        'upstreamDerbyMedianOpsPerSecond,h2MedianOpsPerSecond,sqliteMedianOpsPerSecond,' +
                        'mvccToHeap,mvccToDerby,mvccToH2,mvccToSqlite,heapToMvcc\n')
        def decision = [
                'Gate 10L-S post-registry five-engine read checkpoint',
                'Architecture: accepted Delos heap fast paths + permanent Delos MVCC current-row + snapshot-lease architecture.',
                'Matrix: HOT/DISJOINT/RANDOM x 1/2/4/8/16 clients x five engines x eight balanced runs.',
                'Measurement authority: pooled median throughput with existing IQR/MAD dispersion report.',
                'Correctness guards frozen before measurement: complete 600-row matrix, identical cross-engine semantic fingerprints (enforced by the benchmark coordinator), identical operation counts within each cell, and zero retryable conflicts.',
                'Performance is diagnostic in this checkpoint: no post-hoc throughput threshold is introduced. Compare this checkpoint with Gate 10L-M and use it together with the clean 10L-R profile to select the next architecture gate.'
        ]

        workloads.each { workload ->
            clients.each { clientCount ->
                def cell = rows.findAll {
                    it.workload == workload && it.clients == clientCount
                }
                if (cell.size() != targets.size() * 8) {
                    failures.add("${workload} ${clientCount}c expected 40 rows, found ${cell.size()}")
                    return
                }

                def operationCounts = cell.collect { Long.parseLong(it.measuredOperations) }.unique()
                if (operationCounts.size() != 1) {
                    failures.add("${workload} ${clientCount}c measured operation counts differ: ${operationCounts}")
                }
                def retryCount = cell.sum { Long.parseLong(it.retryableConflictRetries) } as long
                if (retryCount != 0L) {
                    failures.add("${workload} ${clientCount}c observed ${retryCount} retryable conflicts")
                }

                def medians = [:]
                targets.each { target ->
                    def targetRows = cell.findAll { it.target == target }
                    if (targetRows.size() != 8) {
                        failures.add("${workload} ${clientCount}c ${target} expected 8 runs, found ${targetRows.size()}")
                    } else {
                        medians[target] = median(targetRows.collect {
                            Double.parseDouble(it.operationsPerSecond)
                        })
                    }
                }
                if (medians.size() == targets.size()) {
                    double heap = medians.delos_heap as double
                    double mvcc = medians.delos_mvcc as double
                    double derby = medians.upstream_derby as double
                    double h2 = medians.h2 as double
                    double sqlite = medians.sqlite as double
                    ratioCsv.append(workload).append(',').append(clientCount).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', heap)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', mvcc)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', derby)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', h2)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', sqlite)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', mvcc / heap)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', mvcc / derby)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', mvcc / h2)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', mvcc / sqlite)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', heap / mvcc)).append('\n')

                    def summary = String.format(java.util.Locale.ROOT,
                            '%s %sc: heap=%.0f mvcc=%.0f derby=%.0f h2=%.0f sqlite=%.0f ' +
                                    'mvcc/heap=%.3f mvcc/derby=%.3f mvcc/h2=%.3f mvcc/sqlite=%.3f',
                            workload, clientCount, heap, mvcc, derby, h2, sqlite,
                            mvcc / heap, mvcc / derby, mvcc / h2, mvcc / sqlite)
                    decision.add(summary)
                    logger.lifecycle('Gate 10L-S ' + summary)
                }
            }
        }

        new File(root, 'gate10ls-mvcc-cross-engine-ratios.csv').setText(
                ratioCsv.toString(), 'UTF-8')
        File decisionFile = new File(root, 'gate10ls-five-engine-read-checkpoint-decision.txt')
        if (!failures.isEmpty()) {
            decision.add('')
            decision.add('FAIL: ' + failures.join('; '))
            decisionFile.setText(
                    decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            throw new GradleException(
                    'Gate 10L-S five-engine checkpoint correctness guard failed: ' +
                            failures.join('; '))
        }

        def passLine = 'PASS: the fresh five-engine checkpoint matrix is complete and semantically stable with zero retryable conflicts. Compare median/IQR/MAD and cross-engine ratios with Gate 10L-M, then combine that evidence with Gate 10L-R before selecting the next architecture gate.'
        decision.add('')
        decision.add(passLine)
        decisionFile.setText(
                decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10L-S ' + passLine)
    }
}


// Gate 10L-T: post-registry five-engine read-stack decomposition.
// Gate 10L-S showed resident Delos MVCC at approximate heap parity on HOT/DISJOINT,
// while both Delos access methods remain materially behind H2/SQLite. Decompose the
// common JDBC/SQL/read stack before selecting another production optimization.
def gate10ltReadStackRoot =
        'reports/delosdb/benchmarks/gate10lt-five-engine-read-stack-decomposition'

tasks.register('runDelosJdbcGate10ltFiveEngineReadStackDecomposition', JavaExec) { task ->
    group = 'benchmark'
    description = 'Decomposes post-registry read cost across transaction, VALUES, PK-read multiplicity, and RC/RU using all five embedded engines.'
    dependsOn tasks.named('compileTestJava'), ':jars'
    task.mainClass = 'io.github.ggeorg.delosdb.benchmark.jdbc.DelosJdbcCrossEngineConcurrency'
    task.classpath = rootProject.files(derbyTestsClassDir)
    task.outputs.upToDateWhen { false }
    task.outputs.dir(rootProject.layout.buildDirectory.dir(gate10ltReadStackRoot))

    task.doFirst {
        def saneValue = providers.gradleProperty('delosdb.sane')
                .getOrElse('true').trim().toLowerCase(java.util.Locale.ROOT)
        if (saneValue != 'false') {
            throw new GradleException(
                    'Gate 10L-T requires a release build; rerun with -Pdelosdb.sane=false')
        }
        File reportDir = rootProject.layout.buildDirectory.dir(gate10ltReadStackRoot).get().asFile
        File databaseRoot = rootProject.layout.buildDirectory
                .dir('tmp/delos-jdbc-gate10lt-five-engine-read-stack').get().asFile
        project.delete(reportDir)
        project.delete(databaseRoot)
        reportDir.mkdirs()
        databaseRoot.mkdirs()
        def javaExecutable = new File(System.getProperty('java.home'), 'bin/java').absolutePath
        task.systemProperties([
                'delosdb.benchmark.crossEngineConcurrency.sane': saneValue,
                'delosdb.benchmark.crossEngineConcurrency.projectDirectory':
                        rootProject.projectDir.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.javaExecutable': javaExecutable,
                'delosdb.benchmark.crossEngineConcurrency.benchmarkClasses':
                        derbyTestsClassDir.get().asFile.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.delosClasspath':
                        rootProject.files(derbyRuntimeJars).asPath,
                'delosdb.benchmark.crossEngineConcurrency.upstreamDerbyClasspath':
                        upstreamDerbyBenchmarkRuntime.asPath,
                'delosdb.benchmark.crossEngineConcurrency.h2Classpath': h2BenchmarkRuntime.asPath,
                'delosdb.benchmark.crossEngineConcurrency.sqliteClasspath':
                        sqliteBenchmarkRuntime.asPath,
                'delosdb.benchmark.crossEngineConcurrency.targets':
                        'delos_heap,delos_mvcc,upstream_derby,h2,sqlite',
                'delosdb.benchmark.crossEngineConcurrency.databaseRoot': databaseRoot.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.reportDirectory': reportDir.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.rows': '10000',
                'delosdb.benchmark.crossEngineConcurrency.clients': '1,2,4,8,16',
                // Fixed-operation decomposition workloads ignore the generic width.
                'delosdb.benchmark.crossEngineConcurrency.widths': '1',
                'delosdb.benchmark.crossEngineConcurrency.workloads':
                        'EMPTY_TRANSACTION,VALUES_1,VALUES_10,PK_READ_1_RC,PK_READ_10_RC,' +
                                'PK_READ_100_RC,PK_READ_10_RU',
                // Fixed-operation workloads derive transaction count from this budget.
                'delosdb.benchmark.crossEngineConcurrency.transactionsPerClient': '50',
                'delosdb.benchmark.crossEngineConcurrency.fixedWorkloadOperationBudgetPerClient':
                        '20000',
                'delosdb.benchmark.crossEngineConcurrency.payload': '128',
                'delosdb.benchmark.crossEngineConcurrency.fixtureBatch': '100',
                'delosdb.benchmark.crossEngineConcurrency.warmups': '1',
                'delosdb.benchmark.crossEngineConcurrency.iterations': '2',
                // One complete forward/reverse target-order balance block.
                'delosdb.benchmark.crossEngineConcurrency.runs': '4',
                'delosdb.benchmark.crossEngineConcurrency.caseTimeoutSeconds': '180',
                'delosdb.benchmark.crossEngineConcurrency.childHeap': '1g'
        ])
    }

    task.doLast {
        File root = rootProject.layout.buildDirectory.dir(gate10ltReadStackRoot).get().asFile
        File resultsFile = new File(root, 'cross-engine-concurrency-results.csv')
        File dispersionFile = new File(root, 'cross-engine-concurrency-dispersion.csv')
        if (!resultsFile.isFile() || !dispersionFile.isFile()) {
            throw new GradleException('Gate 10L-T missing results or dispersion report')
        }

        def lines = resultsFile.readLines('UTF-8').findAll { !it.trim().isEmpty() }
        if (lines.size() < 2) {
            throw new GradleException('Gate 10L-T merged results contain no measurements')
        }
        def header = (lines[0].split(',', -1) as List).collect {
            it.toString().trim().replace('\uFEFF', '')
        }
        def rows = lines.drop(1).collect { line ->
            def fields = line.split(',', -1)
            if (fields.length != header.size()) {
                throw new GradleException("Gate 10L-T malformed CSV row: ${line}")
            }
            def row = [:]
            header.eachWithIndex { name, index -> row[name] = fields[index].toString().trim() }
            row
        }

        final def targets = ['delos_heap', 'delos_mvcc', 'upstream_derby', 'h2', 'sqlite']
        final def workloads = [
                'EMPTY_TRANSACTION',
                'VALUES_1',
                'VALUES_10',
                'PK_READ_1_RC',
                'PK_READ_10_RC',
                'PK_READ_100_RC',
                'PK_READ_10_RU'
        ]
        final def clients = ['1', '2', '4', '8', '16']
        final int observationsPerCell = 4
        final int expectedRows = targets.size() * workloads.size() * clients.size() * observationsPerCell
        if (rows.size() != expectedRows) {
            throw new GradleException(
                    "Gate 10L-T expected ${expectedRows} measurements but found ${rows.size()}")
        }

        def median = { List<Double> values ->
            def sorted = values.sort(false)
            int size = sorted.size()
            return (size & 1) == 1
                    ? sorted[size / 2]
                    : (sorted[size / 2 - 1] + sorted[size / 2]) / 2.0d
        }

        def failures = []
        def ratioCsv = new StringBuilder(
                'workload,clients,delosHeapMedianOpsPerSecond,delosMvccMedianOpsPerSecond,' +
                        'upstreamDerbyMedianOpsPerSecond,h2MedianOpsPerSecond,sqliteMedianOpsPerSecond,' +
                        'mvccToHeap,heapToH2,mvccToH2,derbyToH2,heapToSqlite,mvccToSqlite\n')
        def decision = [
                'Gate 10L-T post-registry five-engine read-stack decomposition',
                'Purpose: localize the remaining shared Delos read gap after Gate 10L-S established resident MVCC/heap parity.',
                'Layers: EMPTY_TRANSACTION -> VALUES_1/10 -> PK_READ_1/10/100_RC -> PK_READ_10_RU.',
                'Matrix: seven decomposition workloads x 1/2/4/8/16 clients x five engines x four balanced runs.',
                'Measurement authority: pooled median throughput plus the coordinator IQR/MAD dispersion report.',
                'Correctness guards: complete matrix, cross-engine semantic fingerprint validation, identical operation counts within each cell, and zero retryable conflicts.',
                'Performance is diagnostic only. Use the first layer where Delos diverges materially from H2/SQLite to select a focused source/profile gate; do not optimize a downstream layer first.'
        ]

        workloads.each { workload ->
            clients.each { clientCount ->
                def cell = rows.findAll { it.workload == workload && it.clients == clientCount }
                if (cell.size() != targets.size() * observationsPerCell) {
                    failures.add("${workload} ${clientCount}c expected ${targets.size() * observationsPerCell} rows, found ${cell.size()}")
                    return
                }
                def operationCounts = cell.collect { Long.parseLong(it.measuredOperations) }.unique()
                if (operationCounts.size() != 1) {
                    failures.add("${workload} ${clientCount}c measured operation counts differ: ${operationCounts}")
                }
                long retries = cell.sum { Long.parseLong(it.retryableConflictRetries) } as long
                if (retries != 0L) {
                    failures.add("${workload} ${clientCount}c observed ${retries} retryable conflicts")
                }

                def medians = [:]
                targets.each { target ->
                    def targetRows = cell.findAll { it.target == target }
                    if (targetRows.size() != observationsPerCell) {
                        failures.add("${workload} ${clientCount}c ${target} expected ${observationsPerCell} runs, found ${targetRows.size()}")
                    } else {
                        medians[target] = median(targetRows.collect {
                            Double.parseDouble(it.operationsPerSecond)
                        })
                    }
                }
                if (medians.size() == targets.size()) {
                    double heap = medians.delos_heap as double
                    double mvcc = medians.delos_mvcc as double
                    double derby = medians.upstream_derby as double
                    double h2 = medians.h2 as double
                    double sqlite = medians.sqlite as double
                    ratioCsv.append(workload).append(',').append(clientCount).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', heap)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', mvcc)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', derby)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', h2)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', sqlite)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', mvcc / heap)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', heap / h2)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', mvcc / h2)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', derby / h2)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', heap / sqlite)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', mvcc / sqlite)).append('\n')
                    decision.add(String.format(java.util.Locale.ROOT,
                            '%s %sc: heap=%.0f mvcc=%.0f derby=%.0f h2=%.0f sqlite=%.0f ' +
                                    'mvcc/heap=%.3f heap/h2=%.3f mvcc/h2=%.3f derby/h2=%.3f',
                            workload, clientCount, heap, mvcc, derby, h2, sqlite,
                            mvcc / heap, heap / h2, mvcc / h2, derby / h2))
                }
            }
        }

        new File(root, 'gate10lt-five-engine-read-stack-ratios.csv').setText(
                ratioCsv.toString(), 'UTF-8')
        File decisionFile = new File(root, 'gate10lt-five-engine-read-stack-decomposition-decision.txt')
        if (!failures.isEmpty()) {
            decision.add('')
            decision.add('FAIL: ' + failures.join('; '))
            decisionFile.setText(
                    decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            throw new GradleException('Gate 10L-T failed: ' + failures.join('; '))
        }
        decision.add('')
        decision.add('PASS: the five-engine read-stack decomposition matrix is complete and semantically stable with zero retryable conflicts. Inspect the first divergent layer and its IQR/MAD before selecting the next focused profile or production experiment.')
        decisionFile.setText(
                decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10L-T PASS: five-engine read-stack decomposition captured.')
    }
}


// Workload-2 diagnostic: vary Derby's inherited compiler bulk-fetch default without
// changing production code. This measures whether larger index traversal groups
// materially reduce the proven index-to-base range-scan cost.
def rangeBulkFetchSweepRoot = 'reports/delosdb/benchmarks/range-bulk-fetch-sweep'
def rangeBulkFetchSweepSizes = [1, 16, 64, 256, 1024]
def rangeBulkFetchSweepTasks = []

rangeBulkFetchSweepSizes.each { fetchSize ->
    def taskName = "runDelosJdbcRangeBulkFetch${fetchSize}"
    rangeBulkFetchSweepTasks.add(taskName)
    tasks.register(taskName, JavaExec) { task ->
        group = 'benchmark'
        description = "Runs Heap/Derby 1000-row range scans with derby.language.bulkFetchDefault=${fetchSize}."
        dependsOn tasks.named('compileTestJava'), ':jars'

        task.mainClass = 'io.github.ggeorg.delosdb.benchmark.jdbc.DelosJdbcCrossEngineConcurrency'
        task.classpath = rootProject.files(derbyTestsClassDir)
        task.outputs.upToDateWhen { false }
        task.outputs.dir(rootProject.layout.buildDirectory.dir(
                "${rangeBulkFetchSweepRoot}/bulk-${fetchSize}"))

        task.doFirst {
            def saneValue = providers.gradleProperty('delosdb.sane')
                    .getOrElse('true').trim().toLowerCase(java.util.Locale.ROOT)
            if (saneValue != 'false') {
                throw new GradleException(
                        'Range bulk-fetch sweep requires a release build; rerun with -Pdelosdb.sane=false')
            }
            File reportDir = rootProject.layout.buildDirectory
                    .dir("${rangeBulkFetchSweepRoot}/bulk-${fetchSize}").get().asFile
            File databaseRoot = rootProject.layout.buildDirectory
                    .dir("tmp/delos-jdbc-range-bulk-fetch-${fetchSize}").get().asFile
            project.delete(reportDir)
            project.delete(databaseRoot)
            reportDir.mkdirs()
            databaseRoot.mkdirs()
            def javaExecutable = new File(System.getProperty('java.home'), 'bin/java').absolutePath
            task.systemProperties([
                    'delosdb.benchmark.crossEngineConcurrency.sane': saneValue,
                    'delosdb.benchmark.crossEngineConcurrency.projectDirectory':
                            rootProject.projectDir.absolutePath,
                    'delosdb.benchmark.crossEngineConcurrency.javaExecutable': javaExecutable,
                    'delosdb.benchmark.crossEngineConcurrency.benchmarkClasses':
                            derbyTestsClassDir.get().asFile.absolutePath,
                    'delosdb.benchmark.crossEngineConcurrency.delosClasspath':
                            rootProject.files(derbyRuntimeJars).asPath,
                    'delosdb.benchmark.crossEngineConcurrency.targets':
                            'delos_heap,upstream_derby',
                    'delosdb.benchmark.crossEngineConcurrency.rangeBulkFetchDefault':
                            fetchSize.toString(),
                    'delosdb.benchmark.crossEngineConcurrency.databaseRoot':
                            databaseRoot.absolutePath,
                    'delosdb.benchmark.crossEngineConcurrency.reportDirectory':
                            reportDir.absolutePath,
                    'delosdb.benchmark.crossEngineConcurrency.rows': '10000',
                    'delosdb.benchmark.crossEngineConcurrency.clients': '1',
                    'delosdb.benchmark.crossEngineConcurrency.widths': '10',
                    'delosdb.benchmark.crossEngineConcurrency.workloads':
                            'RANGE_SCAN_INDEX_ONLY_1000,RANGE_SCAN_1000',
                    'delosdb.benchmark.crossEngineConcurrency.transactionsPerClient': '1',
                    'delosdb.benchmark.crossEngineConcurrency.fixedWorkloadOperationBudgetPerClient': '0',
                    'delosdb.benchmark.crossEngineConcurrency.rangeScanTargetRowsPerClient':
                            providers.gradleProperty(
                                    'delosdb.benchmark.rangeBulkFetch.targetRowsPerClient')
                                    .getOrElse('2000000'),
                    'delosdb.benchmark.crossEngineConcurrency.rangeScanMinQueriesPerClient': '100',
                    'delosdb.benchmark.crossEngineConcurrency.rangeScanMaxQueriesPerClient': '10000',
                    'delosdb.benchmark.crossEngineConcurrency.payload': '128',
                    'delosdb.benchmark.crossEngineConcurrency.fixtureBatch': '100',
                    'delosdb.benchmark.crossEngineConcurrency.warmups': '2',
                    'delosdb.benchmark.crossEngineConcurrency.iterations': '3',
                    'delosdb.benchmark.crossEngineConcurrency.runs': '4',
                    'delosdb.benchmark.crossEngineConcurrency.caseTimeoutSeconds': '180',
                    'delosdb.benchmark.crossEngineConcurrency.workerTimeoutSeconds': '1800',
                    'delosdb.benchmark.crossEngineConcurrency.childHeap': '1g'
            ])
        }
    }
}

tasks.register('runDelosJdbcRangeBulkFetchSweep') {
    group = 'benchmark'
    description = 'Sweeps Derby inherited bulk-fetch defaults 1/16/64/256/1024 for Heap and upstream Derby range scans.'
    dependsOn rangeBulkFetchSweepTasks.collect { tasks.named(it) }

    doLast {
        File root = rootProject.layout.buildDirectory.dir(rangeBulkFetchSweepRoot).get().asFile
        def rows = []
        rangeBulkFetchSweepSizes.each { fetchSize ->
            File throughput = new File(new File(root, "bulk-${fetchSize}"), 'range-scan-throughput.csv')
            if (!throughput.isFile()) {
                throw new GradleException("Missing range bulk-fetch throughput for ${fetchSize}")
            }
            def lines = throughput.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            def header = lines[0].split(',', -1) as List
            lines.drop(1).each { line ->
                def fields = line.split(',', -1)
                def row = [:]
                header.eachWithIndex { name, index -> row[name] = fields[index].toString().trim() }
                row.bulkFetchDefault = fetchSize.toString()
                rows.add(row)
            }
        }

        StringBuilder out = new StringBuilder(
                'target,workload,bulkFetchDefault,medianRowsPerSecond,q1RowsPerSecond,' +
                        'q3RowsPerSecond,iqrRowsPerSecond,madRowsPerSecond,ratioTo16,percentChangeFrom16\n')
        ['delos_heap', 'upstream_derby'].each { target ->
            ['RANGE_SCAN_INDEX_ONLY_1000', 'RANGE_SCAN_1000'].each { workload ->
                def baseline = rows.find {
                    it.target == target && it.workload == workload && it.bulkFetchDefault == '16'
                }
                if (baseline == null) {
                    throw new GradleException(
                            "Missing bulk-fetch=16 baseline target=${target}, workload=${workload}")
                }
                double baselineRate = Double.parseDouble(baseline.medianRowsPerSecond)
                rangeBulkFetchSweepSizes.each { fetchSize ->
                    def row = rows.find {
                        it.target == target
                                && it.workload == workload
                                && it.bulkFetchDefault == fetchSize.toString()
                    }
                    if (row == null) {
                        throw new GradleException(
                                "Missing bulk-fetch result target=${target}, workload=${workload}, size=${fetchSize}")
                    }
                    double rate = Double.parseDouble(row.medianRowsPerSecond)
                    double ratio = rate / baselineRate
                    out.append(target).append(',')
                            .append(workload).append(',')
                            .append(fetchSize).append(',')
                            .append(row.medianRowsPerSecond).append(',')
                            .append(row.q1RowsPerSecond).append(',')
                            .append(row.q3RowsPerSecond).append(',')
                            .append(row.iqrRowsPerSecond).append(',')
                            .append(row.madRowsPerSecond).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.6f', ratio)).append(',')
                            .append(String.format(java.util.Locale.ROOT, '%.3f',
                                    (ratio - 1.0d) * 100.0d)).append('\n')
                }
            }
        }
        new File(root, 'range-bulk-fetch-sweep.csv').setText(out.toString(), 'UTF-8')
        logger.lifecycle(
                'Range bulk-fetch sweep PASS: inspect range-bulk-fetch-sweep.csv before designing page-local index-to-base fetching.')
    }
}
