    dependsOn 'runVersionCleanupArchitectureProofTest'
    dependsOn ':delosdb-storage-mvcc:runMvccCoreModelTest'
    dependsOn ':delosdb-storage-mvcc:runMvccTableScanModelTest'
    dependsOn ':delosdb-storage-mvcc:runVersionedStorageProviderSpiTest'
    dependsOn 'runExternalSortJvmPolicyProofTest'
}

