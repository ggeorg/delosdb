        def resultsOn = loadCsv('on', 'cross-engine-concurrency-results.csv')
        def countersOff = loadCsv('off', 'workers/mvcc-snapshot-lease-diagnostics-delos_mvcc-run-1.csv')
        def countersOn = loadCsv('on', 'workers/mvcc-snapshot-lease-diagnostics-delos_mvcc-run-1.csv')
        def one = { rows, workload ->
            def matches = rows.findAll { it.workload == workload && it.clients == '16' }
            if (matches.size() != 1) {
                throw new GradleException(
                        "Gate 10L-O2 expected one ${workload} 16c row, found ${matches.size()}")
            }
            matches[0]
        }

        def failures = []
        def decision = [
                'Gate 10L-O2 deterministic MVCC snapshot-lease path proof',
                'Gate 10L-O original frozen JFR criterion remains a formal FAIL because the repeated OFF recording contained fewer than 100 attributed ThreadPark events.',
                'O2 replaces sampled ThreadPark as the proof authority with exact thread-local open/close path counters; JFR is retained only as corroborating evidence.',
                'Frozen O2 contract per workload: OFF lockedCurrentOpens == lockedCloses == measuredTransactions and slotted opens/closes == 0; ON slottedCurrentOpens == slottedCloses == measuredTransactions, locked opens/closes == 0, current slot-claim failures == 0; fingerprints/operations identical; retries == 0.'
        ]

        ['PRIMARY_KEY_READ_HOT', 'PRIMARY_KEY_READ_DISJOINT'].each { workload ->
            def offResult = one(resultsOff, workload)
            def onResult = one(resultsOn, workload)
            def off = one(countersOff, workload)
            def on = one(countersOn, workload)
            long expected = offResult.measuredTransactions as long
            if ((onResult.measuredTransactions as long) != expected) {
                failures.add("${workload} OFF/ON measured transaction count changed")
            }
            if (offResult.semanticFingerprint != onResult.semanticFingerprint) {
                failures.add("${workload} semantic fingerprint changed")
            }
            if (offResult.measuredOperations != onResult.measuredOperations) {
                failures.add("${workload} measured operation count changed")
            }
            if (offResult.retryableConflictRetries != '0' || onResult.retryableConflictRetries != '0') {
                failures.add("${workload} retryable conflicts were non-zero")
            }

            long offLockedOpen = off.lockedCurrentOpens as long
            long offLockedClose = off.lockedCloses as long
            long offSlottedOpen = off.slottedCurrentOpens as long
            long offSlottedClose = off.slottedCloses as long
            long onLockedOpen = on.lockedCurrentOpens as long
            long onLockedClose = on.lockedCloses as long
            long onSlottedOpen = on.slottedCurrentOpens as long
            long onSlottedClose = on.slottedCloses as long
            long onClaimFailures = on.currentSlotClaimFailures as long
            long retainedActivity = (off.lockedRetainedOpens as long)
                    + (off.slottedRetainedOpens as long)
                    + (off.retainedSlotClaimFailures as long)
                    + (on.lockedRetainedOpens as long)
                    + (on.slottedRetainedOpens as long)
                    + (on.retainedSlotClaimFailures as long)

            if (offLockedOpen != expected || offLockedClose != expected) {
                failures.add("${workload} OFF locked lease count expected ${expected}/${expected} but was ${offLockedOpen}/${offLockedClose}")
            }
            if (offSlottedOpen != 0L || offSlottedClose != 0L) {
                failures.add("${workload} OFF unexpectedly used slotted leases")
            }
            if (onLockedOpen != 0L || onLockedClose != 0L) {
                failures.add("${workload} ON used locked snapshot-lease fallback ${onLockedOpen}/${onLockedClose}")
            }
            if (onSlottedOpen != expected || onSlottedClose != expected) {
                failures.add("${workload} ON slotted lease count expected ${expected}/${expected} but was ${onSlottedOpen}/${onSlottedClose}")
            }
            if (onClaimFailures != 0L) {
                failures.add("${workload} ON current slot-claim failures ${onClaimFailures} != 0")
            }
            if (retainedActivity != 0L) {
                failures.add("${workload} benchmark unexpectedly exercised retained-snapshot lease paths")
            }

            double offOps = offResult.operationsPerSecond as double
            double onOps = onResult.operationsPerSecond as double
            decision.add(String.format(java.util.Locale.ROOT,
                    '%s: tx=%d OFF locked=%d/%d ON slotted=%d/%d ON locked=%d/%d claimFailures=%d throughput OFF=%.0f ON=%.0f delta=%+.2f%%',
                    workload, expected,
                    offLockedOpen, offLockedClose,
                    onSlottedOpen, onSlottedClose,
                    onLockedOpen, onLockedClose,
                    onClaimFailures,
                    offOps, onOps, (onOps / offOps - 1.0d) * 100.0d))
        }

        File decisionFile = new File(root, 'gate10lo2-mvcc-snapshot-lease-counter-proof-decision.txt')
        if (!failures.isEmpty()) {
            decision.add('')
            decision.add('FAIL: ' + failures.join('; '))
            decisionFile.setText(decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
            throw new GradleException('Gate 10L-O2 failed: ' + failures.join('; '))
        }
        decision.add('')
        decision.add('PASS: exact runtime counters prove the experimental registry removes the legacy snapshot-lease lock path for the measured HOT/DISJOINT reader transactions with zero fallback. Proceed to balanced OFF/ON performance acceptance; keep the original 10L-O JFR floor recorded as failed.')
        decisionFile.setText(decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10L-O2 PASS: exact snapshot-lease path removability proved.')
    }
}


