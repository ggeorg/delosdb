// Gate 8B: one final exact SAME_TABLE/PRIVATE_TABLE differential profile after
// the B-tree root, CIS Entry mutex, CIS transition gate, and ContainerCache
// entry mutex have all been removed/reduced. This is intentionally profiling
// only; no further Derby modernization is selected until this contrast speaks.
def postGate6hResidualJfrProfiles = [
        [workload: 'SAME_TABLE_DISJOINT', clients: '4'],
        [workload: 'SAME_TABLE_DISJOINT', clients: '8'],
        [workload: 'PRIVATE_TABLE_DISJOINT', clients: '4'],
        [workload: 'PRIVATE_TABLE_DISJOINT', clients: '8']
]

tasks.register('runDelosJdbcPostGate6hResidualLocalityJfr') {
    group = 'benchmark'
    description = 'Profiles the final post-Gate-6H Delos heap same/private residual locality contrast at four and eight clients.'
    dependsOn tasks.named('compileTestJava'), ':jars'
    outputs.upToDateWhen { false }
    def reportDir = rootProject.layout.buildDirectory.dir(
            'reports/delosdb/benchmarks/post-gate6h-residual-locality-jfr')
    outputs.dir(reportDir)

    doLast {
        def saneValue = providers.gradleProperty('delosdb.sane')
                .getOrElse('true')
                .trim()
                .toLowerCase(java.util.Locale.ROOT)
        if (saneValue != 'false') {
            throw new GradleException(
                    'Post-Gate-6H residual locality JFR profiling requires a release build; ' +
                            'rerun with -Pdelosdb.sane=false')
        }

        def output = reportDir.get().asFile
        project.delete(output)
        output.mkdirs()
        def operationBudgetPerClient = providers.gradleProperty(
                'delosdb.benchmark.postGate6hResidual.jfrOperationBudgetPerClient').getOrElse('1000000')
        def iterations = providers.gradleProperty(
                'delosdb.benchmark.postGate6hResidual.jfrIterations').getOrElse('2')
        def javaExecutable = new File(System.getProperty('java.home'), 'bin/java').absolutePath

        postGate6hResidualJfrProfiles.each { profile ->
            def targetOutput = new File(output,
                    "${profile.workload.toLowerCase(java.util.Locale.ROOT)}/${profile.clients}c")
            targetOutput.mkdirs()
            def databaseRoot = rootProject.layout.buildDirectory
                    .dir("tmp/delos-jdbc-post-gate6h-residual-jfr/${profile.workload}/${profile.clients}c")
                    .get().asFile
            project.delete(databaseRoot)
            def jfrFile = new File(targetOutput,
                    "delos_heap-${profile.workload.toLowerCase(java.util.Locale.ROOT)}-${profile.clients}c-x100.jfr")
            new File(targetOutput, 'profile-manifest.txt').text =
                    "DelosDB Gate 8 post-Gate-6H residual locality profile\n" +
                            "Question: what shared-table authority remains after root-read, CIS-entry and ContainerCache-entry serialization are removed?\n" +
                            "Gate 7 clean evidence: DISJOINT Delos heap is 2.57M at 4c, 2.22M at 8c versus H2 7.07M/6.96M.\n" +
                            "Project version: ${rootProject.version}\n" +
                            "JDK: ${System.getProperty('java.runtime.version')}\n" +
                            "OS: ${System.getProperty('os.name')} ${System.getProperty('os.version')} ${System.getProperty('os.arch')}\n" +
                            "Processors: ${Runtime.getRuntime().availableProcessors()}\n" +
                            "target=delos_heap\n" +
                            "workload=${profile.workload}\n" +
                            "clients=${profile.clients}\n" +
                            "operationsPerTransaction=100\n" +
                            "operationBudgetPerClientPerInterval=${operationBudgetPerClient}\n" +
                            "rowsPerFixtureTable=10000\n" +
                            "payloadBytes=128\n" +
                            "warmups=1\n" +
                            "iterations=${iterations}\n" +
                            "isolation=TRANSACTION_READ_COMMITTED\n" +
                            "jfrSettings=profile\n" +
                            "Interpretation: compare SAME vs PRIVATE at each client count and 4c vs 8c within SAME; use differential stacks only.\n"

            def systemProperties = [
                    'delosdb.benchmark.crossEngineConcurrency.sane': saneValue,
                    'delosdb.benchmark.crossEngineConcurrency.target': 'delos_heap',
                    'delosdb.benchmark.crossEngineConcurrency.run': '1',
                    'delosdb.benchmark.crossEngineConcurrency.databaseRoot': databaseRoot.absolutePath,
                    'delosdb.benchmark.crossEngineConcurrency.reportDirectory': targetOutput.absolutePath,
                    'delosdb.benchmark.crossEngineConcurrency.rows': '10000',
                    'delosdb.benchmark.crossEngineConcurrency.clients': profile.clients,
                    'delosdb.benchmark.crossEngineConcurrency.widths': '1',
                    'delosdb.benchmark.crossEngineConcurrency.workloads': profile.workload,
                    'delosdb.benchmark.crossEngineConcurrency.transactionsPerClient': '50',
                    'delosdb.benchmark.crossEngineConcurrency.fixedWorkloadOperationBudgetPerClient': operationBudgetPerClient,
                    'delosdb.benchmark.crossEngineConcurrency.payload': '128',
                    'delosdb.benchmark.crossEngineConcurrency.fixtureBatch': '100',
                    'delosdb.benchmark.crossEngineConcurrency.warmups': '1',
                    'delosdb.benchmark.crossEngineConcurrency.iterations': iterations,
                    'delosdb.benchmark.crossEngineConcurrency.runs': '1',
                    'delosdb.benchmark.crossEngineConcurrency.caseTimeoutSeconds': '600',
                    'delosdb.benchmark.crossEngineConcurrency.childHeap': '1g'
            ]
            def command = [
                    javaExecutable,
                    '-Xms1g',
                    '-Xmx1g',
                    '-XX:+AlwaysPreTouch',
                    '-XX:FlightRecorderOptions=stackdepth=256',
                    "-XX:StartFlightRecording=filename=${jfrFile.absolutePath},settings=profile," +
                            'dumponexit=true,maxsize=512m'
            ]
            systemProperties.each { key, value ->
                command.add("-D${key}=${value}")
            }
            command.addAll([
                    '-cp',
                    rootProject.files(derbyTestsClassDir, derbyRuntimeJars).asPath,
                    'io.github.ggeorg.delosdb.benchmark.jdbc.DelosJdbcCrossEngineConcurrency',
                    'worker'
            ])

            logger.lifecycle(
                    "Profiling post-Gate-6H delos_heap ${profile.workload} ${profile.clients}c x100 with JFR")
            def process = new ProcessBuilder(command.collect { it.toString() }).inheritIO().start()
            def exitCode = process.waitFor()
            if (exitCode != 0) {
                throw new GradleException(
                        "Post-Gate-6H residual JFR worker ${profile.workload}/${profile.clients}c failed with exit code ${exitCode}")
            }
        }

        new File(output, 'profile-matrix.txt').text =
                'DelosDB Gate 8 post-Gate-6H residual locality profile\n' +
                        'Target: delos_heap\n' +
                        'Shapes: SAME_TABLE_DISJOINT and PRIVATE_TABLE_DISJOINT\n' +
                        'Clients: 4 and 8\n' +
                        'All cells: 100 PK reads/transaction, READ_COMMITTED, matched fixture-table count\n' +
                        'Interpretation: identify the residual shared-table authority after accepted Gates 6B/6E/6H.\n'
    }
}

