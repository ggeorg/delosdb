                'delosdb.benchmark.crossEngineConcurrency.workloads':
                        'PRIMARY_KEY_READ_HOT,PRIMARY_KEY_READ_DISJOINT',
                'delosdb.benchmark.crossEngineConcurrency.transactionsPerClient':
                        providers.gradleProperty('delosdb.benchmark.gate10j.operationBudgetPerClient')
                                .getOrElse('500000'),
                'delosdb.benchmark.crossEngineConcurrency.payload': '128',
                'delosdb.benchmark.crossEngineConcurrency.fixtureBatch': '100',
                'delosdb.benchmark.crossEngineConcurrency.warmups': '1',
                'delosdb.benchmark.crossEngineConcurrency.iterations': '2',
                'delosdb.benchmark.crossEngineConcurrency.runs': '1',
                'delosdb.benchmark.crossEngineConcurrency.caseTimeoutSeconds': '300',
                'delosdb.benchmark.crossEngineConcurrency.childHeap': '1g',
                'delosdb.benchmark.crossEngineConcurrency.pageLatchDiagnostics': 'true',
                'delosdb.benchmark.crossEngineConcurrency.btreePointReadPathDiagnostics': 'true',
                'delosdb.benchmark.crossEngineConcurrency.heapPageReadImageDiagnostics': 'true',
                'delosdb.benchmark.crossEngineConcurrency.lockEntryDiagnostics': 'true',
                'delosdb.benchmark.crossEngineConcurrency.lockWaitDiagnostics': 'true'
        ])
    }

    doLast {
        def root = rootProject.layout.buildDirectory
                .dir(gate10jResidualHotLockAuthorityRoot)
                .get().asFile
        def canonicalCsvValue = { value ->
            value == null ? '' : value.toString().trim()
        }
        def canonicalHeader = { value ->
            canonicalCsvValue(value).replace('\uFEFF', '')
        }
        def loadCsv = { File file ->
            if (!file.isFile()) {
                throw new GradleException("Missing Gate 10J report: ${file}")
            }
            def lines = file.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            if (lines.size() < 2) {
                throw new GradleException("Gate 10J report has no measurements: ${file}")
            }
            def header = (lines[0].split(',', -1) as List).collect { canonicalHeader(it) }
            lines.drop(1).collect { line ->
                def fields = line.split(',', -1)
                if (fields.length != header.size()) {
                    throw new GradleException(
                            "Gate 10J malformed CSV row in ${file}: ${line}")
                }
                def row = [:]
                header.eachWithIndex { name, index ->
                    row[name] = canonicalCsvValue(fields[index])
                }
                row
            }
        }

        def measurements = loadCsv(new File(root, 'delos_heap-run-1.csv'))
        def images = loadCsv(new File(
                root, 'heap-page-read-image-diagnostics-delos_heap-run-1.csv'))
        def latches = loadCsv(new File(
                root, 'page-latch-diagnostics-delos_heap-run-1.csv'))
        def btree = loadCsv(new File(
                root, 'btree-point-read-path-diagnostics-delos_heap-run-1.csv'))
        def entries = loadCsv(new File(
                root, 'lock-entry-diagnostics-delos_heap-run-1.csv'))
        def logicalWaits = loadCsv(new File(
                root, 'logical-lock-wait-diagnostics-delos_heap-run-1.csv'))

        if (measurements.size() != 6 || images.size() != 6 || latches.size() != 6
                || btree.size() != 6 || entries.size() != 18 || logicalWaits.size() != 18) {
            throw new GradleException(String.format(java.util.Locale.ROOT,
                    'Gate 10J report cardinality mismatch: measurements=%d images=%d latches=%d btree=%d entries=%d logicalWaits=%d',
                    measurements.size(), images.size(), latches.size(), btree.size(),
                    entries.size(), logicalWaits.size()))
        }

        def key = { row ->
            def workload = canonicalCsvValue(row['workload']).toUpperCase(java.util.Locale.ROOT)
            def clients = Integer.toString(Integer.parseInt(canonicalCsvValue(row['clients'])))
            "${workload}:${clients}".toString()
        }
        def canonicalLockableClass = { row ->
            def name = canonicalCsvValue(row['lockableClass'])
            def simpleName = name.contains('.') ? name.substring(name.lastIndexOf('.') + 1) : name
            if (simpleName.equalsIgnoreCase('RecordId')) {
                return 'RecordId'
            }
            if (simpleName.equalsIgnoreCase('ContainerKey')) {
                return 'ContainerKey'
            }
            if (simpleName.equalsIgnoreCase('Other')) {
                return 'Other'
            }
            name
        }
        def indexUnique = { List rows, String label ->
            def indexed = [:]
            rows.each { row ->
                def rowKey = key(row)
                if (indexed.put(rowKey, row) != null) {
                    throw new GradleException(
                            "Gate 10J duplicate ${label} row for ${rowKey}")
                }
            }
            indexed
        }
        def measurementByKey = indexUnique(measurements, 'measurement')
        def imageByKey = indexUnique(images, 'heap-page-read-image diagnostic')
        def latchByKey = indexUnique(latches, 'page-latch diagnostic')
        def btreeByKey = indexUnique(btree, 'B-tree point-read diagnostic')
        def recordEntryByKey = indexUnique(
                entries.findAll { canonicalLockableClass(it) == 'RecordId' },
                'RecordId lock-entry diagnostic')
        def recordWaitByKey = indexUnique(
                logicalWaits.findAll { canonicalLockableClass(it) == 'RecordId' },
                'RecordId logical-lock-wait diagnostic')

        def workloads = ['PRIMARY_KEY_READ_HOT', 'PRIMARY_KEY_READ_DISJOINT']
        def clientsList = ['4', '8', '16']
        def decision = [
                'Gate 10J residual HOT lock-authority proof',
                'Diagnostic only: no lock-manager optimization is accepted or implied by this task.',
                'Gate 10I-A image enabled; HOT versus DISJOINT at 4c/8c/16c.',
                'Physical guards: image attempts/hits remain ~1/read, fallback <=2%, B-tree leaf physical fetches <=2%, total physical page latches <=2% of reads.'
        ]

        workloads.each { workload ->
            clientsList.each { clients ->
                String k = "${workload}:${clients}".toString()
                def measurement = measurementByKey[k]
                def image = imageByKey[k]
                def latch = latchByKey[k]
                def tree = btreeByKey[k]
                def entry = recordEntryByKey[k]
                def logical = recordWaitByKey[k]
                def missing = []
                if (measurement == null) {
                    missing.add("measurement available=${measurementByKey.keySet().sort()}")
                }
                if (image == null) {
                    missing.add("image available=${imageByKey.keySet().sort()}")
                }
                if (latch == null) {
                    missing.add("latch available=${latchByKey.keySet().sort()}")
                }
                if (tree == null) {
                    missing.add("btree available=${btreeByKey.keySet().sort()}")
                }
                if (entry == null) {
                    def classes = entries.collect { canonicalLockableClass(it) }.unique().sort()
                    missing.add("RecordId-entry available=${recordEntryByKey.keySet().sort()} classes=${classes}")
                }
                if (logical == null) {
                    def classes = logicalWaits.collect { canonicalLockableClass(it) }.unique().sort()
                    missing.add("RecordId-logical-wait available=${recordWaitByKey.keySet().sort()} classes=${classes}")
                }
                if (!missing.isEmpty()) {
                    throw new GradleException(
                            "Gate 10J missing evidence for ${k}: ${missing.join('; ')}")
                }
                if (Long.parseLong(measurement.retryableConflictRetries) != 0L) {
                    throw new GradleException(
                            "Gate 10J ${k} observed retryable conflicts: ${measurement.retryableConflictRetries}")
                }

                long operations = Long.parseLong(measurement.measuredOperations)
                long attempts = Long.parseLong(image.attempts)
                long hits = Long.parseLong(image.hits)
                long fallbacks = Long.parseLong(image.fallbacks)
                long latchRequests = Long.parseLong(latch.latchRequests)
                long leafFetches = Long.parseLong(tree.indexLeafRowFetches)
                double attemptsPerRead = attempts / (double) operations
                double hitsPerRead = hits / (double) operations
                double fallbackRatio = attempts == 0L ? 1.0d : fallbacks / (double) attempts
                double latchesPerRead = latchRequests / (double) operations
                double leafFetchesPerRead = leafFetches / (double) operations

                if (attemptsPerRead < 0.98d || hitsPerRead < 0.98d
                        || fallbackRatio > 0.02d || latchesPerRead > 0.02d
                        || leafFetchesPerRead > 0.02d) {
                    throw new GradleException(String.format(java.util.Locale.ROOT,
                            'Gate 10J %s %sc lost the accepted physical fast path: attempts/read=%.6f hits/read=%.6f fallback=%.6f latches/read=%.6f leafFetches/read=%.6f',
                            workload, clients, attemptsPerRead, hitsPerRead, fallbackRatio,
                            latchesPerRead, leafFetchesPerRead))
                }

                long entryAcquisitions = Long.parseLong(entry.entryAcquisitions)
                long entryContended = Long.parseLong(entry.contendedAcquisitions)
                long entryWaitNanos = Long.parseLong(entry.entryMutexWaitNanos)
                long logicalWaitCount = Long.parseLong(logical.logicalWaits)
                long logicalWaitNanos = Long.parseLong(logical.totalWaitNanos)
                double entryAcquisitionsPerRead = entryAcquisitions / (double) operations
                double entryContendedPercent = entryAcquisitions == 0L
                        ? 0.0d : entryContended * 100.0d / entryAcquisitions
                double entryWaitPerRead = entryWaitNanos / (double) operations
                double logicalWaitsPerRead = logicalWaitCount / (double) operations
                double logicalWaitPerRead = logicalWaitNanos / (double) operations
                double throughput = Double.parseDouble(measurement.operationsPerSecond)

                def line = String.format(java.util.Locale.ROOT,
                        '%s %sc: throughput=%.2f op/s imageHits/read=%.6f latches/read=%.6f leafFetches/read=%.6f RecordIdEntry acquisitions/read=%.6f contended=%.3f%% mutexWait/read=%.1f ns logicalWaits/read=%.9f logicalWait/read=%.1f ns',
                        workload, clients, throughput, hitsPerRead, latchesPerRead,
                        leafFetchesPerRead, entryAcquisitionsPerRead,
                        entryContendedPercent, entryWaitPerRead,
                        logicalWaitsPerRead, logicalWaitPerRead)
                decision.add(line)
                logger.lifecycle('Gate 10J ' + line)
            }
        }

        clientsList.each { clients ->
            def hot = recordEntryByKey["PRIMARY_KEY_READ_HOT:${clients}".toString()]
            def disjoint = recordEntryByKey["PRIMARY_KEY_READ_DISJOINT:${clients}".toString()]
            double hotWait = Double.parseDouble(hot.waitNanosPerOperation)
            double disjointWait = Double.parseDouble(disjoint.waitNanosPerOperation)
            double hotContended = Double.parseDouble(hot.contendedPercent)
            double disjointContended = Double.parseDouble(disjoint.contendedPercent)
            String waitRatio = disjointWait == 0.0d
                    ? (hotWait == 0.0d ? '1.0000' : 'INF')
                    : String.format(java.util.Locale.ROOT, '%.4f', hotWait / disjointWait)
            def compareLine = String.format(java.util.Locale.ROOT,
                    '%sc HOT-vs-DISJOINT RecordId Entry: contentionDelta=%+.3f pp mutexWaitRatio=%s HOTwait=%.1f ns/read DISJOINTwait=%.1f ns/read',
                    clients, hotContended - disjointContended, waitRatio,
                    hotWait, disjointWait)
            decision.add(compareLine)
            logger.lifecycle('Gate 10J ' + compareLine)
        }

        def passLine = 'PASS: Gate 10I-A physical fast-path invariants remain intact. Gate 10J is diagnostic-only; inspect the raw HOT-vs-DISJOINT RecordId Entry-mutex evidence before designing any lock-manager change.'
        decision.add(passLine)
        new File(root, 'gate10j-decision.txt').setText(
                decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10J ' + passLine)
    }
}

// Gate 10K-B: retain promoted compatible HOT RecordId RS2 reader
// bookkeeping from the per-Lockable Entry mutex. The fast control is adaptive:
// it is installed only after a second overlapping RS2 compatibility space and
// materializes back into Derby's ordinary LockControl before any other mode.
def gate10kFastRecordReadRoot =
        'reports/delosdb/benchmarks/gate10k-fast-record-read-mechanism'

tasks.register('runDelosJdbcGate10kFastRecordReadMechanismProof', JavaExec) { JavaExec task ->
    group = 'benchmark'
    description = 'Proves the adaptive compatible RecordId RS2 fast path removes HOT Entry-mutex bookkeeping without changing DISJOINT or physical read authority.'
    dependsOn tasks.named('compileTestJava'), tasks.named('compileRawStoreInternalTestSupport'), ':jars'

    mainClass = 'io.github.ggeorg.delosdb.benchmark.jdbc.DelosJdbcCrossEngineConcurrency'
    classpath = rootProject.files(
            derbyTestsClassDir,
            rawStoreInternalTestSupportClassDir,
            derbyRuntimeJars)
    args 'worker'
    outputs.upToDateWhen { false }
    outputs.dir(rootProject.layout.buildDirectory.dir(gate10kFastRecordReadRoot))

    doFirst {
        def saneValue = providers.gradleProperty('delosdb.sane')
                .getOrElse('true')
                .trim()
                .toLowerCase(java.util.Locale.ROOT)
        if (saneValue != 'false') {
            throw new GradleException(
                    'Gate 10K-B dormant RecordId read proof requires a release build; ' +
                            'rerun with -Pdelosdb.sane=false')
        }
        def reportDir = rootProject.layout.buildDirectory
                .dir(gate10kFastRecordReadRoot).get().asFile
        def databaseRoot = rootProject.layout.buildDirectory
                .dir('tmp/delos-jdbc-gate10k-fast-record-read').get().asFile
        project.delete(reportDir)
        project.delete(databaseRoot)
        reportDir.mkdirs()
        databaseRoot.mkdirs()

        task.systemProperties([
                'delosdb.experimental.heapPageReadImage': 'true',
                'delosdb.experimental.fastRecordReadLock': 'true',
                'delosdb.diagnostic.heapPageReadImage': 'true',
                'delosdb.diagnostic.pageLatch': 'true',
                'delosdb.diagnostic.btreePointReadPath': 'true',
                'delosdb.diagnostic.lockEntry': 'true',
                'delosdb.diagnostic.lockWait': 'true',
                'delosdb.diagnostic.hotState': 'true',
                'delosdb.benchmark.crossEngineConcurrency.sane': saneValue,
                'delosdb.benchmark.crossEngineConcurrency.target': 'delos_heap',
                'delosdb.benchmark.crossEngineConcurrency.targets': 'delos_heap',
                'delosdb.benchmark.crossEngineConcurrency.run': '1',
                'delosdb.benchmark.crossEngineConcurrency.projectDirectory':
                        rootProject.projectDir.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.javaExecutable':
                        new File(System.getProperty('java.home'), 'bin/java').absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.benchmarkClasses':
                        derbyTestsClassDir.get().asFile.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.delosClasspath':
                        rootProject.files(derbyRuntimeJars).asPath,
                'delosdb.benchmark.crossEngineConcurrency.databaseRoot': databaseRoot.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.reportDirectory': reportDir.absolutePath,
                'delosdb.benchmark.crossEngineConcurrency.rows': '10000',
                'delosdb.benchmark.crossEngineConcurrency.clients': '4,8,16',
                'delosdb.benchmark.crossEngineConcurrency.widths': '1',
                'delosdb.benchmark.crossEngineConcurrency.workloads':
                        'PRIMARY_KEY_READ_HOT,PRIMARY_KEY_READ_DISJOINT',
                'delosdb.benchmark.crossEngineConcurrency.transactionsPerClient':
                        providers.gradleProperty('delosdb.benchmark.gate10k.operationBudgetPerClient')
                                .getOrElse('500000'),
                'delosdb.benchmark.crossEngineConcurrency.payload': '128',
                'delosdb.benchmark.crossEngineConcurrency.fixtureBatch': '100',
                'delosdb.benchmark.crossEngineConcurrency.warmups': '1',
                'delosdb.benchmark.crossEngineConcurrency.iterations': '2',
                'delosdb.benchmark.crossEngineConcurrency.runs': '1',
                'delosdb.benchmark.crossEngineConcurrency.caseTimeoutSeconds': '300',
                'delosdb.benchmark.crossEngineConcurrency.childHeap': '1g',
                'delosdb.benchmark.crossEngineConcurrency.pageLatchDiagnostics': 'true',
                'delosdb.benchmark.crossEngineConcurrency.btreePointReadPathDiagnostics': 'true',
                'delosdb.benchmark.crossEngineConcurrency.heapPageReadImageDiagnostics': 'true',
                'delosdb.benchmark.crossEngineConcurrency.lockEntryDiagnostics': 'true',
                'delosdb.benchmark.crossEngineConcurrency.lockWaitDiagnostics': 'true',
                'delosdb.benchmark.crossEngineConcurrency.hotStateDiagnostics': 'true'
        ])
    }

    doLast {
        def root = rootProject.layout.buildDirectory.dir(gate10kFastRecordReadRoot).get().asFile
        def loadCsv = { File file ->
            if (!file.isFile()) {
                throw new GradleException("Missing Gate 10K-B report: ${file}")
            }
            def lines = file.readLines('UTF-8').findAll { !it.trim().isEmpty() }
            if (lines.size() < 2) {
                throw new GradleException("Gate 10K-B report has no measurements: ${file}")
            }
            def header = (lines[0].split(',', -1) as List).collect {
                it.toString().trim().replace('\uFEFF', '')
            }
            lines.drop(1).collect { line ->
                def fields = line.split(',', -1)
                if (fields.length != header.size()) {
                    throw new GradleException("Gate 10K-B malformed CSV row in ${file}: ${line}")
                }
                def row = [:]
                header.eachWithIndex { name, index -> row[name] = fields[index].toString().trim() }
                row
            }
        }
        def key = { row ->
            "${row.workload.toUpperCase(java.util.Locale.ROOT)}:${Integer.parseInt(row.clients)}".toString()
        }
        def indexUnique = { List rows, String label ->
            def indexed = [:]
            rows.each { row ->
                String rowKey = key(row)
                if (indexed.put(rowKey, row) != null) {
                    throw new GradleException("Gate 10K-B duplicate ${label} row for ${rowKey}")
                }
            }
            indexed
        }

        def measurements = loadCsv(new File(root, 'delos_heap-run-1.csv'))
        def images = loadCsv(new File(root, 'heap-page-read-image-diagnostics-delos_heap-run-1.csv'))
        def latches = loadCsv(new File(root, 'page-latch-diagnostics-delos_heap-run-1.csv'))
        def btree = loadCsv(new File(root, 'btree-point-read-path-diagnostics-delos_heap-run-1.csv'))
        def entries = loadCsv(new File(root, 'lock-entry-diagnostics-delos_heap-run-1.csv'))
        def logicalWaits = loadCsv(new File(root, 'logical-lock-wait-diagnostics-delos_heap-run-1.csv'))
        def hotState = loadCsv(new File(root, 'hot-state-diagnostics-delos_heap-run-1.csv'))

        if (measurements.size() != 6 || images.size() != 6 || latches.size() != 6
                || btree.size() != 6 || entries.size() != 18 || logicalWaits.size() != 18) {
            throw new GradleException(String.format(java.util.Locale.ROOT,
                    'Gate 10K-B report cardinality mismatch: measurements=%d images=%d latches=%d btree=%d entries=%d logicalWaits=%d',
                    measurements.size(), images.size(), latches.size(), btree.size(),
                    entries.size(), logicalWaits.size()))
        }

        def measurementByKey = indexUnique(measurements, 'measurement')
        def imageByKey = indexUnique(images, 'image')
        def latchByKey = indexUnique(latches, 'latch')
        def btreeByKey = indexUnique(btree, 'btree')
        def recordEntryByKey = indexUnique(
                entries.findAll { it.lockableClass.endsWith('RecordId') }, 'RecordId entry')
        def recordWaitByKey = indexUnique(
                logicalWaits.findAll { it.lockableClass.endsWith('RecordId') }, 'RecordId wait')
        def fastMetric = { String workload, String clients, String metric ->
            def row = hotState.find {
                it.workload == workload && it.clients == clients
                        && it.component == 'FastRecordReadControl' && it.metric == metric
            }
            if (row == null) {
                throw new GradleException(
                        "Gate 10K-B missing FastRecordReadControl metric ${metric} for ${workload}:${clients}")
            }
            Long.parseLong(row.value)
        }

        def decision = [
                'Gate 10K-B dormant compatible RecordId RS2 mechanism proof',
                'Experimental feature: delosdb.experimental.fastRecordReadLock=true; promoted HOT controls remain dormant/reusable across empty gaps.',
                'Measured promotions may be zero when warmup established the reusable HOT control; measured fast hits and Entry-mutex removal remain authoritative.',
                'Mechanism-only gate: performance acceptance requires a later balanced OFF/ON proof.'
        ]
        ['PRIMARY_KEY_READ_HOT', 'PRIMARY_KEY_READ_DISJOINT'].each { workload ->
            ['4', '8', '16'].each { clients ->
                String k = "${workload}:${clients}".toString()
                def measurement = measurementByKey[k]
                def image = imageByKey[k]
                def latch = latchByKey[k]
                def tree = btreeByKey[k]
                def entry = recordEntryByKey[k]
                def logical = recordWaitByKey[k]
                if ([measurement, image, latch, tree, entry, logical].any { it == null }) {
                    throw new GradleException("Gate 10K-B missing evidence for ${k}")
                }
                long operations = Long.parseLong(measurement.measuredOperations)
                if (Long.parseLong(measurement.retryableConflictRetries) != 0L) {
                    throw new GradleException("Gate 10K-B ${k} observed retryable conflicts")
                }
                double imageHits = Long.parseLong(image.hits) / (double) operations
                double fallbacks = Long.parseLong(image.attempts) == 0L ? 1.0d
                        : Long.parseLong(image.fallbacks) / (double) Long.parseLong(image.attempts)
                double latchesPerRead = Long.parseLong(latch.latchRequests) / (double) operations
                double leafFetchesPerRead = Long.parseLong(tree.indexLeafRowFetches) / (double) operations
                if (imageHits < 0.98d || fallbacks > 0.02d
                        || latchesPerRead > 0.02d || leafFetchesPerRead > 0.02d) {
                    throw new GradleException(String.format(java.util.Locale.ROOT,
                            'Gate 10K-B %s lost accepted physical path: imageHits/read=%.6f fallback=%.6f latches/read=%.6f leafFetches/read=%.6f',
                            k, imageHits, fallbacks, latchesPerRead, leafFetchesPerRead))
                }
                if (Long.parseLong(logical.logicalWaits) != 0L) {
                    throw new GradleException(
                            "Gate 10K-B ${k} observed logical RecordId waiting: ${logical.logicalWaits}")
                }

                double entryAcquisitionsPerRead =
                        Long.parseLong(entry.entryAcquisitions) / (double) operations
                double entryWaitPerRead =
                        Long.parseLong(entry.entryMutexWaitNanos) / (double) operations
                long promotions = fastMetric(workload, clients, 'promotions')
                long acquireHits = fastMetric(workload, clients, 'acquireHits')
                long releaseHits = fastMetric(workload, clients, 'releaseHits')
                long freezes = fastMetric(workload, clients, 'freezes')
                long retirements = fastMetric(workload, clients, 'retirements')
                double acquireHitsPerRead = acquireHits / (double) operations
                double releaseHitsPerRead = releaseHits / (double) operations
                double throughput = Double.parseDouble(measurement.operationsPerSecond)

                if (workload == 'PRIMARY_KEY_READ_HOT' && (clients == '8' || clients == '16')) {
                    double promotionsPerRead = promotions / (double) operations
                    double freezesPerRead = freezes / (double) operations
                    // A reusable HOT control may be promoted during the warmup and then
                    // survive into the measured interval. In that healthy steady state the
                    // measured promotion count is legitimately zero; fast hits and the absence
                    // of Entry-mutex acquisitions are the mechanism proof.
                    if (acquireHitsPerRead < 0.90d
                            || releaseHitsPerRead < 0.90d || entryAcquisitionsPerRead > 0.25d
                            || promotionsPerRead > 0.01d || freezesPerRead > 0.01d
                            || retirements != 0L) {
                        throw new GradleException(String.format(java.util.Locale.ROOT,
                                'Gate 10K-B %s mechanism did not establish reusable HOT state: promotions=%d promotions/read=%.6f acquireHits/read=%.6f releaseHits/read=%.6f entryAcquisitions/read=%.6f freezes/read=%.6f retirements=%d',
                                k, promotions, promotionsPerRead, acquireHitsPerRead,
                                releaseHitsPerRead, entryAcquisitionsPerRead, freezesPerRead,
                                retirements))
                    }
                }
                if (workload == 'PRIMARY_KEY_READ_DISJOINT'
                        && (promotions != 0L || acquireHits != 0L || releaseHits != 0L)) {
                    throw new GradleException(String.format(java.util.Locale.ROOT,
                            'Gate 10K-B %s incorrectly entered adaptive HOT-row state: promotions=%d acquireHits=%d releaseHits=%d',
                            k, promotions, acquireHits, releaseHits))
                }

                def line = String.format(java.util.Locale.ROOT,
                        '%s: throughput=%.2f op/s imageHits/read=%.6f latches/read=%.6f leafFetches/read=%.6f RecordIdEntry acquisitions/read=%.6f mutexWait/read=%.1f ns promotions=%d acquireHits/read=%.6f releaseHits/read=%.6f freezes=%d retirements=%d',
                        k, throughput, imageHits, latchesPerRead, leafFetchesPerRead,
                        entryAcquisitionsPerRead, entryWaitPerRead, promotions,
                        acquireHitsPerRead, releaseHitsPerRead, freezes, retirements)
                decision.add(line)
                logger.lifecycle('Gate 10K-B ' + line)
            }
        }

        def pass = 'PASS: dormant/reusable RecordId RS2 fast state entered only after HOT overlap, stayed out of DISJOINT, eliminated promotion/retirement churn, removed the HOT Entry-mutex authority at 8c/16c, and preserved Gate 10I-A physical invariants. Performance acceptance is still pending.'
        decision.add(pass)
        new File(root, 'gate10k-decision.txt').setText(
                decision.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        logger.lifecycle('Gate 10K-B ' + pass)
    }
}


// Gate 10K-C: balanced performance acceptance for the dormant/reusable
// compatible RecordId RS2 fast path. The exact current Delos heap is measured
// with the fast path disabled versus enabled in OFF-A -> ON-A -> ON-B -> OFF-B
// order. Gate 10I-A's immutable heap-page read image remains enabled in both
// modes so the only intended variable is fastRecordReadLock.
def gate10kcFastRecordReadPairedRoot =
