plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

def moduleName = 'org.apache.derby.engine'
def generatedSourceRoot = layout.buildDirectory.dir("generated/sources/${moduleName}")
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")
def generatedProductInfoResourceDir = layout.buildDirectory.dir('generated/resources/product-info')
def generatedServiceResourceDir = layout.buildDirectory.dir('generated/resources/services')
def javaccClasspath = rootProject.files('tools/java/javacc.jar')

def replaceInFile = { File file, Closure<String> transform ->
    file.text = transform(file.text)
}

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

configurations {
    enginePatch {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    derbyEngineClasses {
        canBeConsumed = true
        canBeResolved = false
    }
}

dependencies {
    implementation project(':delosdb-commons')
    implementation project(':delosdb-engine-api')
    implementation project(':delosdb-spi')
    implementation "org.ow2.asm:asm:${rootProject.ext.asmVersion}"
    compileOnly project(':delosdb-osgi-stub')

    enginePatch project(':delosdb-storage-api')
    enginePatch project(':delosdb-derby-store-api')
}

def storageImplementationPatch = files(
        rootProject.file('delosdb-storage-derby/build/classes/main'),
        rootProject.file('delosdb-storage-derby/build/resources/main'),
        rootProject.file('delosdb-storage-bridge/build/classes/main'),
        rootProject.file('delosdb-storage-bridge/build/resources/main'))

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir generatedSourceRoot
            destinationDirectory.set(moduleClassDir)
        }
        resources {
            setSrcDirs([])
        }
    }
}

tasks.register('generateSqlParser', JavaExec) {
    def outputDir = generatedSourceRoot.map {
        it.dir('org/apache/derby/impl/sql/compile')
    }
    inputs.file(rootProject.file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/sqlgrammar.jj'))
    outputs.dir(outputDir)
    classpath = javaccClasspath
    mainClass = 'javacc'
    workingDir = rootProject.file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile')
    args "-OUTPUT_DIRECTORY=${outputDir.get().asFile.absolutePath}", 'sqlgrammar.jj'
    doFirst {
        delete outputDir
        outputDir.get().asFile.mkdirs()
    }
    doLast {
        ['CharStream.java', 'ParseException.java', 'Token.java'].each {
            delete new File(outputDir.get().asFile, it)
        }
        ['SQLParser.java', 'SQLParserConstants.java', 'SQLParserTokenManager.java', 'TokenMgrError.java'].each {
            def generated = new File(outputDir.get().asFile, it)
            if (generated.exists()) {
                replaceInFile(generated) { text -> text.replaceAll('(?m)^public (class|interface)', '$1') }
            }
        }
        def parser = new File(outputDir.get().asFile, 'SQLParser.java')
        if (parser.exists()) {
            replaceInFile(parser) { text -> text.replace('tokenImage', 'SQLParserConstants.tokenImage') }
        }
    }
}

// Engine owns the embedded-engine runtime resources. Root-level Derby resource
// tasks still generate messages and JDBC metadata, but they no longer copy the
// engine's ordinary resources or product-info file into this module's classes.
def registerProductInfoTask = { String taskName, String resourcePath, String technologyName, String productFile ->
    def outputFile = generatedProductInfoResourceDir.map { it.file(resourcePath) }
    tasks.register(taskName) {
        outputs.file(outputFile)
        doLast {
            def target = outputFile.get().asFile
            target.parentFile.mkdirs()
            target.text = """# Generated by Gradle. Do not edit.
derby.version.major=10
derby.version.minor=17
derby.version.maint=1000000
derby.version.drdamaint=0
derby.build.number=${rootProject.ext.buildNumberProvider.get()}
derby.product.technology.name=${technologyName}
derby.product.external.name=DelosDB
derby.product.external.version=${rootProject.ext.delosDbVersion}
delosdb.version=${rootProject.ext.delosDbVersion}
derby.version.beta=false
derby.product.vendor=DelosDB Project
derby.product.file=${productFile}
"""
        }
    }
}

registerProductInfoTask(
        'generateEngineInfoProperties',
        'org/apache/derby/info/engine/info.properties',
        'DelosDB Embedded Engine',
        'derby.jar')

tasks.register('generateEngineServiceDescriptor') {
    def serviceFile = generatedServiceResourceDir.map { it.file('META-INF/services/java.sql.Driver') }
    outputs.file(serviceFile)
    doLast {
        def target = serviceFile.get().asFile
        target.parentFile.mkdirs()
        target.text = 'org.apache.derby.iapi.jdbc.AutoloadedDriver\n'
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn tasks.named('generateSqlParser')
    inputs.files(configurations.enginePatch).withPropertyName('enginePatch')
    destinationDirectory.set(moduleClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
    doFirst {
        options.compilerArgs.addAll(['--patch-module', "${moduleName}=${configurations.enginePatch.asPath}"])
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('generateEngineInfoProperties'), tasks.named('generateEngineServiceDescriptor')
    destinationDir = moduleClassDir.get().asFile
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from generatedProductInfoResourceDir
    from generatedServiceResourceDir
    from('src/main/resources')
    from('src/main/java') {
        include '**/*.properties'
        include '**/*.policy'
        include '**/*.xml'
        exclude '**/messages.xml'
        exclude '**/*.tmpl'
    }
}

// Compatibility alias used by the root Derby build and extracted modules.
tasks.register('compileDerbyEngine') {
    dependsOn tasks.named('compileJava')
}

artifacts {
    derbyEngineClasses(moduleClassDir) {
        builtBy tasks.named('compileJava')
    }
}

// Compatibility alias retained for existing root build wiring. The generated
// ClassSizeCatalog belongs to delosdb-engine-api, not to the engine classes task.
tasks.register('compileClassSizeCatalog') {
    dependsOn ':delosdb-engine-api:compileDelosDbEngineApiClassSizeCatalog'
}

// Compatibility alias retained because older root wiring referred to this task.
tasks.register('copyEngineServiceDescriptors') {
    dependsOn tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('compileJava'), tasks.named('processResources')
}

def engineArchiveName = 'derby.jar'

tasks.named('jar', Jar) {
    dependsOn ':splitEngineMessages', ':generateOdbcMetadata', ':ensureCatalogMetadataResources'
    archiveFileName = 'delosdb-engine.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Embedded Engine')
    }
}

// Compatibility runtime jar used by the root `jars` task. It remains the full
// Derby-compatible derby.jar, including patched store classes and generated
// Derby runtime resources.
tasks.register('derbyJar', Jar) {
    dependsOn tasks.named('compileJava'), tasks.named('processResources'), tasks.named('compileClassSizeCatalog'),
            ':splitEngineMessages', ':generateOdbcMetadata', ':ensureCatalogMetadataResources',
            ':delosdb-storage-api:compileStorageApi',
            ':delosdb-derby-store-api:compileDerbyStoreApi',
            ':delosdb-storage-derby:compileLegacyDerbyStorage',
            ':delosdb-storage-derby:processResources',
            ':delosdb-storage-bridge:compileStorageBridge',
            ':delosdb-storage-bridge:processResources'
    archiveFileName = engineArchiveName
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from moduleClassDir
    from({ configurations.enginePatch.collect { it.isDirectory() ? it : zipTree(it) } }) {
        include 'org/apache/derby/iapi/store/types/**'
        include 'org/apache/derby/iapi/store/**'
        exclude 'META-INF/MANIFEST.MF'
        exclude 'module-info.class'
    }
    from(storageImplementationPatch) {
        include 'org/apache/derby/impl/store/**'
        include 'META-INF/services/org.apache.derby.iapi.store.access.conglomerate.ExternalAccessMethodProvider'
        include 'META-INF/services/org.apache.derby.iapi.store.types.StoreRowLocationFactory'
        include 'META-INF/services/org.apache.derby.iapi.store.types.DelosStorageDiagnostics'
        exclude 'META-INF/MANIFEST.MF'
        exclude 'module-info.class'
    }
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Embedded Engine')
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('derbyJar')
}

tasks.named('check') {
    dependsOn tasks.named('classes')
}
