plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

def moduleName = 'org.apache.derby.engine'
def sourceRoot = rootProject.file('delosdb-engine/src/main/java')
def resourceRoot = rootProject.file('delosdb-engine/src/main/resources')
def generatedSourceRoot = layout.buildDirectory.dir("generated/sources/${moduleName}")
def rootGeneratedSourceRoot = rootProject.layout.buildDirectory.dir("generated/sources/${moduleName}")
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")

// Use exact compile task dependencies but plain output locations. Do not resolve
// cross-project task providers while this project is being evaluated: several
// sibling projects have not registered their tasks yet. Also do not depend on
// lifecycle tasks such as :classes, because lifecycle wiring may
// build the generated ClassSizeCatalog and re-enter compileDerbyEngine.
def commonsModuleClassDir = rootProject.project(':delosdb-commons').layout.buildDirectory.dir('classes/modules/org.apache.derby.commons')
def engineApiModuleClassDir = rootProject.project(':delosdb-engine-api').layout.buildDirectory.dir('classes/modules/io.github.ggeorg.delosdb.engine.api')
def osgiModuleClassDir = rootProject.project(':delosdb-osgi-stub').layout.buildDirectory.dir('classes/modules/org.osgi.framework')
def spiModuleClassDir = rootProject.project(':delosdb-spi').layout.buildDirectory.dir('classes/spi')
def storageDerbyClassDir = rootProject.project(':delosdb-storage-derby').layout.buildDirectory.dir('classes/main')
def storeApiClassDir = rootProject.project(':delosdb-derby-store-api').layout.buildDirectory.dir('classes/store-api')
def engineStorageApiClassDir = rootProject.project(':delosdb-engine-storage-api').layout.buildDirectory.dir('classes/engine-storage-api')
def javaccClasspath = rootProject.files('tools/java/javacc.jar')

def replaceInFile = { File file, Closure<String> transform ->
    file.text = transform(file.text)
}

tasks.register('generateSqlParser', JavaExec) {
    def outputDir = generatedSourceRoot.map {
        it.dir('org/apache/derby/impl/sql/compile')
    }
    inputs.file(rootProject.file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/sqlgrammar.jj'))
    outputs.dir(outputDir)
    classpath = javaccClasspath
    mainClass = 'javacc'
    workingDir = rootProject.file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile')
    args "-OUTPUT_DIRECTORY=${outputDir.get().asFile.absolutePath}", 'sqlgrammar.jj'
    doFirst {
        delete outputDir
        outputDir.get().asFile.mkdirs()
    }
    doLast {
        ['CharStream.java', 'ParseException.java', 'Token.java'].each {
            delete new File(outputDir.get().asFile, it)
        }
        ['SQLParser.java', 'SQLParserConstants.java', 'SQLParserTokenManager.java', 'TokenMgrError.java'].each {
            def generated = new File(outputDir.get().asFile, it)
            if (generated.exists()) {
                replaceInFile(generated) { text -> text.replaceAll('(?m)^public (class|interface)', '$1') }
            }
        }
        def parser = new File(outputDir.get().asFile, 'SQLParser.java')
        if (parser.exists()) {
            replaceInFile(parser) { text -> text.replace('tokenImage', 'SQLParserConstants.tokenImage') }
        }
    }
}

tasks.register('compileDerbyEngine', JavaCompile) {
    dependsOn ':delosdb-osgi-stub:compileOsgiStubs', ':delosdb-commons:compileDerbyCommons', ':delosdb-engine-api:compileDelosDbEngineApi', ':delosdb-spi:compileDelosDbSpi', ':delosdb-engine-storage-api:compileEngineStorageApi', ':delosdb-derby-store-api:compileDerbyStoreApi', ':delosdb-storage-derby:compileLegacyDerbyStorage', 'generateSqlParser'
    source = files(
            fileTree(sourceRoot) { include '**/*.java' },
            fileTree(generatedSourceRoot.get().asFile) { include '**/*.java' }
    )
    destinationDirectory = moduleClassDir
    rootProject.ext.delosdbConfigureJavaCompile(delegate, [
            osgiModuleClassDir,
            commonsModuleClassDir,
            engineApiModuleClassDir,
            spiModuleClassDir,
            rootProject.configurations.delosdbAsm
    ])
    doFirst {
        def patchPath = rootProject.files(engineStorageApiClassDir, storeApiClassDir, storageDerbyClassDir).asPath
        options.compilerArgs.addAll(['--patch-module', "${moduleName}=${patchPath}"])
    }
}


tasks.register('copyEngineServiceDescriptors', Copy) {
    dependsOn 'compileDerbyEngine'
    from(resourceRoot) {
        include 'META-INF/services/**'
    }
    into moduleClassDir
}

tasks.register('compileClassSizeCatalog') {
    dependsOn ':delosdb-engine-api:compileDelosDbEngineApiClassSizeCatalog'
}

tasks.register('classes') {
    dependsOn 'compileDerbyEngine', 'compileClassSizeCatalog', 'copyEngineServiceDescriptors'
}







tasks.named('assemble') {
    dependsOn 'classes'
}


def engineArchiveName = 'derby.jar'

tasks.register('derbyJar', Jar) {
    dependsOn 'compileDerbyEngine', 'compileClassSizeCatalog', 'copyEngineServiceDescriptors', ':processDerbyResources', ':splitEngineMessages', ':generateOdbcMetadata', ':delosdb-engine-storage-api:compileEngineStorageApi', ':delosdb-derby-store-api:compileDerbyStoreApi', ':delosdb-storage-derby:compileLegacyDerbyStorage'
    archiveFileName = engineArchiveName
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from moduleClassDir
    from(engineStorageApiClassDir) {
        include 'org/apache/derby/iapi/store/types/**'
    }
    from(storeApiClassDir) {
        include 'org/apache/derby/iapi/store/**'
    }
    from(storageDerbyClassDir) {
        include 'org/apache/derby/impl/store/**'
    }
    from(sourceRoot) {
        include '**/*.properties'
        include '**/*.policy'
        include '**/*.xml'
        exclude '**/messages.xml'
        exclude '**/*.tmpl'
    }
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Embedded Engine')
    }
}

tasks.named('assemble') {
    dependsOn 'derbyJar'
}
