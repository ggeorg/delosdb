plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.file.FileSystemOperations
import javax.inject.Inject
import java.nio.file.Files
import java.util.zip.ZipFile


abstract class DelosDbEngineBuildServices {
    @Inject
    abstract FileSystemOperations getFileSystemOperations()
}

version = rootProject.version
group = rootProject.group

def moduleName = 'org.apache.derby.engine'
def generatedSourceRoot = layout.buildDirectory.dir("generated/sources/${moduleName}")
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")
def javaccClasspath = rootProject.files('tools/java/javacc.jar')
def engineBuildServices = objects.newInstance(DelosDbEngineBuildServices)

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

configurations {
    derbyEngineClasses {
        canBeConsumed = true
        canBeResolved = false
    }
}

dependencies {
    implementation project(':delosdb-commons')
    implementation project(':delosdb-spi')
    // ClassFileJava uses java.lang.classfile from java.base; no external bytecode library.
    compileOnly project(':delosdb-osgi-stub')
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir generatedSourceRoot
            destinationDirectory.set(moduleClassDir)
        }
        resources {
            setSrcDirs([])
        }
    }
}

tasks.register('generateSqlParser', JavaExec) {
    def outputDir = generatedSourceRoot.map {
        it.dir('org/apache/derby/impl/sql/compile')
    }
    inputs.file(rootProject.file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/sqlgrammar.jj'))
    outputs.dir(outputDir)
    classpath = javaccClasspath
    mainClass = 'javacc'
    workingDir = rootProject.file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile')
    args "-OUTPUT_DIRECTORY=${outputDir.get().asFile.absolutePath}", 'sqlgrammar.jj'
    doFirst {
        engineBuildServices.fileSystemOperations.delete {
            delete outputDir
        }
        outputDir.get().asFile.mkdirs()
    }
    doLast {
        ['CharStream.java', 'ParseException.java', 'Token.java'].each {
            Files.deleteIfExists(new File(outputDir.get().asFile, it).toPath())
        }
        ['SQLParser.java', 'SQLParserConstants.java', 'SQLParserTokenManager.java', 'TokenMgrError.java'].each {
            def generated = new File(outputDir.get().asFile, it)
            if (generated.exists()) {
                generated.text = generated.text.replaceAll('(?m)^public (class|interface)', '$1')
            }
        }
        def parser = new File(outputDir.get().asFile, 'SQLParser.java')
        if (parser.exists()) {
            parser.text = parser.text.replace('tokenImage', 'SQLParserConstants.tokenImage')
        }
    }
}

// Engine owns its product metadata and static JDBC service descriptor.
ext.delosdbProductInfo = [
        taskName      : 'generateEngineInfoProperties',
        resourcePath  : 'org/apache/derby/info/engine/info.properties',
        technologyName: 'DelosDB Embedded Engine',
        productFile   : 'derby.jar'
]
apply from: rootProject.file('gradle/delosdb-product-info.gradle')

def generatedEngineMessageResourceDir = layout.buildDirectory.dir('generated/resources/messages')
def generatedOdbcResourceDir = layout.buildDirectory.dir('generated/resources/odbc')

tasks.named('compileJava', JavaCompile) {
    dependsOn tasks.named('generateSqlParser')
    destinationDirectory.set(moduleClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.named('processResources') {
    dependsOn project.ext.delosdbProductInfoTask
    dependsOn rootProject.tasks.named('splitEngineMessages')
    dependsOn rootProject.tasks.named('generateOdbcMetadata')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project.ext.delosdbProductInfoResourceDir
    from generatedEngineMessageResourceDir
    from generatedOdbcResourceDir
    from('src/main/resources')
    from('src/main/java') {
        include '**/*.properties'
        include '**/*.policy'
        include '**/*.xml'
        exclude '**/messages.xml'
        exclude '**/*.tmpl'
        // Message sources: splitEngineMessages turns them into the English
        // m<N>_en files here and the translations in the locale jars.
        exclude 'org/apache/derby/loc/messages*.properties'
    }
}

// Compatibility alias used by the root Derby build and extracted modules.
tasks.register('compileDerbyEngine') {
    dependsOn tasks.named('compileJava')
}

artifacts {
    derbyEngineClasses(moduleClassDir) {
        builtBy tasks.named('compileJava')
    }
}

// ClassSizeCatalogImpl is generated by crawling the compiled engine classes
// (root generateClassSizeCatalog), so it is compiled after them and packaged
// into derby.jar.
def generatedClassSizeCatalogClassDir = layout.buildDirectory.dir("classes/generated/${moduleName}/class-size-catalog")
def generatedClassSizeCatalogSource = rootProject.layout.buildDirectory.file(
        "generated/sources/${moduleName}/org/apache/derby/iapi/services/cache/ClassSizeCatalogImpl.java")

tasks.register('compileClassSizeCatalog', JavaCompile) {
    dependsOn tasks.named('compileJava'), ':generateClassSizeCatalog'
    source = files(generatedClassSizeCatalogSource)
    destinationDirectory.set(generatedClassSizeCatalogClassDir)
    classpath = files(moduleClassDir)
    modularity.inferModulePath = false
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.named('classes') {
    dependsOn tasks.named('compileJava'), tasks.named('processResources')
}

class DelosDbEngineJarVerifier {
    static void assertBootResourcesPresent(File jarFile) {
        def requiredEntries = [
                'META-INF/services/java.sql.Driver',
                'org/apache/derby/modules.properties',
                'org/apache/derby/info/engine/info.properties'
        ]
        new ZipFile(jarFile).withCloseable { zip ->
            def missing = requiredEntries.findAll { zip.getEntry(it) == null }
            if (!missing.isEmpty()) {
                throw new org.gradle.api.GradleException("${jarFile.name} is missing required embedded-engine boot resources: ${missing}")
            }

            def serviceEntry = zip.getEntry('META-INF/services/java.sql.Driver')
            def serviceLines = zip.getInputStream(serviceEntry).getText('UTF-8')
                    .readLines()
                    .collect { it.trim() }
                    .findAll { it && !it.startsWith('#') }
            if (!serviceLines.contains('org.apache.derby.iapi.jdbc.AutoloadedDriver')) {
                throw new org.gradle.api.GradleException("${jarFile.name} does not advertise the embedded JDBC driver; found ${serviceLines}")
            }
        }
    }
}

def engineArchiveName = 'derby.jar'

tasks.named('jar', Jar) {
    archiveFileName = 'delosdb-engine.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Embedded Engine', 'delosdb-engine.jar')
    }
    doLast {
        DelosDbEngineJarVerifier.assertBootResourcesPresent(archiveFile.get().asFile)
    }
}

// Compatibility runtime jar used by the root `jars` task. It remains the full
// Derby-compatible derby.jar, including the store classes and generated Derby
// runtime resources.
tasks.register('derbyJar', Jar) {
    dependsOn tasks.named('compileJava'), tasks.named('processResources'), tasks.named('compileClassSizeCatalog')
    archiveFileName = engineArchiveName
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from moduleClassDir
    from generatedClassSizeCatalogClassDir
    from sourceSets.main.output.resourcesDir
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Embedded Engine', engineArchiveName)
    }
    doLast {
        DelosDbEngineJarVerifier.assertBootResourcesPresent(archiveFile.get().asFile)
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('derbyJar')
}

tasks.named('compileTestJava', JavaCompile) {
    modularity.inferModulePath = false
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}

tasks.register('runAccessMethodTransactionLifecycleTest', JavaExec) {
    group = 'verification'
    description = 'Runs the neutral access-method transaction lifecycle contract test.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.apache.derby.impl.store.access.AccessMethodTransactionLifecycleTest'
}

tasks.named('check') {
    dependsOn tasks.named('classes'), tasks.named('runAccessMethodTransactionLifecycleTest')
}
