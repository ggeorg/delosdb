plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

def moduleName = 'org.apache.derby.engine'
def sourceRoot = rootProject.file('delosdb-engine/src/main/java')
def generatedSourceRoot = layout.buildDirectory.dir("generated/sources/${moduleName}")
def rootGeneratedSourceRoot = rootProject.layout.buildDirectory.dir("generated/sources/${moduleName}")
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")
def commonsModuleClassDir = rootProject.project(':delosdb-commons').layout.buildDirectory.dir('classes/modules/org.apache.derby.commons')
def osgiModuleClassDir = rootProject.project(':delosdb-osgi-stub').layout.buildDirectory.dir('classes/modules/org.osgi.framework')
def spiModuleClassDir = rootProject.project(':delosdb-spi').layout.buildDirectory.dir('classes/spi')
def javaccClasspath = rootProject.files('tools/java/javacc.jar')

def replaceInFile = { File file, Closure<String> transform ->
    file.text = transform(file.text)
}

tasks.register('generateSqlParser', JavaExec) {
    def outputDir = generatedSourceRoot.map {
        it.dir('org/apache/derby/impl/sql/compile')
    }
    inputs.file(rootProject.file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/sqlgrammar.jj'))
    outputs.dir(outputDir)
    classpath = javaccClasspath
    mainClass = 'javacc'
    workingDir = rootProject.file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile')
    args "-OUTPUT_DIRECTORY=${outputDir.get().asFile.absolutePath}", 'sqlgrammar.jj'
    doFirst {
        delete outputDir
        outputDir.get().asFile.mkdirs()
    }
    doLast {
        ['CharStream.java', 'ParseException.java', 'Token.java'].each {
            delete new File(outputDir.get().asFile, it)
        }
        ['SQLParser.java', 'SQLParserConstants.java', 'SQLParserTokenManager.java', 'TokenMgrError.java'].each {
            def generated = new File(outputDir.get().asFile, it)
            if (generated.exists()) {
                replaceInFile(generated) { text -> text.replaceAll('(?m)^public (class|interface)', '$1') }
            }
        }
        def parser = new File(outputDir.get().asFile, 'SQLParser.java')
        if (parser.exists()) {
            replaceInFile(parser) { text -> text.replace('tokenImage', 'SQLParserConstants.tokenImage') }
        }
    }
}

tasks.register('compileDerbyEngine', JavaCompile) {
    dependsOn ':delosdb-osgi-stub:compileOsgiStubs', ':delosdb-commons:compileDerbyCommons', ':delosdb-spi:compileDelosDbSpi', 'generateSqlParser'
    source = files(
            fileTree(sourceRoot) { include '**/*.java' },
            fileTree(generatedSourceRoot.get().asFile) { include '**/*.java' }
    )
    destinationDirectory = moduleClassDir
    rootProject.ext.delosdbConfigureJavaCompile(delegate, [
            osgiModuleClassDir,
            commonsModuleClassDir,
            spiModuleClassDir
    ])
}

tasks.register('compileClassSizeCatalog', JavaCompile) {
    dependsOn 'compileDerbyEngine', ':delosdb-spi:compileDelosDbSpi', ':generateClassSizeCatalog'
    source = files(rootGeneratedSourceRoot.map {
        it.file('org/apache/derby/iapi/services/cache/ClassSizeCatalogImpl.java')
    })
    destinationDirectory = moduleClassDir
    rootProject.ext.delosdbConfigureJavaCompile(delegate, [
            commonsModuleClassDir,
            moduleClassDir,
            osgiModuleClassDir,
            spiModuleClassDir
    ])
}

tasks.register('classes') {
    dependsOn 'compileDerbyEngine', 'compileClassSizeCatalog'
}

tasks.register('verifyCreateIndexProviderMetadataRoundTrip') {
    group = 'verification'
    description = 'Verifies DelosDB CREATE INDEX provider metadata defaults, serializes, and round-trips without provider SPI runtime classes.'
    dependsOn 'compileDerbyEngine'
    inputs.file('src/main/java/org/apache/derby/catalog/IndexDescriptor.java')
    inputs.file('src/main/java/org/apache/derby/catalog/types/IndexDescriptorImpl.java')
    doLast {
        def urls = [
                moduleClassDir.get().asFile,
                commonsModuleClassDir.get().asFile
        ].collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, (ClassLoader) null)
        try {
            def descriptorInterface = Class.forName('org.apache.derby.catalog.IndexDescriptor', true, loader)
            def descriptorClass = Class.forName('org.apache.derby.catalog.types.IndexDescriptorImpl', true, loader)
            def constructor = descriptorClass.getConstructor(
                    String,
                    Boolean.TYPE,
                    Boolean.TYPE,
                    Boolean.TYPE,
                    Boolean.TYPE,
                    int[].class,
                    boolean[].class,
                    Integer.TYPE,
                    String)
            def providerName = { descriptor ->
                if (!descriptorInterface.isInstance(descriptor)) {
                    throw new GradleException("${descriptor.getClass().name} is not an IndexDescriptor")
                }
                descriptorInterface.getMethod('indexProviderName').invoke(descriptor)
            }
            def assertProvider = { descriptor, expected, label ->
                def actual = providerName(descriptor)
                if (actual != expected) {
                    throw new GradleException("${label} provider metadata expected ${expected} but was ${actual}")
                }
            }
            def objectInput = { byte[] bytes ->
                new ObjectInputStream(new ByteArrayInputStream(bytes)) {
                    @Override
                    protected Class<?> resolveClass(ObjectStreamClass desc) throws IOException, ClassNotFoundException {
                        try {
                            return Class.forName(desc.name, false, loader)
                        } catch (ClassNotFoundException ignored) {
                            return super.resolveClass(desc)
                        }
                    }
                }
            }
            def serialize = { object ->
                def bytes = new ByteArrayOutputStream()
                def out = new ObjectOutputStream(bytes)
                out.writeObject(object)
                out.close()
                bytes.toByteArray()
            }
            def roundTrip = { object ->
                def input = objectInput(serialize(object))
                try {
                    return input.readObject()
                } finally {
                    input.close()
                }
            }

            def implicit = constructor.newInstance('BTREE', false, false, false, false,
                    [1] as int[], [true] as boolean[], 1, null)
            assertProvider(implicit, 'btree', 'implicit/default index descriptor')
            assertProvider(roundTrip(implicit), 'btree', 'round-tripped implicit/default index descriptor')

            def explicit = constructor.newInstance('BTREE', false, false, false, false,
                    [1] as int[], [true] as boolean[], 1, 'BTREE')
            assertProvider(explicit, 'btree', 'explicit btree index descriptor')
            assertProvider(roundTrip(explicit), 'btree', 'round-tripped explicit btree index descriptor')


            def hashtableClass = Class.forName('org.apache.derby.iapi.services.io.FormatableHashtable', true, loader)
            def oldCatalogState = hashtableClass.getConstructor().newInstance()
            def putBoolean = hashtableClass.getMethod('putBoolean', Object, Boolean.TYPE)
            def putInt = hashtableClass.getMethod('putInt', Object, Integer.TYPE)
            putBoolean.invoke(oldCatalogState, 'isUnique', false)
            putInt.invoke(oldCatalogState, 'keyLength', 1)
            putInt.invoke(oldCatalogState, 'bcp0', 1)
            putBoolean.invoke(oldCatalogState, 'isAsc0', true)
            putInt.invoke(oldCatalogState, 'orderedColumns', 1)
            hashtableClass.getMethod('put', Object, Object).invoke(oldCatalogState, 'indexType', 'BTREE')

            def legacyDescriptor = descriptorClass.getConstructor().newInstance()
            def legacyInput = objectInput(serialize(oldCatalogState))
            try {
                descriptorClass.getMethod('readExternal', ObjectInput).invoke(legacyDescriptor, legacyInput)
            } finally {
                legacyInput.close()
            }
            assertProvider(legacyDescriptor, 'btree', 'legacy Derby descriptor without provider metadata')
        } finally {
            loader.close()
        }
    }
}


tasks.register('verifyIndexProviderControlledRegistration') {
    group = 'verification'
    description = 'Verifies controlled manual IndexProvider registration without ServiceLoader or public SQL debug providers.'
    dependsOn 'compileDerbyEngine', ':delosdb-spi:compileDelosDbSpi'
    inputs.dir('src/main/java/io/github/ggeorg/delosdb/engine/extension')
    doLast {
        def urls = [
                moduleClassDir.get().asFile,
                commonsModuleClassDir.get().asFile,
                osgiModuleClassDir.get().asFile,
                spiModuleClassDir.get().asFile
        ].collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, (ClassLoader) null)
        try {
            def providerInterface = Class.forName('io.github.ggeorg.delosdb.spi.index.IndexProvider', true, loader)
            def capabilitiesClass = Class.forName('io.github.ggeorg.delosdb.spi.index.IndexCapabilities', true, loader)
            def registryClass = Class.forName('io.github.ggeorg.delosdb.engine.extension.index.IndexProviderRegistry', true, loader)
            def extensionTypeClass = Class.forName('io.github.ggeorg.delosdb.engine.extension.ExtensionType', true, loader)

            def testProvider = java.lang.reflect.Proxy.newProxyInstance(
                    loader,
                    [providerInterface] as Class[],
                    { Object proxy, java.lang.reflect.Method method, Object[] proxyArgs ->
                        switch (method.name) {
                            case 'name':
                                return 'manual_test'
                            case 'capabilities':
                                return capabilitiesClass.getMethod('btree').invoke(null)
                            case 'estimateCost':
                                return java.util.Optional.empty()
                            case 'toString':
                                return 'manual_test IndexProvider'
                            case 'hashCode':
                                return System.identityHashCode(proxy)
                            case 'equals':
                                return proxy.is(proxyArgs == null ? null : proxyArgs[0])
                            default:
                                throw new UnsupportedOperationException(method.toString())
                        }
                    } as java.lang.reflect.InvocationHandler)

            def registry = registryClass.getMethod('empty').invoke(null)
            registryClass.getMethod('registerEnabled', providerInterface, String).invoke(registry, testProvider, 'test-fixture')
            def resolver = registryClass.getMethod('resolver').invoke(registry)
            def resolved = resolver.getClass().getMethod('requireEnabled', String).invoke(resolver, 'manual_test')
            if (!providerInterface.isInstance(resolved)) {
                throw new GradleException('Controlled IndexProvider registration did not resolve through the SPI interface')
            }
            if (providerInterface.getMethod('name').invoke(resolved) != 'manual_test') {
                throw new GradleException('Controlled IndexProvider registration resolved the wrong provider')
            }

            def descriptors = registryClass.getMethod('descriptors').invoke(registry)
            def indexType = Enum.valueOf(extensionTypeClass, 'INDEX')
            def descriptor = descriptors.getClass().getMethod('find', extensionTypeClass, String).invoke(descriptors, indexType, 'manual_test')
            if (!descriptor.isPresent()) {
                throw new GradleException('Controlled IndexProvider registration did not publish an internal descriptor')
            }
            def descriptorValue = descriptor.get()
            def capabilities = descriptorValue.getClass().getMethod('capabilities').invoke(descriptorValue)
            if (capabilities.contains('default-index-provider')) {
                throw new GradleException('Manually registered IndexProvider must not become the Derby-compatible default provider')
            }

            def builtIns = registryClass.getMethod('builtIns').invoke(null)
            def builtInProviders = registryClass.getMethod('providers').invoke(builtIns)
            if (builtInProviders.size() != 1 || providerInterface.getMethod('name').invoke(builtInProviders.get(0)) != 'btree') {
                throw new GradleException('Built-in IndexProvider registry must remain limited to the real btree provider')
            }
        } finally {
            loader.close()
        }
    }
}

tasks.register('verifyDelosDbExtensionRegistrySkeleton') {
    dependsOn 'verifyCreateIndexProviderMetadataRoundTrip', 'verifyIndexProviderControlledRegistration'
    group = 'verification'
    description = 'Verifies the internal DelosDB extension registry skeleton remains contained inside the engine module.'
    dependsOn 'compileDerbyEngine'
    inputs.file('src/main/java/module-info.java')
    inputs.dir('src/main/java/io/github/ggeorg/delosdb/engine/extension')
    doLast {
        def extensionRoot = file('src/main/java/io/github/ggeorg/delosdb/engine/extension')
        [
                'ExtensionRegistry.java',
                'ExtensionDescriptor.java',
                'ExtensionType.java',
                'ExtensionState.java',
                'ExtensionResolutionException.java',
                'InMemoryExtensionRegistry.java',
                'BuiltInExtensions.java',
                'package-info.java',
                'index/BuiltInBTreeIndexProvider.java',
                'index/BuiltInIndexProviders.java',
                'index/IndexProviderResolver.java',
                'index/IndexMetadataBridge.java',
                'index/IndexProviderCapabilityBridge.java',
                'index/IndexProviderCostBridge.java',
                'index/IndexProviderCostDiagnostics.java',
                'index/IndexProviderCostMode.java',
                'index/IndexProviderCostProbe.java',
                'index/IndexProviderRegistry.java',
                'index/package-info.java'
        ].each { sourceName ->
            def sourceFile = new File(extensionRoot, sourceName)
            if (!sourceFile.isFile()) {
                throw new GradleException("Missing internal extension registry source: ${sourceFile}")
            }
        }
        def builtIns = new File(extensionRoot, 'BuiltInExtensions.java').text
        if (!builtIns.contains('BTREE_INDEX_PROVIDER = "btree"')) {
            throw new GradleException('Built-in extension registration must declare the internal btree provider identity')
        }
        if (!builtIns.contains('DEFAULT_INDEX_PROVIDER = BTREE_INDEX_PROVIDER')) {
            throw new GradleException('Built-in extension registration must declare btree as the Derby-compatible default index provider')
        }
        if (!builtIns.contains('BuiltInIndexProviders.all()')) {
            throw new GradleException('Built-in descriptor registration must be derived from built-in index provider adapters')
        }
        def btreeAdapter = new File(extensionRoot, 'index/BuiltInBTreeIndexProvider.java').text
        if (!btreeAdapter.contains('implements IndexProvider')) {
            throw new GradleException('Built-in B-tree adapter must implement the experimental IndexProvider SPI')
        }
        if (!btreeAdapter.contains('return Optional.of(new IndexCostEstimate(')) {
            throw new GradleException('Built-in B-tree adapter must expose a baseline provider-neutral cost estimate')
        }
        if (!btreeAdapter.contains('built-in btree baseline estimate')) {
            throw new GradleException('Built-in B-tree baseline cost estimate must be explainable in diagnostics')
        }
        def indexProviderResolver = new File(extensionRoot, 'index/IndexProviderResolver.java').text
        if (!indexProviderResolver.contains('public static IndexProviderResolver builtIns(ExtensionRegistry registry)')) {
            throw new GradleException('Index provider resolver must expose built-in resolver construction')
        }
        if (!indexProviderResolver.contains('requireEnabled(String name)')) {
            throw new GradleException('Index provider resolver must provide checked enabled-provider resolution')
        }
        if (!indexProviderResolver.contains('requireDefault()')) {
            throw new GradleException('Index provider resolver must expose Derby-compatible default provider resolution')
        }
        if (!indexProviderResolver.contains('ExtensionResolutionException')) {
            throw new GradleException('Index provider resolver must fail with internal extension resolution diagnostics')
        }
        def builtInIndexProviders = new File(extensionRoot, 'index/BuiltInIndexProviders.java').text
        if (!builtInIndexProviders.contains('defaultProviderName()')) {
            throw new GradleException('Built-in index providers must expose the default provider name')
        }
        if (!builtInIndexProviders.contains('defaultProvider()')) {
            throw new GradleException('Built-in index providers must expose the default provider adapter')
        }
        def indexProviderRegistry = new File(extensionRoot, 'index/IndexProviderRegistry.java').text
        if (!indexProviderRegistry.contains('registerEnabled(IndexProvider provider')) {
            throw new GradleException('IndexProviderRegistry must expose controlled manual provider registration')
        }
        if (!indexProviderRegistry.contains('IndexProviderRegistry builtIns()')) {
            throw new GradleException('IndexProviderRegistry must expose built-in registry construction')
        }
        if (!indexProviderRegistry.contains('new IndexProviderResolver(descriptors')) {
            throw new GradleException('IndexProviderRegistry must resolve through the same internal resolver path')
        }
        if (indexProviderRegistry.contains('ServiceLoader')) {
            throw new GradleException('IndexProviderRegistry must not introduce provider discovery yet')
        }
        def indexMetadataBridge = new File(extensionRoot, 'index/IndexMetadataBridge.java').text
        if (!indexMetadataBridge.contains('IndexMetadata from(String indexName, IndexDescriptor descriptor)')) {
            throw new GradleException('IndexMetadataBridge must expose a provider-neutral metadata adapter')
        }
        if (!indexMetadataBridge.contains('descriptor.indexProviderName()')) {
            throw new GradleException('IndexMetadataBridge must carry persisted provider identity into SPI metadata')
        }
        if (!indexMetadataBridge.contains('descriptor.baseColumnPositions()')) {
            throw new GradleException('IndexMetadataBridge must derive key-column metadata from Derby index descriptors')
        }
        if (!indexMetadataBridge.contains('baseColumn:')) {
            throw new GradleException('IndexMetadataBridge must avoid exposing Derby column objects in SPI metadata')
        }

        def indexProviderCapabilityBridge = new File(extensionRoot, 'index/IndexProviderCapabilityBridge.java').text
        if (!indexProviderCapabilityBridge.contains('IndexMetadataBridge.from(indexName, descriptor)')) {
            throw new GradleException('IndexProviderCapabilityBridge must adapt Derby descriptors through provider-neutral IndexMetadata')
        }
        if (!indexProviderCapabilityBridge.contains('resolver.requireEnabled(metadata.providerName())')) {
            throw new GradleException('IndexProviderCapabilityBridge must resolve providers by persisted descriptor provider identity')
        }
        if (!indexProviderCapabilityBridge.contains('provider.capabilities(metadata)')) {
            throw new GradleException('IndexProviderCapabilityBridge must ask IndexProvider for capabilities without optimizer coupling')
        }

        def indexProviderCostBridge = new File(extensionRoot, 'index/IndexProviderCostBridge.java').text
        if (!indexProviderCostBridge.contains('IndexCostRequest costRequestFor(')) {
            throw new GradleException('IndexProviderCostBridge must expose provider-neutral cost request construction')
        }
        if (!indexProviderCostBridge.contains('IndexMetadataBridge.from(indexName, descriptor)')) {
            throw new GradleException('IndexProviderCostBridge must adapt Derby descriptors through IndexMetadataBridge')
        }
        if (!indexProviderCostBridge.contains('resolver.requireEnabled(request.metadata().providerName())')) {
            throw new GradleException('IndexProviderCostBridge must resolve providers by persisted descriptor provider identity')
        }
        if (!indexProviderCostBridge.contains('provider.estimateCost(request)')) {
            throw new GradleException('IndexProviderCostBridge must ask IndexProvider for optional cost estimates')
        }
        if (!indexProviderCostBridge.contains('IndexProviderCostProbe builtInCostProbeFor(')) {
            throw new GradleException('IndexProviderCostBridge must expose observable provider cost probes')
        }
        if (indexProviderCostBridge.contains('OptimizerImpl') || indexProviderCostBridge.contains('StoreCostController') || (indexProviderCostBridge =~ /\bCostEstimate\b/).find()) {
            throw new GradleException('IndexProviderCostBridge must not depend on Derby optimizer/store cost implementation classes')
        }
        def fromBaseTable = file('src/main/java/org/apache/derby/impl/sql/compile/FromBaseTable.java').text
        if (!fromBaseTable.contains('applyIndexProviderCostBridge(cd, costEst)')) {
            throw new GradleException('FromBaseTable must reach the IndexProvider cost bridge at the index costing point')
        }
        if (!fromBaseTable.contains('IndexProviderCostMode.fromSystemProperties()')) {
            throw new GradleException('Optimizer provider cost bridge must be gated by an explicit DelosDB mode')
        }
        if (!fromBaseTable.contains('builtInCostProbeFor')) {
            throw new GradleException('Optimizer provider cost bridge must request observable provider cost probes')
        }
        if (!fromBaseTable.contains('mode.consumesProviderCost()')) {
            throw new GradleException('Optimizer provider cost bridge must consume provider costs only in enabled mode')
        }
        if (!fromBaseTable.contains('derbyCostEstimate.setCost(')) {
            throw new GradleException('Optimizer provider cost bridge must have a narrow opt-in cost consumption point')
        }
        if (!fromBaseTable.contains('catch (ReflectiveOperationException | LinkageError | RuntimeException ignored)')) {
            throw new GradleException('Optimizer provider cost bridge must fall back when SPI runtime classes are absent')
        }
        def compatibilityDoc = rootProject.file('docs/DERBY-COMPATIBILITY.md').text
        if (!compatibilityDoc.contains('CREATE INDEX idx ON t(c) USING btree')) {
            throw new GradleException('Derby compatibility policy must document the additive USING btree rule')
        }
        def createIndexNode = file('src/main/java/org/apache/derby/impl/sql/compile/CreateIndexNode.java').text
        if (!createIndexNode.contains('normalizeIndexProviderName')) {
            throw new GradleException('CreateIndexNode must normalize the optional DelosDB index provider name')
        }
        if (!createIndexNode.contains('verifyIndexProviderName')) {
            throw new GradleException('CreateIndexNode must verify unsupported index providers before execution')
        }
        if (!createIndexNode.contains('DEFAULT_INDEX_PROVIDER_NAME = "btree"')) {
            throw new GradleException('CreateIndexNode must keep the Derby-compatible default provider name local to parser plumbing')
        }
        if (!createIndexNode.contains('indexProviderName,')) {
            throw new GradleException('CreateIndexNode must carry the parsed provider name into the CREATE INDEX constant action')
        }
        if (createIndexNode.contains('BuiltInIndexProviders')) {
            throw new GradleException('CreateIndexNode must not load provider adapter classes during Derby-compatible CREATE INDEX parsing')
        }
        def createIndexAction = file('src/main/java/org/apache/derby/impl/sql/execute/CreateIndexConstantAction.java').text
        if (!createIndexAction.contains('private final String    indexProviderName')) {
            throw new GradleException('CreateIndexConstantAction must carry DelosDB index provider metadata internally')
        }
        if (!createIndexAction.contains('String getIndexProviderName()')) {
            throw new GradleException('CreateIndexConstantAction must expose provider metadata for internal plumbing verification')
        }
        if (!createIndexAction.contains('irg.indexProviderName()')) {
            throw new GradleException('CREATE INDEX descriptor reconstruction must preserve persisted provider metadata')
        }
        if (!createIndexAction.contains('indexProviderName.equals(irg.indexProviderName())')) {
            throw new GradleException('Shared index matching must include provider metadata')
        }
        if (createIndexAction.contains('BuiltInIndexProviders') || createIndexAction.contains('IndexProviderResolver')) {
            throw new GradleException('CreateIndexConstantAction must not load provider adapter/resolver classes during execution')
        }
        if (!tasks.names.contains('verifyCreateIndexProviderMetadataRoundTrip')) {
            throw new GradleException('Missing CREATE INDEX provider metadata round-trip verification task')
        }
        def indexDescriptorImpl = file('src/main/java/org/apache/derby/catalog/types/IndexDescriptorImpl.java').text
        if (!indexDescriptorImpl.contains('INDEX_PROVIDER_KEY = "delosdbIndexProviderName"')) {
            throw new GradleException('IndexDescriptorImpl must persist DelosDB index provider metadata under a stable key')
        }
        if (!indexDescriptorImpl.contains('indexProviderName = normalizeIndexProviderName((String) fh.get(INDEX_PROVIDER_KEY))')) {
            throw new GradleException('IndexDescriptorImpl must default missing provider metadata to btree when reading old catalogs')
        }
        if (!indexDescriptorImpl.contains('fh.put(INDEX_PROVIDER_KEY, indexProviderName)')) {
            throw new GradleException('IndexDescriptorImpl must write provider metadata for new indexes')
        }
        def indexRowGenerator = file('src/main/java/org/apache/derby/iapi/sql/dictionary/IndexRowGenerator.java').text
        if (!indexRowGenerator.contains('String indexProviderName()')) {
            throw new GradleException('IndexRowGenerator must expose persisted provider metadata internally')
        }
        if (!indexRowGenerator.contains('new IndexDescriptorImpl(indexType,')) {
            throw new GradleException('IndexRowGenerator must continue constructing Derby index descriptors')
        }

        def constantActionFactory = file('src/main/java/org/apache/derby/impl/sql/execute/GenericConstantActionFactory.java').text
        if (!constantActionFactory.contains('String          indexProviderName')) {
            throw new GradleException('CREATE INDEX constant action factory must accept provider metadata from the parser')
        }
        def tableElementList = file('src/main/java/org/apache/derby/impl/sql/compile/TableElementList.java').text
        if (!tableElementList.contains('null,    // DelosDB indexProviderName: Derby-compatible default')) {
            throw new GradleException('Constraint-backed indexes must preserve the Derby-compatible default provider')
        }
        def sqlGrammar = file('src/main/java/org/apache/derby/impl/sql/compile/sqlgrammar.jj').text
        if (!sqlGrammar.contains('indexProviderClause')) {
            throw new GradleException('SQL grammar must expose the optional CREATE INDEX USING provider clause')
        }
        if (!sqlGrammar.contains('[ indexProviderName = indexProviderClause() ]')) {
            throw new GradleException('CREATE INDEX grammar must keep the provider clause optional for Derby compatibility')
        }
        def moduleInfo = file('src/main/java/module-info.java').text
        if (moduleInfo.contains('exports io.github.ggeorg.delosdb.engine.extension')) {
            throw new GradleException('Internal extension registry package must not be exported from org.apache.derby.engine')
        }
        if (!moduleInfo.contains('requires io.github.ggeorg.delosdb.spi;')) {
            throw new GradleException('Engine module must require delosdb-spi for built-in provider adapters')
        }
    }
}

tasks.named('assemble') {
    dependsOn 'classes'
}


def engineArchiveName = 'derby.jar'

tasks.register('derbyJar', Jar) {
    dependsOn 'compileDerbyEngine', 'compileClassSizeCatalog', ':processDerbyResources', ':splitEngineMessages'
    archiveFileName = engineArchiveName
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from moduleClassDir
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Embedded Engine')
    }
}

tasks.named('assemble') {
    dependsOn 'derbyJar'
}
