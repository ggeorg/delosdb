plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// Real Gradle Java module for the DelosDB provider-facing SPI. Keep the
// legacy compile/jar task names while the wider build is migrated away from
// custom task wiring.
def moduleName = 'io.github.ggeorg.delosdb.spi'
def moduleClassDir = layout.buildDirectory.dir('classes/spi')

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

sourceSets {
    main {
        java {
            destinationDirectory.set(moduleClassDir)
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    destinationDirectory.set(moduleClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

// Compatibility alias used by the existing root build and extracted modules.
tasks.register('compileDelosDbSpi') {
    dependsOn tasks.named('compileJava')
}

tasks.named('jar', Jar) {
    archiveFileName = 'delosdb-spi.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB SPI Stability Markers')
    }
}

// Compatibility alias used by the root `jars` task.
tasks.register('delosDbSpiJar') {
    dependsOn tasks.named('jar')
}

tasks.named('check') {
    dependsOn tasks.named('classes')
}
