# DELOSDB_SQLANCER_PROFILE_SKELETON
# This is a profile contract for an external SQLancer runner. It is not parsed
# by DelosDB production code and is not part of S0.

profile.id=delosdb-mvcc
jdbc.protocol=derby
storage.provider=delos_mvcc
normal-build-dependency=false
s0-dependency=false
external-command-property=delosdb.sqlancer.profile.command

# Keep the first profile close to SQL already covered by DelosDB MVCC proofs.
# The external runner may widen this list only after the corresponding DelosDB
# SQL/MVCC gate exists.
statements=create-table,create-index,insert,update,delete,select,commit,rollback
expressions=integer,varchar,boolean-comparison,is-null,and,or,not,between,in,equality,range
queries=projection,selection,order-by,group-by,distinct,aggregate-count,aggregate-sum
transactions=auto-commit,manual-commit,manual-rollback,repeatable-read,read-committed

# Start with small deterministic databases. CI can raise these values once the
# heap/MVCC differential harness absorbs generated reproductions reliably.
max-tables=4
max-indexes-per-table=3
max-rows-per-table=200
max-statement-count=1000

# Provider clause used by generated DelosDB MVCC tables.
table-provider-clause=USING delos_mvcc

# Keep unsupported or not-yet-stabilized surfaces disabled until explicit proof
# slices exist.
exclude=lob,long-row-overflow-generated,java-objects,external-routines,triggers,foreign-keys,generated-columns,merge,recursive-queries,window-functions
