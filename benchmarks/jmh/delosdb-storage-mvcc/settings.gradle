pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'delosdb-storage-mvcc-benchmarks'

includeBuild('../../..') {
    dependencySubstitution {
        substitute module('io.github.ggeorg.delosdb:delosdb-storage-mvcc') using project(':delosdb-storage-mvcc')
    }
}
