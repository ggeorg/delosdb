plugins {
    id 'java'
    id 'me.champeau.jmh' version '0.7.3'
}

import java.security.MessageDigest
import java.util.regex.Pattern
import java.util.regex.PatternSyntaxException
import java.util.zip.ZipFile

version = '0.1.0-dev'
group = 'io.github.ggeorg.delosdb.benchmark'

final File repositoryRoot = layout.projectDirectory.dir('../..').asFile
final File runtimeJarDirectory = new File(repositoryRoot, 'build/libs')
final List<String> runtimeJarNames = [
        'delosdb-annotations.jar',
        'delosdb-spi.jar',
        'osgi-framework-stub.jar',
        'derbyshared.jar',
        'delosdb-runtime-api.jar',
        'derby.jar',
        'derbytools.jar'
]
final List<File> runtimeJarFiles = runtimeJarNames.collect { new File(runtimeJarDirectory, it) }
static List<String> csvProperty(Project project, String name, List<String> defaults) {
    String raw = project.findProperty(name)?.toString()?.trim()
    if (raw == null || raw.isEmpty()) {
        return List.copyOf(defaults)
    }
    List<String> values = raw.split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    if (values.isEmpty()) {
        throw new GradleException("${name} must contain at least one non-empty value")
    }
    return List.copyOf(new LinkedHashSet<>(values))
}


static List<String> doubleSemicolonProperty(
        Project project,
        String name,
        List<String> defaults) {
    String raw = project.findProperty(name)?.toString()?.trim()
    if (raw == null || raw.isEmpty()) {
        return List.copyOf(defaults)
    }
    List<String> values = raw.split(/;;/)
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    if (values.isEmpty()) {
        throw new GradleException("${name} must contain at least one non-empty value")
    }
    return List.copyOf(values)
}

static String sha256(File file) {
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
    return digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

static int positiveIntProperty(Project project, String name, int defaultValue) {
    String raw = project.findProperty(name)?.toString()?.trim()
    if (raw == null || raw.isEmpty()) {
        return defaultValue
    }
    try {
        int value = Integer.parseInt(raw)
        if (value < 1) {
            throw new GradleException("${name} must be positive: ${raw}")
        }
        return value
    } catch (NumberFormatException failure) {
        throw new GradleException("${name} must be an integer: ${raw}", failure)
    }
}

static String nonBlankProperty(Project project, String name, String defaultValue) {
    String raw = project.findProperty(name)?.toString()?.trim()
    if (raw == null || raw.isEmpty()) {
        return defaultValue
    }
    return raw
}

static boolean booleanProperty(Project project, String name, boolean defaultValue) {
    String raw = project.findProperty(name)?.toString()?.trim()
    if (raw == null || raw.isEmpty()) {
        return defaultValue
    }
    if (raw.equalsIgnoreCase('true')) {
        return true
    }
    if (raw.equalsIgnoreCase('false')) {
        return false
    }
    throw new GradleException("${name} must be true or false: ${raw}")
}

static Pattern regexProperty(String name, String raw) {
    try {
        return Pattern.compile(raw)
    } catch (PatternSyntaxException failure) {
        throw new GradleException(
                name + ' must be a valid regular expression: ' + raw,
                failure)
    }
}

final List<String> providers = csvProperty(project, 'delosdb.jmh.providers', ['heap', 'mvcc'])
final Set<String> unsupportedProviders = providers.findAll { !['heap', 'mvcc'].contains(it) } as Set<String>
if (!unsupportedProviders.isEmpty()) {
    throw new GradleException("delosdb.jmh.providers supports only heap,mvcc; found ${unsupportedProviders}")
}

final List<String> rowCounts = csvProperty(project, 'delosdb.jmh.rows', ['100'])
final List<String> payloadSizes = csvProperty(project, 'delosdb.jmh.payloadSizes', ['128'])
final List<String> commitBatchSizes = csvProperty(project, 'delosdb.jmh.commitBatchSizes', ['100'])

def parsePositiveIntegerValues = { String propertyName, List<String> values ->
    values.collect { value ->
        int parsed
        try {
            parsed = Integer.parseInt(value)
        } catch (NumberFormatException failure) {
            throw new GradleException("${propertyName} values must be integers: ${value}", failure)
        }
        if (parsed < 1) {
            throw new GradleException(
                    "${propertyName} values must be positive: ${value}")
        }
        parsed
    }
}

final List<Integer> parsedRows = parsePositiveIntegerValues(
        'delosdb.jmh.rows', rowCounts)
final List<Integer> parsedPayloadSizes = parsePositiveIntegerValues(
        'delosdb.jmh.payloadSizes', payloadSizes)
final List<Integer> parsedCommitBatchSizes = parsePositiveIntegerValues(
        'delosdb.jmh.commitBatchSizes', commitBatchSizes)
if (parsedCommitBatchSizes.max() > parsedRows.min()) {
    throw new GradleException(
            'Every delosdb.jmh.commitBatchSizes value must be no greater than the smallest '
                    + "delosdb.jmh.rows value (${parsedRows.min()}); found ${parsedCommitBatchSizes}")
}

final String configuredIncludeExpression = nonBlankProperty(
        project,
        'delosdb.jmh.includes',
        '.*DelosJdbcJmhBenchmark.*')
final List<String> configuredIncludes = List.of(configuredIncludeExpression)
final String benchmarkClassName =
        'io.github.ggeorg.delosdb.benchmark.jmh.DelosJdbcJmhBenchmark'
final List<String> benchmarkMethodNames = [
        'aggregate',
        'compositeRangeCoveredScan',
        'compositeRangeScan',
        'fullScan',
        'primaryKeyCoveredLookup',
        'primaryKeyLookup',
        'readTransactionCommit',
        'readTransactionRollback',
        'secondaryEqualityCoveredCount',
        'secondaryEqualityCoveredLookup',
        'secondaryEqualityFullRowLookup',
        'secondaryEqualityLookup',
        'secondaryEqualityPayloadLookup'
]
final Pattern configuredIncludePattern = regexProperty(
        'delosdb.jmh.includes', configuredIncludeExpression)
final Set<String> expectedBenchmarkNames = new LinkedHashSet<>(benchmarkMethodNames
        .collect { benchmarkClassName + '.' + it }
        .findAll { configuredIncludePattern.matcher(it).find() })
if (expectedBenchmarkNames.isEmpty()) {
    throw new GradleException(
            'delosdb.jmh.includes does not select any standalone DelosDB benchmark: '
                    + configuredIncludeExpression)
}
final File jfrAllocationReportDirectory = layout.buildDirectory
        .dir('reports/jmh/jfr').get().asFile
final List<String> requestedProfilers = csvProperty(project, 'delosdb.jmh.profilers', [])
final boolean allocationJfrEnabled = booleanProperty(
        project, 'delosdb.jmh.allocationJfr', false)
final boolean requestedJfrProfiler = requestedProfilers.any { profiler ->
    String normalized = profiler.toString().trim().toLowerCase(Locale.ROOT)
    normalized == 'jfr' || normalized.startsWith('jfr:')
}
if (allocationJfrEnabled && requestedJfrProfiler) {
    throw new GradleException(
            'Use delosdb.jmh.allocationJfr=true without adding a second jfr profiler explicitly')
}
final List<String> effectiveProfilers = new ArrayList<>(requestedProfilers)
if (allocationJfrEnabled) {
    effectiveProfilers.add(
            'jfr:dir=' + jfrAllocationReportDirectory.absolutePath
                    + ';configName=profile;stackDepth=256;postProcessor='
                    + 'io.github.ggeorg.delosdb.benchmark.jmh.DelosJfrAllocationPostProcessor')
}
final List<String> configuredProfilers = List.copyOf(new LinkedHashSet<>(effectiveProfilers))
final boolean jfrProfilerConfigured = configuredProfilers.any { profiler ->
    String normalized = profiler.toString().trim().toLowerCase(Locale.ROOT)
    normalized == 'jfr' || normalized.startsWith('jfr:')
}
final String jmhUnsafeCompatibilityArg = '--sun-misc-unsafe-memory-access=allow'
final List<String> configuredJvmArgs = doubleSemicolonProperty(
        project, 'delosdb.jmh.jvmArgs', [])
final List<String> effectiveJmhJvmArgs = configuredJvmArgs.any {
    it.startsWith('--sun-misc-unsafe-memory-access=')
} ? configuredJvmArgs : [jmhUnsafeCompatibilityArg] + configuredJvmArgs

// Plugin 0.7.3 models benchmarkParameters as
// MapProperty<String, ListProperty<String>>. Keep provider-backed parameter
// lists until a released plugin version adopts ordinary List values.
final def providerParameterValues = objects.listProperty(String)
providerParameterValues.set(providers)
final def rowParameterValues = objects.listProperty(String)
rowParameterValues.set(rowCounts)
final def payloadSizeParameterValues = objects.listProperty(String)
payloadSizeParameterValues.set(payloadSizes)
final def commitBatchParameterValues = objects.listProperty(String)
commitBatchParameterValues.set(commitBatchSizes)

final int benchmarkThreads = positiveIntProperty(project, 'delosdb.jmh.threads', 1)
if (benchmarkThreads != 1) {
    throw new GradleException(
            'The embedded JDBC JMH surface is single-threaded. Use the dedicated concurrency '
                    + 'and jcstress lanes for multi-threaded proofs.')
}

final int configuredWarmupIterations = positiveIntProperty(
        project, 'delosdb.jmh.warmupIterations', 2)
final int configuredMeasurementIterations = positiveIntProperty(
        project, 'delosdb.jmh.iterations', 3)
final String configuredWarmupTime = nonBlankProperty(
        project, 'delosdb.jmh.warmupTime', '500ms')
final String configuredMeasurementTime = nonBlankProperty(
        project, 'delosdb.jmh.iterationTime', '500ms')
final int configuredForks = positiveIntProperty(project, 'delosdb.jmh.forks', 1)
if (allocationJfrEnabled && configuredForks != 1) {
    throw new GradleException(
            'delosdb.jmh.allocationJfr requires delosdb.jmh.forks=1 so each diagnostic recording is unique')
}
final String configuredVerbosity = nonBlankProperty(
        project, 'delosdb.jmh.verbosity', 'NORMAL')
final String configuredTimeout = nonBlankProperty(
        project, 'delosdb.jmh.timeout', '10m')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    concurrentCommit {
        java.srcDir('src/concurrentCommit/java')
    }
}

dependencies {
    // The standalone build consumes only assembled DelosDB runtime artifacts.
    // It never imports root-project source sets or implementation-only modules.
    jmh files(runtimeJarFiles)
    concurrentCommitImplementation files(runtimeJarFiles)
}

jmh {
    jmhVersion = '1.37'
    includes = configuredIncludes
    benchmarkMode = ['avgt']
    warmupIterations = configuredWarmupIterations
    iterations = configuredMeasurementIterations
    warmup = configuredWarmupTime
    timeOnIteration = configuredMeasurementTime
    fork = configuredForks
    threads = benchmarkThreads
    failOnError = true
    forceGC = false
    synchronizeIterations = false
    timeUnit = 'us'
    verbosity = configuredVerbosity
    jmhTimeout = configuredTimeout
    resultFormat = 'JSON'
    resultsFile = layout.buildDirectory.file('reports/jmh/results.json').get().asFile
    humanOutputFile = layout.buildDirectory.file('reports/jmh/human.txt').get().asFile
    profilers = configuredProfilers
    jvmArgsAppend = effectiveJmhJvmArgs
    includeTests = false
    duplicateClassesStrategy = DuplicatesStrategy.FAIL
    benchmarkParameters = [
            provider       : providerParameterValues,
            rows           : rowParameterValues,
            payloadSize    : payloadSizeParameterValues,
            commitBatchSize: commitBatchParameterValues
    ]
}

tasks.register('verifyDelosRuntimeJars') {
    group = 'verification'
    description = 'Verifies the assembled public DelosDB runtime jars required by the standalone JMH build.'
    inputs.files(runtimeJarFiles)

    doLast {
        List<File> missing = runtimeJarFiles.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    'Missing DelosDB runtime jar(s):\n  '
                            + missing.collect { it.absolutePath }.join('\n  ')
                            + '\nBuild them first from the repository root with: ./gradlew jars')
        }
        File toolsJar = new File(runtimeJarDirectory, 'derbytools.jar')
        new ZipFile(toolsJar).withCloseable { zip ->
            if (zip.getEntry('org/apache/derby/jdbc/EmbeddedDriver.class') == null) {
                throw new GradleException("${toolsJar} does not contain the public embedded JDBC driver")
            }
        }

        File engineJar = new File(runtimeJarDirectory, 'derby.jar')
        String providerService =
                'META-INF/services/org.apache.derby.iapi.store.access.conglomerate.ExternalAccessMethodProvider'
        String expectedProvider =
                'org.apache.derby.impl.store.access.mvcc.DerbyMvccAccessMethodProvider'
        new ZipFile(engineJar).withCloseable { zip ->
            def entry = zip.getEntry(providerService)
            if (entry == null) {
                throw new GradleException("${engineJar} does not contain ${providerService}")
            }
            List<String> providersInJar = zip.getInputStream(entry)
                    .getText('UTF-8')
                    .readLines()
                    .collect { it.trim() }
                    .findAll { it && !it.startsWith('#') }
            if (!providersInJar.contains(expectedProvider)) {
                throw new GradleException("${engineJar} does not advertise ${expectedProvider}")
            }
        }
    }
}

tasks.register('verifyJmhApiBoundary') {
    group = 'verification'
    description = 'Rejects implementation-internal imports and accidental root-build wiring.'

    def benchmarkSources = files(
            fileTree('src/jmh/java') { include '**/*.java' },
            fileTree('src/concurrentCommit/java') { include '**/*.java' })
    def rootBuildFiles = files(
            new File(repositoryRoot, 'settings.gradle'),
            new File(repositoryRoot, 'build.gradle'),
            fileTree(new File(repositoryRoot, 'gradle')) { include '**/*.gradle' },
            fileTree(repositoryRoot) { include 'delosdb-*/build.gradle' })
    inputs.files(benchmarkSources, rootBuildFiles)

    doLast {
        List<String> forbiddenImports = [
                'import io.github.ggeorg.delosdb.storage.mvcc.',
                'import org.apache.derby.impl.',
                'import org.apache.derby.iapi.'
        ]
        List<String> violations = []
        benchmarkSources.files.sort().each { source ->
            List<String> lines = source.readLines('UTF-8')
            lines.eachWithIndex { line, index ->
                forbiddenImports.each { forbidden ->
                    if (line.contains(forbidden)) {
                        violations << "${source}:${index + 1}: ${line.trim()}"
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    'Standalone JMH sources must use public JDBC/JDK APIs only:\n  '
                            + violations.join('\n  '))
        }

        List<String> rootWiringViolations = []
        rootBuildFiles.files.findAll { it.isFile() }.sort().each { buildFile ->
            String text = buildFile.getText('UTF-8')
            if (text.contains('me.champeau.jmh')) {
                rootWiringViolations << "${buildFile}: references the JMH plugin"
            }
            if (text.contains('benchmarks/jmh')) {
                rootWiringViolations << "${buildFile}: references the standalone JMH build"
            }
        }
        if (!rootWiringViolations.isEmpty()) {
            throw new GradleException(
                    'The normal DelosDB build must remain independent of JMH:\n  '
                            + rootWiringViolations.join('\n  '))
        }
    }
}

tasks.named('compileJmhJava', JavaCompile) {
    dependsOn tasks.named('verifyDelosRuntimeJars'), tasks.named('verifyJmhApiBoundary')
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.named('compileConcurrentCommitJava', JavaCompile) {
    dependsOn tasks.named('verifyDelosRuntimeJars'), tasks.named('verifyJmhApiBoundary')
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

final List<String> concurrentCommitPropertyNames = [
        'delosdb.concurrentCommit.providers',
        'delosdb.concurrentCommit.writers',
        'delosdb.concurrentCommit.readers',
        'delosdb.concurrentCommit.topologies',
        'delosdb.concurrentCommit.operations',
        'delosdb.concurrentCommit.readerWorkloads',
        'delosdb.concurrentCommit.rowsPerTransaction',
        'delosdb.concurrentCommit.transactionsPerWriter',
        'delosdb.concurrentCommit.warmupTransactionsPerWriter',
        'delosdb.concurrentCommit.measurementRounds',
        'delosdb.concurrentCommit.readerMeasurementMillis',
        'delosdb.concurrentCommit.readsPerReader',
        'delosdb.concurrentCommit.warmupReadsPerReader',
        'delosdb.concurrentCommit.databaseRoot',
        'delosdb.concurrentCommit.keepJfr'
]

final def concurrentCommitSources = fileTree('src/concurrentCommit/java') {
    include '**/*.java'
}
final List<File> concurrentCommitSourceFiles = concurrentCommitSources.files.sort()
final Map<String, String> concurrentCommitProperties = concurrentCommitPropertyNames.collectEntries {
    propertyName -> [propertyName, project.providers.gradleProperty(propertyName).getOrElse('')]
}
final File concurrentCommitReportDirectory =
        layout.buildDirectory.dir('reports/concurrent-commit').get().asFile
final File concurrentCommitManifest = new File(concurrentCommitReportDirectory, 'run-manifest.txt')


tasks.register('writeConcurrentCommitRunManifest') {
    group = 'benchmark'
    description = 'Writes reproducibility fingerprints for the concurrent reader-writer benchmark.'
    dependsOn tasks.named('verifyDelosRuntimeJars'), tasks.named('verifyJmhApiBoundary')
    inputs.files(runtimeJarFiles, concurrentCommitSourceFiles, file('build.gradle'), file('settings.gradle'))
    inputs.properties(concurrentCommitProperties)
    outputs.file(concurrentCommitManifest)

    doLast {
        concurrentCommitManifest.parentFile.mkdirs()
        concurrentCommitManifest.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB concurrent reader-writer benchmark manifest')
            writer.println('Required Java toolchain: 25')
            writer.println('Main class: io.github.ggeorg.delosdb.benchmark.concurrent.DelosConcurrentCommitBenchmark')
            concurrentCommitPropertyNames.each { propertyName ->
                String value = concurrentCommitProperties[propertyName]
                writer.println(propertyName + ': ' + (value.isEmpty() ? '<default>' : value))
            }
            writer.println()
            writer.println('Runtime artifacts:')
            runtimeJarFiles.each { jar ->
                writer.println('  ' + jar.name + ' size=' + jar.length() + ' sha256=' + sha256(jar))
            }
            writer.println()
            writer.println('Benchmark sources:')
            concurrentCommitSourceFiles.each { source ->
                writer.println('  ' + source.name + ' size=' + source.length() + ' sha256=' + sha256(source))
            }
        }
    }
}


tasks.register('runConcurrentCommitBenchmark', JavaExec) {
    group = 'benchmark'
    description = 'Measures heap/MVCC concurrent reader-writer throughput, latency, file writes, and JVM contention.'
    dependsOn tasks.named('compileConcurrentCommitJava'), tasks.named('writeConcurrentCommitRunManifest')
    classpath = sourceSets.concurrentCommit.runtimeClasspath
    mainClass = 'io.github.ggeorg.delosdb.benchmark.concurrent.DelosConcurrentCommitBenchmark'
    systemProperty 'delosdb.concurrentCommit.outputDirectory', concurrentCommitReportDirectory.absolutePath
    concurrentCommitProperties.each { propertyName, value ->
        if (!value.isEmpty()) {
            systemProperty propertyName, value
        }
    }
    outputs.upToDateWhen { false }

    doFirst {
        concurrentCommitReportDirectory.mkdirs()
        List<File> staleReports = ['results.csv', 'results.json', 'human.txt']
                .collect { fileName -> new File(concurrentCommitReportDirectory, fileName) }
        File[] reportFiles = concurrentCommitReportDirectory.listFiles()
        if (reportFiles != null) {
            staleReports.addAll(reportFiles.findAll { file ->
                file.isFile() && file.name.endsWith('.jfr')
            })
        }
        staleReports.each { report ->
            if (report.exists() && !report.delete()) {
                throw new GradleException('Could not remove stale concurrent commit report: ' + report)
            }
        }
    }

    doLast {
        ['results.csv', 'results.json', 'human.txt', 'run-manifest.txt'].each { fileName ->
            File report = new File(concurrentCommitReportDirectory, fileName)
            if (!report.isFile() || report.length() == 0L) {
                throw new GradleException('Concurrent commit benchmark did not create: ' + report)
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('compileConcurrentCommitJava'), tasks.named('verifyJmhApiBoundary')
}

tasks.named('jmhJar', Jar) {
    dependsOn tasks.named('verifyDelosRuntimeJars'), tasks.named('verifyJmhApiBoundary')
    // Fat jars routinely contain repeated license, notice, and other
    // dependency metadata. Keep the first ordinary resource copy. The plugin's
    // duplicateClassesStrategy remains FAIL, so duplicate .class entries are
    // still rejected instead of silently shadowed.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Module descriptors are inapplicable because this fat jar runs on the
    // class path rather than as one merged JPMS module.
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
}

tasks.register('writeJmhRunManifest') {
    group = 'benchmark'
    description = 'Writes reproducibility fingerprints for the standalone JMH inputs and configuration.'
    dependsOn tasks.named('verifyDelosRuntimeJars'), tasks.named('verifyJmhApiBoundary')

    def benchmarkInputs = files(
            fileTree('src/jmh/java') { include '**/*.java' },
            file('build.gradle'),
            file('settings.gradle'),
            file('gradle.properties'))
    inputs.files(runtimeJarFiles, benchmarkInputs)
    inputs.property('providers', providers)
    inputs.property('rows', rowCounts)
    inputs.property('payloadSizes', payloadSizes)
    inputs.property('commitBatchSizes', commitBatchSizes)
    inputs.property('includes', configuredIncludes)
    inputs.property('profilers', configuredProfilers)
    inputs.property('jvmArgs', effectiveJmhJvmArgs)
    inputs.property('warmupIterations', configuredWarmupIterations)
    inputs.property('measurementIterations', configuredMeasurementIterations)
    inputs.property('warmupTime', configuredWarmupTime)
    inputs.property('measurementTime', configuredMeasurementTime)
    inputs.property('forks', configuredForks)
    inputs.property('threads', benchmarkThreads)
    inputs.property('verbosity', configuredVerbosity)
    inputs.property('timeout', configuredTimeout)
    outputs.file(layout.buildDirectory.file('reports/jmh/run-manifest.txt'))

    doLast {
        File manifest = layout.buildDirectory.file('reports/jmh/run-manifest.txt').get().asFile
        manifest.parentFile.mkdirs()
        manifest.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB standalone JMH run manifest')
            writer.println('JMH version: 1.37')
            writer.println('JMH Gradle plugin: 0.7.3')
            writer.println('Required Java toolchain: 25')
            writer.println('Providers: ' + providers)
            writer.println('Rows: ' + rowCounts)
            writer.println('Payload sizes: ' + payloadSizes)
            writer.println('Fixture commit batches: ' + commitBatchSizes)
            writer.println('Includes: ' + configuredIncludes)
            writer.println('Profilers: ' + configuredProfilers)
            writer.println('JVM args: ' + effectiveJmhJvmArgs)
            writer.println('Warmup iterations: '
                    + configuredWarmupIterations)
            writer.println('Measurement iterations: '
                    + configuredMeasurementIterations)
            writer.println('Warmup time: '
                    + configuredWarmupTime)
            writer.println('Measurement time: '
                    + configuredMeasurementTime)
            writer.println('Forks: ' + configuredForks)
            writer.println('Threads: ' + benchmarkThreads)
            writer.println()
            writer.println('Runtime artifacts:')
            runtimeJarFiles.each { jar ->
                writer.println('  ' + jar.name + ' size=' + jar.length() + ' sha256=' + sha256(jar))
            }
            writer.println()
            writer.println('Benchmark build inputs:')
            benchmarkInputs.files.findAll { it.isFile() }.sort().each { input ->
                String relative = layout.projectDirectory.asFile.toPath()
                        .relativize(input.toPath()).toString()
                writer.println('  ' + relative + ' size=' + input.length() + ' sha256=' + sha256(input))
            }
        }
    }
}

tasks.withType(JavaExec).configureEach {
    if (name == 'jmh') {
        jvmArgs(jmhUnsafeCompatibilityArg)
    }
}

tasks.named('jmh') {
    dependsOn tasks.named('verifyDelosRuntimeJars'),
            tasks.named('verifyJmhApiBoundary'),
            tasks.named('writeJmhRunManifest')
    // A benchmark invocation is an observation, not a reproducible build
    // artifact. Never reuse an earlier timing result as an up-to-date output.
    outputs.upToDateWhen { false }

    doFirst {
        File reportDirectory = layout.buildDirectory.dir('reports/jmh').get().asFile
        reportDirectory.mkdirs()
        [
                new File(reportDirectory, 'results.json'),
                new File(reportDirectory, 'human.txt'),
                new File(reportDirectory, 'allocation-summary.txt')
        ].each { report ->
            if (report.exists() && !report.delete()) {
                throw new GradleException("Could not remove stale JMH report: ${report}")
            }
        }
        if (jfrProfilerConfigured) {
            delete(jfrAllocationReportDirectory)
        }
    }
    doLast {
        File jsonReport = layout.buildDirectory.file('reports/jmh/results.json').get().asFile
        File humanReport = layout.buildDirectory.file('reports/jmh/human.txt').get().asFile
        File manifest = layout.buildDirectory.file('reports/jmh/run-manifest.txt').get().asFile
        if (!jsonReport.isFile() || jsonReport.length() == 0L) {
            throw new GradleException("JMH did not create a non-empty JSON report: ${jsonReport}")
        }
        Object parsed = new groovy.json.JsonSlurper().parse(jsonReport)
        if (!(parsed instanceof List) || parsed.isEmpty()) {
            throw new GradleException("JMH JSON report contains no benchmark results: ${jsonReport}")
        }

        Set<String> expectedParameterNames = [
                'provider', 'rows', 'payloadSize', 'commitBatchSize'
        ] as Set<String>
        Set<String> allowedProviders = providers as Set<String>
        Set<String> allowedRows = rowCounts as Set<String>
        Set<String> allowedPayloadSizes = payloadSizes as Set<String>
        Set<String> allowedCommitBatchSizes = commitBatchSizes as Set<String>
        int expectedCasesPerBenchmark = providers.size()
                * rowCounts.size()
                * payloadSizes.size()
                * commitBatchSizes.size()
        Map<String, Set<String>> casesByBenchmark = [:].withDefault { new LinkedHashSet<String>() }

        parsed.eachWithIndex { result, index ->
            if (!(result instanceof Map)) {
                throw new GradleException("JMH result ${index} is not an object")
            }
            String benchmark = result.benchmark?.toString()
            if (benchmark == null || benchmark.isBlank()) {
                throw new GradleException("JMH result ${index} has no benchmark name")
            }
            if (!result.jdkVersion?.toString()?.startsWith('25')) {
                throw new GradleException(
                        "JMH result ${benchmark} did not run on JDK 25: ${result.jdkVersion}")
            }
            if (!(result.params instanceof Map)
                    || (result.params.keySet() as Set<String>) != expectedParameterNames) {
                throw new GradleException(
                        "JMH result ${benchmark} has unexpected parameters: ${result.params}")
            }
            String providerValue = result.params.provider?.toString()
            String rowsValue = result.params.rows?.toString()
            String payloadValue = result.params.payloadSize?.toString()
            String commitBatchValue = result.params.commitBatchSize?.toString()
            if (!allowedProviders.contains(providerValue)
                    || !allowedRows.contains(rowsValue)
                    || !allowedPayloadSizes.contains(payloadValue)
                    || !allowedCommitBatchSizes.contains(commitBatchValue)) {
                throw new GradleException(
                        "JMH result ${benchmark} contains an unrequested parameter case: ${result.params}")
            }
            String caseKey = [providerValue, rowsValue, payloadValue, commitBatchValue].join('|')
            if (!casesByBenchmark[benchmark].add(caseKey)) {
                throw new GradleException(
                        "JMH result contains a duplicate case for ${benchmark}: ${result.params}")
            }
            if (!(result.primaryMetric instanceof Map)
                    || !(result.primaryMetric.score instanceof Number)) {
                throw new GradleException("JMH result ${benchmark} has no numeric primary score")
            }
            double score = ((Number) result.primaryMetric.score).doubleValue()
            if (!Double.isFinite(score) || score < 0.0d) {
                throw new GradleException("JMH result ${benchmark} has an invalid score: ${score}")
            }
        }

        Set<String> reportedBenchmarkNames = casesByBenchmark.keySet() as Set<String>
        if (reportedBenchmarkNames != expectedBenchmarkNames) {
            Set<String> missingBenchmarks = new LinkedHashSet<>(expectedBenchmarkNames)
            missingBenchmarks.removeAll(reportedBenchmarkNames)
            Set<String> unexpectedBenchmarks = new LinkedHashSet<>(reportedBenchmarkNames)
            unexpectedBenchmarks.removeAll(expectedBenchmarkNames)
            throw new GradleException(
                    'JMH result coverage does not match delosdb.jmh.includes; missing='
                            + missingBenchmarks + ', unexpected=' + unexpectedBenchmarks)
        }
        expectedBenchmarkNames.each { benchmark ->
            Set<String> cases = casesByBenchmark[benchmark]
            if (cases.size() != expectedCasesPerBenchmark) {
                throw new GradleException(
                        "JMH benchmark ${benchmark} produced ${cases.size()} parameter cases; "
                                + "expected ${expectedCasesPerBenchmark}")
            }
        }
        if (!humanReport.isFile() || humanReport.length() == 0L) {
            throw new GradleException("JMH did not create a non-empty human report: ${humanReport}")
        }
        if (!manifest.isFile() || manifest.length() == 0L) {
            throw new GradleException("JMH did not create a non-empty run manifest: ${manifest}")
        }
        boolean gcProfilerConfigured = configuredProfilers.any { profiler ->
            String normalized = profiler.toString().trim().toLowerCase(Locale.ROOT)
            normalized == 'gc' || normalized.startsWith('gc:')
        }
        if (gcProfilerConfigured) {
            File allocationSummary = layout.buildDirectory
                    .file('reports/jmh/allocation-summary.txt').get().asFile
            allocationSummary.withPrintWriter('UTF-8') { writer ->
                writer.println('DelosDB JMH allocation attribution')
                writer.println('Metric: gc.alloc.rate.norm (bytes per benchmark operation)')
                writer.println('Generated only when the JMH gc profiler is enabled.')
                writer.println()
                writer.println('benchmark,provider,rows,payloadSize,commitBatchSize,scoreUs,bytesPerOperation')
                parsed.sort { left, right ->
                    int comparison = left.benchmark.toString() <=> right.benchmark.toString()
                    if (comparison != 0) {
                        return comparison
                    }
                    comparison = left.params.provider.toString() <=> right.params.provider.toString()
                    if (comparison != 0) {
                        return comparison
                    }
                    comparison = Integer.compare(
                            left.params.rows.toString().toInteger(),
                            right.params.rows.toString().toInteger())
                    if (comparison != 0) {
                        return comparison
                    }
                    comparison = Integer.compare(
                            left.params.payloadSize.toString().toInteger(),
                            right.params.payloadSize.toString().toInteger())
                    if (comparison != 0) {
                        return comparison
                    }
                    Integer.compare(
                            left.params.commitBatchSize.toString().toInteger(),
                            right.params.commitBatchSize.toString().toInteger())
                }.each { result ->
                    if (!(result.secondaryMetrics instanceof Map)) {
                        throw new GradleException(
                                "JMH gc profiler produced no secondary metrics for ${result.benchmark}")
                    }
                    Map.Entry allocationMetric = result.secondaryMetrics.entrySet().find { entry ->
                        entry.key.toString() == 'gc.alloc.rate.norm'
                                || entry.key.toString().endsWith('.gc.alloc.rate.norm')
                    }
                    if (allocationMetric == null
                            || !(allocationMetric.value instanceof Map)
                            || !(allocationMetric.value.score instanceof Number)) {
                        throw new GradleException(
                                "JMH gc profiler produced no allocation-normalized score for ${result.benchmark}")
                    }
                    double bytesPerOperation =
                            ((Number) allocationMetric.value.score).doubleValue()
                    if (!Double.isFinite(bytesPerOperation) || bytesPerOperation < 0.0d) {
                        throw new GradleException(
                                "JMH result ${result.benchmark} has invalid allocation score: "
                                        + bytesPerOperation)
                    }
                    writer.printf(
                            Locale.ROOT,
                            '%s,%s,%s,%s,%s,%.6f,%.3f%n',
                            result.benchmark,
                            result.params.provider,
                            result.params.rows,
                            result.params.payloadSize,
                            result.params.commitBatchSize,
                            ((Number) result.primaryMetric.score).doubleValue(),
                            bytesPerOperation)
                }
            }
            if (!allocationSummary.isFile() || allocationSummary.length() == 0L) {
                throw new GradleException(
                        "JMH did not create a non-empty allocation summary: ${allocationSummary}")
            }
        }
        if (jfrProfilerConfigured) {
            Set<File> recordings = fileTree(jfrAllocationReportDirectory) {
                include '**/profile.jfr'
            }.files
            if (recordings.isEmpty()) {
                throw new GradleException(
                        "JMH JFR profiler created no profile.jfr recordings under "
                                + jfrAllocationReportDirectory)
            }
            recordings.each { recording ->
                ['allocation-by-class.csv', 'allocation-by-site.csv', 'allocation-attribution.txt']
                        .each { fileName ->
                    File report = new File(recording.parentFile, fileName)
                    if (!report.isFile() || report.length() == 0L) {
                        throw new GradleException(
                                "JFR allocation post-processor did not create: ${report}")
                    }
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyDelosRuntimeJars'),
            tasks.named('verifyJmhApiBoundary'),
            tasks.named('jmhClasses')
}
