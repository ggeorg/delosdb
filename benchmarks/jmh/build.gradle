plugins {
    id 'java'
    id 'me.champeau.jmh' version '0.7.3'
}

import java.util.zip.ZipFile

version = '0.1.0-dev'
group = 'io.github.ggeorg.delosdb.benchmark'

final File repositoryRoot = layout.projectDirectory.dir('../..').asFile
final File runtimeJarDirectory = new File(repositoryRoot, 'build/libs')
final List<String> runtimeJarNames = [
        'delosdb-annotations.jar',
        'delosdb-spi.jar',
        'delosdb-storage-io.jar',
        'osgi-framework-stub.jar',
        'derbyshared.jar',
        'delosdb-runtime-api.jar',
        'delosdb-storage-mvcc.jar',
        'derby.jar',
        'derbytools.jar'
]
final List<File> runtimeJarFiles = runtimeJarNames.collect { new File(runtimeJarDirectory, it) }

static List<String> csvProperty(Project project, String name, List<String> defaults) {
    String raw = project.findProperty(name)?.toString()?.trim()
    if (raw == null || raw.isEmpty()) {
        return List.copyOf(defaults)
    }
    List<String> values = raw.split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    if (values.isEmpty()) {
        throw new GradleException("${name} must contain at least one non-empty value")
    }
    return List.copyOf(new LinkedHashSet<>(values))
}

static int positiveIntProperty(Project project, String name, int defaultValue) {
    String raw = project.findProperty(name)?.toString()?.trim()
    if (raw == null || raw.isEmpty()) {
        return defaultValue
    }
    try {
        int value = Integer.parseInt(raw)
        if (value < 1) {
            throw new GradleException("${name} must be positive: ${raw}")
        }
        return value
    } catch (NumberFormatException failure) {
        throw new GradleException("${name} must be an integer: ${raw}", failure)
    }
}

static String nonBlankProperty(Project project, String name, String defaultValue) {
    String raw = project.findProperty(name)?.toString()?.trim()
    if (raw == null || raw.isEmpty()) {
        return defaultValue
    }
    return raw
}

final List<String> providers = csvProperty(project, 'delosdb.jmh.providers', ['heap', 'mvcc'])
final Set<String> unsupportedProviders = providers.findAll { !['heap', 'mvcc'].contains(it) } as Set<String>
if (!unsupportedProviders.isEmpty()) {
    throw new GradleException("delosdb.jmh.providers supports only heap,mvcc; found ${unsupportedProviders}")
}

final List<String> rowCounts = csvProperty(project, 'delosdb.jmh.rows', ['100'])
final List<String> payloadSizes = csvProperty(project, 'delosdb.jmh.payloadSizes', ['128'])
final List<String> commitBatchSizes = csvProperty(project, 'delosdb.jmh.commitBatchSizes', ['100'])

def parseIntegerValues = { String propertyName, List<String> values, int minimum, int maximum ->
    values.collect { value ->
        int parsed
        try {
            parsed = Integer.parseInt(value)
        } catch (NumberFormatException failure) {
            throw new GradleException("${propertyName} values must be integers: ${value}", failure)
        }
        if (parsed < minimum || parsed > maximum) {
            throw new GradleException(
                    "${propertyName} values must be between ${minimum} and ${maximum}: ${value}")
        }
        parsed
    }
}

final List<Integer> parsedRows = parseIntegerValues(
        'delosdb.jmh.rows', rowCounts, 100, Integer.MAX_VALUE)
final List<Integer> parsedPayloadSizes = parseIntegerValues(
        'delosdb.jmh.payloadSizes', payloadSizes, 16, 4096)
final List<Integer> parsedCommitBatchSizes = parseIntegerValues(
        'delosdb.jmh.commitBatchSizes', commitBatchSizes, 1, Integer.MAX_VALUE)
if (parsedCommitBatchSizes.max() > parsedRows.min()) {
    throw new GradleException(
            'Every delosdb.jmh.commitBatchSizes value must be no greater than the smallest '
                    + "delosdb.jmh.rows value (${parsedRows.min()}); found ${parsedCommitBatchSizes}")
}

final List<String> configuredIncludes = csvProperty(
        project,
        'delosdb.jmh.includes',
        ['.*DelosJdbcJmhBenchmark.*'])
final List<String> configuredProfilers = csvProperty(project, 'delosdb.jmh.profilers', [])
final List<String> configuredJvmArgs = csvProperty(project, 'delosdb.jmh.jvmArgs', [])

final int benchmarkThreads = positiveIntProperty(project, 'delosdb.jmh.threads', 1)
if (benchmarkThreads != 1) {
    throw new GradleException(
            'The embedded JDBC JMH surface is single-threaded. Use the dedicated concurrency '
                    + 'and jcstress lanes for multi-threaded proofs.')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // The standalone build consumes only assembled DelosDB runtime artifacts.
    // It never imports root-project source sets or implementation-only modules.
    jmh files(runtimeJarFiles)
    jmh 'org.ow2.asm:asm:9.9'
}

jmh {
    jmhVersion = '1.37'
    includes = configuredIncludes
    benchmarkMode = ['avgt']
    warmupIterations = positiveIntProperty(project, 'delosdb.jmh.warmupIterations', 2)
    iterations = positiveIntProperty(project, 'delosdb.jmh.iterations', 3)
    warmup = nonBlankProperty(project, 'delosdb.jmh.warmupTime', '500ms')
    timeOnIteration = nonBlankProperty(project, 'delosdb.jmh.iterationTime', '500ms')
    fork = positiveIntProperty(project, 'delosdb.jmh.forks', 1)
    threads = benchmarkThreads
    failOnError = true
    forceGC = false
    synchronizeIterations = true
    timeUnit = 'us'
    verbosity = nonBlankProperty(project, 'delosdb.jmh.verbosity', 'NORMAL')
    jmhTimeout = nonBlankProperty(project, 'delosdb.jmh.timeout', '10m')
    resultFormat = 'JSON'
    resultsFile = layout.buildDirectory.file('reports/jmh/results.json').get().asFile
    humanOutputFile = layout.buildDirectory.file('reports/jmh/human.txt').get().asFile
    profilers = configuredProfilers
    jvmArgsAppend = configuredJvmArgs
    includeTests = false
    duplicateClassesStrategy = DuplicatesStrategy.FAIL
    benchmarkParameters = [
            provider       : providers,
            rows           : rowCounts,
            payloadSize    : payloadSizes,
            commitBatchSize: commitBatchSizes
    ]
}

tasks.register('verifyDelosRuntimeJars') {
    group = 'verification'
    description = 'Verifies the assembled public DelosDB runtime jars required by the standalone JMH build.'
    inputs.files(runtimeJarFiles)

    doLast {
        List<File> missing = runtimeJarFiles.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    'Missing DelosDB runtime jar(s):\n  '
                            + missing.collect { it.absolutePath }.join('\n  ')
                            + '\nBuild them first from the repository root with: ./gradlew jars')
        }

        File toolsJar = new File(runtimeJarDirectory, 'derbytools.jar')
        new ZipFile(toolsJar).withCloseable { zip ->
            if (zip.getEntry('org/apache/derby/jdbc/EmbeddedDriver.class') == null) {
                throw new GradleException("${toolsJar} does not contain the public embedded JDBC driver")
            }
        }

        File mvccJar = new File(runtimeJarDirectory, 'delosdb-storage-mvcc.jar')
        String providerService = 'META-INF/services/org.apache.derby.iapi.store.types.DelosStorageProviderFactory'
        new ZipFile(mvccJar).withCloseable { zip ->
            def entry = zip.getEntry(providerService)
            if (entry == null) {
                throw new GradleException("${mvccJar} does not contain ${providerService}")
            }
            List<String> providersInJar = zip.getInputStream(entry)
                    .getText('UTF-8')
                    .readLines()
                    .collect { it.trim() }
                    .findAll { it && !it.startsWith('#') }
            if (!providersInJar.contains('io.github.ggeorg.delosdb.storage.mvcc.bridge.MvccInheritedStorageProviderFactory')) {
                throw new GradleException("${mvccJar} does not advertise the MVCC storage provider")
            }
        }
    }
}

tasks.register('verifyJmhApiBoundary') {
    group = 'verification'
    description = 'Rejects implementation-internal imports and accidental root-build wiring.'

    def benchmarkSources = fileTree('src/jmh/java') { include '**/*.java' }
    def rootBuildFiles = files(
            new File(repositoryRoot, 'settings.gradle'),
            new File(repositoryRoot, 'build.gradle'),
            fileTree(new File(repositoryRoot, 'gradle')) { include '**/*.gradle' },
            fileTree(repositoryRoot) { include 'delosdb-*/build.gradle' })
    inputs.files(benchmarkSources, rootBuildFiles)

    doLast {
        List<String> forbiddenImports = [
                'import io.github.ggeorg.delosdb.storage.mvcc.',
                'import org.apache.derby.impl.',
                'import org.apache.derby.iapi.'
        ]
        List<String> violations = []
        benchmarkSources.files.sort().each { source ->
            List<String> lines = source.readLines('UTF-8')
            lines.eachWithIndex { line, index ->
                forbiddenImports.each { forbidden ->
                    if (line.contains(forbidden)) {
                        violations << "${source}:${index + 1}: ${line.trim()}"
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    'Standalone JMH sources must use public JDBC/JDK APIs only:\n  '
                            + violations.join('\n  '))
        }

        List<String> rootWiringViolations = []
        rootBuildFiles.files.findAll { it.isFile() }.sort().each { buildFile ->
            String text = buildFile.getText('UTF-8')
            if (text.contains('me.champeau.jmh')) {
                rootWiringViolations << "${buildFile}: references the JMH plugin"
            }
            if (text.contains('benchmarks/jmh')) {
                rootWiringViolations << "${buildFile}: references the standalone JMH build"
            }
        }
        if (!rootWiringViolations.isEmpty()) {
            throw new GradleException(
                    'The normal DelosDB build must remain independent of JMH:\n  '
                            + rootWiringViolations.join('\n  '))
        }
    }
}

tasks.named('compileJmhJava', JavaCompile) {
    dependsOn tasks.named('verifyDelosRuntimeJars'), tasks.named('verifyJmhApiBoundary')
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.named('jmhJar', Jar) {
    dependsOn tasks.named('verifyDelosRuntimeJars'), tasks.named('verifyJmhApiBoundary')
    // Runtime jars all carry the same legal metadata. Keep one copy while
    // retaining FAIL for duplicate classes through the JMH extension above.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
}

tasks.named('jmh') {
    dependsOn tasks.named('verifyDelosRuntimeJars'), tasks.named('verifyJmhApiBoundary')
    doFirst {
        layout.buildDirectory.dir('reports/jmh').get().asFile.mkdirs()
    }
    doLast {
        File jsonReport = layout.buildDirectory.file('reports/jmh/results.json').get().asFile
        File humanReport = layout.buildDirectory.file('reports/jmh/human.txt').get().asFile
        if (!jsonReport.isFile() || jsonReport.length() == 0L) {
            throw new GradleException("JMH did not create a non-empty JSON report: ${jsonReport}")
        }
        Object parsed = new groovy.json.JsonSlurper().parse(jsonReport)
        if (!(parsed instanceof List) || parsed.isEmpty()) {
            throw new GradleException("JMH JSON report contains no benchmark results: ${jsonReport}")
        }
        if (!humanReport.isFile() || humanReport.length() == 0L) {
            throw new GradleException("JMH did not create a non-empty human report: ${humanReport}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyDelosRuntimeJars'),
            tasks.named('verifyJmhApiBoundary'),
            tasks.named('jmhClasses')
}
