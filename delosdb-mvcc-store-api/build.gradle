plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// Small API module for MVCC storage-engine contracts.  It must remain free of
// Derby adapter classes and concrete page-volume/WAL/checkpoint implementations.
def mainClassDir = layout.buildDirectory.dir('classes/main')

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

sourceSets {
    main {
        java {
            destinationDirectory.set(mainClassDir)
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    destinationDirectory.set(mainClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.register('compileDelosDbMvccStoreApi') {
    dependsOn tasks.named('compileJava')
}

tasks.named('jar', Jar) {
    archiveFileName = 'delosdb-mvcc-store-api.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB MVCC Store API')
    }
}

tasks.register('mvccStoreApiJar') {
    dependsOn tasks.named('jar')
}

tasks.named('check') {
    dependsOn tasks.named('classes')
}
