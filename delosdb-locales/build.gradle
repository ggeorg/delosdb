plugins {
    id 'base'
}

import org.apache.tools.ant.filters.ReplaceTokens

version = rootProject.version
group = rootProject.group

// Builds Derby's derbyLocale_<locale>.jar for each translation. MessageService
// looks up engine messages in org.apache.derby.loc.locale_<locale> and tool
// messages in org.apache.derby.loc.tools.locale_<locale>; on the module path
// it finds them in the module org.apache.derby.locale_<locale>, which the
// templates declare. Client and DRDA translations stay in derbyclient.jar and
// derbynet.jar, as in Derby.
def templates = file('src/main/templates')
def toolsTranslations = rootProject.file('delosdb-tools/src/main/java/org/apache/derby/loc')
def splitMessages = rootProject.ext.delosdbLocaleMessageRoot
def commonsClasses = project(':delosdb-commons').tasks.named('compileJava').flatMap { it.destinationDirectory }

def localeJarTasks = rootProject.ext.delosdbLocales.collect { locale, externalName ->
    def jarName = "derbyLocale_${locale}.jar"
    def generatedSources = layout.buildDirectory.dir("generated/sources/${locale}")
    def generatedInfo = layout.buildDirectory.dir("generated/info/${locale}")

    def generateSources = tasks.register("generateLocaleSources_${locale}", Copy) {
        from(templates) {
            include 'module-info.template'
            rename { 'module-info.java' }
        }
        from(templates) {
            include 'DerbyModule.template'
            rename { 'DerbyModule.java' }
            into "org/apache/derby/info/locale_${locale}"
        }
        filter(ReplaceTokens, tokens: [LOCALE: locale])
        into generatedSources
    }

    def compileModule = tasks.register("compileLocaleModule_${locale}", JavaCompile) {
        dependsOn generateSources, ':delosdb-commons:compileJava'
        source = fileTree(generatedSources)
        classpath = files()
        destinationDirectory = layout.buildDirectory.dir("classes/${locale}")
        sourceCompatibility = rootProject.ext.javaRelease.toString()
        targetCompatibility = rootProject.ext.javaRelease.toString()
        options.release = rootProject.ext.javaRelease
        options.encoding = 'UTF-8'
        inputs.files(commonsClasses).withPropertyName('modulePath')
        options.compilerArgumentProviders.add({ ['--module-path', commonsClasses.get().asFile.absolutePath] } as CommandLineArgumentProvider)
        // The opened message packages hold only resources, which javac does not see.
        options.compilerArgs.add('-Xlint:-opens')
    }

    def writeInfo = tasks.register("writeLocaleInfo_${locale}", WriteProperties) {
        destinationFile = generatedInfo.map { it.file("org/apache/derby/info/locale_${locale}/info.properties") }
        comment = 'Generated by Gradle. Do not edit.'
        encoding = 'UTF-8'
        lineSeparator = '\n'
        properties([
                'derby.locale.version.major'   : '10',
                'derby.locale.version.minor'   : '17',
                'derby.locale.version.maint'   : '1000000',
                'derby.locale.build.number'    : rootProject.ext.buildNumberProvider.get().toString(),
                'derby.locale.technology.name' : "_${locale}".toString(),
                'derby.locale.external.name'   : externalName,
                'derby.version.beta'           : 'false',
                'derby.locale.vendor'          : 'DelosDB Project',
                'derby.product.file'           : jarName
        ])
    }

    tasks.register("derbyLocaleJar_${locale}", Jar) {
        dependsOn ':splitEngineMessages', writeInfo
        archiveFileName = jarName
        destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
        from compileModule.flatMap { it.destinationDirectory }
        from generatedInfo
        from(splitMessages) {
            include "org/apache/derby/loc/locale_${locale}/**"
        }
        from(toolsTranslations) {
            include "sysinfoMessages_${locale}.properties"
            include "toolsmessages_${locale}.properties"
            // Derby's Polish sysinfo source has a lowercase name.
            include "sysinfomessages_${locale}.properties"
            rename "sysinfomessages_${locale}.properties", "sysinfoMessages_${locale}.properties"
            into "org/apache/derby/loc/tools/locale_${locale}"
        }
        from(rootProject.ext.delosdbLegalFiles) {
            into 'META-INF'
        }
        manifest {
            attributes rootProject.ext.delosdbRuntimeJarAttributes("DelosDB Locale ${externalName}", jarName)
        }
    }
}

tasks.register('localeJars') {
    group = 'build'
    description = 'Builds the derbyLocale_<locale>.jar files.'
    dependsOn localeJarTasks
}

tasks.named('assemble') {
    dependsOn tasks.named('localeJars')
}
