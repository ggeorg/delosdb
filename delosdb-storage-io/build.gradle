plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

def sourceRoot = file('src/main/java')
def mainClassDir = layout.buildDirectory.dir('classes/main')

tasks.register('compileDelosDbStorageIo', JavaCompile) {
    source = fileTree(sourceRoot) { include '**/*.java' }
    destinationDirectory = mainClassDir
    rootProject.ext.delosdbConfigureJavaCompile(delegate)
}

tasks.register('classes') {
    dependsOn 'compileDelosDbStorageIo'
}

tasks.register('delosDbStorageIoJar', Jar) {
    dependsOn 'compileDelosDbStorageIo'
    archiveFileName = 'delosdb-storage-io.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from mainClassDir
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Storage I/O')
    }
}

tasks.named('assemble') {
    dependsOn 'delosDbStorageIoJar'
}

tasks.named('check') {
    dependsOn 'compileDelosDbStorageIo'
}
