plugins {
    id 'base'
}

version = rootProject.version
group = rootProject.group

// The inherited Derby demos are intentionally moved into this Gradle module as
// a source layout first. Compilation/execution is deferred because several
// demos rely on legacy scripts, SQL files, and path-sensitive sample assets.
def demoSourceRoot = file('src/main/demo')

tasks.register('verifyDerbyDemosSourceLayout') {
    group = 'verification'
    description = 'Verifies that the inherited Derby demo tree is owned by delosdb-demos.'
    inputs.dir(demoSourceRoot)
    doLast {
        if (!demoSourceRoot.isDirectory()) {
            throw new GradleException("Missing inherited Derby demo source root: ${demoSourceRoot}")
        }
        def simpleApp = new File(demoSourceRoot, 'simple/SimpleApp.java')
        if (!simpleApp.isFile()) {
            throw new GradleException("Missing SimpleApp demo source: ${simpleApp}")
        }
        def networkSample = new File(demoSourceRoot, 'nserverdemo/SimpleNetworkServerSample.java')
        if (!networkSample.isFile()) {
            throw new GradleException("Missing network-server demo source: ${networkSample}")
        }
        def toursSchema = new File(demoSourceRoot, 'toursdb/ToursDB_schema.sql')
        if (!toursSchema.isFile()) {
            throw new GradleException("Missing toursdb schema: ${toursSchema}")
        }
        def vtiDemo = new File(demoSourceRoot, 'vtis/demoFileVtis.sql')
        if (!vtiDemo.isFile()) {
            throw new GradleException("Missing VTI demo SQL script: ${vtiDemo}")
        }
    }
}

tasks.register('verifyDerbyDemosAssets') {
    group = 'verification'
    description = 'Verifies that the inherited Derby demo assets are present in the delosdb-demos module.'
    dependsOn 'verifyDerbyDemosSourceLayout'
    inputs.dir(demoSourceRoot)
    doLast {
        def requiredFiles = [
                'README.txt',
                'build.xml',
                'demo.html',
                'nserverdemo/NetworkServerUtil.java',
                'nserverdemo/NsSample.java',
                'nserverdemo/SimpleNetworkClientSample.java',
                'nserverdemo/SimpleNetworkServerSample.java',
                'scores/README.html',
                'scores/build.xml',
                'simple/SimpleApp.java',
                'simple/derby.properties',
                'toursdb/ToursDB_schema.sql',
                'toursdb/loadTables.sql',
                'toursdb/toursdb.xml',
                'vtis/demoFileVtis.sql',
                'vtis/messages_en.properties',
                'workingwithderby/WwdEmbedded.java',
                'workingwithderby/WwdClientExample.java'
        ]
        requiredFiles.each { relativePath ->
            def requiredFile = new File(demoSourceRoot, relativePath)
            if (!requiredFile.isFile()) {
                throw new GradleException("Missing inherited Derby demo asset: ${requiredFile}")
            }
        }

        def javaSources = fileTree(demoSourceRoot) {
            include '**/*.java'
        }.files
        if (javaSources.size() < 20) {
            throw new GradleException("Expected at least 20 inherited Derby demo Java sources, found ${javaSources.size()}")
        }

        def sqlScripts = fileTree(demoSourceRoot) {
            include '**/*.sql'
        }.files
        if (sqlScripts.size() < 8) {
            throw new GradleException("Expected at least 8 inherited Derby demo SQL scripts, found ${sqlScripts.size()}")
        }

        def imageAssets = fileTree(demoSourceRoot) {
            include '**/*.gif', '**/*.png'
        }.files
        if (imageAssets.size() < 4) {
            throw new GradleException("Expected inherited Derby demo image assets, found ${imageAssets.size()}")
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyDerbyDemosSourceLayout', 'verifyDerbyDemosAssets'
}
