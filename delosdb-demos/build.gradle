plugins {
    id 'base'
}

version = rootProject.version
group = rootProject.group

// The inherited Derby demos are retained as source/reference material only.
// They are not DelosDB product demos and are not compiled or executed by the
// core verification path because several depend on legacy scripts, SQL files,
// and path-sensitive sample assets.
def demoSourceRoot = file('src/main/demo')

tasks.register('verifyInheritedDemosStatus') {
    group = 'verification'
    description = 'Verifies inherited Derby demos are explicitly marked as retained but unverified.'
    inputs.file file('README.md')
    inputs.files fileTree(demoSourceRoot)

    doLast {
        def statusFile = file('README.md')
        if (!statusFile.isFile()) {
            throw new GradleException('delosdb-demos/README.md must explain inherited demo status.')
        }

        def requiredAssets = [
                'src/main/demo/README.txt',
                'src/main/demo/simple/SimpleApp.java',
                'src/main/demo/nserverdemo/SimpleNetworkServerSample.java',
                'src/main/demo/toursdb/ToursDB_schema.sql'
        ]
        requiredAssets.each { relativePath ->
            if (!file(relativePath).isFile()) {
                throw new GradleException("Missing inherited demo asset: ${relativePath}")
            }
        }

        def javaFiles = fileTree(demoSourceRoot) { include '**/*.java' }.files
        if (javaFiles.isEmpty()) {
            throw new GradleException('Inherited demos should still contain Java source assets.')
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyInheritedDemosStatus'
}
