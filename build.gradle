// -----------------------------------------------------------------------------

// Legacy Derby store guard tasks are intentionally kept out of the root build file.
// Compact permanent storage-Derby Phase-B boundary gates.
// Permanent DelosDB storage guards and closed-phase executable smokes.
// Closed C/F text-token report guards are retired after Phase F closeout.


// Phase F2.2: storage-phase smoke compiles put compiled module directories on
// their classpath.  The engine-kernel module directory is also populated by the
// generated ClassSizeCatalog compile task, so Gradle 8.14 requires an explicit
// producer dependency for every storage-phase smoke compile task which may read
// that directory.
tasks.withType(JavaCompile).configureEach { JavaCompile compileTask ->
    if (compileTask.name.startsWith('compileStoragePhase')) {
        compileTask.dependsOn ':delosdb-engine-kernel:compileDelosDbEngineKernelClassSizeCatalog'
    }
}
