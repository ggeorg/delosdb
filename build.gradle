// -----------------------------------------------------------------------------
// Local Maven publication baseline
// -----------------------------------------------------------------------------
// Maven coordinates are DelosDB-branded even while the binary distribution keeps
// Derby-compatible runtime jar names for now.
ext.delosdbPublicationMetadata = [
        'delosdb-commons'      : [artifactId: 'delosdb-commons',       jarTask: 'derbySharedJar',        title: 'DelosDB Shared Utilities', dependencies: []],
        'delosdb-spi'          : [artifactId: 'delosdb-spi',           jarTask: 'delosDbSpiJar',       title: 'DelosDB SPI Stability Markers', dependencies: []],
        'delosdb-engine'       : [artifactId: 'delosdb-engine',        jarTask: 'derbyJar',              title: 'DelosDB Embedded Engine', dependencies: ['delosdb-commons']],
        'delosdb-client'       : [artifactId: 'delosdb-client',        jarTask: 'derbyClientJar',        title: 'DelosDB Network Client', dependencies: ['delosdb-commons']],
        'delosdb-tools'        : [artifactId: 'delosdb-tools',         jarTask: 'derbyToolsJar',         title: 'DelosDB Tools', dependencies: ['delosdb-commons', 'delosdb-engine', 'delosdb-client']],
        'delosdb-runner'       : [artifactId: 'delosdb-runner',        jarTask: 'derbyRunJar',           title: 'DelosDB Runner', dependencies: ['delosdb-commons', 'delosdb-tools', 'delosdb-server']],
        'delosdb-server'       : [artifactId: 'delosdb-server',        jarTask: 'derbyNetJar',           title: 'DelosDB Network Server', dependencies: ['delosdb-commons', 'delosdb-engine', 'delosdb-tools']],
        'delosdb-optionaltools': [artifactId: 'delosdb-optionaltools', jarTask: 'derbyOptionalToolsJar', title: 'DelosDB Optional Tools', dependencies: ['delosdb-commons', 'delosdb-engine', 'delosdb-tools']]
]

ext.delosdbPublicationProjectNames = delosdbPublicationMetadata.keySet().sort()

subprojects { subproject ->
    def publicationInfo = rootProject.ext.delosdbPublicationMetadata[subproject.name]
    if (publicationInfo != null) {
        apply plugin: 'maven-publish'

        afterEvaluate {
            publishing {
                publications {
                    create('mavenJava', org.gradle.api.publish.maven.MavenPublication) {
                        groupId = rootProject.group.toString()
                        artifactId = publicationInfo.artifactId
                        version = rootProject.version.toString()

                        def runtimeJarTask = tasks.named(publicationInfo.jarTask)
                        artifact(runtimeJarTask.flatMap { it.archiveFile }) {
                            builtBy runtimeJarTask
                        }

                        pom {
                            name = publicationInfo.title
                            description = "${publicationInfo.title}. Part of DelosDB, a modern Java embedded SQL database forked from Apache Derby 10.17.1.0."
                            url = 'https://github.com/ggeorg/delosdb'

                            licenses {
                                license {
                                    name = 'Apache License, Version 2.0'
                                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                                    distribution = 'repo'
                                }
                            }

                            developers {
                                developer {
                                    id = 'ggeorg'
                                    name = 'DelosDB Project'
                                    url = 'https://github.com/ggeorg/delosdb'
                                }
                            }

                            scm {
                                connection = 'scm:git:https://github.com/ggeorg/delosdb.git'
                                developerConnection = 'scm:git:https://github.com/ggeorg/delosdb.git'
                                url = 'https://github.com/ggeorg/delosdb'
                            }

                            withXml {
                                def dependencyProjectNames = publicationInfo.dependencies ?: []
                                if (!dependencyProjectNames.isEmpty()) {
                                    def dependenciesNode = asNode().appendNode('dependencies')
                                    dependencyProjectNames.each { dependencyProjectName ->
                                        def dependencyInfo = rootProject.ext.delosdbPublicationMetadata[dependencyProjectName]
                                        if (dependencyInfo == null) {
                                            throw new GradleException("Unknown DelosDB publication dependency '${dependencyProjectName}' for ${subproject.path}")
                                        }
                                        def dependencyNode = dependenciesNode.appendNode('dependency')
                                        dependencyNode.appendNode('groupId', rootProject.group.toString())
                                        dependencyNode.appendNode('artifactId', dependencyInfo.artifactId)
                                        dependencyNode.appendNode('version', rootProject.version.toString())
                                        dependencyNode.appendNode('scope', 'compile')
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

tasks.register('verifyMavenPublications') {
    group = 'verification'
    description = 'Publishes DelosDB runtime artifacts to Maven Local and verifies their POM and jar metadata.'
    dependsOn rootProject.ext.delosdbPublicationProjectNames.collect { ":${it}:publishMavenJavaPublicationToMavenLocal" }
    doLast {
        def repositoryBase = new File(System.getProperty('user.home'), ".m2/repository/${project.group.toString().replace('.', '/')}")
        rootProject.ext.delosdbPublicationMetadata.each { projectName, publicationInfo ->
            def artifactDirectory = new File(repositoryBase, "${publicationInfo.artifactId}/${project.version}")
            def publishedJar = new File(artifactDirectory, "${publicationInfo.artifactId}-${project.version}.jar")
            def publishedPom = new File(artifactDirectory, "${publicationInfo.artifactId}-${project.version}.pom")

            if (!publishedJar.isFile() || publishedJar.length() == 0L) {
                throw new GradleException("Missing or empty Maven Local jar for ${publicationInfo.artifactId}: ${publishedJar}")
            }
            if (!publishedPom.isFile() || publishedPom.length() == 0L) {
                throw new GradleException("Missing or empty Maven Local POM for ${publicationInfo.artifactId}: ${publishedPom}")
            }

            def pomText = publishedPom.text
            [
                    "<groupId>${project.group}</groupId>",
                    "<artifactId>${publicationInfo.artifactId}</artifactId>",
                    "<version>${project.version}</version>",
                    '<name>',
                    '<description>',
                    '<licenses>',
                    '<scm>'
            ].each { requiredText ->
                if (!pomText.contains(requiredText)) {
                    throw new GradleException("Published POM for ${publicationInfo.artifactId} is missing '${requiredText}'")
                }
            }

            (publicationInfo.dependencies ?: []).each { dependencyProjectName ->
                def dependencyInfo = rootProject.ext.delosdbPublicationMetadata[dependencyProjectName]
                if (!pomText.contains("<artifactId>${dependencyInfo.artifactId}</artifactId>")) {
                    throw new GradleException("Published POM for ${publicationInfo.artifactId} is missing dependency ${dependencyInfo.artifactId}")
                }
            }
        }
        println "Verified DelosDB Maven Local publications under ${repositoryBase}"
    }
}


// Prove that the Maven Local publications are consumable from a fresh external
// Gradle project, not only present on disk. This intentionally uses a generated
// throw-away consumer project under build/ so it does not pollute the repository.
def mavenLocalConsumerProjectDir = layout.buildDirectory.dir('consumer-tests/maven-local-embedded-smoke')

tasks.register('writeMavenLocalConsumerProject') {
    dependsOn 'verifyMavenPublications'
    group = 'verification'
    description = 'Writes a temporary external Gradle project that consumes DelosDB from Maven Local.'
    outputs.dir(mavenLocalConsumerProjectDir)
    doLast {
        def consumerDir = mavenLocalConsumerProjectDir.get().asFile
        delete consumerDir

        def sourceDir = new File(consumerDir, 'src/main/java/delosdb/smoke')
        sourceDir.mkdirs()

        new File(consumerDir, 'settings.gradle').text = """pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenLocal()
        mavenCentral()
    }
}

rootProject.name = 'delosdb-maven-local-embedded-smoke'
"""

        new File(consumerDir, 'build.gradle').text = """plugins {
    id 'application'
}

group = 'io.github.ggeorg.delosdb.consumer'
version = '0.1.0-dev'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(${javaRelease})
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = ${javaRelease}
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'delosdb.smoke.MavenLocalSmoke'
}

dependencies {
    implementation '${project.group}:delosdb-engine:${project.version}'
}
"""

        new File(sourceDir, 'MavenLocalSmoke.java').text = """package delosdb.smoke;

import java.sql.Connection;
import java.sql.DriverManager;
import java.sql.ResultSet;
import java.sql.Statement;

public final class MavenLocalSmoke {
    private MavenLocalSmoke() {
    }

    public static void main(String[] args) throws Exception {
        Class.forName(\"org.apache.derby.jdbc.EmbeddedDriver\");
        try (Connection connection = DriverManager.getConnection(\"jdbc:derby:build/consumer-db;create=true\");
             Statement statement = connection.createStatement()) {
            statement.executeUpdate(\"create table delosdb_smoke(id int primary key, value varchar(32))\");
            statement.executeUpdate(\"insert into delosdb_smoke values (1, 'maven-local-ok')\");
            try (ResultSet resultSet = statement.executeQuery(\"select value from delosdb_smoke where id = 1\")) {
                if (!resultSet.next()) {
                    throw new IllegalStateException(\"No smoke-test row returned\");
                }
                String value = resultSet.getString(1);
                if (!\"maven-local-ok\".equals(value)) {
                    throw new IllegalStateException(\"Unexpected smoke-test value: \" + value);
                }
            }
        }
        System.out.println(\"DelosDB Maven Local consumer smoke test passed.\");
    }
}
"""
    }
}

