    }
    imports.groupBy { it.importedType }
            .collect { importedType, rows -> [importedType: importedType, count: rows.size(), files: rows.collect { it.source }.unique().size()] }
            .sort { a, b -> b.count <=> a.count ?: a.importedType <=> b.importedType }
            .collect { String.format('  %-86s %4d imports / %3d files', it.importedType, it.count, it.files) }
            .join('\n')
}

def delosdbB5GroupedImportSummary = { Collection<Map> imports ->
    if (imports.isEmpty()) {
        return '  (none)'
    }
    imports.groupBy { it.importedType }
            .collect { importedType, rows -> [importedType: importedType, files: rows.collect { it.source }.unique().sort { a, b -> a.path <=> b.path }] }
            .sort { a, b -> a.importedType <=> b.importedType }
            .collect { item ->
                def files = item.files.collect { '      - ' + delosdbB5RelPath(it) }.join('\n')
                "  ${item.importedType}\n${files}"
            }
            .join('\n')
}

def delosdbB5PackageImports = { Collection<Map> imports, String prefix ->
    imports.findAll { it.importedType.startsWith(prefix) }
}

def delosdbB5EngineOwnedImports = { Collection<Map> imports ->
    imports.findAll { imported ->
        if (!imported.importedType.startsWith('org.apache.derby.') && !imported.importedType.startsWith('io.github.ggeorg.delosdb.engine.')) {
            return false
        }
        def packagePath = imported.importedType.substring(0, imported.importedType.lastIndexOf('.')).replace('.', '/')
        def inEngine = new File(delosdbB5EngineSourceRoot, packagePath).exists()
        def inKernel = new File(delosdbB5KernelSourceRoot, packagePath).exists()
        return inEngine && !inKernel
    }
}

def delosdbB5TypeMoveRiskImports = { ->
    def typeRoot = file('delosdb-engine/src/main/java/org/apache/derby/iapi/types')
    delosdbB5ImportsFromSources(delosdbB5JavaSourcesUnder(typeRoot)).findAll { imported ->
        imported.importedType.startsWith('org.apache.derby.iapi.sql.') ||
                imported.importedType.startsWith('org.apache.derby.impl.sql.') ||
                imported.importedType.startsWith('org.apache.derby.iapi.db.') ||
                imported.importedType.startsWith('org.apache.derby.iapi.jdbc.') ||
                imported.importedType.startsWith('org.apache.derby.iapi.services.loader.') ||
                imported.importedType.startsWith('org.apache.derby.iapi.xml.') ||
                imported.importedType.startsWith('org.apache.derby.catalog.') ||
                imported.importedType.startsWith('org.apache.derby.impl.jdbc.')
    }
}

tasks.register('legacyDerbyStoreKernelB5DependencyDecisionReport') {
