def delosdbB5hReportFile = layout.buildDirectory.file('reports/delosdb/legacy-store-kernel-b5h-type-bridge.txt')

def delosdbB5hRead = { File f -> f.isFile() ? f.text : '' }
def delosdbB5hRelPath = { File f -> rootDir.toPath().relativize(f.toPath()).toString() }

def delosdbB5hKernelTypeSources = { ->
