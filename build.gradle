tasks.register('verifyReleaseDistribution') {
    dependsOn 'delosdbBinaryZip', 'delosdbBinaryTar'
    group = 'verification'
    description = 'Verifies the DelosDB binary distribution archive shape.'
    def zipFileProvider = layout.buildDirectory.file("distributions/${distributionArchiveNames.zip}")
    def tarFileProvider = layout.buildDirectory.file("distributions/${distributionArchiveNames.tar}")
    inputs.files(zipFileProvider, tarFileProvider)
    doLast {
        def zipFile = zipFileProvider.get().asFile
        def tarFile = tarFileProvider.get().asFile
        [zipFile, tarFile].each { archive ->
            if (!archive.isFile()) {
                throw new GradleException("Missing distribution archive: ${archive}")
            }
            if (archive.length() == 0L) {
                throw new GradleException("Empty distribution archive: ${archive}")
            }
        }

        def requiredEntries = [
                'README.md',
                'LICENSE',
                'NOTICE',
                'NOTICE-FORK.md',
                'bin/delosdb',
                'bin/delosdb.bat',
                'docs/BUILDING.md',
                'docs/ARTIFACTS.md',
                'examples/smoke.sql'
        ] + runtimeJarNames.collect { "lib/${it}" }

        new ZipFile(zipFile).withCloseable { zip ->
            requiredEntries.each { relativePath ->
                def entryName = "${distributionBaseName}/${relativePath}"
                if (zip.getEntry(entryName) == null) {
                    throw new GradleException("Missing ${entryName} in ${zipFile.name}")
                }
            }
        }
    }
}

tasks.register('dist') {
    dependsOn 'verifyReleaseDistribution'
    group = 'distribution'
    description = 'Builds and verifies the DelosDB binary distribution archives.'
}

