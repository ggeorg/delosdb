def moduleClassDir = { String moduleName ->
    def moduleProject = moduleProjects[moduleName]
    moduleProject == null
            ? layout.buildDirectory.dir("classes/modules/${moduleName}")
            : project(moduleProject).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

