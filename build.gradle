tasks.register('generateClassSizeCatalog') {
    // ClassSizeCrawler scans the compiled engine output tree. Gradle 8.14
    // requires every task which writes into that tree to be ordered before
    // this scan, otherwise it reports an implicit dependency problem.
    dependsOn 'compileDerbyBuildTools', 'splitEngineMessages'
    def outputFile = generatedSourceDir(moduleNames.engine).map {
        it.file('org/apache/derby/iapi/services/cache/ClassSizeCatalogImpl.java')
    }
    inputs.dir(moduleClassDir(moduleNames.engine))
    outputs.file(outputFile)
    doLast {
        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        javaexec {
            classpath = files(
                    layout.buildDirectory.dir('classes/build-tools'),
                    moduleClassDir(moduleNames.commons),
                    moduleClassDir(moduleNames.engine)
            )
            mainClass = 'org.apache.derbyBuild.ClassSizeCrawler'
            systemProperty 'WS', projectDir.absolutePath
            systemProperty 'classDir', moduleClassDir(moduleNames.engine).get().asFile.absolutePath
            systemProperty 'out', target.absolutePath
            systemProperty 'prefix.1', 'org.apache.derby.iapi.types'
            systemProperty 'prefix.2', 'org.apache.derby.impl'
            args 'org.apache.derby.iapi.types.DataValueDescriptor',
                    'org.apache.derby.impl.store.raw.data.RecordId',
                    'org.apache.derby.iapi.store.raw.ContainerKey',
                    'org.apache.derby.iapi.services.cache.SizedCacheable',
                    'java.lang.ref.WeakReference',
                    'java.math.BigDecimal',
                    'java.util.ArrayList',
                    'java.util.GregorianCalendar',
                    'java.util.Vector'
        }
    }
}

tasks.register('compileClassSizeCatalog', JavaCompile) {
    dependsOn 'generateClassSizeCatalog'
    source = files(generatedSourceDir(moduleNames.engine).map {
        it.file('org/apache/derby/iapi/services/cache/ClassSizeCatalogImpl.java')
    })
    destinationDirectory = moduleClassDir(moduleNames.engine)
    configureJavaCompile(delegate, [
            moduleClassDir(moduleNames.commons),
            moduleClassDir(moduleNames.engine),
            moduleClassDir(moduleNames.osgi)
    ])
}

tasks.register('processDerbyResources') {
    dependsOn 'compileDerbyCommons', 'compileDerbyEngine', 'compileDerbyClient', 'compileDerbyTools',
            'compileDerbyServer', 'compileDerbyOptionalTools', 'compileDerbyRunner'
    doLast {
        [
                (moduleNames.commons)      : 'java/org.apache.derby.commons',
                (moduleNames.engine)       : 'java/org.apache.derby.engine',
                (moduleNames.client)       : 'java/org.apache.derby.client',
                (moduleNames.tools)        : 'java/org.apache.derby.tools',
                (moduleNames.server)       : 'java/org.apache.derby.server',
                (moduleNames.optionaltools): 'java/org.apache.derby.optionaltools',
                (moduleNames.runner)       : 'java/org.apache.derby.runner'
        ].each { moduleName, sourceDir ->
            copy {
                from(sourceDir) {
                    include '**/*.properties'
                    include '**/*.policy'
                    include '**/*.xml'
                    exclude '**/messages.xml'
                    exclude '**/*.tmpl'
                }
                into moduleClassDir(moduleName).get().asFile
            }
        }

        copy {
            from('java/org.apache.derby.tools/org/apache/derby/loc') {
                include 'sysinfoMessages.properties'
                include 'toolsmessages.properties'
            }
            into new File(moduleClassDir(moduleNames.tools).get().asFile, 'org/apache/derby/loc/tools')
        }

        new File(moduleClassDir(moduleNames.engine).get().asFile, 'META-INF/services').mkdirs()
        new File(moduleClassDir(moduleNames.engine).get().asFile, 'META-INF/services/java.sql.Driver').text =
                'org.apache.derby.iapi.jdbc.AutoloadedDriver\n'
        new File(moduleClassDir(moduleNames.client).get().asFile, 'META-INF/services').mkdirs()
        new File(moduleClassDir(moduleNames.client).get().asFile, 'META-INF/services/java.sql.Driver').text =
                'org.apache.derby.client.ClientAutoloadedDriver\n'

        writeInfoProperties(
                new File(moduleClassDir(moduleNames.engine).get().asFile, 'org/apache/derby/info/engine/info.properties'),
                'DelosDB Embedded Engine',
                'derby.jar'
        )
        writeInfoProperties(
                new File(moduleClassDir(moduleNames.tools).get().asFile, 'org/apache/derby/info/tools/info.properties'),
                'DelosDB Tools',
                'derbytools.jar'
        )
        writeInfoProperties(
                new File(moduleClassDir(moduleNames.server).get().asFile, 'org/apache/derby/info/net/info.properties'),
                'DelosDB Network Server',
                'derbynet.jar'
        )
        writeInfoProperties(
                new File(moduleClassDir(moduleNames.client).get().asFile, 'org/apache/derby/info/client/info.properties'),
                'DelosDB Network Client',
                'derbyclient.jar'
        )
        writeInfoProperties(
                new File(moduleClassDir(moduleNames.commons).get().asFile, 'org/apache/derby/info/shared/info.properties'),
                'DelosDB Shared Utilities',
                'derbyshared.jar'
        )
        writeInfoProperties(
                new File(moduleClassDir(moduleNames.optionaltools).get().asFile, 'org/apache/derby/optional/info.properties'),
                'DelosDB Optional Tools',
                'derbyoptionaltools.jar'
        )
    }
}

tasks.register('splitEngineMessages') {
    dependsOn 'compileDerbyBuildTools', 'processDerbyResources'
    inputs.file('java/org.apache.derby.engine/org/apache/derby/loc/messages.properties')
    outputs.dir(moduleClassDir(moduleNames.engine).map { it.dir('org/apache/derby/loc') })
    doLast {
        def generatedMessagesDir = layout.buildDirectory.dir('generated/messages').get().asFile
        generatedMessagesDir.mkdirs()
        def englishMessages = new File(generatedMessagesDir, 'messages_en.properties')
        englishMessages.text = file('java/org.apache.derby.engine/org/apache/derby/loc/messages.properties').text

        def engineLoc = new File(moduleClassDir(moduleNames.engine).get().asFile, 'org/apache/derby/loc')
        def clientLoc = new File(moduleClassDir(moduleNames.client).get().asFile, 'org/apache/derby/loc/client')
        def localeLoc = layout.buildDirectory.dir('generated/locale/org/apache/derby/loc').get().asFile
        engineLoc.mkdirs()
        clientLoc.mkdirs()
        localeLoc.mkdirs()

        javaexec {
            classpath = files(
                    layout.buildDirectory.dir('classes/build-tools'),
                    moduleClassDir(moduleNames.commons)
            )
            mainClass = 'org.apache.derbyBuild.splitmessages'
            args engineLoc.absolutePath,
                    clientLoc.absolutePath,
                    localeLoc.absolutePath,
                    englishMessages.absolutePath
        }
    }
}

