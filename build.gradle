// Derby documents starting the tools and the server with `java -jar`, which
// works only while derbyrun.jar and derbynet.jar carry Main-Class and every
// jar's Class-Path names the jars it needs.
tasks.register('jarLaunchSmoke') {
    dependsOn 'jars'
    group = 'verification'
    description = 'Runs java -jar derbyrun.jar and java -jar derbynet.jar from build/libs, as users do.'
    def libs = layout.buildDirectory.dir('libs')
    doLast {
        def java = new File(System.getProperty('java.home'), 'bin/java').absolutePath
        def launch = { String jar, List<String> args, String expected ->
            def command = [java, '-jar', libs.get().file(jar).asFile.absolutePath] + args
            def process = new ProcessBuilder(command).redirectErrorStream(true).start()
            def output = process.inputStream.text
            process.waitFor()
            if (!output.contains(expected)) {
                throw new GradleException("java -jar ${jar} ${args.join(' ')} did not print '${expected}':\n${output}")
            }
        }
        launch('derbyrun.jar', ['ij', '--help'], 'Usage: java org.apache.derby.tools.ij')
        launch('derbyrun.jar', ['sysinfo'], 'derbytools.jar')
        launch('derbynet.jar', [], 'Usage: NetworkServerControl')
    }
}

