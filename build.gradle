def registerStorageProviderDatabaseSmoke = { String taskName,
                                            String smokeDirName,
                                            String mainClassName,
                                            String description,
                                            List<String> mustRunAfterTasks ->
    def classesDir = layout.buildDirectory.dir("classes/${smokeDirName}")
    def compileTaskName = "compile${taskName.capitalize()}"

    tasks.register(compileTaskName, JavaCompile) {
        dependsOn 'jars'
        group = 'verification'
        description = "Compiles ${description}"
        source = files("dev/${smokeDirName}/src/main/java", smokeUtilsSourceDir)
        destinationDirectory = classesDir
        sourceCompatibility = javaRelease.toString()
        targetCompatibility = javaRelease.toString()
        options.release = javaRelease
        options.encoding = 'UTF-8'
        classpath = runtimeJars()
    }

    tasks.register(taskName, JavaExec) {
        dependsOn compileTaskName
        if (!mustRunAfterTasks.isEmpty()) {
            mustRunAfter mustRunAfterTasks
        }
        group = 'verification'
        description = description
        classpath = files(classesDir, runtimeJars())
        mainClass = mainClassName
        args layout.buildDirectory.dir("${smokeDirName}/db").get().asFile.absolutePath
        workingDir = layout.buildDirectory.dir(smokeDirName).get().asFile
        doFirst {
            delete file("build/${smokeDirName}")
            workingDir.mkdirs()
        }
    }
}

