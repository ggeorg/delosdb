[
        [name: 'derbyJar', moduleName: moduleNames.engine, archive: 'derby.jar'],
        [name: 'derbyNetJar', moduleName: moduleNames.server, archive: 'derbynet.jar'],
        [name: 'derbyOptionalToolsJar', moduleName: moduleNames.optionaltools, archive: 'derbyoptionaltools.jar'],
        [name: 'osgiFrameworkStubJar', moduleName: moduleNames.osgi, archive: 'osgi-framework-stub.jar']
].each { spec ->
    tasks.register(spec.name, Jar) {
        dependsOn 'compileAll'
        archiveFileName = spec.archive
        destinationDirectory = layout.buildDirectory.dir('libs')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from moduleClassDir(spec.moduleName)
        from(legalFiles) {
            into 'META-INF'
        }
        manifest {
            attributes releaseManifestAttributes(spec.archive)
            if (spec.archive == 'derbyrun.jar') {
                attributes 'Main-Class': 'org.apache.derby.run.run'
            }
        }
    }
}

