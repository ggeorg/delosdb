        (moduleNames.commons)      : ':delosdb-commons',
        (moduleNames.engineKernel) : ':delosdb-engine-kernel',
        (moduleNames.engineApi)    : ':delosdb-engine-api',
        (moduleNames.storageIo)    : ':delosdb-storage-io',
        (moduleNames.engine)       : ':delosdb-engine',
        (moduleNames.client)       : ':delosdb-client',
        (moduleNames.tools)        : ':delosdb-tools',
        (moduleNames.server)       : ':delosdb-server',
