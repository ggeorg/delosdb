            throw new GradleException('B5c expected Resetable stream contract in services.io: ' + delosdbB5cRelPath(kernelResetable))
        }
        if (!delosdbB5cRead(kernelResetable).contains('package org.apache.derby.iapi.services.io;')) {
            throw new GradleException('B5c Resetable must belong to org.apache.derby.iapi.services.io')
        }

        def staleResetable = file('delosdb-engine/src/main/java/org/apache/derby/iapi/types/Resetable.java')
        if (staleResetable.exists()) {
            throw new GradleException('B5c stale iapi.types.Resetable remains after cleanup: ' + delosdbB5cRelPath(staleResetable))
        }

        def oldResetableImports = fileTree(rootDir) {
            include 'delosdb-engine/src/main/java/**/*.java'
            include 'delosdb-storage-derby/src/main/java/**/*.java'
            include 'delosdb-tests/src/test/java/**/*.java'
            exclude '**/build/**'
        }.files.findAll { it.text.contains('org.apache.derby.iapi.types.Resetable') }
        if (!oldResetableImports.isEmpty()) {
            throw new GradleException('B5c stale imports of org.apache.derby.iapi.types.Resetable remain: ' + oldResetableImports.collect { delosdbB5cRelPath(it) })
        }

        def requiredNewImportFiles = [
                file('delosdb-engine/src/main/java/org/apache/derby/impl/jdbc/EmbedBlob.java'),
                file('delosdb-engine/src/main/java/org/apache/derby/impl/jdbc/EmbedClob.java'),
                file('delosdb-engine/src/main/java/org/apache/derby/impl/jdbc/PositionedStoreStream.java'),
                file('delosdb-engine/src/main/java/org/apache/derby/impl/jdbc/StoreStreamClob.java'),
                file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/raw/data/OverflowInputStream.java'),
                file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/util/streams/LoopingAlphabetStream.java')
        ]
        requiredNewImportFiles.each { sourceFile ->
            if (!sourceFile.isFile() || !sourceFile.text.contains('org.apache.derby.iapi.services.io.Resetable')) {
                throw new GradleException('B5c expected Resetable import rewrite in: ' + delosdbB5cRelPath(sourceFile))
            }
        }

        ['SQLBinary.java', 'SQLChar.java', 'SQLClob.java'].each { typeSource ->
            def sourceFile = file('delosdb-engine/src/main/java/org/apache/derby/iapi/types/' + typeSource)
            if (!sourceFile.isFile() || !sourceFile.text.contains('org.apache.derby.iapi.services.io.Resetable')) {
                throw new GradleException('B5c expected iapi.types stream classes to import services.io.Resetable: ' + delosdbB5cRelPath(sourceFile))
            }
        }

        def kernelModuleInfo = delosdbB5cRead(file('delosdb-engine-kernel/src/main/java/module-info.java'))
        if (!kernelModuleInfo.contains('exports org.apache.derby.iapi.services.io;')) {
            throw new GradleException('B5c kernel module-info must export org.apache.derby.iapi.services.io')
        }
        def engineModuleInfo = delosdbB5cRead(file('delosdb-engine/src/main/java/module-info.java'))
        if (engineModuleInfo.contains('    exports org.apache.derby.iapi.services.io;')) {
            throw new GradleException('B5c engine module-info still exports moved services.io package')
        }

        def reportFile = delosdbB5cReportFile.get().asFile
        if (!reportFile.isFile() || !reportFile.text.contains('B6 readiness') || !reportFile.text.contains('NOT YET')) {
            throw new GradleException('B5c report must explicitly say B6 readiness is NOT YET')
        }
        logger.lifecycle('Verified B5c services.io split into delosdb-engine-kernel')
    }
}

