def moduleClassDir = { String moduleName ->
    if (moduleName == moduleNames.commons) {
        return project(':delosdb-commons').layout.buildDirectory.dir("classes/modules/${moduleName}")
    }
    if (moduleName == moduleNames.engine) {
        return project(':delosdb-engine').layout.buildDirectory.dir("classes/modules/${moduleName}")
    }
    if (moduleName == moduleNames.client) {
        return project(':delosdb-client').layout.buildDirectory.dir("classes/modules/${moduleName}")
    }
    if (moduleName == moduleNames.tools) {
        return project(':delosdb-tools').layout.buildDirectory.dir("classes/modules/${moduleName}")
    }
    if (moduleName == moduleNames.runner) {
        return project(':delosdb-runner').layout.buildDirectory.dir("classes/modules/${moduleName}")
    }
    if (moduleName == moduleNames.server) {
        return project(':delosdb-server').layout.buildDirectory.dir("classes/modules/${moduleName}")
    }
    if (moduleName == moduleNames.optionaltools) {
        return project(':delosdb-optionaltools').layout.buildDirectory.dir("classes/modules/${moduleName}")
    }
    layout.buildDirectory.dir("classes/modules/${moduleName}")
}

def generatedSourceDir = { String moduleName ->
    layout.buildDirectory.dir("generated/sources/${moduleName}")
}

def buildNumber = providers.provider {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def value = stdout.toString().trim()
        value ?: 'local'
    } catch (Exception ignored) {
        'local'
    }
}

ext.buildNumberProvider = buildNumber
ext.derbyCompatibilityVersion = derbyCompatibilityVersion

