"""
        logger.lifecycle('A0 independent Derby store compilation: ' + (independent ? 'READY/ALREADY CUT OVER' : 'NOT YET'))
        logger.lifecycle('Wrote ' + delosdbA0RelPath(reportFile))
    }
}

