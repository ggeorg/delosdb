plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile
import java.util.jar.JarFile

def delosDbVersion = '0.1.0-dev'

version = delosDbVersion
group = 'io.github.ggeorg.delosdb'

def javaRelease = 21
def derbyCompatibilityVersion = '10.17.1.0'

def moduleNames = [
        osgi         : 'org.osgi.framework',
        commons      : 'org.apache.derby.commons',
        engine       : 'org.apache.derby.engine',
        client       : 'org.apache.derby.client',
