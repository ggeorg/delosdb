        def typeImports = delosdbB5fFilesImporting('org.apache.derby.iapi.types.')
        def reportFile = delosdbB5fReportFile.get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.text = """DelosDB B5f legacy Derby store security split
=================================================

Purpose
-------
B5f removes the legacy store's direct dependency on SQL-owned security APIs
without moving org.apache.derby.iapi.security into delosdb-engine-kernel.

Why not move org.apache.derby.iapi.security?
-------------------------------------------
SecurityUtil and Securable still depend on SQL authorization, DataDictionary,
AliasDescriptor, StatementPermission, SchemaDescriptor, and catalog AliasInfo.
Moving that package would make the kernel depend on SQL/dictionary machinery.

Kernel-owned store-facing facade
--------------------------------
  - org.apache.derby.iapi.services.security.StoreSecurable
  - org.apache.derby.iapi.services.security.StoreSecuritySupport
  - org.apache.derby.iapi.services.security.StoreSecuritySupportRegistry
  - org.apache.derby.iapi.services.security.StoreSecurityUtil

Engine-owned implementation
---------------------------
  - org.apache.derby.impl.security.EngineStoreSecuritySupport

Relocated store imports of org.apache.derby.iapi.security.*
----------------------------------------------------------
${storeSecurityImports.isEmpty() ? '  none' : storeSecurityImports.collect { '  - ' + delosdbB5fRelPath(it) }.join('\n')}

Relocated store imports of org.apache.derby.iapi.services.security.*
-------------------------------------------------------------------
${storeFacadeImports.isEmpty() ? '  none' : storeFacadeImports.collect { '  - ' + delosdbB5fRelPath(it) }.join('\n')}

B6 readiness
------------
NOT YET. Remaining direct store blockers still include org.apache.derby.iapi.types.

Relocated store files still importing org.apache.derby.iapi.types.*
------------------------------------------------------------------
${typeImports.isEmpty() ? '  none' : typeImports.collect { '  - ' + delosdbB5fRelPath(it) }.join('\n')}
"""
        logger.lifecycle('Wrote ' + delosdbB5fRelPath(reportFile))
    }
}

