tasks.register('verifyJars') {
    dependsOn 'jars'
    group = 'verification'
    description = 'Checks that all expected runtime jars were assembled and are non-empty.'
    inputs.files(runtimeJars())
    doLast {
        runtimeJarNames.each { jarName ->
            def jarFile = layout.buildDirectory.file("libs/${jarName}").get().asFile
            if (!jarFile.isFile()) {
                throw new GradleException("Missing expected jar: ${jarFile}")
            }
            if (jarFile.length() == 0L) {
                throw new GradleException("Empty jar: ${jarFile}")
            }
        }
    }
}


tasks.register('verifyReleaseArtifacts') {
    dependsOn 'verifyJars'
    group = 'verification'
    description = 'Verifies release metadata, legal attribution files, and manifests inside assembled jars.'
    inputs.files(runtimeJars())
    inputs.files(legalFiles)
    doLast {
        legalFileNames.each { legalName ->
            def legalFile = file(legalName)
            if (!legalFile.isFile()) {
                throw new GradleException("Missing required legal attribution file: ${legalFile}")
            }
        }

        runtimeJarNames.each { jarName ->
            def jarFile = layout.buildDirectory.file("libs/${jarName}").get().asFile
            new JarFile(jarFile).withCloseable { jar ->
                def manifest = jar.manifest
                if (manifest == null) {
                    throw new GradleException("Missing manifest in ${jarFile.name}")
                }

                def attributes = manifest.mainAttributes
                [
                        'Implementation-Title',
                        'Implementation-Version',
                        'Implementation-Vendor',
                        'Specification-Version',
                        'DelosDB-Version',
                        'DelosDB-Build-Revision',
                        'DelosDB-Origin',
                        'Apache-Derby-Base-Version',
                        'Build-Jdk'
                ].each { attributeName ->
                    def value = attributes.getValue(attributeName)
                    if (value == null || value.trim().isEmpty()) {
                        throw new GradleException("Missing manifest attribute ${attributeName} in ${jarFile.name}")
                    }
                }

                if (attributes.getValue('Implementation-Version') != delosDbVersion) {
                    throw new GradleException("Unexpected Implementation-Version in ${jarFile.name}: ${attributes.getValue('Implementation-Version')}")
                }

                if (jarName == 'derbyrun.jar' && attributes.getValue('Main-Class') != 'org.apache.derby.run.run') {
                    throw new GradleException("derbyrun.jar is missing the expected Main-Class")
                }

                legalFileNames.each { legalName ->
                    def entryName = "META-INF/${legalName}"
                    if (jar.getEntry(entryName) == null) {
                        throw new GradleException("Missing ${entryName} in ${jarFile.name}")
                    }
                }
            }
        }
    }
}

