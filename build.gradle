tasks.register('generateClassSizeCatalog') {
    // ClassSizeCrawler scans the compiled engine output tree. Gradle 8.14
    // requires every task which writes into that tree to be ordered before
    // this scan, otherwise it reports an implicit dependency problem.
    dependsOn ':delosdb-engine:compileDerbyEngine', ':delosdb-engine-api:compileDelosDbEngineApi', ':delosdb-engine-storage-api:compileEngineStorageApi', ':delosdb-derby-store-api:compileDerbyStoreApi', ':delosdb-storage-derby:compileLegacyDerbyStorage', 'compileDerbyBuildTools', 'splitEngineMessages', 'generateOdbcMetadata', 'ensureCatalogMetadataResources'
    def outputFile = generatedSourceDir(moduleNames.engineApi).map {
        it.file('org/apache/derby/iapi/services/cache/ClassSizeCatalogImpl.java')
    }
    inputs.dir(moduleClassDir(moduleNames.engine))
    inputs.dir(moduleClassDir(moduleNames.engineApi))
    inputs.dir(project(':delosdb-engine-storage-api').layout.buildDirectory.dir('classes/engine-storage-api'))
    inputs.dir(project(':delosdb-derby-store-api').layout.buildDirectory.dir('classes/store-api'))
    inputs.dir(project(':delosdb-storage-derby').layout.buildDirectory.dir('classes/main'))
    outputs.file(outputFile)
    doLast {
        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        runBuildTool('org.apache.derbyBuild.ClassSizeCrawler', [
                moduleClassDir(moduleNames.commons),
                moduleClassDir(moduleNames.engineKernel),
                moduleClassDir(moduleNames.engineApi),
                moduleClassDir(moduleNames.engine),
                project(':delosdb-engine-storage-api').layout.buildDirectory.dir('classes/engine-storage-api'),
                project(':delosdb-derby-store-api').layout.buildDirectory.dir('classes/store-api'),
                project(':delosdb-storage-derby').layout.buildDirectory.dir('classes/main')
        ]) {
            systemProperty 'WS', projectDir.absolutePath
            systemProperty 'classDir', moduleClassDir(moduleNames.engine).get().asFile.absolutePath
            systemProperty 'out', target.absolutePath
            systemProperty 'prefix.1', 'org.apache.derby.iapi.types'
            systemProperty 'prefix.2', 'org.apache.derby.impl'
            args 'org.apache.derby.iapi.types.DataValueDescriptor',
                    'org.apache.derby.impl.store.raw.data.RecordId',
                    'org.apache.derby.iapi.store.raw.ContainerKey',
                    'org.apache.derby.iapi.services.cache.SizedCacheable',
                    'java.lang.ref.WeakReference',
                    'java.math.BigDecimal',
                    'java.util.ArrayList',
                    'java.util.GregorianCalendar',
                    'java.util.Vector'
        }
    }
}

tasks.register('processDerbyResources') {
    dependsOn runtimeCompileTasks
    productInfoResources.each { info ->
        outputs.file(moduleClassDir(info.module).map { it.file(info.path) })
    }
    outputs.dir(moduleClassDir(moduleNames.engine).map { it.dir('META-INF/services') })
    outputs.dir(moduleClassDir(moduleNames.client).map { it.dir('META-INF/services') })
    outputs.dir(moduleClassDir(moduleNames.tools).map { it.dir('org/apache/derby/loc/tools') })
    doLast {
        moduleSourceRoots.each { moduleName, sourceDir ->
            copy {
                from(sourceDir) {
                    include '**/*.properties'
                    include '**/*.policy'
                    include '**/*.xml'
                    exclude '**/messages.xml'
                    exclude '**/*.tmpl'
                }
                into moduleClassDir(moduleName).get().asFile
            }
        }

        copy {
            from('delosdb-tools/src/main/java/org/apache/derby/loc') {
                include 'sysinfoMessages.properties'
                include 'toolsmessages.properties'
            }
            into new File(moduleClassDir(moduleNames.tools).get().asFile, 'org/apache/derby/loc/tools')
        }

        new File(moduleClassDir(moduleNames.engine).get().asFile, 'META-INF/services').mkdirs()
        new File(moduleClassDir(moduleNames.engine).get().asFile, 'META-INF/services/java.sql.Driver').text =
                'org.apache.derby.iapi.jdbc.AutoloadedDriver\n'
        new File(moduleClassDir(moduleNames.client).get().asFile, 'META-INF/services').mkdirs()
        new File(moduleClassDir(moduleNames.client).get().asFile, 'META-INF/services/java.sql.Driver').text =
                'org.apache.derby.client.ClientAutoloadedDriver\n'

        productInfoResources.each { info ->
            writeInfoProperties(
                    new File(moduleClassDir(info.module).get().asFile, info.path),
                    info.technology,
                    info.productFile
            )
        }
    }
}

tasks.register('splitEngineMessages') {
    dependsOn 'compileDerbyBuildTools', 'processDerbyResources'
    inputs.file('delosdb-engine/src/main/java/org/apache/derby/loc/messages.xml')
    outputs.file(layout.buildDirectory.file('generated/messages/messages_en.properties'))
    outputs.dir(moduleClassDir(moduleNames.engine).map { it.dir('org/apache/derby/loc') })
    outputs.dir(moduleClassDir(moduleNames.client).map { it.dir('org/apache/derby/loc/client') })
    outputs.dir(layout.buildDirectory.dir('generated/locale/org/apache/derby/loc'))
    doLast {
        def generatedMessagesDir = layout.buildDirectory.dir('generated/messages').get().asFile
        generatedMessagesDir.mkdirs()
        def englishMessages = new File(generatedMessagesDir, 'messages_en.properties')

        runBuildTool('org.apache.derbyBuild.EnglishMessagePropertiesGenerator', []) {
            args file('delosdb-engine/src/main/java/org/apache/derby/loc/messages.xml').absolutePath,
                    englishMessages.absolutePath
        }

        def engineLoc = new File(moduleClassDir(moduleNames.engine).get().asFile, 'org/apache/derby/loc')
        def clientLoc = new File(moduleClassDir(moduleNames.client).get().asFile, 'org/apache/derby/loc/client')
        def localeLoc = layout.buildDirectory.dir('generated/locale/org/apache/derby/loc').get().asFile
        engineLoc.mkdirs()
        clientLoc.mkdirs()
        localeLoc.mkdirs()

        runBuildTool('org.apache.derbyBuild.splitmessages', [moduleClassDir(moduleNames.commons)]) {
            args engineLoc.absolutePath,
                    clientLoc.absolutePath,
                    localeLoc.absolutePath,
                    englishMessages.absolutePath
        }
    }
}

tasks.register('generateOdbcMetadata') {
    dependsOn 'compileDerbyBuildTools', 'processDerbyResources'
    inputs.file('delosdb-engine/src/main/java/org/apache/derby/impl/jdbc/metadata.properties')
    inputs.file('delosdb-buildtools/src/main/java/org/apache/derbyBuild/odbcgen_fragments.properties')
    outputs.file(moduleClassDir(moduleNames.engine).map {
        it.file('org/apache/derby/impl/jdbc/metadata.properties')
    })
    doLast {
        def generatedMetadataDir = layout.buildDirectory.dir('generated/metadata').get().asFile
        generatedMetadataDir.mkdirs()

        runBuildTool('org.apache.derbyBuild.ODBCMetadataGenerator', [
                moduleClassDir(moduleNames.commons),
                // ODBCMetadataGenerator loads both its fragments and Derby's
                // JDBC metadata with Class#getResourceAsStream(). Put the
                // source resource roots on the classpath as a stable fallback;
                // relying only on copied module output can be stale when this
                // task is reached through verification lifecycle tasks.
                file('delosdb-buildtools/src/main/java'),
                file('delosdb-engine/src/main/java'),
                moduleClassDir(moduleNames.engine)
        ]) {
            workingDir = generatedMetadataDir
        }

        def generated = new File(generatedMetadataDir, 'odbc_metadata.properties')
        if (!generated.isFile()) {
            throw new GradleException("ODBC metadata generator did not produce ${generated}")
        }

        copy {
            from generated
            into new File(moduleClassDir(moduleNames.engine).get().asFile, 'org/apache/derby/impl/jdbc')
            rename { 'metadata.properties' }
        }
    }
}


tasks.register('ensureCatalogMetadataResources') {
    dependsOn 'processDerbyResources', 'generateOdbcMetadata'
    inputs.file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/catalog/metadata_net.properties')
    outputs.file(moduleClassDir(moduleNames.engine).map {
        it.file('org/apache/derby/impl/sql/catalog/metadata_net.properties')
    })
    doLast {
        copy {
            from('delosdb-engine/src/main/java/org/apache/derby/impl/sql/catalog/metadata_net.properties')
            into new File(moduleClassDir(moduleNames.engine).get().asFile, 'org/apache/derby/impl/sql/catalog')
        }
    }
}

