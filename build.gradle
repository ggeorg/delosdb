def jarTitleFor = { String archiveName ->
    [
            'osgi-framework-stub.jar' : 'DelosDB OSGi Framework Stub',
            'derbyshared.jar'        : 'DelosDB Shared Utilities',
            'derby.jar'              : 'DelosDB Embedded Engine',
            'derbyclient.jar'        : 'DelosDB Network Client',
            'derbytools.jar'         : 'DelosDB Tools',
            'derbynet.jar'           : 'DelosDB Network Server',
            'derbyoptionaltools.jar' : 'DelosDB Optional Tools',
            'derbyrun.jar'           : 'DelosDB Runner'
    ][archiveName] ?: "DelosDB ${archiveName}"
}

def releaseManifestAttributes = { String archiveName ->
    [
            'Implementation-Title'        : jarTitleFor(archiveName),
            'Implementation-Version'      : delosDbVersion,
            'Implementation-Vendor'       : 'DelosDB Project',
            'Specification-Title'         : jarTitleFor(archiveName),
            'Specification-Version'       : derbyCompatibilityVersion,
            'Specification-Vendor'        : 'DelosDB Project',
            'DelosDB-Version'             : delosDbVersion,
            'DelosDB-Build-Revision'      : buildNumber.get(),
            'DelosDB-Origin'              : 'Forked from Apache Derby 10.17.1.0',
            'DelosDB-Repository'          : 'https://github.com/ggeorg/delosdb',
            'Apache-Derby-Base-Version'   : derbyCompatibilityVersion,
            'Built-By'                    : System.getProperty('user.name', 'unknown'),
            'Build-Jdk'                   : System.getProperty('java.version'),
            'Build-Jdk-Vendor'            : System.getProperty('java.vendor')
    ]
}

def runtimeBuildTasks = [
        'compileClassSizeCatalog',
        'splitEngineMessages'
]

tasks.register('compileAll') {
    dependsOn runtimeBuildTasks
}

[
        [name: 'derbySharedJar', moduleName: moduleNames.commons, archive: 'derbyshared.jar'],
        [name: 'derbyJar', moduleName: moduleNames.engine, archive: 'derby.jar'],
        [name: 'derbyClientJar', moduleName: moduleNames.client, archive: 'derbyclient.jar'],
        [name: 'derbyToolsJar', moduleName: moduleNames.tools, archive: 'derbytools.jar'],
        [name: 'derbyNetJar', moduleName: moduleNames.server, archive: 'derbynet.jar'],
        [name: 'derbyOptionalToolsJar', moduleName: moduleNames.optionaltools, archive: 'derbyoptionaltools.jar'],
        [name: 'derbyRunJar', moduleName: moduleNames.runner, archive: 'derbyrun.jar'],
        [name: 'osgiFrameworkStubJar', moduleName: moduleNames.osgi, archive: 'osgi-framework-stub.jar']
].each { spec ->
    tasks.register(spec.name, Jar) {
        dependsOn 'compileAll'
        archiveFileName = spec.archive
        destinationDirectory = layout.buildDirectory.dir('libs')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from moduleClassDir(spec.moduleName)
        from(legalFiles) {
            into 'META-INF'
        }
        manifest {
            attributes releaseManifestAttributes(spec.archive)
            if (spec.archive == 'derbyrun.jar') {
                attributes 'Main-Class': 'org.apache.derby.run.run'
            }
        }
    }
}

tasks.register('jars') {
    dependsOn 'derbySharedJar', 'derbyJar', 'derbyClientJar', 'derbyToolsJar',
            'derbyNetJar', 'derbyOptionalToolsJar', 'derbyRunJar', 'osgiFrameworkStubJar'
}

tasks.named('assemble') {
    dependsOn 'jars'
}

tasks.register('verifyJars') {
    dependsOn 'jars'
    group = 'verification'
    description = 'Checks that all expected runtime jars were assembled and are non-empty.'
    inputs.files(runtimeJars())
    doLast {
        runtimeJarNames.each { jarName ->
            def jarFile = layout.buildDirectory.file("libs/${jarName}").get().asFile
            if (!jarFile.isFile()) {
                throw new GradleException("Missing expected jar: ${jarFile}")
            }
            if (jarFile.length() == 0L) {
                throw new GradleException("Empty jar: ${jarFile}")
            }
        }
    }
}


tasks.register('verifyReleaseArtifacts') {
    dependsOn 'verifyJars'
    group = 'verification'
    description = 'Verifies release metadata, legal attribution files, and manifests inside assembled jars.'
    inputs.files(runtimeJars())
    inputs.files(legalFiles)
    doLast {
        legalFileNames.each { legalName ->
            def legalFile = file(legalName)
            if (!legalFile.isFile()) {
                throw new GradleException("Missing required legal attribution file: ${legalFile}")
            }
        }

        runtimeJarNames.each { jarName ->
            def jarFile = layout.buildDirectory.file("libs/${jarName}").get().asFile
            new JarFile(jarFile).withCloseable { jar ->
                def manifest = jar.manifest
                if (manifest == null) {
                    throw new GradleException("Missing manifest in ${jarFile.name}")
                }

                def attributes = manifest.mainAttributes
                [
                        'Implementation-Title',
                        'Implementation-Version',
                        'Implementation-Vendor',
                        'Specification-Version',
                        'DelosDB-Version',
                        'DelosDB-Build-Revision',
                        'DelosDB-Origin',
                        'Apache-Derby-Base-Version',
                        'Build-Jdk'
                ].each { attributeName ->
                    def value = attributes.getValue(attributeName)
                    if (value == null || value.trim().isEmpty()) {
                        throw new GradleException("Missing manifest attribute ${attributeName} in ${jarFile.name}")
                    }
                }

                if (attributes.getValue('Implementation-Version') != delosDbVersion) {
                    throw new GradleException("Unexpected Implementation-Version in ${jarFile.name}: ${attributes.getValue('Implementation-Version')}")
                }

                if (jarName == 'derbyrun.jar' && attributes.getValue('Main-Class') != 'org.apache.derby.run.run') {
                    throw new GradleException("derbyrun.jar is missing the expected Main-Class")
                }

                legalFileNames.each { legalName ->
                    def entryName = "META-INF/${legalName}"
                    if (jar.getEntry(entryName) == null) {
                        throw new GradleException("Missing ${entryName} in ${jarFile.name}")
                    }
                }
            }
        }
    }
}

tasks.register('sysinfoFromJars', JavaExec) {
    dependsOn 'jars'
