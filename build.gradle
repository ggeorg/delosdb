-----------
org.apache.derby.iapi.services.property
org.apache.derby.iapi.services.cache
org.apache.derby.iapi.services.locks

Support interfaces moved with B4 because the moved packages expose them:
org.apache.derby.iapi.services.daemon

Why B4 needs small seams
------------------------
PropertyValidation historically cast its transaction controller to the inherited
store TransactionManager. B4 keeps the kernel independent of store access packages
by adding PropertyPostCommitWork in the property package and making the store
TransactionManager implement that kernel-facing hook.

