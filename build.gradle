        'delosdb-spi.jar',
        'osgi-framework-stub.jar',
        'derbyshared.jar',
        'delosdb-engine-kernel.jar',
        'delosdb-engine-api.jar',
        'delosdb-storage-io.jar',
        'derby.jar',
        'derbyclient.jar',
        'derbytools.jar',
        'derbynet.jar',
        'derbyoptionaltools.jar',
        'derbyrun.jar'
]


def runtimeJars = {
    // derby.jar now contains the permanent ASM bytecode backend. Keep ASM on
    // the runtime classpath for jar-based smokes instead of relying on the
    // old optional/static module edge.
    files(runtimeJarNames.collect { layout.buildDirectory.file("libs/${it}") }, configurations.delosdbAsm)
}

// Expose root build state to extracted Gradle scripts without relying on local variable scope.
ext.delosdbRuntimeJarNames = runtimeJarNames
ext.delosdbRuntimeJars = runtimeJars
ext.delosdbModuleDirsForRuntime = moduleDirsForRuntime

