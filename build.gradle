tasks.register('generateClassSizeCatalog') {
    dependsOn ':delosdb-engine:compileDerbyEngine', ':delosdb-runtime-api:compileDelosDbRuntimeApi', ':delosdb-derby-store-api:compileDerbyStoreApi', ':delosdb-storage-derby:compileLegacyDerbyStorage', ':delosdb-storage-mvcc:compileStorageMvcc', 'compileDerbyBuildTools'
    inputs.files(classSizeCrawlerClasspath).withPropertyName('classSizeCrawlerClasspath')
    outputs.file(classSizeCatalogOutputFile)
    doLast {
        def target = classSizeCatalogOutputFile.get().asFile
        target.parentFile.mkdirs()
        execSupport.execOperations.javaexec { spec ->
            spec.classpath = classSizeCrawlerClasspath
            spec.mainClass.set('org.apache.derbyBuild.ClassSizeCrawler')
            spec.systemProperty 'WS', rootProjectDirectory.absolutePath
            spec.systemProperty 'classDir', engineClassDir.get().asFile.absolutePath
            spec.systemProperty 'out', target.absolutePath
            spec.systemProperty 'prefix.1', 'org.apache.derby.iapi.types'
            spec.systemProperty 'prefix.2', 'org.apache.derby.impl'
            spec.args 'org.apache.derby.iapi.types.DataValueDescriptor',
                    'org.apache.derby.impl.store.raw.data.RecordId',
                    'org.apache.derby.iapi.store.raw.ContainerKey',
                    'org.apache.derby.iapi.services.cache.SizedCacheable',
                    'java.lang.ref.WeakReference',
                    'java.math.BigDecimal',
                    'java.util.ArrayList',
                    'java.util.GregorianCalendar',
                    'java.util.Vector'
        }
    }
}

def engineMessagesXml = layout.projectDirectory.file('delosdb-engine/src/main/java/org/apache/derby/loc/messages.xml')
def generatedMessagesDir = layout.buildDirectory.dir('generated/messages')
def englishMessagesFile = generatedMessagesDir.map { it.file('messages_en.properties') }
def engineMessageOutputDir = project(':delosdb-engine').layout.buildDirectory.dir('generated/resources/messages/org/apache/derby/loc')
def clientMessageOutputDir = project(':delosdb-client').layout.buildDirectory.dir('generated/resources/messages/org/apache/derby/loc/client')
def localeMessageOutputDir = layout.buildDirectory.dir('generated/locale/org/apache/derby/loc')
def englishMessageGeneratorClasspath = files(buildToolsClassDir)
def splitMessagesClasspath = files(buildToolsClassDir, commonsClassDir)

tasks.register('splitEngineMessages') {
    dependsOn 'compileDerbyBuildTools'
    inputs.file(engineMessagesXml)
    inputs.files(englishMessageGeneratorClasspath, splitMessagesClasspath)
            .withPropertyName('messageGeneratorClasspath')
    outputs.file(englishMessagesFile)
    outputs.dir(engineMessageOutputDir)
    outputs.dir(clientMessageOutputDir)
    outputs.dir(localeMessageOutputDir)
    doLast {
        def englishMessages = englishMessagesFile.get().asFile
        englishMessages.parentFile.mkdirs()

        execSupport.execOperations.javaexec { spec ->
            spec.classpath = englishMessageGeneratorClasspath
            spec.mainClass.set('org.apache.derbyBuild.EnglishMessagePropertiesGenerator')
            spec.args engineMessagesXml.asFile.absolutePath, englishMessages.absolutePath
        }

        def engineLoc = engineMessageOutputDir.get().asFile
        def clientLoc = clientMessageOutputDir.get().asFile
        def localeLoc = localeMessageOutputDir.get().asFile
        engineLoc.mkdirs()
        clientLoc.mkdirs()
        localeLoc.mkdirs()

        execSupport.execOperations.javaexec { spec ->
            spec.classpath = splitMessagesClasspath
            spec.mainClass.set('org.apache.derbyBuild.splitmessages')
            spec.args engineLoc.absolutePath,
                    clientLoc.absolutePath,
                    localeLoc.absolutePath,
                    englishMessages.absolutePath
        }
    }
}

def jdbcMetadataSource = layout.projectDirectory.file('delosdb-engine/src/main/java/org/apache/derby/impl/jdbc/metadata.properties')
def odbcFragmentsSource = layout.projectDirectory.file('delosdb-buildtools/src/main/java/org/apache/derbyBuild/odbcgen_fragments.properties')
def buildToolsSourceResourceDir = layout.projectDirectory.dir('delosdb-buildtools/src/main/java')
def engineSourceResourceDir = layout.projectDirectory.dir('delosdb-engine/src/main/java')
def generatedMetadataDir = project(':delosdb-engine').layout.buildDirectory.dir('generated/odbc-work')
def generatedOdbcMetadataFile = generatedMetadataDir.map { it.file('odbc_metadata.properties') }
def engineJdbcResourceDir = project(':delosdb-engine').layout.buildDirectory.dir('generated/resources/odbc/org/apache/derby/impl/jdbc')
def engineJdbcMetadataFile = engineJdbcResourceDir.map { it.file('metadata.properties') }
def odbcMetadataGeneratorClasspath = files(
        buildToolsClassDir,
        commonsClassDir,
        buildToolsSourceResourceDir,
        engineSourceResourceDir)

tasks.register('generateOdbcMetadata') {
    dependsOn 'compileDerbyBuildTools'
    inputs.file(jdbcMetadataSource)
    inputs.file(odbcFragmentsSource)
    inputs.files(odbcMetadataGeneratorClasspath).withPropertyName('odbcMetadataGeneratorClasspath')
    outputs.file(engineJdbcMetadataFile)
    doLast {
        def metadataWorkDir = generatedMetadataDir.get().asFile
        metadataWorkDir.mkdirs()
        def generated = generatedOdbcMetadataFile.get().asFile
        Files.deleteIfExists(generated.toPath())

        execSupport.execOperations.javaexec { spec ->
            spec.classpath = odbcMetadataGeneratorClasspath
            spec.mainClass.set('org.apache.derbyBuild.ODBCMetadataGenerator')
            spec.workingDir(metadataWorkDir)
        }

        if (!generated.isFile()) {
            throw new GradleException("ODBC metadata generator did not produce ${generated}")
        }

        def target = engineJdbcMetadataFile.get().asFile
        target.parentFile.mkdirs()
        Files.copy(generated.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING)
    }
}

