def moduleClassDir = { String moduleName ->
    layout.buildDirectory.dir("classes/modules/${moduleName}")
}

def generatedSourceDir = { String moduleName ->
    layout.buildDirectory.dir("generated/sources/${moduleName}")
}

def buildNumber = providers.provider {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def value = stdout.toString().trim()
        value ?: 'local'
    } catch (Exception ignored) {
        'local'
    }
}

def externalModulePath = files(
        'tools/java/geronimo-spec-servlet-2.4-rc4.jar',
        'tools/java/json_simple-1.1.jar',
        'tools/java/lucene-analyzers-common.jar',
        'tools/java/lucene-core.jar',
        'tools/java/lucene-queryparser.jar'
)

def javaccClasspath = files('tools/java/javacc.jar')

def configureJavaCompile = { JavaCompile task, List<Object> modulePathEntries = [] ->
    // Gradle 8.14 validates custom JavaCompile tasks even when --release is set.
    // Because this bootstrap build intentionally avoids the java plugin for now,
    // we must set these properties explicitly on every JavaCompile task.
    task.sourceCompatibility = javaRelease.toString()
    task.targetCompatibility = javaRelease.toString()
    task.options.release = javaRelease
    task.options.encoding = 'UTF-8'
    task.options.deprecation = false
    task.options.warnings = true
    task.classpath = files()
    task.doFirst {
        def modulePath = files(modulePathEntries).asPath
        if (modulePath) {
            task.options.compilerArgs.addAll(['--module-path', modulePath])
        }
        task.options.compilerArgs.add('-Xlint:deprecation')
    }
}

def replaceInFile = { File file, Closure<String> transform ->
    file.text = transform(file.text)
}

def writeInfoProperties = { File file, String technologyName, String productFile ->
    file.parentFile.mkdirs()
    file.text = """# Generated by Gradle. Do not edit.
derby.version.major=10
derby.version.minor=17
derby.version.maint=1000000
derby.version.drdamaint=0
derby.build.number=${buildNumber.get()}
derby.product.technology.name=${technologyName}
derby.product.external.name=DelosDB
derby.product.external.version=${delosDbVersion}
delosdb.version=${delosDbVersion}
derby.version.beta=false
derby.product.vendor=DelosDB Project
derby.product.file=${productFile}
"""
}

tasks.register('generateSanityState') {
    def outputFile = generatedSourceDir(moduleNames.commons).map {
        it.file('org/apache/derby/shared/common/sanity/SanityState.java')
    }
    inputs.file('java/org.apache.derby.commons/org/apache/derby/shared/common/sanity/SanityState.tmpl')
    outputs.file(outputFile)
    doLast {
        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        target.text = file('java/org.apache.derby.commons/org/apache/derby/shared/common/sanity/SanityState.tmpl')
                .text
                .replace('@SANE@', 'true')
    }
}

tasks.register('generateSqlParser', JavaExec) {
    def outputDir = generatedSourceDir(moduleNames.engine).map {
        it.dir('org/apache/derby/impl/sql/compile')
    }
    inputs.file('java/org.apache.derby.engine/org/apache/derby/impl/sql/compile/sqlgrammar.jj')
    outputs.dir(outputDir)
    classpath = javaccClasspath
    mainClass = 'javacc'
    workingDir = file('java/org.apache.derby.engine/org/apache/derby/impl/sql/compile')
    args "-OUTPUT_DIRECTORY=${outputDir.get().asFile.absolutePath}", 'sqlgrammar.jj'
    doFirst {
        delete outputDir
        outputDir.get().asFile.mkdirs()
    }
    doLast {
        ['CharStream.java', 'ParseException.java', 'Token.java'].each {
            delete new File(outputDir.get().asFile, it)
        }
        ['SQLParser.java', 'SQLParserConstants.java', 'SQLParserTokenManager.java', 'TokenMgrError.java'].each {
            def generated = new File(outputDir.get().asFile, it)
            if (generated.exists()) {
                replaceInFile(generated) { text -> text.replaceAll('(?m)^public (class|interface)', '$1') }
            }
        }
        def parser = new File(outputDir.get().asFile, 'SQLParser.java')
        if (parser.exists()) {
            replaceInFile(parser) { text -> text.replace('tokenImage', 'SQLParserConstants.tokenImage') }
        }
    }
}

tasks.register('generateIjParsers') {
    def outputDir = generatedSourceDir(moduleNames.tools).map {
        it.dir('org/apache/derby/impl/tools/ij')
    }
    inputs.files(
            'java/org.apache.derby.tools/org/apache/derby/impl/tools/ij/ij.jj',
            'java/org.apache.derby.tools/org/apache/derby/impl/tools/ij/mtGrammar.jj'
    )
    outputs.dir(outputDir)
    doLast {
        delete outputDir
        outputDir.get().asFile.mkdirs()
        javaexec {
            classpath = javaccClasspath
            mainClass = 'javacc'
            workingDir = file('java/org.apache.derby.tools/org/apache/derby/impl/tools/ij')
            args "-OUTPUT_DIRECTORY=${outputDir.get().asFile.absolutePath}", 'ij.jj'
        }
        javaexec {
            classpath = javaccClasspath
            mainClass = 'javacc'
            workingDir = file('java/org.apache.derby.tools/org/apache/derby/impl/tools/ij')
            args "-OUTPUT_DIRECTORY=${outputDir.get().asFile.absolutePath}", 'mtGrammar.jj'
        }
        delete new File(outputDir.get().asFile, 'ParseException.java')
        def ijConstants = new File(outputDir.get().asFile, 'ijConstants.java')
        def ijTokenManager = new File(outputDir.get().asFile, 'ijTokenManager.java')
        def ijParser = new File(outputDir.get().asFile, 'ij.java')
        def mtParser = new File(outputDir.get().asFile, 'mtGrammar.java')
        if (ijConstants.exists()) {
            replaceInFile(ijConstants) { text -> text.replace('public interface', 'interface') }
        }
        if (ijTokenManager.exists()) {
            replaceInFile(ijTokenManager) { text -> text.replace('public class', 'class') }
        }
        if (ijParser.exists()) {
            replaceInFile(ijParser) { text -> text.replace('tokenImage', 'ijConstants.tokenImage') }
        }
        if (mtParser.exists()) {
            replaceInFile(mtParser) { text -> text.replace('tokenImage', 'mtGrammarConstants.tokenImage') }
        }
    }
}

