// -----------------------------------------------------------------------------
// Local Maven publication baseline
// -----------------------------------------------------------------------------
// Maven coordinates are DelosDB-branded even while the binary distribution keeps
// Derby-compatible runtime jar names for now.
ext.delosdbPublicationMetadata = [
        'delosdb-commons'      : [artifactId: 'delosdb-commons',       jarTask: 'jar',        title: 'DelosDB Shared Utilities', dependencies: []],
        'delosdb-spi'          : [artifactId: 'delosdb-spi',           jarTask: 'jar',       title: 'DelosDB SPI', dependencies: []],
        'delosdb-engine'       : [artifactId: 'delosdb-engine',        jarTask: 'derbyJar',              title: 'DelosDB Embedded Engine', dependencies: ['delosdb-commons', 'delosdb-spi']],
        'delosdb-client'       : [artifactId: 'delosdb-client',        jarTask: 'jar',        title: 'DelosDB Network Client', dependencies: ['delosdb-commons']],
        'delosdb-tools'        : [artifactId: 'delosdb-tools',         jarTask: 'jar',         title: 'DelosDB Tools', dependencies: ['delosdb-commons', 'delosdb-engine', 'delosdb-client']],
        'delosdb-runner'       : [artifactId: 'delosdb-runner',        jarTask: 'jar',           title: 'DelosDB Runner', dependencies: ['delosdb-commons', 'delosdb-tools', 'delosdb-server']],
        'delosdb-server'       : [artifactId: 'delosdb-server',        jarTask: 'jar',           title: 'DelosDB Network Server', dependencies: ['delosdb-commons', 'delosdb-engine', 'delosdb-tools']],
        'delosdb-optionaltools': [artifactId: 'delosdb-optionaltools', jarTask: 'jar', title: 'DelosDB Optional Tools', dependencies: ['delosdb-commons', 'delosdb-engine', 'delosdb-tools']]
]

subprojects { subproject ->
    def publicationInfo = rootProject.ext.delosdbPublicationMetadata[subproject.name]
    if (publicationInfo != null) {
        apply plugin: 'maven-publish'

        afterEvaluate {
            publishing {
                publications {
                    create('mavenJava', org.gradle.api.publish.maven.MavenPublication) {
                        groupId = rootProject.group.toString()
                        artifactId = publicationInfo.artifactId
                        version = rootProject.version.toString()

                        def runtimeJarTask = tasks.named(publicationInfo.jarTask)
                        artifact(runtimeJarTask.flatMap { it.archiveFile }) {
                            builtBy runtimeJarTask
                        }

                        pom {
                            name = publicationInfo.title
                            description = "${publicationInfo.title}. Part of DelosDB, a modern Java embedded SQL database forked from Apache Derby 10.17.1.0."
                            url = 'https://github.com/ggeorg/delosdb'

                            licenses {
                                license {
                                    name = 'Apache License, Version 2.0'
                                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                                    distribution = 'repo'
                                }
                            }

                            developers {
                                developer {
                                    id = 'ggeorg'
                                    name = 'DelosDB Project'
                                    url = 'https://github.com/ggeorg/delosdb'
                                }
                            }

                            scm {
                                connection = 'scm:git:https://github.com/ggeorg/delosdb.git'
                                developerConnection = 'scm:git:https://github.com/ggeorg/delosdb.git'
                                url = 'https://github.com/ggeorg/delosdb'
                            }

                            withXml {
                                def dependencyProjectNames = publicationInfo.dependencies ?: []
                                if (!dependencyProjectNames.isEmpty()) {
                                    def dependenciesNode = asNode().appendNode('dependencies')
                                    dependencyProjectNames.each { dependencyProjectName ->
                                        def dependencyInfo = rootProject.ext.delosdbPublicationMetadata[dependencyProjectName]
                                        if (dependencyInfo == null) {
                                            throw new GradleException("Unknown DelosDB publication dependency '${dependencyProjectName}' for ${subproject.path}")
                                        }
                                        def dependencyNode = dependenciesNode.appendNode('dependency')
                                        dependencyNode.appendNode('groupId', rootProject.group.toString())
                                        dependencyNode.appendNode('artifactId', dependencyInfo.artifactId)
                                        dependencyNode.appendNode('version', rootProject.version.toString())
                                        dependencyNode.appendNode('scope', 'compile')
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

// A published POM must name every published module its module descriptor
// requires, or the artifact cannot start as a Java module from Maven.
tasks.register('verifyPublicationDependencies') {
    group = 'verification'
    description = 'Verifies that each published POM declares the DelosDB modules its module-info requires.'
    def publications = rootProject.ext.delosdbPublicationMetadata
    def descriptors = publications.keySet().collectEntries { name ->
        [name, project(":${name}").file('src/main/java/module-info.java')]
    }
    inputs.files(descriptors.values())
    inputs.property('dependencies', publications.collectEntries { name, info -> [name, info.dependencies] })

    doLast {
        def withoutComments = { File descriptor ->
            descriptor.text.replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/\/\/[^\n]*/, '')
        }
        def projectByModule = descriptors.collectEntries { name, descriptor ->
            [(withoutComments(descriptor) =~ /\bmodule\s+([\w.]+)/)[0][1], name]
        }
        def problems = []
        descriptors.each { name, descriptor ->
            def required = (withoutComments(descriptor) =~ /\brequires\s+(?:transitive\s+)?([\w.]+)\s*;/)
                    .collect { it[1] }
                    .findAll { !it.startsWith('java.') && !it.startsWith('jdk.') }
            required.each { module ->
                def dependency = projectByModule[module]
                if (dependency == null) {
                    problems << "${name} requires ${module}, which no DelosDB publication provides"
                } else if (!publications[name].dependencies.contains(dependency)) {
                    problems << "${name} requires ${module}, but its POM does not declare ${dependency}"
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Published POM dependencies are incomplete:\n  " + problems.join('\n  '))
        }
    }
}

