  - ${delosdbB5mRelPath(delosdbB5mEngineProvider)} keeps SQLInteger, SQLLongint, and UserType construction engine-owned

Retired direct imports still present
------------------------------------
${retiredImportsRemaining.isEmpty() ? '  none' : retiredImportsRemaining.collect { '  - ' + it }.join('\n')}

Kernel bridge SQL/type/catalog forbidden imports
------------------------------------------------
${forbiddenKernelImports.isEmpty() ? '  none' : forbiddenKernelImports.collect { '  - ' + it }.join('\n')}

Relocated-store direct org.apache.derby.iapi.types import count
---------------------------------------------------------------
  before B5m baseline: ${delosdbB5mBaselineImportCount}
  after B5m:           ${remainingStoreTypeImports.size()}

Remaining direct relocated-store iapi.types imports
---------------------------------------------------
${remainingStoreTypeImports.isEmpty() ? '  none' : remainingStoreTypeImports.collect { '  - ' + it }.join('\n')}

Boundary decision
-----------------
