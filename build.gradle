def delosdbB5iStoreTypeUtil = { -> new File(delosdbB5iKernelTypeRoot, 'StoreTypeUtil.java') }
def delosdbB5iStoreTypeRegistry = { -> new File(delosdbB5iKernelTypeRoot, 'StoreTypeSupportRegistry.java') }

