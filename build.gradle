tasks.register('verifyLegacyDerbyKernelB5hTypeBridge') {
    group = 'verification'
    description = 'B5h: verifies the SQL-neutral store-facing type bridge exists and engine types adapt to it.'
    dependsOn 'legacyDerbyStoreKernelB5hTypeBridgeReport'
    doLast {
        def requiredBridgeTypes = [
            'StoreDataValue.java',
            'StoreOrderable.java',
            'StoreRowLocation.java',
            'StoreStringDataValue.java',
            'StoreRefDataValue.java',
            'StoreDataValueFactory.java',
            'StoreLocatedRow.java',
            'StoreDataType.java'
        ]
        requiredBridgeTypes.each { name ->
            def source = new File(delosdbB5hKernelTypeRoot, name)
            if (!source.isFile()) {
                throw new GradleException('B5h missing kernel store-facing type contract: ' + delosdbB5hRelPath(source))
            }
        }

        def kernelModuleInfo = delosdbB5hRead(file('delosdb-engine-kernel/src/main/java/module-info.java'))
        if (!kernelModuleInfo.contains('exports org.apache.derby.iapi.store.types')) {
            throw new GradleException('B5h kernel module-info must export org.apache.derby.iapi.store.types')
        }

        def forbiddenImports = delosdbB5hForbiddenKernelTypeImports()
        if (!forbiddenImports.isEmpty()) {
            throw new GradleException('B5h kernel store type contracts must not import SQL/catalog/iapi.types/java.sql APIs: ' + forbiddenImports.keySet().join(', '))
        }

        delosdbB5hEngineAdaptations.each { fileName, marker ->
            def source = new File(delosdbB5hEngineTypeRoot, fileName)
            def text = delosdbB5hRead(source)
            if (!text.contains('org.apache.derby.iapi.store.types.' + marker)) {
                throw new GradleException('B5h expected ' + fileName + ' to import ' + marker)
            }
            if (!text.contains(marker)) {
                throw new GradleException('B5h expected ' + fileName + ' to adapt to ' + marker)
            }
        }

        def reportText = delosdbB5hRead(delosdbB5hReportFile.get().asFile)
        if (!reportText.contains('B6 readiness') || !reportText.contains('NOT YET')) {
            throw new GradleException('B5h report must explicitly say B6 readiness is NOT YET')
        }
        logger.lifecycle('Verified B5h SQL-neutral store type bridge; B6 readiness is NOT YET')
    }
}

