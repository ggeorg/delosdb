def productInfoResources = [
        [module: moduleNames.engine,        path: 'org/apache/derby/info/engine/info.properties',   technology: 'DelosDB Embedded Engine', productFile: 'derby.jar'],
        [module: moduleNames.tools,         path: 'org/apache/derby/info/tools/info.properties',    technology: 'DelosDB Tools',           productFile: 'derbytools.jar'],
        [module: moduleNames.server,        path: 'org/apache/derby/info/net/info.properties',      technology: 'DelosDB Network Server',  productFile: 'derbynet.jar'],
        [module: moduleNames.client,        path: 'org/apache/derby/info/client/info.properties',   technology: 'DelosDB Network Client',  productFile: 'derbyclient.jar'],
        [module: moduleNames.commons,       path: 'org/apache/derby/info/shared/info.properties',   technology: 'DelosDB Shared Utilities', productFile: 'derbyshared.jar'],
        [module: moduleNames.optionaltools, path: 'org/apache/derby/optional/info.properties',       technology: 'DelosDB Optional Tools',   productFile: 'derbyoptionaltools.jar']
