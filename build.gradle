tasks.register('compileDerbyBuildTools', JavaCompile) {
    dependsOn 'compileDerbyCommons', 'compileDerbyEngine'
    source = files(
            'java/build/org/apache/derbyBuild/splitmessages.java',
            'java/build/org/apache/derbyBuild/ClassSizeCrawler.java'
    )
    destinationDirectory = layout.buildDirectory.dir('classes/build-tools')
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = files(moduleClassDir(moduleNames.commons), moduleClassDir(moduleNames.engine))
}

tasks.register('generateClassSizeCatalog') {
    // ClassSizeCrawler scans the compiled engine output tree. Gradle 8.14
    // requires every task which writes into that tree to be ordered before
    // this scan, otherwise it reports an implicit dependency problem.
    dependsOn 'compileDerbyBuildTools', 'splitEngineMessages'
    def outputFile = generatedSourceDir(moduleNames.engine).map {
        it.file('org/apache/derby/iapi/services/cache/ClassSizeCatalogImpl.java')
    }
    inputs.dir(moduleClassDir(moduleNames.engine))
    outputs.file(outputFile)
    doLast {
        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        javaexec {
            classpath = files(
                    layout.buildDirectory.dir('classes/build-tools'),
                    moduleClassDir(moduleNames.commons),
                    moduleClassDir(moduleNames.engine)
            )
            mainClass = 'org.apache.derbyBuild.ClassSizeCrawler'
            systemProperty 'WS', projectDir.absolutePath
            systemProperty 'classDir', moduleClassDir(moduleNames.engine).get().asFile.absolutePath
            systemProperty 'out', target.absolutePath
            systemProperty 'prefix.1', 'org.apache.derby.iapi.types'
            systemProperty 'prefix.2', 'org.apache.derby.impl'
            args 'org.apache.derby.iapi.types.DataValueDescriptor',
                    'org.apache.derby.impl.store.raw.data.RecordId',
                    'org.apache.derby.iapi.store.raw.ContainerKey',
                    'org.apache.derby.iapi.services.cache.SizedCacheable',
                    'java.lang.ref.WeakReference',
                    'java.math.BigDecimal',
                    'java.util.ArrayList',
                    'java.util.GregorianCalendar',
                    'java.util.Vector'
        }
    }
}

