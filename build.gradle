        }
        def kernelFiles = delosdbB3aJavaSourcesUnder(delosdbB3aKernelContextRoot)
        if (kernelFiles.size() != expectedFiles.size()) {
            throw new GradleException('B3a expected exactly ' + expectedFiles.size() + ' context source files in delosdb-engine-kernel, found ' + kernelFiles.size())
        }
        if (delosdbB3aEngineContextRoot.exists() && !delosdbB3aJavaSourcesUnder(delosdbB3aEngineContextRoot).isEmpty()) {
            throw new GradleException('B3a stale org.apache.derby.iapi.services.context source files remain under delosdb-engine. Run scripts/cleanup-legacy-derby-kernel-b3a.sh')
