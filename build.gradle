tasks.register('verifyAsmSwitchComplete') {
    group = 'verification'
    description = 'Audits that the ASM switch is complete and no legacy bytecode backend scaffolding remains active.'

    def modulesPropertiesFile = file('delosdb-engine/src/main/java/org/apache/derby/modules.properties')
    def moduleInfoFile = file('delosdb-engine/src/main/java/module-info.java')
    def rootBuildFile = file('build.gradle')
    def testsBuildFile = file('delosdb-tests/build.gradle')
    def buildtoolsBuildFile = file('delosdb-buildtools/build.gradle')
    def bytecodeDir = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/bytecode')
    def asmBackendFile = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/bytecode/asm/AsmJava.java')
    def classfileDir = file('delosdb-engine/src/main/java/org/apache/derby/iapi/services/classfile')
    def permanentProofDir = file('dev/generated-bytecode-asm-jvm21-proof')
    def retiredCleanupScripts = [
            'scripts/cleanup-asm-a21-old-bc' + 'java-backend.sh',
            'scripts/cleanup-asm-a22-old-classfile-writer.sh',
            'scripts/cleanup-asm-a23-runtime-dependency-cleanup.sh'
    ].collect { file(it) }

    inputs.files(modulesPropertiesFile, moduleInfoFile, rootBuildFile, testsBuildFile, buildtoolsBuildFile)
    inputs.dir(bytecodeDir)
    inputs.dir(classfileDir)
    inputs.dir(permanentProofDir)
    inputs.files(retiredCleanupScripts.findAll { it.exists() })

    doLast {
        def compilerLines = modulesPropertiesFile.readLines('UTF-8')
                .collect { it.trim() }
                .findAll { it.startsWith('derby.module.javaCompiler=') }
        def expectedCompilerLine = 'derby.module.javaCompiler=org.apache.derby.impl.services.bytecode.asm.AsmJava'
        if (compilerLines != [expectedCompilerLine]) {
            throw new GradleException('ASM switch requires modules.properties to point directly at AsmJava; found: '
                    + compilerLines)
        }

        def moduleInfoText = moduleInfoFile.getText('UTF-8')
        if (!moduleInfoText.contains('requires org.objectweb.asm;')) {
            throw new GradleException('ASM must be a normal engine module dependency: expected requires org.objectweb.asm;')
        }
        if (moduleInfoText.contains('requires static org.objectweb' + '.asm;')) {
            throw new GradleException('ASM is still declared as optional/static in module-info.java')
        }

        def topLevelBytecodeFiles = bytecodeDir.listFiles()
                .findAll { it.isFile() && it.name.endsWith('.java') }
                .collect { it.name }
                .sort()
        if (topLevelBytecodeFiles != ['package-info.java']) {
            throw new GradleException('Legacy top-level bytecode implementation files remain: ' + topLevelBytecodeFiles)
        }
        if (!asmBackendFile.isFile()) {
            throw new GradleException('Permanent ASM backend file is missing: ' + asmBackendFile.path)
        }

        def classfileJavaFiles = classfileDir.listFiles()
                .findAll { it.isFile() && it.name.endsWith('.java') }
                .collect { it.name }
                .sort()
        if (classfileJavaFiles != ['VMOpcode.java']) {
            throw new GradleException('Old classfile writer files remain; only VMOpcode.java should stay: '
                    + classfileJavaFiles)
        }

        def devDir = file('dev')
        def retiredAsmCampaignDirs = devDir.listFiles()
                .findAll { it.isDirectory() && it.name.startsWith('asm-') }
                .collect { it.path }
                .sort()
        if (!retiredAsmCampaignDirs.isEmpty()) {
            throw new GradleException('Temporary ASM campaign directories remain: '
                    + retiredAsmCampaignDirs.join(', '))
        }
        if (!file('dev/generated-bytecode-asm-jvm21-proof/src/main/java/org/apache/derbyBuild/asm/GeneratedBytecodeAsmJvm21Proof.java').isFile()) {
            throw new GradleException('Permanent generated-bytecode ASM JVM21 proof source is missing')
        }

        def buildTexts = [rootBuildFile, testsBuildFile, buildtoolsBuildFile]
                .collectEntries { [(it.path): it.getText('UTF-8')] }
        def retiredTaskNames = [
                'asm' + 'CompatibilityWindow',
                'verify' + 'AsmCompatibilityWindowConfiguration',
                'asm' + 'OnlyBytecodeBackend',
                'verify' + 'AsmOnlyBytecodeBackendConfiguration',
                'asm' + 'ClassfileWriterQuarantine',
                'verify' + 'OldClassfileWriterQuarantined',
                'asm' + 'RuntimeDependencyCleanup',
                'verify' + 'AsmRuntimeDependencyCleanup',
                'runDerbyLangSuiteWith' + 'AsmBackend',
                'runDerbyLangSuiteWith' + 'BcJavaBackend',
                'generated' + 'BytecodeJvm21Proof',
                'compile' + 'GeneratedBytecodeJvm21Proof'
        ]
        def remainingTasks = []
        buildTexts.each { path, text ->
            retiredTaskNames.each { taskName ->
                if (text.contains("tasks.register('${taskName}'")) {
                    remainingTasks << "${path}:${taskName}"
                }
            }
        }
        if (!remainingTasks.isEmpty()) {
            throw new GradleException('Retired ASM switch milestone tasks remain: ' + remainingTasks.join(', '))
        }

        def testsBuildText = testsBuildFile.getText('UTF-8')
        if (testsBuildText.contains('delosdb.bytecode' + '.backend')
                || testsBuildText.contains('derby.module' + '.JavaCompiler')
                || testsBuildText.contains('runDerbyLangSuiteWith' + 'AsmBackend')
                || testsBuildText.contains('runDerbyLangSuiteWith' + 'BcJavaBackend')) {
            throw new GradleException('Temporary bytecode backend override wiring remains in delosdb-tests/build.gradle')
        }

        def retiredScriptsStillPresent = retiredCleanupScripts.findAll { it.exists() }
        if (!retiredScriptsStillPresent.isEmpty()) {
            throw new GradleException('Retired ASM cleanup scripts remain. Run scripts/cleanup-asm-a24-closeout.sh first: '
                    + retiredScriptsStillPresent.collect { it.path }.join(', '))
        }

        def forbiddenTokens = [
                'BC' + 'Java',
                'BC' + 'Class',
                'BC' + 'Method',
                'Code' + 'Chunk',
                'Opcode' + 'Debug',
                'Experimental' + 'BytecodeJavaFactory',
                'Class' + 'Holder',
                'Class' + 'Member',
                'Class' + 'FormatOutput',
                'Class' + 'Input',
                'Class' + 'Investigator',
                'Class' + 'Enumeration',
                'CONSTANT' + '_Double_info',
                'CONSTANT' + '_Float_info',
                'CONSTANT' + '_Index_info',
                'CONSTANT' + '_Integer_info',
                'CONSTANT' + '_Long_info',
                'CONSTANT' + '_Utf8_info',
                'delosdb.bytecode' + '.backend',
                'requires static org.objectweb' + '.asm'
        ]
        def scanRoots = [
                file('delosdb-engine/src/main/java'),
                file('delosdb-commons/src/main/java'),
                file('delosdb-buildtools/src/main/java'),
                file('delosdb-tests/src/test/java')
        ]
        def scanFiles = []
        scanRoots.each { root ->
            if (root.exists()) {
                root.eachFileRecurse { candidate ->
                    if (candidate.isFile()
                            && (candidate.name.endsWith('.java') || candidate.name.endsWith('.properties'))) {
                        scanFiles << candidate
                    }
                }
            }
        }
        scanFiles.addAll([rootBuildFile, testsBuildFile, buildtoolsBuildFile])

        def findings = []
        scanFiles.each { candidate ->
            def text = candidate.getText('UTF-8')
            forbiddenTokens.each { token ->
                if (text.contains(token)) {
                    findings << "${project.relativePath(candidate)} contains ${token}"
                }
            }
        }
        if (!findings.isEmpty()) {
            throw new GradleException('Stale bytecode/classfile writer references remain:\n' + findings.join('\n'))
        }
    }
}

