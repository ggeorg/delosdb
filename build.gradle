tasks.register('verifyLegacyDerbyKernelB5nRawStreamBtreeLongBridge') {
    group = 'verification'
    description = 'B5n: verifies raw stream cleanup and B-tree SQLLongint bridge retirement.'
    dependsOn 'legacyDerbyStoreKernelB5nRawStreamBtreeLongBridgeReport'
    doLast {
        delosdbB5nTouchedFiles.each { source ->
            if (!source.isFile()) {
                throw new GradleException('B5n missing required source file: ' + delosdbB5nRelPath(source))
            }
        }

        def retiredImportsRemaining = delosdbB5nRetiredImportsRemaining()
        if (!retiredImportsRemaining.isEmpty()) {
            throw new GradleException('B5n retired direct store type imports still remain: ' + retiredImportsRemaining.join('; '))
        }

        def streamHandleText = delosdbB5nRead(delosdbB5nStreamContainerHandle)
        def streamFileHandleText = delosdbB5nRead(delosdbB5nStreamFileContainerHandle)
        if (!streamHandleText.contains('boolean fetchNext(Object[] row) throws StandardException;')) {
            throw new GradleException('B5n StreamContainerHandle must expose fetchNext(Object[] row)')
        }
        if (!streamFileHandleText.contains('public boolean fetchNext(Object[] row)')) {
            throw new GradleException('B5n StreamFileContainerHandle must implement fetchNext(Object[] row)')
        }

        def controlText = delosdbB5nRead(delosdbB5nControlRow)
        def branchText = delosdbB5nRead(delosdbB5nBranchControlRow)
        [controlText, branchText].eachWithIndex { text, index ->
            def source = index == 0 ? delosdbB5nControlRow : delosdbB5nBranchControlRow
            if (!text.contains('StoreTypeUtil.newSQLLongint')) {
                throw new GradleException('B5n ' + delosdbB5nRelPath(source) + ' must allocate long holder values through StoreTypeUtil.newSQLLongint')
            }
            if (!text.contains('StoreTypeUtil.getLong')) {
                throw new GradleException('B5n ' + delosdbB5nRelPath(source) + ' must read long holder values through StoreTypeUtil.getLong')
            }
            if (!text.contains('StoreTypeUtil.setLongValue')) {
                throw new GradleException('B5n ' + delosdbB5nRelPath(source) + ' must update long holder values through StoreTypeUtil.setLongValue')
            }
            if (text.contains('import org.apache.derby.iapi.types.SQLLongint;')) {
                throw new GradleException('B5n ' + delosdbB5nRelPath(source) + ' must not import SQLLongint directly')
            }
        }

        def remainingStoreTypeImports = delosdbB5nStoreTypeImportLines()
        if (remainingStoreTypeImports.size() >= delosdbB5nBaselineImportCount) {
            throw new GradleException('B5n relocated-store iapi.types import count did not decrease from baseline ' + delosdbB5nBaselineImportCount + ': ' + remainingStoreTypeImports.size())
        }

        def reportText = delosdbB5nRead(delosdbB5nReportFile.get().asFile)
        if (!reportText.contains('B6 readiness') || !reportText.contains('NOT YET')) {
            throw new GradleException('B5n report must explicitly say B6 readiness is NOT YET')
        }
        logger.lifecycle('Verified B5n raw stream/B-tree long bridge; relocated-store iapi.types imports now ' + remainingStoreTypeImports.size() + '; B6 readiness is NOT YET')
    }
}

