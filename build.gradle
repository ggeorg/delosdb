tasks.register('printArtifactInventory') {
    group = 'help'
    description = 'Prints the current DelosDB artifact/module inventory used for the planned multi-project split.'
    doLast {
        println 'DelosDB artifact inventory'
        println '=========================='
        moduleSplitInventory.sort { it.extractionOrder }.each { artifact ->
            println "${artifact.extractionOrder}. ${artifact.gradleProject}"
            println "   JPMS module : ${artifact.jpmsModule}"
            println "   source root : ${artifact.currentSourceRoot}"
            println "   compile task: ${artifact.compileTask}"
            println "   jar task    : ${artifact.jarTask}"
            println "   jar         : ${artifact.jarName}"
            println "   deps        : ${(artifact.dependencies ?: ['none']).join(', ')}"
            println "   generated   : ${(artifact.generatedBy ?: ['none']).join(', ')}"
            println "   public      : ${artifact.publicArtifact}"
            println "   risk        : ${artifact.extractionRisk}"
            println ''
        }
    }
}

tasks.register('verifyArtifactInventory') {
    group = 'verification'
    description = 'Verifies that the documented artifact/module split inventory matches the current Gradle build model.'
    def inventoryDocs = files(
            'docs/BUILD-INVENTORY.md',
            'docs/ARTIFACTS.md',
            'docs/MODULE-SPLIT-PLAN.md'
    )
    inputs.files(inventoryDocs)
    doLast {
        inventoryDocs.files.each { doc ->
            if (!doc.isFile()) {
                throw new GradleException("Missing inventory document: ${doc}")
            }
        }

        def keys = moduleSplitInventory.collect { it.key }
        if (keys.toSet().size() != keys.size()) {
            throw new GradleException("Duplicate module split inventory keys: ${keys}")
        }

        def extractionOrders = moduleSplitInventory.collect { it.extractionOrder }
        if (extractionOrders.toSet().size() != extractionOrders.size()) {
            throw new GradleException("Duplicate extraction order values: ${extractionOrders}")
        }

        moduleSplitInventory.each { artifact ->
            if (!file(artifact.currentSourceRoot).isDirectory()) {
                throw new GradleException("Missing source root for ${artifact.gradleProject}: ${artifact.currentSourceRoot}")
            }
            if (tasks.findByName(artifact.compileTask) == null) {
                throw new GradleException("Missing compile task for ${artifact.gradleProject}: ${artifact.compileTask}")
            }
            if (tasks.findByName(artifact.jarTask) == null) {
                throw new GradleException("Missing jar task for ${artifact.gradleProject}: ${artifact.jarTask}")
            }
            if (!runtimeJarNames.contains(artifact.jarName)) {
                throw new GradleException("${artifact.gradleProject} jar is not included in runtimeJarNames: ${artifact.jarName}")
            }
            artifact.dependencies.each { dependencyKey ->
                if (!keys.contains(dependencyKey)) {
                    throw new GradleException("${artifact.gradleProject} references unknown dependency key: ${dependencyKey}")
                }
            }
        }

        def documentedText = inventoryDocs.files.findAll { it.isFile() }.collect { it.text }.join(System.lineSeparator())
        moduleSplitInventory.each { artifact ->
            [artifact.gradleProject, artifact.jpmsModule, artifact.jarName].each { token ->
                if (!documentedText.contains(token)) {
                    throw new GradleException("Inventory docs do not mention ${token}")
                }
            }
        }
    }
}

tasks.register('verifyExtractedCommonsProject') {
    dependsOn ':delosdb-commons:compileDerbyCommons', ':delosdb-commons:derbySharedJar'
    group = 'verification'
    description = 'Verifies that the first extracted Gradle subproject owns the commons compile lifecycle.'
    inputs.file('settings.gradle')
    inputs.file('delosdb-commons/build.gradle')
    doLast {
        def commonsProject = findProject(':delosdb-commons')
        if (commonsProject == null) {
            throw new GradleException('Missing extracted subproject :delosdb-commons')
        }
        if (commonsProject.tasks.findByName('generateSanityState') == null) {
            throw new GradleException('Missing :delosdb-commons:generateSanityState')
        }
        if (commonsProject.tasks.findByName('compileDerbyCommons') == null) {
            throw new GradleException('Missing :delosdb-commons:compileDerbyCommons')
        }
        if (commonsProject.tasks.findByName('derbySharedJar') == null) {
            throw new GradleException('Missing :delosdb-commons:derbySharedJar')
        }
        def commonsJar = layout.buildDirectory.file('libs/derbyshared.jar').get().asFile
        if (!commonsJar.isFile()) {
            throw new GradleException("Missing commons runtime jar owned by :delosdb-commons: ${commonsJar}")
        }
        def commonsOutput = moduleClassDir(moduleNames.commons).get().asFile
        if (!commonsOutput.isDirectory()) {
            throw new GradleException("Missing compiled commons output directory: ${commonsOutput}")
        }
        def moduleInfo = new File(commonsOutput, 'module-info.class')
        if (!moduleInfo.isFile()) {
            throw new GradleException("Missing compiled commons module descriptor: ${moduleInfo}")
        }
    }
}


