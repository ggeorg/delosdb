// DS10 — Runtime packaging proof after legacy Derby store source extraction
// -----------------------------------------------------------------------------
// DS8/DS9 moved legacy Derby store source ownership under delosdb-storage-derby.
// DS10 proves the compatibility runtime remains unchanged: derby.jar still
// carries the inherited store classes needed by existing jar-based users, while
// delosdb-storage-derby.jar is not required on the runtime classpath yet.

ext.legacyDerbyStoreRuntimeRequiredEntries = [
        'org/apache/derby/iapi/store/access/TransactionController.class',
        'org/apache/derby/iapi/store/raw/Transaction.class',
        'org/apache/derby/impl/store/access/heap/Heap.class',
        'org/apache/derby/impl/store/access/btree/index/B2I.class',
        'org/apache/derby/impl/store/raw/data/StoredPage.class',
        'org/apache/derby/impl/store/raw/log/LogToFile.class',
        'org/apache/derby/modules.properties'
]

def delosdbDs10JarEntries = { File jarFile ->
    def entries = [] as Set<String>
    new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
        zip.entries().each { entry -> entries.add(entry.name) }
    }
    entries
}

tasks.register('verifyLegacyDerbyStoreRuntimePackaging') {
    group = 'verification'
    description = 'Verifies derby.jar still contains the relocated legacy Derby store runtime classes after DS8/DS9.'
    dependsOn ':delosdb-engine:derbyJar', ':delosdb-storage-derby:legacyDerbyStorageJar', 'verifyLegacyDerbyStoreBoundary'
    doLast {
        def derbyJar = layout.buildDirectory.file('libs/derby.jar').get().asFile
        if (!derbyJar.isFile()) {
            throw new GradleException("Missing ${derbyJar}; run :delosdb-engine:derbyJar")
        }

        def derbyEntries = delosdbDs10JarEntries(derbyJar)
        def missing = legacyDerbyStoreRuntimeRequiredEntries.findAll { !derbyEntries.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("derby.jar is missing legacy Derby store runtime entries after DS9:\n" + missing.join('\n'))
        }

        def storageJar = layout.buildDirectory.file('libs/delosdb-storage-derby.jar').get().asFile
        if (storageJar.isFile()) {
            def storageEntries = delosdbDs10JarEntries(storageJar)
            def duplicatedRuntimeStoreEntries = storageEntries.findAll { entry ->
                entry.startsWith('org/apache/derby/iapi/store/') || entry.startsWith('org/apache/derby/impl/store/')
            }
            if (!duplicatedRuntimeStoreEntries.isEmpty()) {
                throw new GradleException('DS10 keeps compatibility packaging in derby.jar; delosdb-storage-derby.jar must not also carry runtime store packages yet. Duplicates include:\n'
                        + duplicatedRuntimeStoreEntries.take(20).join('\n'))
            }
        }

        logger.lifecycle('Verified DS10 compatibility packaging: derby.jar carries legacy Derby store runtime classes; no separate storage jar is required yet')
    }
}

