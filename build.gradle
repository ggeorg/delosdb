// -----------------------------------------------------------------------------
// DS1 — Legacy Derby store boundary proof
// -----------------------------------------------------------------------------
// These tasks are intentionally analysis-only. They do not move files and they do
// not change runtime behavior. They make the inherited Derby store boundary
// explicit before any later modularization surgery.

def delosdbDs1JavaFiles = { String relativePath ->
    def root = file(relativePath)
    if (!root.exists()) {
        return [] as List<File>
    }
    return fileTree(root) { include '**/*.java' }.files.sort { it.path }
}

def delosdbDs1RelPath = { File source ->
    return rootDir.toPath().relativize(source.toPath()).toString().replace(File.separatorChar, '/' as char)
}

def delosdbDs1IsUnder = { File source, File root ->
    if (!root.exists()) {
        return false
    }
    return source.toPath().normalize().startsWith(root.toPath().normalize())
}

def delosdbDs1ImportMatches = { Collection<File> sources, Collection<String> prefixes ->
    def matches = []
    sources.each { source ->
        int lineNumber = 0
        source.eachLine { line ->
            lineNumber++
            def matcher = line =~ /^\s*import\s+([^;]+);\s*$/
            if (matcher.matches()) {
                def importedType = matcher[0][1].trim()
                if (prefixes.any { importedType.startsWith(it) }) {
                    matches << [file: delosdbDs1RelPath(source), line: lineNumber, importedType: importedType]
                }
            }
        }
    }
    return matches
}

def delosdbDs1RequireNoImports = { String label, Collection<File> sources, Collection<String> forbiddenPrefixes ->
    def matches = delosdbDs1ImportMatches(sources, forbiddenPrefixes)
    if (!matches.isEmpty()) {
        def detail = matches.collect { "${it.file}:${it.line}: import ${it.importedType};" }.join('\n')
        throw new GradleException("${label} has forbidden imports:\n${detail}")
    }
}

def delosdbDs1PackageName = { File source ->
    def packageName = null
    source.eachLine { line ->
        if (packageName == null) {
            def matcher = line =~ /^\s*package\s+([^;]+);\s*$/
            if (matcher.matches()) {
                packageName = matcher[0][1].trim()
            }
        }
    }
    return packageName
}

def delosdbDs1MainSourceRoots = {
    def roots = [file('delosdb-engine/src/main/java')]
    subprojects.each { p ->
        def sourceRoot = new File(p.projectDir, 'src/main/java')
        if (sourceRoot.exists()) {
            roots << sourceRoot
        }
    }
    return roots.findAll { it.exists() }.unique { it.canonicalPath }
}

def delosdbDs1AllMainJavaFiles = {
    def files = []
    delosdbDs1MainSourceRoots().each { root ->
        files.addAll(fileTree(root) { include '**/*.java' }.files)
    }
    return files.unique { it.canonicalPath }.sort { it.path }
}

def delosdbDs1EngineStoreApiRoot = file('delosdb-engine/src/main/java/org/apache/derby/iapi/store')
def delosdbDs1StorageDerbyStoreApiRoot = file('delosdb-storage-derby/src/main/java/org/apache/derby/iapi/store')
def delosdbDs1StoreApiRoot = delosdbDs1EngineStoreApiRoot

def delosdbDs1StoreImplRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
def delosdbDs1StorageDerbyStoreImplRoot = file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store')

def delosdbDs1StoreApiRoots = [delosdbDs1EngineStoreApiRoot, delosdbDs1StorageDerbyStoreApiRoot]
def delosdbDs1StoreImplRoots = [delosdbDs1StoreImplRoot, delosdbDs1StorageDerbyStoreImplRoot]

def delosdbDs1FilesUnderRoots = { Collection<File> roots ->
    def result = []
    roots.findAll { it.exists() }.each { root ->
        result.addAll(fileTree(root) { include '**/*.java' }.files)
    }
    return result.unique { it.canonicalPath }.sort { it.path }
}

def delosdbDs1StoreApiFiles = { delosdbDs1FilesUnderRoots(delosdbDs1StoreApiRoots) }
def delosdbDs1StoreImplFiles = { delosdbDs1FilesUnderRoots(delosdbDs1StoreImplRoots) }
def delosdbDs1StoreFiles = {
    def result = []
    result.addAll(delosdbDs1StoreApiFiles())
    result.addAll(delosdbDs1StoreImplFiles())
    return result.unique { it.canonicalPath }.sort { it.path }
}

def delosdbDs1IsInheritedStoreSource = { File source ->
    (delosdbDs1StoreApiRoots + delosdbDs1StoreImplRoots).any { root ->
        root.exists() && delosdbDs1IsUnder(source, root)
    }
}

