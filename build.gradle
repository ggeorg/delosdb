tasks.register('verifyLegacyDerbyKernelB5oSortQualifierBridge') {
    group = 'verification'
    description = 'B5o: verifies sort/qualifier StoreDataValue bridge progress.'
    dependsOn 'legacyDerbyStoreKernelB5oSortQualifierBridgeReport'
    doLast {
        delosdbB5oTouchedFiles.each { source ->
            if (!source.isFile()) {
                throw new GradleException('B5o missing required source file: ' + delosdbB5oRelPath(source))
            }
        }

        def retiredImportsRemaining = delosdbB5oRetiredImportsRemaining()
        if (!retiredImportsRemaining.isEmpty()) {
            throw new GradleException('B5o retired direct store type imports still remain: ' + retiredImportsRemaining.join('; '))
        }

        def sortObserverText = delosdbB5oRead(delosdbB5oSortObserver)
        if (!sortObserverText.contains('StoreDataValue[] insertNonDuplicateKey') ||
            !sortObserverText.contains('StoreDataValue[] insertDuplicateKey') ||
            !sortObserverText.contains('StoreDataValue[] getArrayClone()')) {
            throw new GradleException('B5o SortObserver must expose StoreDataValue[] methods')
        }

        def sortControllerText = delosdbB5oRead(delosdbB5oSortController)
        if (!sortControllerText.contains('void insert(StoreDataValue[] row)')) {
            throw new GradleException('B5o SortController must insert StoreDataValue[] rows')
        }

        def qualifierText = delosdbB5oRead(delosdbB5oQualifier)
        if (!qualifierText.contains('StoreDataValue getOrderable()')) {
            throw new GradleException('B5o Qualifier#getOrderable must return StoreDataValue')
        }

        def utfQualifierText = delosdbB5oRead(delosdbB5oUTFQualifier)
        if (!utfQualifierText.contains('StoreOrderable.ORDER_OP_EQUALS')) {
            throw new GradleException('B5o UTFQualifier must use StoreOrderable comparison constants')
        }

        def storeTypeUtilText = delosdbB5oRead(delosdbB5oStoreTypeUtil)
        if (!storeTypeUtilText.contains('boolean isNull(Object value)')) {
            throw new GradleException('B5o StoreTypeUtil must expose isNull(Object)')
        }

        [delosdbB5oSortBuffer, delosdbB5oNode, delosdbB5oMergeInserter, delosdbB5oMergeScan, delosdbB5oUniqueMergeSort].each { source ->
            def text = delosdbB5oRead(source)
            if (!text.contains('StoreDataValue')) {
                throw new GradleException('B5o ' + delosdbB5oRelPath(source) + ' must use StoreDataValue')
            }
        }

        def remainingStoreTypeImports = delosdbB5oStoreTypeImportLines()
        if (remainingStoreTypeImports.size() >= delosdbB5oBaselineImportCount) {
            throw new GradleException('B5o relocated-store iapi.types import count did not decrease from baseline ' + delosdbB5oBaselineImportCount + ': ' + remainingStoreTypeImports.size())
        }

        def reportText = delosdbB5oRead(delosdbB5oReportFile.get().asFile)
        if (!reportText.contains('NOT YET')) {
            throw new GradleException('B5o report must explicitly say B6 readiness is NOT YET')
        }
        logger.lifecycle('Verified B5o sort/qualifier bridge; relocated-store iapi.types imports now ' + remainingStoreTypeImports.size() + '; B6 readiness is NOT YET')
    }
}

