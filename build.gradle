tasks.register('verifyArtifactInventory') {
    group = 'verification'
    description = 'Verifies that the documented artifact/module split inventory matches the current Gradle build model.'
    def inventoryDocs = files(
            'docs/BUILD-INVENTORY.md',
            'docs/ARTIFACTS.md',
            'docs/MODULE-SPLIT-PLAN.md'
    )
    inputs.files(inventoryDocs)
    doLast {
        inventoryDocs.files.each { doc ->
            if (!doc.isFile()) {
                throw new GradleException("Missing inventory document: ${doc}")
            }
        }

        def keys = moduleSplitInventory.collect { it.key }
        if (keys.toSet().size() != keys.size()) {
            throw new GradleException("Duplicate module split inventory keys: ${keys}")
        }

        def extractionOrders = moduleSplitInventory.collect { it.extractionOrder }
        if (extractionOrders.toSet().size() != extractionOrders.size()) {
            throw new GradleException("Duplicate extraction order values: ${extractionOrders}")
        }

        moduleSplitInventory.each { artifact ->
            if (!file(artifact.currentSourceRoot).isDirectory()) {
                throw new GradleException("Missing source root for ${artifact.gradleProject}: ${artifact.currentSourceRoot}")
            }

            def taskOwner = findProject(":${artifact.gradleProject}")
            if (taskOwner == null) {
                throw new GradleException("Missing Gradle project for ${artifact.gradleProject}")
            }
            if (taskOwner.tasks.findByName(artifact.compileTask) == null) {
                throw new GradleException("Missing compile task for ${artifact.gradleProject}: ${artifact.compileTask}")
            }
            if (taskOwner.tasks.findByName(artifact.jarTask) == null) {
                throw new GradleException("Missing jar task for ${artifact.gradleProject}: ${artifact.jarTask}")
            }
            if (!runtimeJarNames.contains(artifact.jarName)) {
                throw new GradleException("${artifact.gradleProject} jar is not included in runtimeJarNames: ${artifact.jarName}")
            }
            artifact.dependencies.each { dependencyKey ->
                if (!keys.contains(dependencyKey)) {
                    throw new GradleException("${artifact.gradleProject} references unknown dependency key: ${dependencyKey}")
                }
            }
        }

        def documentedText = inventoryDocs.files.findAll { it.isFile() }.collect { it.text }.join(System.lineSeparator())
        moduleSplitInventory.each { artifact ->
            [artifact.gradleProject, artifact.jpmsModule, artifact.jarName].each { token ->
                if (!documentedText.contains(token)) {
                    throw new GradleException("Inventory docs do not mention ${token}")
                }
            }
        }
    }
}

