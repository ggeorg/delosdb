// External SQLancer remains caller-supplied. The wrapper rejects hidden
// compiler overrides so it exercises the same fixed registration as DelosDB.
tasks.register('delosGeneratedClassProductionSqlancerValidation') {
    group = 'verification'
    description = 'Runs a caller-supplied SQLancer command through the sole generated-class production backend.'
    doLast {
        String propertyName = 'delosdb.compiler.generatedClass.production.sqlancer.command'
        String commandText = providers.gradleProperty(propertyName).orNull
        if (commandText == null || commandText.trim().isEmpty()) {
            throw new GradleException(
                    'delosGeneratedClassProductionSqlancerValidation requires -P'
                    + propertyName + '="<command>"')
        }
        String inheritedOptions = providers.environmentVariable(
                'JAVA_TOOL_OPTIONS').orNull ?: ''
        if (inheritedOptions.contains('derby.module.javaCompiler')) {
            throw new GradleException(
                    'Generated-class SQLancer validation must use modules.properties; remove derby.module.javaCompiler from JAVA_TOOL_OPTIONS')
        }
        def execution = providers.exec {
            String osName = System.getProperty(
                    'os.name', '').toLowerCase(java.util.Locale.ROOT)
            if (osName.contains('windows')) {
                commandLine 'cmd', '/c', commandText.trim()
            } else {
                commandLine 'sh', '-c', commandText.trim()
            }
        }
        execution.result.get().assertNormalExitValue()
    }
}
