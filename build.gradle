tasks.register('verifyLegacyDerbyKernelB5jFirstTypeRewrite') {
    group = 'verification'
    description = 'B5j: verifies the first low-risk relocated-store rewrite away from iapi.types.'
    dependsOn 'legacyDerbyStoreKernelB5jFirstTypeRewriteReport'
    doLast {
        [delosdbB5jBinaryOrderable, delosdbB5jStaticCompiledInfo].each { source ->
            if (!source.isFile()) {
                throw new GradleException('B5j missing rewritten store contract: ' + delosdbB5jRelPath(source))
            }
        }

        def binaryOrderableText = delosdbB5jRead(delosdbB5jBinaryOrderable)
        if (!binaryOrderableText.contains('org.apache.derby.iapi.store.types.StoreOrderable')) {
            throw new GradleException('B5j BinaryOrderable must import StoreOrderable')
        }
        if (binaryOrderableText.contains('import org.apache.derby.iapi.types.Orderable;')) {
            throw new GradleException('B5j BinaryOrderable must not import iapi.types.Orderable')
        }
        if (!binaryOrderableText.contains('extends StoreOrderable')) {
            throw new GradleException('B5j BinaryOrderable must extend StoreOrderable')
        }

        def staticInfoText = delosdbB5jRead(delosdbB5jStaticCompiledInfo)
        if (!staticInfoText.contains('org.apache.derby.iapi.store.types.StoreDataValue')) {
            throw new GradleException('B5j StaticCompiledOpenConglomInfo must import StoreDataValue')
        }
        if (staticInfoText.contains('import org.apache.derby.iapi.types.DataValueDescriptor;')) {
            throw new GradleException('B5j StaticCompiledOpenConglomInfo must not import iapi.types.DataValueDescriptor')
        }
        if (!staticInfoText.contains('StoreDataValue  getConglom()')) {
            throw new GradleException('B5j StaticCompiledOpenConglomInfo must expose StoreDataValue getConglom()')
        }

        def touchedForbiddenImports = delosdbB5jTouchedForbiddenTypeImports()
        if (!touchedForbiddenImports.isEmpty()) {
            throw new GradleException('B5j rewritten contracts still import iapi.types: ' + touchedForbiddenImports.join('; '))
        }

        def reportText = delosdbB5jRead(delosdbB5jReportFile.get().asFile)
        if (!reportText.contains('B6 readiness') || !reportText.contains('NOT YET')) {
            throw new GradleException('B5j report must explicitly say B6 readiness is NOT YET')
        }
        logger.lifecycle('Verified B5j first relocated-store type rewrite; B6 readiness is NOT YET')
    }
}

