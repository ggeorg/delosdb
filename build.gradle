}

def execSupport = objects.newInstance(DelosDbExecSupport)

def runBuildTool = { String mainClassName, Collection<Object> extraClasspath, Closure<?> configure ->
    execSupport.execOperations.javaexec {
        classpath = files(([buildToolsClassDir] + extraClasspath))
        mainClass = mainClassName
        configure.delegate = delegate
        configure.resolveStrategy = Closure.DELEGATE_FIRST
        configure.call()
    }
}

def buildNumber = providers.provider {
    try {
        def stdout = new ByteArrayOutputStream()
        execSupport.execOperations.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def value = stdout.toString().trim()
        value ?: 'local'
    } catch (Exception ignored) {
        'local'
    }
}

