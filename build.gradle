larger group of low-risk imports where the store only needed factory creation,
constants, or simple value holders. Implementation-heavy DataValueDescriptor,
RowLocation, DataType, RefDataValue, and the remaining B-tree SQLLongint usage
stay deferred for later slices.

B6 readiness
------------
