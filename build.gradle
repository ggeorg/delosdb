]
def localeJars = ext.delosdbLocales.keySet().collect { "derbyLocale_${it}.jar" }.join(' ')

// Derby's manifest Main-Class and Class-Path entries. Class-Path lets a jar
// find the jars it needs beside it, which `java -jar derbyrun.jar <tool>`,
// `java -jar derbynet.jar` and a class path naming only derbytools.jar rely
// on, and lets derby.jar find the locale jars. derby.jar also names
// delosdb-spi.jar, which its module requires.
def derbyJarLaunchAttributes = [
        'derby.jar'             : ['Class-Path': "derbyshared.jar delosdb-spi.jar ${localeJars}"],
        'derbyclient.jar'       : ['Class-Path': "derbyshared.jar ${localeJars}"],
        'derbyshared.jar'       : ['Class-Path': localeJars],
        'derbytools.jar'        : ['Class-Path': 'derby.jar derbyclient.jar derbynet.jar'],
        'derbyoptionaltools.jar': ['Class-Path': "derbyshared.jar ${localeJars}"],
        'derbynet.jar'          : ['Main-Class': 'org.apache.derby.drda.NetworkServerControl',
                                   'Class-Path': 'derby.jar derbyshared.jar derbytools.jar'],
        'derbyrun.jar'          : ['Main-Class': 'org.apache.derby.run.run',
                                   'Class-Path': 'derby.jar derbyclient.jar derbytools.jar derbynet.jar derbyoptionaltools.jar derbyshared.jar']
]

ext.delosdbRuntimeJarAttributes = { String title, String jarName ->
    (derbyJarLaunchAttributes[jarName] ?: [:]) + [
            'Implementation-Title'      : title,
            'Implementation-Version'    : delosDbVersion,
            'Implementation-Vendor'     : 'DelosDB Project',
            'Specification-Title'       : title,
            'Specification-Version'     : derbyCompatibilityVersion,
            'Specification-Vendor'      : 'DelosDB Project',
            'DelosDB-Version'           : delosDbVersion,
            'DelosDB-Build-Revision'    : buildNumber.get(),
            'DelosDB-Origin'            : 'Forked from Apache Derby 10.17.1.0',
            'DelosDB-Repository'        : 'https://github.com/ggeorg/delosdb',
            'Apache-Derby-Base-Version' : derbyCompatibilityVersion,
