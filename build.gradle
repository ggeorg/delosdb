--------------
  - StoreOrderable carries store-facing comparison operator constants.
  - StoreTypeSupport / StoreTypeUtil add isNull(Object) for sort/null checks.
  - SortObserver and SortController now use StoreDataValue[] for store-facing row values.
  - Qualifier#getOrderable now returns StoreDataValue instead of DataValueDescriptor.
  - UTFQualifier uses StoreDataValue and StoreOrderable instead of direct Derby types.
