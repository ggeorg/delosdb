tasks.register('verifyCentralizedJavaCompileConventions') {
    group = 'verification'
    description = 'Ensures extracted subprojects use the shared DelosDB JavaCompile convention helper.'
    def buildFiles = files(
            'build.gradle',
            'delosdb-commons/build.gradle',
            'delosdb-spi/build.gradle',
            'delosdb-client/build.gradle',
            'delosdb-engine/build.gradle',
            'delosdb-tools/build.gradle',
            'delosdb-runner/build.gradle',
            'delosdb-server/build.gradle',
            'delosdb-optionaltools/build.gradle',
            'delosdb-osgi-stub/build.gradle'
    )
    inputs.files(buildFiles)
    doLast {
        def rootBuild = file('build.gradle').text
        if (!rootBuild.contains('ext.delosdbConfigureJavaCompile')) {
            throw new GradleException('Root build does not define ext.delosdbConfigureJavaCompile')
        }
        buildFiles.files.findAll { it.path != file('build.gradle').path }.each { buildFile ->
            def buildScript = buildFile.text
            if (!buildScript.contains('rootProject.ext.delosdbConfigureJavaCompile')) {
                throw new GradleException("${buildFile} does not use rootProject.ext.delosdbConfigureJavaCompile")
            }
            if (buildScript.contains('def configureJavaCompile')) {
                throw new GradleException("${buildFile} still declares a local configureJavaCompile helper")
            }
            ['def javaRelease =', 'sourceCompatibility =', 'targetCompatibility =', 'options.release =', 'options.encoding ='].each { duplicatedSetting ->
                if (buildScript.contains(duplicatedSetting)) {
                    throw new GradleException("${buildFile} still duplicates JavaCompile setting '${duplicatedSetting}'")
                }
            }
        }
    }
}

tasks.register('verifyCentralizedReleaseMetadata') {
    group = 'verification'
    description = 'Ensures extracted runtime jar subprojects use the shared DelosDB release metadata helpers.'
    def buildFiles = files(
            'delosdb-commons/build.gradle',
            'delosdb-spi/build.gradle',
            'delosdb-client/build.gradle',
            'delosdb-engine/build.gradle',
            'delosdb-tools/build.gradle',
            'delosdb-runner/build.gradle',
            'delosdb-server/build.gradle',
            'delosdb-optionaltools/build.gradle',
            'delosdb-osgi-stub/build.gradle'
    )
    inputs.files(buildFiles)
    doLast {
        buildFiles.files.each { buildFile ->
            def buildScript = buildFile.text
            if (!buildScript.contains('rootProject.ext.delosdbLegalFiles')) {
                throw new GradleException("${buildFile} does not use rootProject.ext.delosdbLegalFiles")
            }
            if (!buildScript.contains('rootProject.ext.delosdbRuntimeJarAttributes')) {
                throw new GradleException("${buildFile} does not use rootProject.ext.delosdbRuntimeJarAttributes")
            }
            if (buildScript.contains('def legalFiles =') || buildScript.contains('def releaseManifestAttributes =')) {
                throw new GradleException("${buildFile} still declares duplicated release metadata helpers")
            }
        }
    }
}

tasks.register('verifyGradleOnlyPublicSurface') {
    group = 'verification'
    description = 'Ensures public build instructions expose only the Gradle build path.'
