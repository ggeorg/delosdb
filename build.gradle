tasks.register('verifyLegacyDerbyKernelB5abScratchDiskLockBridge') {
    group = 'verification'
    description = 'B5ab: verifies scratch-row, disk/property row, and B-tree lock-template bridge progress.'
    dependsOn 'legacyDerbyStoreKernelB5abScratchDiskLockBridgeReport'
    doLast {
        delosdbB5abFiles.each { source ->
            if (!source.isFile()) {
                throw new GradleException('B5ab missing required source file: ' + delosdbB5abRelPath(source))
            }
        }

        [
            'delosdb-storage-derby/src/main/java/org/apache/derby/iapi/store/access/DiskHashtable.java',
            'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/PropertyConglomerate.java',
            'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/conglomerate/OpenConglomerateScratchSpace.java',
            'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/conglomerate/OpenConglomerate.java',
            'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/btree/BTreeRowPosition.java',
            'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/btree/index/B2IRowLocking3.java'
        ].each { path ->
            def text = delosdbB5abRead(file(path))
            if (text.contains('import org.apache.derby.iapi.types.DataValueDescriptor;') ||
                text.contains('import org.apache.derby.iapi.types.RowLocation;')) {
                throw new GradleException('B5ab source kept a retired direct type import: ' + path)
            }
        }

        def supportText = delosdbB5abRead(file('delosdb-engine-kernel/src/main/java/org/apache/derby/iapi/store/types/StoreTypeSupport.java'))
        if (!supportText.contains('StoreDataValue[] newValueArray(int length);') ||
            !supportText.contains('void setIntValue(Object target, int value);')) {
            throw new GradleException('B5ab StoreTypeSupport must expose value-array and int-value bridge operations')
        }

        def scratchText = delosdbB5abRead(file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/conglomerate/OpenConglomerateScratchSpace.java'))
        if (!scratchText.contains('public StoreDataValue[] get_row_for_export') ||
            !scratchText.contains('public StoreDataValue[] get_template')) {
            throw new GradleException('B5ab scratch space must expose StoreDataValue[] row/template accessors')
        }

        def imports = delosdbB5abStoreTypeImportLines()
        if (imports.size() >= delosdbB5abBaselineImportCount) {
            throw new GradleException('B5ab relocated-store iapi.types import count did not decrease from baseline ' + delosdbB5abBaselineImportCount + ': ' + imports.size())
        }

        def reportText = delosdbB5abRead(delosdbB5abReportFile.get().asFile)
        if (!reportText.contains('B6 readiness') || !reportText.contains('NOT YET')) {
            throw new GradleException('B5ab report must explicitly say B6 readiness is NOT YET')
        }

        logger.lifecycle('Verified B5ab scratch/disk/lock bridge; relocated-store iapi.types imports now ' + imports.size() + '; B6 readiness is NOT YET')
    }
}

