        'delosdb-spi.jar',
        'osgi-framework-stub.jar',
        'derbyshared.jar',
        'delosdb-engine-kernel.jar',
        'derby.jar',
        'derbyclient.jar',
        'derbytools.jar',
        'derbynet.jar',
        'derbyoptionaltools.jar',
        'derbyrun.jar'
]


def runtimeJars = {
    // derby.jar uses the ASM-backed generated SQL bytecode backend. Keep ASM on
    // the runtime classpath for jar-based smokes.
    files(runtimeJarNames.collect { layout.buildDirectory.file("libs/${it}") }, configurations.delosdbAsm)
}


// Export the runtime classpath helpers for extracted Gradle guard scripts.
// Plain `runtimeJars()` calls inside task configuration closures may resolve
// against the task object after extraction, so guards call these explicitly.
ext.delosdbRuntimeJarNames = runtimeJarNames
ext.delosdbRuntimeJars = runtimeJars

apply from: file('gradle/delosdb-runtime-distribution.gradle')

apply from: file('gradle/delosdb-publication.gradle')

apply from: file('gradle/delosdb-verification.gradle')
apply from: file('gradle/delosdb-mvcc-verification.gradle')


// -----------------------------------------------------------------------------

// Legacy Derby store guard tasks are intentionally kept out of the root build file.
// Compact permanent storage-Derby Phase-B boundary gates.
// Permanent DelosDB storage guards and closed-phase executable smokes.
// Closed C/F text-token report guards are retired after Phase F closeout.


// Phase F2.2: storage-phase smoke compiles put compiled module directories on
// their classpath.  The engine-kernel module directory is also populated by the
// generated ClassSizeCatalog compile task, so Gradle 8.14 requires an explicit
// producer dependency for every storage-phase smoke compile task which may read
// that directory.
tasks.withType(JavaCompile).configureEach { JavaCompile compileTask ->
    if (compileTask.name.startsWith('compileStoragePhase')) {
        compileTask.dependsOn ':delosdb-engine-kernel:compileDelosDbEngineKernelClassSizeCatalog'
    }
}
