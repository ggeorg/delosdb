            throw new GradleException('B5b DatabaseClasses must cast classDump back to ByteArray internally')
        }

        def kernelModuleInfo = delosdbB5bRead(file('delosdb-engine-kernel/src/main/java/module-info.java'))
        if (!kernelModuleInfo.contains('exports org.apache.derby.iapi.services.loader;')) {
