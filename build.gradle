def runtimeCompileTasks = [
        ':delosdb-commons:compileDerbyCommons',
        ':delosdb-engine-api:compileDelosDbEngineApi',
        ':delosdb-storage-io:compileDelosDbStorageIo',
        ':delosdb-engine-kernel:compileDelosDbEngineKernel',
        ':delosdb-engine:compileDerbyEngine',
        ':delosdb-client:compileDerbyClient',
        ':delosdb-tools:compileDerbyTools',
        ':delosdb-server:compileDerbyServer',
        ':delosdb-optionaltools:compileDerbyOptionalTools',
        ':delosdb-runner:compileDerbyRunner'
]


def moduleClassDir = { String moduleName ->
    def moduleProject = moduleProjects[moduleName]
    moduleProject == null
            ? layout.buildDirectory.dir("classes/modules/${moduleName}")
            : project(moduleProject).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

def buildToolsClassDir = project(':delosdb-buildtools').layout.buildDirectory.dir('classes/build-tools')

def generatedSourceDir = { String moduleName ->
    layout.buildDirectory.dir("generated/sources/${moduleName}")
}

def execSupport = objects.newInstance(DelosDbExecSupport)

def runBuildTool = { String mainClassName, Collection<Object> extraClasspath, Closure<?> configure ->
    execSupport.execOperations.javaexec {
        classpath = files(([buildToolsClassDir] + extraClasspath))
        mainClass = mainClassName
        configure.delegate = delegate
        configure.resolveStrategy = Closure.DELEGATE_FIRST
        configure.call()
    }
}

def buildNumber = providers.provider {
    try {
        def stdout = new ByteArrayOutputStream()
        execSupport.execOperations.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def value = stdout.toString().trim()
        value ?: 'local'
    } catch (Exception ignored) {
        'local'
    }
}

ext.buildNumberProvider = buildNumber
ext.derbyCompatibilityVersion = derbyCompatibilityVersion

ext.junitPlatformConsoleVersion = '1.11.4'
ext.asmVersion = '9.9'

