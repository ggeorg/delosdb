ext.delosdbConfigureJavaCompile = { JavaCompile task, Collection<Object> modulePathEntries = [] ->
    // Gradle 8.14 validates custom JavaCompile tasks even when --release is set.
    // Because DelosDB still uses custom JavaCompile tasks while the legacy tree is
    // being split into Gradle subprojects, keep the compiler contract centralized.
    task.sourceCompatibility = javaRelease.toString()
    task.targetCompatibility = javaRelease.toString()
    task.options.release = javaRelease
    task.options.encoding = 'UTF-8'
    task.options.deprecation = false
    task.options.warnings = true
    task.classpath = files()
    task.doFirst {
        def modulePath = files(modulePathEntries).asPath
        if (modulePath) {
            task.options.compilerArgs.addAll(['--module-path', modulePath])
        }
        task.options.compilerArgs.add('-Xlint:deprecation')
    }
}

def replaceInFile = { File file, Closure<String> transform ->
