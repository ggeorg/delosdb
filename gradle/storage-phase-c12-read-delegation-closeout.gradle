import org.gradle.api.tasks.compile.JavaCompile

// Phase C12 read delegation closeout.
//
// This is still not routing retirement. VersionedStorageSqlBridge remains the
// temporary SQL regex router. C12 only closes out the remaining read-side table
// operation leaks that were still calling VersionedTable.openScan/stats directly.

ext.delosdbStoragePhaseC12ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC12ReportFile =
        ext.delosdbStoragePhaseC12ReportDir.map { it.file('storage-phase-c12-read-delegation-closeout.txt') }
ext.delosdbStoragePhaseC12SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c12-read-delegation-closeout-smoke')

ext.delosdbStoragePhaseC12RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC12RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC12RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC12ForbiddenSourceHits = { Collection<File> sourceFiles, Collection<String> tokens ->
    sourceFiles.collectMany { sourceFile ->
        def text = sourceFile.text
        tokens.findAll { token -> text.contains(token) }.collect { token ->
            "${delosdbStoragePhaseC12RelPath(sourceFile)} contains forbidden token ${token}"
        }
    }.sort()
}

ext.delosdbStoragePhaseC12JavaFiles = { String projectPath ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [] as Set<File>
    }
    fileTree(sourceRoot).matching { include '**/*.java' }.files as Set<File>
}

ext.delosdbStoragePhaseC12ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC12RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC12Classpath = {
    files(
            delosdbStoragePhaseC12SmokeClassesDir,
            delosdbStoragePhaseC12ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC12ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC12ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC12RuntimeJars())
}

ext.delosdbStoragePhaseC12Proof = {
    def errors = []
    def lines = []

    def smokeSource = file('dev/storage-phase-c12-read-delegation-closeout-smoke/src/main/java/delosdb/smoke/StoragePhaseC12ReadDelegationCloseoutSmoke.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def executionBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/execution/VersionedStorageExecutionBridge.java')
    def embedStatement = file('delosdb-engine/src/main/java/org/apache/derby/impl/jdbc/EmbedStatement.java')
    def heapProvider = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/LegacyDerbyHeapStorageProvider.java')
    def mvccProvider = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccStorageProvider.java')
    def storelessRoot = file('delosdb-storeless/src/main/java')

    delosdbStoragePhaseC12RequireTokens(errors, smokeSource, [
            'SqlBridgePlan',
            'VersionedStorageSqlBridge.tryExecute(sql, this, true)',
            'CREATE TABLE ',
            'USING delos_mvcc',
            'INSERT INTO ',
            'SELECT * FROM ',
            'WHERE id = 2',
            'WHERE id >= 2',
            'SELECT COUNT(*) FROM ',
            'requireSingleRow',
            'requireRows',
            'requireCount'
    ], 'Phase C12 read delegation closeout smoke')

    delosdbStoragePhaseC12RequireTokens(errors, sqlBridge, [
            'private static final Pattern SELECT_ALL',
            'private static final Pattern SELECT_COUNT',
            'private static final Pattern SELECT_WHERE_EQUALS',
            'private static final Pattern SELECT_WHERE_RANGE',
            'PLANNED_TABLE_OPERATION_BRIDGE.scanAll(',
            'PLANNED_TABLE_OPERATION_BRIDGE.stats(',
            'for (VersionedRow<Long, List<Object>> visibleRow : PLANNED_TABLE_OPERATION_BRIDGE.scanAll(',
            'PLANNED_TABLE_OPERATION_BRIDGE.insert(',
            'PLANNED_TABLE_OPERATION_BRIDGE.delete(',
            'PLANNED_TABLE_OPERATION_BRIDGE.update('
    ], 'VersionedStorageSqlBridge read delegation closeout')

    if (sqlBridge.exists()) {
        def bridgeText = sqlBridge.text
        if (bridgeText.contains('table.table().openScan(')) {
            errors << 'VersionedStorageSqlBridge must not call VersionedTable.openScan directly after C12'
        }
        if (bridgeText.contains('table.table().stats(')) {
            errors << 'VersionedStorageSqlBridge must not call VersionedTable.stats directly after C12'
        }
        [
                'table.table().insert(',
                'table.table().update(',
                'table.table().delete('
        ].each { token ->
            if (bridgeText.contains(token)) {
                errors << "VersionedStorageSqlBridge must not call ${token} directly after C12"
            }
        }
    }

    delosdbStoragePhaseC12RequireTokens(errors, executionBridge, [
            'public <K, V> List<VersionedRow<K, V>> scanAll(',
            'public <K, V> VersionedTableStats stats(',
            'public static VersionedStorageExecutionBridge resolvedTableOperations()'
    ], 'VersionedStorageExecutionBridge read operations')

    delosdbStoragePhaseC12RequireTokens(errors, embedStatement, [
            'VersionedStorageSqlBridge.tryExecute('
    ], 'current transitional EmbedStatement bridge hook')

    delosdbStoragePhaseC12RequireTokens(errors, heapProvider, [
            'implements StorageProvider',
            'StorageCapabilities'
    ], 'Derby heap provider remains metadata path')

    delosdbStoragePhaseC12RequireTokens(errors, mvccProvider, [
            'implements VersionedStorageProvider',
            'VersionedTable<K, V> createTable(',
            'VersionedTable<K, V> openTable('
    ], 'MVCC provider remains VersionedStorageProvider path')

    if (storelessRoot.exists()) {
        def storelessHits = fileTree(storelessRoot).matching { include '**/*.java' }.files.findAll { sourceFile ->
            def text = sourceFile.text
            text.contains('implements StorageProvider') || text.contains('implements VersionedStorageProvider')
        }.collect { delosdbStoragePhaseC12RelPath(it) }.sort()
        if (!storelessHits.isEmpty()) {
            errors << 'Storeless must remain a no-store constraint, not a storage provider: ' + storelessHits
        }
    }

    if (smokeSource.exists()) {
        errors.addAll(delosdbStoragePhaseC12ForbiddenSourceHits([smokeSource], [
                'DriverManager',
                'Connection',
                'Statement',
                'Pattern.compile',
                'Matcher'
        ]))
    }

    def engineStoreSourceRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
    if (engineStoreSourceRoot.exists()) {
        errors << 'Phase C12 must not add engine-side org/apache/derby/impl/store sources: '
                + delosdbStoragePhaseC12RelPath(engineStoreSourceRoot)
    }

    def thirdIslandNames = [
            'DelosStorageEngine.java',
            'DelosMutationAccess.java',
            'TableAccessProfile.java',
            'StorageExecutionProfile.java',
            'StorelessStorageProvider.java',
            'StorelessVersionedStorageProvider.java'
    ] as Set
    def thirdIslandFiles = fileTree(rootProject.projectDir).matching {
        include '**/*.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
        exclude '**/.idea/**'
        exclude '**/__MACOSX/**'
    }.files.findAll { thirdIslandNames.contains(it.name) }
            .collect { delosdbStoragePhaseC12RelPath(it) }.sort()
    if (!thirdIslandFiles.isEmpty()) {
        errors << 'Phase C12 must not introduce a third SPI/profile island while closing read delegation: '
                + thirdIslandFiles
    }

    def allEngineVersionedFiles = delosdbStoragePhaseC12JavaFiles('delosdb-engine').findAll { sourceFile ->
        delosdbStoragePhaseC12RelPath(sourceFile).contains('/versioned/')
    }
    def sqlRegexOwners = allEngineVersionedFiles.findAll { sourceFile ->
        sourceFile.name != 'VersionedStorageSqlBridge.java' && sourceFile.text.contains('Pattern.compile(')
    }.collect { delosdbStoragePhaseC12RelPath(it) }.sort()
    if (!sqlRegexOwners.isEmpty()) {
        errors << 'C12 read delegation closeout must not add SQL regex owners outside VersionedStorageSqlBridge: '
                + sqlRegexOwners
    }

    lines << 'DelosDB Storage Phase C12 Read Delegation Closeout'
    lines << '=================================================='
    lines << ''
    lines << 'C12 mechanic:'
    lines << '  keep the temporary SQL regex router, but move remaining read-side table scan/stats operations through VersionedStorageExecutionBridge.'
    lines << ''
    lines << 'Preserved behavior:'
    lines << '  SQL bridge still owns temporary regex statement routing.'
    lines << '  SELECT WHERE, SELECT range, and SELECT COUNT behavior are preserved by the smoke.'
    lines << '  Derby heap execution remains untouched.'
    lines << ''
    lines << 'Boundary checked:'
    lines << '  old direct calls removed: table.table().openScan(...) and table.table().stats(...)'
    lines << '  planned calls used: PLANNED_TABLE_OPERATION_BRIDGE.scanAll(...) and stats(...)'
    lines << ''
    lines << 'Not done in C12:'
    lines << '  SELECT regex routing is intentionally not removed yet; that belongs to a later routing-retirement slice.'
    lines << ''
    lines << 'Proof smoke:'
    lines << '  dev/storage-phase-c12-read-delegation-closeout-smoke/src/main/java/delosdb/smoke/StoragePhaseC12ReadDelegationCloseoutSmoke.java'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC12ReadDelegationCloseoutReport') {
    group = 'verification'
    description = 'Writes the Phase C12 read delegation closeout report.'
    dependsOn 'verifyStoragePhaseC11UpdateDelegation'
    outputs.file(delosdbStoragePhaseC12ReportFile)
    doLast {
        def result = delosdbStoragePhaseC12Proof()
        def outputFile = delosdbStoragePhaseC12ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C12 read delegation closeout failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC12ReadDelegationCloseoutSmoke', JavaCompile) {
    dependsOn 'jars', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C12 read delegation closeout smoke test.'
    source = files('dev/storage-phase-c12-read-delegation-closeout-smoke/src/main/java')
    destinationDirectory = delosdbStoragePhaseC12SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC12Classpath()
}

tasks.register('storagePhaseC12ReadDelegationCloseoutSmoke', JavaExec) {
    dependsOn 'compileStoragePhaseC12ReadDelegationCloseoutSmoke'
    group = 'verification'
    description = 'Runs the Phase C12 read delegation closeout smoke test.'
    classpath = delosdbStoragePhaseC12Classpath()
    mainClass = 'delosdb.smoke.StoragePhaseC12ReadDelegationCloseoutSmoke'
}

tasks.register('verifyStoragePhaseC12ReadDelegationCloseout') {
    group = 'verification'
    description = 'Verifies the Phase C12 read delegation closeout.'
    dependsOn 'storagePhaseC12ReadDelegationCloseoutReport', 'storagePhaseC12ReadDelegationCloseoutSmoke'
    doLast {
        println 'Verified Phase C12 read delegation closeout; next step should decide one routing-retirement proof, not remove the whole SQL bridge'
    }
}
