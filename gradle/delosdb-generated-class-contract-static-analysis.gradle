// DelosDB generated-class contract and final backend-removal static gates.
//
// The inherited compiler-facing contract remains frozen after ClassFileJava
// becomes the sole backend. Checked exceptions are part of that contract.

import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.HexFormat
import java.util.regex.Pattern

final File delosContractRepositoryRoot = rootProject.projectDir
final File delosContractBuildRoot = rootProject.layout.buildDirectory.get().asFile
final String delosExpectedContractDigest =
        '13871aded0743d1c5da22687d8e05a525bb115649397708d487c44261fc57cc6'

final Map<String, String> delosContractTypeNames = [
        'String': 'java.lang.String',
        'Object': 'java.lang.Object',
        'ClassFactory': 'org.apache.derby.iapi.services.loader.ClassFactory',
        'ClassBuilder': 'org.apache.derby.iapi.services.compiler.ClassBuilder',
        'MethodBuilder': 'org.apache.derby.iapi.services.compiler.MethodBuilder',
        'LocalField': 'org.apache.derby.iapi.services.compiler.LocalField',
        'GeneratedClass': 'org.apache.derby.iapi.services.loader.GeneratedClass',
        'ByteArray': 'org.apache.derby.iapi.util.ByteArray',
        'StandardException': 'org.apache.derby.shared.common.error.StandardException'
]

final Map<String, File> delosContractInterfaces = [
        'JavaFactory': new File(delosContractRepositoryRoot,
                'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/compiler/JavaFactory.java'),
        'ClassBuilder': new File(delosContractRepositoryRoot,
                'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/compiler/ClassBuilder.java'),
        'MethodBuilder': new File(delosContractRepositoryRoot,
                'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/compiler/MethodBuilder.java'),
        'LocalField': new File(delosContractRepositoryRoot,
                'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/compiler/LocalField.java')
]

final Closure<String> delosCanonicalContractType = { String raw ->
    String type = raw.trim().replaceAll('\\s+', ' ')
    int dimensions = 0
    while (type.endsWith('[]')) {
        dimensions++
        type = type.substring(0, type.length() - 2)
    }
    String canonical = delosContractTypeNames.getOrDefault(type, type)
    canonical + ('[]' * dimensions)
}

final Closure<List<Map<String, Object>>> delosParseContractMethods = { File file ->
    String source = file.getText('UTF-8')
            .replaceAll('(?s)/\\*.*?\\*/', '')
            .replaceAll('(?m)//.*$', '')
    Pattern declaration = Pattern.compile([
            '(?m)^\\s*(?:public\\s+)?',
            '([A-Za-z0-9_<>?,.\\[\\] ]+)\\s+',
            '([A-Za-z0-9_]+)\\s*',
            '\\(([^;{}]*)\\)\\s*',
            '(?:throws\\s+([^;{}]+))?\\s*;'
    ].join(''))
    def matcher = declaration.matcher(source)
    List<Map<String, Object>> methods = []
    while (matcher.find()) {
        String arguments = matcher.group(3)
        List<String> parameterTypes = []
        if (arguments != null && !arguments.trim().isEmpty()) {
            arguments.split(',').each { String argument ->
                List<String> tokens = argument.trim()
                        .replaceAll('\\s+', ' ')
                        .split(' ') as List<String>
                String sourceType = tokens.size() > 1
                        ? tokens[0..-2].join(' ')
                        : tokens[0]
                parameterTypes.add(delosCanonicalContractType(sourceType))
            }
        }
        List<String> exceptions = []
        String declaredThrows = matcher.group(4)
        if (declaredThrows != null && !declaredThrows.trim().isEmpty()) {
            declaredThrows.split(',').each { String exception ->
                exceptions.add(delosCanonicalContractType(exception))
            }
            exceptions.sort()
        }
        String signature = [
                delosCanonicalContractType(matcher.group(1)),
                ' ',
                matcher.group(2),
                '(',
                parameterTypes.join(','),
                ')'
        ].join('')
        if (!exceptions.isEmpty()) {
            signature += ' throws ' + exceptions.join(',')
        }
        methods.add([
                name: matcher.group(2),
                signature: signature,
                exceptions: exceptions
        ])
    }
    methods.sort { left, right ->
        left.signature.toString() <=> right.signature.toString()
    }
}

final Closure<Map<String, List<Map<String, Object>>>> delosContractSnapshot = {
    Map<String, List<Map<String, Object>>> snapshot = [:]
    delosContractInterfaces.each { String owner, File file ->
        snapshot[owner] = file.isFile()
                ? delosParseContractMethods(file)
                : []
    }
    snapshot
}

final Closure<String> delosContractCanonicalText = {
        Map<String, List<Map<String, Object>>> snapshot ->
    List<String> lines = []
    snapshot.each { String owner, List<Map<String, Object>> methods ->
        methods.each { Map<String, Object> method ->
            lines.add(owner + ':' + method.signature)
        }
    }
    lines.sort()
    lines.join('\n') + '\n'
}

final Closure<String> delosContractSha256 = { String value ->
    HexFormat.of().formatHex(
            MessageDigest.getInstance('SHA-256')
                    .digest(value.getBytes(StandardCharsets.UTF_8)))
}

final Closure<List<Map<String, String>>> delosMethodBuilderInventoryRows = {
    File inventory = new File(delosContractRepositoryRoot,
            'gradle/static-analysis/delosdb-methodbuilder-operation-inventory.txt')
    if (!inventory.isFile()) {
        return []
    }
    inventory.readLines('UTF-8')
            .findAll { String line ->
                !line.trim().isEmpty() && !line.startsWith('#')
            }
            .collect { String line ->
                def parts = line.split('\\|', -1)
                if (parts.length != 5) {
                    throw new GradleException(
                            'Invalid MethodBuilder inventory row: ' + line)
                }
                [id: parts[0], category: parts[1], signature: parts[2],
                 operation: parts[3], reason: parts[4]]
            }
}

final Closure<List<Map<String, String>>> delosMethodBuilderBehaviorRows = {
    File manifest = new File(delosContractRepositoryRoot,
            'gradle/static-analysis/delosdb-methodbuilder-behavior-fixtures.txt')
    if (!manifest.isFile()) {
        return []
    }
    manifest.readLines('UTF-8')
            .findAll { String line ->
                !line.trim().isEmpty() && !line.startsWith('#')
            }
            .collect { String line ->
                def parts = line.split('\\|', -1)
                if (parts.length != 5) {
                    throw new GradleException(
                            'Invalid MethodBuilder behavior row: ' + line)
                }
                [id: parts[0], signature: parts[1], fixture: parts[2],
                 proof: parts[3], reason: parts[4]]
            }
}

tasks.register('delosGeneratedClassContractInventory') {
    group = 'verification'
    description = 'Reports the complete generated-class contract and mapped Class-File API behavior fixtures.'
    dependsOn tasks.named('delosGeneratedClassModernizationStaticAnalysis')

    File reportFile = new File(delosContractBuildRoot,
            'reports/delosdb/compiler/generated-class-contract-inventory.txt')
    outputs.file(reportFile)
    outputs.upToDateWhen { false }

    doLast {
        Map<String, List<Map<String, Object>>> snapshot = delosContractSnapshot()
        List<Map<String, String>> operationRows = delosMethodBuilderInventoryRows()
        List<Map<String, String>> behaviorRows = delosMethodBuilderBehaviorRows()
        int totalMethods = snapshot.values().sum { List<?> methods -> methods.size() } as int
        int exceptionMethods = snapshot.values().sum { List<Map<String, Object>> methods ->
            methods.count { Map<String, Object> method ->
                !((List<?>) method.exceptions).isEmpty()
            }
        } as int
        int operationNames = operationRows.collect { it.operation }.toSet().size()
        String digest = delosContractSha256(delosContractCanonicalText(snapshot))

        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB generated-class contract inventory')
            writer.println('==========================================')
            writer.println('Phase: COMPILER_PHASE_6_ASM_REMOVAL')
            writer.println('Production authority: CLASSFILE_PRODUCTION_SOLE_BACKEND')
            writer.println('Normal runtime backend selector: none')
            writer.println()
            snapshot.each { String owner, List<Map<String, Object>> methods ->
                writer.println(owner + ' methods: ' + methods.size())
                methods.each { Map<String, Object> method ->
                    writer.println('- ' + method.signature)
                }
            }
            writer.println()
            writer.println('Total declared methods: ' + totalMethods)
            writer.println('Methods declaring checked exceptions: ' + exceptionMethods)
            writer.println('MethodBuilder inventory rows: ' + operationRows.size())
            writer.println(String.format(
                    'MethodBuilder operation names: %d', operationNames))
            writer.println('MethodBuilder behavior rows: ' + behaviorRows.size())
            writer.println('Behavior fixture groups: '
                    + behaviorRows.collect { it.fixture }.toSet().size())
            writer.println('Contract SHA-256: ' + digest)
        }
        logger.lifecycle(
                'Generated-class contract inventory written: {}', reportFile)
    }
}

tasks.register('delosGeneratedClassContractStaticAnalysis') {
    group = 'verification'
    description = 'Validates the frozen generated-class signature and Class-File API behavior contract.'
    dependsOn tasks.named('delosGeneratedClassContractInventory')

    doLast {
        List<String> failures = []
        delosContractInterfaces.each { String owner, File file ->
            if (!file.isFile()) {
                failures.add(String.format(
                        'Missing generated-class contract source: %s -> %s',
                        owner, file))
            }
        }

        Map<String, List<Map<String, Object>>> snapshot = delosContractSnapshot()
        Map<String, Integer> expectedCounts = [
                'JavaFactory': 1,
                'ClassBuilder': 8,
                'MethodBuilder': 43,
                'LocalField': 0
        ]
        expectedCounts.each { String owner, Integer expected ->
            int actual = snapshot.getOrDefault(owner, []).size()
            if (actual != expected) {
                failures.add(String.format(
                        '%s contract method count changed: expected %d, found %d',
                        owner, expected, actual))
            }
        }

        int totalMethods = snapshot.values().sum { List<?> methods -> methods.size() } as int
        if (totalMethods != 52) {
            failures.add(String.format(
                    'Complete generation contract must contain 52 methods; found %d',
                    totalMethods))
        }

        List<String> classBuilderSignatures = snapshot
                .getOrDefault('ClassBuilder', [])
                .collect { it.signature.toString() }
        [
            'org.apache.derby.iapi.services.loader.GeneratedClass getGeneratedClass() throws org.apache.derby.shared.common.error.StandardException',
            'org.apache.derby.iapi.util.ByteArray getClassBytecode() throws org.apache.derby.shared.common.error.StandardException'
        ].each { String required ->
            if (!classBuilderSignatures.contains(required)) {
                failures.add('ClassBuilder contract is missing: ' + required)
            }
        }
        int exceptionMethods = snapshot.values().sum { List<Map<String, Object>> methods ->
            methods.count { Map<String, Object> method ->
                !((List<?>) method.exceptions).isEmpty()
            }
        } as int
        if (exceptionMethods != 2) {
            failures.add(String.format(
                    'Generation contract must retain two checked-exception methods; found %d',
                    exceptionMethods))
        }

        String canonical = delosContractCanonicalText(snapshot)
        String digest = delosContractSha256(canonical)
        if (digest != delosExpectedContractDigest) {
            failures.add(String.format(
                    'Generated-class contract digest changed: expected %s, found %s',
                    delosExpectedContractDigest, digest))
        }

        List<Map<String, String>> operationRows = delosMethodBuilderInventoryRows()
        if (operationRows.size() != 43) {
            failures.add(String.format(
                    'MethodBuilder operation inventory must contain 43 signatures; found %d',
                    operationRows.size()))
        }
        if (operationRows.collect { it.id }.toSet().size() != operationRows.size()) {
            failures.add('MethodBuilder operation inventory contains duplicate ids')
        }
        int operationNames = operationRows.collect { it.operation }.toSet().size()
        if (operationNames != 32) {
            failures.add(String.format(
                    'MethodBuilder operation inventory must contain 32 operation names; found %d',
                    operationNames))
        }
        operationRows.each { Map<String, String> row ->
            if (row.reason.length() < 90) {
                failures.add('MethodBuilder inventory reason is too thin: ' + row.id)
            }
        }

        List<Map<String, String>> behaviorRows = delosMethodBuilderBehaviorRows()
        if (behaviorRows.size() != 43) {
            failures.add(String.format(
                    'MethodBuilder behavior manifest must contain 43 signatures; found %d',
                    behaviorRows.size()))
        }
        if (behaviorRows.collect { it.id }.toSet().size() != behaviorRows.size()) {
            failures.add('MethodBuilder behavior manifest contains duplicate ids')
        }
        if (behaviorRows.collect { it.signature }.toSet().size()
                != behaviorRows.size()) {
            failures.add('MethodBuilder behavior manifest contains duplicate signatures')
        }
        Set<String> inventorySignatures = operationRows
                .collect { it.signature }.toSet()
        Set<String> behaviorSignatures = behaviorRows
                .collect { it.signature }.toSet()
        if (behaviorSignatures != inventorySignatures) {
            Set<String> missing = inventorySignatures - behaviorSignatures
            Set<String> extra = behaviorSignatures - inventorySignatures
            failures.add('MethodBuilder behavior signatures do not match the contract inventory; missing='
                    + missing.sort() + ' extra=' + extra.sort())
        }
        Set<String> expectedFixtures = [
                'method-lifecycle',
                'parameter-constants',
                'field-access',
                'object-and-array',
                'receiver-and-conversion',
                'stack-and-statement',
                'control-flow',
                'invocation',
                'constructor',
                'statement-splitting'
        ] as Set
        Set<String> behaviorFixtures = behaviorRows
                .collect { it.fixture }.toSet()
        if (behaviorFixtures != expectedFixtures) {
            failures.add('MethodBuilder behavior fixture groups changed: expected '
                    + expectedFixtures.sort() + ', found ' + behaviorFixtures.sort())
        }
        behaviorRows.each { Map<String, String> row ->
            if (row.proof.trim().isEmpty()) {
                failures.add('MethodBuilder behavior proof marker is empty: ' + row.id)
            }
            if (row.reason.length() < 90) {
                failures.add('MethodBuilder behavior reason is too thin: ' + row.id)
            }
        }

        File behaviorTest = new File(delosContractRepositoryRoot,
                'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/GeneratedClassContractBehaviorTest.java')
        String behaviorText = behaviorTest.isFile()
                ? behaviorTest.getText('UTF-8')
                : ''
        behaviorRows.collect { it.proof }.toSet().each { String marker ->
            if (!behaviorText.contains(marker)) {
                failures.add('Generated-class behavior test is missing proof marker: '
                        + marker)
            }
        }
        [
            'COMPILER_PHASE_6_ASM_REMOVAL',
            'assertEquals("complete MethodBuilder signature mapping"',
            'Arrays.equals(first.classBytes(), second.classBytes())',
            'manifest.fixtures(), executedFixtures',
            'ClassCastException',
            'statementNumHitLimit(0)',
            'classBuilder.getGeneratedClass()',
            'CLASSFILE_PRODUCTION_SOLE_BACKEND',
            'Normal runtime backend selector: none'
        ].each { String marker ->
            if (!behaviorText.contains(marker)) {
                failures.add('Generated-class behavior oracle is missing: ' + marker)
            }
        }

        File freezeTest = new File(delosContractRepositoryRoot,
                'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/GeneratedClassContractFreezeTest.java')
        String freezeText = freezeTest.isFile()
                ? freezeTest.getText('UTF-8')
                : ''
        [
            delosExpectedContractDigest,
            'assertEquals(8, CLASS_BUILDER.size())',
            'assertEquals(52, totalMethodCount())',
            'assertEquals(2, declaredExceptionMethodCount())',
            'method.getExceptionTypes()',
            'getGeneratedClass() throws org.apache.derby.shared.common.error.StandardException',
            'getClassBytecode() throws org.apache.derby.shared.common.error.StandardException',
            'org.apache.derby.impl.services.bytecode.classfile.ClassFileJava'
        ].each { String marker ->
            if (!freezeText.contains(marker)) {
                failures.add('Generated-class contract test is missing: ' + marker)
            }
        }

        File testBuild = new File(delosContractRepositoryRoot,
                'delosdb-tests/build.gradle')
        String testBuildText = testBuild.isFile()
                ? testBuild.getText('UTF-8')
                : ''
        [
            'runDelosGeneratedClassContractFreezeTest',
            'generated-class-contract-freeze.txt',
            'runDelosGeneratedClassContractBehaviorTest',
            'generated-class-contract-behavior.txt',
            'delosdb-methodbuilder-behavior-fixtures.txt',
            "dependsOn tasks.named('runDelosGeneratedClassContractBehaviorTest')",
            'runDelosGeneratedClassClassFileProductionTest',
            'runDelosGeneratedClassClassFileProductionAcceptance'
        ].each { String marker ->
            if (!testBuildText.contains(marker)) {
                failures.add('Generated-class contract test wiring is missing: ' + marker)
            }
        }

        File design = new File(delosContractRepositoryRoot,
                'docs/design/V1-JDK25-CLASSFILE-GENERATION-MODERNIZATION.md')
        String designText = design.isFile() ? design.getText('UTF-8') : ''
        [
            'Compiler Phase 2.1 status: VERIFIED',
            'Compiler Phase 2.2 status: VERIFIED',
            'Compiler Phase 6 status: IMPLEMENTED / PENDING VERIFICATION',
            'Every MethodBuilder signature'
        ].each { String marker ->
            if (!designText.contains(marker)) {
                failures.add('Compiler modernization design is missing: ' + marker)
            }
        }

        File reportFile = new File(delosContractBuildRoot,
                'reports/delosdb/compiler/generated-class-contract-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB generated-class contract static analysis')
            writer.println('================================================')
            writer.println(String.format(
                    'JavaFactory methods: %d',
                    snapshot.getOrDefault('JavaFactory', []).size()))
            writer.println(String.format(
                    'ClassBuilder methods: %d',
                    snapshot.getOrDefault('ClassBuilder', []).size()))
            writer.println(String.format(
                    'MethodBuilder methods: %d',
                    snapshot.getOrDefault('MethodBuilder', []).size()))
            writer.println(String.format(
                    'LocalField methods: %d',
                    snapshot.getOrDefault('LocalField', []).size()))
            writer.println('Total declared methods: ' + totalMethods)
            writer.println('Methods declaring checked exceptions: ' + exceptionMethods)
            writer.println('Contract SHA-256: ' + digest)
            writer.println('MethodBuilder inventory rows: ' + operationRows.size())
            writer.println('MethodBuilder operation names: ' + operationNames)
            writer.println('MethodBuilder behavior rows: ' + behaviorRows.size())
            writer.println('Behavior fixture groups: ' + behaviorFixtures.size())
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { String failure -> writer.println('- ' + failure) }
        }
        if (!failures.isEmpty()) {
            logger.error('Generated-class contract failures ({}):', failures.size())
            failures.each { String failure -> logger.error('  - {}', failure) }
            throw new GradleException(String.format(
                    'Generated-class contract static analysis failed. Report: %s',
                    reportFile))
        }
        logger.lifecycle(
                'Generated-class contract static analysis passed. Report: {}',
                reportFile)
    }
}


// Compiler Phase 6 permanent external-ASM removal gate.
tasks.register('delosGeneratedClassClassFileAsmRemovalStaticAnalysis') {
    group = 'verification'
    description = 'Validates the sole Class-File API production backend, retired ASM infrastructure, and final acceptance wiring.'
    dependsOn tasks.named('delosGeneratedClassContractStaticAnalysis')

    doLast {
        List<String> failures = []
        File manifest = new File(delosContractRepositoryRoot,
                'gradle/static-analysis/delosdb-classfile-asm-removal.txt')
        List<Map<String, String>> rows = []
        if (!manifest.isFile()) {
            failures.add('Missing Compiler Phase 6 manifest: ' + manifest)
        } else {
            manifest.readLines('UTF-8')
                    .findAll { line -> line.trim() && !line.startsWith('#') }
                    .each { line ->
                        def parts = line.split('\\|', -1)
                        if (parts.length != 5) {
                            failures.add('Invalid Compiler Phase 6 manifest row: ' + line)
                        } else {
                            rows.add([id: parts[0], category: parts[1], path: parts[2],
                                      marker: parts[3], reason: parts[4]])
                        }
                    }
        }
        if (rows.size() < 16) {
            failures.add('Compiler Phase 6 manifest must contain at least 16 rows; found ' + rows.size())
        }
        if (rows.collect { it.id }.toSet().size() != rows.size()) {
            failures.add('Compiler Phase 6 manifest contains duplicate ids')
        }
        rows.each { row ->
            File proof = new File(delosContractRepositoryRoot, row.path)
            if (!proof.isFile()) {
                failures.add('Compiler Phase 6 proof path is missing for ' + row.id + ': ' + row.path)
            } else if (!proof.getText('UTF-8').contains(row.marker)) {
                failures.add('Compiler Phase 6 proof marker is missing for ' + row.id + ': ' + row.marker)
            }
            if (row.reason.length() < 90) {
                failures.add('Compiler Phase 6 reason is too thin for ' + row.id)
            }
        }
        Set<String> categories = rows.collect { it.category }.toSet()
        ['SOLE_BACKEND', 'SOURCE_REMOVAL', 'DEPENDENCY_REMOVAL',
         'MODULE_REMOVAL', 'RUNTIME_MODEL', 'CONTRACT_PROOF',
         'SQL_PROOF', 'LANGUAGE_SUITE', 'JDBC_DRDA', 'MODULAR_IMAGE',
         'SQLANCER', 'STATIC_GATE', 'STATUS'].each { category ->
            if (!categories.contains(category)) {
                failures.add('Compiler Phase 6 manifest is missing category: ' + category)
            }
        }

        List<String> retiredFiles = [
            'delosdb-engine/src/main/java/org/apache/derby/impl/services/bytecode/asm/AsmJava.java',
            'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/GeneratedClassAsmBaselineTest.java',
            'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/GeneratedClassClassFileVerticalSliceTest.java',
            'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/GeneratedClassClassFileCompleteDifferentialTest.java',
            'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/GeneratedClassClassFileAuthorityCandidateTest.java',
            'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/GeneratedClassClassFileAuthoritySwitchTest.java'
        ]
        retiredFiles.each { relative ->
            if (new File(delosContractRepositoryRoot, relative).exists()) {
                failures.add('Retired Compiler Phase 6 file remains: ' + relative)
            }
        }

        File classFileBackend = new File(delosContractRepositoryRoot,
                'delosdb-engine/src/main/java/org/apache/derby/impl/services/bytecode/classfile/ClassFileJava.java')
        String backendText = classFileBackend.isFile()
                ? classFileBackend.getText('UTF-8') : ''
        ['COMPILER_PHASE_6_ASM_REMOVAL', 'CLASSFILE_PRODUCTION_SOLE_BACKEND',
         'replaceTopType(className);', 'String ownerType = fieldOwnerType('].each { marker ->
            if (!backendText.contains(marker)) {
                failures.add('Final Class-File API backend is missing: ' + marker)
            }
        }

        File behaviorTest = new File(delosContractRepositoryRoot,
                'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/GeneratedClassContractBehaviorTest.java')
        String behaviorText = behaviorTest.isFile() ? behaviorTest.getText('UTF-8') : ''
        ['testClassFileContractBehavior',
         'org.apache.derby.impl.services.bytecode.classfile.ClassFileJava',
         'CLASSFILE_PRODUCTION_SOLE_BACKEND',
         'assertEquals("complete MethodBuilder signature mapping"',
         'shortConstant.upCast("int")'].each { marker ->
            if (!behaviorText.contains(marker)) {
                failures.add('Final Class-File API behavior proof is missing: ' + marker)
            }
        }

        File productionTest = new File(delosContractRepositoryRoot,
                'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/GeneratedClassClassFileProductionTest.java')
        String productionText = productionTest.isFile() ? productionTest.getText('UTF-8') : ''
        ['COMPILER_PHASE_6_ASM_REMOVAL',
         'MODULES_PROPERTIES_SOLE_BACKEND',
         'assertNull("production proof must not use a backend override"',
         'External ASM status: REMOVED',
         'row.next();',
         'assertEquals("22012", expected.getSQLState())'].each { marker ->
            if (!productionText.contains(marker)) {
                failures.add('Final production SQL proof is missing: ' + marker)
            }
        }

        File testBuild = new File(delosContractRepositoryRoot, 'delosdb-tests/build.gradle')
        String testBuildText = testBuild.isFile() ? testBuild.getText('UTF-8') : ''
        ['runDelosGeneratedClassContractFreezeTest',
         'runDelosGeneratedClassContractBehaviorTest',
         'runDelosGeneratedClassClassFileProductionTest',
         'runDelosGeneratedClassClassFileProductionJdbcDrdaTest',
         'runDelosGeneratedClassClassFileProductionAcceptance',
         'runDerbyLangSuite',
         'runDelosV1ModularImageDrdaTest'].each { marker ->
            if (!testBuildText.contains(marker)) {
                failures.add('Final production acceptance wiring is missing: ' + marker)
            }
        }
        ['runDelosGeneratedClassAsmBaselineTest',
         'runDelosGeneratedClassAsmOracleProof',
         'runDerbyLangSuiteClassFileCandidate',
         'runDelosGeneratedClassClassFileAuthorityCandidateBuiltInAcceptance',
         'runDelosGeneratedClassClassFileAuthoritySwitchBuiltInAcceptance'].each { retired ->
            if (testBuildText.contains(retired)) {
                failures.add('Retired generated-class task remains: ' + retired)
            }
        }

        File modularTest = new File(delosContractRepositoryRoot,
                'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/V1ModularImageDrdaTest.java')
        String modularText = modularTest.isFile() ? modularTest.getText('UTF-8') : ''
        if (!modularText.contains('java compiler backend: modules.properties')) {
            failures.add('Modular-image proof does not report modules.properties as the fixed backend source')
        }
        if (modularText.contains('derby.module.javaCompiler=')) {
            failures.add('Modular-image proof still injects a compiler backend')
        }

        File rootBuild = new File(delosContractRepositoryRoot, 'build.gradle')
        String rootBuildText = rootBuild.isFile() ? rootBuild.getText('UTF-8') : ''
        ['delosGeneratedClassClassFileProductionSqlancerValidation',
         "dependsOn 'delosGeneratedClassClassFileAsmRemovalStaticAnalysis'"].each { marker ->
            if (!rootBuildText.contains(marker)) {
                failures.add('Final root compiler wiring is missing: ' + marker)
            }
        }
        if (rootBuildText.contains('delosGeneratedClassClassFileAuthorityCandidateSqlancerValidation')) {
            failures.add('Retired candidate SQLancer task remains')
        }

        File reportFile = new File(delosContractBuildRoot,
                'reports/delosdb/compiler/generated-class-classfile-asm-removal-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB Class-File API external ASM removal static analysis')
            writer.println('==========================================================')
            writer.println('Phase: COMPILER_PHASE_6_ASM_REMOVAL')
            writer.println('Manifest rows: ' + rows.size())
            writer.println('Production backend: ClassFileJava')
            writer.println('External ASM source files: 0')
            writer.println('External ASM dependency/module edges: 0')
            writer.println('Retired oracle tasks: absent')
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) {
            logger.error('Class-File API ASM-removal failures ({}):', failures.size())
            failures.each { failure -> logger.error('  - {}', failure) }
            throw new GradleException(
                    'Class-File API ASM-removal static analysis failed. Report: ' + reportFile)
        }
        logger.lifecycle('Class-File API ASM-removal static analysis passed. Report: {}', reportFile)
    }
}
