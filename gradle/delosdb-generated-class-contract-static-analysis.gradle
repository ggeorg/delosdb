// Compiler Phase 4 complete JDK 25 Class-File API differential gate.
tasks.register('delosGeneratedClassClassFileCompleteDifferentialStaticAnalysis') {
    group = 'verification'
    description = 'Validates complete MethodBuilder differential coverage before any production authority switch.'
    dependsOn tasks.named('delosGeneratedClassClassFileVerticalSliceStaticAnalysis')

    doLast {
        List<String> failures = []
        File manifest = new File(delosContractRepositoryRoot,
                'gradle/static-analysis/delosdb-classfile-complete-differential.txt')
        File behaviorManifest = new File(delosContractRepositoryRoot,
                'gradle/static-analysis/delosdb-methodbuilder-behavior-fixtures.txt')
        File backend = new File(delosContractRepositoryRoot,
                'delosdb-engine/src/main/java/org/apache/derby/impl/services/bytecode/classfile/ClassFileJava.java')
        File behaviorTest = new File(delosContractRepositoryRoot,
                'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/GeneratedClassContractBehaviorTest.java')
        File differentialTest = new File(delosContractRepositoryRoot,
                'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/GeneratedClassClassFileCompleteDifferentialTest.java')
        File testBuild = new File(delosContractRepositoryRoot,
                'delosdb-tests/build.gradle')
        File rootBuild = new File(delosContractRepositoryRoot, 'build.gradle')
        File modules = new File(delosContractRepositoryRoot,
                'delosdb-engine/src/main/java/org/apache/derby/modules.properties')
        File design = new File(delosContractRepositoryRoot,
                'docs/design/V1-JDK25-CLASSFILE-GENERATION-MODERNIZATION.md')

        [manifest, behaviorManifest, backend, behaviorTest, differentialTest,
                testBuild, rootBuild, modules, design].each { File file ->
            if (!file.isFile()) {
                failures.add('Missing Compiler Phase 4 proof file: ' + file)
            }
        }

        List<Map<String, String>> rows = []
        if (manifest.isFile()) {
            manifest.readLines('UTF-8').eachWithIndex { String line, int index ->
                String trimmed = line.trim()
                if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                    return
                }
                List<String> parts = trimmed.split('\\|', -1) as List<String>
                if (parts.size() != 5) {
                    failures.add(String.format(
                            'Malformed complete differential row %d: %s',
                            index + 1, line))
                    return
                }
                rows.add([
                        id: parts[0],
                        fixture: parts[1],
                        backend: parts[2],
                        behavior: parts[3],
                        reason: parts[4]
                ])
            }
        }
        if (rows.size() != 10) {
            failures.add(String.format(
                    'Complete differential manifest must contain 10 rows; found %d',
                    rows.size()))
        }
        if (rows.collect { it.id }.toSet().size() != rows.size()) {
            failures.add('Complete differential manifest contains duplicate ids')
        }
        Set<String> expectedFixtures = [
                'method-lifecycle',
                'parameter-constants',
                'field-access',
                'object-and-array',
                'receiver-and-conversion',
                'stack-and-statement',
                'control-flow',
                'invocation',
                'constructor',
                'statement-splitting'
        ] as Set
        Set<String> actualFixtures = rows.collect { it.fixture }.toSet()
        if (actualFixtures != expectedFixtures) {
            failures.add('Complete differential fixtures changed: expected '
                    + expectedFixtures.sort() + ', found '
                    + actualFixtures.sort())
        }
        rows.each { Map<String, String> row ->
            if (row.reason.length() < 100) {
                failures.add('Complete differential reason is too thin: '
                        + row.id)
            }
        }

        List<String> behaviorSignatures = []
        Set<String> behaviorFixtures = [] as Set
        if (behaviorManifest.isFile()) {
            behaviorManifest.readLines('UTF-8').eachWithIndex {
                    String line, int index ->
                String trimmed = line.trim()
                if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                    return
                }
                List<String> parts = trimmed.split('\\|', -1) as List<String>
                if (parts.size() != 5) {
                    failures.add(String.format(
                            'Malformed MethodBuilder behavior row %d: %s',
                            index + 1, line))
                    return
                }
                behaviorSignatures.add(parts[1])
                behaviorFixtures.add(parts[2])
            }
        }
        if (behaviorSignatures.size() != 43
                || behaviorSignatures.toSet().size() != 43) {
            failures.add('Complete differential proof requires exactly 43 unique MethodBuilder signatures')
        }
        if (behaviorFixtures != expectedFixtures) {
            failures.add('Complete differential proof must reuse all ten frozen behavior fixtures')
        }

        String backendText = backend.isFile() ? backend.getText('UTF-8') : ''
        String behaviorText = behaviorTest.isFile()
                ? behaviorTest.getText('UTF-8') : ''
        String differentialText = differentialTest.isFile()
                ? differentialTest.getText('UTF-8') : ''
        rows.each { Map<String, String> row ->
            if (!backendText.contains(row.backend)) {
                failures.add('Complete Class-File API backend is missing marker '
                        + row.id + ': ' + row.backend)
            }
            if (!behaviorText.contains(row.behavior)) {
                failures.add('Shared behavior oracle is missing marker '
                        + row.id + ': ' + row.behavior)
            }
        }

        [
            'public final class ClassFileJava implements JavaFactory',
            'COMPILER_PHASE_5_1_AUTHORITY_CANDIDATE',
            'CLASSFILE_PRODUCTION_CANDIDATE_UNREGISTERED',
            'ExceptionsAttribute.ofSymbols(',
            'code.new_(classDesc(className))',
            'code.newarray(arrayTypeKind(className))',
            'code.anewarray(classDesc(className))',
            'code.arrayLoad(arrayTypeKind(elementType))',
            'code.arrayStore(arrayTypeKind(expectedType))',
            'code.dup2()',
            'STATEMENT_SPLIT_LIMIT = 128',
            'Incomplete object construction in generated method'
        ].each { String marker ->
            if (!backendText.contains(marker)) {
                failures.add('Complete Class-File API backend is missing: '
                        + marker)
            }
        }
        if (backendText.contains('phase4Unsupported(')
                || backendText.contains('Compiler Phase 4 must add Class-File API support for')) {
            failures.add('Complete Class-File API backend retains a Phase 3 unsupported-operation boundary')
        }
        [
            'generateFixture(',
            'assertFixtureBehavior(',
            'newClassFileFactory()',
            'newAsmFactory()',
            'ClassFile.of()',
            'verifier.verify(asmModel)',
            'verifier.verify(classFileModel)',
            'publicMethodContracts(asmClass)',
            'compareRepresentativeFailure(asmClass, classFileClass)',
            'EXPECTED_METHOD_BUILDER_SIGNATURES = 43',
            'EXPECTED_FIXTURE_GROUPS = 10',
            'EXPECTED_GENERATED_METHODS = 38',
            'Unsupported MethodBuilder operations: 0',
            'generation median allocated bytes',
            'Class-File API class-load median nanos',
            'Normal runtime backend selector: none'
        ].each { String marker ->
            if (!differentialText.contains(marker)) {
                failures.add('Complete differential test is missing: '
                        + marker)
            }
        }
        [
            'static Set<String> assertFixtureBehavior(',
            'static GeneratedFixture generateFixture(',
            'constructorFixture(',
            'statementSplittingFixture('
        ].each { String marker ->
            if (!behaviorText.contains(marker)) {
                failures.add('Shared complete behavior fixture is missing: '
                        + marker)
            }
        }

        File retiredTestBackend = new File(delosContractRepositoryRoot,
                'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/ClassFileJava.java')
        if (retiredTestBackend.exists()) {
            failures.add('The retired test-source ClassFileJava copy must be removed after promotion to the production candidate')
        }
        File engineProductionRoot = new File(delosContractRepositoryRoot,
                'delosdb-engine/src/main/java')
        List<File> classFileCandidates = []
        if (engineProductionRoot.isDirectory()) {
            engineProductionRoot.eachFileRecurse { File source ->
                if (source.name == 'ClassFileJava.java') {
                    classFileCandidates.add(source)
                }
            }
        }
        if (classFileCandidates.size() != 1
                || classFileCandidates[0].canonicalFile != backend.canonicalFile) {
            failures.add('Exactly one production ClassFileJava candidate must exist at the reviewed engine path')
        }

        String modulesText = modules.isFile() ? modules.getText('UTF-8') : ''
        if (!modulesText.contains(
                'org.apache.derby.impl.services.bytecode.asm.AsmJava')) {
            failures.add('ASM must remain the transitional production backend in Phase 4')
        }
        if (modulesText.contains(
                'org.apache.derby.impl.services.bytecode.classfile.ClassFileJava')) {
            failures.add('The Phase 5.1 Class-File API production candidate must remain unregistered in modules.properties')
        }

        String testBuildText = testBuild.isFile()
                ? testBuild.getText('UTF-8') : ''
        [
            'runDelosGeneratedClassClassFileCompleteDifferentialTest',
            'GeneratedClassClassFileCompleteDifferentialTest.class',
            'generated-class-classfile-complete-differential.txt',
            "dependsOn tasks.named(\n            'runDelosGeneratedClassClassFileCompleteDifferentialTest')"
        ].each { String marker ->
            if (!testBuildText.contains(marker)) {
                failures.add('Complete differential focused test wiring is missing: '
                        + marker)
            }
        }

        String rootBuildText = rootBuild.isFile()
                ? rootBuild.getText('UTF-8') : ''
        if (!rootBuildText.contains(
                "dependsOn 'delosGeneratedClassClassFileCompleteDifferentialStaticAnalysis'")) {
            failures.add('s0CloseoutVerification must include the Phase 4 complete differential gate')
        }

        String designText = design.isFile() ? design.getText('UTF-8') : ''
        String normalizedDesignText = designText.replaceAll('\\s+', ' ')
        [
            'Compiler Phase 3 status: VERIFIED',
            'Compiler Phase 4 status: VERIFIED',
            'Compiler Phase 5.1 status: IMPLEMENTED / PENDING VERIFICATION',
            'ASM remains the normal production authority through Phase 5.1',
            'Unsupported MethodBuilder operations: 0'
        ].each { String marker ->
            if (!normalizedDesignText.contains(marker)) {
                failures.add('Compiler modernization design is missing: '
                        + marker)
            }
        }

        File reportFile = new File(delosContractBuildRoot,
                'reports/delosdb/compiler/generated-class-classfile-complete-differential-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB complete JDK 25 Class-File API differential static analysis')
            writer.println('=================================================================')
            writer.println('MethodBuilder signatures: ' + behaviorSignatures.size())
            writer.println('Behavior fixture groups: ' + actualFixtures.size())
            writer.println('Unsupported MethodBuilder operations: 0')
            writer.println('Backend location: delosdb-engine production candidate')
            writer.println('Production authority: ASM_TRANSITIONAL')
            writer.println('Class-File API authority: PRODUCTION_CANDIDATE_UNREGISTERED')
            writer.println('Normal runtime backend selector: none')
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { String failure -> writer.println('- ' + failure) }
        }
        if (!failures.isEmpty()) {
            logger.error('Complete Class-File API differential failures ({}):',
                    failures.size())
            failures.each { String failure -> logger.error('  - {}', failure) }
            throw new GradleException(String.format(
                    'Complete Class-File API differential static analysis failed. Report: %s',
                    reportFile))
        }
        logger.lifecycle(
                'Complete JDK 25 Class-File API differential static analysis passed. Report: {}',
                reportFile)
    }
}

// Compiler Phase 5.1 production-candidate acceptance gate.
tasks.register('delosGeneratedClassClassFileAuthorityCandidateStaticAnalysis') {
    group = 'verification'
    description = 'Validates the production-packaged, unregistered Class-File API authority candidate and its acceptance campaign.'
    dependsOn tasks.named('delosGeneratedClassClassFileCompleteDifferentialStaticAnalysis')

    doLast {
        List<String> failures = []
        File backend = new File(delosContractRepositoryRoot,
                'delosdb-engine/src/main/java/org/apache/derby/impl/services/bytecode/classfile/ClassFileJava.java')
        File retiredTestBackend = new File(delosContractRepositoryRoot,
                'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/ClassFileJava.java')
        File candidateTest = new File(delosContractRepositoryRoot,
                'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/GeneratedClassClassFileAuthorityCandidateTest.java')
        File modularTest = new File(delosContractRepositoryRoot,
                'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/V1ModularImageDrdaTest.java')
        File manifest = new File(delosContractRepositoryRoot,
                'gradle/static-analysis/delosdb-classfile-authority-candidate.txt')
        File modules = new File(delosContractRepositoryRoot,
                'delosdb-engine/src/main/java/org/apache/derby/modules.properties')
        File testBuild = new File(delosContractRepositoryRoot,
                'delosdb-tests/build.gradle')
        File rootBuild = new File(delosContractRepositoryRoot, 'build.gradle')
        File design = new File(delosContractRepositoryRoot,
                'docs/design/V1-JDK25-CLASSFILE-GENERATION-MODERNIZATION.md')

        [backend, candidateTest, modularTest, manifest, modules, testBuild,
                rootBuild, design].each { File file ->
            if (!file.isFile()) {
                failures.add('Missing Compiler Phase 5.1 proof file: ' + file)
            }
        }
        if (retiredTestBackend.exists()) {
            failures.add('The retired test-source ClassFileJava copy still exists')
        }

        List<Map<String, String>> rows = []
        if (manifest.isFile()) {
            manifest.readLines('UTF-8').eachWithIndex { String line, int index ->
                String trimmed = line.trim()
                if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                    return
                }
                List<String> parts = trimmed.split('\\|', -1) as List<String>
                if (parts.size() != 5) {
                    failures.add(String.format(
                            'Malformed authority-candidate row %d: %s',
                            index + 1, line))
                    return
                }
                rows.add([id: parts[0], category: parts[1], file: parts[2],
                          marker: parts[3], reason: parts[4]])
            }
        }
        if (rows.size() != 12) {
            failures.add(String.format(
                    'Authority-candidate manifest must contain 12 rows; found %d',
                    rows.size()))
        }
        if (rows.collect { it.id }.toSet().size() != rows.size()) {
            failures.add('Authority-candidate manifest contains duplicate ids')
        }
        rows.each { Map<String, String> row ->
            File evidence = new File(delosContractRepositoryRoot, row.file)
            if (!evidence.isFile()) {
                failures.add('Authority-candidate evidence file is missing: '
                        + row.id + ' -> ' + row.file)
            } else if (!evidence.getText('UTF-8').contains(row.marker)) {
                failures.add('Authority-candidate evidence marker is missing: '
                        + row.id + ' -> ' + row.marker)
            }
            if (row.reason.length() < 100) {
                failures.add('Authority-candidate reason is too thin: ' + row.id)
            }
        }

        String backendText = backend.isFile() ? backend.getText('UTF-8') : ''
        [
            'public final class ClassFileJava implements JavaFactory',
            'COMPILER_PHASE_5_1_AUTHORITY_CANDIDATE',
            'CLASSFILE_PRODUCTION_CANDIDATE_UNREGISTERED',
            'ClassFile.of()',
            'ExceptionsAttribute.ofSymbols(',
            'STATEMENT_SPLIT_LIMIT = 128'
        ].each { String marker ->
            if (!backendText.contains(marker)) {
                failures.add('Production Class-File API candidate is missing: '
                        + marker)
            }
        }

        String modulesText = modules.isFile() ? modules.getText('UTF-8') : ''
        if (!modulesText.contains(
                'derby.module.javaCompiler=org.apache.derby.impl.services.bytecode.asm.AsmJava')) {
            failures.add('ASM must remain the normal production authority during Phase 5.1')
        }
        if (modulesText.contains(
                'derby.module.javaCompiler=org.apache.derby.impl.services.bytecode.classfile.ClassFileJava')) {
            failures.add('The Class-File API candidate must not be the normal production registration before Phase 5.2')
        }

        String candidateText = candidateTest.isFile()
                ? candidateTest.getText('UTF-8') : ''
        [
            'Monitor.findSystemModule(Module.JavaFactory)',
            'Prepared statement families:',
            'Wide projection columns:',
            'SQLState preservation: 22012',
            'FOCUSED_TEST_JVM_ONLY'
        ].each { String marker ->
            if (!candidateText.contains(marker)) {
                failures.add('Authority-candidate SQL proof is missing: '
                        + marker)
            }
        }

        String modularText = modularTest.isFile()
                ? modularTest.getText('UTF-8') : ''
        [
            'delosdb.v1Baseline.modularImage.javaCompilerBackend',
            '-Dderby.module.javaCompiler=',
            'javaCompilerBackend'
        ].each { String marker ->
            if (!modularText.contains(marker)) {
                failures.add('Modular candidate proof is missing: ' + marker)
            }
        }

        String testBuildText = testBuild.isFile()
                ? testBuild.getText('UTF-8') : ''
        [
            'runDelosGeneratedClassClassFileAuthorityCandidateTest',
            'runDelosGeneratedClassClassFileCandidateJdbcDrdaTest',
            'runDerbyLangSuiteClassFileCandidate',
            'runDelosV1ModularImageDrdaClassFileCandidateTest',
            'runDelosGeneratedClassClassFileAuthorityCandidateBuiltInAcceptance',
            "'derby.module.javaCompiler': delosClassFileAuthorityCandidateBackend"
        ].each { String marker ->
            if (!testBuildText.contains(marker)) {
                failures.add('Authority-candidate Gradle wiring is missing: '
                        + marker)
            }
        }

        String rootBuildText = rootBuild.isFile()
                ? rootBuild.getText('UTF-8') : ''
        if (!rootBuildText.contains(
                "dependsOn 'delosGeneratedClassClassFileAuthorityCandidateStaticAnalysis'")) {
            failures.add('s0CloseoutVerification must include the Phase 5.1 static gate')
        }
        if (!rootBuildText.contains(
                'delosGeneratedClassClassFileAuthorityCandidateSqlancerValidation')) {
            failures.add('The explicit Class-File API candidate SQLancer task is missing')
        }

        String designText = design.isFile() ? design.getText('UTF-8') : ''
        String normalizedDesign = designText.replaceAll('\\s+', ' ')
        [
            'Compiler Phase 4 status: VERIFIED',
            'Compiler Phase 5.1 status: IMPLEMENTED / PENDING VERIFICATION',
            'Compiler Phase 5.2 status: NOT STARTED — NEXT',
            'ASM remains the normal production authority through Phase 5.1',
            'production-packaged but unregistered Class-File API candidate'
        ].each { String marker ->
            if (!normalizedDesign.contains(marker)) {
                failures.add('Compiler modernization design is missing: '
                        + marker)
            }
        }

        File reportFile = new File(delosContractBuildRoot,
                'reports/delosdb/compiler/generated-class-classfile-authority-candidate-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB JDK 25 Class-File API authority-candidate static analysis')
            writer.println('================================================================')
            writer.println('Manifest rows: ' + rows.size())
            writer.println('Candidate location: delosdb-engine production source')
            writer.println('Normal production authority: ASM_TRANSITIONAL')
            writer.println('Candidate registration: UNREGISTERED')
            writer.println('Selection scope: FOCUSED_TEST_JVM_ONLY')
            writer.println('External SQLancer: EXPLICIT_REQUIRED_LANE')
            writer.println('Normal runtime backend selector: none')
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { String failure -> writer.println('- ' + failure) }
        }
        if (!failures.isEmpty()) {
            failures.each { String failure -> logger.error('  - {}', failure) }
            throw new GradleException(String.format(
                    'Class-File API authority-candidate static analysis failed. Report: %s',
                    reportFile))
        }
        logger.lifecycle(
                'JDK 25 Class-File API authority-candidate static analysis passed. Report: {}',
                reportFile)
    }
}
