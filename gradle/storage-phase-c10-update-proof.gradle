import org.gradle.api.tasks.compile.JavaCompile

// Phase C10 planned UPDATE proof.
//
// This is one direct operation smoke, not SQL bridge routing work. It proves
// that a planned/resolved table operation can update an MVCC row through
// VersionedStorageExecutionBridge, with commit/abort visibility checks, without
// adding a JDBC SQL-regex path and without touching Derby heap execution.

ext.delosdbStoragePhaseC10ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC10ReportFile =
        ext.delosdbStoragePhaseC10ReportDir.map { it.file('storage-phase-c10-update-proof.txt') }
ext.delosdbStoragePhaseC10SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c10-update-proof-smoke')

ext.delosdbStoragePhaseC10RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC10RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC10RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC10ForbiddenSourceHits = { Collection<File> sourceFiles, Collection<String> tokens ->
    sourceFiles.collectMany { sourceFile ->
        def text = sourceFile.text
        tokens.findAll { token -> text.contains(token) }.collect { token ->
            "${delosdbStoragePhaseC10RelPath(sourceFile)} contains forbidden token ${token}"
        }
    }.sort()
}

ext.delosdbStoragePhaseC10JavaFiles = { String projectPath ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [] as Set<File>
    }
    fileTree(sourceRoot).matching { include '**/*.java' }.files as Set<File>
}

ext.delosdbStoragePhaseC10ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC10RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC10Classpath = {
    files(
            delosdbStoragePhaseC10SmokeClassesDir,
            delosdbStoragePhaseC10ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC10ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC10ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC10RuntimeJars())
}

ext.delosdbStoragePhaseC10Proof = {
    def errors = []
    def lines = []

    def smokeSource = file('dev/storage-phase-c10-update-proof-smoke/src/main/java/delosdb/smoke/StoragePhaseC10UpdateProofSmoke.java')
    def executionBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/execution/VersionedStorageExecutionBridge.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def embedStatement = file('delosdb-engine/src/main/java/org/apache/derby/impl/jdbc/EmbedStatement.java')
    def heapProvider = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/LegacyDerbyHeapStorageProvider.java')
    def mvccProvider = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccStorageProvider.java')
    def storelessRoot = file('delosdb-storeless/src/main/java')

    delosdbStoragePhaseC10RequireTokens(errors, smokeSource, [
            'record PlannedUpdate',
            'VersionedStorageExecutionBridge',
            'VersionedStorageExecutionBridge.resolvedTableOperations()',
            'VersionedTableMetadata',
            'DelosMvccStorageProvider.PROVIDER_NAME',
            'lookupBridge.createTable(',
            'bridge.update(table, key',
            'executeAndCommit',
            'executeAndAbort',
            'planned committed update must expose the replacement value',
            'planned committed update must hide the old value',
            'planned aborted update must leave the old value visible',
            'planned aborted update must not expose the replacement value'
    ], 'Phase C10 planned update smoke')

    delosdbStoragePhaseC10RequireTokens(errors, executionBridge, [
            'public <K, V> void update(',
            'requireTable(table).update(requireKey(key), requireValue(value), requireTransaction(transaction));',
            'public <K, V> Optional<V> read(',
            'return requireTable(table).read(requireKey(key), requireView(view));'
    ], 'VersionedStorageExecutionBridge direct update contract')

    delosdbStoragePhaseC10RequireTokens(errors, sqlBridge, [
            'Minimal SQL/JDBC bridge for the experimental',
            'Attempts to execute a supported experimental MVCC SQL statement',
            'PLANNED_TABLE_OPERATION_BRIDGE.insert(',
            'PLANNED_TABLE_OPERATION_BRIDGE.scanAll('
    ], 'transitional VersionedStorageSqlBridge remains a routing bridge only')

    delosdbStoragePhaseC10RequireTokens(errors, embedStatement, [
            'VersionedStorageSqlBridge.tryExecute('
    ], 'current transitional EmbedStatement bridge hook')

    delosdbStoragePhaseC10RequireTokens(errors, heapProvider, [
            'implements StorageProvider',
            'StorageCapabilities'
    ], 'Derby heap provider remains metadata path')

    delosdbStoragePhaseC10RequireTokens(errors, mvccProvider, [
            'implements VersionedStorageProvider',
            'public VersionedTransactionCoordinator transactionCoordinator()',
            'public synchronized <K, V> VersionedTable<K, V> openTable('
    ], 'MVCC provider remains versioned operational path')

    if (!storelessRoot.exists()) {
        errors << 'missing storeless source root: delosdb-storeless/src/main/java'
    } else {
        def storelessProviderHits = fileTree(storelessRoot).matching { include '**/*.java' }.files.findAll { sourceFile ->
            def text = sourceFile.text
            text.contains('implements StorageProvider') || text.contains('implements VersionedStorageProvider')
        }.collect { delosdbStoragePhaseC10RelPath(it) }.sort()
        if (!storelessProviderHits.isEmpty()) {
            errors << 'storeless must remain a no-store negative proof, not a provider: ' + storelessProviderHits
        }
    }

    if (smokeSource.exists()) {
        errors.addAll(delosdbStoragePhaseC10ForbiddenSourceHits([smokeSource], [
                'java.sql.',
                'DriverManager',
                'Connection',
                'Statement',
                'ResultSet',
                'VersionedStorageSqlBridge',
                'Pattern.compile',
                'Matcher',
                'UPDATE ',
                'SELECT ',
                'INSERT INTO ',
                'CREATE TABLE '
        ]))
    }

    def engineStoreSourceRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
    if (engineStoreSourceRoot.exists()) {
        errors << 'Phase C10 must not add engine-side org/apache/derby/impl/store sources: '
                + delosdbStoragePhaseC10RelPath(engineStoreSourceRoot)
    }

    def thirdIslandNames = [
            'DelosStorageEngine.java',
            'DelosMutationAccess.java',
            'TableAccessProfile.java',
            'StorageExecutionProfile.java',
            'StorelessStorageProvider.java',
            'StorelessVersionedStorageProvider.java'
    ] as Set
    def thirdIslandFiles = fileTree(rootProject.projectDir).matching {
        include '**/*.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
        exclude '**/.idea/**'
        exclude '**/__MACOSX/**'
    }.files.findAll { thirdIslandNames.contains(it.name) }
            .collect { delosdbStoragePhaseC10RelPath(it) }.sort()
    if (!thirdIslandFiles.isEmpty()) {
        errors << 'Phase C10 must not introduce a third SPI/profile island before the UPDATE proof: '
                + thirdIslandFiles
    }

    def allEngineVersionedFiles = delosdbStoragePhaseC10JavaFiles('delosdb-engine').findAll { sourceFile ->
        delosdbStoragePhaseC10RelPath(sourceFile).contains('/versioned/')
    }
    def sqlRegexOwners = allEngineVersionedFiles.findAll { sourceFile ->
        sourceFile.name != 'VersionedStorageSqlBridge.java' && sourceFile.text.contains('Pattern.compile(')
    }.collect { delosdbStoragePhaseC10RelPath(it) }.sort()
    if (!sqlRegexOwners.isEmpty()) {
        errors << 'new MVCC update proof must not add SQL regex owners outside VersionedStorageSqlBridge: '
                + sqlRegexOwners
    }

    lines << 'DelosDB Storage Phase C10 Update Proof'
    lines << '====================================='
    lines << ''
    lines << 'C10 mechanic:'
    lines << '  a planned/resolved table operation can update an MVCC row through VersionedStorageExecutionBridge.'
    lines << ''
    lines << 'Mutation boundaries checked:'
    lines << '  commit:  committed update exposes the replacement value and hides the old value'
    lines << '  abort:   aborted update leaves the old value visible and hides the replacement value'
    lines << '  routing: no JDBC, SQL text, or SQL regex path is used by the proof smoke'
    lines << ''
    lines << 'Preserved boundaries:'
    lines << '  heap:        LegacyDerbyHeapStorageProvider remains the metadata/capability StorageProvider path'
    lines << '  mvcc:        DelosMvccStorageProvider remains the VersionedStorageProvider operational path'
    lines << '  storeless:   still a no-store negative proof, not a StorageProvider implementation'
    lines << '  SQL bridge:  unchanged; C10 proves direct UPDATE before any SQL UPDATE delegation'
    lines << ''
    lines << 'Proof smoke:'
    lines << '  dev/storage-phase-c10-update-proof-smoke/src/main/java/delosdb/smoke/StoragePhaseC10UpdateProofSmoke.java'
    lines << ''
    lines << 'Runtime behavior:'
    lines << '  unchanged for Derby heap; this is a dev smoke plus guard only.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC10UpdateProofReport') {
    group = 'verification'
    description = 'Writes the Phase C10 planned update proof report.'
    dependsOn 'verifyStoragePhaseC9DeleteDelegation'
    outputs.file(delosdbStoragePhaseC10ReportFile)
    doLast {
        def result = delosdbStoragePhaseC10Proof()
        def outputFile = delosdbStoragePhaseC10ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C10 update proof failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC10UpdateProofSmoke', JavaCompile) {
    dependsOn 'jars', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C10 direct planned-update smoke test.'
    source = files('dev/storage-phase-c10-update-proof-smoke/src/main/java')
    destinationDirectory = delosdbStoragePhaseC10SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC10Classpath()
}

tasks.register('storagePhaseC10UpdateProofSmoke', JavaExec) {
    dependsOn 'compileStoragePhaseC10UpdateProofSmoke'
    group = 'verification'
    description = 'Runs the Phase C10 direct planned-update smoke test without JDBC SQL-regex routing.'
    classpath = delosdbStoragePhaseC10Classpath()
    mainClass = 'delosdb.smoke.StoragePhaseC10UpdateProofSmoke'
}

tasks.register('verifyStoragePhaseC10UpdateProof') {
    group = 'verification'
    description = 'Verifies the Phase C10 first planned update proof.'
    dependsOn 'storagePhaseC10UpdateProofReport', 'storagePhaseC10UpdateProofSmoke'
    doLast {
        println 'Verified Phase C10 update proof; next step may delegate SQL UPDATE through the execution bridge, not remove regex routing yet'
    }
}
