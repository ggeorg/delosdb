tasks.register('derbyRuntimeSmoke') {
    group = 'verification'
    description = 'Runs Derby-compatible runtime/JDBC smoke checks only.'
    dependsOn 'smoke', 'smokeFromJars', 'sysinfoFromJars'
}

tasks.register('derbyTestSuite') {
    group = 'verification'
    description = 'Runs the original Derby lang JUnit suite through Gradle.'
    dependsOn ':delosdb-tests:runDerbyLangSuite'
}

tasks.named('check') {
    dependsOn 'derbyRuntimeSmoke'
}

tasks.register('fullVerification') {
    group = 'verification'
    description = 'Runs Derby-compatible runtime smokes and the original Derby lang JUnit suite.'
    dependsOn 'derbyRuntimeSmoke', 'derbyTestSuite'
}

tasks.register('test') {
    group = 'verification'
    description = 'Alias for the Derby-focused verification suite.'
    dependsOn 'fullVerification'
}

tasks.named('build') {
    dependsOn 'jars'
}


