// Phase C3 MVCC mapping proof.
//
// This remains a proof/report, not a runtime reroute. It checks that the
// experimental delos_mvcc provider already has a direct operational mapping
// through VersionedStorageProvider / VersionedTable / VersionedScan and the
// narrow VersionedStorageExecutionBridge, without adding new SQL regex routes
// or folding MVCC into the heap StorageProvider family.

ext.delosdbStoragePhaseC3ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC3ReportFile =
        ext.delosdbStoragePhaseC3ReportDir.map { it.file('storage-phase-c3-mvcc-mapping.txt') }

ext.delosdbStoragePhaseC3RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC3JavaFiles = { String projectPath ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [] as Set<File>
    }
    fileTree(sourceRoot).matching { include '**/*.java' }.files as Set<File>
}

ext.delosdbStoragePhaseC3FilesContaining = { Collection<File> sourceFiles, Collection<String> tokens ->
    sourceFiles.findAll { sourceFile ->
        def text = sourceFile.text
        tokens.any { token -> text.contains(token) }
    }.collect { delosdbStoragePhaseC3RelPath(it) }.sort()
}

ext.delosdbStoragePhaseC3RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC3RelPath(sourceFile)}"
        return []
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
    missing
}

ext.delosdbStoragePhaseC3ForbiddenFilesByName = { Collection<String> names ->
    fileTree(rootProject.projectDir).matching {
        include '**/*.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
        exclude '**/.idea/**'
        exclude '**/__MACOSX/**'
    }.files.findAll { sourceFile -> names.contains(sourceFile.name) }
            .collect { delosdbStoragePhaseC3RelPath(it) }.sort()
}

ext.delosdbStoragePhaseC3MvccMapping = {
    def errors = []
    def lines = []

    def storageProvider = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/StorageProvider.java')
    def heapProvider = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/LegacyDerbyHeapStorageProvider.java')

    def versionedProvider = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/VersionedStorageProvider.java')
    def versionedCapabilities = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/VersionedStorageCapabilities.java')
    def versionedTable = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/VersionedTable.java')
    def versionedScan = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/VersionedScan.java')
    def versionedRow = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/VersionedRow.java')
    def txContext = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/TxContext.java')
    def txView = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/TxView.java')
    def txCoordinator = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/VersionedTransactionCoordinator.java')
    def tableMetadata = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/VersionedTableMetadata.java')
    def tableStats = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/VersionedTableStats.java')

    def providerDiscovery = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/VersionedStorageProviderDiscovery.java')
    def providerRegistry = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/VersionedStorageProviderRegistry.java')
    def providerResolver = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/VersionedStorageProviderResolver.java')
    def executionBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/execution/VersionedStorageExecutionBridge.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')

    def mvccProvider = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccStorageProvider.java')
    def mvccTable = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccTable.java')
    def mvccScan = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccScan.java')
    def mvccTxContext = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccTxContext.java')
    def mvccTxView = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccTxView.java')
    def mvccCoordinator = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccTransactionCoordinator.java')
    def mvccKernelTable = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/MvccTable.java')
    def mvccKernelScan = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/MvccScan.java')
    def providerSpiTest = file('delosdb-storage-mvcc/src/test/java/io/github/ggeorg/delosdb/storage/mvcc/VersionedStorageProviderSpiTest.java')
    def tableScanModelTest = file('delosdb-storage-mvcc/src/test/java/io/github/ggeorg/delosdb/storage/mvcc/MvccTableScanModelTest.java')

    def mvccMainFiles = delosdbStoragePhaseC3JavaFiles('delosdb-storage-mvcc')
    def engineVersionedFiles = delosdbStoragePhaseC3JavaFiles('delosdb-engine').findAll {
        delosdbStoragePhaseC3RelPath(it).contains('/engine/extension/storage/versioned/')
    }
    def storelessFiles = delosdbStoragePhaseC3JavaFiles('delosdb-storeless')

    lines << 'Phase C3 MVCC mapping proof'
    lines << '==========================='
    lines << ''
    lines << 'C3 mechanic:'
    lines << '  Prove the delos_mvcc participant maps to the Phase C operational vocabulary'
    lines << '  through VersionedStorageProvider / VersionedTable / VersionedScan, without'
    lines << '  adding a new runtime facade and without relying on new SQL regex routes.'
    lines << ''
    lines << 'MVCC operational mapping being guarded:'
    lines << '  provider identity      : VersionedStorageProvider / DelosMvccStorageProvider'
    lines << '  table access           : VersionedTable / DelosMvccTable'
    lines << '  scan access            : VersionedScan / DelosMvccScan -> MvccScan'
    lines << '  mutation access        : insert/update/delete through TxContext'
    lines << '  row identity           : provider key + VersionedRow, not Derby RowLocation'
    lines << '  transaction/isolation  : TxContext / TxView / DelosMvccTransactionCoordinator'
    lines << '  engine boundary        : VersionedStorageExecutionBridge, not EmbedStatement regex growth'
    lines << '  behavior change        : none; this is a source-level proof only'
    lines << ''

    [storageProvider, heapProvider, versionedProvider, versionedCapabilities, versionedTable, versionedScan,
     versionedRow, txContext, txView, txCoordinator, tableMetadata, tableStats, providerDiscovery,
     providerRegistry, providerResolver, executionBridge, sqlBridge, mvccProvider, mvccTable, mvccScan,
     mvccTxContext, mvccTxView, mvccCoordinator, mvccKernelTable, mvccKernelScan,
     providerSpiTest, tableScanModelTest].each { sourceFile ->
        if (!sourceFile.exists()) {
            errors << 'missing C3 MVCC-mapping participant: ' + delosdbStoragePhaseC3RelPath(sourceFile)
        }
    }

    delosdbStoragePhaseC3RequireTokens(errors, versionedProvider, [
            'interface VersionedStorageProvider',
            'String name()',
            'VersionedStorageCapabilities capabilities()',
            'VersionedTransactionCoordinator transactionCoordinator()',
            'List<VersionedTableMetadata> listTables()',
            'createTable(',
            'openTable('
    ], 'VersionedStorageProvider operational SPI')

    delosdbStoragePhaseC3RequireTokens(errors, versionedCapabilities, [
            'SNAPSHOT_VISIBILITY',
            'TABLE_SCAN',
            'MANUAL_CLEANUP',
            'PROVIDER_OWNED_INDEXES'
    ], 'VersionedStorageCapabilities MVCC capability descriptor')

    delosdbStoragePhaseC3RequireTokens(errors, versionedTable, [
            'interface VersionedTable',
            'VersionedTableMetadata metadata()',
            'Optional<V> read(K key, TxView view)',
            'VersionedScan<K, V> openScan(TxView view)',
            'void insert(K key, V value, TxContext transaction)',
            'void update(K key, V value, TxContext transaction)',
            'void delete(K key, TxContext transaction)',
            'VersionedTableStats stats(TxView view)'
    ], 'VersionedTable table access contract')

    delosdbStoragePhaseC3RequireTokens(errors, versionedScan, [
            'interface VersionedScan',
            'boolean next()',
            'VersionedRow<K, V> row()',
            'int visibleRowCount()',
            'void close()'
    ], 'VersionedScan cursor contract')

    delosdbStoragePhaseC3RequireTokens(errors, txContext, [
            'long transactionId()',
            'TxView currentView()',
            'statementCommandSequence()'
    ], 'TxContext provider transaction handle')

    delosdbStoragePhaseC3RequireTokens(errors, txView, [
            'boolean isVisible(long createdByTransactionId, long deletedByTransactionId)',
            'long oldestVisibleTransaction()'
    ], 'TxView snapshot visibility handle')

    delosdbStoragePhaseC3RequireTokens(errors, providerDiscovery, [
            'ServiceLoader<VersionedStorageProvider>',
            'List<VersionedStorageProvider> providers'
    ], 'VersionedStorageProviderDiscovery opt-in provider discovery')

    delosdbStoragePhaseC3RequireTokens(errors, providerRegistry, [
            'ExtensionType.VERSIONED_STORAGE',
            'ProviderRegistry<VersionedStorageProvider>',
            'registerEnabled(VersionedStorageProvider provider',
            'VersionedStorageProviderResolver resolver()'
    ], 'VersionedStorageProviderRegistry opt-in registry')

    delosdbStoragePhaseC3RequireTokens(errors, providerResolver, [
            'ProviderResolver<VersionedStorageProvider>',
            'findEnabled(String name)',
            'requireEnabled(String name)'
    ], 'VersionedStorageProviderResolver opt-in resolution')

    delosdbStoragePhaseC3RequireTokens(errors, executionBridge, [
            'final class VersionedStorageExecutionBridge',
            'VersionedStorageProviderResolver resolver',
            'createTable(String providerName, VersionedTableMetadata metadata)',
            'openTable(String providerName, VersionedTableMetadata metadata)',
            'void insert(VersionedTable<K, V> table, K key, V value, TxContext transaction)',
            'void update(VersionedTable<K, V> table, K key, V value, TxContext transaction)',
            'void delete(VersionedTable<K, V> table, K key, TxContext transaction)',
            'Optional<V> read(VersionedTable<K, V> table, K key, TxView view)',
            'List<VersionedRow<K, V>> scanAll(VersionedTable<K, V> table, TxView view)',
            'VersionedTableStats stats(VersionedTable<K, V> table, TxView view)'
    ], 'VersionedStorageExecutionBridge direct operational boundary')

    if (executionBridge.exists()) {
        def text = executionBridge.text
        def forbidden = ['VersionedStorageSqlBridge', 'VersionedStorageSqlResult', 'Pattern.compile', 'java.sql.ResultSet', 'java.sql.SQLException', 'EmbedStatement']
        def leaks = forbidden.findAll { token -> text.contains(token) }
        lines << "Execution bridge SQL coupling          : ${leaks.isEmpty() ? 'none' : leaks.join(', ')}"
        if (!leaks.isEmpty()) {
            errors << 'VersionedStorageExecutionBridge must stay direct/provider-operational, not SQL regex/JDBC coupled: ' + leaks.join(', ')
        }
    }

    if (mvccProvider.exists()) {
        def text = mvccProvider.text
        delosdbStoragePhaseC3RequireTokens(errors, mvccProvider, [
                'implements VersionedStorageProvider',
                'public static final String PROVIDER_NAME = "delos_mvcc"',
                'VersionedStorageCapabilities.SNAPSHOT_VISIBILITY',
                'VersionedStorageCapabilities.TABLE_SCAN',
                'VersionedStorageCapabilities.MANUAL_CLEANUP',
                'VersionedStorageCapabilities.PROVIDER_OWNED_INDEXES',
                'VersionedStorageCapabilities.ORDERED_PROVIDER_OWNED_INDEXES',
                'VersionedTransactionCoordinator transactionCoordinator()',
                'List<VersionedTableMetadata> listTables()',
                'VersionedTable<K, V> createTable(VersionedTableMetadata metadata)',
                'VersionedTable<K, V> openTable(VersionedTableMetadata metadata)'
        ], 'DelosMvccStorageProvider provider mapping')
        def forbidden = ['implements StorageProvider', 'ConglomerateController', 'ScanController', 'RowLocation']
        def leaks = forbidden.findAll { token -> text.contains(token) }
        lines << "MVCC provider heap/metadata leakage    : ${leaks.isEmpty() ? 'none' : leaks.join(', ')}"
        if (!leaks.isEmpty()) {
            errors << 'DelosMvccStorageProvider must not be folded into Derby heap/StorageProvider during C3: ' + leaks.join(', ')
        }
    }

    delosdbStoragePhaseC3RequireTokens(errors, mvccTable, [
            'implements VersionedTable<K, V>',
            'public Optional<V> read(K key, TxView view)',
            'public VersionedScan<K, V> openScan(TxView view)',
            'return new DelosMvccScan<>(table.openScan(mvccView.snapshot(), mvccView.catalog()))',
            'public void insert(K key, V value, TxContext transaction)',
            'public void update(K key, V value, TxContext transaction)',
            'public void delete(K key, TxContext transaction)',
            'requireMvccContext(transaction)',
            'requireMvccView(view)',
            'throw new IllegalArgumentException("Delos MVCC table requires DelosMvccTxContext")',
            'throw new IllegalArgumentException("Delos MVCC table requires DelosMvccTxView")'
    ], 'DelosMvccTable table/scan/mutation mapping')

    delosdbStoragePhaseC3RequireTokens(errors, mvccScan, [
            'implements VersionedScan<K, V>',
            'private final MvccScan<K, V> delegate',
            'public boolean next()',
            'public VersionedRow<K, V> row()',
            'return new VersionedRow<>(row.key(), row.value())',
            'public int visibleRowCount()',
            'public void close()'
    ], 'DelosMvccScan cursor mapping')

    delosdbStoragePhaseC3RequireTokens(errors, mvccCoordinator, [
            'implements VersionedTransactionCoordinator',
            'public DelosMvccTxContext begin()',
            'public void commit(TxContext context)',
            'public void abort(TxContext context)',
            'public DelosMvccTxContext refresh(TxContext context)',
            'throw new IllegalArgumentException("Delos MVCC coordinator requires DelosMvccTxContext")'
    ], 'DelosMvccTransactionCoordinator transaction mapping')

    delosdbStoragePhaseC3RequireTokens(errors, mvccTxContext, [
            'implements TxContext',
            'public long transactionId()',
            'public TxView currentView()',
            'statementCommandSequence()',
            'public DelosMvccTxView mvccView()'
    ], 'DelosMvccTxContext transaction handle')

    delosdbStoragePhaseC3RequireTokens(errors, mvccTxView, [
            'implements TxView',
            'public boolean isVisible(long createdByTransactionId, long deletedByTransactionId)',
            'public long oldestVisibleTransaction()'
    ], 'DelosMvccTxView snapshot handle')

    delosdbStoragePhaseC3RequireTokens(errors, providerSpiTest, [
            'testCreateOpenAndScanThroughVersionedStorageSpi',
            'testRollbackInsertIsInvisibleThroughSpi',
            'testSpiPreservesSnapshotVisibilityAcrossUpdate',
            'testRollbackDeleteDoesNotHideCommittedRowThroughSpi',
            'testSpiRejectsNonMvccContext'
    ], 'VersionedStorageProviderSpiTest behavioral proof')

    delosdbStoragePhaseC3RequireTokens(errors, tableScanModelTest, [
            'testScanReturnsOnlyRowsVisibleToSnapshot',
            'testScanPreservesOldSnapshotAcrossUpdateAndDelete',
            'testOpenedScanOwnsStableVisibleRows',
            'testScanSkipsAbortedRowsAndCleanupDoesNotChangeVisibleOutput',
            'testScanRowPositionAndCloseContracts'
    ], 'MvccTableScanModelTest behavioral scan proof')

    if (storageProvider.exists()) {
        def text = storageProvider.text
        def forbidden = ['VersionedStorageProvider', 'VersionedTable', 'VersionedScan', 'TxContext', 'TxView', 'openTable(']
        def leaks = forbidden.findAll { token -> text.contains(token) }
        lines << "StorageProvider MVCC leakage           : ${leaks.isEmpty() ? 'none' : leaks.join(', ')}"
        if (!leaks.isEmpty()) {
            errors << 'StorageProvider must remain heap metadata/capability-only during C3: ' + leaks.join(', ')
        }
    }

    if (heapProvider.exists()) {
        def text = heapProvider.text
        def leaks = ['VersionedStorageProvider', 'VersionedTable', 'VersionedScan', 'TxContext', 'TxView'].findAll { token -> text.contains(token) }
        lines << "Heap provider MVCC leakage             : ${leaks.isEmpty() ? 'none' : leaks.join(', ')}"
        if (!leaks.isEmpty()) {
            errors << 'LegacyDerbyHeapStorageProvider must not absorb MVCC operational SPI during C3: ' + leaks.join(', ')
        }
    }

    def mvccDerbyStoreLeaks = delosdbStoragePhaseC3FilesContaining(mvccMainFiles, [
            'org.apache.derby.iapi.store.access.TransactionController',
            'org.apache.derby.iapi.store.access.ConglomerateController',
            'org.apache.derby.iapi.store.access.ScanController',
            'org.apache.derby.iapi.types.RowLocation'
    ])
    lines << "MVCC module Derby-store leakage        : ${mvccDerbyStoreLeaks.isEmpty() ? 'none' : mvccDerbyStoreLeaks.join(', ')}"
    if (!mvccDerbyStoreLeaks.isEmpty()) {
        errors << 'delosdb-storage-mvcc must not bind to Derby heap store contracts during C3: ' + mvccDerbyStoreLeaks.join(', ')
    }

    def sqlRegexTokens = ['Pattern.compile(', 'CREATE_TABLE = Pattern.compile', 'SELECT_ALL = Pattern.compile',
                          'INSERT_VALUES = Pattern.compile', 'UPDATE_WHERE_EQUALS = Pattern.compile',
                          'DELETE_WHERE_EQUALS = Pattern.compile']
    def sqlRegexFiles = delosdbStoragePhaseC3FilesContaining(engineVersionedFiles, sqlRegexTokens)
    lines << "Versioned SQL regex owners             : ${sqlRegexFiles.isEmpty() ? 'none' : sqlRegexFiles.join(', ')}"
    def unexpectedRegexOwners = sqlRegexFiles.findAll {
        it != 'delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java'
    }
    if (!unexpectedRegexOwners.isEmpty()) {
        errors << 'C3 must not add new SQL regex routing outside the transitional VersionedStorageSqlBridge: ' + unexpectedRegexOwners.join(', ')
    }
    if (!sqlBridge.exists()) {
        errors << 'VersionedStorageSqlBridge disappeared before planned scan/insert replacement proofs exist'
    }

    def storelessProviderLeaks = delosdbStoragePhaseC3FilesContaining(storelessFiles, [
            'implements StorageProvider', 'implements VersionedStorageProvider',
            'StorelessStorageProvider', 'StorelessVersionedStorageProvider'
    ])
    lines << "Storeless provider leakage             : ${storelessProviderLeaks.isEmpty() ? 'none' : storelessProviderLeaks.join(', ')}"
    if (!storelessProviderLeaks.isEmpty()) {
        errors << 'storeless must remain a no-store participant, not a MVCC/heap provider: ' + storelessProviderLeaks.join(', ')
    }

    def forbiddenNames = [
            'DelosStorageEngine.java',
            'DelosMutationAccess.java',
            'StorageExecutionProfile.java',
            'TableAccessProfile.java',
            'MvccDelosStorageEngine.java',
            'MvccTableAccess.java',
            'StorelessStorageProvider.java',
            'StorelessVersionedStorageProvider.java'
    ] as Set
    def forbiddenFiles = delosdbStoragePhaseC3ForbiddenFilesByName(forbiddenNames)
    lines << "New third-island/profile candidates    : ${forbiddenFiles.isEmpty() ? 'none' : forbiddenFiles.join(', ')}"
    if (!forbiddenFiles.isEmpty()) {
        errors << 'C3 must stay an MVCC mapping proof, not introduce a new SPI/profile island: ' + forbiddenFiles.join(', ')
    }

    def engineImplStoreSources = fileTree(file('delosdb-engine/src/main/java')).matching {
        include 'org/apache/derby/impl/store/**/*.java'
    }.files.collect { delosdbStoragePhaseC3RelPath(it) }.sort()
    lines << "Engine impl/store sources              : ${engineImplStoreSources.isEmpty() ? 'none' : engineImplStoreSources.join(', ')}"
    if (!engineImplStoreSources.isEmpty()) {
        errors << 'C3 must not add Derby impl.store sources back under delosdb-engine: ' + engineImplStoreSources.take(10).join(', ')
    }

    lines << ''
    lines << 'C3 conclusion:'
    lines << '  MVCC already maps to the Phase C operational vocabulary through its explicit'
    lines << '  versioned provider/table/scan/transaction contracts. The next proof should'
    lines << '  start moving one tiny planned read path toward that boundary; it should not'
    lines << '  add another storage SPI, fold MVCC into heap StorageProvider, or grow SQL regex routing.'
    lines << ''
    lines << "result                                : ${errors.isEmpty() ? 'PASS' : 'FAIL'}"
    if (!errors.isEmpty()) {
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "- ${it}" }
    }

    [lines: lines, errors: errors]
}

tasks.register('storagePhaseC3MvccMappingReport') {
    group = 'verification'
    description = 'Writes the Phase C3 MVCC mapping proof report.'
    dependsOn 'verifyStoragePhaseC2HeapMapping'
    outputs.file(delosdbStoragePhaseC3ReportFile)
    doLast {
        def result = delosdbStoragePhaseC3MvccMapping()
        def reportFile = delosdbStoragePhaseC3ReportFile.get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${reportFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException('Phase C3 MVCC mapping check failed; see ' + reportFile)
        }
    }
}

tasks.register('verifyStoragePhaseC3MvccMapping') {
    group = 'verification'
    description = 'Verifies the Phase C3 MVCC mapping proof.'
    dependsOn 'storagePhaseC3MvccMappingReport', ':delosdb-storage-mvcc:runVersionedStorageProviderSpiTest'
    doLast {
        println 'Verified Phase C3 MVCC mapping; next step must be one planned read-path proof, not a broad SQL bridge rewrite'
    }
}
