import org.gradle.api.tasks.compile.JavaCompile

// Phase C29 JavaCC range SELECT classifier.
// This extends the C24/C25 QueryTreeNode route from equality SELECT to one
// simple range SELECT family while keeping the existing regex fallback intact.

ext.delosdbStoragePhaseC29ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC29ReportFile =
        ext.delosdbStoragePhaseC29ReportDir.map { it.file('storage-phase-c29-javacc-range-classifier.txt') }
ext.delosdbStoragePhaseC29SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c29-javacc-range-classifier-smoke')

ext.delosdbStoragePhaseC29RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC29RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC29RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC29ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC29RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC29Classpath = {
    files(
            delosdbStoragePhaseC29SmokeClassesDir,
            delosdbStoragePhaseC29ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC29ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseC29ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC29ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC29RuntimeJars())
}

ext.delosdbStoragePhaseC29Proof = {
    def errors = []
    def lines = []

    def classifier = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/DelosVersionedStorageQueryTreeClassifier.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def smokeSource = file('dev/storage-phase-c29-javacc-range-classifier-smoke/src/main/java/delosdb/smoke/StoragePhaseC29JavaCcRangeClassifierSmoke.java')
    def phaseEPlan = file('docs/storage-phase-e-plan.md')

    delosdbStoragePhaseC29RequireTokens(errors, classifier, [
            'selectWhereComparison(String sql)',
            'classifySelectWhereComparison(String sql, Visitable parsed)',
            'BinaryRelationalOperatorNode.K_GREATER_EQUALS',
            'BinaryRelationalOperatorNode.K_GREATER_THAN',
            'BinaryRelationalOperatorNode.K_LESS_EQUALS',
            'BinaryRelationalOperatorNode.K_LESS_THAN',
            'SelectWhereComparisonRoute',
            'invertComparisonOperator',
            'return Optional.of(new SelectWhereComparisonRoute('
    ], 'C29 JavaCC / QueryTreeNode range classifier')
    if (classifier.exists()) {
        def classifierText = classifier.text
        ['Pattern.compile(', '.matcher(', 'DelosTableGuarantee', 'guarantees()', 'DelosTableCapability'].each { token ->
            if (classifierText.contains(token)) {
                errors << "C29 classifier must stay parser-tree classification only and must not include token: ${token}"
            }
        }
    }

    delosdbStoragePhaseC29RequireTokens(errors, sqlBridge, [
            'DelosVersionedStorageQueryTreeClassifier.selectWhereComparison(normalizedSql)',
            'PlannedRoute.selectWhereEquals(',
            'PlannedRoute.selectWhereRange(',
            'route.operator()',
            'private static final Pattern SELECT_WHERE_RANGE',
            'SELECT_WHERE_RANGE.matcher(normalizedSql)'
    ], 'VersionedStorageSqlBridge C29 JavaCC range route plus regex fallback')
    if (sqlBridge.exists()) {
        def bridgeText = sqlBridge.text
        def javaCcStart = bridgeText.indexOf('private static Optional<PlannedRoute> routeStatementWithJavaCcQueryTree')
        if (javaCcStart >= 0) {
            def javaCcText = bridgeText.substring(javaCcStart, Math.min(bridgeText.length(), javaCcStart + 1200))
            if (!javaCcText.contains('PlannedRoute.selectWhereRange(')) {
                errors << 'JavaCC route must map range comparisons to PlannedRoute.selectWhereRange(...)'
            }
            if (javaCcText.contains('Pattern.compile(') || javaCcText.contains('.matcher(')) {
                errors << 'JavaCC route helper must not add regex matching'
            }
        } else {
            errors << 'missing routeStatementWithJavaCcQueryTree helper in VersionedStorageSqlBridge'
        }
    }

    delosdbStoragePhaseC29RequireTokens(errors, smokeSource, [
            'StoragePhaseC29JavaCcRangeClassifierSmoke',
            'SELECT * FROM C29_JAVACC_RANGE WHERE id > 2',
            'javacc-query-tree',
            'SELECT WHERE range route must be classified by Derby JavaCC / QueryTreeNode inspection',
            'select-range',
            'VersionedStorageAccessPath.INDEX_SCAN',
            'storage_phase_c29_javacc_range_classifier: PASS'
    ], 'C29 JavaCC range classifier smoke')
    if (smokeSource.exists()) {
        def smokeText = smokeSource.text
        ['Pattern.compile(', '.matcher(', 'FunctionCall', 'RexNode'].each { token ->
            if (smokeText.contains(token)) {
                errors << "C29 smoke must not add regex or expression-model token: ${token}"
            }
        }
    }

    delosdbStoragePhaseC29RequireTokens(errors, phaseEPlan, [
            'C29 — JavaCC range SELECT classifier',
            'C30 — delete one matching range regex',
            'No function-call predicates'
    ], 'Phase E/D sequence plan document')

    lines << 'DelosDB Storage Phase C29 JavaCC Range SELECT Classifier'
    lines << '========================================================'
    lines << ''
    lines << 'C29 mechanic:'
    lines << '  Extend Derby JavaCC / QueryTreeNode classification from SELECT equality to simple SELECT range comparisons.'
    lines << '  Map parser-classified range predicates to the existing PlannedRoute.selectWhereRange(...) execution path.'
    lines << ''
    lines << 'Boundaries preserved:'
    lines << '  Existing SELECT range regex remains as fallback for C30 to delete later.'
    lines << '  No guarantee/capability policy is added to the JavaCC classifier.'
    lines << '  No function-call predicates or expression model.'
    lines << '  No INSERT/UPDATE/DELETE classifier work yet.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC29JavaCcRangeClassifierReport') {
    group = 'verification'
    description = 'Writes the Phase C29 JavaCC range SELECT classifier report.'
    dependsOn 'verifyStoragePhaseC28LeftoverPredicate'
    outputs.file(delosdbStoragePhaseC29ReportFile)
    doLast {
        def result = delosdbStoragePhaseC29Proof()
        def outputFile = delosdbStoragePhaseC29ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C29 JavaCC range classifier failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC29JavaCcRangeClassifierSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C29 JavaCC range SELECT classifier smoke test.'
    source = files('dev/storage-phase-c29-javacc-range-classifier-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseC29SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC29Classpath()
}

tasks.register('storagePhaseC29JavaCcRangeClassifierSmoke', JavaExec) {
    dependsOn 'storagePhaseC29JavaCcRangeClassifierReport', 'compileStoragePhaseC29JavaCcRangeClassifierSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase C29 JavaCC range SELECT classifier smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseC29JavaCcRangeClassifierSmoke'
    classpath = delosdbStoragePhaseC29Classpath()
}

tasks.register('verifyStoragePhaseC29JavaCcRangeClassifier') {
    group = 'verification'
    description = 'Verifies Phase C29 JavaCC/QueryTreeNode range SELECT classification.'
    dependsOn 'storagePhaseC29JavaCcRangeClassifierReport', 'storagePhaseC29JavaCcRangeClassifierSmoke'
    doLast {
        println 'Verified Phase C29 JavaCC range SELECT classifier; next step is C30 deleting one matching range regex'
    }
}
