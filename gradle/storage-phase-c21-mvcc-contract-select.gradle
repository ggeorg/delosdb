import org.gradle.api.tasks.compile.JavaCompile

// Phase C21 MVCC adapter plus one SELECT through DelosFilterableTableAccess.
// Routing still enters through VersionedStorageSqlBridge and its existing regex
// classifier.  C21 changes the execution side for one equality SELECT path.

ext.delosdbStoragePhaseC21ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC21ReportFile =
        ext.delosdbStoragePhaseC21ReportDir.map { it.file('storage-phase-c21-mvcc-contract-select.txt') }
ext.delosdbStoragePhaseC21SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c21-mvcc-contract-select-smoke')

ext.delosdbStoragePhaseC21RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC21RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC21RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC21JavaFiles = { String projectPath ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [] as Set<File>
    }
    fileTree(sourceRoot).matching { include '**/*.java' }.files as Set<File>
}

ext.delosdbStoragePhaseC21ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC21RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC21Classpath = {
    files(
            delosdbStoragePhaseC21SmokeClassesDir,
            delosdbStoragePhaseC21ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC21ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseC21ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC21ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC21RuntimeJars())
}

ext.delosdbStoragePhaseC21Proof = {
    def errors = []
    def lines = []

    def adapter = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/storetypes/EngineMvccTableAccess.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def smokeSource = file('dev/storage-phase-c21-mvcc-contract-select-smoke/src/main/java/delosdb/smoke/StoragePhaseC21MvccContractSelectSmoke.java')
    def kernelContractsRoot = file('delosdb-engine-kernel/src/main/java/org/apache/derby/iapi/store/types')

    delosdbStoragePhaseC21RequireTokens(errors, adapter, [
            'public final class EngineMvccTableAccess',
            'implements DelosFilterableTableAccess, DelosIndexableTableAccess, DelosMutableTableAccess',
            'public static final DelosContextKey<TxContext> TX_CONTEXT_KEY',
            'public static final DelosContextKey<TxView> TX_VIEW_KEY',
            'public DelosScan scan(',
            'List<DelosPredicate> mutableFilters',
            'mutableFilters.remove(equality.predicate())',
            'executionBridge.scanAll(table, view)',
            'executionBridge.lookup(index.index(), equality.value(), view)',
            'DelosRow.withIdentity(new MvccRowIdentity(row.key()), values)',
            'public DelosMutationResult update(',
            'public DelosMutationResult delete(',
            'public DelosIndexAccess openIndex('
    ], 'C21 MVCC table-access adapter')

    delosdbStoragePhaseC21RequireTokens(errors, sqlBridge, [
            'private static final Pattern SELECT_WHERE_EQUALS',
            'private static PlannedRoute routeStatement(String normalizedSql)',
            'EngineMvccTableAccess tableAccess = table.tableAccess()',
            'DelosPredicate.equalsTo(',
            'tableAccess.scan(',
            'DelosProjection.all()',
            'applyLeftoverPredicates(',
            'tableAccess.lastAccessPath()',
            'private EngineMvccTableAccess tableAccess()',
            'new EngineMvccTableAccess.IndexBinding('
    ], 'VersionedStorageSqlBridge C21 SELECT execution path')

    if (sqlBridge.exists()) {
        def bridgeText = sqlBridge.text
        if (!bridgeText.contains('Pattern.compile(')) {
            errors << 'C21 must not delete regex routing; Pattern.compile must remain until C24/C25 replacement exists'
        }
        def routeStart = bridgeText.indexOf('private static PlannedRoute routeStatement(String normalizedSql)')
        def selectStart = bridgeText.indexOf('private static VersionedStorageSqlResult selectWhereEquals(')
        if (routeStart < 0 || selectStart < 0) {
            errors << 'C21 requires routeStatement and selectWhereEquals to remain distinct'
        }
        if (selectStart >= 0) {
            def selectText = bridgeText.substring(selectStart, Math.min(bridgeText.length(), selectStart + 2500))
            if (selectText.contains('chooseAccessPath(')) {
                errors << 'C21 selectWhereEquals must use DelosFilterableTableAccess.scan rather than the old chooseAccessPath helper'
            }
            if (!selectText.contains('tableAccess.scan(')) {
                errors << 'C21 selectWhereEquals must cross DelosFilterableTableAccess.scan'
            }
        }
    }

    delosdbStoragePhaseC21RequireTokens(errors, smokeSource, [
            'verifyAdapterFilterPushdownDirectly',
            'verifySqlSelectWhereEqualsUsesContractAdapter',
            'VersionedStorageSqlBridge.tryExecute(sql, this, true, Connection.TRANSACTION_READ_COMMITTED)',
            'SELECT * FROM ',
            'WHERE id = 2',
            'EngineMvccTableAccess',
            'mutableFilters.size() == 1',
            'DelosPredicateOperator.NOT_EQUAL',
            'INDEX_SCAN'
    ], 'C21 MVCC contract SELECT smoke')

    if (smokeSource.exists()) {
        def smokeText = smokeSource.text
        ['Pattern.compile(', '.matcher('].each { token ->
            if (smokeText.contains(token)) {
                errors << "C21 smoke must not add its own SQL classifier token: ${token}"
            }
        }
    }

    ['DelosTableAccess.java', 'DelosFilterableTableAccess.java', 'DelosIndexableTableAccess.java', 'DelosMutableTableAccess.java'].each { fileName ->
        if (!file("${kernelContractsRoot}/${fileName}").exists()) {
            errors << "C21 requires C20 contract file to exist: ${fileName}"
        }
    }

    def forbiddenNames = [
            'DelosStorageEngine.java',
            'DelosScannableTableAccess.java',
            'DelosProjectableFilterableTableAccess.java',
            'DelosMutationAccess.java',
            'TableAccessProfile.java',
            'StorageExecutionProfile.java',
            'StorelessStorageProvider.java',
            'StorelessVersionedStorageProvider.java'
    ] as Set
    def forbiddenFiles = fileTree(rootProject.projectDir).matching {
        include '**/*.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
        exclude '**/.idea/**'
        exclude '**/__MACOSX/**'
    }.files.findAll { sourceFile -> forbiddenNames.contains(sourceFile.name) }
            .collect { delosdbStoragePhaseC21RelPath(it) }.sort()
    if (!forbiddenFiles.isEmpty()) {
        errors << 'C21 must not introduce a giant/third-island abstraction: ' + forbiddenFiles
    }

    def engineImplStoreSourceRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
    if (engineImplStoreSourceRoot.exists()) {
        errors << 'C21 must not add engine-side org/apache/derby/impl/store sources: '
                + delosdbStoragePhaseC21RelPath(engineImplStoreSourceRoot)
    }

    def storelessRoot = file('delosdb-storeless/src/main/java')
    if (storelessRoot.exists()) {
        def storelessLeaks = fileTree(storelessRoot).matching { include '**/*.java' }.files.findAll { sourceFile ->
            def text = sourceFile.text
            text.contains('implements StorageProvider') ||
                    text.contains('implements VersionedStorageProvider') ||
                    text.contains('implements DelosFilterableTableAccess') ||
                    text.contains('implements DelosIndexableTableAccess') ||
                    text.contains('implements DelosMutableTableAccess')
        }.collect { delosdbStoragePhaseC21RelPath(it) }.sort()
        if (!storelessLeaks.isEmpty()) {
            errors << 'Storeless must remain a no-store/base-only constraint after C21: ' + storelessLeaks
        }
    }

    lines << 'DelosDB Storage Phase C21 MVCC Contract SELECT'
    lines << '================================================'
    lines << ''
    lines << 'C21 mechanic:'
    lines << '  add an engine-side MVCC adapter for the C20 table-access contracts and route one equality SELECT execution path through DelosFilterableTableAccess.scan(...).'
    lines << ''
    lines << 'Boundaries preserved:'
    lines << '  VersionedStorageSqlBridge remains the temporary SQL interception point.'
    lines << '  routeStatement(...) still uses the existing regex classifier.'
    lines << '  no regex route is deleted.'
    lines << '  Derby heap execution remains untouched.'
    lines << '  storeless remains a no-store/base-only constraint.'
    lines << ''
    lines << 'Proof smoke:'
    lines << '  dev/storage-phase-c21-mvcc-contract-select-smoke/src/main/java/delosdb/smoke/StoragePhaseC21MvccContractSelectSmoke.java'
    lines << ''
    lines << 'Next step:'
    lines << '  C22 should prove heap compile-time honesty against the contracts without changing heap SQL execution.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC21MvccContractSelectReport') {
    group = 'verification'
    description = 'Writes the Phase C21 MVCC contract SELECT report.'
    dependsOn 'verifyStoragePhaseC20Contracts'
    outputs.file(delosdbStoragePhaseC21ReportFile)
    doLast {
        def result = delosdbStoragePhaseC21Proof()
        def outputFile = delosdbStoragePhaseC21ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C21 MVCC contract SELECT failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC21MvccContractSelectSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C21 MVCC contract SELECT smoke test.'
    source = files('dev/storage-phase-c21-mvcc-contract-select-smoke/src/main/java')
    destinationDirectory = delosdbStoragePhaseC21SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC21Classpath()
}

tasks.register('storagePhaseC21MvccContractSelectSmoke', JavaExec) {
    dependsOn 'compileStoragePhaseC21MvccContractSelectSmoke', 'processDerbyResources'
    group = 'verification'
    description = 'Runs the Phase C21 MVCC contract SELECT smoke test.'
    classpath = delosdbStoragePhaseC21Classpath()
    mainClass = 'delosdb.smoke.StoragePhaseC21MvccContractSelectSmoke'
}

tasks.register('verifyStoragePhaseC21MvccContractSelect') {
    group = 'verification'
    description = 'Verifies the Phase C21 MVCC adapter and SELECT-through-contract proof.'
    dependsOn 'storagePhaseC21MvccContractSelectReport', 'storagePhaseC21MvccContractSelectSmoke'
    doLast {
        println 'Verified Phase C21 MVCC adapter and SELECT-through-contract proof; next step is C22 heap compile-time honesty proof'
    }
}
