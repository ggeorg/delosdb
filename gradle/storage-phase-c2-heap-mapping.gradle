// Phase C2 heap mapping proof.
//
// This is still a proof/report, not a new runtime facade. It checks that the
// default heap participant can be mapped to the Phase C operational vocabulary
// by pointing at the existing Derby execution/store machinery: TransactionController,
// ScanController, ConglomerateController, RowLocation, and Derby isolation/locking.

ext.delosdbStoragePhaseC2ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC2ReportFile =
        ext.delosdbStoragePhaseC2ReportDir.map { it.file('storage-phase-c2-heap-mapping.txt') }

ext.delosdbStoragePhaseC2RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC2SourceFiles = { String projectPath, String includePattern ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [] as Set<File>
    }
    fileTree(sourceRoot).matching { include includePattern }.files as Set<File>
}

ext.delosdbStoragePhaseC2JavaFiles = { String projectPath ->
    delosdbStoragePhaseC2SourceFiles(projectPath, '**/*.java')
}

ext.delosdbStoragePhaseC2StoreSourceCounts = { String projectPath ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [iapi: 0, impl: 0]
    }
    [
            iapi: fileTree(sourceRoot).matching { include 'org/apache/derby/iapi/store/**/*.java' }.files.size(),
            impl: fileTree(sourceRoot).matching { include 'org/apache/derby/impl/store/**/*.java' }.files.size()
    ]
}

ext.delosdbStoragePhaseC2FilesContaining = { Collection<File> sourceFiles, Collection<String> tokens ->
    sourceFiles.findAll { sourceFile ->
        def text = sourceFile.text
        tokens.any { token -> text.contains(token) }
    }.collect { delosdbStoragePhaseC2RelPath(it) }.sort()
}

ext.delosdbStoragePhaseC2RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC2RelPath(sourceFile)}"
        return []
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
    missing
}

ext.delosdbStoragePhaseC2HeapMapping = {
    def errors = []
    def lines = []

    def storageProvider = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/StorageProvider.java')
    def storageCapabilities = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/StorageCapabilities.java')
    def heapProvider = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/LegacyDerbyHeapStorageProvider.java')
    def builtIns = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/BuiltInStorageProviders.java')
    def resolver = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/StorageProviderResolver.java')
    def metadataResolver = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/TableStorageMetadataResolver.java')
    def tableScan = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/TableScanResultSet.java')
    def rowChanger = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/RowChangerImpl.java')
    def indexChanger = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/IndexChanger.java')
    def engineRowLocationBridge = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/storetypes/EngineStoreRowLocationBridge.java')
    def engineStoreTypeSupport = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/storetypes/EngineStoreTypeSupport.java')
    def storeRowLocation = file('delosdb-engine-kernel/src/main/java/org/apache/derby/iapi/store/types/StoreRowLocation.java')
    def storeTypeSupport = file('delosdb-engine-kernel/src/main/java/org/apache/derby/iapi/store/types/StoreTypeSupport.java')
    def versionedProvider = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/VersionedStorageProvider.java')
    def mvccProvider = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccStorageProvider.java')

    def engineFiles = delosdbStoragePhaseC2JavaFiles('delosdb-engine')
    def heapMappingParticipants = [
            storageProvider,
            storageCapabilities,
            heapProvider,
            builtIns,
            resolver,
            metadataResolver,
            tableScan,
            rowChanger,
            indexChanger,
            engineRowLocationBridge,
            engineStoreTypeSupport,
            storeRowLocation,
            storeTypeSupport,
            versionedProvider,
            mvccProvider
    ]

    lines << 'Phase C2 heap mapping proof'
    lines << '==========================='
    lines << ''
    lines << 'C2 mechanic:'
    lines << '  Map the default Derby heap participant to the Phase C operational vocabulary'
    lines << '  without adding a new runtime facade or changing heap behavior.'
    lines << ''
    lines << 'Heap operational mapping being guarded:'
    lines << '  provider identity      : StorageProvider / LegacyDerbyHeapStorageProvider'
    lines << '  table metadata         : TableStorageMetadataResolver / TableDescriptor provider name'
    lines << '  scan access            : TableScanResultSet -> TransactionController.openCompiledScan'
    lines << '  mutation access        : RowChangerImpl -> ConglomerateController insert/delete/replace'
    lines << '  row identity           : RowLocation / StoreRowLocation bridge'
    lines << '  transaction/isolation  : Derby TransactionController and lock-manager modes'
    lines << '  behavior change        : none; this is a source-level proof only'
    lines << ''

    heapMappingParticipants.each { sourceFile ->
        if (!sourceFile.exists()) {
            errors << 'missing C2 heap-mapping participant: ' + delosdbStoragePhaseC2RelPath(sourceFile)
        }
    }

    delosdbStoragePhaseC2RequireTokens(errors, storageProvider, [
            'interface StorageProvider',
            'String name()',
            'StorageCapabilities capabilities()',
            'capabilities(TableStorageMetadata metadata)'
    ], 'StorageProvider metadata SPI')

    delosdbStoragePhaseC2RequireTokens(errors, storageCapabilities, [
            'static StorageCapabilities heap()',
            'boolean rowStore',
            'boolean transactional',
            'boolean derbyHeapCompatible',
            'return new StorageCapabilities(true, true, true);'
    ], 'StorageCapabilities heap capability descriptor')

    if (heapProvider.exists()) {
        def text = heapProvider.text
        delosdbStoragePhaseC2RequireTokens(errors, heapProvider, [
                'implements StorageProvider',
                'BuiltInStorageProviders.defaultProviderName()',
                'return StorageCapabilities.heap();'
        ], 'LegacyDerbyHeapStorageProvider')
        def forbidden = ['VersionedStorageProvider', 'VersionedTable', 'VersionedScan', 'TxContext', 'TxView', 'openTable(']
        def leaks = forbidden.findAll { token -> text.contains(token) }
        lines << "Heap provider versioned leakage       : ${leaks.isEmpty() ? 'none' : leaks.join(', ')}"
        if (!leaks.isEmpty()) {
            errors << 'LegacyDerbyHeapStorageProvider must stay metadata-only during C2: ' + leaks.join(', ')
        }
    }

    delosdbStoragePhaseC2RequireTokens(errors, builtIns, [
            'public static StorageProvider heap()',
            'return LegacyDerbyHeapStorageProvider.INSTANCE;',
            'public static StorageProvider defaultProvider()',
            'return heap();',
            'return List.of(heap());'
    ], 'BuiltInStorageProviders heap/default mapping')

    delosdbStoragePhaseC2RequireTokens(errors, resolver, [
            'StorageProviderResolver builtIns()',
            'requireEnabled(BuiltInStorageProviders.defaultProviderName())',
            'public StorageProvider requireDefault()'
    ], 'StorageProviderResolver default heap resolution')

    delosdbStoragePhaseC2RequireTokens(errors, metadataResolver, [
            'TableDescriptor',
            'lcc.getTransactionExecute()',
            'table.getStorageProviderName()',
            'StorageProviderResolver.builtIns().requireEnabled(providerName)',
            'TableStorageMetadata.of(providerName, schema.getSchemaName(), table.getName())'
    ], 'TableStorageMetadataResolver catalog-to-provider mapping')

    delosdbStoragePhaseC2RequireTokens(errors, tableScan, [
            'import org.apache.derby.iapi.store.access.ScanController;',
            'import org.apache.derby.iapi.store.access.TransactionController;',
            'import org.apache.derby.iapi.types.DataValueDescriptor;',
            'import org.apache.derby.iapi.types.RowLocation;',
            'activation.getTransactionController()',
            'tc.openCompiledScan(',
            'TransactionController.OPENMODE_FORUPDATE',
            'TransactionController.OPENMODE_USE_UPDATE_LOCKS',
            'scanController.fetchNext(candidate.getRowArray())',
            'scanController.fetchLocation(rl)'
    ], 'TableScanResultSet real Derby scan mapping')

    delosdbStoragePhaseC2RequireTokens(errors, rowChanger, [
            'import org.apache.derby.iapi.store.access.ConglomerateController;',
            'import org.apache.derby.iapi.store.access.TransactionController;',
            'import org.apache.derby.iapi.types.DataValueDescriptor;',
            'import org.apache.derby.iapi.types.RowLocation;',
            'TransactionController.ISOLATION_READ_UNCOMMITTED',
            'TransactionController.ISOLATION_READ_COMMITTED',
            'TransactionController.ISOLATION_REPEATABLE_READ',
            'TransactionController.ISOLATION_SERIALIZABLE',
            'tc.openCompiledConglomerate(',
            'tc.openConglomerate(',
            'TransactionController.OPENMODE_FORUPDATE',
            'TransactionController.OPENMODE_LOCK_NOWAIT',
            'EngineStoreRowLocationBridge.requireEngineRowLocation(baseCC.newRowLocationTemplate())',
            'baseCC.insertAndFetchLocation(baseRow.getRowArray(), baseRowLocation)',
            'baseCC.insert(baseRow.getRowArray())',
            'baseCC.delete(baseRowLocation)',
            'baseCC.replace(baseRowLocation,'
    ], 'RowChangerImpl real Derby mutation mapping')

    delosdbStoragePhaseC2RequireTokens(errors, indexChanger, [
            'ConglomerateController',
            'RowLocation',
            'insert(',
            'delete(',
            'update('
    ], 'IndexChanger index-maintenance side of heap mapping')

    delosdbStoragePhaseC2RequireTokens(errors, engineRowLocationBridge, [
            'implements RowLocation, RefDataValue',
            'StoreRowLocation unwrapStoreRowLocation()',
            'return new EngineRowLocationAdapter(new HeapRowLocation())',
            'return new EngineRowLocationAdapter(storeRowLocation)',
            'StoreTypeUtil.compare('
    ], 'EngineStoreRowLocationBridge row-identity adapter')

    delosdbStoragePhaseC2RequireTokens(errors, engineStoreTypeSupport, [
            'implements StoreTypeSupport',
            'newRowLocation(Object storeRowLocation)',
            'EngineStoreRowLocationBridge.requireEngineRowLocation(storeRowLocation)',
            'newLocatedRow(Object columnValues, Object rowLocation)',
            'flattenLocatedRow(Object columnValues, Object rowLocation)'
    ], 'EngineStoreTypeSupport store-neutral value bridge')

    delosdbStoragePhaseC2RequireTokens(errors, storeRowLocation, [
            'interface StoreRowLocation extends StoreDataValue',
            'unwrapStoreRowLocation()'
    ], 'StoreRowLocation kernel contract')

    if (versionedProvider.exists() && heapProvider.exists()) {
        def heapText = heapProvider.text
        def versionedTokens = ['VersionedStorageProvider', 'VersionedTable', 'VersionedScan', 'VersionedTransactionCoordinator']
        def heapVersionedTokens = versionedTokens.findAll { token -> heapText.contains(token) }
        if (!heapVersionedTokens.isEmpty()) {
            errors << 'C2 heap mapping must not import or mention MVCC operational SPI: ' + heapVersionedTokens.join(', ')
        }
    }

    def engineStoreCounts = delosdbStoragePhaseC2StoreSourceCounts('delosdb-engine')
    def storageDerbyCounts = delosdbStoragePhaseC2StoreSourceCounts('delosdb-storage-derby')
    lines << ''
    lines << 'Relocated Derby store ownership:'
    lines << "  delosdb-storage-derby iapi.store sources: ${storageDerbyCounts.iapi}"
    lines << "  delosdb-storage-derby impl.store sources: ${storageDerbyCounts.impl}"
    lines << "  delosdb-engine iapi.store sources        : ${engineStoreCounts.iapi}"
    lines << "  delosdb-engine impl.store sources        : ${engineStoreCounts.impl}"
    if (storageDerbyCounts.iapi == 0 || storageDerbyCounts.impl == 0) {
        errors << 'C2 heap mapping cannot be trusted because delosdb-storage-derby no longer owns the relocated Derby store sources'
    }
    if (engineStoreCounts.iapi != 0 || engineStoreCounts.impl != 0) {
        errors << 'C2 must not move relocated Derby store sources back into delosdb-engine'
    }

    def sqlBridgeRefs = delosdbStoragePhaseC2FilesContaining(engineFiles, ['VersionedStorageSqlBridge'])
    lines << ''
    lines << "VersionedStorageSqlBridge engine refs : ${sqlBridgeRefs.isEmpty() ? 'none' : sqlBridgeRefs.join(', ')}"
    if (!sqlBridgeRefs.contains('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')) {
        lines << '  note: bridge reference list is informational; C2 does not retire the transitional MVCC SQL bridge.'
    }

    def forbiddenHeapMappingNames = [
            'HeapDelosStorageEngine.java',
            'HeapTableAccess.java',
            'DerbyHeapTableAccess.java',
            'StorageExecutionProfile.java',
            'TableAccessProfile.java'
    ] as Set
    def forbiddenMappingFiles = fileTree(rootProject.projectDir).matching {
        include '**/*.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/__MACOSX/**'
    }.files.findAll { sourceFile -> forbiddenHeapMappingNames.contains(sourceFile.name) }
            .collect { delosdbStoragePhaseC2RelPath(it) }.sort()
    lines << "New heap facade/profile candidates    : ${forbiddenMappingFiles.isEmpty() ? 'none' : forbiddenMappingFiles.join(', ')}"
    if (!forbiddenMappingFiles.isEmpty()) {
        errors << 'C2 must remain a heap mapping proof, not introduce a new facade/profile island: ' + forbiddenMappingFiles.join(', ')
    }

    lines << ''
    lines << "result                                : ${errors.isEmpty() ? 'PASS' : 'FAIL'}"
    if (!errors.isEmpty()) {
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "- ${it}" }
    }

    [lines: lines, errors: errors]
}

tasks.register('storagePhaseC2HeapMappingReport') {
    group = 'verification'
    description = 'Writes the Phase C2 heap mapping proof report.'
    dependsOn 'verifyStoragePhaseC1ContractShape'
    outputs.file(delosdbStoragePhaseC2ReportFile)
    doLast {
        def result = delosdbStoragePhaseC2HeapMapping()
        def reportFile = delosdbStoragePhaseC2ReportFile.get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${reportFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException('Phase C2 heap mapping check failed; see ' + reportFile)
        }
    }
}

tasks.register('verifyStoragePhaseC2HeapMapping') {
    group = 'verification'
    description = 'Verifies the Phase C2 Derby heap mapping proof.'
    dependsOn 'storagePhaseC2HeapMappingReport'
}
