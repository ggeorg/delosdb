// Phase C26 consolidation and cleanup.
// This phase adds no new runtime behavior. It records and verifies the C19-C25
// boundary so later route-replacement work starts from an honest baseline.

ext.delosdbStoragePhaseC26ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC26ReportFile =
        ext.delosdbStoragePhaseC26ReportDir.map { it.file('storage-phase-c26-consolidation.txt') }

ext.delosdbStoragePhaseC26RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC26RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC26RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC26ForbidTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        return
    }
    def text = sourceFile.text
    tokens.each { token ->
        if (text.contains(token)) {
            errors << "${label} must not contain forbidden token: ${token}"
        }
    }
}

ext.delosdbStoragePhaseC26Proof = {
    def errors = []
    def lines = []

    def buildFile = file('build.gradle')
    def closeoutDoc = file('docs/storage-phase-c19-c25-closeout.md')
    def bridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def classifier = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/DelosVersionedStorageQueryTreeClassifier.java')
    def mvccAdapter = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/storetypes/EngineMvccTableAccess.java')
    def heapProof = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/storetypes/EngineHeapTableAccessProof.java')
    def kernelTypesRoot = file('delosdb-engine-kernel/src/main/java/org/apache/derby/iapi/store/types')

    delosdbStoragePhaseC26RequireTokens(errors, buildFile, [
            "apply from: file('gradle/storage-phase-c25-first-regex-deletion.gradle')",
            "apply from: file('gradle/storage-phase-c26-consolidation.gradle')"
    ], 'root build Phase C26 wiring')

    if (buildFile.exists()) {
        def text = buildFile.text
        def c25 = text.indexOf("apply from: file('gradle/storage-phase-c25-first-regex-deletion.gradle')")
        def c26 = text.indexOf("apply from: file('gradle/storage-phase-c26-consolidation.gradle')")
        if (c25 < 0 || c26 < 0 || c26 < c25) {
            errors << 'C26 apply must appear after C25 in build.gradle'
        }
    }

    delosdbStoragePhaseC26RequireTokens(errors, closeoutDoc, [
            'C19 — review gaps closed',
            'C20 — store-neutral table-access capability contracts',
            'C21 — MVCC equality SELECT through DelosFilterableTableAccess',
            'C22 — Derby heap compile-time honesty proof',
            'C23 — MVCC UPDATE/DELETE through scan-produced row identities',
            'C24 — Derby JavaCC / QueryTreeNode classifier proof',
            'C25 — first regex route deletion',
            'EmbedStatement -> VersionedStorageSqlBridge.tryExecute(...)',
            'Remaining regex routes are temporary fallbacks',
            'They do not yet move MVCC behind Derby binder/compiler/table metadata'
    ], 'C19-C25 closeout document')

    [
            'DelosTableAccess.java',
            'DelosFilterableTableAccess.java',
            'DelosIndexableTableAccess.java',
            'DelosMutableTableAccess.java',
            'DelosAccessContext.java',
            'DelosContextKey.java',
            'DelosRowIdentity.java',
            'DelosPredicate.java',
            'DelosScan.java'
    ].each { name ->
        if (!new File(kernelTypesRoot, name).exists()) {
            errors << "missing C20 kernel contract: ${delosdbStoragePhaseC26RelPath(new File(kernelTypesRoot, name))}"
        }
    }

    if (kernelTypesRoot.exists()) {
        kernelTypesRoot.eachFileRecurse { sourceFile ->
            if (sourceFile.name.endsWith('.java')) {
                def text = sourceFile.text
                if (text.contains('io.github.ggeorg.delosdb.spi.storage.versioned')) {
                    errors << "kernel contract imports MVCC SPI: ${delosdbStoragePhaseC26RelPath(sourceFile)}"
                }
                if (text.contains('org.apache.derby.impl.store')) {
                    errors << "kernel contract imports Derby impl/store: ${delosdbStoragePhaseC26RelPath(sourceFile)}"
                }
            }
        }
    }

    if (new File(kernelTypesRoot, 'DelosStorageEngine.java').exists()) {
        errors << 'C26 boundary violation: DelosStorageEngine must not exist'
    }
    if (file('delosdb-engine/src/main/java/org/apache/derby/impl/store').exists()) {
        errors << 'C26 boundary violation: engine must not add org/apache/derby/impl/store sources'
    }

    delosdbStoragePhaseC26RequireTokens(errors, mvccAdapter, [
            'implements DelosFilterableTableAccess, DelosIndexableTableAccess, DelosMutableTableAccess',
            'public DelosScan scan(',
            'mutableFilters.remove(equality.predicate())',
            'public DelosMutationResult update(',
            'public DelosMutationResult delete(',
            'public DelosIndexAccess openIndex('
    ], 'C21/C23 MVCC table-access adapter')

    delosdbStoragePhaseC26RequireTokens(errors, heapProof, [
            'implements DelosFilterableTableAccess, DelosIndexableTableAccess, DelosMutableTableAccess',
            'TransactionController',
            'ScanController',
            'ConglomerateController',
            'RowLocation',
            'StoreRowLocation',
            'UnsupportedOperationException'
    ], 'C22 heap honesty proof adapter')

    delosdbStoragePhaseC26RequireTokens(errors, classifier, [
            'compilerContext.getParser().parseStatement(sql)',
            'parsed instanceof CursorNode cursor',
            'select.whereClause instanceof BinaryRelationalOperatorNode comparison',
            'ColumnReference column',
            'ConstantNode literal',
            'new SelectWhereEqualsRoute('
    ], 'C24 Derby JavaCC / QueryTreeNode classifier')
    delosdbStoragePhaseC26ForbidTokens(errors, classifier, [
            'java.util.regex.Pattern',
            'java.util.regex.Matcher',
            'Pattern.compile('
    ], 'C24 classifier')

    delosdbStoragePhaseC26RequireTokens(errors, bridge, [
            'Optional<PlannedRoute> javaCcRoute = routeStatementWithJavaCcQueryTree(normalizedSql)',
            'DelosVersionedStorageQueryTreeClassifier.selectWhereEquals(normalizedSql)',
            'ROUTE_CLASSIFIER_JAVACC_QUERY_TREE',
            'private static final Pattern SELECT_WHERE_RANGE',
            'private static final Pattern SELECT_WHERE_BETWEEN',
            'private static final Pattern SELECT_ALL',
            'private static final Pattern SELECT_COUNT',
            'tableAccess.scan(',
            'DelosRowIdentity rowIdentity',
            'tableAccess.update(',
            'tableAccess.delete('
    ], 'VersionedStorageSqlBridge final C25 routing and contract mutation shape')

    if (bridge.exists()) {
        def text = bridge.text
        if (text.contains('private static final Pattern SELECT_WHERE_EQUALS')) {
            errors << 'C25 closeout regression: SELECT_WHERE_EQUALS regex field must remain deleted'
        }
        def javaCcIndex = text.indexOf('Optional<PlannedRoute> javaCcRoute = routeStatementWithJavaCcQueryTree(normalizedSql)')
        def regexIndex = text.indexOf('Matcher create = CREATE_TABLE.matcher(normalizedSql)')
        if (javaCcIndex < 0 || regexIndex < 0 || javaCcIndex > regexIndex) {
            errors << 'C26 requires JavaCC route attempt before remaining regex fallback routes'
        }
        if (!text.contains('Pattern.compile(')) {
            errors << 'C26 expects remaining regex fallback routes to stay until each has a QueryTreeNode replacement'
        }
    }

    lines << 'DelosDB Storage Phase C26 Consolidation'
    lines << '========================================'
    lines << ''
    lines << 'Purpose:'
    lines << '  Consolidate the green C19-C25 table-access/routing slice without adding behavior.'
    lines << ''
    lines << 'Verified closed slice:'
    lines << '  C19 review gaps closed.'
    lines << '  C20 store-neutral capability contracts exist in engine-kernel.'
    lines << '  C21 MVCC equality SELECT uses DelosFilterableTableAccess.'
    lines << '  C22 heap contract honesty remains compile-time only.'
    lines << '  C23 MVCC mutation uses scan-produced DelosRowIdentity values.'
    lines << '  C24 Derby JavaCC / QueryTreeNode classifier exists and does not use regex.'
    lines << '  C25 deletes exactly the SELECT equality regex route and keeps remaining fallbacks.'
    lines << ''
    lines << 'Honest boundary:'
    lines << '  MVCC still enters through EmbedStatement -> VersionedStorageSqlBridge.tryExecute(...).'
    lines << '  This is not full Derby binder/compiler/executor integration yet.'
    lines << ''
    lines << 'Next safe move:'
    lines << '  Add one more QueryTreeNode route first, then delete only its matching regex fallback.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC26ConsolidationReport') {
    group = 'verification'
    description = 'Writes the Phase C26 C19-C25 consolidation proof report.'
    dependsOn 'verifyStoragePhaseC25FirstRegexDeletion'
    outputs.file(delosdbStoragePhaseC26ReportFile)
    doLast {
        def result = delosdbStoragePhaseC26Proof()
        def outputFile = delosdbStoragePhaseC26ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C26 consolidation failed; see ${outputFile}")
        }
    }
}

tasks.register('verifyStoragePhaseC26Consolidation') {
    group = 'verification'
    description = 'Verifies the Phase C26 C19-C25 consolidation and cleanup boundary.'
    dependsOn 'storagePhaseC26ConsolidationReport'
    doLast {
        println 'Verified Phase C26 consolidation; next route replacement must start with QueryTreeNode classification, not regex deletion'
    }
}
