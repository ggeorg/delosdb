import org.gradle.api.tasks.compile.JavaCompile

// Phase F4 native MVCC SELECT equality proof.
// This keeps generated activation bytecode unchanged and proves the existing
// ResultSetFactory table-scan seam can execute a delos_mvcc equality scan via
// DelosTableScanResultSet -> EngineMvccTableAccess.scan(...).

ext.delosdbStoragePhaseF4ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseF4ReportFile =
        ext.delosdbStoragePhaseF4ReportDir.map { it.file('storage-phase-f4-native-select-equality.txt') }
ext.delosdbStoragePhaseF4SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-f4-native-select-equality-smoke')

ext.delosdbStoragePhaseF4RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseF4RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF4RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseF4RejectTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF4RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def present = tokens.findAll { token -> text.contains(token) }
    if (!present.isEmpty()) {
        errors << "${label} contains forbidden tokens: ${present.join(', ')}"
    }
}

ext.delosdbStoragePhaseF4ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseF4RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseF4Classpath = {
    files(
            delosdbStoragePhaseF4SmokeClassesDir,
            delosdbStoragePhaseF4ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseF4ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseF4ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseF4ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseF4RuntimeJars())
}

ext.delosdbStoragePhaseF4Proof = {
    def errors = []
    def lines = []

    def buildFile = file('build.gradle')
    def delosResultSet = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosTableScanResultSet.java')
    def lookup = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosTableScanProviderLookup.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def genericFactory = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/GenericResultSetFactory.java')
    def fromBaseTable = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/FromBaseTable.java')
    def resultSetFactory = file('delosdb-engine/src/main/java/org/apache/derby/iapi/sql/execute/ResultSetFactory.java')
    def f4Gradle = file('gradle/storage-phase-f4-native-select-equality.gradle')
    def smokeSource = file('dev/storage-phase-f4-native-select-equality-smoke/src/main/java/delosdb/smoke/StoragePhaseF4NativeSelectEqualitySmoke.java')
    def f4Doc = file('docs/storage-phase-f4-native-select-equality.md')
    def planDoc = file('docs/storage-phase-f-native-integration-plan.md')
    def roadmap = file('docs/ROADMAP.md')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')

    delosdbStoragePhaseF4RequireTokens(errors, buildFile, [
            "apply from: file('gradle/storage-phase-f3-delos-table-scan-skeleton.gradle')",
            "apply from: file('gradle/storage-phase-f4-native-select-equality.gradle')"
    ], 'root build F4 wiring')
    if (buildFile.exists()) {
        def text = buildFile.text
        def f32 = text.indexOf("apply from: file('gradle/storage-phase-f3-delos-table-scan-skeleton.gradle')")
        def f4 = text.indexOf("apply from: file('gradle/storage-phase-f4-native-select-equality.gradle')")
        if (f32 < 0 || f4 < 0 || f4 < f32) {
            errors << 'F4 apply must appear after F3.2 in build.gradle'
        }
    }

    delosdbStoragePhaseF4RequireTokens(errors, delosResultSet, [
            'NATIVE_SELECT_EQUALITY_PROPERTY',
            'createIfEnabled(TableScanResultSetParameters params)',
            'equalityPredicates(TableDescriptor tableDescriptor)',
            'qualifier.getColumnId()',
            'tableDescriptor.getColumnDescriptor(qualifier.getColumnId() + 1)',
            'qualifier.getOrderable()',
            'DelosPredicate.equalsTo',
            'VersionedStorageSqlBridge.openNativeExecutionTableAccess',
            'nativeAccess.tableAccess().scan',
            'materialize(DelosRow delosRow, ExecRow resultRow)',
            'EngineMvccTableAccess.nativeValue'
    ], 'DelosTableScanResultSet F4 implementation')
    delosdbStoragePhaseF4RequireTokens(errors, lookup, [
            'FACTORY_NATIVE_SELECT_EQUALITY_PROPERTY',
            'NATIVE_SELECT_EQUALITY_PROPERTY'
    ], 'provider lookup F4 property export')
    delosdbStoragePhaseF4RequireTokens(errors, sqlBridge, [
            'resetRouteClassifierForTesting()',
            'openNativeExecutionTableAccess',
            'NativeExecutionTableAccess',
            'table.tableAccess()',
            'delosAccessContext(statementTx)'
    ], 'native table-access bridge seam')
    delosdbStoragePhaseF4RejectTokens(errors, sqlBridge, [
            'F4_SELECT_WHERE_EQUALS',
            'NATIVE_SELECT_REGEX'
    ], 'no new F4 SQL route markers in bridge')
    delosdbStoragePhaseF4RequireTokens(errors, genericFactory, [
            'DelosTableScanResultSet.createIfEnabled(params)'
    ], 'GenericResultSetFactory existing branch')
    delosdbStoragePhaseF4RejectTokens(errors, fromBaseTable, [
            'getDelosTableScanResultSet',
            'NATIVE_SELECT_EQUALITY_PROPERTY'
    ], 'FromBaseTable unchanged by F4')
    delosdbStoragePhaseF4RejectTokens(errors, resultSetFactory, [
            'getDelosTableScanResultSet'
    ], 'ResultSetFactory interface unchanged by F4')
    delosdbStoragePhaseF4RequireTokens(errors, f4Gradle, [
            'storagePhaseF4NativeSelectEqualitySmoke',
            'verifyStoragePhaseF4NativeSelectEquality'
    ], 'F4 Gradle proof wiring')
    delosdbStoragePhaseF4RequireTokens(errors, smokeSource, [
            'SELECT * FROM APP.',
            'WHERE id = ?',
            'FACTORY_NATIVE_SELECT_EQUALITY_PROPERTY',
            'VersionedStorageSqlBridge.resetRouteClassifierForTesting()',
            'VersionedStorageSqlBridge.lastRouteClassifierForTesting().isEmpty()',
            'Expected native equality predicate to filter out id=2'
    ], 'F4 smoke proof')
    delosdbStoragePhaseF4RequireTokens(errors, f4Doc, [
            'F4 — native MVCC SELECT equality',
            'Qualifier.getColumnId()',
            'TableDescriptor.getColumnDescriptor(int)',
            'EngineMvccTableAccess.scan(...)',
            'Derby ExecRow materialization',
            'no bridge route expansion'
    ], 'F4 document')
    delosdbStoragePhaseF4RequireTokens(errors, planDoc, [
            'F4 landed',
            'native MVCC SELECT equality',
            'F5 — native INSERT'
    ], 'Phase F plan after F4')
    delosdbStoragePhaseF4RequireTokens(errors, roadmap, [
            'F4 landed',
            'Next: F5 — native INSERT'
    ], 'ROADMAP after F4')
    delosdbStoragePhaseF4RequireTokens(errors, cleanupScript, [
            'storage-phase-f4-native-select-equality-db'
    ], 'F4 smoke DB cleanup entry')

    lines << 'DelosDB Storage Phase F4 Native SELECT Equality Proof'
    lines << '======================================================'
    lines << ''
    lines << 'Purpose:'
    lines << '  Prove a Derby prepared SELECT equality can execute through DelosTableScanResultSet and EngineMvccTableAccess.scan(...).'
    lines << ''
    lines << 'Verified implementation shape:'
    lines << '  Generated activation still calls the existing ResultSetFactory table-scan method shape.'
    lines << '  No FromBaseTable.generate(), AsmJava, or ResultSetFactory interface change is introduced.'
    lines << '  Qualifier.getColumnId() is resolved through TableDescriptor.getColumnDescriptor(int).'
    lines << '  Qualifier.getOrderable() crosses as StoreDataValue into DelosPredicate.equalsTo(...).'
    lines << '  DelosTableScanResultSet calls EngineMvccTableAccess.scan(...) and materializes rows into Derby ExecRow output.'
    lines << '  The prepared SELECT proof asserts VersionedStorageSqlBridge.tryExecute(...) was not called for the native path.'
    lines << ''
    lines << 'Next step:'
    lines << '  F5 moves INSERT onto the native provider-owned table-access path.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseF4NativeSelectEqualityReport') {
    group = 'verification'
    description = 'Writes the Phase F4 native MVCC SELECT equality proof report.'
    dependsOn 'verifyStoragePhaseF3DelosTableScanSkeleton'
    outputs.file(delosdbStoragePhaseF4ReportFile)
    doLast {
        def result = delosdbStoragePhaseF4Proof()
        def outputFile = delosdbStoragePhaseF4ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase F4 native MVCC SELECT equality proof failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseF4NativeSelectEqualitySmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase F4 native MVCC SELECT equality smoke test.'
    source = files('dev/storage-phase-f4-native-select-equality-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseF4SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseF4Classpath()
}

tasks.register('storagePhaseF4NativeSelectEqualitySmoke', JavaExec) {
    dependsOn 'storagePhaseF4NativeSelectEqualityReport', 'compileStoragePhaseF4NativeSelectEqualitySmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase F4 native MVCC SELECT equality smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseF4NativeSelectEqualitySmoke'
    classpath = delosdbStoragePhaseF4Classpath()
}

tasks.register('verifyStoragePhaseF4NativeSelectEquality') {
    group = 'verification'
    description = 'Verifies Phase F4 native MVCC SELECT equality proof.'
    dependsOn 'storagePhaseF4NativeSelectEqualityReport', 'storagePhaseF4NativeSelectEqualitySmoke'
    doLast {
        println 'Verified Phase F4 native MVCC SELECT equality; next step is F5 native INSERT'
    }
}
