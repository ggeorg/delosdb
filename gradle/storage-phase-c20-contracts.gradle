import org.gradle.api.tasks.compile.JavaCompile

// Phase C20 real table-access capability contracts.
//
// C20 is the first post-review contract slice.  It adds the store-neutral
// Delos table-access family in engine-kernel only.  It does not route MVCC
// through the contracts yet and does not touch Derby heap execution.

ext.delosdbStoragePhaseC20ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC20ReportFile =
        ext.delosdbStoragePhaseC20ReportDir.map { it.file('storage-phase-c20-contracts.txt') }
ext.delosdbStoragePhaseC20SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c20-contracts-smoke')

ext.delosdbStoragePhaseC20RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC20RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC20RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC20JavaFiles = { String projectPath ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [] as Set<File>
    }
    fileTree(sourceRoot).matching { include '**/*.java' }.files as Set<File>
}

ext.delosdbStoragePhaseC20ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC20Classpath = {
    files(
            delosdbStoragePhaseC20SmokeClassesDir,
            delosdbStoragePhaseC20ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseC20ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'))
}

ext.delosdbStoragePhaseC20Proof = {
    def errors = []
    def lines = []

    def storeTypesRoot = file('delosdb-engine-kernel/src/main/java/org/apache/derby/iapi/store/types')
    def moduleInfo = file('delosdb-engine-kernel/src/main/java/module-info.java')
    def smokeSource = file('dev/storage-phase-c20-contracts-smoke/src/main/java/io/github/ggeorg/delosdb/storage/c20/StoragePhaseC20ContractsSmoke.java')
    def engineImplStoreSourceRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')

    def expectedContractFiles = [
            'DelosFilterableTableAccess.java',
            'DelosIndexableTableAccess.java',
            'DelosMutableTableAccess.java',
            'DelosAccessContext.java',
            'DelosContextKey.java',
            'DelosRowIdentity.java',
            'DelosRow.java',
            'DelosTableIdentity.java',
            'DelosTableShape.java',
            'DelosTableCapabilities.java',
            'DelosTableCapability.java',
            'DelosTableAccessFamily.java',
            'DelosPredicate.java',
            'DelosPredicateOperator.java',
            'DelosProjection.java',
            'DelosIndexAccess.java',
            'DelosIndexStats.java',
            'DelosRange.java',
            'DelosMutationResult.java'
    ]

    expectedContractFiles.each { fileName ->
        def sourceFile = file("${storeTypesRoot}/${fileName}")
        if (!sourceFile.exists()) {
            errors << "missing C20 contract file: ${delosdbStoragePhaseC20RelPath(sourceFile)}"
        }
    }

    delosdbStoragePhaseC20RequireTokens(errors,
            file("${storeTypesRoot}/DelosTableAccess.java"), [
            'public interface DelosTableAccess',
            'DelosTableIdentity identity()',
            'DelosTableShape rowShape()',
            'DelosTableCapabilities capabilities()'
    ], 'base DelosTableAccess contract')

    if (file("${storeTypesRoot}/DelosTableAccess.java").exists()) {
        def baseText = file("${storeTypesRoot}/DelosTableAccess.java").text
        ['scan(', 'insert(', 'update(', 'delete(', 'openIndex('].each { token ->
            if (baseText.contains(token)) {
                errors << "DelosTableAccess base contract must not expose physical method: ${token}"
            }
        }
    }

    delosdbStoragePhaseC20RequireTokens(errors,
            file("${storeTypesRoot}/DelosFilterableTableAccess.java"), [
            'public interface DelosFilterableTableAccess extends DelosTableAccess',
            'List<DelosPredicate> mutableFilters',
            'DelosProjection projection',
            'remove only predicates they can push'
    ], 'filterable access contract')

    delosdbStoragePhaseC20RequireTokens(errors,
            file("${storeTypesRoot}/DelosMutableTableAccess.java"), [
            'public interface DelosMutableTableAccess extends DelosTableAccess',
            'insert(DelosAccessContext context, DelosRow row)',
            'update(DelosAccessContext context,',
            'DelosRowIdentity rowIdentity',
            'delete(DelosAccessContext context, DelosRowIdentity rowIdentity)',
            'does not accept SQL text'
    ], 'mutable access contract')

    delosdbStoragePhaseC20RequireTokens(errors,
            file("${storeTypesRoot}/DelosIndexableTableAccess.java"), [
            'public interface DelosIndexableTableAccess extends DelosTableAccess',
            'DelosIndexAccess openIndex(DelosAccessContext context, String indexName)'
    ], 'indexable access contract')

    delosdbStoragePhaseC20RequireTokens(errors,
            file("${storeTypesRoot}/DelosAccessContext.java"), [
            'boolean physicalAccessAllowed()',
            '<T> Optional<T> find(DelosContextKey<T> key)',
            '<T> T require(DelosContextKey<T> key)',
            'typed keys',
            'physical-access gate is universal'
    ], 'typed DelosAccessContext contract')

    delosdbStoragePhaseC20RequireTokens(errors,
            file("${storeTypesRoot}/DelosRowIdentity.java"), [
            'public interface DelosRowIdentity',
            'Object nativeIdentity()',
            'Opaque provider-native row identity',
            'no cross-provider equality semantics'
    ], 'opaque DelosRowIdentity contract')

    delosdbStoragePhaseC20RequireTokens(errors,
            smokeSource, [
            'StorelessBaseOnlyAccess implements DelosTableAccess',
            '!(storeless instanceof DelosFilterableTableAccess)',
            '!(storeless instanceof DelosIndexableTableAccess)',
            '!(storeless instanceof DelosMutableTableAccess)',
            'mutableFilters',
            'it.remove()',
            'DelosContextKey.of(',
            'DelosRowIdentity identity',
            'mutation must receive the row identity directly'
    ], 'Phase C20 contracts smoke')

    delosdbStoragePhaseC20RequireTokens(errors, moduleInfo, [
            'exports org.apache.derby.iapi.store.types;'
    ], 'engine-kernel module exports store types')

    def forbiddenNames = [
            'DelosStorageEngine.java',
            'DelosScannableTableAccess.java',
            'DelosProjectableFilterableTableAccess.java',
            'DelosMutationAccess.java',
            'TableAccessProfile.java',
            'StorageExecutionProfile.java',
            'StorelessStorageProvider.java',
            'StorelessVersionedStorageProvider.java'
    ] as Set
    def forbiddenFiles = fileTree(rootProject.projectDir).matching {
        include '**/*.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
        exclude '**/.idea/**'
        exclude '**/__MACOSX/**'
    }.files.findAll { sourceFile ->
        forbiddenNames.contains(sourceFile.name)
    }.collect { delosdbStoragePhaseC20RelPath(it) }.sort()
    if (!forbiddenFiles.isEmpty()) {
        errors << 'C20 must keep the capability surface small and must not add forbidden abstractions: ' + forbiddenFiles
    }

    def kernelContracts = expectedContractFiles.collect { file("${storeTypesRoot}/${it}") }.findAll { it.exists() }
    def forbiddenImports = kernelContracts.findAll { sourceFile ->
        def text = sourceFile.text
        text.contains('io.github.ggeorg.delosdb.storage.mvcc') ||
                text.contains('org.apache.derby.impl.store') ||
                text.contains('org.apache.derby.iapi.store.raw') ||
                text.contains('org.apache.derby.iapi.sql')
    }.collect { delosdbStoragePhaseC20RelPath(it) }.sort()
    if (!forbiddenImports.isEmpty()) {
        errors << 'C20 engine-kernel contracts must not import MVCC, Derby impl/store, raw store, or SQL execution packages: '
                + forbiddenImports
    }

    if (engineImplStoreSourceRoot.exists()) {
        errors << 'C20 must not add engine-side org/apache/derby/impl/store sources: '
                + delosdbStoragePhaseC20RelPath(engineImplStoreSourceRoot)
    }

    def storelessRoot = file('delosdb-storeless/src/main/java')
    if (storelessRoot.exists()) {
        def storelessProviderLeaks = fileTree(storelessRoot).matching { include '**/*.java' }.files.findAll { sourceFile ->
            def text = sourceFile.text
            text.contains('implements StorageProvider') ||
                    text.contains('implements VersionedStorageProvider') ||
                    text.contains('implements DelosFilterableTableAccess') ||
                    text.contains('implements DelosIndexableTableAccess') ||
                    text.contains('implements DelosMutableTableAccess')
        }.collect { delosdbStoragePhaseC20RelPath(it) }.sort()
        if (!storelessProviderLeaks.isEmpty()) {
            errors << 'Storeless must remain a no-store/base-only constraint after C20: ' + storelessProviderLeaks
        }
    }

    lines << 'DelosDB Storage Phase C20 Contracts'
    lines << '==================================='
    lines << ''
    lines << 'C20 mechanic:'
    lines << '  add the real store-neutral Delos table-access contract family in engine-kernel.'
    lines << ''
    lines << 'Contracts added:'
    expectedContractFiles.each { lines << "  - org.apache.derby.iapi.store.types.${it - '.java'}" }
    lines << ''
    lines << 'Boundaries preserved:'
    lines << '  no DelosStorageEngine giant interface.'
    lines << '  no DelosScannableTableAccess or DelosProjectableFilterableTableAccess tier.'
    lines << '  no MVCC imports in engine-kernel contracts.'
    lines << '  no Derby impl/store imports in engine-kernel contracts.'
    lines << '  no heap SQL routing changes.'
    lines << '  no regex route deletion.'
    lines << ''
    lines << 'Next step:'
    lines << '  C21 should build the MVCC adapter and route one SELECT execution path through DelosFilterableTableAccess.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC20ContractsReport') {
    group = 'verification'
    description = 'Writes the Phase C20 table-access contract report.'
    doLast {
        def result = delosdbStoragePhaseC20Proof()
        def outputFile = delosdbStoragePhaseC20ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C20 contracts failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC20ContractsSmoke', JavaCompile) {
    dependsOn ':delosdb-engine-kernel:compileDelosDbEngineKernel', 'processDerbyResources'
    group = 'verification'
    description = 'Compiles the Phase C20 table-access contracts smoke test.'
    source = files('dev/storage-phase-c20-contracts-smoke/src/main/java')
    destinationDirectory = delosdbStoragePhaseC20SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC20Classpath()
}

tasks.register('storagePhaseC20ContractsSmoke', JavaExec) {
    dependsOn 'compileStoragePhaseC20ContractsSmoke', 'processDerbyResources'
    group = 'verification'
    description = 'Runs the Phase C20 table-access contracts smoke test.'
    classpath = delosdbStoragePhaseC20Classpath()
    mainClass = 'io.github.ggeorg.delosdb.storage.c20.StoragePhaseC20ContractsSmoke'
}

tasks.register('verifyStoragePhaseC20Contracts') {
    group = 'verification'
    description = 'Verifies the Phase C20 table-access contracts.'
    dependsOn 'storagePhaseC20ContractsReport', 'storagePhaseC20ContractsSmoke'
    doLast {
        println 'Verified Phase C20 table-access contracts; next step is C21 MVCC adapter plus one SELECT through the contract'
    }
}
