import org.gradle.api.tasks.compile.JavaCompile

// Phase F7 native MVCC UPDATE equality proof.
// This keeps generated activation bytecode unchanged and proves the existing
// ResultSetFactory UPDATE seam can execute delos_mvcc UPDATE through
// DelosUpdateResultSet -> EngineMvccTableAccess.update(...).

ext.delosdbStoragePhaseF7ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseF7ReportFile =
        ext.delosdbStoragePhaseF7ReportDir.map { it.file('storage-phase-f7-native-update-equality.txt') }
ext.delosdbStoragePhaseF7SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-f7-native-update-equality-smoke')

ext.delosdbStoragePhaseF7RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseF7RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF7RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseF7RejectTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF7RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def present = tokens.findAll { token -> text.contains(token) }
    if (!present.isEmpty()) {
        errors << "${label} contains forbidden tokens: ${present.join(', ')}"
    }
}

ext.delosdbStoragePhaseF7ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseF7RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseF7Classpath = {
    files(
            delosdbStoragePhaseF7SmokeClassesDir,
            delosdbStoragePhaseF7ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseF7ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseF7ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseF7ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseF7RuntimeJars())
}

ext.delosdbStoragePhaseF7Proof = {
    def errors = []
    def lines = []

    def buildFile = file('build.gradle')
    def delosUpdate = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosUpdateResultSet.java')
    def delosScan = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosTableScanResultSet.java')
    def lookup = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosTableScanProviderLookup.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def genericFactory = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/GenericResultSetFactory.java')
    def resultSetFactory = file('delosdb-engine/src/main/java/org/apache/derby/iapi/sql/execute/ResultSetFactory.java')
    def f7Gradle = file('gradle/storage-phase-f7-native-update-equality.gradle')
    def smokeSource = file('dev/storage-phase-f7-native-update-equality-smoke/src/main/java/delosdb/smoke/StoragePhaseF7NativeUpdateEqualitySmoke.java')
    def f7Doc = file('docs/storage-phase-f7-native-update-equality.md')
    def planDoc = file('docs/storage-phase-f-native-integration-plan.md')
    def roadmap = file('docs/ROADMAP.md')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')

    delosdbStoragePhaseF7RequireTokens(errors, buildFile, [
            "apply from: file('gradle/storage-phase-f6-native-delete-equality.gradle')",
            "apply from: file('gradle/storage-phase-f7-native-update-equality.gradle')"
    ], 'root build F7 wiring')
    if (buildFile.exists()) {
        def text = buildFile.text
        def f6 = text.indexOf("apply from: file('gradle/storage-phase-f6-native-delete-equality.gradle')")
        def f7 = text.indexOf("apply from: file('gradle/storage-phase-f7-native-update-equality.gradle')")
        if (f6 < 0 || f7 < 0 || f7 < f6) {
            errors << 'F7 apply must appear after F6 in build.gradle'
        }
    }

    delosdbStoragePhaseF7RequireTokens(errors, delosUpdate, [
            'NATIVE_UPDATE_EQUALITY_PROPERTY',
            'createIfEnabled(',
            'DelosTableScanResultSet.findIn(source)',
            'currentDelosRowIdentityForNativeMutation()',
            'replacementNativeValues(row)',
            'VersionedStorageSqlBridge.openNativeExecutionTableAccess',
            'nativeAccess.update(rowIdentity',
            'modifiedRowCount()'
    ], 'DelosUpdateResultSet F7 implementation')
    delosdbStoragePhaseF7RequireTokens(errors, delosScan, [
            'currentDelosRow',
            'currentDelosRowIdentityForNativeMutation()',
            'providerLookupForMutation()',
            'static Optional<DelosTableScanResultSet> findIn(NoPutResultSet resultSet)'
    ], 'DelosTableScanResultSet F7 mutation identity seam')
    delosdbStoragePhaseF7RequireTokens(errors, lookup, [
            'FACTORY_NATIVE_UPDATE_EQUALITY_PROPERTY',
            'NATIVE_UPDATE_EQUALITY_PROPERTY'
    ], 'provider lookup F7 property export')
    delosdbStoragePhaseF7RequireTokens(errors, sqlBridge, [
            'public long update(DelosRowIdentity rowIdentity, List<Object> nativeValues)',
            'DelosMutationResult result = tableAccess.update(',
            'DelosRow.withoutIdentity(List.copyOf(values))',
            'return result.affectedRows()'
    ], 'native update table-access seam')
    delosdbStoragePhaseF7RejectTokens(errors, sqlBridge, [
            'F7_UPDATE_WHERE_EQUALS',
            'NATIVE_UPDATE_REGEX'
    ], 'no new F7 SQL route markers in bridge')
    delosdbStoragePhaseF7RequireTokens(errors, genericFactory, [
            'DelosUpdateResultSet.createIfEnabled(',
            'return new UpdateResultSet(UpdateResultSetParameters.normal('
    ], 'GenericResultSetFactory UPDATE branch')
    delosdbStoragePhaseF7RejectTokens(errors, resultSetFactory, [
            'getDelosUpdateResultSet'
    ], 'ResultSetFactory interface unchanged by F7')
    delosdbStoragePhaseF7RequireTokens(errors, f7Gradle, [
            'storagePhaseF7NativeUpdateEqualitySmoke',
            'verifyStoragePhaseF7NativeUpdateEquality'
    ], 'F7 Gradle proof wiring')
    delosdbStoragePhaseF7RequireTokens(errors, smokeSource, [
            'UPDATE APP.',
            'SET value = ?',
            'WHERE id = ?',
            'FACTORY_NATIVE_UPDATE_EQUALITY_PROPERTY',
            'VersionedStorageSqlBridge.resetRouteClassifierForTesting()',
            'VersionedStorageSqlBridge.lastRouteClassifierForTesting().isEmpty()',
            'Expected F7 native MVCC UPDATE equality to affect one row',
            'Expected F7 native UPDATE equality to set id=1 to beta',
            'Expected F7 native UPDATE equality to leave id=2 visible'
    ], 'F7 smoke proof')
    delosdbStoragePhaseF7RequireTokens(errors, f7Doc, [
            'F7 — native UPDATE equality',
            'GenericResultSetFactory.getUpdateResultSet(...)',
            'DelosUpdateResultSet',
            'EngineMvccTableAccess.update(...)',
            'does not add any new bridge SQL route or regex route'
    ], 'F7 document')
    delosdbStoragePhaseF7RequireTokens(errors, planDoc, [
            'F7 landed',
            'native UPDATE equality',
            'F8 — bridge bypass strategy'
    ], 'Phase F plan after F7')
    delosdbStoragePhaseF7RequireTokens(errors, roadmap, [
            'F7 landed',
            'Next: F8 — bridge bypass'
    ], 'ROADMAP after F7')
    delosdbStoragePhaseF7RequireTokens(errors, cleanupScript, [
            'storage-phase-f7-native-update-equality-db'
    ], 'F7 smoke DB cleanup entry')

    lines << 'DelosDB Storage Phase F7 Native UPDATE Equality Proof'
    lines << '====================================================='
    lines << ''
    lines << 'Purpose:'
    lines << '  Prove a Derby prepared UPDATE equality can execute through a native Delos result set and EngineMvccTableAccess.update(...).'
    lines << ''
    lines << 'Verified implementation shape:'
    lines << '  Generated activation still calls the existing ResultSetFactory UPDATE method shape.'
    lines << '  No ResultSetFactory interface or generated bytecode method is added.'
    lines << '  GenericResultSetFactory branches by catalog provider metadata under the F7 proof property.'
    lines << '  DelosUpdateResultSet lets Derby compute the replacement source row.'
    lines << '  The native path carries DelosRowIdentity from DelosTableScanResultSet and calls EngineMvccTableAccess.update(...).'
    lines << '  The prepared UPDATE proof asserts VersionedStorageSqlBridge.tryExecute(...) was not called for the native path.'
    lines << ''
    lines << 'Next step:'
    lines << '  F8 makes bridge interception explicit/compatibility-only for native mode.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseF7NativeUpdateEqualityReport') {
    group = 'verification'
    description = 'Writes the Phase F7 native MVCC UPDATE equality proof report.'
    dependsOn 'verifyStoragePhaseF6NativeDeleteEquality'
    outputs.file(delosdbStoragePhaseF7ReportFile)
    doLast {
        def result = delosdbStoragePhaseF7Proof()
        def outputFile = delosdbStoragePhaseF7ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase F7 native MVCC UPDATE equality proof failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseF7NativeUpdateEqualitySmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase F7 native MVCC UPDATE equality smoke test.'
    source = files('dev/storage-phase-f7-native-update-equality-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseF7SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseF7Classpath()
}

tasks.register('storagePhaseF7NativeUpdateEqualitySmoke', JavaExec) {
    dependsOn 'storagePhaseF7NativeUpdateEqualityReport', 'compileStoragePhaseF7NativeUpdateEqualitySmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase F7 native MVCC UPDATE equality smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseF7NativeUpdateEqualitySmoke'
    classpath = delosdbStoragePhaseF7Classpath()
}

tasks.register('verifyStoragePhaseF7NativeUpdateEquality') {
    group = 'verification'
    description = 'Verifies Phase F7 native MVCC UPDATE equality proof.'
    dependsOn 'storagePhaseF7NativeUpdateEqualityReport', 'storagePhaseF7NativeUpdateEqualitySmoke'
    doLast {
        println 'Verified Phase F7 native MVCC UPDATE equality; next step is F8 bridge bypass strategy'
    }
}
