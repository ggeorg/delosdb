import org.gradle.api.tasks.compile.JavaCompile

// Phase F6 native MVCC DELETE equality proof.
// This keeps generated activation bytecode unchanged and proves the existing
// ResultSetFactory DELETE seam can execute delos_mvcc DELETE through
// DelosDeleteResultSet -> EngineMvccTableAccess.delete(...).

ext.delosdbStoragePhaseF6ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseF6ReportFile =
        ext.delosdbStoragePhaseF6ReportDir.map { it.file('storage-phase-f6-native-delete-equality.txt') }
ext.delosdbStoragePhaseF6SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-f6-native-delete-equality-smoke')

ext.delosdbStoragePhaseF6RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseF6RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF6RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseF6RejectTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF6RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def present = tokens.findAll { token -> text.contains(token) }
    if (!present.isEmpty()) {
        errors << "${label} contains forbidden tokens: ${present.join(', ')}"
    }
}

ext.delosdbStoragePhaseF6ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseF6RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseF6Classpath = {
    files(
            delosdbStoragePhaseF6SmokeClassesDir,
            delosdbStoragePhaseF6ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseF6ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseF6ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseF6ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseF6RuntimeJars())
}

ext.delosdbStoragePhaseF6Proof = {
    def errors = []
    def lines = []

    def buildFile = file('build.gradle')
    def delosDelete = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosDeleteResultSet.java')
    def delosScan = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosTableScanResultSet.java')
    def lookup = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosTableScanProviderLookup.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def genericFactory = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/GenericResultSetFactory.java')
    def resultSetFactory = file('delosdb-engine/src/main/java/org/apache/derby/iapi/sql/execute/ResultSetFactory.java')
    def f6Gradle = file('gradle/storage-phase-f6-native-delete-equality.gradle')
    def smokeSource = file('dev/storage-phase-f6-native-delete-equality-smoke/src/main/java/delosdb/smoke/StoragePhaseF6NativeDeleteEqualitySmoke.java')
    def f6Doc = file('docs/storage-phase-f6-native-delete-equality.md')
    def planDoc = file('docs/storage-phase-f-native-integration-plan.md')
    def roadmap = file('docs/ROADMAP.md')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')

    delosdbStoragePhaseF6RequireTokens(errors, buildFile, [
            "apply from: file('gradle/storage-phase-f5-native-insert.gradle')",
            "apply from: file('gradle/storage-phase-f6-native-delete-equality.gradle')"
    ], 'root build F6 wiring')
    if (buildFile.exists()) {
        def text = buildFile.text
        def f5 = text.indexOf("apply from: file('gradle/storage-phase-f5-native-insert.gradle')")
        def f6 = text.indexOf("apply from: file('gradle/storage-phase-f6-native-delete-equality.gradle')")
        if (f5 < 0 || f6 < 0 || f6 < f5) {
            errors << 'F6 apply must appear after F5 in build.gradle'
        }
    }

    delosdbStoragePhaseF6RequireTokens(errors, delosDelete, [
            'NATIVE_DELETE_EQUALITY_PROPERTY',
            'createIfEnabled(NoPutResultSet source, Activation activation)',
            'DelosTableScanResultSet.findIn(source)',
            'equalityPredicatesForNativeMutation()',
            'VersionedStorageSqlBridge.openNativeExecutionTableAccess',
            'nativeAccess.tableAccess().scan(',
            'DelosRowIdentity rowIdentity',
            'nativeAccess.delete(rowIdentity)',
            'modifiedRowCount()'
    ], 'DelosDeleteResultSet F6 implementation')
    delosdbStoragePhaseF6RequireTokens(errors, delosScan, [
            'providerLookupForMutation()',
            'equalityPredicatesForNativeMutation()',
            'static Optional<DelosTableScanResultSet> findIn(NoPutResultSet resultSet)',
            'ProjectRestrictResultSet projectRestrict'
    ], 'DelosTableScanResultSet mutation seam')
    delosdbStoragePhaseF6RequireTokens(errors, lookup, [
            'FACTORY_NATIVE_DELETE_EQUALITY_PROPERTY',
            'NATIVE_DELETE_EQUALITY_PROPERTY'
    ], 'provider lookup F6 property export')
    delosdbStoragePhaseF6RequireTokens(errors, sqlBridge, [
            'public long delete(DelosRowIdentity rowIdentity)',
            'DelosMutationResult result = tableAccess.delete(context, rowIdentity)',
            'return result.affectedRows()'
    ], 'native delete table-access seam')
    delosdbStoragePhaseF6RejectTokens(errors, sqlBridge, [
            'F6_DELETE_WHERE_EQUALS',
            'NATIVE_DELETE_REGEX'
    ], 'no new F6 SQL route markers in bridge')
    delosdbStoragePhaseF6RequireTokens(errors, genericFactory, [
            'DelosDeleteResultSet.createIfEnabled(source, activation)',
            'return new DeleteResultSet(source, activation )'
    ], 'GenericResultSetFactory DELETE branch')
    delosdbStoragePhaseF6RejectTokens(errors, resultSetFactory, [
            'getDelosDeleteResultSet'
    ], 'ResultSetFactory interface unchanged by F6')
    delosdbStoragePhaseF6RequireTokens(errors, f6Gradle, [
            'storagePhaseF6NativeDeleteEqualitySmoke',
            'verifyStoragePhaseF6NativeDeleteEquality'
    ], 'F6 Gradle proof wiring')
    delosdbStoragePhaseF6RequireTokens(errors, smokeSource, [
            'DELETE FROM APP.',
            'WHERE id = ?',
            'FACTORY_NATIVE_DELETE_EQUALITY_PROPERTY',
            'VersionedStorageSqlBridge.resetRouteClassifierForTesting()',
            'VersionedStorageSqlBridge.lastRouteClassifierForTesting().isEmpty()',
            'Expected F6 native DELETE equality to remove id=1',
            'Expected F6 native DELETE equality to leave id=2 visible'
    ], 'F6 smoke proof')
    delosdbStoragePhaseF6RequireTokens(errors, f6Doc, [
            'F6 — native DELETE equality',
            'GenericResultSetFactory.getDeleteResultSet(...)',
            'DelosDeleteResultSet',
            'EngineMvccTableAccess.delete(...)',
            'does not add any new bridge SQL route or regex route'
    ], 'F6 document')
    delosdbStoragePhaseF6RequireTokens(errors, planDoc, [
            'F6 landed',
            'native DELETE equality',
            'F7 — native UPDATE equality'
    ], 'Phase F plan after F6')
    delosdbStoragePhaseF6RequireTokens(errors, roadmap, [
            'F6 landed',
            'Next: F7 — native UPDATE equality'
    ], 'ROADMAP after F6')
    delosdbStoragePhaseF6RequireTokens(errors, cleanupScript, [
            'storage-phase-f6-native-delete-equality-db'
    ], 'F6 smoke DB cleanup entry')

    lines << 'DelosDB Storage Phase F6 Native DELETE Equality Proof'
    lines << '====================================================='
    lines << ''
    lines << 'Purpose:'
    lines << '  Prove a Derby prepared DELETE equality can execute through a native Delos result set and EngineMvccTableAccess.delete(...).'
    lines << ''
    lines << 'Verified implementation shape:'
    lines << '  Generated activation still calls the existing ResultSetFactory DELETE method shape.'
    lines << '  No ResultSetFactory interface or generated bytecode method is added.'
    lines << '  GenericResultSetFactory branches by catalog provider metadata under the F6 proof property.'
    lines << '  DelosDeleteResultSet reuses the native DelosTableScanResultSet equality predicate extraction.'
    lines << '  The native path scans to DelosRowIdentity and calls EngineMvccTableAccess.delete(...).'
    lines << '  The prepared DELETE proof asserts VersionedStorageSqlBridge.tryExecute(...) was not called for the native path.'
    lines << ''
    lines << 'Next step:'
    lines << '  F7 moves UPDATE equality onto native predicate extraction, scan identity, and update(...).'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseF6NativeDeleteEqualityReport') {
    group = 'verification'
    description = 'Writes the Phase F6 native MVCC DELETE equality proof report.'
    dependsOn 'verifyStoragePhaseF5NativeInsert'
    outputs.file(delosdbStoragePhaseF6ReportFile)
    doLast {
        def result = delosdbStoragePhaseF6Proof()
        def outputFile = delosdbStoragePhaseF6ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase F6 native MVCC DELETE equality proof failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseF6NativeDeleteEqualitySmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase F6 native MVCC DELETE equality smoke test.'
    source = files('dev/storage-phase-f6-native-delete-equality-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseF6SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseF6Classpath()
}

tasks.register('storagePhaseF6NativeDeleteEqualitySmoke', JavaExec) {
    dependsOn 'storagePhaseF6NativeDeleteEqualityReport', 'compileStoragePhaseF6NativeDeleteEqualitySmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase F6 native MVCC DELETE equality smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseF6NativeDeleteEqualitySmoke'
    classpath = delosdbStoragePhaseF6Classpath()
}

tasks.register('verifyStoragePhaseF6NativeDeleteEquality') {
    group = 'verification'
    description = 'Verifies Phase F6 native MVCC DELETE equality proof.'
    dependsOn 'storagePhaseF6NativeDeleteEqualityReport', 'storagePhaseF6NativeDeleteEqualitySmoke'
    doLast {
        println 'Verified Phase F6 native MVCC DELETE equality; next step is F7 native UPDATE equality'
    }
}
