/*
 * DelosDB repository-integrity inventory and monotonic cleanup gate.
 *
 * The inventory reports candidates. It does not automatically classify every
 * private member, duplicate body, large method, or catch block as a defect.
 * Later cleanup stages must review the evidence before changing behavior.
 */

import java.util.Properties

final File riRoot = rootProject.projectDir
final File riBuild = rootProject.layout.buildDirectory.get().asFile
final File riReportDirectory = new File(
        riBuild, 'reports/delosdb/repository-integrity/inventory')
final File riSummaryFile = new File(riReportDirectory, 'summary.properties')
final File riCatchInventoryFile = new File(riReportDirectory, 'catch-inventory.tsv')
final File riDuplicateInventoryFile = new File(
        riReportDirectory, 'duplicate-production-method-groups.tsv')
final File riStaticReport = new File(
        riBuild, 'reports/delosdb/repository-integrity-static-analysis.txt')
final File riBaselineFile = new File(
        riRoot,
        'gradle/static-analysis/delosdb-repository-integrity-baseline.properties')
final File riBroadCatchClassificationFile = new File(
        riRoot,
        'gradle/static-analysis/delosdb-broad-catch-classification.tsv')
final File riDuplicateClassificationFile = new File(
        riRoot,
        'gradle/static-analysis/delosdb-exact-duplicate-classification.tsv')
final Object riBuildToolsClasses = project(':delosdb-buildtools')
        .layout.buildDirectory.dir('classes/build-tools')

final Closure<Properties> riLoadProperties = { File file ->
    if (!file.isFile()) {
        throw new GradleException('Missing repository-integrity properties: ' +
                file)
    }
    Properties properties = new Properties()
    file.withInputStream { stream -> properties.load(stream) }
    properties
}

final Closure<Integer> riInt = { Properties properties, String name ->
    String value = properties.getProperty(name)
    if (value == null) {
        throw new GradleException(
                'Repository-integrity property is missing: ' + name)
    }
    try {
        return Integer.parseInt(value.trim())
    } catch (NumberFormatException invalid) {
        throw new GradleException(
                'Repository-integrity property is not an integer: ' +
                        name + '=' + value,
                invalid)
    }
}

tasks.register('delosRepositoryIntegrityInventory', JavaExec) {
    group = 'verification'
    description = 'Parses the full Java source tree and writes repository-integrity evidence.'
    dependsOn ':delosdb-buildtools:classes'

    classpath = files(riBuildToolsClasses)
    mainClass.set('org.apache.derbyBuild.DelosRepositoryIntegrityAudit')
    maxHeapSize = '2g'
    workingDir = riRoot

    inputs.files(rootProject.fileTree(riRoot) {
        include '**/*.java'
        include '**/*.gradle'
        include '**/module-info.java'
        include 'settings.gradle'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
        exclude '**/out/**'
    })
    outputs.dir(riReportDirectory)

    doFirst {
        setArgs([
                '--root', riRoot.absolutePath,
                '--report-dir', riReportDirectory.absolutePath
        ])
    }
}

tasks.register('delosRepositoryIntegrityStaticAnalysis') {
    group = 'verification'
    description = 'Enforces the repository-integrity baseline and compiler no-compromise invariants.'
    dependsOn 'delosRepositoryIntegrityInventory'
    inputs.file(riBaselineFile)
    inputs.file(riBroadCatchClassificationFile)
    inputs.file(riDuplicateClassificationFile)
    inputs.file(riSummaryFile)
    inputs.file(riCatchInventoryFile)
    inputs.file(riDuplicateInventoryFile)
    outputs.file(riStaticReport)

    doLast {
        Properties actual = riLoadProperties(riSummaryFile)
        Properties baseline = riLoadProperties(riBaselineFile)
        List<String> failures = []

        if (riInt(actual, 'parseErrors') != 0) {
            failures.add('Java parser errors must remain zero')
        }
        if (riInt(actual, 'compilerAuthorityViolations') != 0) {
            failures.add('Generated-class authority violations must remain zero')
        }
        if (riInt(actual, 'compilerAuthorityCompromiseCandidates') != 0) {
            failures.add('Generated-class authority compromise candidates must remain zero')
        }

        List<String> monotonicMetrics = [
                'deadPrivateProductionMethods',
                'deadPrivateProductionFields',
                'duplicateProductionMethodGroups',
                'duplicateProductionMethods',
                'estimatedDuplicateProductionLines',
                'productionMethods100Plus',
                'productionMethodsComplexity20Plus',
                'productionClasses1000Plus',
                'productionEmptyCatches',
                'productionGenericCatches',
                'productionSuppressWarnings',
                'productionQualityMarkers',
                'compilerAuthorityCompromiseCandidates'
        ]
        monotonicMetrics.each { String name ->
            int current = riInt(actual, name)
            int maximum = riInt(baseline, name)
            if (current > maximum) {
                failures.add(name + ' increased from baseline maximum ' +
                        maximum + ' to ' + current)
            }
        }

        List<String> requiredReports = [
                'repository-integrity-report.txt',
                'dead-private-method-candidates.tsv',
                'dead-private-field-candidates.tsv',
                'duplicate-production-method-groups.tsv',
                'production-method-outliers.tsv',
                'production-class-size-outliers.tsv',
                'catch-inventory.tsv',
                'quality-marker-inventory.tsv',
                'compiler-authority-integrity.txt',
                'parse-errors.txt'
        ]
        requiredReports.each { String name ->
            if (!new File(riReportDirectory, name).isFile()) {
                failures.add('Repository-integrity report is missing: ' + name)
            }
        }

        List<String[]> catchRows = riCatchInventoryFile.readLines('UTF-8')
                .drop(1)
                .collect { String row -> row.split('\t', -1) }
        ['<static-initializer>', '<instance-initializer>'].each { String method ->
            boolean found = catchRows.any { String[] fields ->
                fields.length == 9 &&
                        fields[0] == 'OTHER' &&
                        fields[1] == 'gradle/static-analysis/fixtures/DelosRepositoryIntegrityInitializerCatchFixture.java' &&
                        fields[2] == 'DelosRepositoryIntegrityInitializerCatchFixture' &&
                        fields[3] == method &&
                        fields[5] == 'Exception' &&
                        fields[6] == 'true' &&
                        fields[7] == 'false' &&
                        fields[8] == 'true'
            }
            if (!found) {
                failures.add('Repository-integrity inventory missed fixture catch: ' + method)
            }
        }

        Map<String, Integer> broadCatchClassificationCounts = [
                'REQUIRED_BOUNDARY_CATCH': 0,
                'INTENTIONAL_BEST_EFFORT': 0,
                'LEGACY_COMPATIBILITY': 0
        ]
        if (!riBroadCatchClassificationFile.isFile()) {
            failures.add('Broad-catch classification inventory is missing')
        } else {
            List<String> classificationLines =
                    riBroadCatchClassificationFile.readLines('UTF-8')
                            .findAll { String line ->
                                !line.trim().isEmpty() &&
                                        !line.startsWith('#')
                            }
            String expectedHeader =
                    'file\towner\tmethod\tcatchType\toccurrence\tclassification\trationale'
            Map<String, String[]> classifiedBroadCatches = [:]
            if (classificationLines.isEmpty() ||
                    classificationLines.first() != expectedHeader) {
                failures.add('Broad-catch classification header is invalid')
            } else {
                classificationLines.drop(1).eachWithIndex {
                    String line, int index ->
                    String[] fields = line.split('\t', -1)
                    if (fields.length != 7) {
                        failures.add('Malformed broad-catch classification row: ' +
                                (index + 1))
                    } else {
                        int occurrence = fields[4].isInteger() ?
                                Integer.parseInt(fields[4]) : 0
                        String classification = fields[5]
                        if (occurrence < 1 ||
                                !broadCatchClassificationCounts.containsKey(
                                        classification) ||
                                fields[6].isEmpty()) {
                            failures.add('Invalid broad-catch classification row: ' +
                                    (index + 1))
                        } else {
                            String key = [
                                    fields[0], fields[1], fields[2], fields[3],
                                    fields[4]
                            ].join('\u001f')
                            if (classifiedBroadCatches.put(key, fields) != null) {
                                failures.add('Duplicate broad-catch classification row: ' +
                                        (index + 1))
                            }
                            broadCatchClassificationCounts[classification] =
                                    broadCatchClassificationCounts[classification] + 1
                        }
                    }
                }
            }

            Map<String, Integer> observedOccurrences = [:]
            Set<String> observedBroadCatches = [] as Set<String>
            catchRows.findAll { String[] fields ->
                fields.length == 9 &&
                        fields[0] == 'PRODUCTION' &&
                        fields[8] == 'true'
            }.each { String[] fields ->
                String baseKey = [
                        fields[1], fields[2], fields[3], fields[5]
                ].join('\u001f')
                int occurrence =
                        observedOccurrences.getOrDefault(baseKey, 0) + 1
                observedOccurrences[baseKey] = occurrence
                observedBroadCatches.add(
                        baseKey + '\u001f' + occurrence)
            }

            Set<String> classifiedKeys = classifiedBroadCatches.keySet()
            if (observedBroadCatches != classifiedKeys) {
                failures.add('Broad-catch classification inventory differs from source: ' +
                        'unclassified=' +
                        (observedBroadCatches - classifiedKeys).size() +
                        ', stale=' +
                        (classifiedKeys - observedBroadCatches).size())
            }
            int expectedClassifications =
                    riInt(baseline, 'productionGenericCatches')
            if (classifiedKeys.size() != expectedClassifications) {
                failures.add('Broad-catch classification count is ' +
                        classifiedKeys.size() + ' but baseline requires ' +
                        expectedClassifications)
            }
        }

        Map<String, Integer> duplicateClassificationCounts = [
                'INTENTIONAL_PROTOCOL_MIRROR': 0,
                'JDBC_INTERFACE_BOILERPLATE': 0,
                'GENERATED_SOURCE': 0,
                'VISITOR_PATTERN': 0,
                'PUBLIC_COMPATIBILITY_WRAPPER': 0,
                'SAFE_SHARED_AUTHORITY': 0,
                'SAFE_PRIVATE_HELPER': 0,
                'DO_NOT_CONSOLIDATE_ACROSS_MODULES': 0
        ]
        Set<String> classifiedDuplicateHashes = [] as Set<String>
        if (!riDuplicateClassificationFile.isFile()) {
            failures.add('Exact-duplicate classification inventory is missing')
        } else {
            List<String> lines = riDuplicateClassificationFile
                    .readLines('UTF-8')
                    .findAll { String line -> !line.trim().isEmpty() }
            if (lines.isEmpty() || lines.first() != 'hash\tclassification') {
                failures.add('Exact-duplicate classification header is invalid')
            } else {
                lines.drop(1).eachWithIndex { String line, int index ->
                    String[] fields = line.split('\t', -1)
                    if (fields.length != 2 ||
                            !(fields[0] ==~ /[0-9a-f]{64}/) ||
                            !duplicateClassificationCounts.containsKey(fields[1]) ||
                            !classifiedDuplicateHashes.add(fields[0])) {
                        failures.add('Invalid exact-duplicate classification row: ' +
                                (index + 1))
                    } else {
                        duplicateClassificationCounts[fields[1]] =
                                duplicateClassificationCounts[fields[1]] + 1
                    }
                }
            }
        }

        Set<String> observedDuplicateHashes = [] as Set<String>
        if (!riDuplicateInventoryFile.isFile()) {
            failures.add('Exact-duplicate analyzer inventory is missing')
        } else {
            List<String> lines = riDuplicateInventoryFile.readLines('UTF-8')
            if (lines.isEmpty() || lines.first() !=
                    'hash\tmethodCount\testimatedDuplicateLines\tlocations') {
                failures.add('Exact-duplicate analyzer header is invalid')
            } else {
                lines.drop(1).eachWithIndex { String line, int index ->
                    String[] fields = line.split('\t', -1)
                    if (fields.length != 4 ||
                            !(fields[0] ==~ /[0-9a-f]{64}/) ||
                            !observedDuplicateHashes.add(fields[0])) {
                        failures.add('Malformed exact-duplicate analyzer row: ' +
                                (index + 1))
                    }
                }
            }
        }
        if (observedDuplicateHashes != classifiedDuplicateHashes) {
            failures.add('Exact-duplicate classification differs from source: ' +
                    'unclassified=' +
                    (observedDuplicateHashes - classifiedDuplicateHashes).size() +
                    ', stale=' +
                    (classifiedDuplicateHashes - observedDuplicateHashes).size())
        }
        int expectedDuplicateGroups =
                riInt(baseline, 'duplicateProductionMethodGroups')
        if (classifiedDuplicateHashes.size() != expectedDuplicateGroups) {
            failures.add('Exact-duplicate classification count is ' +
                    classifiedDuplicateHashes.size() +
                    ' but baseline requires ' + expectedDuplicateGroups)
        }

        File report = riStaticReport
        report.parentFile.mkdirs()
        report.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB repository integrity static analysis')
            writer.println('==========================================')
            writer.println('Baseline version: ' +
                    baseline.getProperty('baselineVersion', 'unknown'))
            writer.println('Java files: ' + actual.getProperty('javaFiles'))
            writer.println('Production Java files: ' +
                    actual.getProperty('productionJavaFiles'))
            writer.println('Types: ' + actual.getProperty('types'))
            writer.println('Methods: ' + actual.getProperty('methods'))
            writer.println('Fields: ' + actual.getProperty('fields'))
            writer.println('Parse errors: ' + actual.getProperty('parseErrors'))
            writer.println('Dead private production methods: ' +
                    actual.getProperty('deadPrivateProductionMethods'))
            writer.println('Dead private production fields: ' +
                    actual.getProperty('deadPrivateProductionFields'))
            writer.println('Exact production duplicate groups: ' +
                    actual.getProperty('duplicateProductionMethodGroups'))
            writer.println('Estimated duplicate production lines: ' +
                    actual.getProperty('estimatedDuplicateProductionLines'))
            writer.println('Duplicate groups classified as protocol mirrors: ' +
                    duplicateClassificationCounts['INTENTIONAL_PROTOCOL_MIRROR'])
            writer.println('Duplicate groups classified as JDBC boilerplate: ' +
                    duplicateClassificationCounts['JDBC_INTERFACE_BOILERPLATE'])
            writer.println('Duplicate groups classified as generated source: ' +
                    duplicateClassificationCounts['GENERATED_SOURCE'])
            writer.println('Duplicate groups classified as visitor patterns: ' +
                    duplicateClassificationCounts['VISITOR_PATTERN'])
            writer.println('Duplicate groups classified as compatibility wrappers: ' +
                    duplicateClassificationCounts['PUBLIC_COMPATIBILITY_WRAPPER'])
            writer.println('Duplicate groups classified as shared authorities: ' +
                    duplicateClassificationCounts['SAFE_SHARED_AUTHORITY'])
            writer.println('Duplicate groups classified as private helpers: ' +
                    duplicateClassificationCounts['SAFE_PRIVATE_HELPER'])
            writer.println('Duplicate groups retained across module boundaries: ' +
                    duplicateClassificationCounts['DO_NOT_CONSOLIDATE_ACROSS_MODULES'])
            writer.println('Production methods >= 100 lines: ' +
                    actual.getProperty('productionMethods100Plus'))
            writer.println('Production methods complexity >= 20: ' +
                    actual.getProperty('productionMethodsComplexity20Plus'))
            writer.println('Production classes >= 1000 lines: ' +
                    actual.getProperty('productionClasses1000Plus'))
            writer.println('Production empty catches: ' +
                    actual.getProperty('productionEmptyCatches'))
            writer.println('Production generic catches: ' +
                    actual.getProperty('productionGenericCatches'))
            writer.println('Broad catches classified as required boundaries: ' +
                    broadCatchClassificationCounts['REQUIRED_BOUNDARY_CATCH'])
            writer.println('Broad catches classified as best effort: ' +
                    broadCatchClassificationCounts['INTENTIONAL_BEST_EFFORT'])
            writer.println('Broad catches classified as legacy compatibility: ' +
                    broadCatchClassificationCounts['LEGACY_COMPATIBILITY'])
            writer.println('Compiler authority violations: ' +
                    actual.getProperty('compilerAuthorityViolations'))
            writer.println('Compiler compromise candidates: ' +
                    actual.getProperty(
                            'compilerAuthorityCompromiseCandidates'))
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { String failure -> writer.println('- ' + failure) }
        }

        if (!failures.isEmpty()) {
            failures.each { String failure ->
                logger.error('Repository-integrity failure: {}', failure)
            }
            throw new GradleException(
                    'Repository integrity static analysis failed. Report: ' +
                            report)
        }
        logger.lifecycle(
                'DelosDB repository integrity static analysis passed. Report: {}',
                report)
    }
}
