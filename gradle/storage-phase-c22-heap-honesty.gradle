import org.gradle.api.tasks.compile.JavaCompile

// Phase C22 heap compile-time honesty proof.
// This phase does not route heap SQL through DelosTableAccess.  It only proves
// the C20 capability contracts can represent Derby heap semantics by compiling
// a proof adapter against TransactionController, ScanController,
// ConglomerateController, RowLocation/StoreRowLocation, and Derby locking /
// isolation context.

ext.delosdbStoragePhaseC22ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC22ReportFile =
        ext.delosdbStoragePhaseC22ReportDir.map { it.file('storage-phase-c22-heap-honesty.txt') }
ext.delosdbStoragePhaseC22SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c22-heap-honesty-smoke')

ext.delosdbStoragePhaseC22RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC22RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC22RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC22ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC22RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC22Classpath = {
    files(
            delosdbStoragePhaseC22SmokeClassesDir,
            delosdbStoragePhaseC22ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC22ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseC22ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC22ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-storage-derby').layout.buildDirectory.dir('classes/main'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            delosdbStoragePhaseC22RuntimeJars())
}

ext.delosdbStoragePhaseC22Proof = {
    def errors = []
    def lines = []

    def heapProof = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/storetypes/EngineHeapTableAccessProof.java')
    def smokeSource = file('dev/storage-phase-c22-heap-honesty-smoke/src/main/java/delosdb/smoke/StoragePhaseC22HeapHonestySmoke.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def tableScan = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/TableScanResultSet.java')
    def rowChanger = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/RowChangerImpl.java')

    delosdbStoragePhaseC22RequireTokens(errors, heapProof, [
            'public final class EngineHeapTableAccessProof',
            'implements DelosFilterableTableAccess, DelosIndexableTableAccess, DelosMutableTableAccess',
            'public static final String PROVIDER_NAME = "heap"',
            'DelosContextKey<TransactionController> TRANSACTION_CONTROLLER_KEY',
            'DelosContextKey<Integer> LOCK_LEVEL_KEY',
            'DelosContextKey<Integer> ISOLATION_LEVEL_KEY',
            'TransactionController.ISOLATION_READ_COMMITTED',
            'TransactionController.MODE_RECORD',
            'TransactionController.OPENMODE_FORUPDATE',
            'TransactionController tc = context.require(TRANSACTION_CONTROLLER_KEY)',
            'tc.openScan(',
            'tc.openCompiledScan(',
            'ConglomerateController',
            'tc.openConglomerate(',
            'tc.openCompiledConglomerate(',
            'controller.insertAndFetchLocation(row, unwrappedLocation)',
            'controller.insert(row)',
            'controller.replace(requireHeapStoreRowLocation(rowIdentity), replacement, validColumns)',
            'controller.delete(requireHeapStoreRowLocation(rowIdentity))',
            'controller.lockRow(',
            'RowLocation engineLocation = EngineStoreRowLocationBridge.requireEngineRowLocation(storeLocation)',
            'StoreRowLocation unwrappedLocation = EngineStoreRowLocationBridge.requireStoreRowLocation(engineLocation)',
            'public static final class HeapRowIdentity implements DelosRowIdentity',
            'return PROVIDER_NAME;',
            'return rowLocation;',
            'C22 heap table-access proof only'
    ], 'C22 heap table-access proof adapter')

    if (heapProof.exists()) {
        def text = heapProof.text
        if (!text.contains('throw proofOnlyUnsupported(')) {
            errors << 'C22 heap proof public capability methods must decline runtime use with proof-only UnsupportedOperationException'
        }
        ['VersionedStorageSqlBridge', 'VersionedTable', 'VersionedIndex', 'TxContext', 'TxView', 'io.github.ggeorg.delosdb.storage.mvcc'].each { token ->
            if (text.contains(token)) {
                errors << "C22 heap proof must not import or mention MVCC/versioned storage token: ${token}"
            }
        }
    }

    delosdbStoragePhaseC22RequireTokens(errors, smokeSource, [
            'StoragePhaseC22HeapHonestySmoke',
            'EngineHeapTableAccessProof',
            'proof instanceof DelosFilterableTableAccess',
            'proof instanceof DelosIndexableTableAccess',
            'proof instanceof DelosMutableTableAccess',
            'TRANSACTION_CONTROLLER_KEY',
            'LOCK_LEVEL_KEY',
            'ISOLATION_LEVEL_KEY',
            'StoreRowLocation storeRowLocation = new TestStoreRowLocation()',
            'EngineHeapTableAccessProof.rowIdentity(storeRowLocation)',
            'rowIdentity.nativeIdentity() instanceof StoreRowLocation',
            'expectUnsupported',
            'C22 heap table-access proof only'
    ], 'C22 heap honesty smoke')

    delosdbStoragePhaseC22RequireTokens(errors, tableScan, [
            'tc.openCompiledScan(',
            'scanController.fetchNext(candidate.getRowArray())',
            'scanController.fetchLocation(rl)'
    ], 'native Derby heap scan path remains present')

    delosdbStoragePhaseC22RequireTokens(errors, rowChanger, [
            'tc.openCompiledConglomerate(',
            'EngineStoreRowLocationBridge.requireEngineRowLocation(baseCC.newRowLocationTemplate())',
            'baseCC.insertAndFetchLocation(baseRow.getRowArray(), baseRowLocation)',
            'baseCC.delete(baseRowLocation)',
            'baseCC.replace(baseRowLocation,'
    ], 'native Derby heap mutation path remains present')

    if (sqlBridge.exists()) {
        def bridgeText = sqlBridge.text
        if (!bridgeText.contains('Pattern.compile(')) {
            errors << 'C22 must not delete regex routing; Pattern.compile must remain until C24/C25 replacement exists'
        }
        if (bridgeText.contains('EngineHeapTableAccessProof') || bridgeText.contains('DelosTableAccess') && bridgeText.contains('heap')) {
            errors << 'C22 must not route heap SQL through DelosTableAccess or EngineHeapTableAccessProof'
        }
    }

    def engineImplStoreSourceRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
    if (engineImplStoreSourceRoot.exists()) {
        errors << 'C22 must not add engine-side org/apache/derby/impl/store sources: '
                + delosdbStoragePhaseC22RelPath(engineImplStoreSourceRoot)
    }

    def generatedActivationChanges = fileTree(rootProject.projectDir).matching {
        include 'delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/**/*.java'
        include 'delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/**/*.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/__MACOSX/**'
    }.files.findAll { sourceFile ->
        def text = sourceFile.text
        text.contains('EngineHeapTableAccessProof') || text.contains('DelosTableAccess') || text.contains('DelosFilterableTableAccess')
    }.collect { delosdbStoragePhaseC22RelPath(it) }.sort()
    if (!generatedActivationChanges.isEmpty()) {
        errors << 'C22 must not change generated activation/heap SQL execution to use DelosTableAccess: ' + generatedActivationChanges
    }

    lines << 'DelosDB Storage Phase C22 Heap Honesty Proof'
    lines << '============================================'
    lines << ''
    lines << 'C22 mechanic:'
    lines << '  compile a proof-only heap table-access adapter against the real Derby heap/access types.'
    lines << ''
    lines << 'Derby heap concepts proven by type-checking:'
    lines << '  TransactionController, ScanController, ConglomerateController.'
    lines << '  RowLocation and StoreRowLocation identity wrapping.'
    lines << '  Derby lock level and isolation-level context keys.'
    lines << '  scan, index, insert, update, and delete shapes without live routing.'
    lines << ''
    lines << 'Boundaries preserved:'
    lines << '  heap SQL remains JavaCC parser -> optimizer -> generated activation -> TransactionController/ScanController.'
    lines << '  VersionedStorageSqlBridge remains the temporary MVCC interception point.'
    lines << '  no regex route is deleted.'
    lines << '  no generated activation code is changed.'
    lines << '  no engine-side org/apache/derby/impl/store sources are added.'
    lines << ''
    lines << 'Proof smoke:'
    lines << '  dev/storage-phase-c22-heap-honesty-smoke/src/main/java/delosdb/smoke/StoragePhaseC22HeapHonestySmoke.java'
    lines << ''
    lines << 'Next step:'
    lines << '  C23 should route MVCC UPDATE/DELETE internals through scan row identities and DelosMutableTableAccess.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC22HeapHonestyReport') {
    group = 'verification'
    description = 'Writes the Phase C22 heap compile-time honesty proof report.'
    dependsOn 'verifyStoragePhaseC21MvccContractSelect'
    outputs.file(delosdbStoragePhaseC22ReportFile)
    doLast {
        def result = delosdbStoragePhaseC22Proof()
        def outputFile = delosdbStoragePhaseC22ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C22 heap honesty proof failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC22HeapHonestySmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-storage-derby:compileLegacyDerbyStorage'
    group = 'verification'
    description = 'Compiles the Phase C22 heap honesty smoke test.'
    source = files('dev/storage-phase-c22-heap-honesty-smoke/src/main/java')
    destinationDirectory = delosdbStoragePhaseC22SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC22Classpath()
}

tasks.register('storagePhaseC22HeapHonestySmoke', JavaExec) {
    dependsOn 'compileStoragePhaseC22HeapHonestySmoke', 'processDerbyResources', ':delosdb-storage-derby:compileLegacyDerbyStorage'
    group = 'verification'
    description = 'Runs the Phase C22 heap honesty smoke test.'
    classpath = delosdbStoragePhaseC22Classpath()
    mainClass = 'delosdb.smoke.StoragePhaseC22HeapHonestySmoke'
}

tasks.register('verifyStoragePhaseC22HeapHonesty') {
    group = 'verification'
    description = 'Verifies the Phase C22 heap compile-time honesty proof.'
    dependsOn 'storagePhaseC22HeapHonestyReport', 'storagePhaseC22HeapHonestySmoke'
    doLast {
        println 'Verified Phase C22 heap compile-time honesty proof; next step is C23 MVCC mutation through table-access contract'
    }
}
