import org.gradle.api.tasks.JavaExec
import org.gradle.api.tasks.compile.JavaCompile

apply plugin: 'java'
apply plugin: 'application'

version = rootProject.version
group = rootProject.group

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

def defaultSmokeMainClass = {
    def stem = project.name.endsWith('-smoke')
            ? project.name.substring(0, project.name.length() - '-smoke'.length())
            : project.name
    def simpleName = stem
            .split('-')
            .collect { part -> part ? part.substring(0, 1).toUpperCase() + part.substring(1) : '' }
            .join('') + 'Smoke'
    "delosdb.smoke.${simpleName}"
}

def smokeMainClass = extensions.extraProperties.has('delosdbSmokeMainClass')
        ? extensions.extraProperties.get('delosdbSmokeMainClass').toString()
        : defaultSmokeMainClass()
def smokeDescription = extensions.extraProperties.has('delosdbSmokeDescription')
        ? extensions.extraProperties.get('delosdbSmokeDescription').toString()
        : "Runs ${project.name}."

def smokeCleanPaths = extensions.extraProperties.has('delosdbSmokeCleanPaths')
        ? extensions.extraProperties.get('delosdbSmokeCleanPaths')
        : []

application {
    mainClass = smokeMainClass
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir '../smoke-utils/src/main/java'
        }
    }
}

dependencies {
    // Compile against the assembled runtime jars instead of the inherited engine
    // classes directory. The engine output directory is also populated by legacy
    // root resource tasks, so using it directly as a downstream compile classpath
    // triggers Gradle implicit-dependency validation.
    compileOnly rootProject.ext.delosdbRuntimeJars()
    implementation project(':delosdb-storage-io')
    implementation project(':delosdb-storage-mvcc')

    // Derby's embedded runtime is still assembled through legacy product jar
    // tasks while delosdb-engine remains on its custom compile path.
    runtimeOnly rootProject.ext.delosdbRuntimeJars()
}

tasks.named('compileJava', JavaCompile) {
    dependsOn rootProject.tasks.named('jars')
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
}

tasks.named('run', JavaExec) {
    dependsOn rootProject.tasks.named('jars')
    group = 'verification'
    description = smokeDescription
    workingDir = rootProject.projectDir
    if (smokeCleanPaths != null && !smokeCleanPaths.isEmpty()) {
        doFirst {
            smokeCleanPaths.each { relativePath ->
                delete rootProject.file(relativePath.toString())
            }
        }
    }
}

// Dev smoke projects are executable verification fixtures, not shipped
// application distributions. After storage-api became a real transitive
// contract of MVCC, the Application plugin's generated distribution archives
// can see both assembled DelosDB runtime jars and project-dependency jars with
// the same runtime names. Keep `run` and compilation enabled, but keep the
// `build` lifecycle from packaging smoke-only applications.
tasks.matching { task ->
    task.name in ['distTar', 'distZip', 'installDist', 'assembleDist']
}.configureEach {
    enabled = false
}
