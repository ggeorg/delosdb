// Storage Phase I mutation concurrency verification.
// I1 chooses Option A: optimistic row-identity validation/preparation.
// This is not a lock or reservation primitive.

ext.delosdbStoragePhaseIMutationConcurrencyModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseIMutationConcurrencyRuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseIMutationConcurrencyClasspath = { Object smokeClassesDir ->
    files(
            smokeClassesDir,
            delosdbStoragePhaseIMutationConcurrencyModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseIMutationConcurrencyModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseIMutationConcurrencyModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseIMutationConcurrencyModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseIMutationConcurrencyRuntimeJars())
}

ext.delosdbStoragePhaseI1MutationPreparationClassesDir =
        layout.buildDirectory.dir('classes/storage-phase-i1-mutation-preparation-smoke')

tasks.register('compileStoragePhaseI1MutationPreparationSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase I1 optimistic mutation preparation smoke test.'
    source = files('dev/storage-phase-i1-mutation-preparation-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseI1MutationPreparationClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseIMutationConcurrencyClasspath(delosdbStoragePhaseI1MutationPreparationClassesDir)
}

tasks.register('storagePhaseI1MutationPreparationSmoke', JavaExec) {
    dependsOn 'verifyStoragePhaseH4SessionCostConstant', 'compileStoragePhaseI1MutationPreparationSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase I1 optimistic mutation preparation smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseI1MutationPreparationSmoke'
    classpath = delosdbStoragePhaseIMutationConcurrencyClasspath(delosdbStoragePhaseI1MutationPreparationClassesDir)
}

tasks.register('verifyStoragePhaseI1MutationPreparation') {
    group = 'verification'
    description = 'Verifies Option A optimistic row-identity mutation validation/preparation without row-lock claims.'
    dependsOn 'storagePhaseI1MutationPreparationSmoke'
    doLast {
        println 'Verified Phase I1 optimistic row-identity mutation preparation; no lock or reservation primitive is claimed'
    }
}

ext.delosdbStoragePhaseI2MutationConflictClassesDir =
        layout.buildDirectory.dir('classes/storage-phase-i2-mutation-conflict-smoke')

tasks.register('compileStoragePhaseI2MutationConflictSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase I2 native MVCC mutation conflict smoke test.'
    source = files('dev/storage-phase-i2-mutation-conflict-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseI2MutationConflictClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseIMutationConcurrencyClasspath(delosdbStoragePhaseI2MutationConflictClassesDir)
}

tasks.register('storagePhaseI2MutationConflictSmoke', JavaExec) {
    dependsOn 'verifyStoragePhaseI1MutationPreparation', 'compileStoragePhaseI2MutationConflictSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase I2 native MVCC mutation conflict smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseI2MutationConflictSmoke'
    classpath = delosdbStoragePhaseIMutationConcurrencyClasspath(delosdbStoragePhaseI2MutationConflictClassesDir)
}

tasks.register('verifyStoragePhaseI2MutationConflict') {
    group = 'verification'
    description = 'Verifies native MVCC UPDATE/DELETE write-conflict mapping without row-lock claims.'
    dependsOn 'storagePhaseI2MutationConflictSmoke'
    doLast {
        println 'Verified Phase I2 native MVCC mutation conflict mapping; conflicts surface as Derby transaction conflicts without lock claims'
    }
}

