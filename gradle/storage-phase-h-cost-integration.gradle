// Storage Phase H cost integration verification.
// H1 introduces the costable table-access seam only; Derby optimizer costing is not changed here.

ext.delosdbStoragePhaseHCostIntegrationModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseHCostIntegrationRuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseHCostIntegrationClasspath = { Object smokeClassesDir ->
    files(
            smokeClassesDir,
            delosdbStoragePhaseHCostIntegrationModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseHCostIntegrationModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseHCostIntegrationModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseHCostIntegrationModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseHCostIntegrationRuntimeJars())
}

ext.delosdbStoragePhaseH1CostableTableAccessClassesDir =
        layout.buildDirectory.dir('classes/storage-phase-h1-costable-table-access-smoke')

tasks.register('compileStoragePhaseH1CostableTableAccessSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase H1 costable table-access smoke test.'
    source = files('dev/storage-phase-h1-costable-table-access-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseH1CostableTableAccessClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseHCostIntegrationClasspath(delosdbStoragePhaseH1CostableTableAccessClassesDir)
}

tasks.register('storagePhaseH1CostableTableAccessSmoke', JavaExec) {
    dependsOn 'verifyStoragePhaseGConsolidation', 'compileStoragePhaseH1CostableTableAccessSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase H1 costable table-access smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseH1CostableTableAccessSmoke'
    classpath = delosdbStoragePhaseHCostIntegrationClasspath(delosdbStoragePhaseH1CostableTableAccessClassesDir)
}

tasks.register('verifyStoragePhaseH1CostableTableAccess') {
    group = 'verification'
    description = 'Verifies the native MVCC table access exposes provider-backed cost estimates without Derby optimizer integration.'
    dependsOn 'storagePhaseH1CostableTableAccessSmoke'
    doLast {
        println 'Verified Phase H1 costable table-access seam; next step is H2 MVCC cost mapping into the native cost path'
    }
}
