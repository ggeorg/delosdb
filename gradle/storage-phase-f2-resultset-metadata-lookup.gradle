import org.gradle.api.tasks.compile.JavaCompile

// Phase F2.2 ResultSetFactory metadata lookup preparation.
// This is not the native scan branch yet. It proves the exact metadata lookup
// F3 will need at GenericResultSetFactory.getTableScanResultSet(...):
// activation/language context + tableName -> TableDescriptor.storageProviderName.

ext.delosdbStoragePhaseF22ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseF22ReportFile =
        ext.delosdbStoragePhaseF22ReportDir.map { it.file('storage-phase-f2-resultset-metadata-lookup.txt') }
ext.delosdbStoragePhaseF22SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-f2-resultset-lookup-smoke')

ext.delosdbStoragePhaseF22RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseF22RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF22RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseF22RejectTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF22RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def present = tokens.findAll { token -> text.contains(token) }
    if (!present.isEmpty()) {
        errors << "${label} contains forbidden tokens: ${present.join(', ')}"
    }
}

ext.delosdbStoragePhaseF22ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseF22RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseF22Classpath = {
    files(
            delosdbStoragePhaseF22SmokeClassesDir,
            delosdbStoragePhaseF22ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseF22ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseF22ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseF22ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseF22RuntimeJars())
}

ext.delosdbStoragePhaseF22Proof = {
    def errors = []
    def lines = []

    def buildFile = file('build.gradle')
    def lookup = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosTableScanProviderLookup.java')
    def genericFactory = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/GenericResultSetFactory.java')
    def f2Gradle = file('gradle/storage-phase-f2-provider-catalog-persistence.gradle')
    def f22Gradle = file('gradle/storage-phase-f2-resultset-metadata-lookup.gradle')
    def smokeSource = file('dev/storage-phase-f2-resultset-lookup-smoke/src/main/java/delosdb/smoke/StoragePhaseF2ResultSetLookupSmoke.java')
    def f22Doc = file('docs/storage-phase-f2-resultset-metadata-lookup.md')
    def planDoc = file('docs/storage-phase-f-native-integration-plan.md')
    def roadmap = file('docs/ROADMAP.md')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')

    delosdbStoragePhaseF22RequireTokens(errors, buildFile, [
            "apply from: file('gradle/storage-phase-f2-provider-catalog-persistence.gradle')",
            "apply from: file('gradle/storage-phase-f2-resultset-metadata-lookup.gradle')"
    ], 'root build F2.2 wiring')
    if (buildFile.exists()) {
        def text = buildFile.text
        def f21 = text.indexOf("apply from: file('gradle/storage-phase-f2-provider-catalog-persistence.gradle')")
        def f22 = text.indexOf("apply from: file('gradle/storage-phase-f2-resultset-metadata-lookup.gradle')")
        if (f21 < 0 || f22 < 0 || f22 < f21) {
            errors << 'F2.2 apply must appear after F2.1 in build.gradle'
        }
    }

    delosdbStoragePhaseF22RequireTokens(errors, lookup, [
            'public final class DelosTableScanProviderLookup',
            'find(Activation activation, String tableName)',
            'find(LanguageConnectionContext lcc, String tableName)',
            'IdUtil.parseMultiPartSQLIdentifier(tableName.trim())',
            'dataDictionary.getSchemaDescriptor(',
            'dataDictionary.getTableDescriptor(',
            'table.getStorageProviderName()',
            'public record Result(String schemaName, String tableName, String storageProviderName)',
            'isDefaultStorageProvider()',
            'isProvider(String providerName)'
    ], 'Delos table-scan provider lookup helper')
    delosdbStoragePhaseF22RejectTokens(errors, genericFactory, [
            'new DelosTableScanResultSet',
            'DelosTableScanProviderLookup.find('
    ], 'GenericResultSetFactory must not branch before F3')
    delosdbStoragePhaseF22RequireTokens(errors, f2Gradle, [
            'verifyStoragePhaseF2ProviderCatalogPersistence'
    ], 'F2.1 prerequisite task')
    delosdbStoragePhaseF22RequireTokens(errors, f22Gradle, [
            'storagePhaseF2ResultSetLookupSmoke',
            'verifyStoragePhaseF2ResultSetMetadataLookup'
    ], 'F2.2 Gradle task definitions')
    delosdbStoragePhaseF22RequireTokens(errors, smokeSource, [
            'StoragePhaseF2ResultSetLookupSmoke',
            'CREATE TABLE " + MVCC_TABLE_NAME + " (id INT, value VARCHAR(32)) USING delos_mvcc',
            'DelosTableScanProviderLookup.find(lcc, tableName)',
            'assertProvider(connection, "APP." + MVCC_TABLE_NAME, PROVIDER_NAME, false)',
            'assertProvider(connection, MVCC_TABLE_NAME, PROVIDER_NAME, false)',
            'assertProvider(connection, "APP." + HEAP_TABLE_NAME, "heap", true)',
            'assertMissing(connection, "APP.F2_RESULTSET_LOOKUP_MISSING")',
            'VersionedStorageSqlBridge.lastRouteClassifierForTesting().isEmpty()',
            'storage_phase_f2_resultset_lookup: PASS'
    ], 'F2.2 lookup smoke')
    delosdbStoragePhaseF22RequireTokens(errors, f22Doc, [
            'F2.2 — ResultSetFactory metadata lookup preparation',
            'GenericResultSetFactory.getTableScanResultSet',
            'DelosTableScanProviderLookup',
            'tableName',
            'LanguageConnectionContext',
            'TableDescriptor.storageProviderName',
            'no ResultSetFactory branch yet'
    ], 'F2.2 document')
    delosdbStoragePhaseF22RequireTokens(errors, planDoc, [
            'F2.2 landed',
            'DelosTableScanProviderLookup',
            'F3 — provider-aware ResultSetFactory proof'
    ], 'Phase F plan after F2.2')
    delosdbStoragePhaseF22RequireTokens(errors, roadmap, [
            'F2.2 landed',
            'DelosTableScanProviderLookup',
            'F3 — provider-aware ResultSetFactory proof'
    ], 'ROADMAP after F2.2')
    delosdbStoragePhaseF22RequireTokens(errors, cleanupScript, [
            'storage-phase-f2-resultset-lookup-db'
    ], 'F2.2 smoke DB cleanup entry')

    lines << 'DelosDB Storage Phase F2.2 ResultSetFactory Metadata Lookup Preparation'
    lines << '======================================================================'
    lines << ''
    lines << 'Purpose:'
    lines << '  Prepare the exact provider lookup seam needed by F3 without changing generated bytecode or branching ResultSetFactory yet.'
    lines << ''
    lines << 'Verified implementation shape:'
    lines << '  DelosTableScanProviderLookup resolves LanguageConnectionContext + tableName to TableDescriptor.storageProviderName.'
    lines << '  One-part and two-part table names are supported through Derby IdUtil parsing.'
    lines << '  Missing tables return Optional.empty().' 
    lines << '  GenericResultSetFactory does not branch in F2.2; that is reserved for F3.'
    lines << ''
    lines << 'Next step:'
    lines << '  F3 adds the provider-aware ResultSetFactory branch and a DelosTableScanResultSet skeleton.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseF2ResultSetMetadataLookupReport') {
    group = 'verification'
    description = 'Writes the Phase F2.2 ResultSetFactory metadata lookup preparation report.'
    dependsOn 'verifyStoragePhaseF2ProviderCatalogPersistence'
    outputs.file(delosdbStoragePhaseF22ReportFile)
    doLast {
        def result = delosdbStoragePhaseF22Proof()
        def outputFile = delosdbStoragePhaseF22ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase F2.2 ResultSetFactory metadata lookup preparation failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseF2ResultSetLookupSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase F2.2 ResultSetFactory metadata lookup smoke test.'
    source = files('dev/storage-phase-f2-resultset-lookup-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseF22SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseF22Classpath()
}

tasks.register('storagePhaseF2ResultSetLookupSmoke', JavaExec) {
    dependsOn 'storagePhaseF2ResultSetMetadataLookupReport', 'compileStoragePhaseF2ResultSetLookupSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase F2.2 ResultSetFactory metadata lookup smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseF2ResultSetLookupSmoke'
    classpath = delosdbStoragePhaseF22Classpath()
}

tasks.register('verifyStoragePhaseF2ResultSetMetadataLookup') {
    group = 'verification'
    description = 'Verifies Phase F2.2 ResultSetFactory metadata lookup preparation.'
    dependsOn 'storagePhaseF2ResultSetMetadataLookupReport', 'storagePhaseF2ResultSetLookupSmoke'
    doLast {
        println 'Verified Phase F2.2 ResultSetFactory metadata lookup preparation; next step is F3 provider-aware ResultSetFactory branch proof'
    }
}
