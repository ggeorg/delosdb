                    || testsText.contains("build/libs/${jarName}") || testsText.contains("libs/${jarName}")) {
                failures << "delosdb-tests/build.gradle must not hard-code Derby runtime jar name; use rootProject.ext.delosdbRuntimeJarFiles instead: ${jarName}"
            }
        }

        delosRuntimeArtifactModelRequire(failures, rootText.contains("tasks.named('s0CloseoutVerification')"),
