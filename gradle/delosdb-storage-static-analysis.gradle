                }
            }
            def retiredProviderServices = fileTree(delosRepositoryRoot) {
                include 'delosdb-*/src/main/resources/META-INF/services/org.apache.derby.iapi.store.types.DelosStorageProviderFactory'
            }.files
            if (!retiredProviderServices.isEmpty()) {
                failures << 'Retired DelosStorageProviderFactory service registration remains: ' + retiredProviderServices
            }
