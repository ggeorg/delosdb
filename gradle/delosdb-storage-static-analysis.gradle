            writer.println('Rule: page/record locators are optional validated hints; logical row/version IDs and previousVersionId remain authoritative.')
            writer.println()
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'RawStore MVCC lookup-hint static analysis failed. Report: '
                            + reportFile)
        }
        logger.lifecycle(
                'RawStore MVCC lookup-hint static analysis passed. Report: {}',
                reportFile)
    }
}

