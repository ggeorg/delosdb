def delosDeadCodeCandidateFile = file('gradle/static-analysis/delosdb-dead-code-candidates.txt')

def delosDeadCodeSearchRoots = [
        'delosdb-storage-api/src/main/java',
        'delosdb-storage-bridge/src/main/java',
        'delosdb-storage-mvcc/src/main/java',
        'delosdb-storage-mvcc/src/test/java',
        'delosdb-storage-io/src/main/java',
        'delosdb-server/src/main/java',
        'delosdb-client/src/main/java',
        'delosdb-tools/src/main/java',
        'delosdb-tests/src/test/java'
]

def delosDeadCodeSearchFiles = {
    def includes = ['**/*.java', '**/*.properties', '**/META-INF/services/**', '**/module-info.java']
    delosDeadCodeSearchRoots.collect { file(it) }
            .findAll { it.exists() }
            .collectMany { root ->
                fileTree(root) {
                    includes.each { include it }
                }.files
            }
            .sort { a, b -> a.path <=> b.path }
}

def delosLoadDeadCodeCandidates = {
    if (!delosDeadCodeCandidateFile.exists()) {
        return []
    }
    delosDeadCodeCandidateFile.readLines('UTF-8')
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') }
            .collect { line ->
                def parts = line.split('\\|', 3)
                if (parts.length < 2) {
                    throw new GradleException('Malformed dead-code candidate line: ' + line)
                }
                [
                        path  : parts[0].trim(),
                        symbol: parts[1].trim(),
                        reason: parts.length == 3 ? parts[2].trim() : ''
                ]
            }
}

tasks.register('delosDeadCodeCandidateReport') {
    group = 'verification'
    description = 'Reports curated DelosDB dead-code/stale-code candidates without deleting them.'

    inputs.file(delosDeadCodeCandidateFile).optional()
    inputs.files(delosDeadCodeSearchFiles())
    outputs.file(layout.buildDirectory.file('reports/delosdb/dead-code-candidates.txt'))

    doLast {
        def candidates = delosLoadDeadCodeCandidates()
        def searchFiles = delosDeadCodeSearchFiles()
        def reportFile = layout.buildDirectory.file('reports/delosdb/dead-code-candidates.txt').get().asFile
        reportFile.parentFile.mkdirs()

        def rows = candidates.collect { candidate ->
            def candidateFile = file(candidate.path)
            def references = []
            if (candidateFile.exists()) {
                searchFiles.findAll { it.exists() && it.canonicalFile != candidateFile.canonicalFile }.each { sourceFile ->
                    int lineNumber = 0
                    sourceFile.eachLine('UTF-8') { line ->
                        lineNumber++
                        def symbolPattern = ~('(?<![A-Za-z0-9_$])' + Pattern.quote(candidate.symbol) + '(?![A-Za-z0-9_$])')
                        if (symbolPattern.matcher(line).find()) {
                            references << [file: sourceFile, lineNumber: lineNumber, line: delosStorageNormalize(line)]
                        }
                    }
                }
            }
            [candidate: candidate, exists: candidateFile.exists(), references: references]
        }

        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB dead-code / stale-code candidate report')
            writer.println('================================================')
            writer.println()
            writer.println('This is an evidence report, not a deletion gate.')
            writer.println('ServiceLoader entries, public APIs, JPMS exports, tests, and reflection can make text-only dead-code scans noisy.')
            writer.println()
            writer.println('Candidates configured: ' + candidates.size())
            writer.println()
            writer.println('Search roots:')
            delosDeadCodeSearchRoots.each { writer.println('  - ' + it) }
            writer.println()

            rows.each { row ->
                def candidate = row.candidate
                writer.println(candidate.path)
                writer.println('  symbol:     ' + candidate.symbol)
                writer.println('  exists:     ' + row.exists)
                writer.println('  references: ' + row.references.size())
                if (candidate.reason) {
                    writer.println('  reason:     ' + candidate.reason)
                }
                if (row.exists && row.references.isEmpty()) {
                    writer.println('  status:     deletion-review candidate')
                } else if (!row.exists) {
                    writer.println('  status:     already removed or renamed')
                } else {
                    writer.println('  status:     referenced; do not delete without deeper review')
                    row.references.take(10).each { ref ->
                        def refPath = rootProject.projectDir.toPath().relativize(ref.file.toPath()).toString().replace(File.separatorChar, '/' as char)
                        writer.println('    - ' + refPath + ':' + ref.lineNumber + ': ' + ref.line)
                    }
                    if (row.references.size() > 10) {
                        writer.println('    ... ' + (row.references.size() - 10) + ' more reference(s) omitted')
                    }
                }
                writer.println()
            }
        }

        logger.lifecycle('DelosDB dead-code candidate report written: {}', reportFile)
    }
}



def delosHeapRawStoreDuplicateClassificationFile = file('gradle/static-analysis/delosdb-heap-rawstore-duplicate-classification.txt')

def delosHeapRawStoreDuplicateDecisions = ['KEEP', 'CONSOLIDATE', 'DEFER'] as Set

def delosLoadHeapRawStoreDuplicateClassifications = {
    if (!delosHeapRawStoreDuplicateClassificationFile.exists()) {
        return []
    }

    def rows = []
    int lineNumber = 0
    delosHeapRawStoreDuplicateClassificationFile.readLines('UTF-8').each { rawLine ->
        lineNumber++
        def line = rawLine.trim()
        if (!line || line.startsWith('#')) {
            return
        }
        def parts = line.split('\\|', -1).collect { it.trim() }
        if (parts.size() != 6) {
            throw new GradleException('Malformed heap/raw-store duplicate classification line ' + lineNumber + ': expected 6 pipe-delimited fields')
        }
        if (!delosHeapRawStoreDuplicateDecisions.contains(parts[1])) {
            throw new GradleException('Malformed heap/raw-store duplicate classification line ' + lineNumber + ': unknown decision ' + parts[1])
        }
        def files = parts[3].split(',').collect { it.trim() }.findAll { it }
        if (files.isEmpty()) {
            throw new GradleException('Malformed heap/raw-store duplicate classification line ' + lineNumber + ': no files listed')
        }
        rows << [
                id        : parts[0],
                decision  : parts[1],
                scope     : parts[2],
                files     : files,
                reason    : parts[4],
                nextAction: parts[5],
                lineNumber: lineNumber
        ]
    }
    rows
}

tasks.register('delosHeapRawStoreDuplicateClassificationReport') {
    group = 'verification'
    description = 'Reports curated duplicate-code classification for inherited Derby heap/raw-store code.'

    inputs.file(delosHeapRawStoreDuplicateClassificationFile).optional()
    outputs.file(layout.buildDirectory.file('reports/delosdb/heap-rawstore-duplicate-classification.txt'))

    doLast {
        def rows = delosLoadHeapRawStoreDuplicateClassifications()
        def ids = [] as Set
        def duplicateIds = []
        def missingFiles = []
        rows.each { row ->
            if (!ids.add(row.id)) {
                duplicateIds << row.id
            }
            row.files.each { relativePath ->
                if (!file(relativePath).exists()) {
                    missingFiles << [id: row.id, path: relativePath]
                }
            }
        }

        def counts = delosHeapRawStoreDuplicateDecisions.collectEntries { decision ->
            [decision, rows.count { it.decision == decision }]
        }
        def missingDecisions = delosHeapRawStoreDuplicateDecisions.findAll { decision -> counts[decision] == 0 }

        def reportFile = layout.buildDirectory.file('reports/delosdb/heap-rawstore-duplicate-classification.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB inherited heap/raw-store duplicate-code classification')
            writer.println('===============================================================')
            writer.println()
            writer.println('This report classifies duplicate-looking inherited Derby heap/raw-store code.')
            writer.println('It does not refactor code, delete code, or prove deletion safety.')
            writer.println()
            writer.println('Rows: ' + rows.size())
            delosHeapRawStoreDuplicateDecisions.sort().each { decision ->
                writer.println('  ' + decision + ': ' + counts[decision])
            }
            writer.println()
            rows.each { row ->
                writer.println(row.id + ' [' + row.decision + '] ' + row.scope)
                writer.println('  reason:      ' + row.reason)
                writer.println('  next action: ' + row.nextAction)
                writer.println('  files:')
                row.files.each { relativePath -> writer.println('    - ' + relativePath) }
                writer.println()
            }

            if (!duplicateIds.isEmpty() || !missingFiles.isEmpty() || !missingDecisions.isEmpty()) {
                writer.println('Validation failures:')
                duplicateIds.each { id -> writer.println('  duplicate id: ' + id) }
                missingFiles.each { missing -> writer.println('  missing file for ' + missing.id + ': ' + missing.path) }
                missingDecisions.each { decision -> writer.println('  missing decision category: ' + decision) }
            } else {
                writer.println('Classification file validated.')
            }
        }

        if (!duplicateIds.isEmpty() || !missingFiles.isEmpty() || !missingDecisions.isEmpty()) {
            throw new GradleException('Heap/raw-store duplicate classification validation failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB heap/raw-store duplicate classification written: {}', reportFile)
    }
}


def delosRuntimeArtifactModelFiles = [
        'build.gradle',
        'delosdb-tests/build.gradle',
        'gradle/delosdb-runtime-artifacts.gradle'
]

def delosRuntimeArtifactModelRequire = { List<String> failures, boolean condition, String message ->
    if (!condition) {
        failures << message
    }
}

tasks.register('delosRuntimeArtifactModelStaticAnalysis') {
    group = 'verification'
    description = 'Fails if DelosDB runtime jar/provider packaging drifts back into duplicate hard-coded Gradle lists.'

    inputs.files(delosRuntimeArtifactModelFiles.collect { file(it) }.findAll { it.exists() })
    outputs.file(layout.buildDirectory.file('reports/delosdb/runtime-artifact-model-static-analysis.txt'))

    doLast {
        def failures = []
        def rootBuild = file('build.gradle')
        def testsBuild = file('delosdb-tests/build.gradle')
        def runtimeArtifactsScript = file('gradle/delosdb-runtime-artifacts.gradle')

        def rootText = rootBuild.exists() ? rootBuild.getText('UTF-8') : ''
        def testsText = testsBuild.exists() ? testsBuild.getText('UTF-8') : ''
        def runtimeText = runtimeArtifactsScript.exists() ? runtimeArtifactsScript.getText('UTF-8') : ''

        delosRuntimeArtifactModelRequire(failures, runtimeArtifactsScript.isFile(),
                'Missing runtime artifact convention script: gradle/delosdb-runtime-artifacts.gradle')
        delosRuntimeArtifactModelRequire(failures,
                rootText.contains("apply from: 'gradle/delosdb-runtime-artifacts.gradle'")
                        || rootText.contains('apply from: "gradle/delosdb-runtime-artifacts.gradle"'),
                'Root build.gradle must apply gradle/delosdb-runtime-artifacts.gradle')

        def forbiddenRootRuntimeFragments = [
                'ext.delosdbRuntimeJarArtifacts = [',
                'def delosdbRuntimeJarArtifacts = [',
                'def runtimeJarArtifacts = [',
                'def runtimeJarNames = [',
                "tasks.register('jars')",
                'tasks.register("jars")'
        ]
        forbiddenRootRuntimeFragments.each { fragment ->
            if (rootText.contains(fragment)) {
                failures << "Root build.gradle must not duplicate runtime artifact model fragment: ${fragment}"
            }
        }

        delosRuntimeArtifactModelRequire(failures, runtimeText.contains('ext.delosdbRuntimeJarArtifacts = ['),
                'Runtime artifact convention script must declare ext.delosdbRuntimeJarArtifacts')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains('ext.delosdbAssembledSupportJarArtifacts = ['),
                'Runtime artifact convention script must declare ext.delosdbAssembledSupportJarArtifacts')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains('ext.delosdbAssembledJarArtifacts'),
                'Runtime artifact convention script must derive ext.delosdbAssembledJarArtifacts')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains('ext.delosdbRuntimeJarNames'),
                'Runtime artifact convention script must derive ext.delosdbRuntimeJarNames')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains('ext.delosdbRuntimeJarFiles'),
                'Runtime artifact convention script must expose ext.delosdbRuntimeJarFiles')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains("tasks.register('jars')"),
                'Runtime artifact convention script must own the root :jars task')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains('project.ext.delosdbAssembledJarTaskPaths'),
                'Root :jars task must be derived from ext.delosdbAssembledJarTaskPaths')

        ['storageMvcc', 'delosdb-storage-mvcc', 'delosDbStorageMvccJar', 'delosdb-storage-mvcc.jar'].each { token ->
            delosRuntimeArtifactModelRequire(failures, runtimeText.contains(token),
                    "Runtime artifact convention script must model MVCC provider artifact token: ${token}")
        }
        ['delosdb-storage-api.jar', 'delosdb-derby-store-api.jar'].each { token ->
            delosRuntimeArtifactModelRequire(failures, runtimeText.contains(token),
                    "Runtime artifact convention script must keep support artifact modeled outside the runtime jar list: ${token}")
        }

        delosRuntimeArtifactModelRequire(failures, runtimeText.contains("tasks.register('verifyDelosRuntimeStorageProviders')"),
                'Runtime artifact convention script must register verifyDelosRuntimeStorageProviders')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains("dependsOn 'jars'"),
                'verifyDelosRuntimeStorageProviders must depend on root :jars')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains('ServiceLoader.load'),
                'verifyDelosRuntimeStorageProviders must verify provider discovery through ServiceLoader')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains('META-INF/services/org.apache.derby.iapi.store.types.DelosStorageProviderFactory'),
                'verifyDelosRuntimeStorageProviders must check the DelosStorageProviderFactory service file')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains("expectedProviderName = 'delos_mvcc'"),
                'verifyDelosRuntimeStorageProviders must check providerName() == delos_mvcc')

        delosRuntimeArtifactModelRequire(failures, testsText.contains('rootProject.ext.delosdbRuntimeJarFiles.call()'),
                'delosdb-tests/build.gradle must derive Derby runtime jars from rootProject.ext.delosdbRuntimeJarFiles.call()')
        delosRuntimeArtifactModelRequire(failures, testsText.contains("dependsOn rootProject.tasks.named('verifyDelosRuntimeStorageProviders')"),
                'Focused MVCC SQL/DRDA gates must depend on verifyDelosRuntimeStorageProviders')
        [
                'runDelosMvccSqlIntegrationTest',
                'runDelosMvccDrdaNetworkClientTest',
                'runDelosMvccDrdaConcurrentNetworkClientTest'
        ].each { taskName ->
            delosRuntimeArtifactModelRequire(failures, testsText.contains(taskName),
                    "delosdb-tests/build.gradle must keep ${taskName} wired to provider verification")
        }

        def forbiddenTestRuntimeJarNames = [
                'delosdb-annotations.jar',
                'delosdb-spi.jar',
                'delosdb-storage-io.jar',
                'osgi-framework-stub.jar',
                'derbyshared.jar',
                'delosdb-runtime-api.jar',
                'delosdb-storage-mvcc.jar',
                'derby.jar',
                'derbyclient.jar',
                'derbytools.jar',
                'derbynet.jar',
                'derbyoptionaltools.jar',
                'derbyrun.jar'
        ]
        forbiddenTestRuntimeJarNames.each { jarName ->
            if (testsText.contains("'${jarName}'") || testsText.contains('"' + jarName + '"')
                    || testsText.contains("build/libs/${jarName}") || testsText.contains("libs/${jarName}")) {
                failures << "delosdb-tests/build.gradle must not hard-code Derby runtime jar name; use rootProject.ext.delosdbRuntimeJarFiles instead: ${jarName}"
            }
        }

        delosRuntimeArtifactModelRequire(failures, rootText.contains("tasks.named('s0CloseoutVerification')"),
                'Root build.gradle must wire additional closeout dependencies through tasks.named(s0CloseoutVerification)')
        delosRuntimeArtifactModelRequire(failures, rootText.contains("dependsOn 'verifyDelosRuntimeStorageProviders'"),
                's0CloseoutVerification must depend on verifyDelosRuntimeStorageProviders')

        def reportFile = layout.buildDirectory.file('reports/delosdb/runtime-artifact-model-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB runtime artifact model static analysis')
            writer.println('================================================')
            writer.println()
            writer.println('Checked files:')
            delosRuntimeArtifactModelFiles.each { writer.println('  - ' + it) }
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Runtime artifact model checks passed.')
            } else {
                writer.println('Runtime artifact model failures:')
                failures.each { failure -> writer.println('  - ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB runtime artifact model static analysis failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB runtime artifact model static analysis passed. Report: {}', reportFile)
    }
}

