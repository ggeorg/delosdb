    inputs.files(contractFile, testBuildFile, reviewBuildFile)
    outputs.file(layout.buildDirectory.file(
            'reports/delosdb/v1-baseline-capture-static-analysis.txt'))

    doLast {
        def failures = []
        if (!contractFile.isFile()) {
            failures << 'Missing v1 baseline capture contract: ' + contractFile
        } else {
            contractFile.readLines('UTF-8').eachWithIndex { line, index ->
                if (line.isBlank() || line.startsWith('#')) {
                    return
                }
                def fields = line.split('\\|', -1)
                if (fields.length != 4) {
                    failures << 'Malformed v1 baseline contract row at line ' + (index + 1)
                    return
                }
                def source = new File(delosRepositoryRoot, fields[1])
                if (!source.isFile()) {
                    failures << fields[0] + ': missing source ' + fields[1]
                } else if (!source.getText('UTF-8').contains(fields[2])) {
                    failures << fields[0] + ': missing marker ' + fields[2]
                }
            }
        }

        def testBuild = testBuildFile
        def reviewBuild = reviewBuildFile
        def staticBuild = new File(delosRepositoryRoot,
                'gradle/delosdb-storage-static-analysis.gradle')
        def testText = testBuild.isFile() ? testBuild.getText('UTF-8') : ''
        def reviewText = reviewBuild.isFile() ? reviewBuild.getText('UTF-8') : ''
        def staticText = staticBuild.isFile() ? staticBuild.getText('UTF-8') : ''
        def captureIndex = testText.indexOf("tasks.register('captureDelosV1Baseline')")
        if (captureIndex < 0) {
            failures << 'Missing captureDelosV1Baseline task'
        }
        def s0Index = staticText.lastIndexOf("tasks.register('s0CloseoutVerification')")
        if (s0Index < 0) {
            failures << 'Missing s0CloseoutVerification task'
        } else {
            def s0Text = staticText.substring(s0Index)
            if (s0Text.contains("'captureDelosV1Baseline'")
                    || s0Text.contains("'runDelosV1BaselineOperationalCapture'")
                    || s0Text.contains("'runDelosV1ModularImageDrdaTest'")
                    || s0Text.contains("'assembleDelosV1ModularRuntimeImage'")
                    || s0Text.contains("'reviewDelosV1ProductionCloseoutCapture'")
                    || s0Text.contains("'verifyDelosV1ProductionCloseout'")) {
                failures << 'Machine-specific v1 baseline execution must remain outside S0'
            }
            if (!s0Text.contains("'delosV1BaselineCaptureStaticAnalysis'")) {
                failures << 'S0 must retain the cheap v1 baseline contract static analysis'
            }
            if (!s0Text.contains("'delosV1AcceptedBaselineStaticAnalysis'")) {
                failures << 'S0 must verify the immutable accepted v1 baseline bundle'
            }
        }
        if (!testText.contains("status: 'CAPTURED_NOT_ACCEPTED'")) {
            failures << 'The capture manifest must not claim acceptance automatically'
        }
        if (!testText.contains("apply from: rootProject.file('gradle/delosdb-v1-production-closeout-review.gradle')")) {
            failures << 'The dedicated production-closeout review script must be applied'
        }
        if (!reviewText.contains("'REVIEWED_NOT_ACCEPTED'")) {
            failures << 'Production-closeout review must remain distinct from acceptance'
        }
        if (!testText.contains("tasks.register('promoteDelosV1Baseline')")) {
            failures << 'Missing explicit promoteDelosV1Baseline task'
        }
        def acceptanceCandidate = new File(delosRepositoryRoot,
                'benchmarks/v1-baseline/acceptance-candidate.json')
        if (!acceptanceCandidate.isFile()) {
            failures << 'Missing reviewed v1 acceptance candidate'
        } else if (!acceptanceCandidate.getText('UTF-8').contains(
                'e4103b829c3a4b9952507fa837b9187bc9deff872fe19d8daf0a76e99e2f6b17')) {
            failures << 'The acceptance candidate must pin the reviewed semantic checksum'
        }
        if (!testText.contains("dirty: dirty")) {
            failures << 'The capture manifest must record Git dirty state'
        }
        if (!testText.contains("runtimeArtifacts: runtimeArtifacts")) {
            failures << 'The capture manifest must fingerprint runtime artifacts'
        }
        if (!testText.contains("writers: [1, 2, 4, 8, 16]")) {
            failures << 'The manifest must record the fixed writer matrix'
        }

        def reportFile = new File(delosBuildRoot,
                'reports/delosdb/v1-baseline-capture-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB v1 baseline capture static analysis')
            writer.println('===========================================')
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
                writer.println('Execution boundary: capture tasks remain opt-in and outside S0.')
            } else {
                writer.println('Status: FAIL')
                failures.each { failure -> writer.println('- ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    'DelosDB v1 baseline capture static analysis failed. Report: ' + reportFile)
        }
        logger.lifecycle('DelosDB v1 baseline capture static analysis passed. Report: {}', reportFile)
    }
}



def delosV1AcceptedBaselineSha256 = { File input ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[64 * 1024]
        int count
        while ((count = stream.read(buffer)) >= 0) {
            if (count > 0) {
                digest.update(buffer, 0, count)
            }
        }
    }
    java.util.HexFormat.of().formatHex(digest.digest())
}

tasks.register('delosV1AcceptedBaselineStaticAnalysis') {
    group = 'verification'
    description = 'Verifies the tracked accepted v1 baseline manifest, review policy, lane inventory, and every evidence checksum.'

    def acceptedRoot = new File(delosRepositoryRoot, 'benchmarks/v1-baseline/accepted')
    def candidateFile = new File(delosRepositoryRoot,
            'benchmarks/v1-baseline/acceptance-candidate.json')
    outputs.upToDateWhen { false }
    outputs.file(layout.buildDirectory.file(
            'reports/delosdb/v1-accepted-baseline-static-analysis.txt'))

    doLast {
        def failures = []
        def acceptedManifest = null
        def candidate = null
        File manifestFile = new File(acceptedRoot, 'manifest.json')
        File checksumsFile = new File(acceptedRoot, 'checksums.sha256')
        File acceptedPolicyFile = new File(acceptedRoot, 'acceptance-policy.json')

        if (!candidateFile.isFile()) {
            failures << 'Missing tracked acceptance candidate: ' + candidateFile
        } else {
            try {
                candidate = new groovy.json.JsonSlurper().parse(candidateFile)
            } catch (Exception failure) {
                failures << 'Invalid acceptance candidate JSON: ' + failure.message
            }
        }
        if (!acceptedRoot.isDirectory()) {
            failures << 'Missing tracked accepted v1 baseline bundle: ' + acceptedRoot
        }
        if (!manifestFile.isFile()) {
            failures << 'Missing accepted baseline manifest.json'
        } else {
            try {
                acceptedManifest = new groovy.json.JsonSlurper().parse(manifestFile)
            } catch (Exception failure) {
                failures << 'Invalid accepted manifest JSON: ' + failure.message
            }
        }
        if (!checksumsFile.isFile()) {
            failures << 'Missing accepted baseline checksums.sha256'
        }
        if (!acceptedPolicyFile.isFile()) {
            failures << 'Missing accepted baseline acceptance-policy.json'
        }

        if (acceptedManifest != null && candidate != null) {
            if (acceptedManifest.schemaVersion != 1) {
                failures << 'Accepted manifest schema must be 1'
            }
            if (acceptedManifest.status != candidate.acceptedStatus) {
                failures << 'Accepted manifest status mismatch: ' + acceptedManifest.status
            }
            if (acceptedManifest.baselineId != candidate.baselineId) {
                failures << 'Accepted manifest baseline id mismatch'
            }
            if (acceptedManifest.semanticChecksum != candidate.expectedSemanticChecksum) {
                failures << 'Accepted semantic checksum does not match the reviewed candidate'
            }
            if (acceptedManifest.source?.dirty != false) {
                failures << 'Accepted baseline must originate from a clean capture'
            }
            if (!java.util.regex.Pattern.matches('[0-9a-f]{40,64}',
                    String.valueOf(acceptedManifest.source?.revision ?: ''))) {
                failures << 'Accepted source revision is missing or malformed'
            }
            String javaVersion = String.valueOf(acceptedManifest.environment?.javaVersion ?: '')
            def javaVersionParts = javaVersion.tokenize('.')
            String javaMajor = javaVersionParts.isEmpty() ? '' : javaVersionParts[0]
            if (javaMajor != String.valueOf(candidate.requiredJavaMajor)) {
                failures << 'Accepted baseline must be captured on JDK ' + candidate.requiredJavaMajor
            }
            def expectedMatrix = [
                    writers: [1, 2, 4, 8, 16],
                    providers: ['heap', 'delos_mvcc'],
                    topologies: ['same-table', 'different-tables', 'different-databases'],
                    workloads: ['single-row-insert', 'multi-row-insert', 'mixed-insert-update']
            ]
            if (acceptedManifest.matrix != expectedMatrix) {
                failures << 'Accepted baseline matrix differs from the frozen v1 matrix'
            }
            def requiredLanes = [
                    'operational',
                    'jdbc-lifecycle',
                    'jdbc-batch-scaling',
                    'jdbc-transactions',
                    'jdbc-row-scaling',
                    'mvcc-buffer-cache',
                    'mvcc-page-codec',
                    'drda-stress',
                    'recovery-differential',
                    'failure-replay',
                    'low-level-failure-replay'
            ]
            if (acceptedManifest.lanes != requiredLanes) {
                failures << 'Accepted lane inventory differs from the frozen v1 lane inventory'
            }
            requiredLanes.each { lane ->
                File laneRoot = new File(acceptedRoot, 'raw/' + lane)
                if (!laneRoot.isDirectory() || laneRoot.listFiles() == null
                        || laneRoot.listFiles().length == 0) {
                    failures << 'Accepted lane is missing or empty: ' + lane
                }
            }
            if (!(acceptedManifest.semanticTokenCount instanceof Number)
                    || acceptedManifest.semanticTokenCount.intValue() <= 0) {
                failures << 'Accepted baseline contains no semantic evidence tokens'
            }
            if (!(acceptedManifest.runtimeArtifacts instanceof Collection)
                    || acceptedManifest.runtimeArtifacts.isEmpty()) {
                failures << 'Accepted baseline contains no runtime artifact fingerprints'
            }
            if (!(acceptedManifest.acceptance instanceof Map)) {
                failures << 'Accepted manifest is missing acceptance metadata'
            } else {
                ['captureManifestSha256', 'captureChecksumsSha256', 'acceptancePolicySha256'].each { key ->
                    if (!java.util.regex.Pattern.matches('[0-9a-f]{64}',
                            String.valueOf(acceptedManifest.acceptance[key] ?: ''))) {
                        failures << 'Accepted manifest has invalid acceptance hash: ' + key
                    }
                }
                if (acceptedManifest.acceptance.policyVersion != candidate.policyVersion) {
                    failures << 'Accepted policy version mismatch'
                }
            }
            if (acceptedPolicyFile.isFile()
                    && delosV1AcceptedBaselineSha256(acceptedPolicyFile)
                    != delosV1AcceptedBaselineSha256(candidateFile)) {
                failures << 'Accepted policy copy differs from the tracked review candidate'
            }
        }

        def listed = [] as Set
        long totalBytes = 0L
        if (checksumsFile.isFile() && acceptedRoot.isDirectory()) {
            checksumsFile.readLines('UTF-8').eachWithIndex { String line, int index ->
                def matcher = java.util.regex.Pattern.compile('^([0-9a-f]{64})  (.+)$').matcher(line)
                if (!matcher.matches()) {
                    failures << 'Malformed accepted checksum row at line ' + (index + 1)
                    return
                }
                String expected = matcher.group(1)
                String relative = matcher.group(2)
                if (relative.startsWith('/') || relative.contains('..')) {
                    failures << 'Unsafe accepted checksum path: ' + relative
                    return
                }
                if (!listed.add(relative)) {
                    failures << 'Duplicate accepted checksum path: ' + relative
                    return
                }
                File evidence = new File(acceptedRoot, relative)
                if (!evidence.isFile()) {
                    failures << 'Missing accepted evidence file: ' + relative
                } else {
                    totalBytes += evidence.length()
                    String actual = delosV1AcceptedBaselineSha256(evidence)
                    if (actual != expected) {
                        failures << 'Accepted evidence checksum mismatch: ' + relative
                    }
                }
            }
            def actual = [] as Set
            acceptedRoot.eachFileRecurse { file ->
                if (file.isFile()) {
                    String relative = acceptedRoot.toPath().relativize(file.toPath())
                            .toString().replace('\\', '/')
                    if (relative != 'checksums.sha256') {
                        actual.add(relative)
                    }
                }
            }
            def unlisted = actual - listed
            def stale = listed - actual
            if (!unlisted.isEmpty()) {
                failures << 'Accepted files missing checksum rows: ' + unlisted.sort().join(', ')
            }
            if (!stale.isEmpty()) {
                failures << 'Accepted checksum rows missing files: ' + stale.sort().join(', ')
            }
        }

        def reportFile = new File(delosBuildRoot,
                'reports/delosdb/v1-accepted-baseline-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB accepted v1 baseline static analysis')
            writer.println('============================================')
            writer.println()
            writer.println('Accepted root: ' + acceptedRoot)
            writer.println('Evidence files: ' + listed.size())
            writer.println('Evidence bytes: ' + totalBytes)
            if (acceptedManifest != null) {
                writer.println('Source revision: ' + acceptedManifest.source?.revision)
                writer.println('Semantic checksum: ' + acceptedManifest.semanticChecksum)
            }
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { failure -> writer.println('- ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    'DelosDB accepted v1 baseline static analysis failed. Report: ' + reportFile)
        }
        logger.lifecycle('DelosDB accepted v1 baseline static analysis passed. Report: {}', reportFile)
    }
}


tasks.register('delosMvccTransactionalDdlStaticAnalysis') {
    group = 'verification'
    description = 'Protects RawStore-owned transactional MVCC CREATE/DROP and savepoint semantics.'

    def required = [
            file('delosdb-storage-mvcc/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccConglomerateFactory.java'),
            file('delosdb-storage-mvcc/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccConglomerate.java'),
            file('delosdb-storage-mvcc/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccRawStoreTransactionContext.java'),
            file('delosdb-storage-mvcc/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccRawStoreTable.java'),
            file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccRawStorePhysicalLockingTest.java'),
            file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccRawStoreVacuumTest.java')
    ]
    inputs.files(required)
    outputs.file(layout.buildDirectory.file('reports/delosdb/mvcc-transactional-ddl-static-analysis.txt'))

    doLast {
        def failures = []
        required.each { if (!it.isFile()) failures << 'Missing required source: ' + it }
        if (failures.isEmpty()) {
            def factory = required[0].getText('UTF-8')
            def conglomerate = required[1].getText('UTF-8')
            def context = required[2].getText('UTF-8')
            def table = required[3].getText('UTF-8')
            def physicalTest = required[4].getText('UTF-8')
            def vacuumTest = required[5].getText('UTF-8')

            if (!factory.contains('MvccRawStoreTable.create(')
                    || !factory.contains('.markCreatedTable(descriptor)')) {
                failures << 'MVCC CREATE must create containers and register them in the owning RawStore transaction context'
            }
            if (!conglomerate.contains('context.beforeDrop(currentTable);')
                    || !conglomerate.contains('MvccRawStoreTable.drop(')) {
                failures << 'MVCC DROP must register lifecycle intent before transactional RawStore container drop'
            }
            if (!context.contains('private final Map<ContainerKey, MvccRawStoreTable.Descriptor> createdTables')
                    || !context.contains('private final Map<ContainerKey, MvccRawStoreTable.Descriptor> droppedTables')
                    || !context.contains('void markCreatedTable(')
                    || !context.contains('void beforeDrop(')
                    || !context.contains('afterRollbackToSavepoint')) {
                failures << 'RawStore transaction context must own CREATE/DROP and savepoint reconciliation state'
            }
            if (!table.contains('rawTransaction.dropContainer(table.metadataContainer())')
                    || !table.contains('rawTransaction.dropContainer(table.versionContainer())')) {
                failures << 'MVCC DROP must use inherited transactional RawStore container operations'
            }
            if (!physicalTest.contains('rollback(beforeGeneration)')
                    || !vacuumTest.contains('rollback(beforeVacuum)')) {
                failures << 'Permanent RawStore savepoint proofs must remain present'
            }
            ['MvccConglomerateLifecycleAction', 'MvccDatabaseRuntime',
             'database-decisions', 'BEFORE_DERBY_RAW_STORE_COMMIT'].each { token ->
                if (factory.contains(token) || conglomerate.contains(token) || context.contains(token)) {
                    failures << 'RawStore transactional DDL path retains retired lifecycle authority token: ' + token
                }
            }
        }
        def reportFile = layout.buildDirectory.file(
                'reports/delosdb/mvcc-transactional-ddl-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB RawStore transactional MVCC DDL static analysis')
            writer.println('=======================================================')
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) throw new GradleException(
                'Transactional MVCC DDL static analysis failed. Report: ' + reportFile)
        logger.lifecycle('Transactional MVCC DDL static analysis passed. Report: {}', reportFile)
    }
}

tasks.register('delosAccessMethodTransactionLifecycleStaticAnalysis') {
    group = 'verification'
    description = 'Verifies the neutral access-method lifecycle seam brackets inherited RawStore transaction operations.'

    def lifecycleFile = file('delosdb-derby-store-api/src/main/java/org/apache/derby/iapi/store/access/conglomerate/AccessMethodTransactionLifecycle.java')
    def transactionManagerFile = file('delosdb-derby-store-api/src/main/java/org/apache/derby/iapi/store/access/conglomerate/TransactionManager.java')
    def ramTransactionFile = file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/RAMTransaction.java')
    def lifecycleTestFile = file('delosdb-storage-derby/src/test/java/org/apache/derby/impl/store/access/AccessMethodTransactionLifecycleTest.java')
    def storageDerbyBuildFile = file('delosdb-storage-derby/build.gradle')
    inputs.files(lifecycleFile, transactionManagerFile, ramTransactionFile,
            lifecycleTestFile, storageDerbyBuildFile)
    outputs.file(layout.buildDirectory.file('reports/delosdb/access-method-transaction-lifecycle-static-analysis.txt'))

    doLast {
        def failures = []
        [lifecycleFile, transactionManagerFile, ramTransactionFile,
                lifecycleTestFile, storageDerbyBuildFile].each { sourceFile ->
            if (!sourceFile.isFile()) {
                failures << 'Missing required file: ' + sourceFile
            }
        }

        if (failures.isEmpty()) {
            def lifecycleText = lifecycleFile.getText('UTF-8')
            def transactionManagerText = transactionManagerFile.getText('UTF-8')
            def ramText = ramTransactionFile.getText('UTF-8')
            def testText = lifecycleTestFile.getText('UTF-8')
            def buildText = storageDerbyBuildFile.getText('UTF-8')

            [
                    'enum CommitMode',
                    'NO_SYNC_RELEASE_LOCKS',
                    'NO_SYNC_KEEP_LOCKS',
                    'record SavepointIdentity(String name, Object kind)',
                    'enum XaOperation',
                    'beforeNestedUserTransaction(boolean readOnly)',
                    'beforeXaOperation(XaOperation operation)',
                    'beforeDestroy()',
                    'afterDestroy()'
            ].each { token ->
                if (!lifecycleText.contains(token)) {
                    failures << 'Lifecycle contract is missing: ' + token
                }
            }

            [
                    'registerAccessMethodTransactionLifecycle(',
                    'accessMethodTransactionLifecycle(Object key)',
                    'removeAccessMethodTransactionLifecycle(Object key)'
            ].each { token ->
                if (!transactionManagerText.contains(token)) {
                    failures << 'TransactionManager is missing lifecycle ownership method: ' + token
                }
            }

            def requireOrdered = { String description, String section, List<String> tokens ->
                int previous = -1
                tokens.each { token ->
                    int current = section.indexOf(token)
                    if (current < 0) {
                        failures << description + ' is missing token: ' + token
                    } else if (current <= previous) {
                        failures << description + ' has incorrect ordering at token: ' + token
                    }
                    previous = current
                }
            }
            def section = { String start, String end ->
                int startIndex = ramText.indexOf(start)
                int endIndex = startIndex < 0 ? -1 : ramText.indexOf(end, startIndex + start.length())
                if (startIndex < 0 || endIndex < 0) {
                    failures << 'Could not isolate RAMTransaction section: ' + start
                    return ''
                }
                ramText.substring(startIndex, endIndex)
            }

            requireOrdered('synchronized commit lifecycle',
                    section('public void commit()', 'public DatabaseInstant commitNoSync'),
                    ['closeControllers(false', 'notifyBeforeCommit(', 'rawtran.commit()', 'notifyAfterCommit('])
            requireOrdered('no-sync commit lifecycle',
                    section('public DatabaseInstant commitNoSync', 'public void abort()'),
                    ['closeControllers(false', 'notifyBeforeCommit(', 'rawtran.commitNoSync(', 'notifyAfterCommit('])
            requireOrdered('abort lifecycle',
                    section('public void abort()', 'public ContextManager getContextManager'),
                    ['notifyBeforeAbort(', 'rawtran.abort()', 'notifyAfterAbort('])
            requireOrdered('set-savepoint lifecycle',
                    section('public int setSavePoint', 'public int releaseSavePoint'),
                    ['rawtran.setSavePoint(', 'afterSetSavepoint('])
            requireOrdered('rollback-savepoint lifecycle',
                    section('public int rollbackToSavePoint', 'public void destroy()'),
                    ['rawtran.rollbackToSavePoint(', 'afterRollbackToSavepoint('])
            requireOrdered('nested transaction fail-closed boundary',
                    section('public TransactionController startNestedUserTransaction', 'public Transaction getRawStoreXact'),
                    ['beforeNestedUserTransaction(readOnly)', 'getContextManager()', 'startNestedReadOnlyUserTransaction'])

            [
                    'notifyBeforeXaOperation(AccessMethodTransactionLifecycle.XaOperation.PREPARE)',
                    'AccessMethodTransactionLifecycle.XaOperation.COMMIT_ONE_PHASE',
                    'AccessMethodTransactionLifecycle.XaOperation.COMMIT_TWO_PHASE',
                    'notifyBeforeXaOperation(AccessMethodTransactionLifecycle.XaOperation.ROLLBACK)',
                    'AccessMethodTransactionLifecycle.XaOperation.MORPH_LOCAL_TO_XA',
                    'notifyAfterDestroy(lifecycles, callbackFailure)'
            ].each { token ->
                if (!ramText.contains(token.replace('\\n', '\n'))) {
                    failures << 'RAMTransaction lifecycle seam is missing: ' + token
                }
            }

            if (!ramText.contains('(commitflag & Transaction.KEEP_LOCKS) != 0')) {
                failures << 'commitNoSync lifecycle mode must honor KEEP_LOCKS as a bit flag'
            }
            if (!testText.contains('ACCESS_METHOD_TRANSACTION_LIFECYCLE_OK')
                    || !testText.contains('testAbortCallbackFailureCannotPreventRawStoreUndo')
                    || !testText.contains('testSavepointIdentityAndRawStoreFirstOrdering')
                    || !testText.contains('READONLY_TRANSACTION_INITIALIZATION')
                    || !testText.contains('testNestedUpdateAndXaFailClosedBeforeRawStore')) {
                failures << 'Focused lifecycle test must cover commit flags, abort safety, savepoints, nested and XA boundaries'
            }
            if (!buildText.contains("tasks.register('runAccessMethodTransactionLifecycleTest'")) {
                failures << 'storage-derby must expose runAccessMethodTransactionLifecycleTest'
            }
        }

        def reportFile = layout.buildDirectory
                .file('reports/delosdb/access-method-transaction-lifecycle-static-analysis.txt')
                .get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB access-method transaction lifecycle static analysis')
            writer.println('===========================================================')
            writer.println()
            writer.println('Rule: access-method semantic state is owned by RAMTransaction and brackets real RawStore lifecycle operations.')
            writer.println()
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'Access-method transaction lifecycle static analysis failed. Report: '
                            + reportFile)
        }
        logger.lifecycle(
                'Access-method transaction lifecycle static analysis passed. Report: {}',
                reportFile)
    }
}

