            def inspectionText = inspectionFile.getText('UTF-8')
            def sqlTestText = sqlTestFile.getText('UTF-8')
            def testsBuildText = testsBuildFile.getText('UTF-8')
            def designText = designFile.getText('UTF-8')

            def requireTokens = { String description, String source, List<String> tokens ->
                tokens.each { token ->
                    if (!source.contains(token)) {
                        failures << description + ' is missing token: ' + token
                    }
                }
            }
            def requireOrdered = { String description, String source, List<String> tokens ->
                int previous = -1
                tokens.each { token ->
                    int current = source.indexOf(token)
                    if (current < 0) {
                        failures << description + ' is missing token: ' + token
                    } else if (current <= previous) {
                        failures << description + ' has incorrect ordering at token: ' + token
                    }
                    previous = current
                }
            }
            def section = { String source, String start, String end, String description ->
                int startIndex = source.indexOf(start)
                int endIndex = startIndex < 0 ? -1 : source.indexOf(end, startIndex + start.length())
                if (startIndex < 0 || endIndex < 0) {
                    failures << 'Could not isolate ' + description
                    return ''
                }
                source.substring(startIndex, endIndex)
            }

            requireTokens('Optional physical hint row tails', formatText, [
                    'DIRECTORY_HEAD_HINT_PAGE',
                    'DIRECTORY_HEAD_HINT_RECORD',
                    'DIRECTORY_BASE_FIELD_COUNT',
                    'DIRECTORY_HINT_FIELD_COUNT',
                    'VERSION_LOOKUP_HINT_FIELD_COUNT',
                    'versionHintPageField',
                    'versionHintRecordField'
            ])

            def findVersionSection = section(tableText,
                    'private static VersionRecord findVersion(',
                    'private static VersionRecord findVersionByHint(',
                    'logical version lookup dispatch')
            requireOrdered('Validated hint before logical fallback', findVersionSection, [
                    'findVersionByHint(',
                    'if (hinted != null)',
                    'findVersionByLogicalId('
            ])

            def hintedLookupSection = section(tableText,
                    'private static VersionRecord findVersionByHint(',
                    'private static VersionRecord findVersionByLogicalId(',
                    'validated physical hint lookup')
            requireTokens('Physical hint validation', hintedLookupSection, [
                    'if (!hint.valid())',
                    'container.getPage(hint.pageNumber())',
                    'page.getRecordHandle(hint.recordId())',
                    'VERSION_KIND_FIELD',
                    'VERSION_ROW_ID',
                    'VERSION_ID',
                    'return null',
                    'decodeVersionAtSlot('
            ])

            requireTokens('Durable directory and predecessor hints', tableText, [
                    'directoryRow(',
                    'RecordHint.of(versionHandle)',
                    'RecordHint.of(previousVersion.handle())',
                    'hint = version.previousHint()',
                    'DIRECTORY_BASE_FIELD_COUNT',
                    'versionBaseFieldCount(table.columnCount())'
            ])
            def visibleChainSection = section(tableText,
                    'private static VersionRecord findVisibleVersion(',
                    'private static DirectoryHead findHead(',
                    'logical version-chain traversal')
            requireOrdered('Logical identity remains chain authority', visibleChainSection, [
                    'long versionId = head.versionId()',
                    'findVersion(',
                    'versionId = version.previousVersionId()',
                    'hint = version.previousHint()'
            ])

            requireTokens('Executable hint inspection and corruption proof', inspectionText, [
                    'physicalPage',
                    'physicalRecord',
                    'previousHintPage',
                    'previousHintRecord',
                    'invalidateLookupHints(',
                    'stripLookupHints(',
                    'DIRECTORY_BASE_FIELD_COUNT',
                    'VERSION_LOOKUP_HINT_FIELD_COUNT'
            ])

            [
                    'testPersistedHintsMatchPhysicalRecordsAndSurviveReopen',
                    'testStaleHintsFallBackForCurrentAndHistoricalSnapshots',
                    'testRowsWithoutOptionalHintsRemainReadableAndUpgradeOnMutation',
                    'testCrashRecoveryAndMemoryUseTheSameHintRules'
            ].each { methodName ->
                if (!sqlTestText.contains(methodName)) {
