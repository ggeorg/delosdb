        exclude '**/.git/**'
    })
    outputs.dir(delosModuleDependencyReportDir)

    commandLine 'python3', 'scripts/module-dependency-tree.py'
}

tasks.register('delosModuleDependencyBoundaryStaticAnalysis') {
    group = 'verification'
    description = 'Verifies objective DelosDB module dependency and resource-boundary invariants.'
    dependsOn 'delosModuleDependencyReport'

    inputs.files(delosModuleDependencyReportFiles.collect { name ->
        delosModuleDependencyReportDir.map { it.file(name) }
    })
    inputs.file('delosdb-engine/src/main/java/org/apache/derby/impl/services/monitor/BaseMonitor.java')
    outputs.file(layout.buildDirectory.file('reports/delosdb/module-dependency-boundary-static-analysis.txt'))

    doLast {
        def reportDir = delosModuleDependencyReportDir.get().asFile
        def failures = []
        def summaryFile = new File(reportDir, 'module-dependencies.md')
        def summaryText = summaryFile.isFile() ? summaryFile.getText('UTF-8') : ''

        def expectedZeroSummaryLines = [
                '| Missing declared production dependencies | 0 |',
                '| Package owner collisions | 0 |',
                '| Duplicate resource paths | 0 |',
                '| Duplicate service resource paths | 0 |',
                '| Cross-module output-dir backdoor lines | 0 |',
                '| Unresolved project imports | 0 |'
        ]
        expectedZeroSummaryLines.each { line ->
            if (!summaryText.contains(line)) {
                failures << 'Module dependency summary must keep zero invariant: ' + line
            }
        }

        [
                'missing-declared-project-dependencies.tsv' : 'missing declared production dependencies',
                'duplicate-resources.tsv'                  : 'duplicate resource paths',
                'output-dir-backdoors.tsv'                 : 'cross-module output-dir backdoor lines',
                'unresolved-imports.tsv'                   : 'unresolved project imports'
        ].each { String fileName, String description ->
            def rows = DelosDbStaticAnalysisSupport.nonHeaderRows(new File(reportDir, fileName))
            if (!rows.isEmpty()) {
                failures << "Unexpected ${description}: " + rows.join(' | ')
            }
        }

        def mvccBuild = new File(delosRepositoryRoot, 'delosdb-storage-mvcc/build.gradle')
        def mvccBuildText = mvccBuild.isFile() ? mvccBuild.getText('UTF-8') : ''
        if (!mvccBuildText.contains("implementation project(':delosdb-runtime-api')")) {
            failures << "delosdb-storage-mvcc must declare its direct runtime-api dependency; do not rely on transitive storage-api wiring."
        }

        def baseMonitor = new File(delosRepositoryRoot,
                'delosdb-engine/src/main/java/org/apache/derby/impl/services/monitor/BaseMonitor.java')
        def baseMonitorText = baseMonitor.isFile() ? baseMonitor.getText('UTF-8') : ''
        if (baseMonitorText.contains('new ClassInfo(clazz)')
                || baseMonitorText.contains('import org.apache.derby.iapi.services.loader.ClassInfo;')) {
            failures << 'Registered-format construction must not be delegated to runtime-api ClassInfo across the JPMS boundary.'
        }
        [
                'private static final class RegisteredFormatInstanceGetter',
                'constructor = registeredClass.getConstructor();',
                'return constructor.newInstance();',
                'new RegisteredFormatInstanceGetter(clazz)'
        ].each { token ->
            if (!baseMonitorText.contains(token)) {
                failures << 'BaseMonitor must keep registered-format constructor lookup and invocation inside the engine module: missing ' + token
            }
        }

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/module-dependency-boundary-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB module dependency boundary static analysis')
            writer.println('=================================================')
            writer.println()
            writer.println('Source report directory: ' + reportDir)
            writer.println('Checked invariants:')
            writer.println('  - no missing declared production dependencies')
            writer.println('  - no package owner collisions')
            writer.println('  - no duplicate resource paths or service resources')
            writer.println('  - no cross-module output-dir backdoor lines')
            writer.println('  - no unresolved project imports')
            writer.println('  - delosdb-storage-mvcc declares delosdb-runtime-api directly')
            writer.println('  - registered-format construction remains inside the engine module')
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Module dependency boundary checks passed.')
            } else {
                writer.println('Module dependency boundary failures:')
                failures.each { failure -> writer.println('  - ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB module dependency boundary static analysis failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB module dependency boundary static analysis passed. Report: {}', reportFile)
    }
}



def delosV1FinalModuleTargetFile = new File(
        delosRepositoryRoot,
        'gradle/static-analysis/delosdb-v1-final-module-target.txt')

tasks.register('delosV1ModuleArchitectureStaticAnalysis') {
    group = 'verification'
    description = 'Enforces the current provider-isolation boundary and the final 21-module DelosDB v1 target.'

    inputs.file(delosV1FinalModuleTargetFile)
    inputs.file('settings.gradle')
    inputs.files(fileTree('.') {
        include '*/build.gradle'
        include '*/src/main/java/**/*.java'
        include '*/src/main/resources/META-INF/services/**'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
    })
    outputs.file(layout.buildDirectory.file('reports/delosdb/v1-module-architecture-static-analysis.txt'))

    doLast {
        def failures = []
        def observations = []

        def sections = new LinkedHashMap<String, List<String>>()
        String currentSection = null
        delosV1FinalModuleTargetFile.readLines('UTF-8').each { String rawLine ->
            def line = rawLine.trim()
            if (!line || line.startsWith('#')) {
                return
            }
            def sectionMatcher = line =~ /^\[([^]]+)]$/
            if (sectionMatcher.matches()) {
                currentSection = sectionMatcher.group(1)
                sections[currentSection] = []
                return
            }
            if (currentSection == null) {
                failures << 'Final-module target contains a value outside a section: ' + line
            } else {
                sections[currentSection] << line
            }
        }

        def expectedTargetModules = [
                'delosdb-osgi-stub',
                'delosdb-commons',
                'delosdb-runtime-api',
                'delosdb-annotations',
                'delosdb-spi',
                'delosdb-derby-store-api',
                'delosdb-storage-derby',
                'delosdb-storage-mvcc',
                'delosdb-search-lucene',
                'delosdb-engine',
                'delosdb-client',
                'delosdb-tools',
                'delosdb-runner',
                'delosdb-optionaltools',
                'delosdb-server',
                'delosdb-tests',
                'delosdb-pptesting',
                'delosdb-storeless',
                'delosdb-demos',
                'delosdb-locales',
                'delosdb-buildtools'
        ]
        def expectedRetiredModules = [
                'delosdb-storage-api',
                'delosdb-storage-io',
                'delosdb-storage-bridge'
        ]
        def expectedProviderArtifacts = [
                'delosdb-storage-mvcc.jar',
                'delosdb-search-lucene.jar'
        ]
        def expectedBuildOnlyArtifacts = [
                'delosdb-storage-derby.jar'
        ]
        def expectedForbiddenEdges = [
                'delosdb-engine -> delosdb-storage-mvcc',
                'delosdb-engine -> delosdb-search-lucene',
                'delosdb-storage-mvcc -> delosdb-engine',
                'delosdb-storage-mvcc -> delosdb-search-lucene',
                'delosdb-search-lucene -> delosdb-engine',
                'delosdb-storage-derby -> delosdb-storage-mvcc',
                'delosdb-storage-derby -> delosdb-search-lucene'
        ]
        def expectedNeutralApiModules = [
                'delosdb-runtime-api',
                'delosdb-spi',
                'delosdb-derby-store-api'
        ]

        def requireExactSection = { String sectionName, List<String> expectedValues ->
            def actualValues = sections[sectionName] ?: []
            if (actualValues != expectedValues) {
                failures << (
                        "Final-module target section [${sectionName}] differs from the frozen v1 target. " +
                                "Expected ${expectedValues}; found ${actualValues}.")
            }
        }
        requireExactSection('target-modules', expectedTargetModules)
        requireExactSection('retired-modules', expectedRetiredModules)
        requireExactSection('required-provider-artifacts', expectedProviderArtifacts)
        requireExactSection('build-only-artifacts', expectedBuildOnlyArtifacts)
        requireExactSection('forbidden-production-edges', expectedForbiddenEdges)
        requireExactSection('neutral-api-modules', expectedNeutralApiModules)

        def settingsModules = new LinkedHashSet<String>()
        new File(delosRepositoryRoot, 'settings.gradle').readLines('UTF-8').each { String line ->
            def matcher = line =~ /^\s*include\s+['"]([^'"]+)['"]\s*$/
            if (matcher.matches()) {
                settingsModules << matcher.group(1)
            }
        }

        def allowedMigrationModules = new LinkedHashSet<String>(expectedTargetModules)
        allowedMigrationModules.addAll(expectedRetiredModules)
        def unknownModules = settingsModules.findAll { !allowedMigrationModules.contains(it) }
        if (!unknownModules.isEmpty()) {
            failures << 'settings.gradle contains modules outside the frozen v1 migration set: ' + unknownModules
        }

        def requiredBeforeLuceneSplit = expectedTargetModules.findAll {
            it != 'delosdb-search-lucene'
        }
        def missingRequiredModules = requiredBeforeLuceneSplit.findAll { !settingsModules.contains(it) }
        if (!missingRequiredModules.isEmpty()) {
            failures << 'settings.gradle is missing required core/future modules: ' + missingRequiredModules
        }

        boolean luceneModulePresent = settingsModules.contains('delosdb-search-lucene')
        def retainedLegacyModules = expectedRetiredModules.findAll { String moduleName ->
            settingsModules.contains(moduleName)
        }
        def expectedMigrationModules = new LinkedHashSet<String>(expectedTargetModules)
        if (!luceneModulePresent) {
            expectedMigrationModules.remove('delosdb-search-lucene')
        }
        expectedMigrationModules.addAll(retainedLegacyModules)
        def missingMigrationModules = expectedMigrationModules.findAll { String moduleName ->
            !settingsModules.contains(moduleName)
        }
        def unexpectedMigrationModules = settingsModules.findAll { String moduleName ->
            !expectedMigrationModules.contains(moduleName)
        }
        if (!missingMigrationModules.isEmpty() || !unexpectedMigrationModules.isEmpty()) {
            failures << (
                    "Current settings.gradle does not match the valid v1 migration module set. " +
                            "Missing ${missingMigrationModules}; unexpected ${unexpectedMigrationModules}.")
        }
        observations << "Current Gradle subprojects: ${settingsModules.size()}"
        observations << 'Final Gradle subprojects: 21'
        observations << (luceneModulePresent
                ? 'delosdb-search-lucene is present.'
                : 'delosdb-search-lucene is not present yet; it is added during the Lucene foundation stage.')
        observations << 'Transitional modules still present: ' + retainedLegacyModules

        def buildCode = { String moduleName ->
            def buildFile = new File(delosRepositoryRoot, moduleName + '/build.gradle')
            if (!buildFile.isFile()) {
                return ''
            }
            DelosDbStaticAnalysisSupport.codeLinesWithoutComments(buildFile.readLines('UTF-8')).join('\n')
        }
        def hasProjectReference = { String moduleName, String targetModule ->
            def code = buildCode(moduleName)
            def pattern = Pattern.compile(
                    "project\\s*\\(\\s*(?:path\\s*:\\s*)?['\"]:"
                            + Pattern.quote(targetModule)
                            + "['\"]")
            pattern.matcher(code).find()
        }
        def forbidProjectReference = { String sourceModule, String targetModule ->
            if (new File(delosRepositoryRoot, sourceModule).isDirectory()
                    && hasProjectReference(sourceModule, targetModule)) {
                failures << "Forbidden project dependency: ${sourceModule} -> ${targetModule}"
            }
        }

        forbidProjectReference('delosdb-engine', 'delosdb-storage-mvcc')
        forbidProjectReference('delosdb-engine', 'delosdb-search-lucene')
        forbidProjectReference('delosdb-storage-derby', 'delosdb-storage-mvcc')
        forbidProjectReference('delosdb-storage-derby', 'delosdb-search-lucene')
        forbidProjectReference('delosdb-storage-mvcc', 'delosdb-engine')
        forbidProjectReference('delosdb-storage-mvcc', 'delosdb-search-lucene')
        if (luceneModulePresent) {
            forbidProjectReference('delosdb-search-lucene', 'delosdb-engine')
        }
        if (settingsModules.contains('delosdb-storage-bridge')) {
            forbidProjectReference('delosdb-storage-bridge', 'delosdb-engine')
            forbidProjectReference('delosdb-storage-bridge', 'delosdb-search-lucene')
        }

        def rejectImports = { String moduleName, List<String> forbiddenPrefixes, String description ->
            def sourceRoot = new File(delosRepositoryRoot, moduleName + '/src/main/java')
            if (!sourceRoot.isDirectory()) {
                return
            }
            DelosDbStaticFileSupport.javaFiles([sourceRoot]).each { File sourceFile ->
                if (sourceFile.name == 'module-info.java') {
                    return
                }
                sourceFile.readLines('UTF-8').eachWithIndex { String line, int index ->
                    def importedType = DelosDbStaticAnalysisSupport.importTarget(line)
                    if (importedType != null
                            && forbiddenPrefixes.any { String prefix -> importedType.startsWith(prefix) }) {
                        failures << (
                                description + ': ' +
                                        DelosDbStaticAnalysisSupport.relativePath(delosRepositoryRoot, sourceFile) +
                                        ':' + (index + 1) + ': ' + line.trim())
                    }
                }
            }
        }

        rejectImports(
                'delosdb-engine',
                ['io.github.ggeorg.delosdb.storage.mvcc.',
                 'org.apache.derby.impl.store.access.mvcc.',
                 'io.github.ggeorg.delosdb.search.lucene.'],
                'Engine imports a provider implementation')
        rejectImports(
                'delosdb-storage-mvcc',
                ['org.apache.derby.impl.', 'io.github.ggeorg.delosdb.search.lucene.'],
                'MVCC imports an engine or Lucene implementation')
        rejectImports(
                'delosdb-storage-derby',
                ['io.github.ggeorg.delosdb.storage.mvcc.',
                 'org.apache.derby.impl.store.access.mvcc.',
                 'io.github.ggeorg.delosdb.search.lucene.',
                 'org.apache.lucene.'],
                'RawStore implementation imports an MVCC or Lucene implementation')
        if (luceneModulePresent) {
            rejectImports(
                    'delosdb-search-lucene',
                    ['org.apache.derby.impl.', 'io.github.ggeorg.delosdb.storage.mvcc.'],
                    'Lucene imports an engine or MVCC implementation')
        }
        expectedNeutralApiModules.each { String moduleName ->
            rejectImports(
                    moduleName,
                    ['org.apache.lucene.'],
                    'Neutral API exposes a Lucene implementation type')
        }

        def providerInterface = new File(
                delosRepositoryRoot,
                'delosdb-derby-store-api/src/main/java/org/apache/derby/iapi/store/access/conglomerate/ExternalAccessMethodProvider.java')
        if (!providerInterface.isFile()) {
            failures << 'Neutral ExternalAccessMethodProvider must remain in delosdb-derby-store-api.'
        }

        def ramAccessManager = new File(
                delosRepositoryRoot,
                'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/RAMAccessManager.java')
        def ramAccessText = ramAccessManager.isFile() ? ramAccessManager.getText('UTF-8') : ''
        if (!ramAccessText.contains('ServiceLoader.load(ExternalAccessMethodProvider.class)')) {
            failures << 'RAMAccessManager must discover access methods through the neutral ExternalAccessMethodProvider service.'
        }

        def engineModuleInfo = new File(
                delosRepositoryRoot,
                'delosdb-engine/src/main/java/module-info.java')
        def engineModuleText = engineModuleInfo.isFile() ? engineModuleInfo.getText('UTF-8') : ''
        if (!engineModuleText.contains('uses org.apache.derby.iapi.store.access.conglomerate.ExternalAccessMethodProvider;')) {
            failures << 'The engine module must use the neutral ExternalAccessMethodProvider service.'
        }
        if (engineModuleText.contains('requires io.github.ggeorg.delosdb.storage.mvcc')
                || engineModuleText.contains('requires io.github.ggeorg.delosdb.search.lucene')) {
            failures << 'The engine module descriptor must not require MVCC or Lucene provider modules.'
        }

        def providerImplementations = []
        [
                'delosdb-engine/src/main/java',
                'delosdb-storage-bridge/src/main/java',
                'delosdb-storage-mvcc/src/main/java'
        ].each { String sourcePath ->
            def root = new File(delosRepositoryRoot, sourcePath)
            if (root.isDirectory()) {
                DelosDbStaticFileSupport.javaFiles([root]).each { File sourceFile ->
                    if (sourceFile.getText('UTF-8').contains('implements ExternalAccessMethodProvider')) {
                        providerImplementations << DelosDbStaticAnalysisSupport.relativePath(
                                delosRepositoryRoot,
                                sourceFile)
                    }
                }
            }
        }

        if (settingsModules.contains('delosdb-storage-bridge')) {
            def expectedProvider = 'delosdb-storage-bridge/src/main/java/org/apache/derby/impl/store/access/mvcc/DerbyMvccAccessMethodProvider.java'
            if (providerImplementations != [expectedProvider]) {
                failures << (
                        'During bridge migration, the only ExternalAccessMethodProvider implementation must be ' +
                                expectedProvider + '; found ' + providerImplementations)
            }
            def serviceFile = new File(
                    delosRepositoryRoot,
                    'delosdb-storage-bridge/src/main/resources/META-INF/services/'
                            + 'org.apache.derby.iapi.store.access.conglomerate.ExternalAccessMethodProvider')
            def providers = serviceFile.isFile()
                    ? serviceFile.readLines('UTF-8').collect { it.trim() }.findAll { it && !it.startsWith('#') }
                    : []
            if (providers != ['org.apache.derby.impl.store.access.mvcc.DerbyMvccAccessMethodProvider']) {
                failures << 'The transitional bridge must publish exactly one neutral access-method provider.'
            }
            observations << 'The bridge provider is still patched into derby.jar during migration; Stage 7 moves it into the named MVCC module.'
        } else {
            def mvccServiceFile = new File(
                    delosRepositoryRoot,
                    'delosdb-storage-mvcc/src/main/resources/META-INF/services/'
                            + 'org.apache.derby.iapi.store.access.conglomerate.ExternalAccessMethodProvider')
            def mvccModuleInfo = new File(
                    delosRepositoryRoot,
                    'delosdb-storage-mvcc/src/main/java/module-info.java')
            boolean serviceDeclared = mvccServiceFile.isFile()
                    || (mvccModuleInfo.isFile()
                    && mvccModuleInfo.getText('UTF-8').contains('provides org.apache.derby.iapi.store.access.conglomerate.ExternalAccessMethodProvider'))
            if (!serviceDeclared) {
                failures << 'After bridge removal, delosdb-storage-mvcc must publish the neutral access-method provider service.'
            }
        }

        def reportFile = new File(
                delosBuildRoot,
                'reports/delosdb/v1-module-architecture-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB v1 module architecture static analysis')
            writer.println('==============================================')
            writer.println()
            writer.println('Frozen final target: 21 Gradle subprojects')
            writer.println('Required new module: delosdb-search-lucene')
            writer.println('Required retired modules: delosdb-storage-api, delosdb-storage-io, delosdb-storage-bridge')
            writer.println('Required provider artifacts: delosdb-storage-mvcc.jar, delosdb-search-lucene.jar')
            writer.println('Build-only physical-store artifact: delosdb-storage-derby.jar')
            writer.println()
            writer.println('Checked current migration invariants:')
            writer.println('  - no engine project dependency on MVCC or Lucene')
            writer.println('  - no RawStore implementation dependency on MVCC or Lucene')
            writer.println('  - no MVCC dependency/import on engine or Lucene implementation')
            writer.println('  - no Lucene types in runtime-api, spi, or derby-store-api')
            writer.println('  - access-method discovery uses the neutral store API')
            writer.println('  - current settings.gradle remains within the frozen migration set')
            writer.println()
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            writer.println()
            writer.println('Observations:')
            observations.each { writer.println('  - ' + it) }
            if (!failures.isEmpty()) {
                writer.println()
                writer.println('Failures:')
                failures.each { writer.println('  - ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    'DelosDB v1 module architecture static analysis failed: '
                            + failures.join(' | ')
                            + '. Report: '
                            + reportFile)
        }

        logger.lifecycle(
                'DelosDB v1 module architecture static analysis passed. Report: {}',
                reportFile)
    }
}

tasks.register('delosWorkspaceChurnStaticAnalysis') {
    group = 'verification'
    description = 'Fails on accidental workspace churn such as Mac archive metadata and line-ending-only tracked diffs.'
    outputs.file(layout.buildDirectory.file('reports/delosdb/workspace-churn-static-analysis.txt'))

    doLast {
        def failures = []
        def warnings = []

        def archiveMetadataFiles = DelosDbStaticFileSupport.workspaceMetadataFiles(delosRepositoryRoot)
                .collect { delosRepositoryRoot.toPath().relativize(it.toPath()).toString() }
                .sort()

        if (!archiveMetadataFiles.isEmpty()) {
            failures << 'Archive/OS metadata files are present in the workspace: ' + archiveMetadataFiles.join(', ')
        }

        def runGit = { List<String> args ->
            def command = (['git'] + args).collect { it.toString() }
            def process = new ProcessBuilder(command)
                    .directory(delosRepositoryRoot)
                    .start()
            def stdout = new ByteArrayOutputStream()
            def stderr = new ByteArrayOutputStream()
            def stdoutThread = Thread.start { process.inputStream.transferTo(stdout) }
            def stderrThread = Thread.start { process.errorStream.transferTo(stderr) }
            def exitValue = process.waitFor()
            stdoutThread.join()
            stderrThread.join()
            [exitValue: exitValue,
             stdout: stdout.toString(StandardCharsets.UTF_8.name()),
             stderr: stderr.toString(StandardCharsets.UTF_8.name())]
        }

        def gitRoot = runGit(['rev-parse', '--is-inside-work-tree'])
        if (gitRoot.exitValue != 0) {
            warnings << 'Git workspace not available; skipped tracked line-ending churn check.'
        } else {
            def diffModes = [
                    [name: 'unstaged', base: ['diff', '--name-only', '--diff-filter=ACMRTUXB'],
                     check: ['diff', '--exit-code', '--ignore-space-at-eol', '--ignore-cr-at-eol']],
                    [name: 'staged', base: ['diff', '--cached', '--name-only', '--diff-filter=ACMRTUXB'],
                     check: ['diff', '--cached', '--exit-code', '--ignore-space-at-eol', '--ignore-cr-at-eol']]
            ]

            diffModes.each { mode ->
                def names = runGit(mode.base)
                if (names.exitValue != 0) {
                    warnings << "Could not inspect ${mode.name} tracked files: " + names.stderr.trim()
                    return
                }
                names.stdout.readLines()
                        .collect { it.trim() }
                        .findAll { !it.isEmpty() }
                        .unique()
                        .sort()
                        .each { String relativePath ->
                            def ignored = runGit(mode.check + ['--', relativePath])
                            if (ignored.exitValue == 0) {
                                failures << "${mode.name} tracked change is only line-ending/trailing-whitespace churn: ${relativePath}"
                            }
                        }
            }
        }

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/workspace-churn-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB workspace churn static analysis')
            writer.println('========================================')
            writer.println()
            writer.println('Checked invariants:')
            writer.println('  - no __MACOSX, .DS_Store, or AppleDouble ._* files in the workspace')
            writer.println('  - no tracked staged/unstaged changes that are only CRLF/LF or trailing-whitespace churn')
            writer.println()
            if (!warnings.isEmpty()) {
                writer.println('Warnings:')
                warnings.each { warning -> writer.println('  - ' + warning) }
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('Workspace churn checks passed.')
            } else {
                writer.println('Workspace churn failures:')
                failures.each { failure -> writer.println('  - ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB workspace churn static analysis failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB workspace churn static analysis passed. Report: {}', reportFile)
    }
}


def delosDerbyForkDiffClassificationFile = new File(delosRepositoryRoot, 'gradle/static-analysis/delosdb-derby-fork-diff-classification.txt')

def delosDerbyForkDiffDecisions = [
        'COMPATIBILITY_PRESERVING',
        'EXTENSION_SEAM',
        'STORAGE_SPLIT',
        'HARDENING',
        'INTENTIONAL_REPLACEMENT'
] as Set

tasks.register('delosDerbyForkDiffClassificationStaticAnalysis') {
    group = 'verification'
    description = 'Validates classification of high-risk inherited Derby source diffs.'

    inputs.file(delosDerbyForkDiffClassificationFile)
    outputs.file(layout.buildDirectory.file('reports/delosdb/derby-fork-diff-classification-static-analysis.txt'))

    doLast {
        def rows = DelosDbStaticAnalysisSupport.loadDerbyForkDiffRows(delosDerbyForkDiffClassificationFile, delosDerbyForkDiffDecisions)
        def failures = []
        def ids = [] as Set
        def paths = [] as Set

        rows.each { row ->
            if (!ids.add(row.id)) {
                failures << 'Duplicate Derby fork-diff classification id: ' + row.id
            }
            if (!paths.add(row.path)) {
                failures << 'Duplicate Derby fork-diff classification path: ' + row.path
            }
            if (!new File(delosRepositoryRoot, row.path).exists()) {
                failures << 'Classified Derby fork-diff path does not exist: ' + row.path
            }
            if (row.reason.length() < 24) {
                failures << 'Classification reason is too thin for ' + row.id
            }
            if (row.nextAction.length() < 12) {
                failures << 'Classification next action is too thin for ' + row.id
            }
        }

        def requiredPaths = [
                'delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/GenericResultSetFactory.java',
                'delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/FromBaseTable.java',
                'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/RAMAccessManager.java',
                'delosdb-engine/src/main/java/org/apache/derby/impl/sql/catalog/DataDictionaryImpl.java',
                'delosdb-engine/src/main/java/org/apache/derby/impl/sql/catalog/SYSTABLESRowFactory.java',
                'delosdb-engine/src/main/java/org/apache/derby/iapi/sql/dictionary/TableDescriptor.java',
                'delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/CreateTableNode.java',
                'delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/CreateIndexNode.java',
                'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/heap/OpenHeap.java',
                'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/io/FormatIdInputStream.java',
                'delosdb-server/src/main/java/org/apache/derby/impl/drda/NetworkServerControlImpl.java',
                'delosdb-server/src/main/java/org/apache/derby/impl/drda/DRDAConnThread.java'
        ]
        requiredPaths.each { requiredPath ->
            if (!paths.contains(requiredPath)) {
                failures << 'Missing required high-risk Derby fork-diff classification: ' + requiredPath
            }
        }

        delosDerbyForkDiffDecisions.each { decision ->
            if (!rows.any { it.decision == decision } && decision != 'INTENTIONAL_REPLACEMENT') {
                failures << 'No Derby fork-diff classification row uses decision category: ' + decision
            }
        }

        // S0 must not fail on roadmap/prose drift. Fork-diff verification is intentionally file/classification based only.

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/derby-fork-diff-classification-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB Derby fork-diff classification static analysis')
            writer.println('Rows: ' + rows.size())
            writer.println()
            delosDerbyForkDiffDecisions.sort().each { decision ->
                writer.println('  ' + decision + ': ' + rows.count { it.decision == decision })
            }
            writer.println()
            rows.each { row ->
                writer.println(row.id + ' [' + row.decision + '] ' + row.path)
                writer.println('  surface:     ' + row.surface)
                writer.println('  reason:      ' + row.reason)
                writer.println('  next action: ' + row.nextAction)
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('Derby fork-diff classifications validated.')
            } else {
                writer.println('Validation failures:')
                failures.each { failure -> writer.println('  - ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('Derby fork-diff classification static analysis failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB Derby fork-diff classification static analysis passed. Report: {}', reportFile)
    }
}


def delosPerformanceConcurrencyValidationFile = new File(delosRepositoryRoot, 'gradle/static-analysis/delosdb-performance-concurrency-validation.txt')

def delosLoadPerformanceConcurrencyValidationRows = {
    if (!delosPerformanceConcurrencyValidationFile.exists()) {
        throw new GradleException('Missing performance/concurrency validation file: ' + delosPerformanceConcurrencyValidationFile)
    }
    def rows = []
    delosPerformanceConcurrencyValidationFile.readLines('UTF-8').eachWithIndex { String line, int index ->
        String trimmed = line.trim()
        if (!trimmed || trimmed.startsWith('#')) {
            return
        }
        def parts = trimmed.split(/\|/, 5)
        if (parts.length != 5) {
            throw new GradleException('Malformed performance/concurrency validation row at line ' + (index + 1) + ': ' + line)
        }
        rows << [id: parts[0], category: parts[1], path: parts[2], marker: parts[3], reason: parts[4], lineNumber: index + 1]
    }
    rows
}

def delosRunExternalValidationCommand = { String propertyName, String displayName ->
    def configured = providers.gradleProperty(propertyName).orNull
    if (configured == null || configured.trim().isEmpty()) {
        throw new GradleException(displayName + ' requires -P' + propertyName
                + '="<command>"; this external validation task is intentionally not an S0 dependency.')
    }
    def commandText = configured.trim()
    def execution = providers.exec {
        // R6 external validation executes caller-supplied shell commands so
        // tool-specific quoting, classpaths, JDBC URLs, and JVM options remain
        // under the CI/release job that opted into the external tool. Use
        // ProviderFactory.exec instead of the removed Project.exec API so this
        // stays compatible with the Gradle 9.x build used by DelosDB.
        def osName = System.getProperty('os.name', '').toLowerCase(java.util.Locale.ROOT)
        if (osName.contains('windows')) {
            commandLine 'cmd', '/c', commandText
        } else {
            commandLine 'sh', '-c', commandText
        }
    }
    execution.result.get().assertNormalExitValue()
}

