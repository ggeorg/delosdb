                        relativePath + ' must not restore obsolete build task ' + taskName)
            }
        }

        DelosDbStaticAnalysisSupport.require(failures, testsText.contains('rootProject.ext.delosdbRuntimeJarFiles.call()'),
                'delosdb-tests/build.gradle must derive Derby runtime jars from rootProject.ext.delosdbRuntimeJarFiles.call()')
        DelosDbStaticAnalysisSupport.require(failures, !testsText.contains('rootProject.ext.delosdbLegacyOracleTestJarFiles.call()'),
                'Normal delosdb-tests verification must not restore the archived page-volume module through a legacy-oracle jar collection')
        DelosDbStaticAnalysisSupport.require(failures, testsText.contains("dependsOn rootProject.tasks.named('verifyDelosRuntimeStorageProviders')"),
                'Focused MVCC SQL/DRDA gates must depend on verifyDelosRuntimeStorageProviders')
        [
                'runDelosMvccSqlIntegrationTest',
                'runDelosMvccDrdaNetworkClientTest',
