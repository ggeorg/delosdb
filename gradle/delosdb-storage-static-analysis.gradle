def delosLoadMvccSubsystemRecoveryRecordsRows = {
    if (!delosMvccSubsystemRecoveryRecordsFile.exists()) {
        throw new GradleException('Missing MVCC subsystem recovery-record classification file: ' + delosMvccSubsystemRecoveryRecordsFile)
    }
    def rows = []
    int lineNumber = 0
    delosMvccSubsystemRecoveryRecordsFile.readLines('UTF-8').each { rawLine ->
        lineNumber++
        def line = rawLine.trim()
        if (!line || line.startsWith('#')) {
            return
        }
        def parts = line.split('\\|', -1).collect { it.trim() }
        if (parts.size() != 5) {
            throw new GradleException('Malformed MVCC subsystem recovery-record line ' + lineNumber + ': expected 5 pipe-delimited fields')
        }
        if (!delosMvccSubsystemRecoveryRecordsContracts.contains(parts[2])) {
            throw new GradleException('Malformed MVCC subsystem recovery-record line ' + lineNumber + ': unknown contract ' + parts[2])
        }
        rows << [
                id        : parts[0],
                path      : parts[1],
                contract  : parts[2],
                marker    : parts[3],
                reason    : parts[4],
                lineNumber: lineNumber
        ]
    }
    rows
}

