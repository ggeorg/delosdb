            requireTokens('Persisted unique metadata format', formatText, [
                    'controlUniqueConstraintCountField',
                    'controlUniqueConstraintMetadataStart',
                    'uniqueMetadataFields'
            ])
            requireTokens('RawStore MVCC unique descriptor lifecycle', tableText, [
                    'record UniqueConstraint(',
                    'List<UniqueConstraint> uniqueConstraints',
                    'parseUniqueConstraints(',
                    'decodeUniqueConstraints(',
                    'uniqueMetadataFieldCount(',
                    'controlUniqueConstraintCountField',
                    'hasUniqueMetadata',
                    '? decodeUniqueConstraints(row, columnCount)',
                    ': List.of()',
                    'deferrable unique constraints for RawStore-backed delos_mvcc'
            ])

            requireOrdered('Unsupported deferrable uniqueness fails before container allocation',
