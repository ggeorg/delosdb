tasks.register('delosMvccCandidateIndexQuarantineStaticAnalysis') {
    group = 'verification'
    description = 'Validates that MVCC candidate-index authority is quarantined behind ordered-index authority, diagnostics, and explicit fallback accounting.'

    inputs.file(delosMvccCandidateIndexQuarantineFile)
    inputs.file(delosMvccCandidateIndexAuthorityAuditFile)
    inputs.files(
            'delosdb-tests/build.gradle',
            'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccSqlCandidateIndexQuarantineTest.java',
            'delosdb-storage-bridge/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccConglomerateState.java',
            'delosdb-storage-api/src/main/java/org/apache/derby/iapi/store/types/DelosStorageDiagnostics.java',
            'delosdb-storage-bridge/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccBridgeDiagnosticsSupport.java',
            'docs/STORAGE-ROADMAP.md'
    )
    outputs.file(layout.buildDirectory.file('reports/delosdb/mvcc-candidate-index-quarantine-static-analysis.txt'))

    doLast {
        def rows = delosLoadMvccCandidateIndexQuarantineRows()
        def failures = []
        def ids = [] as Set
        def contracts = rows.groupBy { it.contract }

        rows.each { row ->
            if (!ids.add(row.id)) {
                failures << 'Duplicate MVCC candidate-index quarantine id: ' + row.id
            }
            if (!file(row.path).exists()) {
                failures << 'Quarantine proof-point path does not exist: ' + row.path
                return
            }
            def body = file(row.path).getText('UTF-8')
            if (!body.contains(row.marker)) {
                failures << 'Quarantine proof-point marker missing for ' + row.id + ': ' + row.marker
            }
            if (row.reason.length() < 32) {
                failures << 'Quarantine proof-point reason is too thin for ' + row.id
            }
        }

        delosMvccCandidateIndexQuarantineContracts.each { contract ->
            if (!contracts.containsKey(contract)) {
                failures << 'Missing MVCC candidate-index quarantine contract row for ' + contract
            }
        }

        def auditRows = delosLoadMvccCandidateIndexAuthorityRows()
        def normalAuthorityRows = auditRows.findAll { it.decision == 'NORMAL_SQL_AUTHORITY' }
        if (!normalAuthorityRows.isEmpty()) {
            normalAuthorityRows.each { row ->
                failures << 'Candidate-index quarantine still has NORMAL_SQL_AUTHORITY row: ' + row.id + ' -> ' + row.path
            }
        }

        def stateFile = file('delosdb-storage-bridge/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccConglomerateState.java')
        if (stateFile.exists()) {
            def stateText = stateFile.getText('UTF-8')
            def fallbackMethod = (stateText =~ /static\s+boolean\s+candidateIndexDiagnosticFallbackEnabledForTesting\s*\(\s*\)\s*\{\s*return\s+false\s*;\s*\}/)
            if (!fallbackMethod.find()) {
                failures << 'candidateIndexDiagnosticFallbackEnabledForTesting must remain a hard false quarantine gate'
            }
            def forbiddenNormalAuthority = (stateText =~ /candidateRowIdsFor\s*\(/)
            if (forbiddenNormalAuthority.find()) {
                failures << 'MvccConglomerateState must not call candidateRowIdsFor as normal SQL scan authority'
            }
        }

        def buildFile = file('delosdb-tests/build.gradle')
        if (buildFile.exists()) {
            def buildText = buildFile.getText('UTF-8')
            if (!buildText.contains('MvccSqlCandidateIndexQuarantineTest.class')) {
                failures << 'runDelosMvccSqlIntegrationTest must include MvccSqlCandidateIndexQuarantineTest'
            }
        }

        def roadmap = file('docs/STORAGE-ROADMAP.md')
        if (!roadmap.exists()) {
            failures << 'Missing storage roadmap documenting MVCC candidate-index quarantine'
        } else {
            def roadmapText = roadmap.getText('UTF-8')
            [
                    'Phase C — MVCC candidate-index quarantine',
                    'Candidate indexes must no longer be silently used as normal authority',
                    'candidate fallback counter is zero on covered paths',
                    'Do not skip the heap slice'
            ].each { marker ->
                if (!roadmapText.contains(marker)) {
                    failures << 'Storage roadmap is missing MVCC candidate-index quarantine marker: ' + marker
                }
            }
        }

        def reportFile = layout.buildDirectory.file('reports/delosdb/mvcc-candidate-index-quarantine-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB MVCC candidate-index quarantine static analysis')
            writer.println('====================================================')
            writer.println()
            writer.println('Proof rows: ' + engineeringRows.size() + ' engineering rows from ' + rows.size() + ' manifest rows')
            writer.println('NORMAL_SQL_AUTHORITY audit rows: ' + normalAuthorityRows.size())
            writer.println()
            delosMvccCandidateIndexQuarantineContracts.sort().each { contract ->
                writer.println('  ' + contract + ': ' + rows.count { it.contract == contract })
            }
            writer.println()
            engineeringRows.each { row ->
                writer.println(row.id + ' [' + row.contract + '] ' + row.path)
                writer.println('  marker: ' + row.marker)
                writer.println('  reason: ' + row.reason)
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('MVCC candidate-index quarantine proof points validated.')
            } else {
                writer.println('Validation failures:')
                failures.each { failure -> writer.println('  - ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('MVCC candidate-index quarantine static analysis failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB MVCC candidate-index quarantine static analysis passed. Report: {}', reportFile)
    }
}


