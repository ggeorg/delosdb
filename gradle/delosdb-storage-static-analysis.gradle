        ['MVCC_AUTHORITY_ALGORITHM', 'JDK25_MODERNIZATION_CANDIDATE',
         'DO_NOT_TOUCH_WITHOUT_COMPAT_GATE'].each { category ->
            if (!categories.contains(category)) {
                failures << 'Ordered-index NULL-key manifest missing category: ' + category
            }
        }

        def sqlTest = new File(delosRepositoryRoot,
                'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccSqlTypedOrderedIndexKeyTest.java')
                .getText('UTF-8')
        ['testNullValuesKeepTypedOrderedIndexKeySemanticsThroughReopen',
         'where n is null order by id',
         'orderedIndexEntrySummariesForTesting',
         'diagnostics.assertConsistentForTesting'].each { marker ->
            if (!sqlTest.contains(marker)) {
                failures << 'Live SQL NULL-key proof missing marker: ' + marker
            }
        }
        ['ObjectOutputStream', 'ObjectInputStream'].each { forbidden ->
            if (sqlTest.contains(forbidden)) {
                failures << 'SQL NULL-key proof must not introduce Java object serialization'
            }
        }

        def typedKey = new File(delosRepositoryRoot,
                'delosdb-derby-store-api/src/main/java/org/apache/derby/iapi/store/types/DelosStorageOrderedIndexKey.java')
                .getText('UTF-8')
        if (!typedKey.contains('return encodeNull();') || !typedKey.contains("NULL('N', 0)")) {
            failures << 'Typed ordered-index key API must preserve stable NULL envelope markers'
        }
        def mvccBuild = new File(delosRepositoryRoot,
                'delosdb-storage-mvcc/build.gradle').getText('UTF-8')
        if (mvccBuild.contains('MvccOrderedIndexPageStoreTest')
                || mvccBuild.contains('runMvccOrderedIndexPageStoreTest')) {
            failures << 'Retired oracle ordered-index test wiring remains in the MVCC module'
        }

        def docsText = new File(delosRepositoryRoot,
                'docs/MVCC-ORDERED-INDEX-NULL-KEY-PROOF.md').getText('UTF-8')
        ['RawStore-backed SQL proof',
         'testNullValuesKeepTypedOrderedIndexKeySemanticsThroughReopen',
         ':delosdb-tests:runDelosMvccSqlIntegrationTest'].each { marker ->
            if (!docsText.contains(marker)) {
                failures << 'Ordered-index NULL-key documentation missing marker: ' + marker
            }
        }

        def reportFile = new File(delosBuildRoot,
                'reports/delosdb/mvcc-ordered-index-null-key-proof-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB live MVCC ordered-index NULL-key static analysis')
            writer.println('==========================================================')
            writer.println('Rows: ' + rows.size())
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'DelosDB MVCC ordered-index NULL-key static analysis failed. Report: '
                            + reportFile)
        }
        logger.lifecycle(
                'DelosDB MVCC ordered-index NULL-key static analysis passed. Report: {}',
                reportFile)
    }
}


tasks.register('delosSqlancerProfileSkeleton') {
    group = 'verification'
    description = 'Validates the opt-in SQLancer profile skeleton and optionally runs -Pdelosdb.sqlancer.profile.command.'
    doLast {
        def profileRoot = new File(delosRepositoryRoot, 'benchmarks/sqlancer/delosdb-mvcc')
        def profileFiles = [
                new File(delosRepositoryRoot, 'benchmarks/sqlancer/delosdb-mvcc/README.md'),
                new File(delosRepositoryRoot, 'benchmarks/sqlancer/delosdb-mvcc/delosdb-mvcc-profile.properties'),
                new File(delosRepositoryRoot, 'benchmarks/sqlancer/delosdb-mvcc/delosdb-mvcc-smoke.sql'),
                new File(delosRepositoryRoot, 'benchmarks/sqlancer/delosdb-mvcc/delosdb-mvcc-oracle-scope.md')
        ]
        def failures = []
        if (!profileRoot.isDirectory()) {
            failures << 'Missing SQLancer profile root: ' + profileRoot
        }
        profileFiles.each { sourceFile ->
            if (!sourceFile.exists()) {
                failures << 'Missing SQLancer profile skeleton file: ' + sourceFile
            }
        }

        def readFile = { File sourceFile -> sourceFile.exists() ? sourceFile.getText('UTF-8') : '' }
        def readmeText = readFile(new File(delosRepositoryRoot, 'benchmarks/sqlancer/delosdb-mvcc/README.md'))
        ['delosSqlancerProfileSkeleton', 'delosdb.sqlancer.profile.command',
         'delosdb-mvcc-profile.properties', 'delosdb-mvcc-smoke.sql',
         'DELOSDB_SQLANCER_PROFILE_SKELETON'].each { marker ->
            if (!readmeText.contains(marker)) {
                failures << 'SQLancer profile README missing marker: ' + marker
            }
        }

        def profileText = readFile(new File(delosRepositoryRoot, 'benchmarks/sqlancer/delosdb-mvcc/delosdb-mvcc-profile.properties'))
        ['DELOSDB_SQLANCER_PROFILE_SKELETON', 'storage.provider=delos_mvcc',
         'jdbc.protocol=derby', 'normal-build-dependency=false',
         's0-dependency=false'].each { marker ->
            if (!profileText.contains(marker)) {
                failures << 'SQLancer profile properties missing marker: ' + marker
            }
        }

        def smokeText = readFile(new File(delosRepositoryRoot, 'benchmarks/sqlancer/delosdb-mvcc/delosdb-mvcc-smoke.sql')).toLowerCase(Locale.ROOT)
        ['using delos_mvcc', 'create table heap_baseline',
         'create table mvcc_candidate', 'commit', 'rollback'].each { marker ->
            if (!smokeText.contains(marker)) {
                failures << 'SQLancer smoke SQL missing marker: ' + marker
            }
        }

        def oracleText = readFile(new File(delosRepositoryRoot, 'benchmarks/sqlancer/delosdb-mvcc/delosdb-mvcc-oracle-scope.md'))
        def normalizedOracleText = oracleText.replaceAll('\\s+', ' ')
        ['NoREC', 'TLP', 'PQS', 'heap/MVCC differential',
         'unsupported by the current DelosDB SQL/MVCC surface'].each { marker ->
            if (!normalizedOracleText.contains(marker)) {
                failures << 'SQLancer oracle scope missing marker: ' + marker
            }
        }

        def docsText = new File(delosRepositoryRoot, 'docs/EXTERNAL-VALIDATION.md').exists()
                ? new File(delosRepositoryRoot, 'docs/EXTERNAL-VALIDATION.md').getText('UTF-8')
                : ''
        ['delosSqlancerProfileSkeleton', 'delosdb.sqlancer.profile.command',
         'benchmarks/sqlancer/delosdb-mvcc'].each { marker ->
            if (!docsText.contains(marker)) {
                failures << 'External validation docs missing SQLancer profile marker: ' + marker
            }
        }

        def staticText = new File(delosRepositoryRoot, 'gradle/delosdb-storage-static-analysis.gradle').getText('UTF-8')
        def s0Index = staticText.lastIndexOf("tasks.register('s0CloseoutVerification')")
        if (s0Index >= 0) {
            def s0Text = staticText.substring(s0Index)
            if (s0Text.contains('delosSqlancerProfileSkeleton')) {
                failures << 'SQLancer profile skeleton task must not be wired into S0'
            }
        }

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/sqlancer-profile-skeleton.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB SQLancer profile skeleton')
            writer.println('==================================')
            writer.println()
            writer.println('Profile root: ' + profileRoot)
            writer.println('Profile files:')
            profileFiles.each { writer.println('  - ' + it) }
            writer.println()
            writer.println('External command property: delosdb.sqlancer.profile.command')
            writer.println('External command configured: ' + (providers.gradleProperty('delosdb.sqlancer.profile.command').orNull != null))
            writer.println('S0 dependency: false')
            writer.println('Normal dependency: false')
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB SQLancer profile skeleton validation failed. Report: ' + reportFile)
        }
        if (providers.gradleProperty('delosdb.sqlancer.profile.command').orNull != null) {
            delosRunExternalValidationCommand('delosdb.sqlancer.profile.command', 'delosSqlancerProfileSkeleton')
        }
        println 'DelosDB SQLancer profile skeleton passed. Report: ' + reportFile
    }
}

tasks.register('delosNoTransitionalStorageRoutingStaticAnalysis') {
    group = 'verification'
    description = 'Rejects phase-named or proof-only storage routing from production Java sources.'

    def productionSources = fileTree(delosRepositoryRoot) {
        include '**/src/main/java/**/*.java'
        exclude '**/build/**'
    }
    inputs.files(productionSources)
    outputs.file(layout.buildDirectory.file('reports/delosdb/no-transitional-storage-routing-static-analysis.txt'))

    doLast {
        def forbiddenTokens = [
                '"delosdb.storage.phase',
                'DelosObsoleteStorageProperties',
                'DelosHeapScanShadowResultSet',
                'DelosHeapLiveTableScanResultSet',
                'DelosHeapInsertResultSet',
                'DelosHeapDeleteResultSet',
                'DelosHeapUpdateResultSet',
                'DelosTableScanProviderLookup',
                'DelosCreateIndexProviderLookup',
                'DelosHeapCostProofLookup'
        ]
        def failures = []
        productionSources.files.sort { left, right -> left.path <=> right.path }.each { sourceFile ->
            def relative = DelosDbStaticAnalysisSupport.relativePath(delosRepositoryRoot, sourceFile)
            sourceFile.readLines('UTF-8').eachWithIndex { line, index ->
                forbiddenTokens.each { token ->
                    if (line.contains(token)) {
                        failures << relative + ':' + (index + 1) + ': ' + token
                    }
                }
            }
        }

        def reportFile = layout.buildDirectory
                .file('reports/delosdb/no-transitional-storage-routing-static-analysis.txt')
                .get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB transitional storage routing static analysis')
            writer.println('======================================================')
            writer.println()
            writer.println('Rule: production routing must not depend on phase-named proof properties or retired proof result sets.')
            writer.println('Scanned files: ' + productionSources.files.size())
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('Transitional storage routing remains in production sources. Report: ' + reportFile)
        }
        println 'DelosDB transitional storage routing static analysis passed. Report: ' + reportFile
    }
}

tasks.register('delosMvccDatabaseRuntimeOwnershipStaticAnalysis') {
    group = 'verification'
    description = 'Verifies database-scoped ownership for the sole RawStore MVCC runtime.'

    def files = [
            file('delosdb-derby-store-api/src/main/java/org/apache/derby/iapi/store/access/conglomerate/AccessMethodBootContext.java'),
            file('delosdb-derby-store-api/src/main/java/org/apache/derby/iapi/store/access/conglomerate/ExternalAccessMethodProvider.java'),
            file('delosdb-storage-mvcc/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccConglomerateFactory.java'),
            file('delosdb-storage-mvcc/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccRawStoreRuntime.java'),
            file('delosdb-storage-mvcc/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccRawStoreDiagnosticsDirectory.java'),
            file('delosdb-storage-mvcc/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccStorageDiagnostics.java'),
            file('delosdb-storage-mvcc/build.gradle'),
            file('delosdb-engine/src/main/java/module-info.java')
    ]
    def sqlTestDirectory = file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos')
    inputs.files(files)
    inputs.dir(sqlTestDirectory)
    outputs.file(layout.buildDirectory.file('reports/delosdb/mvcc-database-runtime-ownership-static-analysis.txt'))

    doLast {
        def failures = []
        files.each { source ->
            if (!source.isFile()) failures << 'Missing required source: ' + source
        }
        if (failures.isEmpty()) {
            def boot = files[0].getText('UTF-8')
            def provider = files[1].getText('UTF-8')
            def factory = files[2].getText('UTF-8')
            def runtime = files[3].getText('UTF-8')
            def directory = files[4].getText('UTF-8')
            def diagnostics = files[5].getText('UTF-8')
            def mvccBuild = files[6].getText('UTF-8')
            def moduleInfo = files[7].getText('UTF-8')

            if (!boot.contains('RawStoreFactory rawStoreFactory')
                    || !boot.contains('DataFactory dataFactory')
                    || !boot.contains('StorageFactory storageFactory')
                    || !boot.contains('Object databaseIdentity')) {
                failures << 'External access methods must receive the owning database RawStore context'
            }
            if (!provider.contains('AccessMethodBootContext context')) {
                failures << 'External access-method providers must boot from database-owned context'
            }
            if (!factory.contains('private MvccRawStoreRuntime runtime;')
                    || !factory.contains('new MvccRawStoreRuntime(')
                    || !factory.contains('context.databaseIdentity()')) {
                failures << 'MvccConglomerateFactory must own exactly one context-bound RawStore runtime'
            }
            ['MvccDatabaseRuntime', 'MvccRuntimeDiagnosticsDirectory',
             'PersistentService.ROOT', 'runtimeLease'].each { token ->
                if (factory.contains(token)) failures << 'Factory retains retired runtime ownership token: ' + token
            }
            if (!runtime.contains('final class MvccRawStoreRuntime')
                    || runtime.contains('java.nio.file.Files')
                    || runtime.contains('MvccDatabaseRuntime')) {
                failures << 'RawStore runtime must remain database-scoped and free of retained filesystem authority'
            }
            if (!directory.contains('Map<String, WeakReference<MvccRawStoreRuntime>>')
                    || !directory.contains('WeakReference<MvccRawStoreRuntime>')
                    || !directory.contains('static MvccRawStoreRuntime require(String databaseIdentity)')
                    || !directory.contains('requireSingle()')
                    || directory.contains('.close()')) {
                failures << 'RawStore diagnostics directory must be identity-scoped, weak, non-owning, and fail closed when ambiguous'
            }
            if (!diagnostics.contains('DelosStorageDiagnostics withContext')
                    || !diagnostics.contains('context.hasDatabaseIdentity()')
                    || !diagnostics.contains('MvccRawStoreDiagnosticsDirectory.require(databaseIdentity)')
                    || !diagnostics.contains('MvccRawStoreDiagnosticsDirectory.require(')
                    || diagnostics.contains('MvccRuntimeDiagnosticsDirectory')) {
                failures << 'MVCC diagnostics must resolve the RawStore runtime through explicit database context'
            }
            if (!mvccBuild.contains("include 'org/apache/derby/impl/store/access/mvcc/**/*.java'")
                    || mvccBuild.contains('legacyRetained')
                    || mvccBuild.contains('io/github/ggeorg/delosdb/storage/mvcc')
                    || mvccBuild.contains('io/github/ggeorg/delosdb/storage/io')
                    || new File(delosRepositoryRoot,
                    'delosdb-storage-mvcc/src/main/java/io').exists()
                    || new File(delosRepositoryRoot,
                    'delosdb-storage-mvcc/src/test').exists()) {
                failures << 'The production RawStore MVCC module must contain only its live provider source set'
            }
            if (moduleInfo.contains('uses org.apache.derby.iapi.store.types.DelosStorageProviderFactory')) {
                failures << 'Derby runtime module must not discover the retired external MVCC provider'
            }

            DelosDbStaticFileSupport.javaFiles([sqlTestDirectory]).each { testFile ->
                def text = testFile.getText('UTF-8')
                def path = testFile.path
                if (text.contains('mvccDiagnostics()')) {
                    failures << path + ': file-database MVCC diagnostics must name their database'
                }
                if (text.contains('DelosStorageDiagnosticsRegistry.mvcc()')) {
                    failures << path + ': MVCC diagnostics must explicitly name a file or memory database'
                }
            }
        }

        def reportFile = layout.buildDirectory.file(
                'reports/delosdb/mvcc-database-runtime-ownership-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB RawStore MVCC database runtime ownership static analysis')
            writer.println('================================================================')
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) throw new GradleException(
                'MVCC database runtime ownership validation failed. Report: ' + reportFile)
        logger.lifecycle('DelosDB MVCC database runtime ownership static analysis passed. Report: {}', reportFile)
    }
}


tasks.register('delosMvccTableRebuildProviderTruthStaticAnalysis') {
    group = 'verification'
    description = 'Prevents inherited table rebuild DDL from silently converting delos_mvcc tables to heap.'

    def alterTableFile = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/AlterTableConstantAction.java')
    def longRowTestFile = file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccSqlLongRowBoundaryTest.java')
    def rebuildTruthTestFile = file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccSqlTableRebuildProviderTruthTest.java')
    inputs.files(alterTableFile, longRowTestFile, rebuildTruthTestFile)
    outputs.file(layout.buildDirectory.file('reports/delosdb/mvcc-table-rebuild-provider-truth-static-analysis.txt'))

    doLast {
        def failures = []
        [alterTableFile, longRowTestFile, rebuildTruthTestFile].each { sourceFile ->
            if (!sourceFile.isFile()) {
                failures << 'Missing required source: ' + sourceFile
            }
        }

        if (failures.isEmpty()) {
            def alterText = alterTableFile.getText('UTF-8')
            def longRowText = longRowTestFile.getText('UTF-8')
            def truthTestText = rebuildTruthTestFile.getText('UTF-8')

            if (!alterText.contains('rejectUnsupportedMvccTableRebuild();')) {
                failures << 'AlterTableConstantAction must reject unsupported MVCC rebuild DDL before mutation'
            }
            if (!alterText.contains('DelosStorageProviderIds.isMvcc(td.getStorageProviderName())')) {
                failures << 'MVCC rebuild rejection must use the persisted table storage-provider identity'
            }
            ['ALTER TABLE COMPRESS for delos_mvcc tables',
             'TRUNCATE TABLE for delos_mvcc tables',
             'ALTER TABLE DROP COLUMN for delos_mvcc tables'].each { feature ->
                if (!alterText.contains(feature)) {
                    failures << 'Missing explicit unsupported MVCC rebuild feature: ' + feature
                }
            }
            if (!alterText.contains('SQLState.NOT_IMPLEMENTED')) {
                failures << 'Unsupported MVCC rebuild DDL must use stable SQLState 0A000'
            }
            def guardIndex = alterText.indexOf('rejectUnsupportedMvccTableRebuild();')
            def activationIndex = alterText.indexOf('activation.setDDLTableDescriptor(td)')
            if (guardIndex < 0 || activationIndex < 0 || guardIndex > activationIndex) {
                failures << 'MVCC rebuild rejection must occur before DDL table activation and mutation work'
            }
            if (!longRowText.contains('inPlaceCompressTable(connection, "MVCC_LONG_ROW_T")')) {
                failures << 'Long-row MVCC vacuum proof must use provider-preserving in-place compression'
            }
            if (longRowText.contains('SYSCS_COMPRESS_TABLE')) {
                failures << 'Long-row MVCC proof must not use inherited offline table rebuild compression'
            }
            ['SYSCS_COMPRESS_TABLE', 'truncate table mvcc_rebuild_truncate',
             'drop column drop_value', 'NOT_IMPLEMENTED_SQLSTATE = "0A000"',
             'ROUTINE_EXCEPTION_SQLSTATE = "38000"', 'assertDirectlyRejected',
             'assertRoutineRejected', 'containsSqlState',
             'SYSCS_COMPRESS_TABLE must retain the underlying 0A000 rebuild rejection',
             'assertMvccStorageProvider'].each { token ->
                if (!truthTestText.contains(token)) {
                    failures << 'MVCC rebuild truth test is missing token: ' + token
                }
            }
        }

        def reportFile = layout.buildDirectory
                .file('reports/delosdb/mvcc-table-rebuild-provider-truth-static-analysis.txt')
                .get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB MVCC table rebuild provider truth static analysis')
            writer.println('========================================================')
            writer.println()
            writer.println('Rule: inherited rebuild DDL must reject rather than silently converting MVCC tables to heap.')
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('MVCC table rebuild provider truth validation failed. Report: ' + reportFile)
        }
        println 'DelosDB MVCC table rebuild provider truth static analysis passed. Report: ' + reportFile
    }
}


tasks.register('delosSecurityTruthStaticAnalysis') {
    group = 'verification'
    description = 'Protects TLS, secure XML, and fail-closed deserialization boundaries.'

    def requiredFiles = [
            'delosdb-commons/src/main/java/org/apache/derby/shared/common/drda/NaiveTrustManager.java',
            'delosdb-client/src/main/java/org/apache/derby/client/net/OpenSocketAction.java',
            'delosdb-server/src/main/java/org/apache/derby/impl/drda/NetworkServerControlImpl.java',
            'delosdb-tools/src/main/java/org/apache/derby/impl/tools/planexporter/CreateHTMLFile.java',
            'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/SecurityTruthTest.java',
            'docs/SECURITY.md'
    ]
    inputs.files(requiredFiles.collect { new File(delosRepositoryRoot, it) })
    outputs.file(layout.buildDirectory.file('reports/delosdb/security-truth-static-analysis.txt'))

    doLast {
        def failures = []
        requiredFiles.each { relativePath ->
            DelosDbStaticAnalysisSupport.require(
                    failures,
                    new File(delosRepositoryRoot, relativePath).isFile(),
                    'Missing security-truth source: ' + relativePath)
        }

        def read = { String relativePath ->
            def source = new File(delosRepositoryRoot, relativePath)
            source.isFile() ? source.getText('UTF-8') : ''
        }
        def trustText = read(requiredFiles[0])
        def clientText = read(requiredFiles[1])
        def serverText = read(requiredFiles[2])
        def planText = read(requiredFiles[3])
        def securityTestText = read(requiredFiles[4])
        def securityDocText = read(requiredFiles[5])

        ['copyKeyStoreProperties',
         'keyStorePassword == null',
         'try (InputStream keyStoreStream = new FileInputStream(keyStore))'].each { token ->
            DelosDbStaticAnalysisSupport.require(failures, trustText.contains(token),
                    'TLS keystore lifecycle is missing token: ' + token)
        }
        DelosDbStaticAnalysisSupport.require(failures,
                clientText.contains('NaiveTrustManager.copyKeyStoreProperties'),
                'Client TLS property collection must use the null-safe shared helper')
        DelosDbStaticAnalysisSupport.require(failures,
                serverText.contains('NaiveTrustManager.copyKeyStoreProperties'),
                'Server TLS property collection must use the null-safe shared helper')
        DelosDbStaticAnalysisSupport.require(failures,
                !clientText.contains('setProperty(NaiveTrustManager.SSL_KEYSTORE_PASSWORD, keyStorePasswordProp)')
                        && !serverText.contains('setProperty(NaiveTrustManager.SSL_KEYSTORE_PASSWORD, keyStorePasswordProp)'),
                'Client/server TLS code must not pass a nullable password directly to Properties.setProperty')

        DelosDbStaticAnalysisSupport.require(failures,
                planText.contains('SecureXmlFactory.newTransformerFactory()'),
                'PlanExporter must use the centralized secure XML transformer factory')
        DelosDbStaticAnalysisSupport.require(failures,
                !planText.contains('TransformerFactory.newInstance()'),
                'PlanExporter must not instantiate an unsecured transformer factory')
        DelosDbStaticAnalysisSupport.require(failures,
                planText.contains('try (InputStream styleSheet')
                        && planText.contains('try (FileOutputStream output'),
                'PlanExporter stylesheet and output streams must close deterministically')

        ['testPasswordlessTlsKeyStoreConfigurationIsNullSafeAndClosesInput',
         'testPlanExporterTransformsNormalXmlAndRejectsExternalDtd'].each { token ->
            DelosDbStaticAnalysisSupport.require(failures, securityTestText.contains(token),
                    'SecurityTruthTest is missing method: ' + token)
        }
        ['`basic` | TLS encryption only',
         '`peerAuthentication` | Certificate-authenticated TLS',
         'reject every application class',
         'fixed inherited protocol shapes',
         'delosdb.objectDeserializationCompatibilityMode=true',
         'delosdb.heap.objectDeserializationCompatibilityMode=true',
         'external DTD and stylesheet access is disabled'].each { token ->
            DelosDbStaticAnalysisSupport.require(failures, securityDocText.contains(token),
                    'Security documentation is missing truthful token: ' + token)
        }

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/security-truth-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB security truth static analysis')
            writer.println('======================================')
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { failure -> writer.println('- ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB security truth static analysis failed. Report: ' + reportFile)
        }
        logger.lifecycle('DelosDB security truth static analysis passed. Report: {}', reportFile)
    }
}

