            if (row.reason.length() < 40) {
                failures << 'Storage modernization tradeoff audit round 2 reason is too thin for ' + row.id
            }
        }

        ['DURABLE_REWRITE', 'PARENT_DIRECTORY_FORCE', 'UNIT_TEST', 'ROADMAP_TRADEOFF'].each { required ->
            if (!categories.contains(required)) {
                failures << 'Storage modernization tradeoff audit round 2 is missing category: ' + required
            }
        }

        def sidecarFiles = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/durable/MvccSidecarFiles.java')
        if (sidecarFiles.exists()) {
            def body = sidecarFiles.getText('UTF-8')
            if (body.contains('Files.write(rewritePath, bytes)')) {
                failures << 'MvccSidecarFiles must not use Files.write for checked sidecar rewrites because that bypasses forced publication'
            }
            if (!body.contains('writeFileForced(rewritePath, bytes)')) {
                failures << 'MvccSidecarFiles must force the rewrite file before moving it into place'
            }
            if (!body.contains('forceParentDirectoryIfSupported(path)')) {
                failures << 'MvccSidecarFiles must attempt a parent-directory force after replacing the sidecar file'
            }
            if (!body.contains('channel.force(true)')) {
                failures << 'MvccSidecarFiles must force sidecar file contents before publication'
            }
        }

        def abstractStore = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/durable/AbstractSidecarStore.java')
        if (abstractStore.exists()) {
            def body = abstractStore.getText('UTF-8')
            int moveIndex = body.indexOf('moveIntoPlace(temp);')
            int forceIndex = body.indexOf('forceParentDirectoryIfSupported();')
            if (moveIndex < 0 || forceIndex < 0 || forceIndex < moveIndex) {
                failures << 'AbstractSidecarStore must force the parent directory after atomic UTF-8 sidecar rewrite publication'
            }
        }

        def roadmap = file('docs/STORAGE-ROADMAP.md')
        if (roadmap.exists()) {
            def roadmapText = roadmap.getText('UTF-8')
            if (!roadmapText.contains('Second post-closeout tradeoff audit')) {
                failures << 'Storage roadmap must include the second post-closeout tradeoff audit section'
            }
            if (!roadmapText.contains('checksum-trailered sidecar rewrites force the rewrite file before publication')) {
                failures << 'Storage roadmap must document checked-sidecar forced rewrite publication'
            }
            if (!roadmapText.contains('UTF-8 sidecar atomic rewrites attempt a parent-directory force after replacement')) {
                failures << 'Storage roadmap must document UTF-8 sidecar parent-directory force coverage'
            }
        }

        def reportFile = layout.buildDirectory.file('reports/delosdb/storage-modernization-tradeoff-audit-round2-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB storage modernization tradeoff audit round 2 static analysis')
            writer.println('========================================================================')
            writer.println()
            writer.println('Proof rows: ' + engineeringRows.size() + ' engineering rows from ' + rows.size() + ' manifest rows')
            writer.println('Categories: ' + categories.sort().join(', '))
            writer.println()
            engineeringRows.each { row ->
                writer.println(row.id + ' [' + row.category + '] ' + row.path)
                writer.println('  marker: ' + row.marker)
                writer.println('  reason: ' + row.reason)
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('Storage modernization tradeoff audit round 2 static analysis failed. Report: ' + reportFile)
        }
        println 'DelosDB storage modernization tradeoff audit round 2 static analysis passed. Report: ' + reportFile
    }
}



