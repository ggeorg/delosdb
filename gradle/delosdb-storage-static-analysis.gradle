tasks.register('delosNoTransitionalStorageRoutingStaticAnalysis') {
    group = 'verification'
    description = 'Rejects phase-named or proof-only storage routing from production Java sources.'

    def productionSources = fileTree(delosRepositoryRoot) {
        include '**/src/main/java/**/*.java'
        exclude '**/build/**'
    }
    inputs.files(productionSources)
    outputs.file(layout.buildDirectory.file('reports/delosdb/no-transitional-storage-routing-static-analysis.txt'))

    doLast {
        def forbiddenTokens = [
                '"delosdb.storage.phase',
                'DelosObsoleteStorageProperties',
                'DelosHeapScanShadowResultSet',
                'DelosHeapLiveTableScanResultSet',
                'DelosHeapInsertResultSet',
                'DelosHeapDeleteResultSet',
                'DelosHeapUpdateResultSet',
                'DelosTableScanProviderLookup',
                'DelosCreateIndexProviderLookup',
                'DelosHeapCostProofLookup'
        ]
        def failures = []
        productionSources.files.sort { left, right -> left.path <=> right.path }.each { sourceFile ->
            def relative = DelosDbStaticAnalysisSupport.relativePath(delosRepositoryRoot, sourceFile)
            sourceFile.readLines('UTF-8').eachWithIndex { line, index ->
                forbiddenTokens.each { token ->
                    if (line.contains(token)) {
                        failures << relative + ':' + (index + 1) + ': ' + token
                    }
                }
            }
        }

        def reportFile = layout.buildDirectory
                .file('reports/delosdb/no-transitional-storage-routing-static-analysis.txt')
                .get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB transitional storage routing static analysis')
            writer.println('======================================================')
            writer.println()
            writer.println('Rule: production routing must not depend on phase-named proof properties or retired proof result sets.')
            writer.println('Scanned files: ' + productionSources.files.size())
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('Transitional storage routing remains in production sources. Report: ' + reportFile)
        }
        println 'DelosDB transitional storage routing static analysis passed. Report: ' + reportFile
    }
}

tasks.register('delosMvccDatabaseRuntimeOwnershipStaticAnalysis') {
    group = 'verification'
    description = 'Verifies explicit database-scoped MVCC runtime ownership and rejects ambient database identity.'

    def runtimeFile = file('delosdb-storage-bridge/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccDatabaseRuntime.java')
    def conglomerateFile = file('delosdb-storage-bridge/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccConglomerate.java')
    def factoryFile = file('delosdb-storage-bridge/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccConglomerateFactory.java')
    def diagnosticsFile = file('delosdb-storage-bridge/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccStorageDiagnostics.java')
    def accessManagerFile = file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/RAMAccessManager.java')
    def analyzeDiagnosticsFile = file('delosdb-storage-api/src/main/java/org/apache/derby/iapi/store/types/DelosMvccAnalyzeStatisticsLifecycleDiagnostics.java')
    def indexStatisticsFile = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/daemon/IndexStatisticsDaemonImpl.java')
    def fromBaseTableFile = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/FromBaseTable.java')
    def sqlTestSupportFile = file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccSqlTestSupport.java')
    def sqlTestDirectory = file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos')
    inputs.files(runtimeFile, conglomerateFile, factoryFile, diagnosticsFile, accessManagerFile,
            analyzeDiagnosticsFile, indexStatisticsFile, fromBaseTableFile, sqlTestSupportFile)
    inputs.dir(sqlTestDirectory)
    outputs.file(layout.buildDirectory.file('reports/delosdb/mvcc-database-runtime-ownership-static-analysis.txt'))

    doLast {
        def failures = []
        [runtimeFile, conglomerateFile, factoryFile, diagnosticsFile, accessManagerFile,
                analyzeDiagnosticsFile, indexStatisticsFile, fromBaseTableFile, sqlTestSupportFile].each { sourceFile ->
            if (!sourceFile.isFile()) {
                failures << 'Missing required source: ' + sourceFile
            }
        }

        if (failures.isEmpty()) {
            def conglomerateText = conglomerateFile.getText('UTF-8')
            def runtimeText = runtimeFile.getText('UTF-8')
            def factoryText = factoryFile.getText('UTF-8')
            def diagnosticsText = diagnosticsFile.getText('UTF-8')
            def accessManagerText = accessManagerFile.getText('UTF-8')
            def analyzeDiagnosticsText = analyzeDiagnosticsFile.getText('UTF-8')
            def indexStatisticsText = indexStatisticsFile.getText('UTF-8')
            def fromBaseTableText = fromBaseTableFile.getText('UTF-8')
            def sqlTestSupportText = sqlTestSupportFile.getText('UTF-8')

            [
                    'static volatile Path databaseDirectory',
                    'configureDatabaseDirectory(',
                    'clearStatesForDatabase(',
                    'new StateIdentity(databaseDirectory',
                    'new DatabaseIdentity(databaseDirectory)'
            ].each { token ->
                if (conglomerateText.contains(token)) {
                    failures << 'MvccConglomerate retains ambient database ownership token: ' + token
                }
            }

            if (!runtimeText.contains('final class MvccDatabaseRuntime')) {
                failures << 'MvccDatabaseRuntime must own database-scoped MVCC bridge state'
            }
            if (!runtimeText.contains('private final DelosStorageStore store')) {
                failures << 'MvccDatabaseRuntime must own one DelosStorageStore'
            }
            if (!runtimeText.contains('private final Map<TableIdentity, MvccConglomerateState> states')) {
                failures << 'MvccDatabaseRuntime must own the table-state registry'
            }
            if (!factoryText.contains('MvccDatabaseRuntime.acquire(databaseDirectory)')) {
                failures << 'MvccConglomerateFactory must acquire its database runtime explicitly'
            }
            if (!diagnosticsText.contains('DelosStorageDiagnostics withContext')) {
                failures << 'MVCC diagnostics must support explicit database context'
            }
            if (!accessManagerText.contains('registerExternalAccessMethodLifecycle(factory)')) {
                failures << 'RAMAccessManager must own lifecycle for ServiceLoader-booted access methods'
            }
            if (!analyzeDiagnosticsText.contains('Path databaseDirectory')) {
                failures << 'MVCC analyze diagnostics must receive explicit database identity'
            }
            if (!indexStatisticsText.contains('Path.of(Monitor.getServiceName(lcc.getDatabase()))')) {
                failures << 'Explicit update-statistics diagnostics must bind to the owning database service'
            }
            if (!fromBaseTableText.contains('Path.of(databaseServiceName)')) {
                failures << 'Optimizer metadata diagnostics must bind to the compiling database service'
            }
            if (!sqlTestSupportText.contains('activatePersistedMvccConglomerates(connection)')) {
                failures << 'Embedded SQL reopen helper must activate persisted MVCC conglomerates explicitly'
            }
            if (!sqlTestSupportText.contains('ConglomerateFactory.MVCC_FACTORY_ID')) {
                failures << 'Embedded SQL reopen helper must select only persisted MVCC conglomerates'
            }
            if (!sqlTestSupportText.contains('and c.isindex = false')) {
                failures << 'Embedded SQL reopen helper must activate MVCC base tables rather than indexes'
            }
            if (!sqlTestSupportText.contains('lock table ')
                    || !sqlTestSupportText.contains(' in share mode')) {
                failures << 'Embedded SQL reopen helper must activate tables through context-safe LOCK TABLE execution'
            }
            if (sqlTestSupportText.contains('transaction.openConglomerate(')
                    || sqlTestSupportText.contains('getTransactionExecute()')) {
                failures << 'Embedded SQL reopen helper must not call internal transaction APIs outside a JDBC context'
            }
            if (sqlTestSupportText.contains('select * from ')
                    || sqlTestSupportText.contains('fetch first row')) {
                failures << 'Embedded SQL reopen helper must not activate MVCC by scanning user rows'
            }

            if (!sqlTestDirectory.isDirectory()) {
                failures << 'Missing DelosDB SQL test directory: ' + sqlTestDirectory
            } else {
                DelosDbStaticFileSupport.javaFiles([sqlTestDirectory]).each { testFile ->
                    def testText = testFile.getText('UTF-8')
                    if (testText.contains('mvccDiagnostics()')) {
                        failures << testFile + ': SQL diagnostics must name their database'
                    }
                    if ((testText =~ /DelosStorageConsistencyTarget\.mvcc\(\s*\d/).find()) {
                        failures << testFile + ': MVCC metadata targets must name their database'
                    }
                    if (testText.contains('DelosStorageDiagnosticsRegistry.mvcc()')
                            || (testText =~ /DelosStorageDiagnosticsRegistry\.(inspectMvcc|statisticsForMvcc|mvccStorageStatistics|capabilitiesForMvcc)\(\s*\d/).find()) {
                        failures << testFile + ': MVCC registry diagnostics must name their database'
                    }
                    if ((testText =~ /(?i)new\s+DelosStorage(?:ConsistencyTarget|PredicatePushdownRequest)\([\s\S]{0,240}?delos_mvcc[\s\S]{0,120}?\bnull\s*,/).find()) {
                        failures << testFile + ': MVCC diagnostic request retains a null database directory'
                    }
                }
            }
        }

        def reportFile = layout.buildDirectory
                .file('reports/delosdb/mvcc-database-runtime-ownership-static-analysis.txt')
                .get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB MVCC database runtime ownership static analysis')
            writer.println('========================================================')
            writer.println()
            writer.println('Rule: MVCC database selection must be explicit and database-scoped.')
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('MVCC database runtime ownership validation failed. Report: ' + reportFile)
        }
        println 'DelosDB MVCC database runtime ownership static analysis passed. Report: ' + reportFile
    }
}


tasks.register('delosMvccTableRebuildProviderTruthStaticAnalysis') {
    group = 'verification'
    description = 'Prevents inherited table rebuild DDL from silently converting delos_mvcc tables to heap.'

    def alterTableFile = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/AlterTableConstantAction.java')
    def longRowTestFile = file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccSqlLongRowBoundaryTest.java')
    def rebuildTruthTestFile = file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccSqlTableRebuildProviderTruthTest.java')
    inputs.files(alterTableFile, longRowTestFile, rebuildTruthTestFile)
    outputs.file(layout.buildDirectory.file('reports/delosdb/mvcc-table-rebuild-provider-truth-static-analysis.txt'))

    doLast {
        def failures = []
        [alterTableFile, longRowTestFile, rebuildTruthTestFile].each { sourceFile ->
            if (!sourceFile.isFile()) {
                failures << 'Missing required source: ' + sourceFile
            }
        }

        if (failures.isEmpty()) {
            def alterText = alterTableFile.getText('UTF-8')
            def longRowText = longRowTestFile.getText('UTF-8')
            def truthTestText = rebuildTruthTestFile.getText('UTF-8')

            if (!alterText.contains('rejectUnsupportedMvccTableRebuild();')) {
                failures << 'AlterTableConstantAction must reject unsupported MVCC rebuild DDL before mutation'
            }
            if (!alterText.contains('DelosStorageProviderIds.isMvcc(td.getStorageProviderName())')) {
                failures << 'MVCC rebuild rejection must use the persisted table storage-provider identity'
            }
            ['ALTER TABLE COMPRESS for delos_mvcc tables',
             'TRUNCATE TABLE for delos_mvcc tables',
             'ALTER TABLE DROP COLUMN for delos_mvcc tables'].each { feature ->
                if (!alterText.contains(feature)) {
                    failures << 'Missing explicit unsupported MVCC rebuild feature: ' + feature
                }
            }
            if (!alterText.contains('SQLState.NOT_IMPLEMENTED')) {
                failures << 'Unsupported MVCC rebuild DDL must use stable SQLState 0A000'
            }
            def guardIndex = alterText.indexOf('rejectUnsupportedMvccTableRebuild();')
            def activationIndex = alterText.indexOf('activation.setDDLTableDescriptor(td)')
            if (guardIndex < 0 || activationIndex < 0 || guardIndex > activationIndex) {
                failures << 'MVCC rebuild rejection must occur before DDL table activation and mutation work'
            }
            if (!longRowText.contains('inPlaceCompressTable(connection, "MVCC_LONG_ROW_T")')) {
                failures << 'Long-row MVCC vacuum proof must use provider-preserving in-place compression'
            }
            if (longRowText.contains('SYSCS_COMPRESS_TABLE')) {
                failures << 'Long-row MVCC proof must not use inherited offline table rebuild compression'
            }
            ['SYSCS_COMPRESS_TABLE', 'truncate table mvcc_rebuild_truncate',
             'drop column drop_value', 'NOT_IMPLEMENTED_SQLSTATE = "0A000"',
             'ROUTINE_EXCEPTION_SQLSTATE = "38000"', 'assertDirectlyRejected',
             'assertRoutineRejected', 'containsSqlState',
             'SYSCS_COMPRESS_TABLE must retain the underlying 0A000 rebuild rejection',
             'assertMvccStorageProvider'].each { token ->
                if (!truthTestText.contains(token)) {
                    failures << 'MVCC rebuild truth test is missing token: ' + token
                }
            }
        }

        def reportFile = layout.buildDirectory
                .file('reports/delosdb/mvcc-table-rebuild-provider-truth-static-analysis.txt')
                .get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB MVCC table rebuild provider truth static analysis')
            writer.println('========================================================')
            writer.println()
            writer.println('Rule: inherited rebuild DDL must reject rather than silently converting MVCC tables to heap.')
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('MVCC table rebuild provider truth validation failed. Report: ' + reportFile)
        }
        println 'DelosDB MVCC table rebuild provider truth static analysis passed. Report: ' + reportFile
    }
}


tasks.register('delosSecurityTruthStaticAnalysis') {
    group = 'verification'
    description = 'Protects TLS, secure XML, fail-closed deserialization boundaries, and fatal group-commit truth.'

    def requiredFiles = [
            'delosdb-commons/src/main/java/org/apache/derby/shared/common/drda/NaiveTrustManager.java',
            'delosdb-client/src/main/java/org/apache/derby/client/net/OpenSocketAction.java',
            'delosdb-server/src/main/java/org/apache/derby/impl/drda/NetworkServerControlImpl.java',
            'delosdb-tools/src/main/java/org/apache/derby/impl/tools/planexporter/CreateHTMLFile.java',
            'delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/bridge/MvccCommitCoordinator.java',
            'delosdb-storage-mvcc/src/test/java/io/github/ggeorg/delosdb/storage/mvcc/bridge/MvccTransactionGroupCommitHardeningTest.java',
            'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/SecurityTruthTest.java',
            'docs/SECURITY.md'
    ]
    inputs.files(requiredFiles.collect { new File(delosRepositoryRoot, it) })
    outputs.file(layout.buildDirectory.file('reports/delosdb/security-truth-static-analysis.txt'))

    doLast {
        def failures = []
        requiredFiles.each { relativePath ->
            DelosDbStaticAnalysisSupport.require(
                    failures,
                    new File(delosRepositoryRoot, relativePath).isFile(),
                    'Missing security-truth source: ' + relativePath)
        }

        def read = { String relativePath ->
            def source = new File(delosRepositoryRoot, relativePath)
            source.isFile() ? source.getText('UTF-8') : ''
        }
        def trustText = read(requiredFiles[0])
        def clientText = read(requiredFiles[1])
        def serverText = read(requiredFiles[2])
        def planText = read(requiredFiles[3])
        def coordinatorText = read(requiredFiles[4])
        def groupTestText = read(requiredFiles[5])
        def securityTestText = read(requiredFiles[6])
        def securityDocText = read(requiredFiles[7])

        ['copyKeyStoreProperties',
         'keyStorePassword == null',
         'try (InputStream keyStoreStream = new FileInputStream(keyStore))'].each { token ->
            DelosDbStaticAnalysisSupport.require(failures, trustText.contains(token),
                    'TLS keystore lifecycle is missing token: ' + token)
        }
        DelosDbStaticAnalysisSupport.require(failures,
                clientText.contains('NaiveTrustManager.copyKeyStoreProperties'),
                'Client TLS property collection must use the null-safe shared helper')
        DelosDbStaticAnalysisSupport.require(failures,
                serverText.contains('NaiveTrustManager.copyKeyStoreProperties'),
                'Server TLS property collection must use the null-safe shared helper')
        DelosDbStaticAnalysisSupport.require(failures,
                !clientText.contains('setProperty(NaiveTrustManager.SSL_KEYSTORE_PASSWORD, keyStorePasswordProp)')
                        && !serverText.contains('setProperty(NaiveTrustManager.SSL_KEYSTORE_PASSWORD, keyStorePasswordProp)'),
                'Client/server TLS code must not pass a nullable password directly to Properties.setProperty')

        DelosDbStaticAnalysisSupport.require(failures,
                planText.contains('SecureXmlFactory.newTransformerFactory()'),
                'PlanExporter must use the centralized secure XML transformer factory')
        DelosDbStaticAnalysisSupport.require(failures,
                !planText.contains('TransformerFactory.newInstance()'),
                'PlanExporter must not instantiate an unsecured transformer factory')
        DelosDbStaticAnalysisSupport.require(failures,
                planText.contains('try (InputStream styleSheet')
                        && planText.contains('try (FileOutputStream output'),
                'PlanExporter stylesheet and output streams must close deterministically')

        ['failure instanceof Error error',
         'queueChanged.signalAll();', 'rethrowError(errorFailure);'].each { token ->
            DelosDbStaticAnalysisSupport.require(failures, coordinatorText.contains(token),
                    'Group-commit Error handling is missing token: ' + token)
        }
        DelosDbStaticAnalysisSupport.require(failures,
                !coordinatorText.contains('ThreadDeath'),
                'Group-commit Error propagation must not depend on removed ThreadDeath handling')
        def signalIndex = coordinatorText.indexOf('queueChanged.signalAll();',
                coordinatorText.indexOf('private void executeGroup'))
        def rethrowIndex = coordinatorText.indexOf('rethrowError(errorFailure);')
        DelosDbStaticAnalysisSupport.require(failures,
                signalIndex >= 0 && rethrowIndex > signalIndex,
                'Group waiters must be completed and signaled before the leader rethrows the original Error')
        DelosDbStaticAnalysisSupport.require(failures,
                groupTestText.contains('errorReleasesFollowerAndIsRethrownByLeader')
                        && groupTestText.contains('assertSame(leaderFailure, follower.failure())'),
                'Group-commit hardening must prove follower release and original Error rethrow')

        ['testPasswordlessTlsKeyStoreConfigurationIsNullSafeAndClosesInput',
         'testPlanExporterTransformsNormalXmlAndRejectsExternalDtd'].each { token ->
            DelosDbStaticAnalysisSupport.require(failures, securityTestText.contains(token),
                    'SecurityTruthTest is missing method: ' + token)
        }
        ['`basic` | TLS encryption only',
         '`peerAuthentication` | Certificate-authenticated TLS',
         'reject every application class',
         'fixed inherited protocol shapes',
         'delosdb.objectDeserializationCompatibilityMode=true',
         'delosdb.heap.objectDeserializationCompatibilityMode=true',
         'external DTD and stylesheet access is disabled'].each { token ->
            DelosDbStaticAnalysisSupport.require(failures, securityDocText.contains(token),
                    'Security documentation is missing truthful token: ' + token)
        }

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/security-truth-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB security truth static analysis')
            writer.println('======================================')
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { failure -> writer.println('- ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB security truth static analysis failed. Report: ' + reportFile)
        }
        logger.lifecycle('DelosDB security truth static analysis passed. Report: {}', reportFile)
    }
}


tasks.register('delosV1BaselineCaptureStaticAnalysis') {
    group = 'verification'
    description = 'Protects the Phase 8.6 v1 baseline capture contract while keeping wall-clock work outside S0.'

    def contractFile = new File(delosRepositoryRoot,
            'gradle/static-analysis/delosdb-v1-baseline-capture.txt')
    def testBuildFile = new File(delosRepositoryRoot, 'delosdb-tests/build.gradle')
    def reviewBuildFile = new File(delosRepositoryRoot,
            'gradle/delosdb-v1-production-closeout-review.gradle')
    inputs.files(contractFile, testBuildFile, reviewBuildFile)
    outputs.file(layout.buildDirectory.file(
            'reports/delosdb/v1-baseline-capture-static-analysis.txt'))

    doLast {
        def failures = []
        if (!contractFile.isFile()) {
            failures << 'Missing v1 baseline capture contract: ' + contractFile
        } else {
            contractFile.readLines('UTF-8').eachWithIndex { line, index ->
                if (line.isBlank() || line.startsWith('#')) {
                    return
                }
                def fields = line.split('\\|', -1)
                if (fields.length != 4) {
                    failures << 'Malformed v1 baseline contract row at line ' + (index + 1)
                    return
                }
                def source = new File(delosRepositoryRoot, fields[1])
                if (!source.isFile()) {
                    failures << fields[0] + ': missing source ' + fields[1]
                } else if (!source.getText('UTF-8').contains(fields[2])) {
                    failures << fields[0] + ': missing marker ' + fields[2]
                }
            }
        }

        def testBuild = testBuildFile
        def reviewBuild = reviewBuildFile
        def staticBuild = new File(delosRepositoryRoot,
                'gradle/delosdb-storage-static-analysis.gradle')
        def testText = testBuild.isFile() ? testBuild.getText('UTF-8') : ''
        def reviewText = reviewBuild.isFile() ? reviewBuild.getText('UTF-8') : ''
        def staticText = staticBuild.isFile() ? staticBuild.getText('UTF-8') : ''
        def captureIndex = testText.indexOf("tasks.register('captureDelosV1Baseline')")
        if (captureIndex < 0) {
            failures << 'Missing captureDelosV1Baseline task'
        }
        def s0Index = staticText.lastIndexOf("tasks.register('s0CloseoutVerification')")
        if (s0Index < 0) {
            failures << 'Missing s0CloseoutVerification task'
        } else {
            def s0Text = staticText.substring(s0Index)
            if (s0Text.contains("'captureDelosV1Baseline'")
                    || s0Text.contains("'runDelosV1BaselineOperationalCapture'")
                    || s0Text.contains("'runDelosV1ModularImageDrdaTest'")
                    || s0Text.contains("'assembleDelosV1ModularRuntimeImage'")
                    || s0Text.contains("'reviewDelosV1ProductionCloseoutCapture'")
                    || s0Text.contains("'verifyDelosV1ProductionCloseout'")) {
                failures << 'Machine-specific v1 baseline execution must remain outside S0'
            }
            if (!s0Text.contains("'delosV1BaselineCaptureStaticAnalysis'")) {
                failures << 'S0 must retain the cheap v1 baseline contract static analysis'
            }
            if (!s0Text.contains("'delosV1AcceptedBaselineStaticAnalysis'")) {
                failures << 'S0 must verify the immutable accepted v1 baseline bundle'
            }
        }
        if (!testText.contains("status: 'CAPTURED_NOT_ACCEPTED'")) {
            failures << 'The capture manifest must not claim acceptance automatically'
        }
        if (!testText.contains("apply from: rootProject.file('gradle/delosdb-v1-production-closeout-review.gradle')")) {
            failures << 'The dedicated production-closeout review script must be applied'
        }
        if (!reviewText.contains("'REVIEWED_NOT_ACCEPTED'")) {
            failures << 'Production-closeout review must remain distinct from acceptance'
        }
        if (!testText.contains("tasks.register('promoteDelosV1Baseline')")) {
            failures << 'Missing explicit promoteDelosV1Baseline task'
        }
        def acceptanceCandidate = new File(delosRepositoryRoot,
                'benchmarks/v1-baseline/acceptance-candidate.json')
        if (!acceptanceCandidate.isFile()) {
            failures << 'Missing reviewed v1 acceptance candidate'
        } else if (!acceptanceCandidate.getText('UTF-8').contains(
                'e4103b829c3a4b9952507fa837b9187bc9deff872fe19d8daf0a76e99e2f6b17')) {
            failures << 'The acceptance candidate must pin the reviewed semantic checksum'
        }
        if (!testText.contains("dirty: dirty")) {
            failures << 'The capture manifest must record Git dirty state'
        }
        if (!testText.contains("runtimeArtifacts: runtimeArtifacts")) {
            failures << 'The capture manifest must fingerprint runtime artifacts'
        }
        if (!testText.contains("writers: [1, 2, 4, 8, 16]")) {
            failures << 'The manifest must record the fixed writer matrix'
        }

        def reportFile = new File(delosBuildRoot,
                'reports/delosdb/v1-baseline-capture-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB v1 baseline capture static analysis')
            writer.println('===========================================')
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
                writer.println('Execution boundary: capture tasks remain opt-in and outside S0.')
            } else {
                writer.println('Status: FAIL')
                failures.each { failure -> writer.println('- ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    'DelosDB v1 baseline capture static analysis failed. Report: ' + reportFile)
        }
        logger.lifecycle('DelosDB v1 baseline capture static analysis passed. Report: {}', reportFile)
    }
}



def delosV1AcceptedBaselineSha256 = { File input ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[64 * 1024]
        int count
        while ((count = stream.read(buffer)) >= 0) {
            if (count > 0) {
                digest.update(buffer, 0, count)
            }
        }
    }
    java.util.HexFormat.of().formatHex(digest.digest())
}

tasks.register('delosV1AcceptedBaselineStaticAnalysis') {
    group = 'verification'
    description = 'Verifies the tracked accepted v1 baseline manifest, review policy, lane inventory, and every evidence checksum.'

    def acceptedRoot = new File(delosRepositoryRoot, 'benchmarks/v1-baseline/accepted')
    def candidateFile = new File(delosRepositoryRoot,
            'benchmarks/v1-baseline/acceptance-candidate.json')
    outputs.upToDateWhen { false }
    outputs.file(layout.buildDirectory.file(
            'reports/delosdb/v1-accepted-baseline-static-analysis.txt'))

    doLast {
        def failures = []
        def acceptedManifest = null
        def candidate = null
        File manifestFile = new File(acceptedRoot, 'manifest.json')
        File checksumsFile = new File(acceptedRoot, 'checksums.sha256')
        File acceptedPolicyFile = new File(acceptedRoot, 'acceptance-policy.json')

        if (!candidateFile.isFile()) {
            failures << 'Missing tracked acceptance candidate: ' + candidateFile
        } else {
            try {
                candidate = new groovy.json.JsonSlurper().parse(candidateFile)
            } catch (Exception failure) {
                failures << 'Invalid acceptance candidate JSON: ' + failure.message
            }
        }
        if (!acceptedRoot.isDirectory()) {
            failures << 'Missing tracked accepted v1 baseline bundle: ' + acceptedRoot
        }
        if (!manifestFile.isFile()) {
            failures << 'Missing accepted baseline manifest.json'
        } else {
            try {
                acceptedManifest = new groovy.json.JsonSlurper().parse(manifestFile)
            } catch (Exception failure) {
                failures << 'Invalid accepted manifest JSON: ' + failure.message
            }
        }
        if (!checksumsFile.isFile()) {
            failures << 'Missing accepted baseline checksums.sha256'
        }
        if (!acceptedPolicyFile.isFile()) {
            failures << 'Missing accepted baseline acceptance-policy.json'
        }

        if (acceptedManifest != null && candidate != null) {
            if (acceptedManifest.schemaVersion != 1) {
                failures << 'Accepted manifest schema must be 1'
            }
            if (acceptedManifest.status != candidate.acceptedStatus) {
                failures << 'Accepted manifest status mismatch: ' + acceptedManifest.status
            }
            if (acceptedManifest.baselineId != candidate.baselineId) {
                failures << 'Accepted manifest baseline id mismatch'
            }
            if (acceptedManifest.semanticChecksum != candidate.expectedSemanticChecksum) {
                failures << 'Accepted semantic checksum does not match the reviewed candidate'
            }
            if (acceptedManifest.source?.dirty != false) {
                failures << 'Accepted baseline must originate from a clean capture'
            }
            if (!java.util.regex.Pattern.matches('[0-9a-f]{40,64}',
                    String.valueOf(acceptedManifest.source?.revision ?: ''))) {
                failures << 'Accepted source revision is missing or malformed'
            }
            String javaVersion = String.valueOf(acceptedManifest.environment?.javaVersion ?: '')
            def javaVersionParts = javaVersion.tokenize('.')
            String javaMajor = javaVersionParts.isEmpty() ? '' : javaVersionParts[0]
            if (javaMajor != String.valueOf(candidate.requiredJavaMajor)) {
                failures << 'Accepted baseline must be captured on JDK ' + candidate.requiredJavaMajor
            }
            def expectedMatrix = [
                    writers: [1, 2, 4, 8, 16],
                    providers: ['heap', 'delos_mvcc'],
                    topologies: ['same-table', 'different-tables', 'different-databases'],
                    workloads: ['single-row-insert', 'multi-row-insert', 'mixed-insert-update']
            ]
            if (acceptedManifest.matrix != expectedMatrix) {
                failures << 'Accepted baseline matrix differs from the frozen v1 matrix'
            }
            def requiredLanes = [
                    'operational',
                    'jdbc-lifecycle',
                    'jdbc-batch-scaling',
                    'jdbc-transactions',
                    'jdbc-row-scaling',
                    'mvcc-buffer-cache',
                    'mvcc-page-codec',
                    'drda-stress',
                    'recovery-differential',
                    'failure-replay',
                    'low-level-failure-replay'
            ]
            if (acceptedManifest.lanes != requiredLanes) {
                failures << 'Accepted lane inventory differs from the frozen v1 lane inventory'
            }
            requiredLanes.each { lane ->
                File laneRoot = new File(acceptedRoot, 'raw/' + lane)
                if (!laneRoot.isDirectory() || laneRoot.listFiles() == null
                        || laneRoot.listFiles().length == 0) {
                    failures << 'Accepted lane is missing or empty: ' + lane
                }
            }
            if (!(acceptedManifest.semanticTokenCount instanceof Number)
                    || acceptedManifest.semanticTokenCount.intValue() <= 0) {
                failures << 'Accepted baseline contains no semantic evidence tokens'
            }
            if (!(acceptedManifest.runtimeArtifacts instanceof Collection)
                    || acceptedManifest.runtimeArtifacts.isEmpty()) {
                failures << 'Accepted baseline contains no runtime artifact fingerprints'
            }
            if (!(acceptedManifest.acceptance instanceof Map)) {
                failures << 'Accepted manifest is missing acceptance metadata'
            } else {
                ['captureManifestSha256', 'captureChecksumsSha256', 'acceptancePolicySha256'].each { key ->
                    if (!java.util.regex.Pattern.matches('[0-9a-f]{64}',
                            String.valueOf(acceptedManifest.acceptance[key] ?: ''))) {
                        failures << 'Accepted manifest has invalid acceptance hash: ' + key
                    }
                }
                if (acceptedManifest.acceptance.policyVersion != candidate.policyVersion) {
                    failures << 'Accepted policy version mismatch'
                }
            }
            if (acceptedPolicyFile.isFile()
                    && delosV1AcceptedBaselineSha256(acceptedPolicyFile)
                    != delosV1AcceptedBaselineSha256(candidateFile)) {
                failures << 'Accepted policy copy differs from the tracked review candidate'
            }
        }

        def listed = [] as Set
        long totalBytes = 0L
        if (checksumsFile.isFile() && acceptedRoot.isDirectory()) {
            checksumsFile.readLines('UTF-8').eachWithIndex { String line, int index ->
                def matcher = java.util.regex.Pattern.compile('^([0-9a-f]{64})  (.+)$').matcher(line)
                if (!matcher.matches()) {
                    failures << 'Malformed accepted checksum row at line ' + (index + 1)
                    return
                }
                String expected = matcher.group(1)
                String relative = matcher.group(2)
                if (relative.startsWith('/') || relative.contains('..')) {
                    failures << 'Unsafe accepted checksum path: ' + relative
                    return
                }
                if (!listed.add(relative)) {
                    failures << 'Duplicate accepted checksum path: ' + relative
                    return
                }
                File evidence = new File(acceptedRoot, relative)
                if (!evidence.isFile()) {
                    failures << 'Missing accepted evidence file: ' + relative
                } else {
                    totalBytes += evidence.length()
                    String actual = delosV1AcceptedBaselineSha256(evidence)
                    if (actual != expected) {
                        failures << 'Accepted evidence checksum mismatch: ' + relative
                    }
                }
            }
            def actual = [] as Set
            acceptedRoot.eachFileRecurse { file ->
                if (file.isFile()) {
                    String relative = acceptedRoot.toPath().relativize(file.toPath())
                            .toString().replace('\\', '/')
                    if (relative != 'checksums.sha256') {
                        actual.add(relative)
                    }
                }
            }
            def unlisted = actual - listed
            def stale = listed - actual
            if (!unlisted.isEmpty()) {
                failures << 'Accepted files missing checksum rows: ' + unlisted.sort().join(', ')
            }
            if (!stale.isEmpty()) {
                failures << 'Accepted checksum rows missing files: ' + stale.sort().join(', ')
            }
        }

        def reportFile = new File(delosBuildRoot,
                'reports/delosdb/v1-accepted-baseline-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB accepted v1 baseline static analysis')
            writer.println('============================================')
            writer.println()
            writer.println('Accepted root: ' + acceptedRoot)
            writer.println('Evidence files: ' + listed.size())
            writer.println('Evidence bytes: ' + totalBytes)
            if (acceptedManifest != null) {
                writer.println('Source revision: ' + acceptedManifest.source?.revision)
                writer.println('Semantic checksum: ' + acceptedManifest.semanticChecksum)
            }
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { failure -> writer.println('- ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                    'DelosDB accepted v1 baseline static analysis failed. Report: ' + reportFile)
        }
        logger.lifecycle('DelosDB accepted v1 baseline static analysis passed. Report: {}', reportFile)
    }
}


tasks.register('delosDatabaseDecisionRetentionStaticAnalysis') {
    group = 'verification'
    description = 'Verifies bounded mixed-decision marker retention and database status-journal compaction.'
    inputs.files(
            file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/bridge/MvccDatabaseDecisionRetention.java'),
            file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/bridge/MvccDatabaseCommitCoordinator.java'),
            file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/MvccTransactionStatusStore.java'),
            file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/durable/MvccPageMutationLog.java'),
            file('delosdb-storage-mvcc/src/test/java/io/github/ggeorg/delosdb/storage/mvcc/bridge/MvccDatabaseDecisionRetentionTest.java'),
            file('delosdb-storage-mvcc/build.gradle'))
    doLast {
        def failures = []
        def requiredMarkers = [
                'DEFAULT_COMPACTION_THRESHOLD_BYTES',
                'reconcileOnOpen',
                'decisionMirrored',
                'pendingDatabaseTransactionIds',
                'compactRetaining',
                'dropDatabaseStateIfUnused',
                'finalTableDropRemovesDatabaseDecisionJournalAndEmptyDirectories',
                'greatest transaction id',
                'greatest commit sequence',
                'runMvccDatabaseDecisionRetentionTest'
        ]
        def sourceText = inputs.files.files
                .findAll { it.isFile() }
                .collect { it.getText('UTF-8') }
                .join('\n')
        requiredMarkers.each { marker ->
            if (!sourceText.contains(marker)) {
                failures << 'Missing database decision retention marker: ' + marker
            }
        }
        if (sourceText.contains('deleteIfExists(marker)')
                && !sourceText.contains('forceParentDirectoryIfSupported(marker)')) {
            failures << 'Decision marker deletion is not followed by a durable directory boundary'
        }

        def reportFile = new File(delosBuildRoot,
                'reports/delosdb/database-decision-retention-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB database decision retention static analysis')
            writer.println('=================================================')
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { failure -> writer.println('- ' + failure) }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'DelosDB database decision retention static analysis failed. Report: '
                            + reportFile)
        }
        logger.lifecycle(
                'DelosDB database decision retention static analysis passed. Report: {}',
                reportFile)
    }
}

tasks.register('delosPhase8EntropyStaticAnalysis') {
    group = 'verification'
    description = 'Protects the Phase 8 dead-code, replay-helper, focused-task, and Error-propagation cleanup.'

    def requiredFiles = [
            'delosdb-storage-api/src/main/java/org/apache/derby/iapi/store/types/DelosStorageTransactionRegistry.java',
            'delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DMLWriteResultSet.java',
            'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccSqlUnsupportedObjectTypeBoundaryTest.java',
            'delosdb-storage-mvcc/src/test/java/io/github/ggeorg/delosdb/storage/mvcc/bridge/MvccFailureReplayTestSupport.java',
            'delosdb-storage-mvcc/src/test/java/io/github/ggeorg/delosdb/storage/mvcc/bridge/MvccFailureInjectionReplayTest.java',
            'delosdb-storage-mvcc/src/test/java/io/github/ggeorg/delosdb/storage/mvcc/bridge/MvccLowLevelFailureReplayTest.java',
            'delosdb-tests/build.gradle',
            'delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/bridge/MvccCommitCoordinator.java',
            'delosdb-storage-mvcc/src/test/java/io/github/ggeorg/delosdb/storage/mvcc/bridge/MvccTransactionGroupCommitHardeningTest.java'
    ]
    inputs.files(requiredFiles.collect { new File(delosRepositoryRoot, it) })
    outputs.file(layout.buildDirectory.file('reports/delosdb/phase8-entropy-static-analysis.txt'))

    doLast {
        def failures = []
        def read = { String relativePath ->
            def source = new File(delosRepositoryRoot, relativePath)
            DelosDbStaticAnalysisSupport.require(
                    failures, source.isFile(), 'Missing Phase 8 entropy source: ' + relativePath)
            source.isFile() ? source.getText('UTF-8') : ''
        }

        def registryText = read(requiredFiles[0])
        def dmlText = read(requiredFiles[1])
        def unsupportedTypeTestText = read(requiredFiles[2])
        def replaySupportText = read(requiredFiles[3])
        def transactionReplayText = read(requiredFiles[4])
        def lowLevelReplayText = read(requiredFiles[5])
        def testBuildText = read(requiredFiles[6])
        def coordinatorText = read(requiredFiles[7])
        def groupTestText = read(requiredFiles[8])

        DelosDbStaticAnalysisSupport.require(failures,
                !registryText.contains('logicalTableId')
                        && registryText.contains('Object ownerTransaction,\n            boolean mvcc,'),
                'registerWriteIntent must not retain the unused logical table identifier')
        DelosDbStaticAnalysisSupport.require(failures,
                dmlText.contains('DelosStorageTransactionRegistry.registerWriteIntent(\n                            tc,\n                            mvcc,\n                            tc.isGlobal())'),
                'The SQL write boundary must use the reduced registerWriteIntent contract')
        DelosDbStaticAnalysisSupport.require(failures,
                !unsupportedTypeTestText.contains('closeQuietly(Connection connection)'),
                'MvccSqlUnsupportedObjectTypeBoundaryTest must not retain its dead close helper')

        ['writeTwoTables', 'reopenedDigest', 'committedDigest'].each { helper ->
            DelosDbStaticAnalysisSupport.require(failures,
                    replaySupportText.contains(helper + '('),
                    'Shared replay support is missing helper: ' + helper)
        }
        [transactionReplayText, lowLevelReplayText].eachWithIndex { replayText, index ->
            DelosDbStaticAnalysisSupport.require(failures,
                    replayText.contains('MvccFailureReplayTestSupport.'),
                    'Replay test ' + index + ' must use shared replay support')
            ['private Object writeTwoTables(',
             'private static Object writeTwoTables(',
             'private String reopenedDigest(',
             'private static String reopenedDigest(',
             'private static String committedDigest('].each { duplicate ->
                DelosDbStaticAnalysisSupport.require(failures,
                        !replayText.contains(duplicate),
                        'Replay test ' + index + ' retains duplicate helper: ' + duplicate)
            }
        }

        DelosDbStaticAnalysisSupport.require(failures,
                testBuildText.contains('List<String> testPatterns = []')
                        && testBuildText.contains('includeTestsMatching pattern'),
                'Focused test registration must support method-level proof splits')
        def participationStart = testBuildText.indexOf("'runDelosMvccTransactionParticipationTest'")
        def decisionStart = testBuildText.indexOf("'runDelosMvccDatabaseCommitDecisionTest'")
        def crashStart = testBuildText.indexOf("'runDelosMvccRawStoreDecisionWalCrashTest'")
        def participationText = participationStart >= 0 && decisionStart > participationStart
                ? testBuildText.substring(participationStart, decisionStart) : ''
        def decisionText = decisionStart >= 0 && crashStart > decisionStart
                ? testBuildText.substring(decisionStart, crashStart) : ''
        ['testSingleMvccTableAndHeapOnlyWritesRemainSupported',
         'testReadOnlyCrossTableAndMixedAccessRemainsSupported',
         'testMvccXaWriteRejectsBeforeMutationWhileHeapXaRemainsSupported'].each { methodName ->
            DelosDbStaticAnalysisSupport.require(failures, participationText.contains(methodName),
                    'Transaction-participation task is missing method: ' + methodName)
            DelosDbStaticAnalysisSupport.require(failures, !decisionText.contains(methodName),
                    'Database-decision task must not rerun participation method: ' + methodName)
        }
        ['testTwoMvccTablesCommitThroughOneDatabaseDecision',
         'testTwoMvccTableRollbackRemainsAtomic',
         'testMixedHeapAndMultipleMvccWritesUseOneRawStoreDecision'].each { methodName ->
            DelosDbStaticAnalysisSupport.require(failures, decisionText.contains(methodName),
                    'Database-decision task is missing method: ' + methodName)
            DelosDbStaticAnalysisSupport.require(failures, !participationText.contains(methodName),
                    'Transaction-participation task must not rerun decision method: ' + methodName)
        }

        DelosDbStaticAnalysisSupport.require(failures,
                !coordinatorText.contains('ThreadDeath')
                        && coordinatorText.contains('failure instanceof Error error')
                        && coordinatorText.contains('rethrowError(errorFailure);'),
                'MvccCommitCoordinator must signal waiters and rethrow every original Error')
        DelosDbStaticAnalysisSupport.require(failures,
                groupTestText.contains('errorReleasesFollowerAndIsRethrownByLeader')
                        && groupTestText.contains('assertSame(leaderFailure, follower.failure())'),
                'Group-commit proof must verify original Error identity for leader and follower')

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/phase8-entropy-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB Phase 8 entropy static analysis')
            writer.println('========================================')
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
                writer.println('Dead parameters/helpers removed, replay helpers shared, focused tasks split, and Error propagation preserved.')
            } else {
                writer.println('Status: FAIL')
                failures.each { failure -> writer.println('- ' + failure) }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'DelosDB Phase 8 entropy static analysis failed. Report: ' + reportFile)
        }
        logger.lifecycle(
                'DelosDB Phase 8 entropy static analysis passed. Report: {}', reportFile)
    }
}

