            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'Transactional MVCC DDL static analysis failed. Report: ' + reportFile)
        }
        logger.lifecycle(
                'Transactional MVCC DDL static analysis passed. Report: {}', reportFile)
    }
