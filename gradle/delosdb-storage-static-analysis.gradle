    def freezeFile = file('.delosdb-v1/01-architecture/07-V1-RAWSTORE-CONVERGENCE-FREEZE.md')
    def gatesFile = file('.delosdb-v1/02-quality/07-DESIGN-PROOF-GATES.md')
    inputs.files(transactionTestFile, testsBuildFile, designFile, implementationFile,
            architectureFile, roadmapFile, freezeFile, gatesFile)
    outputs.file(layout.buildDirectory.file(
            'reports/delosdb/mvcc-raw-store-sql-transaction-cutover-static-analysis.txt'))

    doLast {
        def failures = []
        def requiredFiles = [transactionTestFile, testsBuildFile, designFile, implementationFile,
                architectureFile, roadmapFile, freezeFile, gatesFile]
        requiredFiles.each { sourceFile ->
            if (!sourceFile.isFile()) {
                failures << 'Missing required file: ' + sourceFile
            }
        }

        if (failures.isEmpty()) {
            def transactionText = transactionTestFile.getText('UTF-8')
            def testsBuildText = testsBuildFile.getText('UTF-8')
            def designText = designFile.getText('UTF-8')
            def implementationText = implementationFile.getText('UTF-8')
            def architectureText = architectureFile.getText('UTF-8')
            def roadmapText = roadmapFile.getText('UTF-8')
            def freezeText = freezeFile.getText('UTF-8')
            def gatesText = gatesFile.getText('UTF-8')

            def requireTokens = { String description, String source, List<String> tokens ->
                tokens.each { token ->
                    if (!source.contains(token)) {
                        failures << description + ' is missing token: ' + token
                    }
                }
            }
            def forbidTokens = { String description, String source, List<String> tokens ->
                tokens.each { token ->
                    if (source.contains(token)) {
                        failures << description + ' retains forbidden token: ' + token
                    }
                }
            }

            requireTokens('RawStore SQL transaction proof', transactionText, [
                    'private static final String RAW_STORE_PROPERTY',
                    'testTwoMvccTablesCommitThroughOneRawStoreTransaction',
                    'testTwoMvccTableRollbackUsesOneRawStoreUndoBoundary',
                    'testMixedHeapAndMvccWritesShareOneRawStoreTransaction',
                    'create table heap_transaction_t',
                    'create table mvcc_transaction_a',
                    'create table mvcc_transaction_b',
                    'shutdownDatabase(databaseName)',
                    'inheritedMvccStateFileCount(databaseName)'
            ])
            if (transactionText.count('setSystemProperty(RAW_STORE_PROPERTY, "true")') != 3) {
                failures << 'Each of the three SQL transaction-cutover methods must explicitly enable RawStore MVCC'
            }
            if (transactionText.count('inheritedMvccStateFileCount(databaseName)') != 3) {
                failures << 'Each SQL transaction-cutover method must prove zero retained inherited-store files'
            }
            if (transactionText.count('shutdownDatabase(databaseName)') < 5) {
                failures << 'SQL transaction cutover must shut down before both reopen proofs and final file checks'
            }
            forbidTokens('RawStore SQL transaction proof', transactionText, [
                    'testTwoMvccTablesCommitThroughOneDatabaseDecision',
                    'testTwoMvccTableRollbackRemainsAtomic',
                    'testMixedHeapAndMultipleMvccWritesUseOneRawStoreDecision'
            ])

            requireTokens('Focused Gradle lane', testsBuildText, [
                    "'runDelosMvccRawStoreSqlTransactionCutoverTest'",
                    'Runs the Stage 5 RawStore SQL multi-table and mixed heap/MVCC transaction-authority proof.',
                    'testTwoMvccTablesCommitThroughOneRawStoreTransaction',
                    'testTwoMvccTableRollbackUsesOneRawStoreUndoBoundary',
                    'testMixedHeapAndMvccWritesShareOneRawStoreTransaction',
                    "tasks.register('runDelosMvccDatabaseCommitDecisionTest')",
                    "dependsOn tasks.named('runDelosMvccRawStoreSqlTransactionCutoverTest')"
            ])
            requireTokens('Public Stage 5.3 design', designText, [
                    'This is the third Stage 5 retirement slice.',
                    'one inherited RawStore transaction',
                    'runDelosMvccRawStoreSqlTransactionCutoverTest',
                    'delosMvccRawStoreSqlTransactionCutoverStaticAnalysis'
            ])
            requireTokens('Implementation record', implementationText, [
                    '## Stage 5 RawStore SQL transaction-authority proof cutover',
                    'zero retained inherited-store files',
                    'V1-RAWSTORE-MVCC-SQL-TRANSACTION-CUTOVER.md'
            ])
            requireTokens('Public architecture record', architectureText, [
                    '## Stage 5 SQL transaction-authority proof cutover',
                    'one inherited RawStore transaction',
                    'compatibility alias'
            ])
            requireTokens('Frozen architecture record', freezeText, [
                    '## Stage 5 SQL transaction-authority proof cutover slice',
                    'one inherited RawStore transaction',
                    'runDelosMvccRawStoreSqlTransactionCutoverTest'
            ])
            requireTokens('Permanent gate record', gatesText, [
                    '## Stage 5 RawStore MVCC SQL transaction-authority proof cutover gate',
                    'delosMvccRawStoreSqlTransactionCutoverStaticAnalysis',
                    'the historical database-decision task is only a compatibility alias'
            ])
            requireTokens('Roadmap Stage 5.3 state', roadmapText, [
                    '# Stage 5 — remove the independent MVCC storage system',
                    '## Stage 5.2 — decision and recovery proof cutover',
                    '## Stage 5.3 — SQL transaction-authority proof cutover',
                    'The third retirement slice retargets the permanent SQL multi-table and mixed heap/MVCC transaction',
                    ':delosdb-tests:runDelosMvccRawStoreSqlTransactionCutoverTest',
                    'one SQL transaction authority',
                    'one RawStore undo/commit boundary',
                    'no retained database-decision proof dependency'
            ])
        }

        def reportFile = layout.buildDirectory
                .file('reports/delosdb/mvcc-raw-store-sql-transaction-cutover-static-analysis.txt')
                .get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('RawStore MVCC SQL transaction-authority proof cutover static analysis')
            writer.println('=====================================================================')
            writer.println()
            writer.println('Rule: permanent SQL multi-table and mixed heap/MVCC proofs use one inherited RawStore transaction and no retained decision proof.')
            writer.println()
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'RawStore MVCC SQL transaction-authority proof cutover static analysis failed. Report: '
                            + reportFile)
        }
        logger.lifecycle(
                'RawStore MVCC SQL transaction-authority proof cutover static analysis passed. Report: {}',
