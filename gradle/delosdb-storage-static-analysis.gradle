            ])
            requireTokens('Purge target validation and descending slot order', vacuumText, [
                    'purge target identity changed',
                    'target.formatVersionField()',
                    'slots.sort(Comparator.comparingInt(SlotTarget::slot).reversed())',
                    'MvccRawStorePhysicalLocking.rowLevel(transaction)',
                    'ContainerHandle.MODE_FORUPDATE'
            ])

            requireTokens('Read-side physical maintenance protection', controllerText, [
                    'runtime.enterTableRead(table)',
                    'MvccRawStoreTable.readVisible('
            ])
            requireTokens('Transaction and held-cursor snapshot protection', scanText, [
                    'private final long snapshotSequence',
                    'private final MvccRawStoreRuntime.SnapshotLease heldSnapshotLease',
                    'context.snapshotSequence()',
                    'hold ? context.retainSnapshotLease() : null',
                    'heldSnapshotLease.close()',
                    'runtime.enterTableRead(table)',
                    'orderedIndexRowIdsForAt(',
                    'readVisibleAt(',
                    'scanVisibleAt('
            ])
            requireTokens('Explicit-snapshot ordered-index lookup', tableText, [
                    'orderedIndexRowIdsForAt(',
                    'MvccRawStoreOrderedIndex.rowIdsForAt('
            ])
            requireTokens('Explicit-snapshot ordered-index visibility', indexText, [
                    'rowIdsForAt(',
                    'visibleAt(entry, context, snapshotSequence)'
            ])

            [
                    'testOldestRetainedSnapshotProtectsHistoryAndVacuumRelinksTheChain',
                    'testHeldCursorRetainsItsSnapshotLeaseAcrossCommitAndVacuum',
                    'testVacuumRepairsStaleHintsWithoutReplacingOrderedIndex',
                    'testDeletedRowsArePurgedAndStableIdentitiesAreNeverReused',
                    'testVacuumRollbackAndSavepointRestoreOneRawStoreOutcome',
                    'testVacuumRecoversOnBothSidesOfTheRawStoreCommitRecord',
                    'testMemoryDatabaseUsesTheSameTransactionalVacuumPath'
            ].each { methodName ->
                if (!sqlTestText.contains(methodName)) {
                    failures << 'RawStore MVCC vacuum proof is missing: ' + methodName
                }
            }
            requireTokens('Vacuum executable evidence', sqlTestText, [
                    'The reader pins the second committed version as the oldest live snapshot',
                    'HOLD_CURSORS_OVER_COMMIT',
                    'the held scan keeps its duplicate',
                    'invalidateLookupHints(',
                    'publishedIndex',
                    'vacuumed logical row identities must never be reused',
                    'before_vacuum',
                    'after-vacuum-before-raw-commit',
                    'after-vacuum-raw-commit-before-publication',
                    'jdbc:derby:memory:',
                    'assertChain('
            ])
            if (!testsBuildText.contains("'runDelosMvccRawStoreVacuumTest'")) {
                failures << 'delosdb-tests must expose runDelosMvccRawStoreVacuumTest'
            }

            requireTokens('Vacuum design record', designText, [
                    'oldest retained snapshot',
                    'transactional chain relinking',
                    'logged `purgeAtSlot`',
                    'transaction-private ordered-index generation',
                    'after-vacuum-before-raw-commit',
                    'after-vacuum-raw-commit-before-publication',
                    ':delosdb-tests:runDelosMvccRawStoreVacuumTest',
                    'delosMvccRawStoreVacuumStaticAnalysis'
            ])
            requireTokens('Current implementation record', implementationText, [
                    'Transactional RawStore MVCC vacuum and purge',
                    ':delosdb-tests:runDelosMvccRawStoreVacuumTest',
                    'delosMvccRawStoreVacuumStaticAnalysis'
            ])
            requireTokens('Stable identity vacuum contract', identityText, [
                    'vacuum updates the logical link in the same RawStore',
                    'vacuumed row IDs are not reused'
            ])

            def rawStoreVacuumDispatchText = section(
                    conglomerateText,
                    'public void purgeConglomerate(',
                    'public void compressConglomerate(',
                    'RawStore MVCC vacuum dispatch section')
            [runtimeText, contextText, rawStoreVacuumDispatchText, controllerText, scanText,
             tableText, indexText, vacuumText].each { productionText ->
                ['java.nio.file.Path', 'java.nio.file.Files', 'FileChannel',
                 'RandomAccessFile', 'DelosPageVolume'].each { token ->
                    if (productionText.contains(token)) {
                        failures << 'RawStore MVCC vacuum production code contains forbidden I/O token: ' + token
                    }
                }
            }
        }

        def reportFile = layout.buildDirectory
                .file('reports/delosdb/mvcc-raw-store-vacuum-static-analysis.txt')
                .get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('RawStore MVCC vacuum and purge static analysis')
            writer.println('================================================')
            writer.println()
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'RawStore MVCC vacuum static analysis failed. Report: ' + reportFile)
        }
        logger.lifecycle(
                'RawStore MVCC vacuum static analysis passed. Report: {}',
                reportFile)
    }
}


