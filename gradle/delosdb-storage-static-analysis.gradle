                    'logical row and version identities remain authoritative',
                    'validated hint',
                    'logical fallback',
                    'optional trailing fields',
                    'stale',
                    'reopen',
                    'crash',
                    'jdbc:derby:memory:',
                    ':delosdb-tests:runDelosMvccRawStoreLookupHintTest',
