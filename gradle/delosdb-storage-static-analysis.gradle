                'reports/delosdb/mvcc-transactional-ddl-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB transactional MVCC DDL static analysis')
            writer.println('================================================')
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
