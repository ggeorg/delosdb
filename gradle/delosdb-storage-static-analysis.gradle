tasks.register('delosJfrStorageLifecycleEventsStaticAnalysis') {
    group = 'verification'
    description = 'Validates the DelosDB JDK 25 JFR storage lifecycle event surface and first safe hooks.'
    doLast {
        def rows = delosLoadJfrStorageLifecycleRows()
        def failures = []
        def ids = [] as Set
        def categories = [] as Set

        if (rows.size() < 16) {
            failures << 'JFR storage lifecycle manifest must contain at least 16 rows; found ' + rows.size()
        }

        rows.each { row ->
            if (!ids.add(row.id)) {
                failures << 'Duplicate JFR storage lifecycle manifest id: ' + row.id
            }
            categories.add(row.category)
            def proofFile = new File(delosRepositoryRoot, row.path)
            if (!proofFile.exists()) {
                failures << 'JFR storage lifecycle proof path does not exist for ' + row.id + ': ' + row.path
                return
            }
            def body = proofFile.getText('UTF-8')
            if (!body.contains(row.marker)) {
                failures << 'JFR storage lifecycle marker missing for ' + row.id + ': ' + row.marker
            }
            if (row.risk.length() < 85) {
                failures << 'JFR storage lifecycle risk is too thin for ' + row.id
            }
        }

        [
                'STORAGE_API_EVENT_SURFACE',
                'JDK25_JFR_API',
                'MVCC_ANALYZE_EVENT',
                'MVCC_CHECKPOINT_EVENT',
                'MVCC_PURGE_EVENT',
                'MVCC_RECOVERY_EVENT',
                'MVCC_BACKUP_EVENT',
                'MVCC_BUFFER_EVENT',
                'HEAP_DIAGNOSTIC_EVENT',
                'STORAGE_PATH_EVENT',
                'MVCC_ANALYZE_WIRING',
                'MVCC_CHECKPOINT_WIRING',
                'DOCUMENTATION',
                'NO_BEHAVIOR_CHANGE',
                'ALGORITHM_INVENTORY_LINK',
                'STATIC_GATE'
        ].each { category ->
            if (!categories.contains(category)) {
                failures << 'JFR storage lifecycle manifest missing category: ' + category
            }
        }

        def sourceText = new File(delosRepositoryRoot, 'delosdb-storage-api/src/main/java/org/apache/derby/iapi/store/types/DelosStorageLifecycleJfr.java').getText('UTF-8')
        [
                'import jdk.jfr.Category;',
                'import jdk.jfr.Event;',
                'import jdk.jfr.Label;',
                'import jdk.jfr.Name;',
                'event.isEnabled()',
                'event.commit()',
                'recordMvccAnalyzeStatistics',
                'recordMvccCheckpoint',
                'recordMvccPurge',
                'recordMvccRecoveryReplay',
                'recordMvccBackupSidecar',
                'recordMvccBufferEviction',
                'recordHeapSanityCheck',
                'recordStoragePathDecision',
                'org.apache.derby.delosdb.mvcc.AnalyzeStatistics',
                'org.apache.derby.delosdb.mvcc.Checkpoint',
                'org.apache.derby.delosdb.mvcc.Purge',
                'org.apache.derby.delosdb.mvcc.RecoveryReplay',
                'org.apache.derby.delosdb.mvcc.BackupSidecar',
                'org.apache.derby.delosdb.mvcc.BufferEviction',
                'org.apache.derby.delosdb.heap.SanityCheck',
                'org.apache.derby.delosdb.storage.PathDecision'
        ].each { markerText ->
            if (!sourceText.contains(markerText)) {
                failures << 'JFR event source missing marker: ' + markerText
            }
        }
        ['org.objectweb.asm', 'sun.misc.Unsafe', 'jdk.internal'].each { forbidden ->
            if (sourceText.contains(forbidden)) {
                failures << 'JFR event source must not depend on forbidden API: ' + forbidden
            }
        }

        def analyzeText = new File(delosRepositoryRoot, 'delosdb-storage-api/src/main/java/org/apache/derby/iapi/store/types/DelosMvccAnalyzeStatisticsLifecycleDiagnostics.java').getText('UTF-8')
        if (!analyzeText.contains('DelosStorageLifecycleJfr.recordMvccAnalyzeStatistics')) {
            failures << 'MVCC analyze/statistics lifecycle must record a JFR event at the proven diagnostic checkpoint'
        }
        if (!analyzeText.contains('optimizerAuthority=derby')) {
            failures << 'MVCC analyze/statistics diagnostics must preserve Derby optimizer authority marker'
        }

        def checkpointText = new File(delosRepositoryRoot, 'delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/store/PageVolumeMvccStateStore.java').getText('UTF-8')
        if (!checkpointText.contains('DelosStorageLifecycleJfr.recordMvccCheckpoint')) {
            failures << 'MVCC checkpoint rewrite must record a JFR event after the proven checkpoint lifecycle point'
        }
        def appendIndex = checkpointText.indexOf('recoveryRecordStore.appendCheckpoint')
        def eventIndex = checkpointText.indexOf('DelosStorageLifecycleJfr.recordMvccCheckpoint')
        if (appendIndex < 0 || eventIndex < 0 || eventIndex < appendIndex) {
            failures << 'MVCC checkpoint JFR event must be recorded after the subsystem checkpoint recovery record append'
        }

        def docsText = new File(delosRepositoryRoot, 'docs/JFR-STORAGE-LIFECYCLE-EVENTS.md').getText('UTF-8')
        [
                'This is an observability artifact, not a storage algorithm rewrite.',
                'JFR events are observability only.',
                'Events must be inert unless JFR is recording.',
                'No JFR event currently decides whether a storage path is legal',
                'The JFR gate is intentionally not wired into S0 yet.',
                './gradlew delosJfrStorageLifecycleEventsStaticAnalysis'
        ].each { markerText ->
            if (!docsText.contains(markerText)) {
                failures << 'JFR documentation missing marker: ' + markerText
            }
        }

        def inventoryText = new File(delosRepositoryRoot, 'docs/ALGORITHM-INVENTORY.md').getText('UTF-8')
        [
                'JDK 25 JFR storage lifecycle events update',
                'DelosStorageLifecycleJfr',
                'DIAGNOSTIC_ONLY_ALGORITHM',
                'VALIDATION_ALGORITHM',
                './gradlew delosJfrStorageLifecycleEventsStaticAnalysis'
        ].each { markerText ->
            if (!inventoryText.contains(markerText)) {
                failures << 'Algorithm inventory missing JFR marker: ' + markerText
            }
        }

        def staticText = new File(delosRepositoryRoot, 'gradle/delosdb-storage-static-analysis.gradle').getText('UTF-8')
        def s0Index = staticText.lastIndexOf("tasks.register('s0CloseoutVerification')")
        if (s0Index >= 0) {
            def s0Section = staticText.substring(s0Index)
            if (s0Section.contains('delosJfrStorageLifecycleEventsStaticAnalysis')) {
                failures << 'JFR storage lifecycle static gate must remain outside S0 until the event lane is proven stable'
            }
        }

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/jfr-storage-lifecycle-events-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB JFR storage lifecycle events static analysis')
            writer.println('============================================================')
            writer.println()
            writer.println('Rows: ' + rows.size())
            writer.println('Categories: ' + categories.sort().join(', '))
            writer.println()
            rows.each { row ->
                writer.println(row.id + ' [' + row.category + '] ' + row.path)
                writer.println('  marker: ' + row.marker)
                writer.println('  risk: ' + row.risk)
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB JFR storage lifecycle events static analysis failed. Report: ' + reportFile)
        }
        println 'DelosDB JFR storage lifecycle events static analysis passed. Report: ' + reportFile
    }
}



def delosLoadOptimizerCostAuthorityRows = {
    def manifest = new File(delosRepositoryRoot, 'gradle/static-analysis/delosdb-optimizer-cost-authority.txt')
    manifest.readLines('UTF-8')
            .findAll { line -> line.trim() && !line.startsWith('#') }
            .collect { line ->
                def parts = line.split('\\|', -1)
                if (parts.length != 5) {
                    throw new GradleException('Invalid optimizer cost authority manifest row: ' + line)
                }
                [id: parts[0], category: parts[1], path: parts[2], marker: parts[3], authority: parts[4]]
            }
}

tasks.register('delosOptimizerCostAuthorityAuditStaticAnalysis') {
    group = 'verification'
    description = 'Validates the DelosDB optimizer cost authority audit and Derby optimizer guardrails.'
    doLast {
        def rows = delosLoadOptimizerCostAuthorityRows()
        def failures = []
        def ids = [] as Set
        def categories = [] as Set

        if (rows.size() < 18) {
            failures << 'Optimizer cost authority manifest must contain at least 18 rows; found ' + rows.size()
        }

        rows.each { row ->
            if (!ids.add(row.id)) {
                failures << 'Duplicate optimizer cost authority manifest id: ' + row.id
            }
            categories.add(row.category)
            def proofFile = new File(delosRepositoryRoot, row.path)
            if (!proofFile.exists()) {
                failures << 'Optimizer cost authority proof path does not exist for ' + row.id + ': ' + row.path
                return
            }
            def body = proofFile.getText('UTF-8')
            if (!body.contains(row.marker)) {
                failures << 'Optimizer cost authority marker missing for ' + row.id + ': ' + row.marker
            }
            if (row.authority.length() < 90) {
                failures << 'Optimizer cost authority explanation is too thin for ' + row.id
            }
        }

        [
                'DOCUMENTATION',
                'NO_PARALLEL_OPTIMIZER',
                'DERBY_OPTIMIZER_AUTHORITY',
                'STORE_COST_CONTROLLER_SEAM',
                'MVCC_STATISTICS_HINT',
                'EXPLICIT_OPT_IN',
                'DIAGNOSTIC_ONLY',
                'LEGACY_INDEX_PROVIDER_DIAGNOSTIC',
                'ANALYZE_STATISTICS_LIFECYCLE',
                'ALGORITHM_INVENTORY_LINK',
                'STATIC_GATE'
        ].each { category ->
            if (!categories.contains(category)) {
                failures << 'Optimizer cost authority manifest missing category: ' + category
            }
        }

        def docText = new File(delosRepositoryRoot, 'docs/OPTIMIZER-COST-AUTHORITY.md').getText('UTF-8')
        [
                'Derby optimizer remains the authority.',
                'Do not replace Derby optimizer.',
                'Do not create a parallel MVCC optimizer statistics channel.',
                'Do not add Calcite as a DelosDB optimizer dependency.',
                'Do not make MVCC storage statistics a hidden default plan-choice source.',
                'Do not consume provider cost without a safe Derby baseline.',
                'Keep IndexProvider cost diagnostics diagnostic-only.',
                'No optimizer behavior change in this audit.',
                './gradlew delosOptimizerCostAuthorityAuditStaticAnalysis'
        ].each { markerText ->
            if (!docText.contains(markerText)) {
                failures << 'Optimizer cost authority documentation missing marker: ' + markerText
            }
        }

        def inventoryText = new File(delosRepositoryRoot, 'docs/ALGORITHM-INVENTORY.md').getText('UTF-8')
        [
                'Optimizer cost authority audit update',
                'Derby optimizer remains the authority.',
                'Do not replace Derby optimizer.',
                'StoreCostController',
                'DelosMvccOptimizerCostDiagnostics',
                './gradlew delosOptimizerCostAuthorityAuditStaticAnalysis'
        ].each { markerText ->
            if (!inventoryText.contains(markerText)) {
                failures << 'Algorithm inventory missing optimizer cost authority marker: ' + markerText
            }
        }

        def mvccCostText = new File(delosRepositoryRoot, 'delosdb-storage-bridge/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccStoreCostController.java').getText('UTF-8')
        [
                'DelosMvccOptimizerCostDiagnostics.enabled()',
                'storageStatisticsSnapshot()',
                'DelosStorageCostEstimate.fromStatisticsForOptimizerCosting',
                'rather than through a parallel optimizer statistics channel'
        ].each { markerText ->
            if (!mvccCostText.contains(markerText)) {
                failures << 'MVCC StoreCostController missing authority marker: ' + markerText
            }
        }

        def costModeText = new File(delosRepositoryRoot, 'delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/cost/CostModelMode.java').getText('UTF-8')
        if (!costModeText.contains('OFF(false, false)') || !costModeText.contains('DIAGNOSTIC(true, false)')) {
            failures << 'CostModelMode must preserve OFF and DIAGNOSTIC non-consuming modes'
        }
        if (!costModeText.contains('The default is Derby-compatible.')) {
            failures << 'CostModelMode must document Derby-compatible default authority'
        }

        def indexModeText = new File(delosRepositoryRoot, 'delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/index/IndexProviderCostMode.java').getText('UTF-8')
        if (!indexModeText.contains('ENABLED(true, false)')
                || !indexModeText.contains("without replacing")) {
            failures << 'Legacy IndexProvider cost mode must remain diagnostic-only even for enabled spelling'
        }

        def analyzeText = new File(delosRepositoryRoot, 'delosdb-storage-api/src/main/java/org/apache/derby/iapi/store/types/DelosMvccAnalyzeStatisticsLifecycleDiagnostics.java').getText('UTF-8')
        if (!analyzeText.contains('optimizerAuthority=derby')) {
            failures << 'MVCC analyze/statistics lifecycle must keep optimizerAuthority=derby marker'
        }

        def staticText = new File(delosRepositoryRoot, 'gradle/delosdb-storage-static-analysis.gradle').getText('UTF-8')
        def s0Index = staticText.lastIndexOf("tasks.register('s0CloseoutVerification')")
        if (s0Index >= 0) {
            def s0Section = staticText.substring(s0Index)
            if (s0Section.contains('delosOptimizerCostAuthorityAuditStaticAnalysis')) {
                failures << 'Optimizer cost authority audit gate must remain outside S0 until the audit is proven stable'
            }
        }

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/optimizer-cost-authority-audit-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB optimizer cost authority audit static analysis')
            writer.println('============================================================')
            writer.println()
            writer.println('Rows: ' + rows.size())
            writer.println('Categories: ' + categories.sort().join(', '))
            writer.println()
            rows.each { row ->
                writer.println(row.id + ' [' + row.category + '] ' + row.path)
                writer.println('  marker: ' + row.marker)
                writer.println('  authority: ' + row.authority)
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB optimizer cost authority audit static analysis failed. Report: ' + reportFile)
        }
        println 'DelosDB optimizer cost authority audit static analysis passed. Report: ' + reportFile
    }
}


tasks.register('delosMvccOrderedIndexNullKeyProofStaticAnalysis') {
    group = 'verification'
    description = 'Validates the MVCC ordered-index NULL key proof manifest and proof hooks.'

    inputs.file('gradle/static-analysis/delosdb-mvcc-ordered-index-null-key-proof.txt')
    inputs.file('docs/MVCC-ORDERED-INDEX-NULL-KEY-PROOF.md')
    inputs.file('docs/MVCC-ORDERED-INDEX-KEY-SEMANTICS.md')
    inputs.file('docs/ALGORITHM-INVENTORY.md')
    inputs.file('delosdb-storage-api/src/main/java/org/apache/derby/iapi/store/types/DelosStorageOrderedIndexKey.java')
    inputs.file('delosdb-storage-mvcc/src/test/java/io/github/ggeorg/delosdb/storage/mvcc/durable/MvccOrderedIndexPageStoreTest.java')
    inputs.file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccSqlTypedOrderedIndexKeyTest.java')
    outputs.file(layout.buildDirectory.file('reports/delosdb/mvcc-ordered-index-null-key-proof-static-analysis.txt'))

    doLast {
        def manifest = new File(delosRepositoryRoot, 'gradle/static-analysis/delosdb-mvcc-ordered-index-null-key-proof.txt')
        if (!manifest.exists()) {
            throw new GradleException('Missing MVCC ordered-index NULL key proof manifest: ' + manifest)
        }
        def rows = manifest.readLines('UTF-8')
                .findAll { line -> line.trim() && !line.trim().startsWith('#') }
                .collect { line ->
                    def parts = line.split('\\|', -1)
                    if (parts.length < 6) {
                        throw new GradleException('Malformed MVCC ordered-index NULL key proof row: ' + line)
                    }
                    [id: parts[0], path: parts[1], marker: parts[2], category: parts[3], reference: parts[4], rationale: parts[5]]
                }
        def failures = []
        def ids = new LinkedHashSet<String>()
        def requiredCategories = [
                'VALIDATION_ALGORITHM',
                'MVCC_AUTHORITY_ALGORITHM',
                'JDK25_MODERNIZATION_CANDIDATE',
                'DO_NOT_TOUCH_WITHOUT_COMPAT_GATE'
        ] as Set
        def categories = new LinkedHashSet<String>()
        rows.each { row ->
            if (!ids.add(row.id)) {
                failures << 'Duplicate NULL key proof row id: ' + row.id
            }
            categories << row.category
            def target = new File(delosRepositoryRoot, row.path)
            if (!target.exists()) {
                failures << 'NULL key proof target missing: ' + row.path
            } else {
                def text = target.getText('UTF-8')
                if (!text.contains(row.marker)) {
                    failures << row.id + ' marker not found in ' + row.path + ': ' + row.marker
                }
            }
        }
        requiredCategories.each { category ->
            if (!categories.contains(category)) {
                failures << 'Missing NULL key proof category: ' + category
            }
        }

        def proofDoc = new File(delosRepositoryRoot, 'docs/MVCC-ORDERED-INDEX-NULL-KEY-PROOF.md').getText('UTF-8')
        [
                'SQL NULL values are encoded as the typed `DOK1|N|` ordered-index envelope.',
                'Do not make `IS NULL` rely on a new optimizer path in this slice.',
                'Do not weaken `MvccInheritedRowCodec` or allow arbitrary Java object storage.',
                './gradlew delosMvccOrderedIndexNullKeyProofStaticAnalysis'
        ].each { markerText ->
            if (!proofDoc.contains(markerText)) {
                failures << 'NULL key proof documentation missing marker: ' + markerText
            }
        }

        def durableTest = new File(delosRepositoryRoot, 'delosdb-storage-mvcc/src/test/java/io/github/ggeorg/delosdb/storage/mvcc/durable/MvccOrderedIndexPageStoreTest.java').getText('UTF-8')
        [
                'typedNullEnvelopeSortsBeforeTypedValuesAndSupportsLookup',
                'DOK1|N|',
                'rowIdsFor(1, "DOK1|N|")',
                'rowIdsInRangeFor(1, "DOK1|N|", true, "DOK1|I|5", true)'
        ].each { markerText ->
            if (!durableTest.contains(markerText)) {
                failures << 'Durable ordered-index NULL proof missing marker: ' + markerText
            }
        }

        def sqlTest = new File(delosRepositoryRoot, 'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccSqlTypedOrderedIndexKeyTest.java').getText('UTF-8')
        [
                'testNullValuesKeepTypedOrderedIndexKeySemanticsThroughReopen',
                'where n is null order by id',
                'containsOrderedIndexSummary',
                'non-null typed range should still use ordered pages after NULL-key rebuild',
                'NULL-key rebuild must not force ordered-index fallback for supported typed ranges'
        ].each { markerText ->
            if (!sqlTest.contains(markerText)) {
                failures << 'SQL ordered-index NULL proof missing marker: ' + markerText
            }
        }
        if (sqlTest.contains('java.io.Serializable') || sqlTest.contains('ObjectInputStream')) {
            failures << 'SQL NULL key proof must not introduce generic Java object serialization'
        }

        def typedKey = new File(delosRepositoryRoot, 'delosdb-storage-api/src/main/java/org/apache/derby/iapi/store/types/DelosStorageOrderedIndexKey.java').getText('UTF-8')
        if (!typedKey.contains('return encodeNull();') || !typedKey.contains("NULL('N', 0)")) {
            failures << 'Typed ordered-index key API must keep stable NULL envelope markers'
        }

        def staticText = new File(delosRepositoryRoot, 'gradle/delosdb-storage-static-analysis.gradle').getText('UTF-8')
        def s0Index = staticText.lastIndexOf("tasks.register('s0CloseoutVerification')")
        if (s0Index >= 0) {
            def s0Section = staticText.substring(s0Index)
            if (s0Section.contains('delosMvccOrderedIndexNullKeyProofStaticAnalysis')) {
                failures << 'MVCC ordered-index NULL key proof gate must remain outside S0 until the proof is stable'
            }
        }

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/mvcc-ordered-index-null-key-proof-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB MVCC ordered-index NULL key proof static analysis')
            writer.println('============================================================')
            writer.println()
            writer.println('Rows: ' + rows.size())
            writer.println('Categories: ' + categories.sort().join(', '))
            writer.println()
            rows.each { row ->
                writer.println(row.id + ' [' + row.category + '] ' + row.path)
                writer.println('  marker: ' + row.marker)
                writer.println('  reference: ' + row.reference)
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB MVCC ordered-index NULL key proof static analysis failed. Report: ' + reportFile)
        }
        println 'DelosDB MVCC ordered-index NULL key proof static analysis passed. Report: ' + reportFile
    }
}

tasks.register('delosJcstressMvccVisibilityProbes') {
    group = 'verification'
    description = 'Validates the opt-in jcstress MVCC visibility probes and optionally runs -Pdelosdb.jcstress.visibility.command.'
    dependsOn ':delosdb-storage-mvcc:runDelosMvccConcurrencyValidation'
    doLast {
        def probeRoot = new File(delosRepositoryRoot, 'benchmarks/jcstress/delosdb-storage-mvcc')
        def probeSourceRoot = new File(delosRepositoryRoot, 'benchmarks/jcstress/delosdb-storage-mvcc/src/main/java')
        def probeFiles = [
                new File(delosRepositoryRoot, 'benchmarks/jcstress/delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccSnapshotIsolationJcstressProbe.java'),
                new File(delosRepositoryRoot, 'benchmarks/jcstress/delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccCommitVisibilityJcstressProbe.java'),
                new File(delosRepositoryRoot, 'benchmarks/jcstress/delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccSnapshotLeaseHorizonJcstressProbe.java'),
                new File(delosRepositoryRoot, 'benchmarks/jcstress/delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/durable/DelosMvccBufferPinDirtyJcstressProbe.java')
        ]
        def failures = []
        if (!probeRoot.isDirectory()) {
            failures << 'Missing jcstress probe root: ' + probeRoot
        }
        if (!probeSourceRoot.isDirectory()) {
            failures << 'Missing jcstress probe source root: ' + probeSourceRoot
        }
        probeFiles.each { sourceFile ->
            if (!sourceFile.exists()) {
                failures << 'Missing jcstress probe source: ' + sourceFile
                return
            }
            def text = sourceFile.getText('UTF-8')
            ['org.openjdk.jcstress.annotations.JCStressTest', '@JCStressTest', '@Outcome', '@Actor', '@State'].each { marker ->
                if (!text.contains(marker)) {
                    failures << 'jcstress probe source ' + sourceFile + ' missing marker: ' + marker
                }
            }
        }

        def docsText = new File(delosRepositoryRoot, 'benchmarks/jcstress/delosdb-storage-mvcc/README.md').exists()
                ? new File(delosRepositoryRoot, 'benchmarks/jcstress/delosdb-storage-mvcc/README.md').getText('UTF-8')
                : ''
        ['delosJcstressMvccVisibilityProbes', 'delosdb.jcstress.visibility.command',
         'DelosMvccSnapshotIsolationJcstressProbe', 'DelosMvccCommitVisibilityJcstressProbe',
         'DelosMvccSnapshotLeaseHorizonJcstressProbe', 'DelosMvccBufferPinDirtyJcstressProbe'].each { marker ->
            if (!docsText.contains(marker)) {
                failures << 'jcstress MVCC visibility README missing marker: ' + marker
            }
        }

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/jcstress-mvcc-visibility-probes.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB jcstress MVCC visibility probes')
            writer.println('======================================')
            writer.println()
            writer.println('Probe root: ' + probeRoot)
            writer.println('Probe sources:')
            probeFiles.each { writer.println('  - ' + it) }
            writer.println()
            writer.println('Built-in baseline task: :delosdb-storage-mvcc:runDelosMvccConcurrencyValidation')
            writer.println('External command property: delosdb.jcstress.visibility.command')
            writer.println('External command configured: ' + (providers.gradleProperty('delosdb.jcstress.visibility.command').orNull != null))
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB jcstress MVCC visibility probe validation failed. Report: ' + reportFile)
        }
        if (providers.gradleProperty('delosdb.jcstress.visibility.command').orNull != null) {
            delosRunExternalValidationCommand('delosdb.jcstress.visibility.command', 'delosJcstressMvccVisibilityProbes')
        }
