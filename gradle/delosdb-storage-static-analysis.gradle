        'delosdb-engine/src/main/java/org/apache/derby/impl/load/ImportAbstract.java',
        'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/replication/net/SocketConnection.java',
        'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/HeapObjectDeserializationFilterTest.java'
]

def delosHeapObjectFilterLeafSites = [
        'delosdb-client/src/main/java/org/apache/derby/client/am/Cursor.java': 'client UDT materialization',
        'delosdb-server/src/main/java/org/apache/derby/impl/drda/DRDAConnThread.java': 'DRDA UDT parameter materialization',
        'delosdb-engine/src/main/java/org/apache/derby/impl/load/ImportAbstract.java': 'import UDT materialization',
        'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/replication/net/SocketConnection.java': 'replication control-message stream'
]

def delosHeapObjectFilterRequire = { List<String> failures, boolean condition, String message ->
    if (!condition) {
        failures << message
    }
}

tasks.register('delosHeapObjectDeserializationFilterStaticAnalysis') {
    group = 'verification'
    description = 'Protects opt-in ObjectInputFilter hardening for heap JAVA_OBJECT reads and inherited Derby leaf ObjectInputStream sites.'

    inputs.files(delosHeapObjectDeserializationFilterStaticFiles.collect { file(it) }.findAll { it.exists() }).optional()
    outputs.file(layout.buildDirectory.file('reports/delosdb/heap-object-deserialization-filter-static-analysis.txt'))

    doLast {
        def failures = []
        def objectFilterFile = file('delosdb-commons/src/main/java/org/apache/derby/shared/common/security/DelosObjectInputFilters.java')
        def filterFile = file('delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/io/DelosHeapObjectDeserializationFilter.java')
        def formatIdInputStreamFile = file('delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/io/FormatIdInputStream.java')
        def applicationObjectInputStreamFile = file('delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/io/ApplicationObjectInputStream.java')
        def testFile = file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/HeapObjectDeserializationFilterTest.java')

        delosHeapObjectDeserializationFilterStaticFiles.each { relativePath ->
            delosHeapObjectFilterRequire(failures, file(relativePath).exists(), 'Missing object deserialization filter file: ' + relativePath)
        }

        def objectFilterText = objectFilterFile.exists() ? objectFilterFile.getText('UTF-8') : ''
        def filterText = filterFile.exists() ? filterFile.getText('UTF-8') : ''
        def formatIdText = formatIdInputStreamFile.exists() ? formatIdInputStreamFile.getText('UTF-8') : ''
        def applicationStreamText = applicationObjectInputStreamFile.exists() ? applicationObjectInputStreamFile.getText('UTF-8') : ''
        def testText = testFile.exists() ? testFile.getText('UTF-8') : ''

        delosHeapObjectFilterRequire(failures, objectFilterText.contains('delosdb.objectDeserializationFilter'),
                'General object deserialization filter must remain opt-in through delosdb.objectDeserializationFilter')
        delosHeapObjectFilterRequire(failures, objectFilterText.contains('delosdb.heap.objectDeserializationFilter'),
                'Heap object deserialization filter must remain opt-in through delosdb.heap.objectDeserializationFilter')
        delosHeapObjectFilterRequire(failures, objectFilterText.contains('ObjectInputFilter.Config.createFilter'),
                'Object deserialization filters must use ObjectInputFilter.Config.createFilter')
        delosHeapObjectFilterRequire(failures, objectFilterText.contains('stream.setObjectInputFilter'),
                'DelosObjectInputFilters must own the only production setObjectInputFilter call')
        delosHeapObjectFilterRequire(failures, objectFilterText.contains('pattern == null') && objectFilterText.contains('pattern.isBlank()'),
                'Object deserialization filters must preserve default Derby behavior when the property is unset or blank')
        delosHeapObjectFilterRequire(failures, filterText.contains('DelosObjectInputFilters.HEAP_FILTER_PROPERTY')
                        && filterText.contains('DelosObjectInputFilters.applyHeapFilterIfConfigured'),
                'DelosHeapObjectDeserializationFilter must delegate to the common heap ObjectInputFilter helper')

        def formatApplyCount = (formatIdText =~ /DelosHeapObjectDeserializationFilter\.applyIfConfigured\s*\(/).count
        delosHeapObjectFilterRequire(failures, formatApplyCount == 1,
                'FormatIdInputStream must install the heap object deserialization filter exactly once; found ' + formatApplyCount)
        delosHeapObjectFilterRequire(failures, formatIdText.contains('new ApplicationObjectInputStream'),
                'FormatIdInputStream must keep ApplicationObjectInputStream as the heap JAVA_OBJECT stream constructor')
        delosHeapObjectFilterRequire(failures, !applicationStreamText.contains('DelosHeapObjectDeserializationFilter.applyIfConfigured'),
                'ApplicationObjectInputStream must not install DelosHeapObjectDeserializationFilter; FormatIdInputStream owns the single installation point')
        delosHeapObjectFilterRequire(failures, !applicationStreamText.contains('setObjectInputFilter'),
                'ApplicationObjectInputStream must not call setObjectInputFilter directly')

        delosHeapObjectFilterLeafSites.each { relativePath, description ->
            def leafText = file(relativePath).exists() ? file(relativePath).getText('UTF-8') : ''
            delosHeapObjectFilterRequire(failures, leafText.contains('DelosObjectInputFilters.applyGeneralFilterIfConfigured'),
                    'Leaf ObjectInputStream site must install the general opt-in filter: ' + relativePath + ' (' + description + ')')
        }

        def productionSetFilterSites = []
        fileTree(rootProject.projectDir) {
            include 'delosdb-*/src/main/java/**/*.java'
            exclude 'delosdb-commons/src/main/java/org/apache/derby/shared/common/security/DelosObjectInputFilters.java'
        }.files.each { sourceFile ->
            int lineNumber = 0
            sourceFile.eachLine('UTF-8') { line ->
                lineNumber++
                if (line.contains('setObjectInputFilter')) {
                    def relative = rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separatorChar, '/' as char)
                    productionSetFilterSites << relative + ':' + lineNumber + ': ' + delosStorageNormalize(line)
                }
            }
        }
        if (!productionSetFilterSites.isEmpty()) {
            failures << 'Only DelosObjectInputFilters may call setObjectInputFilter in production sources. Extra sites: ' + productionSetFilterSites.join('; ')
        }

        ['testStrictModeAllowsConfiguredTypeAndBlocksUnlistedType',
         'testMvccStillRejectsJavaObjectRows'].each { testName ->
            delosHeapObjectFilterRequire(failures, testText.contains(testName),
                    'HeapObjectDeserializationFilterTest must keep coverage method: ' + testName)
        }

        delosHeapObjectFilterRequire(failures,
                testText.contains('testDefaultModePreservesDerbyHeapJavaObjectBehavior')
                        || testText.contains('testUnsetFilterPreservesDerbySerializableObjectBehavior'),
                'HeapObjectDeserializationFilterTest must keep default/unset compatibility coverage')

        def reportFile = layout.buildDirectory.file('reports/delosdb/heap-object-deserialization-filter-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB object deserialization filter static analysis')
            writer.println('===================================================')
            writer.println()
            writer.println('Checked files:')
            delosHeapObjectDeserializationFilterStaticFiles.each { writer.println('  - ' + it) }
            writer.println()
            writer.println('Leaf ObjectInputStream sites:')
            delosHeapObjectFilterLeafSites.each { relativePath, description ->
                writer.println('  - ' + relativePath + ' (' + description + ')')
            }
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Object deserialization filter checks passed.')
            } else {
                writer.println('Object deserialization filter failures:')
                failures.each { failure -> writer.println('  - ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB object deserialization filter static analysis failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB object deserialization filter static analysis passed. Report: {}', reportFile)
    }
}


def delosOverlayCleanupScriptPatterns = [
        ~/cleanup-overlay-.*\.sh/,
        ~/cleanup-stale-gradle-scripts\.sh/
]

def delosOverlayCleanupScriptRelativePath = { File candidate ->
    rootProject.projectDir.toPath().relativize(candidate.toPath()).toString().replace(File.separatorChar, '/' as char)
}

def delosOverlayCleanupScriptCandidates = {
    def scriptsDir = file('scripts')
    if (!scriptsDir.isDirectory()) {
        return []
    }
    scriptsDir.listFiles()
            .findAll { File candidate -> candidate.isFile() }
            .findAll { File candidate ->
                delosOverlayCleanupScriptPatterns.any { pattern -> candidate.name ==~ pattern }
            }
            .sort { File left, File right -> left.name <=> right.name }
}

tasks.register('delosOverlayCleanupScriptStaticAnalysis') {
    group = 'verification'
    description = 'Fails if one-shot overlay cleanup scripts are left as permanent project tools.'

    inputs.dir(file('scripts')).optional()
    outputs.file(layout.buildDirectory.file('reports/delosdb/overlay-cleanup-scripts-static-analysis.txt'))

    doLast {
        def staleScripts = delosOverlayCleanupScriptCandidates.call()
        def reportFile = layout.buildDirectory.file('reports/delosdb/overlay-cleanup-scripts-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB overlay cleanup script static analysis')
            writer.println('==============================================')
            writer.println()
            writer.println('Checked policy: one-shot overlay cleanup scripts must not remain in scripts/.')
            writer.println('Reusable maintenance scripts are allowed, but they must not use cleanup-overlay-* names.')
            writer.println()
            if (staleScripts.isEmpty()) {
                writer.println('No one-shot overlay cleanup scripts found.')
            } else {
                writer.println('One-shot overlay cleanup scripts still present:')
                staleScripts.each { File staleScript ->
                    writer.println('  - ' + delosOverlayCleanupScriptRelativePath.call(staleScript))
                }
            }
        }

        if (!staleScripts.isEmpty()) {
            def stalePaths = staleScripts.collect { File staleScript ->
                delosOverlayCleanupScriptRelativePath.call(staleScript)
            }.join(', ')
            throw new GradleException('One-shot overlay cleanup script(s) still present: ' + stalePaths)
        }

        logger.lifecycle('DelosDB overlay cleanup script static analysis passed. Report: {}', reportFile)
    }
}


def delosModuleDependencyReportDir = layout.buildDirectory.dir('reports/delosdb-module-dependencies')
def delosModuleDependencyReportFiles = [
        'missing-declared-project-dependencies.tsv',
        'duplicate-resources.tsv',
        'output-dir-backdoors.tsv',
        'unresolved-imports.tsv',
        'module-dependencies.md'
]

def delosModuleDependencyNonHeaderRows = { File tsvFile ->
    if (!tsvFile.isFile()) {
        return ['<missing report file: ' + tsvFile + '>']
    }
    def lines = tsvFile.readLines('UTF-8')
    if (lines.isEmpty()) {
        return ['<empty report file: ' + tsvFile + '>']
    }
    lines.drop(1).findAll { it.trim() }
}

tasks.register('delosModuleDependencyReport', Exec) {
    group = 'verification'
    description = 'Generates the DelosDB module dependency and resource ownership report.'

    inputs.file('scripts/module-dependency-tree.py')
    inputs.file('settings.gradle')
    inputs.files(fileTree('.') {
        include '*/build.gradle'
        include '*/src/main/java/**/*.java'
        include '*/src/test/java/**/*.java'
        include '*/src/main/resources/**'
        include '*/src/test/resources/**'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
    })
    outputs.dir(delosModuleDependencyReportDir)

    commandLine 'python3', 'scripts/module-dependency-tree.py'
}

tasks.register('delosModuleDependencyBoundaryStaticAnalysis') {
    group = 'verification'
    description = 'Verifies objective DelosDB module dependency and resource-boundary invariants.'
    dependsOn 'delosModuleDependencyReport'

    inputs.files(delosModuleDependencyReportFiles.collect { name ->
        delosModuleDependencyReportDir.map { it.file(name) }
    })
    outputs.file(layout.buildDirectory.file('reports/delosdb/module-dependency-boundary-static-analysis.txt'))

    doLast {
        def reportDir = delosModuleDependencyReportDir.get().asFile
        def failures = []
        def summaryFile = new File(reportDir, 'module-dependencies.md')
        def summaryText = summaryFile.isFile() ? summaryFile.getText('UTF-8') : ''

        def expectedZeroSummaryLines = [
                '| Missing declared production dependencies | 0 |',
                '| Package owner collisions | 0 |',
                '| Duplicate resource paths | 0 |',
                '| Duplicate service resource paths | 0 |',
                '| Cross-module output-dir backdoor lines | 0 |',
                '| Unresolved project imports | 0 |'
        ]
        expectedZeroSummaryLines.each { line ->
            if (!summaryText.contains(line)) {
                failures << 'Module dependency summary must keep zero invariant: ' + line
            }
        }

        [
                'missing-declared-project-dependencies.tsv' : 'missing declared production dependencies',
                'duplicate-resources.tsv'                  : 'duplicate resource paths',
                'output-dir-backdoors.tsv'                 : 'cross-module output-dir backdoor lines',
                'unresolved-imports.tsv'                   : 'unresolved project imports'
        ].each { String fileName, String description ->
            def rows = delosModuleDependencyNonHeaderRows(new File(reportDir, fileName))
            if (!rows.isEmpty()) {
                failures << "Unexpected ${description}: " + rows.join(' | ')
            }
        }

        def mvccBuild = file('delosdb-storage-mvcc/build.gradle')
        def mvccBuildText = mvccBuild.isFile() ? mvccBuild.getText('UTF-8') : ''
        if (!mvccBuildText.contains("implementation project(':delosdb-runtime-api')")) {
            failures << "delosdb-storage-mvcc must declare its direct runtime-api dependency; do not rely on transitive storage-api wiring."
        }

        def reportFile = layout.buildDirectory.file('reports/delosdb/module-dependency-boundary-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB module dependency boundary static analysis')
            writer.println('=================================================')
            writer.println()
            writer.println('Source report directory: ' + reportDir)
            writer.println('Checked invariants:')
            writer.println('  - no missing declared production dependencies')
            writer.println('  - no package owner collisions')
            writer.println('  - no duplicate resource paths or service resources')
            writer.println('  - no cross-module output-dir backdoor lines')
            writer.println('  - no unresolved project imports')
            writer.println('  - delosdb-storage-mvcc declares delosdb-runtime-api directly')
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Module dependency boundary checks passed.')
            } else {
                writer.println('Module dependency boundary failures:')
                failures.each { failure -> writer.println('  - ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB module dependency boundary static analysis failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB module dependency boundary static analysis passed. Report: {}', reportFile)
    }
}


tasks.register('delosWorkspaceChurnStaticAnalysis') {
    group = 'verification'
    description = 'Fails on accidental workspace churn such as Mac archive metadata and line-ending-only tracked diffs.'
    outputs.file(layout.buildDirectory.file('reports/delosdb/workspace-churn-static-analysis.txt'))

    doLast {
        def failures = []
        def warnings = []

        def archiveMetadataFiles = fileTree(rootDir) {
            include '**/.DS_Store'
            include '**/__MACOSX/**'
            include '**/._*'
            exclude '.git/**'
            exclude '**/build/**'
            exclude '**/.gradle/**'
        }.files.collect { rootDir.toPath().relativize(it.toPath()).toString() }.sort()

        if (!archiveMetadataFiles.isEmpty()) {
            failures << 'Archive/OS metadata files are present in the workspace: ' + archiveMetadataFiles.join(', ')
        }

        def runGit = { List<String> args ->
            def command = (['git'] + args).collect { it.toString() }
            def process = new ProcessBuilder(command)
                    .directory(rootDir)
                    .start()
            def stdout = new ByteArrayOutputStream()
            def stderr = new ByteArrayOutputStream()
            def stdoutThread = Thread.start { process.inputStream.transferTo(stdout) }
            def stderrThread = Thread.start { process.errorStream.transferTo(stderr) }
            def exitValue = process.waitFor()
            stdoutThread.join()
            stderrThread.join()
            [exitValue: exitValue,
             stdout: stdout.toString(StandardCharsets.UTF_8.name()),
             stderr: stderr.toString(StandardCharsets.UTF_8.name())]
        }

        def gitRoot = runGit(['rev-parse', '--is-inside-work-tree'])
        if (gitRoot.exitValue != 0) {
            warnings << 'Git workspace not available; skipped tracked line-ending churn check.'
        } else {
            def diffModes = [
                    [name: 'unstaged', base: ['diff', '--name-only', '--diff-filter=ACMRTUXB'],
                     check: ['diff', '--exit-code', '--ignore-space-at-eol', '--ignore-cr-at-eol']],
                    [name: 'staged', base: ['diff', '--cached', '--name-only', '--diff-filter=ACMRTUXB'],
                     check: ['diff', '--cached', '--exit-code', '--ignore-space-at-eol', '--ignore-cr-at-eol']]
            ]

            diffModes.each { mode ->
                def names = runGit(mode.base)
                if (names.exitValue != 0) {
                    warnings << "Could not inspect ${mode.name} tracked files: " + names.stderr.trim()
                    return
                }
                names.stdout.readLines()
                        .collect { it.trim() }
                        .findAll { !it.isEmpty() }
                        .unique()
                        .sort()
                        .each { String relativePath ->
                            def ignored = runGit(mode.check + ['--', relativePath])
                            if (ignored.exitValue == 0) {
                                failures << "${mode.name} tracked change is only line-ending/trailing-whitespace churn: ${relativePath}"
                            }
                        }
            }
        }

        def reportFile = layout.buildDirectory.file('reports/delosdb/workspace-churn-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB workspace churn static analysis')
            writer.println('========================================')
            writer.println()
            writer.println('Checked invariants:')
            writer.println('  - no __MACOSX, .DS_Store, or AppleDouble ._* files in the workspace')
            writer.println('  - no tracked staged/unstaged changes that are only CRLF/LF or trailing-whitespace churn')
            writer.println()
            if (!warnings.isEmpty()) {
                writer.println('Warnings:')
                warnings.each { warning -> writer.println('  - ' + warning) }
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('Workspace churn checks passed.')
            } else {
                writer.println('Workspace churn failures:')
                failures.each { failure -> writer.println('  - ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB workspace churn static analysis failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB workspace churn static analysis passed. Report: {}', reportFile)
    }
}

