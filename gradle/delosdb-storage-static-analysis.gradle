        if (!failures.isEmpty()) {
            throw new GradleException('Storage inspector consolidation static analysis failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB storage inspector consolidation static analysis passed. Report: {}', reportFile)
    }
