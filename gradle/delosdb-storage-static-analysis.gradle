            [
                    'short-to-long',
                    'short-after-long',
                    'deleteRow(connection, 5)',
                    'vacuum must retain live overflow chains',
                    'vacuum should drop obsolete overflow chains',
                    'overflow page count should remain stable after reopen'
            ].each { markerText ->
                if (!lifecycleTestText.contains(markerText)) {
                    failures << 'MvccSqlOverflowLifecycleTest is missing overflow lifecycle marker: ' + markerText
                }
