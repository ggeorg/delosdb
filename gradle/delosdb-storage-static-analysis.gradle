def delosExternalValidationConfiguredCommand = { Map spec ->
    def configured = providers.gradleProperty(spec.propertyName).orNull
    if (configured == null) {
        return null
    }
    def trimmed = configured.trim()
    trimmed.isEmpty() ? null : trimmed
}

tasks.register('delosExternalMvccValidationPlan') {
    group = 'verification'
    description = 'Writes the R6 MVCC external-validation plan and the currently configured opt-in tool commands.'

    delosExternalValidationSpecs.each { spec ->
        inputs.property(spec.propertyName, providers.gradleProperty(spec.propertyName).orElse(''))
    }
    inputs.property('delosdb.external.validation.required', providers.gradleProperty('delosdb.external.validation.required').orElse('false'))
    outputs.file(layout.buildDirectory.file('reports/delosdb/external-mvcc-validation-plan.txt'))

    doLast {
        def reportFile = new File(delosBuildRoot, 'reports/delosdb/external-mvcc-validation-plan.txt')
        reportFile.parentFile.mkdirs()
        def configuredSpecs = delosExternalValidationSpecs.findAll { spec ->
            delosExternalValidationConfiguredCommand(spec) != null
        }
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB R6 external MVCC validation plan')
            writer.println('==========================================')
            writer.println()
            writer.println('Configured external tools: ' + configuredSpecs.size() + ' of ' + delosExternalValidationSpecs.size())
            writer.println('Required mode: ' + providers.gradleProperty('delosdb.external.validation.required').orElse('false').get())
            writer.println()
            delosExternalValidationSpecs.each { spec ->
                def configured = delosExternalValidationConfiguredCommand(spec)
                writer.println(spec.id + ' [' + spec.category + ']')
                writer.println('  root task: ' + spec.taskName)
                writer.println('  command property: -P' + spec.propertyName + '="<command>"')
                writer.println('  built-in baseline: ' + spec.builtInTask)
                writer.println('  status: ' + (configured == null ? 'not configured' : 'configured'))
                if (configured != null) {
                    writer.println('  command: ' + configured)
                }
                writer.println('  reason: ' + spec.reason)
                writer.println()
            }
            writer.println('Aggregate task: delosExternalMvccValidation')
            writer.println('S0 boundary: external validation remains opt-in and is not wired into s0CloseoutVerification.')
        }
        println 'DelosDB external MVCC validation plan written: ' + reportFile
    }
}

tasks.register('delosExternalMvccValidation') {
    group = 'verification'
    description = 'Runs the configured R6 external MVCC validation tools; unconfigured tools are reported but skipped.'
    dependsOn 'delosExternalMvccValidationPlan'
    dependsOn {
        delosExternalValidationSpecs.findAll { spec ->
            delosExternalValidationConfiguredCommand(spec) != null
        }.collect { spec ->
            spec.taskName
        }
    }
    doFirst {
        def configuredSpecs = delosExternalValidationSpecs.findAll { spec ->
            delosExternalValidationConfiguredCommand(spec) != null
        }
        def required = providers.gradleProperty('delosdb.external.validation.required').orElse('false').get().toBoolean()
        if (configuredSpecs.isEmpty()) {
            if (required) {
                throw new GradleException('delosExternalMvccValidation requires at least one configured external command when -Pdelosdb.external.validation.required=true')
            }
            logger.lifecycle('No R6 external MVCC validation commands configured; wrote the plan report only.')
        } else {
            logger.lifecycle('Running configured R6 external MVCC validation tasks: ' + configuredSpecs.collect { it.taskName }.join(', '))
        }
    }
}

def delosLoadJdk25ClassFileVerifierRows = {
    def manifest = new File(delosRepositoryRoot, 'gradle/static-analysis/delosdb-jdk25-classfile-bytecode-verifier.txt')
    manifest.readLines('UTF-8')
            .findAll { line -> line.trim() && !line.startsWith('#') }
            .collect { line ->
                def parts = line.split('\\|', -1)
                if (parts.length != 5) {
                    throw new GradleException('Invalid JDK 25 class-file verifier manifest row: ' + line)
                }
                [id: parts[0], category: parts[1], path: parts[2], marker: parts[3], risk: parts[4]]
            }
}

tasks.register('delosJdk25ClassFileBytecodeVerifierStaticAnalysis') {
    group = 'verification'
    description = 'Validates the JDK 25 Class-File API bytecode verifier manifest and wiring.'
    doLast {
        def rows = delosLoadJdk25ClassFileVerifierRows()
        def failures = []
        def ids = [] as Set
        def categories = [] as Set

        if (rows.size() < 20) {
            failures << 'JDK 25 class-file verifier manifest must contain at least 20 rows; found ' + rows.size()
        }

        rows.each { row ->
            if (!ids.add(row.id)) {
                failures << 'Duplicate JDK 25 class-file verifier manifest id: ' + row.id
            }
            categories.add(row.category)
            def proofFile = new File(delosRepositoryRoot, row.path)
            if (!proofFile.exists()) {
                failures << 'JDK 25 class-file verifier proof path does not exist for ' + row.id + ': ' + row.path
                return
            }
            def body = proofFile.getText('UTF-8')
            if (!body.contains(row.marker)) {
                failures << 'JDK 25 class-file verifier marker missing for ' + row.id + ': ' + row.marker
            }
            if (row.risk.length() < 85) {
                failures << 'JDK 25 class-file verifier risk is too thin for ' + row.id
            }
        }

        [
                'BUILD_TOOL',
                'BUILD_TOOL_WIRING',
                'ROOT_TASK',
                'DOCUMENTATION',
                'STATIC_GATE',
                'ALGORITHM_INVENTORY_LINK',
                'NO_BEHAVIOR_CHANGE'
        ].each { category ->
            if (!categories.contains(category)) {
                failures << 'JDK 25 class-file verifier manifest missing category: ' + category
            }
        }

        def verifierText = new File(delosRepositoryRoot, 'delosdb-buildtools/src/main/java/org/apache/derbyBuild/DelosJdk25ClassFileVerifier.java').getText('UTF-8')
        [
                'import java.lang.classfile.ClassFile;',
                'import java.lang.classfile.ClassModel;',
                'ClassFile.of()',
                'classFile.parse',
                'model.majorVersion()',
                'model.minorVersion()',
                'No class files were found in verifier roots'
        ].each { markerText ->
            if (!verifierText.contains(markerText)) {
                failures << 'Verifier source missing marker: ' + markerText
            }
        }
        ['org.objectweb.asm', 'jdk.internal', 'sun.misc.Unsafe'].each { forbidden ->
            if (verifierText.contains(forbidden)) {
                failures << 'Verifier source must not depend on forbidden API: ' + forbidden
            }
        }

        def buildToolsText = new File(delosRepositoryRoot, 'delosdb-buildtools/build.gradle').getText('UTF-8')
        if (!buildToolsText.contains('DelosJdk25ClassFileVerifier.java')) {
            failures << 'Build-tools source include list must include DelosJdk25ClassFileVerifier.java'
        }

        def rootBuildText = new File(delosRepositoryRoot, 'build.gradle').getText('UTF-8')
        [
                "tasks.register('delosJdk25ClassFileBytecodeVerifier'",
                'org.gradle.api.tasks.JavaExec',
                'org.apache.derbyBuild.DelosJdk25ClassFileVerifier',
                'javaRelease + 44',
                'moduleNames.engine',
                'moduleNames.server',
                'reports/delosdb/jdk25-classfile-bytecode-verifier.txt'
        ].each { markerText ->
            if (!rootBuildText.contains(markerText)) {
                failures << 'Root build missing JDK 25 verifier marker: ' + markerText
            }
        }

        def docsText = new File(delosRepositoryRoot, 'docs/JDK25-CLASSFILE-BYTECODE-VERIFIER.md').getText('UTF-8')
        [
                'This is a verifier artifact, not a bytecode-generation rewrite.',
                'ASM remains the production generator.',
                'No ASM removal.',
                'No generated SQL execution behavior change.',
                'No S0 wiring yet.',
                'java.lang.classfile.ClassFile',
                'Expected class-file major',
                '69',
                'build/reports/delosdb/jdk25-classfile-bytecode-verifier.txt'
        ].each { markerText ->
            if (!docsText.contains(markerText)) {
                failures << 'JDK 25 class-file verifier documentation missing marker: ' + markerText
            }
        }

        def inventoryText = new File(delosRepositoryRoot, 'docs/ALGORITHM-INVENTORY.md').getText('UTF-8')
        [
                'JDK 25 Class-File API verifier update',
                'JDK 25 java.lang.classfile.ClassFile',
                './gradlew delosJdk25ClassFileBytecodeVerifier',
                'ASM remains the production generator.'
        ].each { markerText ->
            if (!inventoryText.contains(markerText)) {
                failures << 'Algorithm inventory missing JDK 25 class-file verifier marker: ' + markerText
            }
        }

        def staticText = new File(delosRepositoryRoot, 'gradle/delosdb-storage-static-analysis.gradle').getText('UTF-8')
        def s0Index = staticText.lastIndexOf("tasks.register('s0CloseoutVerification')")
        if (s0Index >= 0) {
            def s0Section = staticText.substring(s0Index)
            if (s0Section.contains('delosJdk25ClassFileBytecodeVerifier')
                    || s0Section.contains('delosJdk25ClassFileBytecodeVerifierStaticAnalysis')) {
                failures << 'JDK 25 class-file verifier tasks must remain outside S0 until the verifier lane is proven stable'
            }
        }

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/jdk25-classfile-bytecode-verifier-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB JDK 25 Class-File API verifier static analysis')
            writer.println('============================================================')
            writer.println()
            writer.println('Rows: ' + rows.size())
            writer.println('Categories: ' + categories.sort().join(', '))
            writer.println()
            rows.each { row ->
                writer.println(row.id + ' [' + row.category + '] ' + row.path)
                writer.println('  marker: ' + row.marker)
                writer.println('  risk: ' + row.risk)
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB JDK 25 Class-File API verifier static analysis failed. Report: ' + reportFile)
        }
        println 'DelosDB JDK 25 Class-File API verifier static analysis passed. Report: ' + reportFile
    }
}



