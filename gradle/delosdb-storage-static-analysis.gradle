                    'testCrashBeforeRawCommitPreservesReservedIdentityGaps',
                    'testCountersAreDatabaseScopedAndUseTheMemoryRawStore'
            ].each { methodName ->
                if (!identityTestText.contains(methodName)) {
                    failures << 'Database-wide MVCC identity proof is missing: ' + methodName
                }
