                failures << 'delosdb-tests must expose runDelosMvccRawStoreDatabaseIdentityTest'
            }

            requireTokens('Updated isolated-format implementation record', implementationText, [
                    'database-wide RawStore metadata container',
                    'The opt-in format now uses one database-wide RawStore metadata container for durable',
                    '`MvccTransactionId`',
                    '`MvccCommitSequence`',
                    'numeric gaps are allowed but identity reuse is not'
            ])
            requireTokens('Database-wide identity design record', identityDesignText, [
                    'one database-wide RawStore metadata container',
                    'nested top transaction',
                    'RawStore commit record',
                    'jdbc:derby:memory:',
                    ':delosdb-tests:runDelosMvccRawStoreDatabaseIdentityTest',
                    'delosMvccRawStoreDatabaseIdentityStaticAnalysis'
            ])
        }

        def reportFile = layout.buildDirectory
                .file('reports/delosdb/mvcc-raw-store-database-identity-static-analysis.txt')
                .get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB RawStore database-wide MVCC identity static analysis')
            writer.println('================================================================')
            writer.println()
            writer.println('Rule: durable MVCC transaction IDs, commit sequences, and committed high-water are allocated and persisted by the database RawStore.')
            writer.println()
