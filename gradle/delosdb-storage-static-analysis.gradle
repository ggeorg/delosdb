        delosRuntimeArtifactModelRequire(failures, runtimeText.contains('project.ext.delosdbAssembledJarTaskPaths'),
                'Root :jars task must be derived from ext.delosdbAssembledJarTaskPaths')

        ['storageMvcc', 'delosdb-storage-mvcc', 'delosDbStorageMvccJar', 'delosdb-storage-mvcc.jar'].each { token ->
            delosRuntimeArtifactModelRequire(failures, runtimeText.contains(token),
                    "Runtime artifact convention script must model MVCC provider artifact token: ${token}")
        }
        ['delosdb-storage-api.jar', 'delosdb-derby-store-api.jar'].each { token ->
            delosRuntimeArtifactModelRequire(failures, runtimeText.contains(token),
                    "Runtime artifact convention script must keep support artifact modeled outside the runtime jar list: ${token}")
        }

        delosRuntimeArtifactModelRequire(failures, runtimeText.contains("tasks.register('verifyDelosRuntimeStorageProviders')"),
                'Runtime artifact convention script must register verifyDelosRuntimeStorageProviders')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains("dependsOn 'jars'"),
                'verifyDelosRuntimeStorageProviders must depend on root :jars')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains('ServiceLoader.load'),
