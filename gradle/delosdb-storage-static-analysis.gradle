            writer.println()
            delosExternalValidationSpecs.each { spec ->
                def configured = delosExternalValidationConfiguredCommand(spec)
                writer.println(spec.id + ' [' + spec.category + ']')
                writer.println('  root task: ' + spec.taskName)
                writer.println('  command property: -P' + spec.propertyName + '="<command>"')
                writer.println('  built-in baseline: ' + spec.builtInTask)
                writer.println('  status: ' + (configured == null ? 'not configured' : 'configured'))
                if (configured != null) {
                    writer.println('  command: ' + configured)
                }
                writer.println('  reason: ' + spec.reason)
                writer.println()
            }
            writer.println('Aggregate task: delosExternalMvccValidation')
            writer.println('S0 boundary: external validation remains opt-in and is not wired into s0CloseoutVerification.')
        }
