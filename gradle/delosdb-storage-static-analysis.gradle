        rows.each { row ->
            if (!ids.add(row.id)) {
                failures << 'Duplicate NULL key proof row id: ' + row.id
            }
            categories << row.category
            def target = file(row.path)
            if (!target.exists()) {
                failures << 'NULL key proof target missing: ' + row.path
            } else {
                def text = target.getText('UTF-8')
                if (!text.contains(row.marker)) {
                    failures << row.id + ' marker not found in ' + row.path + ': ' + row.marker
                }
            }
        }
        requiredCategories.each { category ->
            if (!categories.contains(category)) {
                failures << 'Missing NULL key proof category: ' + category
            }
        }

        def proofDoc = file('docs/MVCC-ORDERED-INDEX-NULL-KEY-PROOF.md').getText('UTF-8')
        [
                'SQL NULL values are encoded as the typed `DOK1|N|` ordered-index envelope.',
                'Do not make `IS NULL` rely on a new optimizer path in this slice.',
                'Do not weaken `MvccInheritedRowCodec` or allow arbitrary Java object storage.',
                './gradlew delosMvccOrderedIndexNullKeyProofStaticAnalysis'
        ].each { markerText ->
            if (!proofDoc.contains(markerText)) {
                failures << 'NULL key proof documentation missing marker: ' + markerText
            }
        }

        def durableTest = file('delosdb-storage-mvcc/src/test/java/io/github/ggeorg/delosdb/storage/mvcc/durable/MvccOrderedIndexPageStoreTest.java').getText('UTF-8')
        [
                'typedNullEnvelopeSortsBeforeTypedValuesAndSupportsLookup',
                'DOK1|N|',
                'rowIdsFor(1, "DOK1|N|")',
                'rowIdsInRangeFor(1, "DOK1|N|", true, "DOK1|I|5", true)'
        ].each { markerText ->
            if (!durableTest.contains(markerText)) {
                failures << 'Durable ordered-index NULL proof missing marker: ' + markerText
            }
        }

        def sqlTest = file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccSqlTypedOrderedIndexKeyTest.java').getText('UTF-8')
        [
                'testNullValuesKeepTypedOrderedIndexKeySemanticsThroughReopen',
                'where n is null order by id',
                'containsOrderedIndexSummary',
                'non-null typed range should still use ordered pages after NULL-key rebuild',
                'NULL-key rebuild must not force ordered-index fallback for supported typed ranges'
        ].each { markerText ->
            if (!sqlTest.contains(markerText)) {
                failures << 'SQL ordered-index NULL proof missing marker: ' + markerText
            }
        }
        if (sqlTest.contains('java.io.Serializable') || sqlTest.contains('ObjectInputStream')) {
            failures << 'SQL NULL key proof must not introduce generic Java object serialization'
        }

        def typedKey = file('delosdb-storage-api/src/main/java/org/apache/derby/iapi/store/types/DelosStorageOrderedIndexKey.java').getText('UTF-8')
        if (!typedKey.contains('return encodeNull();') || !typedKey.contains("NULL('N', 0)")) {
            failures << 'Typed ordered-index key API must keep stable NULL envelope markers'
        }

        def staticText = file('gradle/delosdb-storage-static-analysis.gradle').getText('UTF-8')
        def s0Index = staticText.lastIndexOf("tasks.register('s0CloseoutVerification')")
        if (s0Index >= 0) {
            def s0Section = staticText.substring(s0Index)
            if (s0Section.contains('delosMvccOrderedIndexNullKeyProofStaticAnalysis')) {
                failures << 'MVCC ordered-index NULL key proof gate must remain outside S0 until the proof is stable'
            }
        }

        def reportFile = layout.buildDirectory.file('reports/delosdb/mvcc-ordered-index-null-key-proof-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB MVCC ordered-index NULL key proof static analysis')
            writer.println('============================================================')
            writer.println()
            writer.println('Rows: ' + rows.size())
            writer.println('Categories: ' + categories.sort().join(', '))
            writer.println()
            rows.each { row ->
                writer.println(row.id + ' [' + row.category + '] ' + row.path)
                writer.println('  marker: ' + row.marker)
                writer.println('  reference: ' + row.reference)
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB MVCC ordered-index NULL key proof static analysis failed. Report: ' + reportFile)
        }
        println 'DelosDB MVCC ordered-index NULL key proof static analysis passed. Report: ' + reportFile
    }
}

tasks.register('delosJmhStorageBenchmarkAdapter') {
    group = 'verification'
    description = 'Validates the opt-in JMH storage benchmark adapter and optionally runs -Pdelosdb.jmh.storage.command.'
    dependsOn ':delosdb-storage-mvcc:runDelosMvccMicrobenchmarkValidation'
    doLast {
        def benchmarkRoot = file('benchmarks/jmh/delosdb-storage-mvcc')
        def benchmarkSourceRoot = file('benchmarks/jmh/delosdb-storage-mvcc/src/main/java')
        def benchmarkFiles = [
                file('benchmarks/jmh/delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/durable/DelosMvccPageCodecBenchmark.java'),
                file('benchmarks/jmh/delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/durable/DelosMvccOrderedIndexBenchmark.java'),
                file('benchmarks/jmh/delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/durable/DelosMvccBufferCacheBenchmark.java')
        ]
        def failures = []
        if (!benchmarkRoot.isDirectory()) {
            failures << 'Missing JMH benchmark root: ' + benchmarkRoot
        }
        if (!benchmarkSourceRoot.isDirectory()) {
            failures << 'Missing JMH benchmark source root: ' + benchmarkSourceRoot
        }
        benchmarkFiles.each { sourceFile ->
            if (!sourceFile.exists()) {
                failures << 'Missing JMH benchmark source: ' + sourceFile
                return
            }
            def text = sourceFile.getText('UTF-8')
            ['org.openjdk.jmh.annotations.Benchmark', '@Benchmark', '@State', '@Warmup', '@Measurement'].each { marker ->
                if (!text.contains(marker)) {
                    failures << 'JMH benchmark source ' + sourceFile + ' missing marker: ' + marker
                }
            }
        }

        def docsText = file('benchmarks/jmh/delosdb-storage-mvcc/README.md').exists()
                ? file('benchmarks/jmh/delosdb-storage-mvcc/README.md').getText('UTF-8')
                : ''
        ['delosJmhStorageBenchmarkAdapter', 'delosdb.jmh.storage.command', 'DelosMvccPageCodecBenchmark',
         'DelosMvccOrderedIndexBenchmark', 'DelosMvccBufferCacheBenchmark'].each { marker ->
            if (!docsText.contains(marker)) {
                failures << 'JMH storage benchmark README missing marker: ' + marker
            }
        }

        def reportFile = layout.buildDirectory.file('reports/delosdb/jmh-storage-benchmark-adapter.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB JMH storage benchmark adapter')
            writer.println('====================================')
            writer.println()
            writer.println('Benchmark root: ' + benchmarkRoot)
            writer.println('Benchmark sources:')
            benchmarkFiles.each { writer.println('  - ' + it) }
            writer.println()
            writer.println('Built-in baseline task: :delosdb-storage-mvcc:runDelosMvccMicrobenchmarkValidation')
            writer.println('External command property: delosdb.jmh.storage.command')
            writer.println('External command configured: ' + (providers.gradleProperty('delosdb.jmh.storage.command').orNull != null))
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB JMH storage benchmark adapter validation failed. Report: ' + reportFile)
        }
        if (providers.gradleProperty('delosdb.jmh.storage.command').orNull != null) {
            delosRunExternalValidationCommand('delosdb.jmh.storage.command', 'delosJmhStorageBenchmarkAdapter')
        }
        println 'DelosDB JMH storage benchmark adapter passed. Report: ' + reportFile
    }
}

