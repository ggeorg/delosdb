            def testsBuildText = testsBuildFile.getText('UTF-8')
            def implementationText = implementationFile.getText('UTF-8')
            def identityDesignText = identityDesignFile.getText('UTF-8')

            def requireTokens = { String description, String source, List<String> tokens ->
                tokens.each { token ->
                    if (!source.contains(token)) {
                        failures << description + ' is missing token: ' + token
                    }
                }
            }
            def requireOrdered = { String description, String source, List<String> tokens ->
                int previous = -1
                tokens.each { token ->
                    int current = source.indexOf(token)
                    if (current < 0) {
                        failures << description + ' is missing token: ' + token
                    } else if (current <= previous) {
                        failures << description + ' has incorrect ordering at token: ' + token
                    }
                    previous = current
                }
            }
            def section = { String source, String start, String end, String description ->
                int startIndex = source.indexOf(start)
                int endIndex = startIndex < 0 ? -1 : source.indexOf(end, startIndex + start.length())
                if (startIndex < 0 || endIndex < 0) {
                    failures << 'Could not isolate ' + description
                    return ''
                }
                source.substring(startIndex, endIndex)
            }

            requireTokens('Database-wide RawStore metadata', metadataText, [
                    'delosdb.mvcc.rawStore.databaseMetadataContainerId',
                    'NEXT_TRANSACTION_ID_FIELD',
                    'NEXT_COMMIT_SEQUENCE_FIELD',
                    'COMMITTED_HIGH_WATER_FIELD',
                    'startNestedTopTransaction()',
                    'nested.commit()',
                    'nested.getLogFactory().flush(commitInstant)',
                    'stageCommittedHighWater('
            ])
