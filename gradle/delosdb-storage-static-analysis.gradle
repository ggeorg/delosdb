                failures << 'Stale Stage 8.5 runtime test wiring remains: ' + stale
            }
        }

        ['removed from the v1 runtime by Stage 8.7.2',
         'REMOVE_NATIVE_PAGE_IO_MIRROR_FROM_V1_RAWSTORE'].each { token ->
            if (!text.design.contains(token)) {
                failures << 'Stage 8.5 final decision design is missing: ' + token
            }
        }
        ['KEEP_POSITIONAL_BYTE_ARRAY',
         'REMOVE_NATIVE_PAGE_IO_MIRROR_FROM_V1_RAWSTORE',
         'schema version 3'].each { token ->
            if (!text.decision.contains(token)) {
                failures << 'Page-I/O representation decision is missing: ' + token
            }
        }
        if (!text.handoff.contains(
                'Stage 8.5 bounded native RawStore page-I/O mirror proof:               VERIFIED / REMOVED FROM V1 RUNTIME')) {
            failures << 'Session handoff does not record the Stage 8.5 removal'
        }

        def foreignMemorySites = []
        DelosDbStaticAnalysisSupport.javaSources(
                delosRepositoryRoot, delosHeapCompatibilityStaticSourceRoots).each { sourceFile ->
            sourceFile.readLines('UTF-8').eachWithIndex { line, index ->
                if (line.contains('java.lang.foreign.')) {
                    foreignMemorySites << sourceFile.name + ':' + (index + 1)
                }
            }
        }
        if (!foreignMemorySites.isEmpty()) {
            failures << 'Foreign-memory API remains in production inherited RawStore sources: '
                    + foreignMemorySites
        }

        def s0 = staticText.substring(staticText.lastIndexOf("tasks.register('s0CloseoutVerification')"))
        if (!s0.contains("'delosSharedRawStoreNativeMemoryPageBufferStaticAnalysis'")) {
            failures << 'S0 must include the Stage 8.5 final-decision gate'
        }

        def reportFile = layout.buildDirectory.file(
                'reports/delosdb/shared-rawstore-native-memory-page-buffer-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB shared RawStore native-memory final-decision static analysis')
            writer.println('===================================================================')
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'Shared RawStore native-memory final-decision static analysis failed. Report: '
                            + reportFile)
        }
        logger.lifecycle(
                'Shared RawStore native-memory final-decision static analysis passed. Report: {}',
                reportFile)
    }
}

tasks.register('delosSharedRawStoreMappedRegionDecisionStaticAnalysis') {
    group = 'verification'
    description = 'Protects the Stage 8.6 segmented mapped-region experiment and NO_GO_FOR_V1_RAWSTORE production decision.'

    def stage86Files = [
            storageRandomAccess: file('delosdb-runtime-api/src/main/java/org/apache/derby/io/StorageRandomAccessFile.java'),
            directoryFile     : file('delosdb-engine/src/main/java/org/apache/derby/impl/io/DirRandomAccessFile.java'),
            cachedPage        : file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/raw/data/CachedPage.java'),
            rafContainer      : file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/raw/data/RAFContainer.java'),
            rafContainer4     : file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/raw/data/RAFContainer4.java'),
            focusedTest       : file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/SharedRawStoreMappedRegionExperimentTest.java'),
            testBuild         : file('delosdb-tests/build.gradle'),
            design            : file('docs/design/V1-JDK25-SEGMENTED-MAPPED-REGION-DECISION.md'),
            roadmap           : file('.delosdb-v1/03-roadmap/09-PHASE-9-RAWSTORE-CONVERGENCE.md'),
            handoff           : file('.delosdb-v1/NEW-SESSION-README.md')
    ]
    def stage86ProductionSources = files(
            fileTree('delosdb-runtime-api/src/main/java/org/apache/derby/io') {
                include '**/*.java'
            },
            fileTree('delosdb-engine/src/main/java/org/apache/derby/impl/io') {
                include '**/*.java'
            },
            fileTree('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/raw') {
                include '**/*.java'
            })
    inputs.files(stage86Files.values())
    inputs.files(stage86ProductionSources)
    inputs.file(file('gradle/delosdb-storage-static-analysis.gradle'))
    outputs.file(layout.buildDirectory.file(
            'reports/delosdb/shared-rawstore-mapped-region-decision-static-analysis.txt'))

    doLast {
        def failures = []
        def text = stage86Files.collectEntries { key, sourceFile ->
            if (!sourceFile.exists()) {
                failures << 'Stage 8.6 file is missing: ' + sourceFile
                [(key): '']
            } else {
                [(key): sourceFile.getText('UTF-8')]
            }
        }
        def staticText = file('gradle/delosdb-storage-static-analysis.gradle').getText('UTF-8')

        ['SharedRawStoreMappedRegionExperimentTest',
         'FileChannel.MapMode', 'channel.map(', 'MapMode.READ_WRITE',
         'Arena.ofShared()', 'region.isMapped()', 'region.force()',
         'an existing mapping has fixed spatial bounds',
         'closing the arena must end mapped-segment access',
         'MemorySegment.class.getMethod("force", boolean.class)',
         'NO_GO_FOR_V1_RAWSTORE', 'sha256(',
         'Timing is diagnostic only; no pass/fail threshold is used.'].each { token ->
            if (!text.focusedTest.contains(token)) failures << 'Stage 8.6 mapped experiment is missing: ' + token
        }
        ['testSegmentedMappingsPreserveAbsolutePageImagesAndChannelPosition',
         'testFileGrowthRequiresAnotherMappingAndClosedArenasEndAccess',
         'testMappedForceCannotExpressTheRawStoreMetadataChoice',
         'testRepresentativePageWorkloadProducesEquivalentStateEvidence'].each { token ->
            if (!text.focusedTest.contains(token)) failures << 'Stage 8.6 focused proof is missing: ' + token
        }
        ["'runDelosSharedRawStoreMappedRegionExperimentTest'",
         'SharedRawStoreMappedRegionExperimentTest.class',
         'delosdb.stage86.report',
         'stage8.6-mapped-region-experiment.txt',
         "dependsOn tasks.named('runDelosSharedRawStoreMappedRegionExperimentTest')"].each { token ->
            if (!text.testBuild.contains(token)) failures << 'Stage 8.6 test wiring is missing: ' + token
        }

        stage86ProductionSources.files.sort { it.path }.each { sourceFile ->
            def productionText = sourceFile.getText('UTF-8')
            ['FileChannel.MapMode', 'MapMode.READ_WRITE', 'MapMode.READ_ONLY',
             'channel.map(', 'MappedRegionTable', 'isMapped()'].each { forbidden ->
                if (productionText.contains(forbidden)) {
                    failures << 'Mapped-region code entered production RawStore source '
                            + sourceFile + ': ' + forbidden
                }
            }
        }

        ['Status: Stage 8.6 verified.',
         'NO_GO_FOR_V1_RAWSTORE', 'Durability contract mismatch',
         'Fault and diagnostics boundary mismatch',
         'File-growth and region lifecycle cost',
         'No page-authority simplification',
         'no FileChannel.map call in production RawStore code',
         'runDelosSharedRawStoreMappedRegionExperimentTest',
         'delosSharedRawStoreMappedRegionDecisionStaticAnalysis'].each { token ->
            if (!text.design.contains(token)) failures << 'Stage 8.6 design is missing: ' + token
        }
        def stage86RoadmapStart = text.roadmap.indexOf(
                '## Stage 8.6 — segmented mapped-region experiment and production decision')
        def stage871RoadmapStart = text.roadmap.indexOf(
                '## Stage 8.7.1 — production closeout lifecycle and API simplification')
        def stage872RoadmapStart = text.roadmap.indexOf(
                '## Stage 8.7.2 — page-I/O representation closeout')
        def stage9RoadmapStart = text.roadmap.indexOf('# Stage 9 — Lucene 10 foundation')
        if (stage86RoadmapStart < 0
                || stage871RoadmapStart <= stage86RoadmapStart
                || stage872RoadmapStart <= stage871RoadmapStart
                || stage9RoadmapStart <= stage872RoadmapStart) {
            failures << 'Roadmap does not preserve the Stage 8.6, 8.7.1, 8.7.2, and Stage 9 ordering'
        } else {
            def stage86Roadmap = text.roadmap.substring(stage86RoadmapStart, stage871RoadmapStart)
            ['Stage 8.6 is verified together with every Stage 8.1–8.5 focused and normal gate.',
             'NO_GO_FOR_V1_RAWSTORE',
             'delosSharedRawStoreMappedRegionDecisionStaticAnalysis'].each { token ->
                if (!stage86Roadmap.contains(token)) {
                    failures << 'Verified Stage 8.6 roadmap section is missing: ' + token
                }
            }
            if (stage86Roadmap.contains('PENDING USER VERIFICATION')
                    || stage86Roadmap.contains('IMPLEMENTED / VERIFY')) {
                failures << 'Verified Stage 8.6 roadmap section still contains a pending status'
            }

            def stage871Roadmap = text.roadmap.substring(stage871RoadmapStart, stage872RoadmapStart)
            if (!stage871Roadmap.contains('VERIFIED')
                    || stage871Roadmap.contains('PENDING USER VERIFICATION')) {
                failures << 'Stage 8.7.1 roadmap section must be verified'
            }

            def stage872Roadmap = text.roadmap.substring(stage872RoadmapStart, stage9RoadmapStart)
            if (!stage872Roadmap.contains('IMPLEMENTED / PENDING USER VERIFICATION')) {
                failures << 'Stage 8.7.2 roadmap section must remain pending until representation closeout verification completes'
            }
        }

        def stage86HandoffLine = text.handoff.readLines().find {
            it.startsWith('Stage 8.6 segmented mapped-region experiment and v1 no-go decision:')
        }
        if (stage86HandoffLine == null || !stage86HandoffLine.endsWith('VERIFIED')) {
            failures << 'Session handoff does not mark Stage 8.6 verified'
        }
        if (!text.handoff.contains('Frozen final page-I/O decisions:')
                || !text.handoff.contains('NO_GO_FOR_V1_RAWSTORE')) {
            failures << 'Session handoff does not preserve the frozen mapped RawStore no-go decision'
        }

        def s0 = staticText.substring(staticText.lastIndexOf("tasks.register('s0CloseoutVerification')"))
        if (!s0.contains("'delosSharedRawStoreMappedRegionDecisionStaticAnalysis'")) {
            failures << 'S0 must include the Stage 8.6 mapped-region decision gate'
        }

        def reportFile = layout.buildDirectory.file(
                'reports/delosdb/shared-rawstore-mapped-region-decision-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB shared RawStore mapped-region decision static analysis')
            writer.println('================================================================')
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) throw new GradleException(
                'Shared RawStore mapped-region decision static analysis failed. Report: ' + reportFile)
        logger.lifecycle('Shared RawStore mapped-region decision static analysis passed. Report: {}', reportFile)
    }
}


