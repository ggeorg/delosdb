                    'registerWriteIntent(',
                    'heapDCOCI = tc.getDynamicCompiledConglomInfo'
            ])
            requireTokens('Provider-neutral heap/MVCC classification', dmlText, [
                    'boolean mvcc =',
                    'tc,',
                    'mvcc,',
                    'tc.isGlobal()'
            ])

            def rawOwnedSection = section(registryText,
                    'public static synchronized void registerRawStoreOwnedMvcc(',
                    '/** Register provider lifecycle work',
                    'RawStore-owned registration section')
            requireTokens('RawStore-owned MVCC transition boundary', rawOwnedSection, [
                    'writersFor(requiredOwner).isEmpty()',
                    'lifecycleActionsFor(requiredOwner).isEmpty()',
                    'RAW_STORE_OWNED_MVCC.put(requiredOwner, Boolean.TRUE)'
            ])
            if (rawOwnedSection.contains('heapWrite')) {
                failures << 'RawStore-owned MVCC registration must not reject inherited heap writes'
            }

            def decisionSection = section(registryText,
                    'public static synchronized boolean requiresRawStoreDecision(',
                    'public static synchronized void registerRawStoreOwnedMvcc(',
                    'external decision requirement section')
            requireTokens('Retained external decision boundary', decisionSection, [
                    'writersFor(ownerTransaction)',
                    'lifecycleActionsFor(ownerTransaction)'
            ])
            if (decisionSection.contains('RAW_STORE_OWNED_MVCC')
                    || decisionSection.contains('heapWrite')) {
                failures << 'Heap plus RawStore-owned MVCC must not enter the retained external decision coordinator'
            }

            def commitSection = section(ramTransactionText,
                    'public void commit()',
                    'public DatabaseInstant commitNoSync',
                    'RAMTransaction synchronized commit section')
            requireOrdered('One inherited RawStore commit ordering', commitSection, [
                    'notifyBeforeCommit(lifecycles, mode)',
                    'rawtran.commit()',
                    'notifyAfterCommit(lifecycles, mode, null)'
