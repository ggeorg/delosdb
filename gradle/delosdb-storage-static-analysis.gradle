                    'malformed enable values remain disabled',
                    'oldest queued age',
                    'published MvccCommitSequence high-water',
                    'versioned immutable',
                    'weak path lookup',
                    ':delosdb-tests:runDelosMvccRawStoreMaintenanceDiagnosticsTest',
                    'delosMvccRawStoreMaintenanceDiagnosticsStaticAnalysis'
            ])
            requireTokens('Current isolated-format implementation record', implementationText, [
                    'Database-owned automatic maintenance and immutable diagnostics',
                    ':delosdb-tests:runDelosMvccRawStoreMaintenanceDiagnosticsTest',
                    'delosMvccRawStoreMaintenanceDiagnosticsStaticAnalysis'
            ])
            requireTokens('Vacuum remains a separate authority-free algorithm', vacuumDesignText, [
                    'V1-RAWSTORE-MVCC-MAINTENANCE-DIAGNOSTICS.md'
            ])

            [serviceText, runtimeText, contextText, tableText, vacuumText].each { productionText ->
                ['java.nio.file.Path', 'java.nio.file.Files', 'FileChannel', 'RandomAccessFile',
                 'DriverManager', 'jdbc:derby:', 'DelosPageVolume'].each { token ->
                    if (productionText.contains(token)) {
                        failures << 'RawStore MVCC maintenance production code contains forbidden authority token: ' + token
                    }
                }
            }
        }

        def reportFile = layout.buildDirectory
                .file('reports/delosdb/mvcc-raw-store-maintenance-diagnostics-static-analysis.txt')
                .get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('RawStore MVCC maintenance and diagnostics static analysis')
            writer.println('==========================================================')
            writer.println()
            writer.println('Rule: automatic reclamation is one bounded database-owned scheduler over the proven RawStore vacuum, with immutable non-owning horizon/queue evidence.')
            writer.println()
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'RawStore MVCC maintenance and diagnostics static analysis failed. Report: '
                            + reportFile)
        }
        logger.lifecycle(
                'RawStore MVCC maintenance and diagnostics static analysis passed. Report: {}',
                reportFile)
    }
}

