                    'Status: closed green.',
                    'Phase H — Attribute-level MVCC overflow storage',
                    'Status: closed green.',
                    'Phase I — MVCC subsystem recovery records',
                    'small attributes remain inline',
                    'large attributes spill through attribute-level overflow descriptors',
                    'overflow chains validate missing, extra, wrong-size, or wrong-order chunks',
                    'large-value update, delete, vacuum, and reopen paths remain correct',
                    'provider-neutral diagnostics expose attribute-overflow counters and byte summaries',
                    'MVCC capability metadata reports attribute-overflow support without optimizer consumption',
                    'inherited heap compatibility paths'
            ].each { markerText ->
                if (!roadmapText.contains(markerText)) {
                    failures << 'Storage roadmap is missing MVCC attribute-overflow marker: ' + markerText
                }
            }
        }

        def reportFile = layout.buildDirectory.file('reports/delosdb/mvcc-attribute-overflow-storage-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB MVCC attribute-overflow storage static analysis')
            writer.println('=======================================================')
            writer.println()
            writer.println('Proof rows: ' + rows.size() + ' engineering rows from ' + rows.size() + ' manifest rows')
            writer.println()
            delosMvccAttributeOverflowStorageContracts.sort().each { contract ->
                writer.println('  ' + contract + ': ' + rows.count { it.contract == contract })
            }
            writer.println()
            rows.each { row ->
                writer.println(row.id + ' [' + row.contract + '] ' + row.path)
                writer.println('  marker: ' + row.marker)
                writer.println('  reason: ' + row.reason)
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('MVCC attribute-overflow storage proof points validated.')
            } else {
                writer.println('Validation failures:')
                failures.each { failure -> writer.println('  - ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('MVCC attribute-overflow storage static analysis failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB MVCC attribute-overflow storage static analysis passed. Report: {}', reportFile)
    }
}


def delosMvccSubsystemRecoveryRecordsFile = file('gradle/static-analysis/delosdb-mvcc-subsystem-recovery-records.txt')

def delosMvccSubsystemRecoveryRecordsContracts = [
        'RECOVERY_RECORD_STORE',
        'ROW_PAGE_REDO_METADATA',
        'INDEX_PAGE_REDO_METADATA',
        'OVERFLOW_PAGE_REDO_METADATA',
