            }
        }

        def profileText = readFile(new File(delosRepositoryRoot, 'benchmarks/sqlancer/delosdb-mvcc/delosdb-mvcc-profile.properties'))
        ['DELOSDB_SQLANCER_PROFILE_SKELETON', 'storage.provider=delos_mvcc',
