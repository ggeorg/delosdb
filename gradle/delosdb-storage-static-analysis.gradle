def delosMvccCandidateIndexAuthorityJavaSources = {
    delosMvccCandidateIndexAuthorityAuditRoots.collect { file(it) }
            .findAll { it.exists() }
            .collectMany { root -> fileTree(root) { include '**/*.java' }.files }
            .sort { a, b -> a.path <=> b.path }
}

def delosMvccCandidateIndexAuthorityMentions = {
    def mentions = []
    delosMvccCandidateIndexAuthorityJavaSources().each { sourceFile ->
        def relativePath = rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separatorChar, '/' as char)
        def lines = sourceFile.readLines('UTF-8')
        lines.eachWithIndex { String line, int index ->
            def matched = delosMvccCandidateIndexAuthorityPatterns.findAll { pattern -> line.contains(pattern) }
            if (!matched.isEmpty()) {
                mentions << [
                        path       : relativePath,
                        lineNumber : index + 1,
                        normalized : delosStorageNormalize(line),
                        patterns   : matched
                ]
            }
        }
    }
    mentions
}

tasks.register('delosMvccCandidateIndexAuthorityAuditStaticAnalysis') {
    group = 'verification'
    description = 'Validates classification of remaining MVCC candidate-index authority, fallback, diagnostics, and stale-name paths.'

    inputs.file(delosMvccCandidateIndexAuthorityAuditFile)
    inputs.files(delosMvccCandidateIndexAuthorityJavaSources())
    outputs.file(layout.buildDirectory.file('reports/delosdb/mvcc-candidate-index-authority-audit.txt'))

    doLast {
        def rows = delosLoadMvccCandidateIndexAuthorityRows()
        def mentions = delosMvccCandidateIndexAuthorityMentions()
        def activePaths = mentions.collect { it.path }.toSet()
        def rowsByPath = rows.groupBy { it.path }
        def failures = []
        def ids = [] as Set
        def paths = [] as Set

        rows.each { row ->
            if (!ids.add(row.id)) {
                failures << 'Duplicate MVCC candidate-index authority audit id: ' + row.id
            }
            if (!paths.add(row.path)) {
                failures << 'Duplicate MVCC candidate-index authority audit path: ' + row.path
            }
            if (!file(row.path).exists()) {
                failures << 'Classified MVCC candidate-index path does not exist: ' + row.path
            }
            if (row.reason.length() < 24) {
                failures << 'Classification reason is too thin for ' + row.id
            }
            if (row.nextAction.length() < 12) {
                failures << 'Classification next action is too thin for ' + row.id
            }
            if (!activePaths.contains(row.path)) {
                failures << 'Stale MVCC candidate-index authority classification with no active mention: ' + row.path
            }
        }

        activePaths.sort().each { activePath ->
            if (!rowsByPath.containsKey(activePath)) {
                failures << 'Unclassified MVCC candidate-index authority path: ' + activePath
            }
        }

        def roadmap = file('docs/STORAGE-ROADMAP.md')
        if (!roadmap.exists()) {
            failures << 'Missing storage roadmap documenting Cycle 0 MVCC candidate-index authority audit'
        } else {
            def roadmapText = roadmap.getText('UTF-8')
            [
                    'MVCC candidate-index authority audit',
                    'NORMAL_SQL_AUTHORITY',
                    'EXPLICIT_FALLBACK',
                    'DIAGNOSTIC_PARITY',
                    'STALE_CANDIDATE'
            ].each { marker ->
                if (!roadmapText.contains(marker)) {
                    failures << 'Storage roadmap is missing MVCC candidate-index authority audit marker: ' + marker
                }
            }
        }

        def reportFile = layout.buildDirectory.file('reports/delosdb/mvcc-candidate-index-authority-audit.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB MVCC candidate-index authority audit')
            writer.println('================================================')
            writer.println()
            writer.println('Rows: ' + rows.size())
            writer.println('Active source paths with candidate-index authority mentions: ' + activePaths.size())
            writer.println('Mention count: ' + mentions.size())
            writer.println()
            delosMvccCandidateIndexAuthorityDecisions.sort().each { decision ->
                writer.println('  ' + decision + ': ' + rows.count { it.decision == decision })
            }
            writer.println()
            rows.each { row ->
                writer.println(row.id + ' [' + row.decision + '] ' + row.path)
                writer.println('  surface:     ' + row.surface)
                writer.println('  reason:      ' + row.reason)
                writer.println('  next action: ' + row.nextAction)
                writer.println()
            }
            writer.println('Active mentions by classified path:')
            rows.each { row ->
                def rowMentions = mentions.findAll { it.path == row.path }
                writer.println('  - ' + row.path + ' [' + row.decision + '] mentions=' + rowMentions.size())
                rowMentions.take(5).each { mention ->
                    writer.println('      ' + mention.lineNumber + ': ' + mention.normalized)
                }
                if (rowMentions.size() > 5) {
                    writer.println('      ... ' + (rowMentions.size() - 5) + ' more mention(s) omitted')
                }
            }
            writer.println()
            if (failures.isEmpty()) {
                writer.println('MVCC candidate-index authority classifications validated.')
            } else {
                writer.println('Validation failures:')
                failures.each { failure -> writer.println('  - ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('MVCC candidate-index authority audit static analysis failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB MVCC candidate-index authority audit static analysis passed. Report: {}', reportFile)
    }
}


