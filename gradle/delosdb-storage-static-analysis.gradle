            requireTokens('Retained-snapshot pruning rule', vacuumText, [
                    'retainedForHorizon(',
                    'version.beginSequence() > oldestVisibleThrough',
                    'oldestVisibleThrough < version.endSequence()',
                    '!visibleAtHorizon.tombstone()',
                    'MvccRawStoreFormat.NO_PREVIOUS_VERSION'
            ])
            requireTokens('Logged logical relinking and physical reclamation', vacuumText, [
                    'VERSION_PREVIOUS_VERSION_ID',
                    'versionHintPageField(',
                    'versionHintRecordField(',
                    'DIRECTORY_HEAD_VERSION_ID',
                    'DIRECTORY_HEAD_HINT_PAGE',
