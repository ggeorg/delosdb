tasks.register('delosMvccRetainedRuntimeRetirementStaticAnalysis') {
    group = 'verification'
    description = 'Verifies complete repository retirement of the Phase 8 MVCC oracle after RawStore convergence.'

    def required = [
            file('delosdb-storage-mvcc/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccConglomerateFactory.java'),
            file('delosdb-storage-mvcc/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccConglomerate.java'),
            file('delosdb-storage-mvcc/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccStorageDiagnostics.java'),
            file('delosdb-storage-mvcc/build.gradle'),
            file('gradle/delosdb-runtime-artifacts.gradle'),
            file('delosdb-engine/build.gradle'),
            file('delosdb-engine/src/main/java/module-info.java'),
            file('delosdb-tests/build.gradle'),
            file('docs/design/V1-RAWSTORE-MVCC-RETAINED-RUNTIME-RETIREMENT.md'),
            file('.delosdb-v1/03-roadmap/09-PHASE-9-RAWSTORE-CONVERGENCE.md'),
            file('settings.gradle')
    ]
    def removedRoots = [
            file('delosdb-storage-mvcc/src/main/java/io'),
            file('delosdb-storage-mvcc/src/test'),
            file('benchmarks/jcstress/delosdb-storage-mvcc')
    ]
    inputs.files(required)
    inputs.files(removedRoots)
    inputs.file(file('gradle/delosdb-storage-static-analysis.gradle'))
    outputs.file(layout.buildDirectory.file('reports/delosdb/mvcc-retained-runtime-retirement-static-analysis.txt'))

    doLast {
        def failures = []
        required.each { if (!it.isFile()) failures << 'Missing required source: ' + it }
        removedRoots.findAll { it.exists() }.each {
            failures << 'Retired Phase 8 oracle root remains in the repository: ' + it
        }
        if (failures.isEmpty()) {
            def factory = required[0].getText('UTF-8')
            def conglomerate = required[1].getText('UTF-8')
            def diagnostics = required[2].getText('UTF-8')
            def mvccBuild = required[3].getText('UTF-8')
            def artifacts = required[4].getText('UTF-8')
            def engineBuild = required[5].getText('UTF-8')
            def moduleInfo = required[6].getText('UTF-8')
            def testsBuild = required[7].getText('UTF-8')
            def design = required[8].getText('UTF-8')
            def roadmap = required[9].getText('UTF-8')
            def settings = required[10].getText('UTF-8')
            def staticText = file('gradle/delosdb-storage-static-analysis.gradle').getText('UTF-8')

            if (!factory.contains('new MvccRawStoreRuntime(')
                    || factory.count('new MvccRawStoreRuntime(') != 1
                    || factory.contains('MvccRawStoreFormat.ENABLED_PROPERTY')
                    || factory.contains('new MvccDatabaseRuntime(')
                    || factory.contains('DelosStorageStore')) {
                failures << 'Factory must expose one unconditional RawStore runtime and no retained branch'
            }
            ['MvccDatabaseRuntime', 'MvccConglomerateState', 'MvccConglomerateController',
             'MvccScanController', 'MvccConglomerateLifecycleAction'].each { token ->
                if (conglomerate.contains(token)) failures << 'Active conglomerate retains retired production token: ' + token
            }
            if (diagnostics.contains('MvccDatabaseRuntime')
                    || diagnostics.contains('MvccRuntimeDiagnosticsDirectory')
                    || !diagnostics.contains('Retained delos_mvcc database-storage diagnostics were retired')) {
                failures << 'Active diagnostics must observe only RawStore and reject retained database snapshots'
            }
            if (!mvccBuild.contains("include 'org/apache/derby/impl/store/access/mvcc/**/*.java'")
                    || !mvccBuild.contains("tasks.register('compileStorageMvcc')")
                    || mvccBuild.contains('legacyRetained')
                    || mvccBuild.contains('compileLegacyRetained')
                    || mvccBuild.contains('verifyRetainedOracleQuarantine')
                    || mvccBuild.contains("tasks.register('runMvcc")
                    || mvccBuild.contains('org.gradle.api.tasks.testing.Test')
                    || mvccBuild.readLines().size() > 140) {
                failures << 'MVCC build must describe one compact production source set and no retained proof machinery'
            }
            if (mvccBuild.contains("project(':delosdb-storage-io')")) {
                failures << 'The production MVCC module must not depend on the retired page-volume module'
            }
            def runtimeSection = artifacts.substring(artifacts.indexOf('ext.delosdbRuntimeJarArtifacts = ['),
                    artifacts.indexOf('ext.delosdbAssembledSupportJarArtifacts = ['))
            def supportSection = artifacts.substring(artifacts.indexOf('ext.delosdbAssembledSupportJarArtifacts = ['),
                    artifacts.indexOf('ext.delosdbAssembledJarArtifacts'))
            if (runtimeSection.contains('delosdb-storage-mvcc.jar')
                    || runtimeSection.contains('delosdb-storage-io.jar')
                    || !supportSection.contains('delosdb-storage-mvcc.jar')
                    || supportSection.contains('delosdb-storage-io.jar')) {
                failures << 'Runtime artifact model must publish only the production MVCC patch artifact'
            }
            if (!engineBuild.contains("project(path: ':delosdb-storage-mvcc', configuration: 'derbyRuntimePatchElements')")
                    || engineBuild.contains(':delosdb-storage-bridge:')) {
                failures << 'derby.jar must consume the production MVCC patch artifact directly'
            }
            if (settings.contains("include 'delosdb-storage-bridge'")
                    || new File(delosRepositoryRoot, 'delosdb-storage-bridge').exists()) {
                failures << 'The retired storage-bridge module must be absent'
            }
            if (moduleInfo.contains('uses org.apache.derby.iapi.store.types.DelosStorageProviderFactory')) {
                failures << 'module-info must not discover the retired external provider'
            }
            [':delosdb-storage-mvcc:runMvcc', 'legacyRetainedCheck',
             'runDelosMvccBufferCacheBenchmark', 'runDelosMvccPageCodecBenchmark'].each { stale ->
                if (testsBuild.contains(stale)) {
                    failures << 'Normal SQL and baseline tests retain an archived-oracle task reference: ' + stale
                }
            }
            ['runDelosMvccRawStoreVerticalSliceTest',
             'runDelosMvccRawStoreDecisionWalCrashTest',
             'runDelosHeapMvccDifferentialSqlHarnessTest'].each { current ->
                if (!testsBuild.contains(current)) {
                    failures << 'Current RawStore MVCC proof wiring is missing: ' + current
                }
            }
            def s0 = staticText.substring(staticText.lastIndexOf("tasks.register('s0CloseoutVerification')"))
            if (!s0.contains("'delosMvccRetainedRuntimeRetirementStaticAnalysis'")) {
                failures << 'S0 must include the retained-runtime retirement gate'
            }
            ['source archive deleted', 'Git history', '20 production Java classes',
             'no retained source set'].each { token ->
                if (!design.contains(token)) failures << 'Retirement design is missing: ' + token
            }
            ['## Stage 8.7.3 — retained-oracle and diagnostics maintainability closeout',
             'REMOVE_RETAINED_PHASE8_ORACLE'].each { token ->
                if (!roadmap.contains(token)) failures << 'Roadmap is missing Stage 8.7.3 token: ' + token
            }
        }
        def reportFile = layout.buildDirectory.file('reports/delosdb/mvcc-retained-runtime-retirement-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB retained MVCC source-oracle retirement static analysis')
            writer.println('===============================================================')
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) throw new GradleException('Retained MVCC source-oracle retirement static analysis failed. Report: ' + reportFile)
        logger.lifecycle('Retained MVCC source-oracle retirement static analysis passed. Report: {}', reportFile)
    }
}

