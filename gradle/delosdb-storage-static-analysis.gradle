                    'purgeConglomerate(xactManager, rawtran)'
            ])

            requireOrdered('Transactional relink-before-purge protocol',
                    section(vacuumText, 'static Result vacuum(', 'private static VacuumPlan plan(',
                            'RawStore MVCC vacuum mutation section'),
                    ['plan(', 'if (!plan.mutated())', 'rewriteRetainedLinks(', 'rewriteRetainedHeads(',
                     'purgeVersions(', 'purgeDirectories('])
            requireTokens('Fail-closed logical-chain validation', vacuumText, [
                    'duplicate MvccVersionId',
                    'cycle in logical version chain',
                    'missing predecessor version',
                    'cross-row predecessor',
                    'version belongs to multiple directory chains',
                    'orphan version records',
                    'invalid predecessor ordering',
                    'unsupported directory format version',
                    'unsupported version format version'
            ])
            requireTokens('Retained-snapshot pruning rule', vacuumText, [
                    'retainedForHorizon(',
                    'version.beginSequence() > oldestVisibleThrough',
                    'oldestVisibleThrough < version.endSequence()',
                    '!visibleAtHorizon.tombstone()',
                    'MvccRawStoreFormat.NO_PREVIOUS_VERSION'
            ])
            requireTokens('Logged logical relinking and physical reclamation', vacuumText, [
                    'VERSION_PREVIOUS_VERSION_ID',
                    'versionHintPageField(',
                    'versionHintRecordField(',
                    'DIRECTORY_HEAD_VERSION_ID',
                    'DIRECTORY_HEAD_HINT_PAGE',
                    'DIRECTORY_HEAD_HINT_RECORD',
