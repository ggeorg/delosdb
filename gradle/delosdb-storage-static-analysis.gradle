                failures << 'delosdb-tests must expose runDelosMvccRawStoreDatabaseIdentityTest'
            }

            requireTokens('Updated isolated-format implementation record', implementationText, [
                    'database-wide RawStore metadata container',
                    'The opt-in format now uses one database-wide RawStore metadata container for durable',
                    '`MvccTransactionId`',
                    '`MvccCommitSequence`',
                    'numeric gaps are allowed but identity reuse is not'
            ])
            requireTokens('Database-wide identity design record', identityDesignText, [
                    'one database-wide RawStore metadata container',
                    'nested top transaction',
