import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.util.regex.Pattern

class DelosDbStaticFileSupport {
    static List<File> javaFiles(Collection<File> roots) {
        roots.findAll { it.isDirectory() }.collectMany { File root ->
            def files = []
            Files.walk(root.toPath()).withCloseable { stream ->
                stream.filter { path -> Files.isRegularFile(path) && path.fileName.toString().endsWith('.java') }
                        .forEach { path -> files << path.toFile() }
            }
            files
        }.sort { left, right -> left.path <=> right.path }
    }

    static List<File> workspaceMetadataFiles(File root) {
        def files = []
        Files.walk(root.toPath()).withCloseable { stream ->
            stream.filter { path -> Files.isRegularFile(path) }.forEach { path ->
                def relative = root.toPath().relativize(path)
                def segments = relative.collect { it.toString() }
                def name = path.fileName.toString()
                if (!segments.contains('.git') && !segments.contains('build') && !segments.contains('.gradle')
                        && (name == '.DS_Store' || name.startsWith('._') || segments.contains('__MACOSX'))) {
                    files << path.toFile()
                }
            }
        }
        files.sort { left, right -> left.path <=> right.path }
    }

    static List<File> objectInputStreamSources(File root) {
        def files = []
        Files.walk(root.toPath()).withCloseable { stream ->
            stream.filter { path -> Files.isRegularFile(path) && path.fileName.toString().endsWith('.java') }
                    .forEach { path -> files << path.toFile() }
        }
        files.sort { left, right -> left.path <=> right.path }
    }
}
class DelosDbStaticAnalysisSupport {
    static String relativePath(File repositoryRoot, File sourceFile) {
        repositoryRoot.toPath().relativize(sourceFile.toPath()).toString().replace(File.separatorChar, '/' as char)
    }

    static String normalize(String line) {
        line == null ? '' : line.trim().replaceAll(/\s+/, ' ')
    }

    static List<String> codeLinesWithoutComments(List<String> lines) {
        def codeLines = []
        boolean inBlockComment = false
        lines.each { String rawLine ->
            def code = new StringBuilder()
            int offset = 0
            while (offset < rawLine.length()) {
                if (inBlockComment) {
                    int end = rawLine.indexOf('*/', offset)
                    if (end < 0) {
                        offset = rawLine.length()
                    } else {
                        inBlockComment = false
                        offset = end + 2
                    }
                } else {
                    int blockStart = rawLine.indexOf('/*', offset)
                    int lineStart = rawLine.indexOf('//', offset)
                    if (lineStart >= 0 && (blockStart < 0 || lineStart < blockStart)) {
                        code.append(rawLine.substring(offset, lineStart))
                        offset = rawLine.length()
                    } else if (blockStart >= 0) {
                        code.append(rawLine.substring(offset, blockStart))
                        inBlockComment = true
                        offset = blockStart + 2
                    } else {
                        code.append(rawLine.substring(offset))
                        offset = rawLine.length()
                    }
                }
            }
            codeLines << code.toString()
        }
        codeLines
    }

    static String importTarget(String line) {
        def matcher = line =~ /^\s*import\s+(?:static\s+)?([^;]+);/
        matcher.find() ? matcher.group(1) : null
    }

    static boolean isMvccPath(String relativePath, String layer) {
        relativePath.startsWith('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/' + layer + '/')
    }

    static boolean isMvccImport(String importTarget, String layer) {
        importTarget != null && importTarget.startsWith('io.github.ggeorg.delosdb.storage.mvcc.' + layer + '.')
    }

    static Map finding(File repositoryRoot, String rule, File sourceFile, int lineNumber, String line) {
        def relative = relativePath(repositoryRoot, sourceFile)
        [
                rule      : rule,
                path      : relative,
                lineNumber: lineNumber,
                line      : line,
                normalized: normalize(line),
                key       : rule + '|' + relative + '|' + normalize(line)
        ]
    }

    static List<File> javaSources(File repositoryRoot, Collection<String> sourceRoots) {
        sourceRoots.collect { new File(repositoryRoot, it) }
                .findAll { it.exists() }
                .collectMany { root -> DelosDbStaticFileSupport.javaFiles([root]) }
                .sort { left, right -> left.path <=> right.path }
    }

    static Set<String> loadBaseline(File baselineFile) {
        if (!baselineFile.exists()) {
            return [] as Set
        }
        baselineFile.readLines('UTF-8')
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') }
                .toSet()
    }

    static List<Map> storageFindings(File repositoryRoot, Collection<String> sourceRoots) {
        def findings = []
        javaSources(repositoryRoot, sourceRoots).each { sourceFile ->
            def relative = relativePath(repositoryRoot, sourceFile)
            def lines = sourceFile.readLines('UTF-8')
            lines.eachWithIndex { String line, int index ->
                int lineNumber = index + 1
                // Catching an optional platform capability is not an unsupported storage path.
                if (line =~ /\bthrow\s+new\s+(?:[A-Za-z_$][\w$]*\.)*UnsupportedOperationException\s*\(/) {
                    findings << finding(repositoryRoot, 'STORAGE_UNSUPPORTED_OPERATION', sourceFile, lineNumber, line)
                }
                if (line.contains('TODO') || line.contains('FIXME') || line.contains('HACK')) {
                    findings << finding(repositoryRoot, 'STORAGE_TODO_MARKER', sourceFile, lineNumber, line)
                }
                if (line.contains('System.out.') || line.contains('System.err.')) {
                    findings << finding(repositoryRoot, 'STORAGE_STDOUT_STDERR', sourceFile, lineNumber, line)
                }
                if (relative.startsWith('delosdb-storage-mvcc/') && line.contains('io.github.ggeorg.delosdb.spi.storage.versioned')) {
                    findings << finding(repositoryRoot, 'MVCC_LEGACY_VERSIONED_SPI_IMPORT', sourceFile, lineNumber, line)
                }
                if (relative.startsWith('delosdb-storage-mvcc/')
                        && (line.contains('ObjectInputStream') || line.contains('ObjectOutputStream'))) {
                    findings << finding(repositoryRoot, 'MVCC_JAVA_OBJECT_STREAM', sourceFile, lineNumber, line)
                }

                def importedType = importTarget(line)
                if (importedType != null) {
                    if (isMvccPath(relative, 'format')
                            && (importedType.startsWith('org.apache.derby.')
                            || importedType.startsWith('java.sql.')
                            || isMvccImport(importedType, 'bridge')
                            || isMvccImport(importedType, 'durable')
                            || isMvccImport(importedType, 'store'))) {
                        findings << finding(repositoryRoot, 'MVCC_FORMAT_LAYER_DEPENDENCY', sourceFile, lineNumber, line)
                    }
                    if ((isMvccPath(relative, 'durable') || isMvccPath(relative, 'store'))
                            && (importedType.startsWith('org.apache.derby.')
                            || importedType.startsWith('java.sql.')
                            || isMvccImport(importedType, 'bridge'))) {
                        findings << finding(repositoryRoot, 'MVCC_DURABLE_LAYER_DEPENDENCY', sourceFile, lineNumber, line)
                    }
                }

                if (line.contains('Thread.sleep(')) {
                    findings << finding(repositoryRoot, 'STORAGE_THREAD_SLEEP', sourceFile, lineNumber, line)
                }
                if (line.contains('System.exit(')) {
                    findings << finding(repositoryRoot, 'STORAGE_SYSTEM_EXIT', sourceFile, lineNumber, line)
                }
                if (line.contains('printStackTrace(')) {
                    findings << finding(repositoryRoot, 'STORAGE_PRINT_STACK_TRACE', sourceFile, lineNumber, line)
                }
                if (line.contains('new Thread(')) {
                    findings << finding(repositoryRoot, 'STORAGE_RAW_THREAD', sourceFile, lineNumber, line)
                }
                if (line.contains('.wait(') || line.contains('.notify(') || line.contains('.notifyAll(')) {
                    findings << finding(repositoryRoot, 'STORAGE_WAIT_NOTIFY', sourceFile, lineNumber, line)
                }
            }
        }
        findings
    }

    static List<Map> serverFindings(File repositoryRoot, Collection<String> sourceRoots) {
        def findings = []
        def netServletPath = 'delosdb-server/src/main/java/org/apache/derby/drda/NetServlet.java'
        javaSources(repositoryRoot, sourceRoots).each { sourceFile ->
            def relative = relativePath(repositoryRoot, sourceFile)
            def lines = sourceFile.readLines('UTF-8')
            lines.eachWithIndex { String line, int index ->
                int lineNumber = index + 1
                def importedType = importTarget(line)
                if (importedType != null) {
                    if (importedType.startsWith('org.apache.lucene.') || importedType.startsWith('org.json.simple.')) {
                        findings << finding(repositoryRoot, 'SERVER_UNUSED_LEGACY_LIBRARY_IMPORT', sourceFile, lineNumber, line)
                    }
                    if (importedType.startsWith('io.github.ggeorg.delosdb.storage.mvcc.')) {
                        findings << finding(repositoryRoot, 'SERVER_MVCC_IMPLEMENTATION_IMPORT', sourceFile, lineNumber, line)
                    }
                    if ((importedType.startsWith('javax.servlet.') || importedType.startsWith('jakarta.servlet.'))
                            && relative != netServletPath) {
                        findings << finding(repositoryRoot, 'SERVER_SERVLET_DEPENDENCY', sourceFile, lineNumber, line)
                    }
                }
            }
            if (relative == 'delosdb-server/src/main/java/org/apache/derby/impl/drda/DRDAConnThread.java') {
                lines.eachWithIndex { String line, int index ->
                    if (line.contains('PublicBufferOutputStream') || line.contains('OOMEs for large values')) {
                        findings << finding(repositoryRoot, 'SERVER_EXTDTA_HEAP_BUFFERING', sourceFile, index + 1, line)
                    }
                }
            }
            if (lines.any { it.contains('"delos.drda.') }
                    && relative != 'delosdb-server/src/main/java/org/apache/derby/impl/drda/DrdaServerConfiguration.java') {
                lines.eachWithIndex { String line, int index ->
                    if (line.contains('"delos.drda.')) {
                        findings << finding(repositoryRoot, 'SERVER_SCATTERED_DELOS_DRDA_PROPERTY', sourceFile, index + 1, line)
                    }
                }
            }
            if ((lines.any { it.contains('Thread.ofVirtual(') || it.contains('newVirtualThreadPerTaskExecutor(') })
                    && relative != 'delosdb-server/src/main/java/org/apache/derby/impl/drda/DrdaThreading.java') {
                lines.eachWithIndex { String line, int index ->
                    if (line.contains('Thread.ofVirtual(') || line.contains('newVirtualThreadPerTaskExecutor(')) {
                        findings << finding(repositoryRoot, 'SERVER_SCATTERED_VIRTUAL_THREAD_FACTORY', sourceFile, index + 1, line)
                    }
                }
            }
            lines.eachWithIndex { String line, int index ->
                if ((line.contains('System.gc(')
                        || line.contains('Runtime.getRuntime().gc(')
                        || line.contains('.gc();')
                        || line.contains('.gc()'))
                        && !line.trim().startsWith('//')) {
                    findings << finding(repositoryRoot, 'SERVER_FORCED_GC', sourceFile, index + 1, line)
                }
            }
        }
        findings
    }

    static List<Map> loadHeapStdoutClassifications(File classificationFile, Set<String> decisions) {
        if (!classificationFile.exists()) {
            return []
        }
        def rows = []
        int lineNumber = 0
        classificationFile.readLines('UTF-8').each { String rawLine ->
            lineNumber++
            def line = rawLine.trim()
            if (!line || line.startsWith('#')) {
                return
            }
            def parts = line.split('\\|', -1).collect { it.trim() }
            if (parts.size() != 5) {
                throw new org.gradle.api.GradleException('Malformed heap stdout/stderr classification line ' + lineNumber + ': expected 5 pipe-delimited fields')
            }
            if (!decisions.contains(parts[1])) {
                throw new org.gradle.api.GradleException('Malformed heap stdout/stderr classification line ' + lineNumber + ': unknown decision ' + parts[1])
            }
            rows << [
                    id        : parts[0],
                    decision  : parts[1],
                    path      : parts[2],
                    normalized: normalize(parts[3]),
                    reason    : parts[4],
                    lineNumber: lineNumber,
                    key       : parts[2] + '|' + normalize(parts[3])
            ]
        }
        rows
    }

    static List<Map> heapCompatibilityFindings(File repositoryRoot, Collection<String> sourceRoots) {
        def findings = []
        javaSources(repositoryRoot, sourceRoots).each { sourceFile ->
            def lines = sourceFile.readLines('UTF-8')
            lines.eachWithIndex { String line, int index ->
                int lineNumber = index + 1
                def importedType = importTarget(line)
                if (importedType != null) {
                    if (importedType.startsWith('io.github.ggeorg.delosdb.storage.mvcc.')) {
                        findings << finding(repositoryRoot, 'HEAP_MVCC_IMPLEMENTATION_IMPORT', sourceFile, lineNumber, line)
                    }
                    if (importedType.startsWith('io.github.ggeorg.delosdb.spi.storage.versioned.')) {
                        findings << finding(repositoryRoot, 'HEAP_VERSIONED_QUARANTINE_IMPORT', sourceFile, lineNumber, line)
                    }
                    if (importedType.startsWith('org.apache.derby.impl.drda.')
                            || importedType.startsWith('org.apache.derby.drda.')
                            || importedType.startsWith('javax.servlet.')
                            || importedType.startsWith('jakarta.servlet.')) {
                        findings << finding(repositoryRoot, 'HEAP_SERVER_OR_DRDA_DEPENDENCY', sourceFile, lineNumber, line)
                    }
                    if (importedType.startsWith('java.lang.foreign.')) {
                        findings << finding(repositoryRoot, 'HEAP_FOREIGN_MEMORY_API', sourceFile, lineNumber, line)
                    }
                }
                if (line.contains('ObjectInputStream') || line.contains('ObjectOutputStream')) {
                    findings << finding(repositoryRoot, 'HEAP_OBJECT_STREAM_SITE', sourceFile, lineNumber, line)
                }
                if (line.contains('java.lang.foreign.')) {
                    findings << finding(repositoryRoot, 'HEAP_FOREIGN_MEMORY_API', sourceFile, lineNumber, line)
                }
            }
        }
        findings
    }

    static List<Map> heapStdoutFindings(File repositoryRoot, Collection<String> sourceRoots) {
        def findings = []
        javaSources(repositoryRoot, sourceRoots).each { sourceFile ->
            def codeLines = codeLinesWithoutComments(sourceFile.readLines('UTF-8'))
            codeLines.eachWithIndex { String codeLine, int index ->
                if (codeLine.contains('System.out.') || codeLine.contains('System.err.')) {
                    findings << finding(repositoryRoot, 'HEAP_STDOUT_STDERR_SITE', sourceFile, index + 1, codeLine)
                }
            }
        }
        findings
    }

    static void require(List<String> failures, boolean condition, String message) {
        if (!condition) {
            failures << message
        }
    }

    static List<Map> loadHeapRawStoreDuplicateClassifications(File classificationFile, Set<String> decisions) {
        if (!classificationFile.exists()) {
            return []
        }
        def rows = []
        int lineNumber = 0
        classificationFile.readLines('UTF-8').each { rawLine ->
            lineNumber++
            def line = rawLine.trim()
            if (!line || line.startsWith('#')) {
                return
            }
            def parts = line.split('\\|', -1).collect { it.trim() }
            if (parts.size() != 6) {
                throw new org.gradle.api.GradleException('Malformed heap/raw-store duplicate classification line ' + lineNumber + ': expected 6 pipe-delimited fields')
            }
            if (!decisions.contains(parts[1])) {
                throw new org.gradle.api.GradleException('Malformed heap/raw-store duplicate classification line ' + lineNumber + ': unknown decision ' + parts[1])
            }
            def files = parts[3].split(',').collect { it.trim() }.findAll { it }
            if (files.isEmpty()) {
                throw new org.gradle.api.GradleException('Malformed heap/raw-store duplicate classification line ' + lineNumber + ': no files listed')
            }
            rows << [id: parts[0], decision: parts[1], scope: parts[2], files: files,
                     reason: parts[4], nextAction: parts[5], lineNumber: lineNumber]
        }
        rows
    }

    static List<Map> loadDerbyModuleParityRows(File classificationFile, Set<String> decisions) {
        if (!classificationFile.exists()) {
            throw new org.gradle.api.GradleException('Missing Derby module parity classification file: ' + classificationFile)
        }
        def rows = []
        int lineNumber = 0
        classificationFile.readLines('UTF-8').each { rawLine ->
            lineNumber++
            def line = rawLine.trim()
            if (!line || line.startsWith('#')) {
                return
            }
            def parts = line.split('\\|', -1).collect { it.trim() }
            if (parts.size() != 6) {
                throw new org.gradle.api.GradleException('Malformed Derby module parity line ' + lineNumber + ': expected 6 pipe-delimited fields')
            }
            if (!decisions.contains(parts[1])) {
                throw new org.gradle.api.GradleException('Malformed Derby module parity line ' + lineNumber + ': unknown decision ' + parts[1])
            }
            if (!parts[3].startsWith(':delosdb-')) {
                throw new org.gradle.api.GradleException('Malformed Derby module parity line ' + lineNumber + ': DelosDB module must be a :delosdb-* project path')
            }
            rows << [id: parts[0], decision: parts[1], derbyRoot: parts[2], delosModule: parts[3],
                     artifactRole: parts[4], reason: parts[5], lineNumber: lineNumber]
        }
        rows
    }

    static List<File> overlayCleanupScriptCandidates(File repositoryRoot, Collection<Pattern> patterns) {
        def scriptsDir = new File(repositoryRoot, 'scripts')
        if (!scriptsDir.isDirectory()) {
            return []
        }
        scriptsDir.listFiles()
                .findAll { File candidate -> candidate.isFile() }
                .findAll { File candidate -> patterns.any { pattern -> candidate.name ==~ pattern } }
                .sort { File left, File right -> left.name <=> right.name }
    }

    static List<String> nonHeaderRows(File tsvFile) {
        if (!tsvFile.isFile()) {
            return ['<missing report file: ' + tsvFile + '>']
        }
        def lines = tsvFile.readLines('UTF-8')
        if (lines.isEmpty()) {
            return ['<empty report file: ' + tsvFile + '>']
        }
        lines.drop(1).findAll { it.trim() }
    }

    static List<Map> loadDerbyForkDiffRows(File classificationFile, Set<String> decisions) {
        if (!classificationFile.exists()) {
            throw new org.gradle.api.GradleException('Missing Derby fork-diff classification file: ' + classificationFile)
        }
        def rows = []
        int lineNumber = 0
        classificationFile.readLines('UTF-8').each { rawLine ->
            lineNumber++
            def line = rawLine.trim()
            if (!line || line.startsWith('#')) {
                return
            }
            def parts = line.split('\\|', -1).collect { it.trim() }
            if (parts.size() != 6) {
                throw new org.gradle.api.GradleException('Malformed Derby fork-diff classification line ' + lineNumber + ': expected 6 pipe-delimited fields')
            }
            if (!decisions.contains(parts[1])) {
                throw new org.gradle.api.GradleException('Malformed Derby fork-diff classification line ' + lineNumber + ': unknown decision ' + parts[1])
            }
            if (!parts[2].endsWith('.java')) {
                throw new org.gradle.api.GradleException('Malformed Derby fork-diff classification line ' + lineNumber + ': path must be a Java source file')
            }
            rows << [id: parts[0], decision: parts[1], path: parts[2], surface: parts[3],
                     reason: parts[4], nextAction: parts[5], lineNumber: lineNumber]
        }
        rows
    }
}

def delosRepositoryRoot = rootProject.projectDir
def delosBuildRoot = layout.buildDirectory.get().asFile

/*
 * DelosDB-owned storage/MVCC static-analysis gate.
 *
 * This intentionally scopes analysis to DelosDB-owned storage modules and the
 * Derby storage API fork seam. It does not scan the entire inherited Derby tree.
 */

def delosStorageStaticSourceRoots = [
        'delosdb-storage-api/src/main/java',
        'delosdb-storage-io/src/main/java',
        'delosdb-storage-mvcc/src/main/java',
        'delosdb-storage-bridge/src/main/java',
        'delosdb-derby-store-api/src/main/java'
]

def delosStorageStaticBaselineFile = new File(delosRepositoryRoot, 'gradle/static-analysis/delosdb-storage-baseline.txt')

tasks.register('delosStorageStaticAnalysis') {
    group = 'verification'
    description = 'Runs scoped static analysis over DelosDB-owned storage/MVCC modules.'

    inputs.files(DelosDbStaticAnalysisSupport.javaSources(delosRepositoryRoot, delosStorageStaticSourceRoots))
    inputs.file(delosStorageStaticBaselineFile).optional()
    outputs.file(layout.buildDirectory.file('reports/delosdb/storage-static-analysis.txt'))

    doLast {
        def baseline = DelosDbStaticAnalysisSupport.loadBaseline(delosStorageStaticBaselineFile)
        def findings = DelosDbStaticAnalysisSupport.storageFindings(delosRepositoryRoot, delosStorageStaticSourceRoots)
        def newFindings = findings.findAll { !baseline.contains(it.key) }

        def synchronizedCount = 0
        DelosDbStaticAnalysisSupport.javaSources(delosRepositoryRoot, delosStorageStaticSourceRoots).each { sourceFile ->
            sourceFile.eachLine('UTF-8') { line ->
                if (line =~ /\bsynchronized\b/) {
                    synchronizedCount++
                }
            }
        }

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/storage-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB scoped storage/MVCC static analysis')
            writer.println('================================================')
            writer.println('Source roots:')
            delosStorageStaticSourceRoots.each { writer.println('  - ' + it) }
            writer.println()
            writer.println('Total findings: ' + findings.size())
            writer.println('New findings:   ' + newFindings.size())
            writer.println('synchronized references measured: ' + synchronizedCount)
            writer.println()

            if (newFindings.isEmpty()) {
                writer.println('No new findings outside baseline.')
            } else {
                writer.println('New findings outside baseline:')
                newFindings.each { finding ->
                    writer.println("${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}")
                }
            }

            writer.println()
            writer.println('All findings:')
            findings.each { finding ->
                writer.println("${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}")
            }
        }

        if (!newFindings.isEmpty()) {
            def preview = newFindings.take(20).collect { finding ->
                "${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}"
            }.join(System.lineSeparator())
            throw new GradleException(
                    'DelosDB storage static analysis found ' + newFindings.size() +
                            ' new finding(s) outside baseline. Report: ' + reportFile +
                            System.lineSeparator() + preview)
        }

        logger.lifecycle('DelosDB storage static analysis passed. Report: {}', reportFile)
    }
}


def delosServerStaticSourceRoots = [
        'delosdb-server/src/main/java'
]

tasks.register('delosServerStaticAnalysis') {
    group = 'verification'
    description = 'Runs scoped static analysis over the DelosDB network server module.'

    inputs.files(DelosDbStaticAnalysisSupport.javaSources(delosRepositoryRoot, delosServerStaticSourceRoots))
    outputs.file(layout.buildDirectory.file('reports/delosdb/server-static-analysis.txt'))

    doLast {
        def findings = DelosDbStaticAnalysisSupport.serverFindings(delosRepositoryRoot, delosServerStaticSourceRoots)
        def reportFile = new File(delosBuildRoot, 'reports/delosdb/server-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB scoped server static analysis')
            writer.println('=====================================')
            writer.println('Source roots:')
            delosServerStaticSourceRoots.each { writer.println('  - ' + it) }
            writer.println()
            writer.println('Total findings: ' + findings.size())
            writer.println()

            if (findings.isEmpty()) {
                writer.println('No server boundary violations found.')
            } else {
                writer.println('Server boundary violations:')
                findings.each { finding ->
                    writer.println("${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}")
                }
            }
        }

        if (!findings.isEmpty()) {
            def preview = findings.take(20).collect { finding ->
                "${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}"
            }.join(System.lineSeparator())
            throw new GradleException(
                    'DelosDB server static analysis found ' + findings.size() +
                            ' server boundary violation(s). Report: ' + reportFile +
                            System.lineSeparator() + preview)
        }

        logger.lifecycle('DelosDB server static analysis passed. Report: {}', reportFile)
    }
}



def delosHeapCompatibilityStaticSourceRoots = [
        'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/heap',
        'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/btree',
        'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/raw'
]

def delosHeapStdoutClassificationFile = new File(delosRepositoryRoot, 'gradle/static-analysis/delosdb-heap-stdout-classification.txt')

def delosHeapStdoutClassificationDecisions = [
        'ALLOW_DEBUG_FLAG',
        'ALLOW_DIAGNOSTIC_ENTRYPOINT',
        'ALLOW_COMPAT_WARNING',
        'ALLOW_EXPLICIT_DUMP_MODE'
] as Set

tasks.register('delosHeapCompatibilityStaticAnalysis') {
    group = 'verification'
    description = 'Protects Derby-compatible heap/raw-store core from MVCC, quarantine, protocol, and foreign-memory drift.'

    inputs.files(DelosDbStaticAnalysisSupport.javaSources(delosRepositoryRoot, delosHeapCompatibilityStaticSourceRoots))
    inputs.file(delosHeapStdoutClassificationFile).optional()
    outputs.file(layout.buildDirectory.file('reports/delosdb/heap-compatibility-static-analysis.txt'))

    doLast {
        def findings = DelosDbStaticAnalysisSupport.heapCompatibilityFindings(delosRepositoryRoot, delosHeapCompatibilityStaticSourceRoots)
        def stdoutFindings = DelosDbStaticAnalysisSupport.heapStdoutFindings(delosRepositoryRoot, delosHeapCompatibilityStaticSourceRoots)
        def stdoutClassifications = DelosDbStaticAnalysisSupport.loadHeapStdoutClassifications(delosHeapStdoutClassificationFile, delosHeapStdoutClassificationDecisions)
        def stdoutClassificationsByKey = stdoutClassifications.groupBy { it.key }
        def stdoutActiveKeys = stdoutFindings.collect { it.path + '|' + it.normalized }.toSet()
        def unclassifiedStdout = stdoutFindings.findAll { !stdoutClassificationsByKey.containsKey(it.path + '|' + it.normalized) }
        def staleStdoutClassifications = stdoutClassifications.findAll { !stdoutActiveKeys.contains(it.key) }
        def duplicateStdoutIds = stdoutClassifications.groupBy { it.id }
                .findAll { ignored, rows -> rows.size() > 1 }
                .keySet()

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/heap-compatibility-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB Derby heap compatibility static analysis')
            writer.println('================================================')
            writer.println('Source roots:')
            delosHeapCompatibilityStaticSourceRoots.each { writer.println('  - ' + it) }
            writer.println()
            writer.println('Boundary findings: ' + findings.size())
            writer.println('Active stdout/stderr sites: ' + stdoutFindings.size())
            writer.println('Classified stdout/stderr sites: ' + stdoutClassifications.size())
            writer.println('Unclassified stdout/stderr sites: ' + unclassifiedStdout.size())
            writer.println('Stale stdout/stderr classifications: ' + staleStdoutClassifications.size())
            writer.println('Duplicate stdout/stderr classification ids: ' + duplicateStdoutIds.size())
            writer.println()

            if (findings.isEmpty()) {
                writer.println('No heap compatibility boundary violations found.')
            } else {
                writer.println('Heap compatibility boundary violations:')
                findings.each { finding ->
                    writer.println("${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}")
                }
            }

            writer.println()
            if (unclassifiedStdout.isEmpty() && staleStdoutClassifications.isEmpty() && duplicateStdoutIds.isEmpty()) {
                writer.println('Heap stdout/stderr classification gate passed.')
            } else {
                writer.println('Heap stdout/stderr classification gate failures:')
                unclassifiedStdout.each { finding ->
                    writer.println("  unclassified ${finding.path}:${finding.lineNumber}: ${finding.normalized}")
                }
                staleStdoutClassifications.each { row ->
                    writer.println("  stale classification ${row.id}: ${row.path}: ${row.normalized}")
                }
                duplicateStdoutIds.each { id ->
                    writer.println('  duplicate classification id: ' + id)
                }
            }

            writer.println()
            writer.println('Classified active stdout/stderr sites:')
            stdoutFindings.each { finding ->
                def key = finding.path + '|' + finding.normalized
                def rows = stdoutClassificationsByKey[key] ?: []
                def decisions = rows.collect { it.id + '/' + it.decision }.join(', ')
                writer.println("${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}" +
                        (decisions ? ' [' + decisions + ']' : ' [UNCLASSIFIED]'))
            }

            writer.println()
            writer.println('Allowed DelosDB compatibility seams are intentionally outside this deny-list gate,')
            writer.println('including provider adapters, cost tuning hooks, and LegacyInternal annotations.')
            writer.println('Inherited Derby stdout/stderr sites must be classified as debug-flagged, diagnostic,')
            writer.println('compatibility warning, or explicit dump-mode output; new unclassified sites fail this gate.')
        }

        if (!findings.isEmpty() || !unclassifiedStdout.isEmpty() || !staleStdoutClassifications.isEmpty() || !duplicateStdoutIds.isEmpty()) {
            def preview = []
            findings.take(20).each { finding ->
                preview << "${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}"
            }
            unclassifiedStdout.take(20).each { finding ->
                preview << "HEAP_UNCLASSIFIED_STDOUT_STDERR ${finding.path}:${finding.lineNumber}: ${finding.normalized}"
            }
            staleStdoutClassifications.take(20).each { row ->
                preview << "HEAP_STALE_STDOUT_STDERR_CLASSIFICATION ${row.id}: ${row.path}: ${row.normalized}"
            }
            duplicateStdoutIds.take(20).each { id ->
                preview << 'HEAP_DUPLICATE_STDOUT_STDERR_CLASSIFICATION_ID ' + id
            }
            throw new GradleException(
                    'DelosDB heap compatibility static analysis found ' +
                            (findings.size() + unclassifiedStdout.size() + staleStdoutClassifications.size() + duplicateStdoutIds.size()) +
                            ' boundary/classification violation(s). Report: ' + reportFile +
                            System.lineSeparator() + preview.join(System.lineSeparator()))
        }

        logger.lifecycle('DelosDB heap compatibility static analysis passed. Report: {}', reportFile)
    }
}


def delosHeapObjectDeserializationFilterStaticFiles = [
        'delosdb-commons/src/main/java/org/apache/derby/shared/common/security/DelosObjectInputFilters.java',
        'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/io/DelosHeapObjectDeserializationFilter.java',
        'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/io/FormatIdInputStream.java',
        'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/io/ApplicationObjectInputStream.java',
        'delosdb-client/src/main/java/org/apache/derby/client/am/Cursor.java',
        'delosdb-server/src/main/java/org/apache/derby/impl/drda/DRDAConnThread.java',
        'delosdb-engine/src/main/java/org/apache/derby/impl/load/ImportAbstract.java',
        'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/replication/net/SocketConnection.java',
        'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/HeapObjectDeserializationFilterTest.java',
        'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/ObjectDeserializationBoundaryTest.java'
]

def delosObjectFilterLeafSites = [
        'delosdb-client/src/main/java/org/apache/derby/client/am/Cursor.java':
                ['client DRDA UDT materialization', 'DelosObjectInputFilters.applyDrdaFilterIfConfigured'],
        'delosdb-server/src/main/java/org/apache/derby/impl/drda/DRDAConnThread.java':
                ['server DRDA UDT parameter materialization', 'DelosObjectInputFilters.applyDrdaFilterIfConfigured'],
        'delosdb-engine/src/main/java/org/apache/derby/impl/load/ImportAbstract.java':
                ['import UDT materialization', 'DelosObjectInputFilters.applyImportFilterIfConfigured'],
        'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/replication/net/SocketConnection.java':
                ['replication control-message stream', 'DelosObjectInputFilters.applyReplicationFilterIfConfigured']
]

tasks.register('delosHeapObjectDeserializationFilterStaticAnalysis') {
    group = 'verification'
    description = 'Protects fail-closed external deserialization boundaries and the separate bounded heap policy.'

    inputs.files(delosHeapObjectDeserializationFilterStaticFiles.collect { new File(delosRepositoryRoot, it) }.findAll { it.exists() }).optional()
    outputs.file(layout.buildDirectory.file('reports/delosdb/heap-object-deserialization-filter-static-analysis.txt'))

    doLast {
        def failures = []
        def objectFilterFile = new File(delosRepositoryRoot, 'delosdb-commons/src/main/java/org/apache/derby/shared/common/security/DelosObjectInputFilters.java')
        def filterFile = new File(delosRepositoryRoot, 'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/io/DelosHeapObjectDeserializationFilter.java')
        def formatIdInputStreamFile = new File(delosRepositoryRoot, 'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/io/FormatIdInputStream.java')
        def applicationObjectInputStreamFile = new File(delosRepositoryRoot, 'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/io/ApplicationObjectInputStream.java')
        def heapTestFile = new File(delosRepositoryRoot, 'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/HeapObjectDeserializationFilterTest.java')
        def boundaryTestFile = new File(delosRepositoryRoot, 'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/ObjectDeserializationBoundaryTest.java')

        delosHeapObjectDeserializationFilterStaticFiles.each { relativePath ->
            DelosDbStaticAnalysisSupport.require(failures, new File(delosRepositoryRoot, relativePath).exists(), 'Missing object deserialization filter file: ' + relativePath)
        }

        def objectFilterText = objectFilterFile.exists() ? objectFilterFile.getText('UTF-8') : ''
        def filterText = filterFile.exists() ? filterFile.getText('UTF-8') : ''
        def formatIdText = formatIdInputStreamFile.exists() ? formatIdInputStreamFile.getText('UTF-8') : ''
        def applicationStreamText = applicationObjectInputStreamFile.exists() ? applicationObjectInputStreamFile.getText('UTF-8') : ''
        def heapTestText = heapTestFile.exists() ? heapTestFile.getText('UTF-8') : ''
        def boundaryTestText = boundaryTestFile.exists() ? boundaryTestFile.getText('UTF-8') : ''

        ['delosdb.objectDeserializationFilter',
         'delosdb.drda.objectDeserializationFilter',
         'delosdb.import.objectDeserializationFilter',
         'delosdb.replication.objectDeserializationFilter',
         'delosdb.heap.objectDeserializationFilter',
         'delosdb.objectDeserializationCompatibilityMode',
         'delosdb.heap.objectDeserializationCompatibilityMode',
         'DEFAULT_EXTERNAL_FILTER_PATTERN',
         'DEFAULT_REPLICATION_FILTER_PATTERN',
         'DEFAULT_HEAP_FILTER_PATTERN',
         'maxdepth=32',
         'maxrefs=100000',
         'maxbytes=16777216',
         'maxarray=100000',
         'org.apache.derby.impl.store.replication.net.ReplicationMessage',
         'java.lang.Long',
         '[B',
         '[Ljava.lang.String;!*',
         'ObjectInputFilter.Config.createFilter',
         'stream.setObjectInputFilter'].each { token ->
            DelosDbStaticAnalysisSupport.require(failures, objectFilterText.contains(token),
                    'Object deserialization policy is missing token: ' + token)
        }
        DelosDbStaticAnalysisSupport.require(failures,
                objectFilterText.contains('DEFAULT_EXTERNAL_FILTER_PATTERN =\n            RESOURCE_LIMIT_PATTERN + ";!*"'),
                'DRDA and import defaults must reject every application class')
        DelosDbStaticAnalysisSupport.require(failures,
                objectFilterText.contains('Boolean.getBoolean(COMPATIBILITY_MODE_PROPERTY)')
                        && objectFilterText.contains('Boolean.getBoolean(HEAP_COMPATIBILITY_MODE_PROPERTY)'),
                'External and heap compatibility modes must remain separate')
        DelosDbStaticAnalysisSupport.require(failures,
                objectFilterText.contains('REPLICATION_FILTER_PROPERTY,\n                null,'),
                'The common UDT allow-list fallback must not widen the replication protocol boundary')
        DelosDbStaticAnalysisSupport.require(failures,
                objectFilterText.indexOf('configuredPattern != null')
                        < objectFilterText.indexOf('Boolean.getBoolean(COMPATIBILITY_MODE_PROPERTY)'),
                'Explicit external filters must take precedence over external compatibility mode')
        DelosDbStaticAnalysisSupport.require(failures,
                objectFilterText.indexOf('configuredPattern != null')
                        < objectFilterText.indexOf('Boolean.getBoolean(HEAP_COMPATIBILITY_MODE_PROPERTY)'),
                'Explicit heap filters must take precedence over heap compatibility mode')
        DelosDbStaticAnalysisSupport.require(failures,
                !objectFilterText.contains('applyGeneralFilterIfConfigured'),
                'The ambiguous general filter installer must not remain in production')

        DelosDbStaticAnalysisSupport.require(failures, filterText.contains('DelosObjectInputFilters.HEAP_FILTER_PROPERTY')
                        && filterText.contains('DelosObjectInputFilters.applyHeapFilterIfConfigured'),
                'DelosHeapObjectDeserializationFilter must delegate to the separate heap policy')

        def formatApplyCount = (formatIdText =~ /DelosHeapObjectDeserializationFilter\.applyIfConfigured\s*\(/).count
        DelosDbStaticAnalysisSupport.require(failures, formatApplyCount == 1,
                'FormatIdInputStream must install the heap object deserialization filter exactly once; found ' + formatApplyCount)
        DelosDbStaticAnalysisSupport.require(failures, formatIdText.contains('new ApplicationObjectInputStream'),
                'FormatIdInputStream must keep ApplicationObjectInputStream as the heap JAVA_OBJECT stream constructor')
        DelosDbStaticAnalysisSupport.require(failures, !applicationStreamText.contains('DelosHeapObjectDeserializationFilter.applyIfConfigured'),
                'ApplicationObjectInputStream must not install the heap filter; FormatIdInputStream owns the single installation point')
        DelosDbStaticAnalysisSupport.require(failures, !applicationStreamText.contains('setObjectInputFilter'),
                'ApplicationObjectInputStream must not call setObjectInputFilter directly')

        delosObjectFilterLeafSites.each { relativePath, specification ->
            def leafFile = new File(delosRepositoryRoot, relativePath)
            def leafText = leafFile.exists() ? leafFile.getText('UTF-8') : ''
            def description = specification[0]
            def requiredCall = specification[1]
            DelosDbStaticAnalysisSupport.require(failures, leafText.contains(requiredCall),
                    'Leaf ObjectInputStream site must install its boundary-specific policy: ' + relativePath + ' (' + description + ')')
            DelosDbStaticAnalysisSupport.require(failures, !leafText.contains('applyGeneralFilterIfConfigured'),
                    'Leaf ObjectInputStream site must not use the ambiguous general policy: ' + relativePath)
        }

        def productionSetFilterSites = []
        DelosDbStaticFileSupport.objectInputStreamSources(delosRepositoryRoot)
                .findAll { sourceFile ->
                    def relative = delosRepositoryRoot.toPath().relativize(sourceFile.toPath()).toString().replace(File.separatorChar, '/' as char)
                    Pattern.compile('delosdb-[^/]+/src/main/java/.+\\.java').matcher(relative).matches()
                            && relative != 'delosdb-commons/src/main/java/org/apache/derby/shared/common/security/DelosObjectInputFilters.java'
                }
                .each { sourceFile ->
            int lineNumber = 0
            sourceFile.eachLine('UTF-8') { line ->
                lineNumber++
                if (line.contains('setObjectInputFilter')) {
                    def relative = delosRepositoryRoot.toPath().relativize(sourceFile.toPath()).toString().replace(File.separatorChar, '/' as char)
                    productionSetFilterSites << relative + ':' + lineNumber + ': ' + DelosDbStaticAnalysisSupport.normalize(line)
                }
            }
        }
        if (!productionSetFilterSites.isEmpty()) {
            failures << 'Only DelosObjectInputFilters may call setObjectInputFilter in production sources. Extra sites: ' + productionSetFilterSites.join('; ')
        }

        ['testDefaultModePreservesDerbyHeapJavaObjectBehavior',
         'testDefaultHeapLimitsRequireExplicitCompatibilityModeForDeepGraphs',
         'testStrictModeAllowsConfiguredTypeAndBlocksUnlistedType',
         'testMvccStillRejectsJavaObjectTableDefinitions'].each { testName ->
            DelosDbStaticAnalysisSupport.require(failures, heapTestText.contains(testName),
                    'HeapObjectDeserializationFilterTest must keep coverage method: ' + testName)
        }
        DelosDbStaticAnalysisSupport.require(failures,
                heapTestText.contains('DelosObjectInputFilters.HEAP_COMPATIBILITY_MODE_PROPERTY')
                        && !heapTestText.contains('DelosObjectInputFilters.COMPATIBILITY_MODE_PROPERTY'),
                'Heap tests must use only the heap compatibility switch')

        ['testDrdaAndImportRejectUnexpectedClassesByDefault',
         'testExplicitBoundaryAllowListsOverrideFailClosedDefaults',
         'testReplicationDefaultAllowsOnlyProtocolShapes',
         'testExternalAndHeapCompatibilityModesAreSeparate'].each { testName ->
            DelosDbStaticAnalysisSupport.require(failures, boundaryTestText.contains(testName),
                    'ObjectDeserializationBoundaryTest must keep coverage method: ' + testName)
        }
        ['applyDrdaFilterIfConfigured',
         'applyImportFilterIfConfigured',
         'applyReplicationFilterIfConfigured',
         'applyHeapFilterIfConfigured',
         'UnexpectedPayload',
         'DeepPayload.chain(40)'].each { token ->
            DelosDbStaticAnalysisSupport.require(failures, boundaryTestText.contains(token),
                    'ObjectDeserializationBoundaryTest is missing proof token: ' + token)
        }

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/heap-object-deserialization-filter-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB object deserialization filter static analysis')
            writer.println('=========================================================')
            writer.println()
            writer.println('External default: fail closed for DRDA/import; protocol allow-list for replication.')
            writer.println('Heap default: resource-bounded compatibility policy with a separate compatibility switch.')
            writer.println()
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
                writer.println('Object deserialization boundary checks passed.')
            } else {
                writer.println('Status: FAIL')
                writer.println('Object deserialization boundary failures:')
                failures.each { failure -> writer.println('- ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB object deserialization filter static analysis failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB object deserialization filter static analysis passed. Report: {}', reportFile)
    }
}

def delosStaleGradleScripts = [
        'gradle/delosdb-runtime-distribution.gradle',
        'gradle/delosdb-verification-aliases.gradle',
        'gradle/delosdb-publication.gradle'
]

tasks.register('delosStaleGradleScriptCheck') {
    group = 'verification'
    description = 'Fails if obsolete DelosDB Gradle script fragments are present after build-script consolidation.'

    inputs.files(delosStaleGradleScripts.collect { new File(delosRepositoryRoot, it) }.findAll { it.exists() }).optional()
    outputs.file(layout.buildDirectory.file('reports/delosdb/stale-gradle-scripts.txt'))

    doLast {
        def staleFiles = delosStaleGradleScripts.collect { new File(delosRepositoryRoot, it) }.findAll { it.exists() }
        def reportFile = new File(delosBuildRoot, 'reports/delosdb/stale-gradle-scripts.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB stale Gradle script check')
            writer.println('=================================')
            writer.println()
            if (staleFiles.isEmpty()) {
                writer.println('No obsolete Gradle script fragments found.')
            } else {
                writer.println('Obsolete Gradle script fragments still present:')
                staleFiles.each { staleFile ->
                    writer.println('  - ' + delosRepositoryRoot.toPath().relativize(staleFile.toPath()).toString().replace(File.separatorChar, '/' as char))
                }
                writer.println()
                writer.println('Remove the obsolete Gradle script fragments listed above; they are not maintained project tools.')
            }
        }

        if (!staleFiles.isEmpty()) {
            def stalePaths = staleFiles.collect {
                delosRepositoryRoot.toPath().relativize(it.toPath()).toString().replace(File.separatorChar, '/' as char)
            }.join(', ')
            throw new GradleException('Obsolete DelosDB Gradle script fragment(s) still present: ' + stalePaths)
        }

        logger.lifecycle('DelosDB stale Gradle script check passed. Report: {}', reportFile)
    }
}



def delosHeapRawStoreDuplicateClassificationFile = new File(delosRepositoryRoot, 'gradle/static-analysis/delosdb-heap-rawstore-duplicate-classification.txt')

def delosHeapRawStoreDuplicateDecisions = ['KEEP', 'CONSOLIDATE', 'DEFER'] as Set

tasks.register('delosHeapRawStoreDuplicateClassificationReport') {
    group = 'verification'
    description = 'Reports curated duplicate-code classification for inherited Derby heap/raw-store code.'

    inputs.file(delosHeapRawStoreDuplicateClassificationFile).optional()
    outputs.file(layout.buildDirectory.file('reports/delosdb/heap-rawstore-duplicate-classification.txt'))

    doLast {
        def rows = DelosDbStaticAnalysisSupport.loadHeapRawStoreDuplicateClassifications(delosHeapRawStoreDuplicateClassificationFile, delosHeapRawStoreDuplicateDecisions)
        def ids = [] as Set
        def duplicateIds = []
        def missingFiles = []
        rows.each { row ->
            if (!ids.add(row.id)) {
                duplicateIds << row.id
            }
            row.files.each { relativePath ->
                if (!new File(delosRepositoryRoot, relativePath).exists()) {
                    missingFiles << [id: row.id, path: relativePath]
                }
            }
        }

        def counts = delosHeapRawStoreDuplicateDecisions.collectEntries { decision ->
            [decision, rows.count { it.decision == decision }]
        }
        def missingDecisions = delosHeapRawStoreDuplicateDecisions.findAll { decision -> counts[decision] == 0 }

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/heap-rawstore-duplicate-classification.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB inherited heap/raw-store duplicate-code classification')
            writer.println('===============================================================')
            writer.println()
            writer.println('This report classifies duplicate-looking inherited Derby heap/raw-store code.')
            writer.println('It does not refactor code, delete code, or prove deletion safety.')
            writer.println()
            writer.println('Rows: ' + rows.size())
            delosHeapRawStoreDuplicateDecisions.sort().each { decision ->
                writer.println('  ' + decision + ': ' + counts[decision])
            }
            writer.println()
            rows.each { row ->
                writer.println(row.id + ' [' + row.decision + '] ' + row.scope)
                writer.println('  reason:      ' + row.reason)
                writer.println('  next action: ' + row.nextAction)
                writer.println('  files:')
                row.files.each { relativePath -> writer.println('    - ' + relativePath) }
                writer.println()
            }

            if (!duplicateIds.isEmpty() || !missingFiles.isEmpty() || !missingDecisions.isEmpty()) {
                writer.println('Validation failures:')
                duplicateIds.each { id -> writer.println('  duplicate id: ' + id) }
                missingFiles.each { missing -> writer.println('  missing file for ' + missing.id + ': ' + missing.path) }
                missingDecisions.each { decision -> writer.println('  missing decision category: ' + decision) }
            } else {
                writer.println('Classification file validated.')
            }
        }

        if (!duplicateIds.isEmpty() || !missingFiles.isEmpty() || !missingDecisions.isEmpty()) {
            throw new GradleException('Heap/raw-store duplicate classification validation failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB heap/raw-store duplicate classification written: {}', reportFile)
    }
}



def delosDerbyModuleParityFile = new File(delosRepositoryRoot, 'gradle/static-analysis/delosdb-derby-module-parity.txt')

def delosDerbyModuleParityDecisions = ['KEEP_DERBY_PEER', 'DELOSDB_EXTENSION'] as Set

tasks.register('delosDerbyModuleParityStaticAnalysis') {
    group = 'verification'
    description = 'Validates Derby product/module parity decisions for cleanup/consolidation work.'

    inputs.file(delosDerbyModuleParityFile)
    inputs.file('settings.gradle')
    inputs.file('docs/CLEANUP-CONSOLIDATION.md')
    outputs.file(layout.buildDirectory.file('reports/delosdb/derby-module-parity-static-analysis.txt'))

    doLast {
        def rows = DelosDbStaticAnalysisSupport.loadDerbyModuleParityRows(delosDerbyModuleParityFile, delosDerbyModuleParityDecisions)
        def settingsText = new File(delosRepositoryRoot, 'settings.gradle').getText('UTF-8')
        def cleanupDoc = new File(delosRepositoryRoot, 'docs/CLEANUP-CONSOLIDATION.md')
        def cleanupDocText = cleanupDoc.exists() ? cleanupDoc.getText('UTF-8') : ''
        def failures = []
        def ids = [] as Set
        def modules = [] as Set

        rows.each { row ->
            if (!ids.add(row.id)) {
                failures << 'Duplicate Derby module parity id: ' + row.id
            }
            if (!modules.add(row.delosModule)) {
                failures << 'Duplicate Derby module parity DelosDB module: ' + row.delosModule
            }
            def projectName = row.delosModule.substring(1)
            if (!settingsText.contains("include '" + projectName + "'")) {
                failures << 'Derby module parity row references a project missing from settings.gradle: ' + row.delosModule
            }
            if (row.decision == 'KEEP_DERBY_PEER' && !row.derbyRoot.startsWith('java/')) {
                failures << 'KEEP_DERBY_PEER row must name the original Derby java/ source root: ' + row.id
            }
            if (row.decision == 'DELOSDB_EXTENSION' && row.derbyRoot != 'none') {
                failures << 'DELOSDB_EXTENSION row must use derby_source_root=none: ' + row.id
            }
        }

        def requiredDerbyPeers = [
                ':delosdb-engine',
                ':delosdb-client',
                ':delosdb-tools',
                ':delosdb-server',
                ':delosdb-runner',
                ':delosdb-optionaltools',
                ':delosdb-commons',
                ':delosdb-tests',
                ':delosdb-pptesting',
                ':delosdb-storeless',
                ':delosdb-osgi-stub',
                ':delosdb-locales',
                ':delosdb-demos',
                ':delosdb-buildtools'
        ]
        requiredDerbyPeers.each { moduleName ->
            def row = rows.find { it.delosModule == moduleName }
            if (row == null) {
                failures << 'Missing Derby module parity row for ' + moduleName
            } else if (row.decision != 'KEEP_DERBY_PEER') {
                failures << 'Original Derby peer module must be classified KEEP_DERBY_PEER: ' + moduleName
            }
        }

        def requiredExtensions = [
                ':delosdb-runtime-api',
                ':delosdb-annotations',
                ':delosdb-spi',
                ':delosdb-storage-io',
                ':delosdb-storage-api',
                ':delosdb-derby-store-api',
                ':delosdb-storage-derby',
                ':delosdb-storage-bridge',
                ':delosdb-storage-mvcc'
        ]
        requiredExtensions.each { moduleName ->
            def row = rows.find { it.delosModule == moduleName }
            if (row == null) {
                failures << 'Missing DelosDB extension module parity row for ' + moduleName
            } else if (row.decision != 'DELOSDB_EXTENSION') {
                failures << 'DelosDB-only module must be classified DELOSDB_EXTENSION: ' + moduleName
            }
        }

        def forbiddenDocPhrases = [
                'These modules may deserve consolidation',
                'Tools/server/runner/optionaltools module-boundary review',
                ':delosdb-tools\n:delosdb-runner\n:delosdb-optionaltools\n:delosdb-server'
        ]
        forbiddenDocPhrases.each { phrase ->
            if (cleanupDocText.contains(phrase)) {
                failures << 'Cleanup doc still contains obsolete consolidation wording: ' + phrase
            }
        }
        if (!cleanupDocText.contains('Do not consolidate these modules as part of cleanup')) {
            failures << 'Cleanup doc must explicitly preserve Derby peer modules from cleanup consolidation.'
        }
        if (!cleanupDocText.contains('delosDerbyModuleParityStaticAnalysis')) {
            failures << 'Cleanup doc must mention the Derby module parity static gate.'
        }

        def counts = delosDerbyModuleParityDecisions.collectEntries { decision ->
            [decision, rows.count { it.decision == decision }]
        }
        def reportFile = new File(delosBuildRoot, 'reports/delosdb/derby-module-parity-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB Derby module parity static analysis')
            writer.println('==========================================')
            writer.println()
            writer.println('Rows: ' + rows.size())
            delosDerbyModuleParityDecisions.sort().each { decision ->
                writer.println('  ' + decision + ': ' + counts[decision])
            }
            writer.println()
            rows.each { row ->
                writer.println(row.id + ' [' + row.decision + '] ' + row.delosModule)
                writer.println('  derby root:    ' + row.derbyRoot)
                writer.println('  artifact/role: ' + row.artifactRole)
                writer.println('  reason:        ' + row.reason)
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('Derby module parity checks passed.')
            } else {
                writer.println('Derby module parity failures:')
                failures.each { failure -> writer.println('  - ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB Derby module parity static analysis failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB Derby module parity static analysis passed. Report: {}', reportFile)
    }
}

