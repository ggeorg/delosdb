import java.nio.charset.StandardCharsets
import java.util.regex.Pattern

/*
 * DelosDB-owned storage/MVCC static-analysis gate.
 *
 * This intentionally scopes analysis to DelosDB-owned storage modules and the
 * Derby storage API fork seam. It does not scan the entire inherited Derby tree.
 */

def delosStorageStaticSourceRoots = [
        'delosdb-storage-api/src/main/java',
        'delosdb-storage-io/src/main/java',
        'delosdb-storage-mvcc/src/main/java',
        'delosdb-storage-bridge/src/main/java',
        'delosdb-derby-store-api/src/main/java'
]

def delosStorageStaticBaselineFile = file('gradle/static-analysis/delosdb-storage-baseline.txt')

def delosStorageNormalize = { String line ->
    line == null ? '' : line.trim().replaceAll(/\s+/, ' ')
}

def delosStorageFinding = { String rule, File sourceFile, int lineNumber, String line ->
    def relativePath = rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separatorChar, '/' as char)
    [
            rule       : rule,
            path       : relativePath,
            lineNumber : lineNumber,
            line       : line,
            normalized : delosStorageNormalize(line),
            key        : rule + '|' + relativePath + '|' + delosStorageNormalize(line)
    ]
}

def delosStorageImportTarget = { String line ->
    def matcher = line =~ /^\s*import\s+(?:static\s+)?([^;]+);/
    matcher.find() ? matcher.group(1) : null
}

def delosStorageIsMvccPath = { String relativePath, String layer ->
    relativePath.startsWith('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/' + layer + '/')
}

def delosStorageIsMvccImport = { String importTarget, String layer ->
    importTarget != null && importTarget.startsWith('io.github.ggeorg.delosdb.storage.mvcc.' + layer + '.')
}

def delosStorageLoadBaseline = {
    if (!delosStorageStaticBaselineFile.exists()) {
        return [] as Set
    }

    delosStorageStaticBaselineFile.readLines('UTF-8')
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') }
            .toSet()
}

def delosStorageJavaSources = {
    delosStorageStaticSourceRoots.collect { file(it) }
            .findAll { it.exists() }
            .collectMany { root -> fileTree(root) { include '**/*.java' }.files }
            .sort { a, b -> a.path <=> b.path }
}

def delosStorageClassifyFindings = {
    def findings = []

    delosStorageJavaSources().each { sourceFile ->
        def relativePath = rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separatorChar, '/' as char)
        def lines = sourceFile.readLines('UTF-8')
        lines.eachWithIndex { String line, int index ->
            int lineNumber = index + 1

            if (line.contains('UnsupportedOperationException')) {
                findings << delosStorageFinding('STORAGE_UNSUPPORTED_OPERATION', sourceFile, lineNumber, line)
            }
            if (line.contains('TODO') || line.contains('FIXME') || line.contains('HACK')) {
                findings << delosStorageFinding('STORAGE_TODO_MARKER', sourceFile, lineNumber, line)
            }
            if (line.contains('System.out.') || line.contains('System.err.')) {
                findings << delosStorageFinding('STORAGE_STDOUT_STDERR', sourceFile, lineNumber, line)
            }
            if (relativePath.startsWith('delosdb-storage-mvcc/') && line.contains('io.github.ggeorg.delosdb.spi.storage.versioned')) {
                findings << delosStorageFinding('MVCC_LEGACY_VERSIONED_SPI_IMPORT', sourceFile, lineNumber, line)
            }
            if (relativePath.startsWith('delosdb-storage-mvcc/')
                    && (line.contains('ObjectInputStream') || line.contains('ObjectOutputStream'))) {
                findings << delosStorageFinding('MVCC_JAVA_OBJECT_STREAM', sourceFile, lineNumber, line)
            }

            def importTarget = delosStorageImportTarget(line)
            if (importTarget != null) {
                if (delosStorageIsMvccPath(relativePath, 'format')
                        && (importTarget.startsWith('org.apache.derby.')
                        || importTarget.startsWith('java.sql.')
                        || delosStorageIsMvccImport(importTarget, 'bridge')
                        || delosStorageIsMvccImport(importTarget, 'durable')
                        || delosStorageIsMvccImport(importTarget, 'store'))) {
                    findings << delosStorageFinding('MVCC_FORMAT_LAYER_DEPENDENCY', sourceFile, lineNumber, line)
                }

                if ((delosStorageIsMvccPath(relativePath, 'durable') || delosStorageIsMvccPath(relativePath, 'store'))
                        && (importTarget.startsWith('org.apache.derby.')
                        || importTarget.startsWith('java.sql.')
                        || delosStorageIsMvccImport(importTarget, 'bridge'))) {
                    findings << delosStorageFinding('MVCC_DURABLE_LAYER_DEPENDENCY', sourceFile, lineNumber, line)
                }
            }

            // Zero-baseline hard gates for DelosDB-owned storage code.
            // These are dangerous enough that new uses should be deliberate and reviewed.
            if (line.contains('Thread.sleep(')) {
                findings << delosStorageFinding('STORAGE_THREAD_SLEEP', sourceFile, lineNumber, line)
            }
            if (line.contains('System.exit(')) {
                findings << delosStorageFinding('STORAGE_SYSTEM_EXIT', sourceFile, lineNumber, line)
            }
            if (line.contains('printStackTrace(')) {
                findings << delosStorageFinding('STORAGE_PRINT_STACK_TRACE', sourceFile, lineNumber, line)
            }
            if (line.contains('new Thread(')) {
                findings << delosStorageFinding('STORAGE_RAW_THREAD', sourceFile, lineNumber, line)
            }
            if (line.contains('.wait(') || line.contains('.notify(') || line.contains('.notifyAll(')) {
                findings << delosStorageFinding('STORAGE_WAIT_NOTIFY', sourceFile, lineNumber, line)
            }
        }
    }

    findings
}

tasks.register('delosStorageStaticAnalysis') {
    group = 'verification'
    description = 'Runs scoped static analysis over DelosDB-owned storage/MVCC modules.'

    inputs.files(delosStorageJavaSources())
    inputs.file(delosStorageStaticBaselineFile).optional()
    outputs.file(layout.buildDirectory.file('reports/delosdb/storage-static-analysis.txt'))

    doLast {
        def baseline = delosStorageLoadBaseline()
        def findings = delosStorageClassifyFindings()
        def newFindings = findings.findAll { !baseline.contains(it.key) }

        def synchronizedCount = 0
        delosStorageJavaSources().each { sourceFile ->
            sourceFile.eachLine('UTF-8') { line ->
                if (line =~ /\bsynchronized\b/) {
                    synchronizedCount++
                }
            }
        }

        def reportFile = layout.buildDirectory.file('reports/delosdb/storage-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB scoped storage/MVCC static analysis')
            writer.println('================================================')
            writer.println('Source roots:')
            delosStorageStaticSourceRoots.each { writer.println('  - ' + it) }
            writer.println()
            writer.println('Total findings: ' + findings.size())
            writer.println('New findings:   ' + newFindings.size())
            writer.println('synchronized references measured: ' + synchronizedCount)
            writer.println()

            if (newFindings.isEmpty()) {
                writer.println('No new findings outside baseline.')
            } else {
                writer.println('New findings outside baseline:')
                newFindings.each { finding ->
                    writer.println("${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}")
                }
            }

            writer.println()
            writer.println('All findings:')
            findings.each { finding ->
                writer.println("${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}")
            }
        }

        if (!newFindings.isEmpty()) {
            def preview = newFindings.take(20).collect { finding ->
                "${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}"
            }.join(System.lineSeparator())
            throw new GradleException(
                    'DelosDB storage static analysis found ' + newFindings.size() +
                            ' new finding(s) outside baseline. Report: ' + reportFile +
                            System.lineSeparator() + preview)
        }

        logger.lifecycle('DelosDB storage static analysis passed. Report: {}', reportFile)
    }
}


def delosServerStaticSourceRoots = [
        'delosdb-server/src/main/java'
]

def delosServerJavaSources = {
    delosServerStaticSourceRoots.collect { file(it) }
            .findAll { it.exists() }
            .collectMany { root -> fileTree(root) { include '**/*.java' }.files }
            .sort { a, b -> a.path <=> b.path }
}

def delosServerFinding = { String rule, File sourceFile, int lineNumber, String line ->
    def relativePath = rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separatorChar, '/' as char)
    [
            rule       : rule,
            path       : relativePath,
            lineNumber : lineNumber,
            line       : line,
            normalized : delosStorageNormalize(line)
    ]
}

def delosServerClassifyFindings = {
    def findings = []
    def netServletPath = 'delosdb-server/src/main/java/org/apache/derby/drda/NetServlet.java'

    delosServerJavaSources().each { sourceFile ->
        def relativePath = rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separatorChar, '/' as char)
        def lines = sourceFile.readLines('UTF-8')
        lines.eachWithIndex { String line, int index ->
            int lineNumber = index + 1
            def importTarget = delosStorageImportTarget(line)
            if (importTarget == null) {
                return
            }

            if (importTarget.startsWith('org.apache.lucene.') || importTarget.startsWith('org.json.simple.')) {
                findings << delosServerFinding('SERVER_UNUSED_LEGACY_LIBRARY_IMPORT', sourceFile, lineNumber, line)
            }
            if (importTarget.startsWith('io.github.ggeorg.delosdb.storage.mvcc.')) {
                findings << delosServerFinding('SERVER_MVCC_IMPLEMENTATION_IMPORT', sourceFile, lineNumber, line)
            }
            if ((importTarget.startsWith('javax.servlet.') || importTarget.startsWith('jakarta.servlet.'))
                    && relativePath != netServletPath) {
                findings << delosServerFinding('SERVER_SERVLET_DEPENDENCY', sourceFile, lineNumber, line)
            }
        }

        if (relativePath == 'delosdb-server/src/main/java/org/apache/derby/impl/drda/DRDAConnThread.java') {
            lines.eachWithIndex { String line, int index ->
                int lineNumber = index + 1
                if (line.contains('PublicBufferOutputStream')
                        || line.contains('OOMEs for large values')) {
                    findings << delosServerFinding('SERVER_EXTDTA_HEAP_BUFFERING', sourceFile, lineNumber, line)
                }
            }
        }

        if (lines.any { it.contains('\"delos.drda.') }
                && relativePath != 'delosdb-server/src/main/java/org/apache/derby/impl/drda/DrdaServerConfiguration.java') {
            lines.eachWithIndex { String line, int index ->
                int lineNumber = index + 1
                if (line.contains('\"delos.drda.')) {
                    findings << delosServerFinding('SERVER_SCATTERED_DELOS_DRDA_PROPERTY', sourceFile, lineNumber, line)
                }
            }
        }

        if ((lines.any { it.contains('Thread.ofVirtual(') || it.contains('newVirtualThreadPerTaskExecutor(') })
                && relativePath != 'delosdb-server/src/main/java/org/apache/derby/impl/drda/DrdaThreading.java') {
            lines.eachWithIndex { String line, int index ->
                int lineNumber = index + 1
                if (line.contains('Thread.ofVirtual(') || line.contains('newVirtualThreadPerTaskExecutor(')) {
                    findings << delosServerFinding('SERVER_SCATTERED_VIRTUAL_THREAD_FACTORY', sourceFile, lineNumber, line)
                }
            }
        }

        lines.eachWithIndex { String line, int index ->
            int lineNumber = index + 1
            if ((line.contains('System.gc(')
                    || line.contains('Runtime.getRuntime().gc(')
                    || line.contains('.gc();')
                    || line.contains('.gc()'))
                    && !line.trim().startsWith('//')) {
                findings << delosServerFinding('SERVER_FORCED_GC', sourceFile, lineNumber, line)
            }
        }

    }

    findings
}

tasks.register('delosServerStaticAnalysis') {
    group = 'verification'
    description = 'Runs scoped static analysis over the DelosDB network server module.'

    inputs.files(delosServerJavaSources())
    outputs.file(layout.buildDirectory.file('reports/delosdb/server-static-analysis.txt'))

    doLast {
        def findings = delosServerClassifyFindings()
        def reportFile = layout.buildDirectory.file('reports/delosdb/server-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB scoped server static analysis')
            writer.println('=====================================')
            writer.println('Source roots:')
            delosServerStaticSourceRoots.each { writer.println('  - ' + it) }
            writer.println()
            writer.println('Total findings: ' + findings.size())
            writer.println()

            if (findings.isEmpty()) {
                writer.println('No server boundary violations found.')
            } else {
                writer.println('Server boundary violations:')
                findings.each { finding ->
                    writer.println("${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}")
                }
            }
        }

        if (!findings.isEmpty()) {
            def preview = findings.take(20).collect { finding ->
                "${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}"
            }.join(System.lineSeparator())
            throw new GradleException(
                    'DelosDB server static analysis found ' + findings.size() +
                            ' server boundary violation(s). Report: ' + reportFile +
                            System.lineSeparator() + preview)
        }

        logger.lifecycle('DelosDB server static analysis passed. Report: {}', reportFile)
    }
}



def delosHeapCompatibilityStaticSourceRoots = [
        'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/heap',
        'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/btree',
        'delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/raw'
]

def delosHeapCompatibilityJavaSources = {
    delosHeapCompatibilityStaticSourceRoots.collect { file(it) }
            .findAll { it.exists() }
            .collectMany { root -> fileTree(root) { include '**/*.java' }.files }
            .sort { a, b -> a.path <=> b.path }
}

def delosHeapCompatibilityFinding = { String rule, File sourceFile, int lineNumber, String line ->
    def relativePath = rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separatorChar, '/' as char)
    [
            rule       : rule,
            path       : relativePath,
            lineNumber : lineNumber,
            line       : line,
            normalized : delosStorageNormalize(line)
    ]
}

def delosHeapCompatibilityClassifyFindings = {
    def findings = []

    delosHeapCompatibilityJavaSources().each { sourceFile ->
        def lines = sourceFile.readLines('UTF-8')
        lines.eachWithIndex { String line, int index ->
            int lineNumber = index + 1
            def importTarget = delosStorageImportTarget(line)

            if (importTarget != null) {
                if (importTarget.startsWith('io.github.ggeorg.delosdb.storage.mvcc.')) {
                    findings << delosHeapCompatibilityFinding('HEAP_MVCC_IMPLEMENTATION_IMPORT', sourceFile, lineNumber, line)
                }
                if (importTarget.startsWith('io.github.ggeorg.delosdb.spi.storage.versioned.')) {
                    findings << delosHeapCompatibilityFinding('HEAP_VERSIONED_QUARANTINE_IMPORT', sourceFile, lineNumber, line)
                }
                if (importTarget.startsWith('org.apache.derby.impl.drda.')
                        || importTarget.startsWith('org.apache.derby.drda.')
                        || importTarget.startsWith('javax.servlet.')
                        || importTarget.startsWith('jakarta.servlet.')) {
                    findings << delosHeapCompatibilityFinding('HEAP_SERVER_OR_DRDA_DEPENDENCY', sourceFile, lineNumber, line)
                }
                if (importTarget.startsWith('java.lang.foreign.')) {
                    findings << delosHeapCompatibilityFinding('HEAP_FOREIGN_MEMORY_API', sourceFile, lineNumber, line)
                }
            }

            if (line.contains('ObjectInputStream') || line.contains('ObjectOutputStream')) {
                findings << delosHeapCompatibilityFinding('HEAP_OBJECT_STREAM_SITE', sourceFile, lineNumber, line)
            }
            if (line.contains('java.lang.foreign.')) {
                findings << delosHeapCompatibilityFinding('HEAP_FOREIGN_MEMORY_API', sourceFile, lineNumber, line)
            }
        }
    }

    findings
}

tasks.register('delosHeapCompatibilityStaticAnalysis') {
    group = 'verification'
    description = 'Protects Derby-compatible heap/raw-store core from MVCC, quarantine, protocol, and foreign-memory drift.'

    inputs.files(delosHeapCompatibilityJavaSources())
    outputs.file(layout.buildDirectory.file('reports/delosdb/heap-compatibility-static-analysis.txt'))

    doLast {
        def findings = delosHeapCompatibilityClassifyFindings()
        def reportFile = layout.buildDirectory.file('reports/delosdb/heap-compatibility-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB Derby heap compatibility static analysis')
            writer.println('================================================')
            writer.println('Source roots:')
            delosHeapCompatibilityStaticSourceRoots.each { writer.println('  - ' + it) }
            writer.println()
            writer.println('Total findings: ' + findings.size())
            writer.println()

            if (findings.isEmpty()) {
                writer.println('No heap compatibility boundary violations found.')
            } else {
                writer.println('Heap compatibility boundary violations:')
                findings.each { finding ->
                    writer.println("${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}")
                }
            }
            writer.println()
            writer.println('Allowed DelosDB compatibility seams are intentionally outside this deny-list gate,')
            writer.println('including provider adapters, cost tuning hooks, and LegacyInternal annotations.')
        }

        if (!findings.isEmpty()) {
            def preview = findings.take(20).collect { finding ->
                "${finding.rule} ${finding.path}:${finding.lineNumber}: ${finding.normalized}"
            }.join(System.lineSeparator())
            throw new GradleException(
                    'DelosDB heap compatibility static analysis found ' + findings.size() +
                            ' boundary violation(s). Report: ' + reportFile +
                            System.lineSeparator() + preview)
        }

        logger.lifecycle('DelosDB heap compatibility static analysis passed. Report: {}', reportFile)
    }
}


def delosStaleGradleScripts = [
        'gradle/delosdb-runtime-distribution.gradle',
        'gradle/delosdb-verification-aliases.gradle',
        'gradle/delosdb-publication.gradle'
]

tasks.register('delosStaleGradleScriptCheck') {
    group = 'verification'
    description = 'Fails if obsolete DelosDB Gradle script fragments are present after build-script consolidation.'

    inputs.files(delosStaleGradleScripts.collect { file(it) }.findAll { it.exists() }).optional()
    outputs.file(layout.buildDirectory.file('reports/delosdb/stale-gradle-scripts.txt'))

    doLast {
        def staleFiles = delosStaleGradleScripts.collect { file(it) }.findAll { it.exists() }
        def reportFile = layout.buildDirectory.file('reports/delosdb/stale-gradle-scripts.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB stale Gradle script check')
            writer.println('=================================')
            writer.println()
            if (staleFiles.isEmpty()) {
                writer.println('No obsolete Gradle script fragments found.')
            } else {
                writer.println('Obsolete Gradle script fragments still present:')
                staleFiles.each { staleFile ->
                    writer.println('  - ' + rootProject.projectDir.toPath().relativize(staleFile.toPath()).toString().replace(File.separatorChar, '/' as char))
                }
                writer.println()
                writer.println('Run scripts/cleanup-stale-gradle-scripts.sh after applying the cleanup overlay.')
            }
        }

        if (!staleFiles.isEmpty()) {
            def stalePaths = staleFiles.collect {
                rootProject.projectDir.toPath().relativize(it.toPath()).toString().replace(File.separatorChar, '/' as char)
            }.join(', ')
            throw new GradleException('Obsolete DelosDB Gradle script fragment(s) still present: ' + stalePaths +
                    '. Run scripts/cleanup-stale-gradle-scripts.sh')
        }

        logger.lifecycle('DelosDB stale Gradle script check passed. Report: {}', reportFile)
    }
}



def delosDeadCodeCandidateFile = file('gradle/static-analysis/delosdb-dead-code-candidates.txt')

def delosDeadCodeSearchRoots = [
        'delosdb-storage-api/src/main/java',
        'delosdb-storage-bridge/src/main/java',
        'delosdb-storage-mvcc/src/main/java',
        'delosdb-storage-mvcc/src/test/java',
        'delosdb-storage-io/src/main/java',
        'delosdb-server/src/main/java',
        'delosdb-client/src/main/java',
        'delosdb-tools/src/main/java',
        'delosdb-tests/src/test/java'
]

def delosDeadCodeSearchFiles = {
    def includes = ['**/*.java', '**/*.properties', '**/META-INF/services/**', '**/module-info.java']
    delosDeadCodeSearchRoots.collect { file(it) }
            .findAll { it.exists() }
            .collectMany { root ->
                fileTree(root) {
                    includes.each { include it }
                }.files
            }
            .sort { a, b -> a.path <=> b.path }
}

def delosLoadDeadCodeCandidates = {
    if (!delosDeadCodeCandidateFile.exists()) {
        return []
    }
    delosDeadCodeCandidateFile.readLines('UTF-8')
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') }
            .collect { line ->
                def parts = line.split('\\|', 3)
                if (parts.length < 2) {
                    throw new GradleException('Malformed dead-code candidate line: ' + line)
                }
                [
                        path  : parts[0].trim(),
                        symbol: parts[1].trim(),
                        reason: parts.length == 3 ? parts[2].trim() : ''
                ]
            }
}

tasks.register('delosDeadCodeCandidateReport') {
    group = 'verification'
    description = 'Reports curated DelosDB dead-code/stale-code candidates without deleting them.'

    inputs.file(delosDeadCodeCandidateFile).optional()
    inputs.files(delosDeadCodeSearchFiles())
    outputs.file(layout.buildDirectory.file('reports/delosdb/dead-code-candidates.txt'))

    doLast {
        def candidates = delosLoadDeadCodeCandidates()
        def searchFiles = delosDeadCodeSearchFiles()
        def reportFile = layout.buildDirectory.file('reports/delosdb/dead-code-candidates.txt').get().asFile
        reportFile.parentFile.mkdirs()

        def rows = candidates.collect { candidate ->
            def candidateFile = file(candidate.path)
            def references = []
            if (candidateFile.exists()) {
                searchFiles.findAll { it.exists() && it.canonicalFile != candidateFile.canonicalFile }.each { sourceFile ->
                    int lineNumber = 0
                    sourceFile.eachLine('UTF-8') { line ->
                        lineNumber++
                        def symbolPattern = ~('(?<![A-Za-z0-9_$])' + Pattern.quote(candidate.symbol) + '(?![A-Za-z0-9_$])')
                        if (symbolPattern.matcher(line).find()) {
                            references << [file: sourceFile, lineNumber: lineNumber, line: delosStorageNormalize(line)]
                        }
                    }
                }
            }
            [candidate: candidate, exists: candidateFile.exists(), references: references]
        }

        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB dead-code / stale-code candidate report')
            writer.println('================================================')
            writer.println()
            writer.println('This is an evidence report, not a deletion gate.')
            writer.println('ServiceLoader entries, public APIs, JPMS exports, tests, and reflection can make text-only dead-code scans noisy.')
            writer.println()
            writer.println('Candidates configured: ' + candidates.size())
            writer.println()
            writer.println('Search roots:')
            delosDeadCodeSearchRoots.each { writer.println('  - ' + it) }
            writer.println()

            rows.each { row ->
                def candidate = row.candidate
                writer.println(candidate.path)
                writer.println('  symbol:     ' + candidate.symbol)
                writer.println('  exists:     ' + row.exists)
                writer.println('  references: ' + row.references.size())
                if (candidate.reason) {
                    writer.println('  reason:     ' + candidate.reason)
                }
                if (row.exists && row.references.isEmpty()) {
                    writer.println('  status:     deletion-review candidate')
                } else if (!row.exists) {
                    writer.println('  status:     already removed or renamed')
                } else {
                    writer.println('  status:     referenced; do not delete without deeper review')
                    row.references.take(10).each { ref ->
                        def refPath = rootProject.projectDir.toPath().relativize(ref.file.toPath()).toString().replace(File.separatorChar, '/' as char)
                        writer.println('    - ' + refPath + ':' + ref.lineNumber + ': ' + ref.line)
                    }
                    if (row.references.size() > 10) {
                        writer.println('    ... ' + (row.references.size() - 10) + ' more reference(s) omitted')
                    }
                }
                writer.println()
            }
        }

        logger.lifecycle('DelosDB dead-code candidate report written: {}', reportFile)
    }
}



def delosHeapRawStoreDuplicateClassificationFile = file('gradle/static-analysis/delosdb-heap-rawstore-duplicate-classification.txt')

def delosHeapRawStoreDuplicateDecisions = ['KEEP', 'CONSOLIDATE', 'DEFER'] as Set

def delosLoadHeapRawStoreDuplicateClassifications = {
    if (!delosHeapRawStoreDuplicateClassificationFile.exists()) {
        return []
    }

    def rows = []
    int lineNumber = 0
    delosHeapRawStoreDuplicateClassificationFile.readLines('UTF-8').each { rawLine ->
        lineNumber++
        def line = rawLine.trim()
        if (!line || line.startsWith('#')) {
            return
        }
        def parts = line.split('\\|', -1).collect { it.trim() }
        if (parts.length != 6) {
            throw new GradleException('Malformed heap/raw-store duplicate classification line ' + lineNumber + ': expected 6 pipe-delimited fields')
        }
        if (!delosHeapRawStoreDuplicateDecisions.contains(parts[1])) {
            throw new GradleException('Malformed heap/raw-store duplicate classification line ' + lineNumber + ': unknown decision ' + parts[1])
        }
        def files = parts[3].split(',').collect { it.trim() }.findAll { it }
        if (files.isEmpty()) {
            throw new GradleException('Malformed heap/raw-store duplicate classification line ' + lineNumber + ': no files listed')
        }
        rows << [
                id        : parts[0],
                decision  : parts[1],
                scope     : parts[2],
                files     : files,
                reason    : parts[4],
                nextAction: parts[5],
                lineNumber: lineNumber
        ]
    }
    rows
}

tasks.register('delosHeapRawStoreDuplicateClassificationReport') {
    group = 'verification'
    description = 'Reports curated duplicate-code classification for inherited Derby heap/raw-store code.'

    inputs.file(delosHeapRawStoreDuplicateClassificationFile).optional()
    outputs.file(layout.buildDirectory.file('reports/delosdb/heap-rawstore-duplicate-classification.txt'))

    doLast {
        def rows = delosLoadHeapRawStoreDuplicateClassifications()
        def ids = [] as Set
        def duplicateIds = []
        def missingFiles = []
        rows.each { row ->
            if (!ids.add(row.id)) {
                duplicateIds << row.id
            }
            row.files.each { relativePath ->
                if (!file(relativePath).exists()) {
                    missingFiles << [id: row.id, path: relativePath]
                }
            }
        }

        def counts = delosHeapRawStoreDuplicateDecisions.collectEntries { decision ->
            [decision, rows.count { it.decision == decision }]
        }
        def missingDecisions = delosHeapRawStoreDuplicateDecisions.findAll { decision -> counts[decision] == 0 }

        def reportFile = layout.buildDirectory.file('reports/delosdb/heap-rawstore-duplicate-classification.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB inherited heap/raw-store duplicate-code classification')
            writer.println('===============================================================')
            writer.println()
            writer.println('This report classifies duplicate-looking inherited Derby heap/raw-store code.')
            writer.println('It does not refactor code, delete code, or prove deletion safety.')
            writer.println()
            writer.println('Rows: ' + rows.size())
            delosHeapRawStoreDuplicateDecisions.sort().each { decision ->
                writer.println('  ' + decision + ': ' + counts[decision])
            }
            writer.println()
            rows.each { row ->
                writer.println(row.id + ' [' + row.decision + '] ' + row.scope)
                writer.println('  reason:      ' + row.reason)
                writer.println('  next action: ' + row.nextAction)
                writer.println('  files:')
                row.files.each { relativePath -> writer.println('    - ' + relativePath) }
                writer.println()
            }

            if (!duplicateIds.isEmpty() || !missingFiles.isEmpty() || !missingDecisions.isEmpty()) {
                writer.println('Validation failures:')
                duplicateIds.each { id -> writer.println('  duplicate id: ' + id) }
                missingFiles.each { missing -> writer.println('  missing file for ' + missing.id + ': ' + missing.path) }
                missingDecisions.each { decision -> writer.println('  missing decision category: ' + decision) }
            } else {
                writer.println('Classification file validated.')
            }
        }

        if (!duplicateIds.isEmpty() || !missingFiles.isEmpty() || !missingDecisions.isEmpty()) {
            throw new GradleException('Heap/raw-store duplicate classification validation failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB heap/raw-store duplicate classification written: {}', reportFile)
    }
}

tasks.register('s0CloseoutVerification') {
    group = 'verification'
    description = 'Runs S0 closeout verification gates that are safe before the next MVCC/server feature phase.'
    dependsOn 'delosStorageStaticAnalysis', 'delosServerStaticAnalysis', 'delosHeapCompatibilityStaticAnalysis', 'delosStaleGradleScriptCheck', 'delosDeadCodeCandidateReport', 'delosHeapRawStoreDuplicateClassificationReport'
}
