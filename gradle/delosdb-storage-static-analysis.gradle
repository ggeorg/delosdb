            if (!sourceFile.isFile()) {
                failures << 'Missing required file: ' + sourceFile
            }
        }

        if (failures.isEmpty()) {
            def metadataText = metadataFile.getText('UTF-8')
            def runtimeText = runtimeFile.getText('UTF-8')
