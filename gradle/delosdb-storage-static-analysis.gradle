def delosExternalValidationConfiguredCommand = { Map spec ->
    def configured = providers.gradleProperty(spec.propertyName).orNull
    if (configured == null) {
        return null
    }
    def trimmed = configured.trim()
    trimmed.isEmpty() ? null : trimmed
}

