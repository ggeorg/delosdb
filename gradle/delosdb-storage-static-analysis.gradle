        delosRuntimeArtifactModelRequire(failures, runtimeText.contains('ext.delosdbRuntimeJarFiles'),
                'Runtime artifact convention script must expose ext.delosdbRuntimeJarFiles')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains("tasks.register('jars')"),
