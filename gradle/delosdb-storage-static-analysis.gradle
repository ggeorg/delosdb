tasks.register('delosDrdaDisconnectCleanupStaticAnalysis') {
    group = 'verification'
    description = 'Protects bounded DRDA disconnect rollback and lock-release proofs for heap and MVCC.'

    inputs.files(delosDrdaDisconnectCleanupProofFiles.values())
    inputs.file(new File(delosRepositoryRoot, 'gradle/delosdb-storage-static-analysis.gradle'))
    outputs.file(layout.buildDirectory.file(
            'reports/delosdb/drda-disconnect-cleanup-static-analysis.txt'))

    doLast {
        def failures = []
        def helperText = delosDrdaDisconnectCleanupProofFiles.helper.getText('UTF-8')
        def disconnectText = delosDrdaDisconnectCleanupProofFiles.disconnectTest.getText('UTF-8')
        def streamingText = delosDrdaDisconnectCleanupProofFiles.streamingTest.getText('UTF-8')
        def testBuildText = delosDrdaDisconnectCleanupProofFiles.testBuild.getText('UTF-8')
        def staticFile = new File(delosRepositoryRoot,
                'gradle/delosdb-storage-static-analysis.gradle')
        def staticText = staticFile.getText('UTF-8')

        [
                'CLEANUP_DEADLOCK_TIMEOUT_SECONDS = 1',
                'CLEANUP_LOCK_WAIT_TIMEOUT_SECONDS = 2',
                'CLEANUP_DEADLINE_SECONDS = 30',
                'DatabasePropertyTestSetup.setLockTimeouts(',
                'withBoundedCleanupLockWaits(Test test)',
                'attempts++;',
                'bounded lock probes'
        ].each { token ->
            if (!helperText.contains(token)) {
                failures << 'DRDA cleanup helper is missing bounded-wait token: ' + token
            }
        }
        if (helperText.contains('TimeUnit.SECONDS.toNanos(15)')) {
            failures << 'DRDA cleanup polling must not restore the ineffective 15-second default-lock wait loop'
        }

        [
                'withBoundedCleanupLockWaits(test)',
                'victim.abort(abortExecutor)',
                'awaitRollbackAndCommit('
        ].each { token ->
            if (!disconnectText.contains(token)) {
                failures << 'DRDA abort cleanup proof is missing: ' + token
            }
        }
        [
                'withBoundedCleanupLockWaits(test)',
                'resetPhysicalClientSocket(victim)',
                'assertTransportFailure(fetch, table)',
                'awaitRollbackAndCommit('
        ].each { token ->
            if (!streamingText.contains(token)) {
                failures << 'DRDA streaming cleanup proof is missing: ' + token
            }
        }
        [
                "'runDelosHeapMvccDrdaDisconnectCleanupTest'",
                "'runDelosHeapMvccDrdaStreamingDisconnectTest'",
                "dependsOn tasks.named('runDelosHeapMvccDrdaDisconnectCleanupTest')",
                "dependsOn tasks.named('runDelosHeapMvccDrdaStreamingDisconnectTest')"
        ].each { token ->
            if (!testBuildText.contains(token)) {
                failures << 'DRDA cleanup test wiring is missing: ' + token
            }
        }

        def s0Index = staticText.lastIndexOf("tasks.register('s0CloseoutVerification')")
        if (s0Index < 0
                || !staticText.substring(s0Index).contains(
                        "'delosDrdaDisconnectCleanupStaticAnalysis'")) {
            failures << 'S0 must include the DRDA disconnect-cleanup static gate'
        }

        def reportFile = layout.buildDirectory.file(
                'reports/delosdb/drda-disconnect-cleanup-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB DRDA disconnect cleanup static analysis')
            writer.println('================================================')
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'DRDA disconnect cleanup static analysis failed. Report: ' + reportFile)
        }
        logger.lifecycle('DRDA disconnect cleanup static analysis passed. Report: {}', reportFile)
    }
}


tasks.register('delosMvccSerializableBindingBoundaryStaticAnalysis') {
    group = 'verification'
    description = 'Verifies that SERIALIZABLE MVCC binding classifies logical descriptors from provider metadata without dereferencing view/VTI conglomerates.'

    def fromBaseTableFile = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/FromBaseTable.java')
    def semanticsTestFile = file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccSqlSerializableSemanticsTest.java')
    def testsBuildFile = file('delosdb-tests/build.gradle')
    def staticAnalysisFile = file('gradle/delosdb-storage-static-analysis.gradle')

    inputs.files(fromBaseTableFile, semanticsTestFile, testsBuildFile, staticAnalysisFile)
    outputs.file(layout.buildDirectory.file(
            'reports/delosdb/mvcc-serializable-binding-boundary-static-analysis.txt'))

    doLast {
        def failures = []
        [fromBaseTableFile, semanticsTestFile, testsBuildFile, staticAnalysisFile].each { sourceFile ->
            if (!sourceFile.isFile()) {
                failures << 'Missing required file: ' + sourceFile
            }
        }

        if (failures.isEmpty()) {
            def fromBaseTableText = fromBaseTableFile.getText('UTF-8')
            def semanticsTestText = semanticsTestFile.getText('UTF-8')
            def testsBuildText = testsBuildFile.getText('UTF-8')
            def staticAnalysisText = staticAnalysisFile.getText('UTF-8')

            int bindingStart = fromBaseTableText.indexOf('private\tTableDescriptor\tbindTableDescriptor()')
            int bindingEnd = bindingStart < 0
                    ? -1
                    : fromBaseTableText.indexOf('return\ttableDescriptor;', bindingStart)
            if (bindingStart < 0 || bindingEnd < 0) {
                failures << 'Could not isolate FromBaseTable.bindTableDescriptor()'
            } else {
                def bindingText = fromBaseTableText.substring(bindingStart, bindingEnd)
                [
                        'TransactionControl.SERIALIZABLE_ISOLATION_LEVEL',
                        'DelosStorageProviderIds.isMvcc(',
                        'tableDescriptor.getStorageProviderName()',
                        'SERIALIZABLE isolation for delos_mvcc'
                ].each { token ->
                    if (!bindingText.contains(token)) {
                        failures << 'SERIALIZABLE binding boundary is missing token: ' + token
                    }
                }
                [
                        'tableDescriptor.getHeapConglomerateId()',
                        'getStaticCompiledConglomInfo(',
                        'StoredFormatIds.ACCESS_MVCC_V1_ID'
                ].each { token ->
                    if (bindingText.contains(token)) {
                        failures << 'Logical descriptor binding must not dereference physical conglomerate state: ' + token
                    }
                }
            }

            [
                    'testHeapSerializableViewBindingRemainsSupported',
                    'create view heap_serializable_v as',
                    'union all select id, value from heap_serializable_right',
                    'testMvccSerializableViewRejectsOnUnderlyingBaseTable',
                    'create view mvcc_serializable_v as',
                    'assertUnsupported(() -> assertRows(connection,'
            ].each { token ->
                if (!semanticsTestText.contains(token)) {
                    failures << 'SERIALIZABLE view-binding proof is missing token: ' + token
                }
            }

            [
                    "'runDelosMvccSerializableSemanticsTest'",
                    'MvccSqlSerializableSemanticsTest.class'
            ].each { token ->
                if (!testsBuildText.contains(token)) {
                    failures << 'Focused SERIALIZABLE semantics task wiring is missing token: ' + token
                }
            }

            int s0Index = staticAnalysisText.lastIndexOf(
                    "tasks.register('s0CloseoutVerification')")
            if (s0Index < 0
                    || !staticAnalysisText.substring(s0Index).contains(
                            "'delosMvccSerializableBindingBoundaryStaticAnalysis'")) {
                failures << 'S0 must include the MVCC SERIALIZABLE binding-boundary static gate'
            }
        }

        def reportFile = layout.buildDirectory.file(
                'reports/delosdb/mvcc-serializable-binding-boundary-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB MVCC SERIALIZABLE binding boundary static analysis')
            writer.println('===========================================================')
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'DelosDB MVCC SERIALIZABLE binding boundary static analysis failed. Report: '
                            + reportFile)
        }
        logger.lifecycle(
                'DelosDB MVCC SERIALIZABLE binding boundary static analysis passed. Report: {}',
                reportFile)
    }
}

