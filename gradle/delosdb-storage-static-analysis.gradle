def delosPageCodecAlgorithmManifestFile = file('gradle/static-analysis/delosdb-page-codec-algorithms.txt')

def delosLoadPageCodecAlgorithmRows = {
    if (!delosPageCodecAlgorithmManifestFile.exists()) {
        throw new GradleException('Missing DelosDB page codec algorithm manifest: ' + delosPageCodecAlgorithmManifestFile)
    }
    def rows = []
    delosPageCodecAlgorithmManifestFile.readLines('UTF-8').eachWithIndex { String line, int index ->
        def trimmed = line.trim()
        if (!trimmed || trimmed.startsWith('#')) {
            return
        }
        def parts = line.split('\\|', -1).collect { it.trim() }
        if (parts.size() != 6) {
            throw new GradleException('Malformed page codec algorithm line ' + (index + 1) + ': expected 6 pipe-delimited fields')
        }
        rows << [id: parts[0], path: parts[1], marker: parts[2], category: parts[3], reference: parts[4], risk: parts[5]]
    }
    rows
}

