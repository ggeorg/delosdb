                if (!roadmap.contains(token)) failures << 'Roadmap is missing Stage 8.1 token: ' + token
            }
            def s0 = staticText.substring(staticText.lastIndexOf("tasks.register('s0CloseoutVerification')"))
            if (!s0.contains("'delosSharedStoragePositionalIoStaticAnalysis'")) {
