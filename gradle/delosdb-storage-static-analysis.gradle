                }
            }
            requireTokens('Mixed heap/MVCC SQL proof', sqlTestText, [
                    'create table " + heapTable + " (id int primary key, name varchar(64))',
                    'using delos_mvcc',
                    'connection.rollback(savepoint)',
                    'delete from mvcc_t where id = 1',
                    'delete from heap_t where id = 1',
                    'heap-only',
                    'jdbc:derby:memory:'
            ])
            requireTokens('Mixed heap/MVCC crash proof', sqlTestText, [
