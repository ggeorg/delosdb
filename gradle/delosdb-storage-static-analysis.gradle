                'Transactional DDL crash schedules must be installed after setup-runtime shutdown and before reopen')
        DelosDbStaticAnalysisSupport.require(failures,
                testBuildText.contains("'runDelosMvccTransactionalDdlTest'")
                        && testBuildText.contains('MvccSqlTransactionalDdlTest.class')
                        && testBuildText.contains('MvccTransactionalDdlCrashTest.class'),
