        def forbiddenRootRuntimeFragments = [
                'ext.delosdbRuntimeJarArtifacts = [',
                'def delosdbRuntimeJarArtifacts = [',
                'def runtimeJarArtifacts = [',
                'def runtimeJarNames = [',
                "tasks.register('jars')",
                'tasks.register("jars")'
        ]
        forbiddenRootRuntimeFragments.each { fragment ->
            if (rootText.contains(fragment)) {
                failures << "Root build.gradle must not duplicate runtime artifact model fragment: ${fragment}"
            }
        }

        delosRuntimeArtifactModelRequire(failures, runtimeText.contains('ext.delosdbRuntimeJarArtifacts = ['),
                'Runtime artifact convention script must declare ext.delosdbRuntimeJarArtifacts')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains('ext.delosdbAssembledSupportJarArtifacts = ['),
