                            'RawStore MVCC clearLocalState section'),
                    ['snapshotLease.close()', 'boundary.close()', 'vacuumBoundaries.clear()',
                     'orderedIndexGenerations.clear()', 'vacuumMutation = false'])

            requireTokens('Unconditional inherited purge dispatch', conglomerateText, [
                    'public void purgeConglomerate(',
                    'MvccRawStoreTable.Descriptor currentTable = requireTable()',
                    'MvccRawStoreTransactionContext context = requireRuntime().context(',
                    'context.beforeVacuum(currentTable)',
                    'MvccRawStoreVacuum.vacuum(',
                    'context.vacuumHorizon()',
