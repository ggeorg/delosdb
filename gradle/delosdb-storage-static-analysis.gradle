        def docsText = new File(delosRepositoryRoot, 'docs/EXTERNAL-VALIDATION.md').exists()
                ? new File(delosRepositoryRoot, 'docs/EXTERNAL-VALIDATION.md').getText('UTF-8')
                : ''
        ['delosSqlancerProfileSkeleton', 'delosdb.sqlancer.profile.command',
         'benchmarks/sqlancer/delosdb-mvcc'].each { marker ->
            if (!docsText.contains(marker)) {
                failures << 'External validation docs missing SQLancer profile marker: ' + marker
            }
        }

        def staticText = new File(delosRepositoryRoot, 'gradle/delosdb-storage-static-analysis.gradle').getText('UTF-8')
        def s0Index = staticText.lastIndexOf("tasks.register('s0CloseoutVerification')")
        if (s0Index >= 0) {
            def s0Text = staticText.substring(s0Index)
            if (s0Text.contains('delosSqlancerProfileSkeleton')) {
                failures << 'SQLancer profile skeleton task must not be wired into S0'
            }
        }

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/sqlancer-profile-skeleton.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB SQLancer profile skeleton')
            writer.println('==================================')
