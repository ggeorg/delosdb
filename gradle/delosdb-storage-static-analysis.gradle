        delosRuntimeArtifactModelRequire(failures, runtimeText.contains('META-INF/services/org.apache.derby.iapi.store.types.DelosStorageProviderFactory'),
                'verifyDelosRuntimeStorageProviders must check the DelosStorageProviderFactory service file')
        delosRuntimeArtifactModelRequire(failures, runtimeText.contains("expectedProviderName = 'delos_mvcc'"),
                'verifyDelosRuntimeStorageProviders must check providerName() == delos_mvcc')

        delosRuntimeArtifactModelRequire(failures, testsText.contains('rootProject.ext.delosdbRuntimeJarFiles.call()'),
