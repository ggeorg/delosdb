        ]
        def failures = []
        if (!profileRoot.isDirectory()) {
            failures << 'Missing SQLancer profile root: ' + profileRoot
        }
        profileFiles.each { sourceFile ->
            if (!sourceFile.exists()) {
                failures << 'Missing SQLancer profile skeleton file: ' + sourceFile
            }
        }

        def readFile = { File sourceFile -> sourceFile.exists() ? sourceFile.getText('UTF-8') : '' }
        def readmeText = readFile(new File(delosRepositoryRoot, 'benchmarks/sqlancer/delosdb-mvcc/README.md'))
        ['delosSqlancerProfileSkeleton', 'delosdb.sqlancer.profile.command',
         'delosdb-mvcc-profile.properties', 'delosdb-mvcc-smoke.sql',
         'DELOSDB_SQLANCER_PROFILE_SKELETON'].each { marker ->
            if (!readmeText.contains(marker)) {
