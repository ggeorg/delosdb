        def rootText = rootBuild.exists() ? rootBuild.getText('UTF-8') : ''
        def testsText = testsBuild.exists() ? testsBuild.getText('UTF-8') : ''
        def runtimeText = runtimeArtifactsScript.exists() ? runtimeArtifactsScript.getText('UTF-8') : ''

        delosRuntimeArtifactModelRequire(failures, runtimeArtifactsScript.isFile(),
