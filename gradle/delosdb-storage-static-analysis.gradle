                include 'delosdb-*/src/main/java/**/DelosStorageProviderFactory.java'
            }.files
            if (!retiredProviderTypes.isEmpty()) {
                failures << 'Retired DelosStorageProviderFactory contract remains: ' + retiredProviderTypes
            }

