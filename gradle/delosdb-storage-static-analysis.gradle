tasks.register('delosSqlancerProfileSkeleton') {
    group = 'verification'
    description = 'Validates the opt-in SQLancer profile skeleton and optionally runs -Pdelosdb.sqlancer.profile.command.'
    doLast {
        def profileRoot = new File(delosRepositoryRoot, 'benchmarks/sqlancer/delosdb-mvcc')
