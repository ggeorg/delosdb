def delosDeadCodeCandidateFile = file('gradle/static-analysis/delosdb-dead-code-candidates.txt')

def delosDeadCodeSearchRoots = [
        'delosdb-storage-api/src/main/java',
        'delosdb-storage-bridge/src/main/java',
        'delosdb-storage-mvcc/src/main/java',
        'delosdb-storage-mvcc/src/test/java',
        'delosdb-storage-io/src/main/java',
        'delosdb-server/src/main/java',
        'delosdb-client/src/main/java',
        'delosdb-tools/src/main/java',
        'delosdb-tests/src/test/java'
]

def delosDeadCodeSearchFiles = {
    def includes = ['**/*.java', '**/*.properties', '**/META-INF/services/**', '**/module-info.java']
    delosDeadCodeSearchRoots.collect { file(it) }
            .findAll { it.exists() }
            .collectMany { root ->
                fileTree(root) {
                    includes.each { include it }
                }.files
            }
            .sort { a, b -> a.path <=> b.path }
}

def delosLoadDeadCodeCandidates = {
    if (!delosDeadCodeCandidateFile.exists()) {
        return []
    }
    delosDeadCodeCandidateFile.readLines('UTF-8')
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') }
            .collect { line ->
                def parts = line.split('\\|', 3)
                if (parts.length < 2) {
                    throw new GradleException('Malformed dead-code candidate line: ' + line)
                }
                [
                        path  : parts[0].trim(),
                        symbol: parts[1].trim(),
                        reason: parts.length == 3 ? parts[2].trim() : ''
                ]
            }
}

tasks.register('delosDeadCodeCandidateReport') {
    group = 'verification'
    description = 'Reports curated DelosDB dead-code/stale-code candidates without deleting them.'

    inputs.file(delosDeadCodeCandidateFile).optional()
    inputs.files(delosDeadCodeSearchFiles())
    outputs.file(layout.buildDirectory.file('reports/delosdb/dead-code-candidates.txt'))

    doLast {
        def candidates = delosLoadDeadCodeCandidates()
        def searchFiles = delosDeadCodeSearchFiles()
        def reportFile = layout.buildDirectory.file('reports/delosdb/dead-code-candidates.txt').get().asFile
        reportFile.parentFile.mkdirs()

        def rows = candidates.collect { candidate ->
            def candidateFile = file(candidate.path)
            def references = []
            if (candidateFile.exists()) {
                searchFiles.findAll { it.exists() && it.canonicalFile != candidateFile.canonicalFile }.each { sourceFile ->
                    int lineNumber = 0
                    sourceFile.eachLine('UTF-8') { line ->
                        lineNumber++
                        def symbolPattern = ~('(?<![A-Za-z0-9_$])' + Pattern.quote(candidate.symbol) + '(?![A-Za-z0-9_$])')
                        if (symbolPattern.matcher(line).find()) {
                            references << [file: sourceFile, lineNumber: lineNumber, line: delosStorageNormalize(line)]
                        }
                    }
                }
            }
            [candidate: candidate, exists: candidateFile.exists(), references: references]
        }

        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB dead-code / stale-code candidate report')
            writer.println('================================================')
            writer.println()
            writer.println('This is an evidence report, not a deletion gate.')
            writer.println('ServiceLoader entries, public APIs, JPMS exports, tests, and reflection can make text-only dead-code scans noisy.')
            writer.println()
            writer.println('Candidates configured: ' + candidates.size())
            writer.println()
            writer.println('Search roots:')
            delosDeadCodeSearchRoots.each { writer.println('  - ' + it) }
            writer.println()

            rows.each { row ->
                def candidate = row.candidate
                writer.println(candidate.path)
                writer.println('  symbol:     ' + candidate.symbol)
                writer.println('  exists:     ' + row.exists)
                writer.println('  references: ' + row.references.size())
                if (candidate.reason) {
                    writer.println('  reason:     ' + candidate.reason)
                }
                if (row.exists && row.references.isEmpty()) {
                    writer.println('  status:     deletion-review candidate')
                } else if (!row.exists) {
                    writer.println('  status:     already removed or renamed')
                } else {
                    writer.println('  status:     referenced; do not delete without deeper review')
                    row.references.take(10).each { ref ->
                        def refPath = rootProject.projectDir.toPath().relativize(ref.file.toPath()).toString().replace(File.separatorChar, '/' as char)
                        writer.println('    - ' + refPath + ':' + ref.lineNumber + ': ' + ref.line)
                    }
                    if (row.references.size() > 10) {
                        writer.println('    ... ' + (row.references.size() - 10) + ' more reference(s) omitted')
                    }
                }
                writer.println()
            }
        }

        logger.lifecycle('DelosDB dead-code candidate report written: {}', reportFile)
    }
}



def delosHeapRawStoreDuplicateClassificationFile = file('gradle/static-analysis/delosdb-heap-rawstore-duplicate-classification.txt')

def delosHeapRawStoreDuplicateDecisions = ['KEEP', 'CONSOLIDATE', 'DEFER'] as Set

def delosLoadHeapRawStoreDuplicateClassifications = {
    if (!delosHeapRawStoreDuplicateClassificationFile.exists()) {
        return []
    }

    def rows = []
    int lineNumber = 0
    delosHeapRawStoreDuplicateClassificationFile.readLines('UTF-8').each { rawLine ->
        lineNumber++
        def line = rawLine.trim()
        if (!line || line.startsWith('#')) {
            return
        }
        def parts = line.split('\\|', -1).collect { it.trim() }
        if (parts.size() != 6) {
            throw new GradleException('Malformed heap/raw-store duplicate classification line ' + lineNumber + ': expected 6 pipe-delimited fields')
        }
        if (!delosHeapRawStoreDuplicateDecisions.contains(parts[1])) {
            throw new GradleException('Malformed heap/raw-store duplicate classification line ' + lineNumber + ': unknown decision ' + parts[1])
        }
        def files = parts[3].split(',').collect { it.trim() }.findAll { it }
        if (files.isEmpty()) {
            throw new GradleException('Malformed heap/raw-store duplicate classification line ' + lineNumber + ': no files listed')
        }
        rows << [
                id        : parts[0],
                decision  : parts[1],
                scope     : parts[2],
                files     : files,
                reason    : parts[4],
                nextAction: parts[5],
                lineNumber: lineNumber
        ]
    }
    rows
}

tasks.register('delosHeapRawStoreDuplicateClassificationReport') {
    group = 'verification'
    description = 'Reports curated duplicate-code classification for inherited Derby heap/raw-store code.'

    inputs.file(delosHeapRawStoreDuplicateClassificationFile).optional()
    outputs.file(layout.buildDirectory.file('reports/delosdb/heap-rawstore-duplicate-classification.txt'))

    doLast {
        def rows = delosLoadHeapRawStoreDuplicateClassifications()
        def ids = [] as Set
        def duplicateIds = []
        def missingFiles = []
        rows.each { row ->
            if (!ids.add(row.id)) {
                duplicateIds << row.id
            }
            row.files.each { relativePath ->
                if (!file(relativePath).exists()) {
                    missingFiles << [id: row.id, path: relativePath]
                }
            }
        }

        def counts = delosHeapRawStoreDuplicateDecisions.collectEntries { decision ->
            [decision, rows.count { it.decision == decision }]
        }
        def missingDecisions = delosHeapRawStoreDuplicateDecisions.findAll { decision -> counts[decision] == 0 }

        def reportFile = layout.buildDirectory.file('reports/delosdb/heap-rawstore-duplicate-classification.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB inherited heap/raw-store duplicate-code classification')
            writer.println('===============================================================')
            writer.println()
            writer.println('This report classifies duplicate-looking inherited Derby heap/raw-store code.')
            writer.println('It does not refactor code, delete code, or prove deletion safety.')
            writer.println()
            writer.println('Rows: ' + rows.size())
            delosHeapRawStoreDuplicateDecisions.sort().each { decision ->
                writer.println('  ' + decision + ': ' + counts[decision])
            }
            writer.println()
            engineeringRows.each { row ->
                writer.println(row.id + ' [' + row.decision + '] ' + row.scope)
                writer.println('  reason:      ' + row.reason)
                writer.println('  next action: ' + row.nextAction)
                writer.println('  files:')
                row.files.each { relativePath -> writer.println('    - ' + relativePath) }
                writer.println()
            }

            if (!duplicateIds.isEmpty() || !missingFiles.isEmpty() || !missingDecisions.isEmpty()) {
                writer.println('Validation failures:')
                duplicateIds.each { id -> writer.println('  duplicate id: ' + id) }
                missingFiles.each { missing -> writer.println('  missing file for ' + missing.id + ': ' + missing.path) }
                missingDecisions.each { decision -> writer.println('  missing decision category: ' + decision) }
            } else {
                writer.println('Classification file validated.')
            }
        }

        if (!duplicateIds.isEmpty() || !missingFiles.isEmpty() || !missingDecisions.isEmpty()) {
            throw new GradleException('Heap/raw-store duplicate classification validation failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB heap/raw-store duplicate classification written: {}', reportFile)
    }
}



def delosDerbyModuleParityFile = file('gradle/static-analysis/delosdb-derby-module-parity.txt')

def delosDerbyModuleParityDecisions = ['KEEP_DERBY_PEER', 'DELOSDB_EXTENSION'] as Set

def delosLoadDerbyModuleParityRows = {
    if (!delosDerbyModuleParityFile.exists()) {
        throw new GradleException('Missing Derby module parity classification file: ' + delosDerbyModuleParityFile)
    }

    def rows = []
    int lineNumber = 0
    delosDerbyModuleParityFile.readLines('UTF-8').each { rawLine ->
        lineNumber++
        def line = rawLine.trim()
        if (!line || line.startsWith('#')) {
            return
        }
        def parts = line.split('\\|', -1).collect { it.trim() }
        if (parts.size() != 6) {
            throw new GradleException('Malformed Derby module parity line ' + lineNumber + ': expected 6 pipe-delimited fields')
        }
        if (!delosDerbyModuleParityDecisions.contains(parts[1])) {
            throw new GradleException('Malformed Derby module parity line ' + lineNumber + ': unknown decision ' + parts[1])
        }
        if (!parts[3].startsWith(':delosdb-')) {
            throw new GradleException('Malformed Derby module parity line ' + lineNumber + ': DelosDB module must be a :delosdb-* project path')
        }
        rows << [
                id          : parts[0],
                decision    : parts[1],
                derbyRoot   : parts[2],
                delosModule : parts[3],
                artifactRole: parts[4],
                reason      : parts[5],
                lineNumber  : lineNumber
        ]
    }
    rows
}

tasks.register('delosDerbyModuleParityStaticAnalysis') {
    group = 'verification'
    description = 'Validates Derby product/module parity decisions for cleanup/consolidation work.'

    inputs.file(delosDerbyModuleParityFile)
    inputs.file('settings.gradle')
    inputs.file('docs/CLEANUP-CONSOLIDATION.md')
    outputs.file(layout.buildDirectory.file('reports/delosdb/derby-module-parity-static-analysis.txt'))

    doLast {
        def rows = delosLoadDerbyModuleParityRows()
        def settingsText = file('settings.gradle').getText('UTF-8')
        def cleanupDoc = file('docs/CLEANUP-CONSOLIDATION.md')
        def cleanupDocText = cleanupDoc.exists() ? cleanupDoc.getText('UTF-8') : ''
        def failures = []
        def ids = [] as Set
        def modules = [] as Set

        rows.each { row ->
            if (!ids.add(row.id)) {
                failures << 'Duplicate Derby module parity id: ' + row.id
            }
            if (!modules.add(row.delosModule)) {
                failures << 'Duplicate Derby module parity DelosDB module: ' + row.delosModule
            }
            def projectName = row.delosModule.substring(1)
            if (!settingsText.contains("include '" + projectName + "'")) {
                failures << 'Derby module parity row references a project missing from settings.gradle: ' + row.delosModule
            }
            if (row.decision == 'KEEP_DERBY_PEER' && !row.derbyRoot.startsWith('java/')) {
                failures << 'KEEP_DERBY_PEER row must name the original Derby java/ source root: ' + row.id
            }
            if (row.decision == 'DELOSDB_EXTENSION' && row.derbyRoot != 'none') {
                failures << 'DELOSDB_EXTENSION row must use derby_source_root=none: ' + row.id
            }
        }

        def requiredDerbyPeers = [
                ':delosdb-engine',
                ':delosdb-client',
                ':delosdb-tools',
                ':delosdb-server',
                ':delosdb-runner',
                ':delosdb-optionaltools',
                ':delosdb-commons',
                ':delosdb-tests',
                ':delosdb-pptesting',
                ':delosdb-storeless',
                ':delosdb-osgi-stub',
                ':delosdb-locales',
                ':delosdb-demos',
                ':delosdb-buildtools'
        ]
        requiredDerbyPeers.each { moduleName ->
            def row = rows.find { it.delosModule == moduleName }
            if (row == null) {
                failures << 'Missing Derby module parity row for ' + moduleName
            } else if (row.decision != 'KEEP_DERBY_PEER') {
                failures << 'Original Derby peer module must be classified KEEP_DERBY_PEER: ' + moduleName
            }
        }

        def requiredExtensions = [
                ':delosdb-runtime-api',
                ':delosdb-annotations',
                ':delosdb-spi',
                ':delosdb-storage-io',
                ':delosdb-storage-api',
                ':delosdb-derby-store-api',
                ':delosdb-storage-derby',
                ':delosdb-storage-bridge',
                ':delosdb-storage-mvcc'
        ]
        requiredExtensions.each { moduleName ->
            def row = rows.find { it.delosModule == moduleName }
            if (row == null) {
                failures << 'Missing DelosDB extension module parity row for ' + moduleName
            } else if (row.decision != 'DELOSDB_EXTENSION') {
                failures << 'DelosDB-only module must be classified DELOSDB_EXTENSION: ' + moduleName
            }
        }

        def forbiddenDocPhrases = [
                'These modules may deserve consolidation',
                'Tools/server/runner/optionaltools module-boundary review',
                ':delosdb-tools\n:delosdb-runner\n:delosdb-optionaltools\n:delosdb-server'
        ]
        forbiddenDocPhrases.each { phrase ->
            if (cleanupDocText.contains(phrase)) {
                failures << 'Cleanup doc still contains obsolete consolidation wording: ' + phrase
            }
        }
        if (!cleanupDocText.contains('Do not consolidate these modules as part of cleanup')) {
            failures << 'Cleanup doc must explicitly preserve Derby peer modules from cleanup consolidation.'
        }
        if (!cleanupDocText.contains('delosDerbyModuleParityStaticAnalysis')) {
            failures << 'Cleanup doc must mention the Derby module parity static gate.'
        }

        def counts = delosDerbyModuleParityDecisions.collectEntries { decision ->
            [decision, rows.count { it.decision == decision }]
        }
        def reportFile = layout.buildDirectory.file('reports/delosdb/derby-module-parity-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB Derby module parity static analysis')
            writer.println('==========================================')
            writer.println()
            writer.println('Rows: ' + rows.size())
            delosDerbyModuleParityDecisions.sort().each { decision ->
                writer.println('  ' + decision + ': ' + counts[decision])
            }
            writer.println()
            engineeringRows.each { row ->
                writer.println(row.id + ' [' + row.decision + '] ' + row.delosModule)
                writer.println('  derby root:    ' + row.derbyRoot)
                writer.println('  artifact/role: ' + row.artifactRole)
                writer.println('  reason:        ' + row.reason)
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('Derby module parity checks passed.')
            } else {
                writer.println('Derby module parity failures:')
                failures.each { failure -> writer.println('  - ' + failure) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('DelosDB Derby module parity static analysis failed. Report: ' + reportFile)
        }

        logger.lifecycle('DelosDB Derby module parity static analysis passed. Report: {}', reportFile)
    }
}

def delosRuntimeArtifactModelFiles = [
