                    }
                }
            }
        }

        def reportFile = layout.buildDirectory.file('reports/delosdb/storage-inspector-consolidation-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB storage inspector consolidation static analysis')
            writer.println('======================================================')
            writer.println()
            writer.println('Proof rows: ' + engineeringRows.size() + ' engineering rows from ' + rows.size() + ' manifest rows')
            writer.println()
            delosStorageInspectorConsolidationContracts.sort().each { contract ->
                writer.println('  ' + contract + ': ' + rows.count { it.contract == contract })
            }
            writer.println()
            engineeringRows.each { row ->
                writer.println(row.id + ' [' + row.contract + '] ' + row.path)
                writer.println('  marker: ' + row.marker)
                writer.println('  reason: ' + row.reason)
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('Storage inspector consolidation proof points validated.')
            } else {
                writer.println('Validation failures:')
                failures.each { failure -> writer.println('  - ' + failure) }
            }
