tasks.register('delosPerformanceConcurrencyValidationStaticAnalysis') {
    group = 'verification'
    description = 'Validates Phase P performance/concurrency validation harnesses and keeps long-running tools outside S0.'

    inputs.file(delosPerformanceConcurrencyValidationFile)
    inputs.file('docs/PERFORMANCE-CONCURRENCY-VALIDATION.md')
    inputs.file('delosdb-storage-mvcc/build.gradle')
    inputs.file('gradle/delosdb-storage-static-analysis.gradle')
    outputs.file(layout.buildDirectory.file('reports/delosdb/performance-concurrency-validation-static-analysis.txt'))

    doLast {
        def rows = delosLoadPerformanceConcurrencyValidationRows()
        def failures = []
        def ids = [] as Set
        def categories = [] as Set
        def requiredCategories = [
                'TASK_SLOT',
                'MVCC_TASK',
                'JAVA_HARNESS',
                'S0_BOUNDARY'
        ] as Set
        def engineeringRows = rows.findAll { row ->
            !['ROADMAP_STATUS', 'VALIDATION_DOCUMENT', 'COMMIT_MESSAGE'].contains(row.category)
        }
        engineeringRows.each { row ->
            if (!ids.add(row.id)) {
                failures << 'Duplicate Phase P validation id: ' + row.id
            }
            categories.add(row.category)
            def proofFile = new File(delosRepositoryRoot, row.path)
            if (!proofFile.exists()) {
                failures << 'Phase P proof path does not exist for ' + row.id + ': ' + row.path
                return
            }
            def body = proofFile.getText('UTF-8')
            if (!body.contains(row.marker)) {
                failures << 'Phase P marker missing for ' + row.id + ': ' + row.marker
            }
            if (row.reason.length() < 60) {
                failures << 'Phase P validation reason is too thin for ' + row.id
            }
        }
        requiredCategories.each { requiredCategory ->
            if (!categories.contains(requiredCategory)) {
                failures << 'Phase P validation manifest missing category: ' + requiredCategory
            }
        }

        def staticText = new File(delosRepositoryRoot, 'gradle/delosdb-storage-static-analysis.gradle').getText('UTF-8')
        [
                'tasks.register(\'delosJmhMicrobenchmarks\')',
                'tasks.register(\'delosJcstressConcurrencyValidation\')',
                'tasks.register(\'delosSqlancerMvccValidation\')',
                'tasks.register(\'delosTwoSidedMvccWorkloadBenchmark\')',
                'tasks.register(\'delosLongReaderVacuumSoak\')'
        ].each { markerText ->
            if (!staticText.contains(markerText)) {
                failures << 'Phase P root validation task is missing: ' + markerText
            }
        }

        def s0Text = staticText.substring(staticText.lastIndexOf("tasks.register('s0CloseoutVerification')"))
        [
                'delosJmhMicrobenchmarks',
                'delosJcstressConcurrencyValidation',
                'delosSqlancerMvccValidation',
                'delosTwoSidedMvccWorkloadBenchmark',
                'delosLongReaderVacuumSoak'
        ].each { taskName ->
            if (s0Text.contains(taskName)) {
                failures << 'Phase P long-running/external validation task must not be wired into S0: ' + taskName
            }
        }
        def storageMvccBuildText = new File(delosRepositoryRoot, 'delosdb-storage-mvcc/build.gradle').getText('UTF-8')
        [
                'runDelosMvccBufferWorkloadInvariantTest',
                'runDelosMvccConcurrencyValidation',
                'runDelosMvccLongReaderValidation'
        ].each { taskName ->
            if (!storageMvccBuildText.contains(taskName)) {
                failures << 'Phase P MVCC validation task missing from delosdb-storage-mvcc/build.gradle: ' + taskName
            }
        }
        def checkSection = storageMvccBuildText.substring(storageMvccBuildText.indexOf("tasks.named('check')"))
        [
                'runDelosMvccBufferWorkloadInvariantTest',
                'runDelosMvccConcurrencyValidation',
                'runDelosMvccLongReaderValidation'
        ].each { taskName ->
            if (checkSection.contains(taskName)) {
                failures << 'Phase P validation task must not be wired into :delosdb-storage-mvcc:check: ' + taskName
            }
        }

        // Phase P validates task slots and Java harnesses only; docs/roadmap prose stays advisory.

        def reportFile = new File(delosBuildRoot, 'reports/delosdb/performance-concurrency-validation-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB performance/concurrency validation static analysis')
            writer.println('==========================================================')
            writer.println()
            writer.println('Proof rows: ' + engineeringRows.size() + ' engineering rows from ' + rows.size() + ' manifest rows')
            writer.println('Categories: ' + categories.sort().join(', '))
            writer.println()
            engineeringRows.each { row ->
                writer.println(row.id + ' [' + row.category + '] ' + row.path)
                writer.println('  marker: ' + row.marker)
                writer.println('  reason: ' + row.reason)
                writer.println()
            }
            if (failures.isEmpty()) {
                writer.println('Status: PASS')
            } else {
                writer.println('Status: FAIL')
                failures.each { writer.println('- ' + it) }
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException('Performance/concurrency validation static analysis failed. Report: ' + reportFile)
        }
        println 'DelosDB performance/concurrency validation static analysis passed. Report: ' + reportFile
    }
}


