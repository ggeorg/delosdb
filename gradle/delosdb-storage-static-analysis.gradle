            [
                    'testMixedHeapMvccCommitRollbackSavepointAndReopen',
                    'testMixedHeapMvccCommitSurvivesBothRawStoreCrashBoundaries',
                    'testMemoryDatabaseSupportsMixedHeapMvccTransactions'
            ].each { methodName ->
