                            'RawStore MVCC beforeWrite section'),
                    ['DelosStorageTransactionRegistry.registerRawStoreOwnedMvcc(transactionManager)',
                            'ensureTransactionId()'])
            requireOrdered('Precommit database-wide commit publication',
                    section(contextText, 'public void beforeCommit(', 'public void afterCommit(',
                            'RawStore MVCC beforeCommit section'),
                    ['runtime.reserveCommitSequence(rawTransaction)',
                            'MvccRawStoreTable.stampPendingVersions(',
                            'runtime.stageCommittedHighWater(rawTransaction, reservedCommitSequence)',
                            'AFTER_STAMP_BEFORE_RAW_COMMIT'])

