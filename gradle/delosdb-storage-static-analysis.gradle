        def conglomerateText = read(3)
        def runtimeText = read(4)
        def filesText = read(5)
        def operationText = read(6)
        def undoText = read(7)
        def storedIdsText = read(8)
        def registeredIdsText = read(9)
        def sqlTestText = read(10)
        def crashTestText = read(11)
        def testBuildText = read(12)
        def failureRegistryText = read(13)
        def transactionLifecycleTestText = read(14)

        DelosDbStaticAnalysisSupport.require(failures,
                registryText.contains('return !writersFor(ownerTransaction).isEmpty()')
                        && registryText.contains(
                                '|| !lifecycleActionsFor(ownerTransaction).isEmpty();')
                        && registryText.contains(
                                'boolean externalMvccWrite = !writers.isEmpty();')
                        && registryText.contains(
                                'boolean requiresRawStoreDecision = externalMvccWrite || !lifecycleActions.isEmpty();')
                        && registryText.contains('if (externalMvccWrite)')
                        && registryText.contains(
                                'rawStoreParticipant.stageMvccConglomerateLifecycle(action.lifecycle());'),
                'Every retained external MVCC write and surviving DDL lifecycle must use the raw-store decision')
        DelosDbStaticAnalysisSupport.require(failures,
                registryText.contains('registerRawStoreOwnedMvcc(Object ownerTransaction)')
                        && registryText.contains('RAW_STORE_OWNED_MVCC.containsKey(requiredOwner)')
                        && registryText.count('throw mixedMvccStorageAuthorities();') >= 2
                        && transactionLifecycleTestText.contains(
                                'rawStoreOwnedMvccUsesInheritedCommitWithoutExternalDecision')
                        && transactionLifecycleTestText.contains(
                                'assertFalse(DelosStorageTransactionRegistry.requiresRawStoreDecision')
                        && transactionLifecycleTestText.contains(
                                'rawStoreOwnedAndRetainedMvccWritersCannotMix'),
                'RawStore-owned MVCC must bypass the retained external coordinator and fail before mixed-authority mutation')
        DelosDbStaticAnalysisSupport.require(failures,
                actionText.contains('DelosMvccConglomerateLifecycle lifecycle();'),
                'Lifecycle actions must expose the exact raw-log lifecycle identity')
        DelosDbStaticAnalysisSupport.require(failures,
                factoryText.contains('currentRuntime.stageCreate(lifecycle);')
                        && factoryText.contains('registerLifecycleAction(')
                        && factoryText.contains('MvccConglomerateLifecycleAction.create('),
                'MVCC CREATE must stage pending state and register transaction-owned completion')
        DelosDbStaticAnalysisSupport.require(failures,
                conglomerateText.contains('MvccConglomerateLifecycleAction.drop(')
                        && !conglomerateText.contains('requireRuntime().drop(')
                        && !conglomerateText.contains('dropDurableState();'),
                'MVCC DROP must not physically retire provider state before raw-store commit')
        DelosDbStaticAnalysisSupport.require(failures,
                runtimeText.contains('recoverInterruptedCreates(this.databaseDirectory);')
                        && runtimeText.contains('void abortCreate(')
                        && runtimeText.contains('void completeDrop(')
                        && runtimeText.contains('private void retireState(')
                        && runtimeText.contains(
                                'DelosStorageTransactionRegistry.abortTableParticipants(currentState.table());')
                        && runtimeText.count('retireState(identity, currentState);') == 2,
                'Database runtime must release table participants before CREATE abort or committed DROP closes provider state')
        DelosDbStaticAnalysisSupport.require(failures,
                filesText.contains('A lone pending marker has no durable raw-store commit')
                        && filesText.contains('deleteStateFiles(databaseDirectory, lifecycle);')
                        && filesText.contains('database-transactions.txstatus'),
                'External lifecycle cleanup must distinguish pending/committed CREATE and compact final status')
        DelosDbStaticAnalysisSupport.require(failures,
                operationText.contains('implements Undoable')
                        && operationText.contains('rawTransaction.handlesPostTerminationWork()')
                        && !operationText.contains('addPostCommitWork(')
                        && operationText.contains('case DROP -> deleteStateFiles')
                        && undoText.contains('applyUndo(transaction, lifecycle);'),
                'Raw lifecycle must defer live publication until after raw commit and recover through redo')
        DelosDbStaticAnalysisSupport.require(failures,
                storedIdsText.contains('LOGOP_DELOS_MVCC_CONGLOMERATE_LIFECYCLE')
                        && storedIdsText.contains('(MIN_ID_2 + 483)')
                        && registeredIdsText.contains('DelosMvccConglomerateLifecycleOperation')
                        && registeredIdsText.contains('DelosMvccConglomerateLifecycleUndoOperation'),
                'Transactional MVCC DDL log records must remain registered formatables')

        [
                'testCreateMvccRollbackRemovesProviderStateAcrossReopen',
                'testDropMvccRollbackPreservesRowsAcrossReopen',
                'testDropMvccCommitRetiresProviderStateAcrossReopen',
                'testMvccIndexCreateAndDropRollbackAcrossReopen',
                'testMvccDmlAndTransactionalDdlShareOneRawDecision',
                'testCreateAndDropOrderWithSameTableDml',
                'testDdlPlusMvccRawStoreFailureRollsBackBoth',
                'testCreateAndDropLifecycleRollBackToSavepoint'
        ].each { methodName ->
            DelosDbStaticAnalysisSupport.require(failures,
                    sqlTestText.contains(methodName),
                    'Transactional MVCC DDL SQL proof is missing: ' + methodName)
        }
        [
                'testCreateBeforeRawCommitIsUndoneOnReopen',
                'testCreateAfterRawCommitIsRecoveredOnReopen',
                'testDropBeforeRawCommitPreservesTableOnReopen',
                'testDropAfterRawCommitRetiresTableOnReopen'
        ].each { methodName ->
            DelosDbStaticAnalysisSupport.require(failures,
                    crashTestText.contains(methodName),
                    'Transactional MVCC DDL process-halt proof is missing: ' + methodName)
        }
        DelosDbStaticAnalysisSupport.require(failures,
                failureRegistryText.contains('installFailureForTesting(')
                        && sqlTestText.contains('BEFORE_DERBY_RAW_STORE_COMMIT')
                        && sqlTestText.contains('if (!connection.isClosed())'),
                'Transactional DDL must retain a checked pre-raw-store-commit failure proof that tolerates Derby connection invalidation')
        DelosDbStaticAnalysisSupport.require(failures,
                crashTestText.contains('shutdownDatabase(database.toString());')
                        && crashTestText.indexOf('shutdownDatabase(database.toString());')
