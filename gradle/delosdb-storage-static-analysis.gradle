tasks.register('delosRuntimeArtifactModelStaticAnalysis') {
    group = 'verification'
    description = 'Fails if DelosDB runtime jar/provider packaging drifts back into duplicate hard-coded Gradle lists.'

    inputs.files(delosRuntimeArtifactModelFiles.collect { new File(delosRepositoryRoot, it) }.findAll { it.exists() })
    outputs.file(layout.buildDirectory.file('reports/delosdb/runtime-artifact-model-static-analysis.txt'))

    doLast {
        def failures = []
        def rootBuild = new File(delosRepositoryRoot, 'build.gradle')
        def testsBuild = new File(delosRepositoryRoot, 'delosdb-tests/build.gradle')
        def runtimeArtifactsScript = new File(delosRepositoryRoot, 'gradle/delosdb-runtime-artifacts.gradle')

        def rootText = rootBuild.exists() ? rootBuild.getText('UTF-8') : ''
        def testsText = testsBuild.exists() ? testsBuild.getText('UTF-8') : ''
        def runtimeText = runtimeArtifactsScript.exists() ? runtimeArtifactsScript.getText('UTF-8') : ''
        def buildTexts = delosRuntimeArtifactModelFiles
                .findAll { it.endsWith('/build.gradle') || it == 'build.gradle' }
                .collectEntries { relativePath ->
                    def buildFile = new File(delosRepositoryRoot, relativePath)
                    [(relativePath): buildFile.isFile() ? buildFile.getText('UTF-8') : '']
                }
        def productInfoScript = new File(delosRepositoryRoot, 'gradle/delosdb-product-info.gradle')
        def productInfoText = productInfoScript.isFile() ? productInfoScript.getText('UTF-8') : ''

        DelosDbStaticAnalysisSupport.require(failures, runtimeArtifactsScript.isFile(),
                'Missing runtime artifact convention script: gradle/delosdb-runtime-artifacts.gradle')
        DelosDbStaticAnalysisSupport.require(failures, rootText.contains("apply from: 'gradle/delosdb-runtime-artifacts.gradle'")
                        || rootText.contains('apply from: "gradle/delosdb-runtime-artifacts.gradle"'),
                'Root build.gradle must apply gradle/delosdb-runtime-artifacts.gradle')

        def forbiddenRootRuntimeFragments = [
                'ext.delosdbRuntimeJarArtifacts = [',
                'def delosdbRuntimeJarArtifacts = [',
                'def runtimeJarArtifacts = [',
                'def runtimeJarNames = [',
                "tasks.register('jars')",
                'tasks.register("jars")'
        ]
        forbiddenRootRuntimeFragments.each { fragment ->
            if (rootText.contains(fragment)) {
                failures << "Root build.gradle must not duplicate runtime artifact model fragment: ${fragment}"
            }
        }

        DelosDbStaticAnalysisSupport.require(failures, runtimeText.contains('ext.delosdbRuntimeJarArtifacts = ['),
                'Runtime artifact convention script must declare ext.delosdbRuntimeJarArtifacts')
        DelosDbStaticAnalysisSupport.require(failures, runtimeText.contains('ext.delosdbAssembledSupportJarArtifacts = ['),
                'Runtime artifact convention script must declare ext.delosdbAssembledSupportJarArtifacts')
        DelosDbStaticAnalysisSupport.require(failures, runtimeText.contains('ext.delosdbAssembledJarArtifacts'),
                'Runtime artifact convention script must derive ext.delosdbAssembledJarArtifacts')
        DelosDbStaticAnalysisSupport.require(failures, runtimeText.contains('ext.delosdbRuntimeJarNames'),
                'Runtime artifact convention script must derive ext.delosdbRuntimeJarNames')
        DelosDbStaticAnalysisSupport.require(failures, runtimeText.contains('ext.delosdbRuntimeJarFiles'),
                'Runtime artifact convention script must expose ext.delosdbRuntimeJarFiles')
        DelosDbStaticAnalysisSupport.require(failures, runtimeText.contains("tasks.register('jars')"),
                'Runtime artifact convention script must own the root :jars task')
        DelosDbStaticAnalysisSupport.require(failures, runtimeText.contains('project.ext.delosdbAssembledJarTaskPaths'),
                'Root :jars task must be derived from ext.delosdbAssembledJarTaskPaths')

        def runtimeArtifactSection = runtimeText.substring(
                runtimeText.indexOf('ext.delosdbRuntimeJarArtifacts = ['),
                runtimeText.indexOf('ext.delosdbAssembledSupportJarArtifacts = ['))
        def supportArtifactSection = runtimeText.substring(
                runtimeText.indexOf('ext.delosdbAssembledSupportJarArtifacts = ['),
                runtimeText.indexOf('ext.delosdbAssembledJarArtifacts'))
        DelosDbStaticAnalysisSupport.require(failures,
                !runtimeArtifactSection.contains('delosdb-storage-mvcc.jar')
                        && supportArtifactSection.contains('delosdb-storage-mvcc.jar'),
                'Production MVCC must be assembled as a provider patch artifact outside the current runtime jar list')
        DelosDbStaticAnalysisSupport.require(failures,
                !runtimeArtifactSection.contains('delosdb-storage-io.jar')
                        && !supportArtifactSection.contains('delosdb-storage-io.jar'),
                'Retired page-volume archive must remain outside root runtime and assembly models')
        DelosDbStaticAnalysisSupport.require(failures,
                supportArtifactSection.contains('delosdb-derby-store-api.jar'),
                'Inherited Derby/store contracts must remain modeled through delosdb-derby-store-api.jar')
        DelosDbStaticAnalysisSupport.require(failures,
                !runtimeArtifactSection.contains('delosdb-storage-api.jar')
                        && !supportArtifactSection.contains('delosdb-storage-api.jar'),
                'Retired storage-api artifact must remain outside runtime and support assembly models')

        DelosDbStaticAnalysisSupport.require(failures, runtimeText.contains("tasks.register('verifyDelosRuntimeStorageProviders')"),
                'Runtime artifact convention script must register verifyDelosRuntimeStorageProviders')
        DelosDbStaticAnalysisSupport.require(failures, runtimeText.contains("dependsOn 'jars'"),
                'verifyDelosRuntimeStorageProviders must depend on root :jars')
        DelosDbStaticAnalysisSupport.require(failures, runtimeText.contains('ServiceLoader.load'),
                'verifyDelosRuntimeStorageProviders must verify access-method discovery through ServiceLoader')
        DelosDbStaticAnalysisSupport.require(failures,
                runtimeText.contains('META-INF/services/org.apache.derby.iapi.store.access.conglomerate.ExternalAccessMethodProvider')
                        && runtimeText.contains('DerbyMvccAccessMethodProvider'),
                'verifyDelosRuntimeStorageProviders must verify the RawStore access-method provider from derby.jar')
        DelosDbStaticAnalysisSupport.require(failures,
                runtimeText.contains('META-INF/services/org.apache.derby.iapi.store.types.DelosStorageProviderFactory')
                        && runtimeText.contains('Retired external MVCC provider service remains'),
                'verifyDelosRuntimeStorageProviders must reject the retired external provider service')
        DelosDbStaticAnalysisSupport.require(failures,
                runtimeText.contains("it.name == 'delosdb-storage-io.jar'"),
                'verifyDelosRuntimeStorageProviders must reject the retained page-volume archive from runtime classpaths')
        DelosDbStaticAnalysisSupport.require(failures,
                runtimeText.contains('Retired io.github storage classes remain in production MVCC provider jar'),
                'verifyDelosRuntimeStorageProviders must reject retained Phase 8 classes from the production MVCC jar')
        DelosDbStaticAnalysisSupport.require(failures, !runtimeText.contains('doLast {\n        def runtimeFiles = project.'),
                'Runtime provider verification must not resolve Project state from its task action')
        DelosDbStaticAnalysisSupport.require(failures, runtimeText.contains('delosdbRuntimeJarFileCollection.files')
                        && runtimeText.contains('delosdbAsmRuntimeFileCollection.files'),
                'Runtime provider verification must use captured file collections during execution')

        DelosDbStaticAnalysisSupport.require(failures, productInfoScript.isFile(),
                'Missing shared product-information convention: gradle/delosdb-product-info.gradle')
        DelosDbStaticAnalysisSupport.require(failures, productInfoText.contains('tasks.register(productInfo.taskName.toString(), WriteProperties)'),
                'Product-information convention must use one typed WriteProperties task')
        DelosDbStaticAnalysisSupport.require(failures, productInfoText.contains('destinationFile.set(outputFile)'),
                'Product-information convention must declare its generated output through destinationFile')

        def productInfoModules = [
                'delosdb-commons/build.gradle',
                'delosdb-engine/build.gradle',
                'delosdb-client/build.gradle',
                'delosdb-tools/build.gradle',
                'delosdb-server/build.gradle',
                'delosdb-optionaltools/build.gradle'
        ]
        productInfoModules.each { relativePath ->
            def moduleText = buildTexts[relativePath] ?: ''
            DelosDbStaticAnalysisSupport.require(failures, moduleText.contains("apply from: rootProject.file('gradle/delosdb-product-info.gradle')"),
                    relativePath + ' must use the shared product-information convention')
            DelosDbStaticAnalysisSupport.require(failures, !moduleText.contains('derby.version.major'),
                    relativePath + ' must not duplicate product-information property generation')
        }

        DelosDbStaticAnalysisSupport.require(failures, rootText.contains("generated/resources/messages/org/apache/derby/loc"),
                'Engine/client messages must use dedicated generated-resource directories')
        DelosDbStaticAnalysisSupport.require(failures, rootText.contains("generated/resources/odbc/org/apache/derby/impl/jdbc"),
                'ODBC metadata must use a dedicated engine generated-resource directory')
        DelosDbStaticAnalysisSupport.require(failures, !rootText.contains("tasks.register('ensureCatalogMetadataResources'"),
                'Catalog metadata must remain an ordinary engine source resource, not a duplicate root copy task')

        def engineDriverService = new File(delosRepositoryRoot,
                'delosdb-engine/src/main/resources/META-INF/services/java.sql.Driver')
        def clientDriverService = new File(delosRepositoryRoot,
                'delosdb-client/src/main/resources/META-INF/services/java.sql.Driver')
        DelosDbStaticAnalysisSupport.require(failures, engineDriverService.isFile()
                        && engineDriverService.getText('UTF-8').readLines().collect { it.trim() }
                        .contains('org.apache.derby.iapi.jdbc.AutoloadedDriver'),
                'Engine JDBC service descriptor must be an ordinary source resource advertising AutoloadedDriver')
        DelosDbStaticAnalysisSupport.require(failures, clientDriverService.isFile()
                        && clientDriverService.getText('UTF-8').readLines().collect { it.trim() }
                        .contains('org.apache.derby.client.ClientAutoloadedDriver'),
                'Client JDBC service descriptor must be an ordinary source resource advertising ClientAutoloadedDriver')
        DelosDbStaticAnalysisSupport.require(failures, !buildTexts.values().any { it.contains("tasks.register('generateEngineServiceDescriptor'") },
                'JDBC service descriptors must not be regenerated by duplicate Gradle tasks')

        def forbiddenSharedOutputFragments = [
                'destinationDir = moduleClassDir',
                'destinationDir = buildToolsClassDir',
                'from(moduleClassDir)\n    from(sourceSets.main.output.resourcesDir)'
        ]
        buildTexts.each { relativePath, buildText ->
            forbiddenSharedOutputFragments.each { fragment ->
                DelosDbStaticAnalysisSupport.require(failures, !buildText.contains(fragment),
                        relativePath + ' must not restore shared class/resource staging fragment: ' + fragment)
            }
        }

        def forbiddenObsoleteBuildTasks = [
                'delosDbAnnotationsJar',
                'delosDbSpiJar',
                'delosDbStorageIoJar',
                'osgiFrameworkStubJar',
                'derbySharedJar',
                'storageApiJar',
                'derbyStoreApiJar',
                'delosDbStorageMvccJar',
                'derbyClientJar',
                'derbyToolsJar',
