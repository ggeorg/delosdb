tasks.register('delosMvccRawStoreAuthorityCutoverStaticAnalysis') {
    group = 'verification'
    description = 'Protects unconditional RawStore MVCC authority and fail-closed retained-format rejection.'

    def required = [
            file('delosdb-storage-mvcc/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccConglomerateFactory.java'),
            file('delosdb-storage-mvcc/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccConglomerate.java'),
            file('delosdb-storage-mvcc/src/main/java/org/apache/derby/impl/store/access/mvcc/MvccRawStoreRuntime.java'),
            file('delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/MvccRawStoreAuthorityCutoverTest.java'),
            file('docs/design/V1-RAWSTORE-MVCC-AUTHORITY-CUTOVER.md'),
            file('.delosdb-v1/03-roadmap/09-PHASE-9-RAWSTORE-CONVERGENCE.md')
    ]
    inputs.files(required)
    outputs.file(layout.buildDirectory.file('reports/delosdb/mvcc-raw-store-authority-cutover-static-analysis.txt'))

    doLast {
        def failures = []
        required.each { if (!it.isFile()) failures << 'Missing required source: ' + it }
        if (failures.isEmpty()) {
            def factory = required[0].getText('UTF-8')
            def conglomerate = required[1].getText('UTF-8')
            def runtime = required[2].getText('UTF-8')
            def test = required[3].getText('UTF-8')
            def design = required[4].getText('UTF-8')
            def roadmap = required[5].getText('UTF-8')

            if (!factory.contains('rejectRetainedExternalState(databaseDirectory);')
                    || factory.indexOf('rejectRetainedExternalState(databaseDirectory);')
                            > factory.indexOf('new MvccRawStoreRuntime(')) {
                failures << 'Retained-format rejection must happen before RawStore runtime construction'
            }
            if (factory.count('new MvccRawStoreRuntime(') != 1
                    || factory.contains('new MvccDatabaseRuntime(')
                    || factory.contains('MvccRawStoreFormat.ENABLED_PROPERTY')) {
                failures << 'Factory boot must have one unconditional RawStore authority and no legacy branch'
            }
            if (!factory.contains('LinkOption.NOFOLLOW_LINKS')
                    || !factory.contains('UncheckedIOException')
                    || !factory.contains('Files.walk(providerDirectory)')) {
                failures << 'Retained-state guard must remain read-only, no-follow, and fail closed'
            }
            if (conglomerate.contains('MvccDatabaseRuntime') || runtime.contains('MvccDatabaseRuntime')) {
                failures << 'Active RawStore classes must not reference the retired runtime authority'
            }
            if (!test.contains('testRawStoreIsTheOnlyBootedMvccRuntime')
                    || !test.contains('testRetainedStateFailsClosedWithoutLegacyFallback')
                    || !test.contains('mvccDiagnostics(database).databaseStorageSnapshot()')) {
                failures << 'Authority test must prove sole RawStore boot and absence of legacy diagnostics'
            }
            if (!design.contains('RawStore is the only production authority')
                    || !roadmap.contains('Stage 5.4')) {
                failures << 'Authority design and roadmap must record final retained-runtime retirement'
            }
        }
        def reportFile = layout.buildDirectory.file(
                'reports/delosdb/mvcc-raw-store-authority-cutover-static-analysis.txt').get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('RawStore MVCC authority cutover static analysis')
            writer.println('===============================================')
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) throw new GradleException(
                'RawStore MVCC authority cutover static analysis failed. Report: ' + reportFile)
        logger.lifecycle('RawStore MVCC authority cutover static analysis passed. Report: {}', reportFile)
    }
}


