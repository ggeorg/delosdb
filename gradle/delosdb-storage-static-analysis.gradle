def delosRunExternalValidationCommand = { String propertyName, String displayName ->
    def configured = providers.gradleProperty(propertyName).orNull
    if (configured == null || configured.trim().isEmpty()) {
        throw new GradleException(displayName + ' requires -P' + propertyName
                + '="<command>"; this external validation task is intentionally not an S0 dependency.')
    }
    exec {
        commandLine configured.trim().split(/\s+/) as List
    }
}

