import org.gradle.api.tasks.compile.JavaCompile

// Phase C5 planned INSERT proof.
//
// This is intentionally one tiny mutation smoke, not SQL bridge retirement. It
// proves that a planned table identity plus one row mutation can drive a
// VersionedStorageExecutionBridge insert directly, with commit/abort visibility
// checks, without adding a new JDBC SQL-regex path and without touching Derby
// heap execution.

ext.delosdbStoragePhaseC5ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC5ReportFile =
        ext.delosdbStoragePhaseC5ReportDir.map { it.file('storage-phase-c5-insert-proof.txt') }
ext.delosdbStoragePhaseC5SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c5-insert-proof-smoke')

ext.delosdbStoragePhaseC5RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC5RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC5RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC5ForbiddenSourceHits = { Collection<File> sourceFiles, Collection<String> tokens ->
    sourceFiles.collectMany { sourceFile ->
        def text = sourceFile.text
        tokens.findAll { token -> text.contains(token) }.collect { token ->
            "${delosdbStoragePhaseC5RelPath(sourceFile)} contains forbidden token ${token}"
        }
    }.sort()
}

ext.delosdbStoragePhaseC5JavaFiles = { String projectPath ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [] as Set<File>
    }
    fileTree(sourceRoot).matching { include '**/*.java' }.files as Set<File>
}

ext.delosdbStoragePhaseC5ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC5RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC5Classpath = {
    files(
            delosdbStoragePhaseC5SmokeClassesDir,
            delosdbStoragePhaseC5ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC5ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC5ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC5RuntimeJars())
}

ext.delosdbStoragePhaseC5Proof = {
    def errors = []
    def lines = []

    def smokeSource = file('dev/storage-phase-c5-insert-proof-smoke/src/main/java/delosdb/smoke/StoragePhaseC5InsertProofSmoke.java')
    def executionBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/execution/VersionedStorageExecutionBridge.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def embedStatement = file('delosdb-engine/src/main/java/org/apache/derby/impl/jdbc/EmbedStatement.java')
    def heapProvider = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/LegacyDerbyHeapStorageProvider.java')
    def mvccProvider = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccStorageProvider.java')
    def storelessRoot = file('delosdb-storeless/src/main/java')

    delosdbStoragePhaseC5RequireTokens(errors, smokeSource, [
            'record PlannedInsert',
            'VersionedStorageExecutionBridge',
            'VersionedTableMetadata',
            'DelosMvccStorageProvider.PROVIDER_NAME',
            'bridge.createTable(',
            'bridge.insert(table, key, value',
            'executeAndCommit',
            'executeAndAbort',
            'bridge.read(table, 1, committedReader.currentView())',
            'bridge.read(table, 2, rollbackReader.currentView())',
            'requireMissingProviderIsRejected'
    ], 'Phase C5 planned insert smoke')

    delosdbStoragePhaseC5RequireTokens(errors, executionBridge, [
            'public <K, V> void insert(',
            'requireTable(table).insert(requireKey(key), requireValue(value), requireTransaction(transaction));',
            'public <K, V> Optional<V> read(',
            'return requireTable(table).read(requireKey(key), requireView(view));'
    ], 'VersionedStorageExecutionBridge direct insert contract')

    delosdbStoragePhaseC5RequireTokens(errors, sqlBridge, [
            'Minimal SQL/JDBC bridge for the experimental',
            'Attempts to execute a supported experimental MVCC SQL statement',
            'tryExecute(sql, VersionedStorageSqlBridge.class, true)'
    ], 'transitional VersionedStorageSqlBridge')

    delosdbStoragePhaseC5RequireTokens(errors, embedStatement, [
            'VersionedStorageSqlBridge.tryExecute('
    ], 'current transitional EmbedStatement bridge hook')

    delosdbStoragePhaseC5RequireTokens(errors, heapProvider, [
            'implements StorageProvider',
            'StorageCapabilities'
    ], 'Derby heap provider remains metadata path')

    delosdbStoragePhaseC5RequireTokens(errors, mvccProvider, [
            'implements VersionedStorageProvider',
            'public VersionedTransactionCoordinator transactionCoordinator()',
            'public synchronized <K, V> VersionedTable<K, V> openTable('
    ], 'MVCC provider remains versioned operational path')

    if (!storelessRoot.exists()) {
        errors << 'missing storeless source root: delosdb-storeless/src/main/java'
    } else {
        def storelessProviderHits = fileTree(storelessRoot).matching { include '**/*.java' }.files.findAll { sourceFile ->
            def text = sourceFile.text
            text.contains('implements StorageProvider') || text.contains('implements VersionedStorageProvider')
        }.collect { delosdbStoragePhaseC5RelPath(it) }.sort()
        if (!storelessProviderHits.isEmpty()) {
            errors << 'storeless must remain a no-store negative proof, not a provider: ' + storelessProviderHits
        }
    }

    if (smokeSource.exists()) {
        errors.addAll(delosdbStoragePhaseC5ForbiddenSourceHits([smokeSource], [
                'java.sql.',
                'Connection',
                'Statement',
                'ResultSet',
                'VersionedStorageSqlBridge',
                'Pattern.compile',
                'Matcher',
                'select ',
                'insert into',
                'create table'
        ]))
    }

    def engineStoreSourceRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
    if (engineStoreSourceRoot.exists()) {
        errors << 'Phase C5 must not add engine-side org/apache/derby/impl/store sources: '
                + delosdbStoragePhaseC5RelPath(engineStoreSourceRoot)
    }

    def thirdIslandNames = [
            'DelosStorageEngine.java',
            'DelosMutationAccess.java',
            'TableAccessProfile.java',
            'StorageExecutionProfile.java',
            'StorelessStorageProvider.java',
            'StorelessVersionedStorageProvider.java'
    ] as Set
    def thirdIslandFiles = fileTree(rootProject.projectDir).matching {
        include '**/*.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
        exclude '**/.idea/**'
        exclude '**/__MACOSX/**'
    }.files.findAll { thirdIslandNames.contains(it.name) }
            .collect { delosdbStoragePhaseC5RelPath(it) }.sort()
    if (!thirdIslandFiles.isEmpty()) {
        errors << 'Phase C5 must not introduce the third SPI/profile island before the first insert proof: '
                + thirdIslandFiles
    }

    def allEngineVersionedFiles = delosdbStoragePhaseC5JavaFiles('delosdb-engine').findAll { sourceFile ->
        delosdbStoragePhaseC5RelPath(sourceFile).contains('/versioned/')
    }
    def sqlRegexOwners = allEngineVersionedFiles.findAll { sourceFile ->
        sourceFile.name != 'VersionedStorageSqlBridge.java' && sourceFile.text.contains('Pattern.compile(')
    }.collect { delosdbStoragePhaseC5RelPath(it) }.sort()
    if (!sqlRegexOwners.isEmpty()) {
        errors << 'new MVCC insert proof must not add SQL regex owners outside VersionedStorageSqlBridge: '
                + sqlRegexOwners
    }

    lines << 'DelosDB Storage Phase C5 Insert Proof'
    lines << '====================================='
    lines << ''
    lines << 'C5 mechanic:'
    lines << '  a planned table identity plus one row mutation can insert into delos_mvcc through VersionedStorageExecutionBridge.'
    lines << ''
    lines << 'Mutation boundaries checked:'
    lines << '  commit:  inserted row becomes visible after provider transaction commit'
    lines << '  abort:   inserted row remains invisible after provider transaction abort'
    lines << '  routing: no JDBC, SQL text, or SQL regex path is used by the proof smoke'
    lines << ''
    lines << 'Preserved boundaries:'
    lines << '  heap:        LegacyDerbyHeapStorageProvider remains the metadata/capability StorageProvider path'
    lines << '  mvcc:        DelosMvccStorageProvider remains the VersionedStorageProvider operational path'
    lines << '  storeless:   still a no-store negative proof, not a StorageProvider implementation'
    lines << '  SQL bridge:  still transitional; C5 adds no new SQL regex owner'
    lines << ''
    lines << 'Proof smoke:'
    lines << '  dev/storage-phase-c5-insert-proof-smoke/src/main/java/delosdb/smoke/StoragePhaseC5InsertProofSmoke.java'
    lines << ''
    lines << 'Runtime behavior:'
    lines << '  unchanged for Derby heap; this is a dev smoke plus guard only.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC5InsertProofReport') {
    group = 'verification'
    description = 'Writes the Phase C5 planned insert proof report.'
    dependsOn 'verifyStoragePhaseC4PlannedScanProof'
    outputs.file(delosdbStoragePhaseC5ReportFile)
    doLast {
        def result = delosdbStoragePhaseC5Proof()
        def outputFile = delosdbStoragePhaseC5ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C5 insert proof failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC5InsertProofSmoke', JavaCompile) {
    dependsOn 'jars', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C5 direct planned-insert smoke test.'
    source = files('dev/storage-phase-c5-insert-proof-smoke/src/main/java')
    destinationDirectory = delosdbStoragePhaseC5SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC5Classpath()
}

tasks.register('storagePhaseC5InsertProofSmoke', JavaExec) {
    dependsOn 'compileStoragePhaseC5InsertProofSmoke'
    group = 'verification'
    description = 'Runs the Phase C5 direct planned-insert smoke test without JDBC SQL-regex routing.'
    classpath = delosdbStoragePhaseC5Classpath()
    mainClass = 'delosdb.smoke.StoragePhaseC5InsertProofSmoke'
}

tasks.register('verifyStoragePhaseC5InsertProof') {
    group = 'verification'
    description = 'Verifies the Phase C5 first planned insert proof.'
    dependsOn 'storagePhaseC5InsertProofReport', 'storagePhaseC5InsertProofSmoke'
    doLast {
        println 'Verified Phase C5 insert proof; next step must shrink one proven SQL bridge path, not broaden mutation work'
    }
}
