import org.gradle.api.tasks.compile.JavaCompile

// Phase F5 native MVCC INSERT proof.
// This keeps generated activation bytecode unchanged and proves the existing
// ResultSetFactory INSERT seam can execute delos_mvcc INSERT through
// DelosInsertResultSet -> EngineMvccTableAccess.insert(...).

ext.delosdbStoragePhaseF5ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseF5ReportFile =
        ext.delosdbStoragePhaseF5ReportDir.map { it.file('storage-phase-f5-native-insert.txt') }
ext.delosdbStoragePhaseF5SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-f5-native-insert-smoke')

ext.delosdbStoragePhaseF5RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseF5RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF5RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseF5RejectTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF5RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def present = tokens.findAll { token -> text.contains(token) }
    if (!present.isEmpty()) {
        errors << "${label} contains forbidden tokens: ${present.join(', ')}"
    }
}

ext.delosdbStoragePhaseF5ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseF5RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseF5Classpath = {
    files(
            delosdbStoragePhaseF5SmokeClassesDir,
            delosdbStoragePhaseF5ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseF5ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseF5ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseF5ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseF5RuntimeJars())
}

ext.delosdbStoragePhaseF5Proof = {
    def errors = []
    def lines = []

    def buildFile = file('build.gradle')
    def delosInsert = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosInsertResultSet.java')
    def lookup = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosTableScanProviderLookup.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def genericFactory = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/GenericResultSetFactory.java')
    def resultSetFactory = file('delosdb-engine/src/main/java/org/apache/derby/iapi/sql/execute/ResultSetFactory.java')
    def f5Gradle = file('gradle/storage-phase-f5-native-insert.gradle')
    def smokeSource = file('dev/storage-phase-f5-native-insert-smoke/src/main/java/delosdb/smoke/StoragePhaseF5NativeInsertSmoke.java')
    def f5Doc = file('docs/storage-phase-f5-native-insert.md')
    def planDoc = file('docs/storage-phase-f-native-integration-plan.md')
    def roadmap = file('docs/ROADMAP.md')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')

    delosdbStoragePhaseF5RequireTokens(errors, buildFile, [
            "apply from: file('gradle/storage-phase-f4-native-select-equality.gradle')",
            "apply from: file('gradle/storage-phase-f5-native-insert.gradle')"
    ], 'root build F5 wiring')
    if (buildFile.exists()) {
        def text = buildFile.text
        def f4 = text.indexOf("apply from: file('gradle/storage-phase-f4-native-select-equality.gradle')")
        def f5 = text.indexOf("apply from: file('gradle/storage-phase-f5-native-insert.gradle')")
        if (f4 < 0 || f5 < 0 || f5 < f4) {
            errors << 'F5 apply must appear after F4 in build.gradle'
        }
    }

    delosdbStoragePhaseF5RequireTokens(errors, delosInsert, [
            'NATIVE_INSERT_PROPERTY',
            'createIfEnabled(InsertResultSetParameters params)',
            'DelosTableScanProviderLookup.find',
            'params.source.openCore()',
            'params.source.getNextRowCore()',
            'VersionedStorageSqlBridge.openNativeExecutionTableAccess',
            'nativeAccess.insert(nativeValues(row))',
            'DataValueDescriptor value = row.getColumn(column)',
            'value.getObject()',
            'modifiedRowCount()'
    ], 'DelosInsertResultSet F5 implementation')
    delosdbStoragePhaseF5RequireTokens(errors, lookup, [
            'FACTORY_NATIVE_INSERT_PROPERTY',
            'NATIVE_INSERT_PROPERTY'
    ], 'provider lookup F5 property export')
    delosdbStoragePhaseF5RequireTokens(errors, sqlBridge, [
            'openNativeExecutionTableAccess',
            'NativeExecutionTableAccess',
            'public long insert(List<Object> nativeValues)',
            'table.reserveUniqueKeys(nativeValues, rowKey, statementTx.context())',
            'DelosRow.withIdentity(new NativeExecutionRowIdentity(rowKey), values)',
            'tableAccess.insert('
    ], 'native insert table-access seam')
    delosdbStoragePhaseF5RejectTokens(errors, sqlBridge, [
            'F5_INSERT_VALUES',
            'NATIVE_INSERT_REGEX'
    ], 'no new F5 SQL route markers in bridge')
    delosdbStoragePhaseF5RequireTokens(errors, genericFactory, [
            'DelosInsertResultSet.createIfEnabled(params)',
            'return new InsertResultSet(params)'
    ], 'GenericResultSetFactory INSERT branch')
    delosdbStoragePhaseF5RejectTokens(errors, resultSetFactory, [
            'getDelosInsertResultSet'
    ], 'ResultSetFactory interface unchanged by F5')
    delosdbStoragePhaseF5RequireTokens(errors, f5Gradle, [
            'storagePhaseF5NativeInsertSmoke',
            'verifyStoragePhaseF5NativeInsert'
    ], 'F5 Gradle proof wiring')
    delosdbStoragePhaseF5RequireTokens(errors, smokeSource, [
            'INSERT INTO APP.',
            'VALUES (?, ?)',
            'FACTORY_NATIVE_INSERT_PROPERTY',
            'VersionedStorageSqlBridge.resetRouteClassifierForTesting()',
            'VersionedStorageSqlBridge.lastRouteClassifierForTesting().isEmpty()',
            'Expected F5 native INSERT row to be visible through native SELECT'
    ], 'F5 smoke proof')
    delosdbStoragePhaseF5RequireTokens(errors, f5Doc, [
            'F5 — native INSERT',
            'GenericResultSetFactory.getInsertResultSet(...)',
            'DelosInsertResultSet',
            'EngineMvccTableAccess.insert(...)',
            'does not add any new bridge SQL route or regex route'
    ], 'F5 document')
    delosdbStoragePhaseF5RequireTokens(errors, planDoc, [
            'F5 landed',
            'native INSERT',
            'F6 — native DELETE equality'
    ], 'Phase F plan after F5')
    delosdbStoragePhaseF5RequireTokens(errors, roadmap, [
            'F5 landed',
            'F6 landed',
            'F8 landed',
            'Next: G1 — native remaining range predicates'
    ], 'ROADMAP after F5 and completed Phase F')
    delosdbStoragePhaseF5RequireTokens(errors, cleanupScript, [
            'storage-phase-f5-native-insert-db'
    ], 'F5 smoke DB cleanup entry')

    lines << 'DelosDB Storage Phase F5 Native INSERT Proof'
    lines << '============================================'
    lines << ''
    lines << 'Purpose:'
    lines << '  Prove a Derby prepared INSERT can execute through a native Delos result set and EngineMvccTableAccess.insert(...).'
    lines << ''
    lines << 'Verified implementation shape:'
    lines << '  Generated activation still calls the existing ResultSetFactory INSERT method shape.'
    lines << '  No ResultSetFactory interface or generated bytecode method is added.'
    lines << '  GenericResultSetFactory branches by catalog provider metadata under the F5 proof property.'
    lines << '  DelosInsertResultSet consumes Derby source ExecRow values and passes typed Java values to the native table-access seam.'
    lines << '  VersionedStorageSqlBridge.NativeExecutionTableAccess builds a DelosRow and calls EngineMvccTableAccess.insert(...).'
    lines << '  The prepared INSERT proof asserts VersionedStorageSqlBridge.tryExecute(...) was not called for the native path.'
    lines << ''
    lines << 'Next step:'
    lines << '  F6 moves DELETE equality onto native predicate extraction, scan identity, and delete(...).'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseF5NativeInsertReport') {
    group = 'verification'
    description = 'Writes the Phase F5 native MVCC INSERT proof report.'
    dependsOn 'verifyStoragePhaseF4NativeSelectEquality'
    outputs.file(delosdbStoragePhaseF5ReportFile)
    doLast {
        def result = delosdbStoragePhaseF5Proof()
        def outputFile = delosdbStoragePhaseF5ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase F5 native MVCC INSERT proof failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseF5NativeInsertSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase F5 native MVCC INSERT smoke test.'
    source = files('dev/storage-phase-f5-native-insert-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseF5SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseF5Classpath()
}

tasks.register('storagePhaseF5NativeInsertSmoke', JavaExec) {
    dependsOn 'storagePhaseF5NativeInsertReport', 'compileStoragePhaseF5NativeInsertSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase F5 native MVCC INSERT smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseF5NativeInsertSmoke'
    classpath = delosdbStoragePhaseF5Classpath()
}

tasks.register('verifyStoragePhaseF5NativeInsert') {
    group = 'verification'
    description = 'Verifies Phase F5 native MVCC INSERT proof.'
    dependsOn 'storagePhaseF5NativeInsertReport', 'storagePhaseF5NativeInsertSmoke'
    doLast {
        println 'Verified Phase F5 native MVCC INSERT; next step is F6 native DELETE equality'
    }
}
