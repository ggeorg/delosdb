/*
 * Permanent DelosDB test-suite entry points.
 *
 * Stage 8 makes the stable registry the single authority for active DelosDB
 * test membership, purpose suites, and execution tiers. Focused tasks remain
 * only where they provide a justified special environment or narrow harness.
 */

def context = project.ext.delosdbStableTestSuiteContext as Map<String, Object>
def registryFile = rootProject.file('gradle/testing/delos-test-suite-registry.tsv')
def delosSourceRoot = project.file('src/delosTest/java')
def suiteReportJson = layout.buildDirectory.file('reports/tests/delosdb-stable-test-suites.json')
def suiteReportText = layout.buildDirectory.file('reports/tests/delosdb-stable-test-suites.txt')

def readRegistry = {
    LinkedHashMap<String, Map<String, String>> rows = new LinkedHashMap<>()
    registryFile.eachLine(StandardCharsets.UTF_8.name()) { String line ->
        if (!line.isBlank() && !line.startsWith('#')) {
            String[] columns = line.split('\\t', -1)
            if (columns.length != 5) {
                throw new GradleException(
                        "Malformed ${registryFile}: expected 5 tab-separated columns, found ${columns.length}: ${line}")
            }
            Map<String, String> row = [
                    className: columns[0],
                    sourcePath: columns[1],
                    suite: columns[2],
                    executionTier: columns[3],
                    reason: columns[4]
            ]
            if (rows.put(row.className, row) != null) {
                throw new GradleException("Duplicate class in ${registryFile}: ${row.className}")
            }
        }
    }
    rows
}



def registry = readRegistry()
def rowsForSuite = { String suiteName ->
    registry.values().findAll { it.suite == suiteName }
}
def rowsForTier = { String tierName ->
    registry.values().findAll { it.executionTier == tierName }
}
def rowsForSuiteTier = { String suiteName, String tierName ->
    registry.values().findAll {
        it.suite == suiteName && it.executionTier == tierName
    }
}
def classPattern = { Map<String, String> row -> row.className.replace('.', '/') + '.class' }

def configureTestTask = { Test task,
                          String taskName,
                          Collection<Map<String, String>> rows,
                          boolean nativeAuthenticationResources = false ->
    task.group = 'verification'
    task.dependsOn tasks.named('compileTestJava'), ':jars'
    if (nativeAuthenticationResources) {
        task.dependsOn tasks.named('generateNativeAuthenticationTestJar')
    }

    task.modularity.inferModulePath = false
    task.testClassesDirs = files(context.derbyTestsClassDir)
    task.classpath = nativeAuthenticationResources
            ? (context.nativeAuthenticationRuntimeClasspath as Closure).call()
            : (context.testRuntimeClasspath as Closure).call()
    task.useJUnit()
    rows.each { row -> task.include classPattern(row) }
    task.maxParallelForks = 1
    task.maxHeapSize = taskName in ['derbyAllTests', 'delosStressTests'] ? '2048m' : '1536m'
    task.workingDir = layout.buildDirectory.dir("test-work/${taskName}").get().asFile
    task.binaryResultsDirectory.set(layout.buildDirectory.dir("test-results/binary/${taskName}"))
    task.reports {
        junitXml.required.set(true)
        junitXml.outputLocation.set(layout.buildDirectory.dir("test-results/${taskName}"))
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.dir("reports/tests/${taskName}"))
    }
    task.doFirst {
        delete task.workingDir
        task.workingDir.mkdirs()
        task.systemProperty 'derby.tests.basePort', (context.derbyBasePort as Provider<String>).get()
    }
    task.testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

def registerInheritedSuite = { String taskName,
                                String descriptionText,
                                List<String> includePatterns,
                                boolean nativeAuthenticationResources = false ->
    tasks.register(taskName, Test) { Test task ->
        task.description = descriptionText
        Collection<Map<String, String>> syntheticRows = includePatterns.collect { String pattern ->
            [className: pattern.replace('/', '.').replaceFirst(/\.class$/, '')]
        }
        configureTestTask(task, taskName, syntheticRows, nativeAuthenticationResources)
        task.failFast = (context.derbyFailFast as Provider<Boolean>).get()
        task.doFirst {
            if (!task.filter.commandLineIncludePatterns.empty) {
                task.setIncludes([] as Set<String>)
            }
        }
    }
}

def registerDelosSuite = { String taskName,
                            String descriptionText,
                            Collection<Map<String, String>> suiteRows ->
    tasks.register(taskName, Test) { Test task ->
        task.description = descriptionText
        configureTestTask(task, taskName, suiteRows, false)
        // The pre-Stage-3 focused tasks executed in separate test-worker JVMs.
        // Preserve that boundary when stable suites combine classes which use
        // Derby process-global monitor, TestConfiguration, and system properties.
        task.forkEvery = 1L
        task.dependsOn rootProject.tasks.named('verifyDelosRuntimeStorageProviders')
    }
}

