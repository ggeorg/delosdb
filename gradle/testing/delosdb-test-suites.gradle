def stableSuiteAnalysis = tasks.register('delosStableTestSuiteStaticAnalysis') {
    group = 'verification'
    description = 'Verifies permanent stable-suite coverage, registry completeness, and execution-tier assignments.'
    inputs.file registryFile
    inputs.dir delosSourceRoot
    outputs.file suiteReportJson
    outputs.file suiteReportText

    doLast {
        List<String> issues = []
        Set<String> validSuites = ['unit', 'functional', 'concurrency', 'recovery', 'system', 'stress', 'performance'] as Set<String>
        Set<String> validTiers = ['unit', 'quick', 'full', 'nightly', 'release'] as Set<String>

        registry.values().each { row ->
            if (!validSuites.contains(row.suite)) issues.add("Invalid suite for ${row.className}: ${row.suite}")
            if (!validTiers.contains(row.executionTier)) issues.add("Invalid execution tier for ${row.className}: ${row.executionTier}")
            File source = new File(delosSourceRoot, row.sourcePath)
            if (!source.isFile()) {
                issues.add("Registry source is missing: ${row.sourcePath}")
            } else {
                String expectedClass = row.sourcePath.replace('/', '.').replaceFirst(/\.java$/, '')
                if (row.className != expectedClass) {
                    issues.add("Class/source mismatch: ${row.className} != ${expectedClass}")
                }
                String sourceText = source.getText(StandardCharsets.UTF_8.name())
                String simpleName = row.className.substring(row.className.lastIndexOf('.') + 1)
                boolean abstractClass = (sourceText =~ /(?m)^\s*(?:public\s+)?abstract\s+class\s+${java.util.regex.Pattern.quote(simpleName)}\b/).find()
                if (abstractClass) {
                    issues.add("Abstract class is registered as executable: ${row.className}")
                }
            }
            boolean compatibleTier = false
            if (row.suite == 'unit') compatibleTier = row.executionTier == 'unit'
            else if (row.suite == 'functional') compatibleTier = row.executionTier in ['quick', 'full']
            else if (row.suite in ['concurrency', 'recovery', 'system']) compatibleTier = row.executionTier == 'full'
            else if (row.suite == 'stress') compatibleTier = row.executionTier == 'nightly'
            else if (row.suite == 'performance') compatibleTier = row.executionTier == 'release'
            if (!compatibleTier) {
                issues.add("Suite/tier mismatch for ${row.className}: ${row.suite}/${row.executionTier}")
            }
        }

        Set<String> expectedPerformanceClasses = [
                'org.apache.derbyTesting.functionTests.tests.delos.HeapDiagnosticsPerformanceAuditTest',
                'org.apache.derbyTesting.functionTests.tests.delos.JdbcBenchmarkBaselineTest',
                'org.apache.derbyTesting.functionTests.tests.delos.JdbcBenchmarkBatchScalingTest',
                'org.apache.derbyTesting.functionTests.tests.delos.JdbcBenchmarkRowScalingTest',
                'org.apache.derbyTesting.functionTests.tests.delos.JdbcBenchmarkSurfaceValidationTest',
                'org.apache.derbyTesting.functionTests.tests.delos.JdbcRangeScanBenchmarkSupportTest',
                'org.apache.derbyTesting.functionTests.tests.delos.JdbcBenchmarkTransactionsTest',
                'org.apache.derbyTesting.functionTests.tests.delos.JdbcDeleteReinsertAttributionTest',
                'org.apache.derbyTesting.functionTests.tests.delos.SharedRawStoreMappedRegionExperimentTest',
                'org.apache.derbyTesting.functionTests.tests.delos.SharedRawStorePageIoRepresentationDecisionTest',
                'org.apache.derbyTesting.functionTests.tests.delos.V1BaselineCaptureTest'
        ] as Set<String>
        Set<String> actualPerformanceClasses = registry.values().findAll {
            it.suite == 'performance'
        }.collect { it.className }.toSet()
        (expectedPerformanceClasses - actualPerformanceClasses).sort().each {
            issues.add("Release-only performance harness is missing from registry: ${it}")
        }
        (actualPerformanceClasses - expectedPerformanceClasses).sort().each {
            issues.add("Unexpected release-only performance harness: ${it}")
        }

        Set<String> sourcePaths = fileTree(delosSourceRoot) { include '**/*.java' }
                .files.collect { delosSourceRoot.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
                .toSet()
        Set<String> registryPaths = registry.values().collect { it.sourcePath }.toSet()
        (sourcePaths - registryPaths).sort().each { issues.add("Unregistered DelosDB source: ${it}") }
        (registryPaths - sourcePaths).sort().each { issues.add("Stale DelosDB suite registry source: ${it}") }

        Map<String, Integer> suiteCounts = new TreeMap<>()
        Map<String, Integer> tierCounts = new TreeMap<>()
        registry.values().each { row ->
            suiteCounts[row.suite] = (suiteCounts[row.suite] ?: 0) + 1
            tierCounts[row.executionTier] = (tierCounts[row.executionTier] ?: 0) + 1
        }
        Set<String> quickFunctionalClasses = rowsForTier('quick').findAll {
            it.suite == 'functional'
        }.collect { it.className }.toSet()
        Set<String> fullFunctionalClasses = rowsForSuiteTier('functional', 'full')
                .collect { it.className }.toSet()
        Set<String> allFunctionalClasses = rowsForSuite('functional')
                .collect { it.className }.toSet()
        if (!quickFunctionalClasses.intersect(fullFunctionalClasses).isEmpty()) {
            issues.add('Quick/full functional partitions overlap')
        }
        if ((quickFunctionalClasses + fullFunctionalClasses) != allFunctionalClasses) {
            issues.add('Quick/full functional partitions do not cover the complete functional suite')
        }

        List<String> publicTasks = [
                'derbyUnitTests', 'derbyLanguageTests', 'derbyNistSql92Tests',
                'derbyJdbcTests', 'derbyStoreTests', 'derbyNetworkTests',
                'derbyToolsTests', 'derbyUpgradeTests', 'derbyAllTests',
                'delosUnitTests', 'delosFunctionalTests', 'delosConcurrencyTests',
                'delosRecoveryTests', 'delosSystemTests', 'delosStressTests'
        ]
        publicTasks.each { taskName ->
            if (tasks.findByName(taskName) == null) issues.add("Stable suite task is missing: ${taskName}")
        }
        List<String> isolatedDelosTestTasks = [
                'delosUnitTests', 'delosFunctionalTests', 'delosConcurrencyTests',
                'delosRecoveryTests', 'delosSystemTests', 'delosStressTests',
                'delosQuickSmokeTests', 'delosFunctionalFullTierTests'
        ]
        isolatedDelosTestTasks.each { taskName ->
            def candidate = tasks.findByName(taskName)
            if (!(candidate instanceof Test)) {
                issues.add("DelosDB stable Test task is missing: ${taskName}")
            } else if (candidate.forkEvery != 1L) {
                issues.add("DelosDB stable Test task does not preserve one-class-per-JVM isolation: ${taskName}")
            }
        }
        List<String> verificationLevels = [
                'test', 'quickVerification', 'check', 'fullVerification',
                'nightlyVerification', 'releaseVerification'
        ]
        verificationLevels.each { taskName ->
            if (rootProject.tasks.findByName(taskName) == null) {
                issues.add("Root verification level is missing: ${taskName}")
            }
        }

        Map<String, Object> report = [
                schemaVersion: 6,
                stage: 'Permanent stable Gradle entry points',
                registryScope: 'ALL_ACTIVE_DELOSDB_TEST_SOURCES',
                registry: rootProject.relativePath(registryFile),
                summary: [
                        sourceFiles: sourcePaths.size(),
                        registryEntries: registry.size(),
                        activeTests: registry.size(),
                        delosClassForkIsolation: 1,
                        issueCount: issues.unique().size()
                ],
                suiteCounts: suiteCounts,
                executionTierCounts: tierCounts,
                inheritedTasks: publicTasks.findAll { it.startsWith('derby') },
                delosdbTasks: publicTasks.findAll { it.startsWith('delos') },
                verificationLevels: verificationLevels,
                issues: issues.unique().sort(),
                entries: registry.values().toList()
        ]
        File jsonFile = suiteReportJson.get().asFile
        File textFile = suiteReportText.get().asFile
        jsonFile.parentFile.mkdirs()
        textFile.parentFile.mkdirs()
        jsonFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n', StandardCharsets.UTF_8.name())
        textFile.withWriter(StandardCharsets.UTF_8.name()) { writer ->
            writer.println('DelosDB stable test suites')
            writer.println('Stage: Permanent stable Gradle entry points')
            writer.println("Registry: ${rootProject.relativePath(registryFile)}")
            writer.println()
            report.summary.each { key, value -> writer.println(String.format('%-28s %s', key + ':', value)) }
            writer.println()
            writer.println('Suite counts')
            suiteCounts.each { key, value -> writer.println(String.format('  %-16s %s', key, value)) }
            writer.println()
            writer.println('Execution-tier counts')
            tierCounts.each { key, value -> writer.println(String.format('  %-16s %s', key, value)) }
            writer.println()
            writer.println('Issues')
            if (report.issues.isEmpty()) writer.println('  none')
            else report.issues.each { writer.println('  - ' + it) }
        }

        if (!report.issues.isEmpty()) {
            throw new GradleException('DelosDB stable suite failures (' + report.issues.size() + '):\n  - ' +
                    report.issues.join('\n  - '))
        }
        logger.lifecycle('DelosDB stable test suites passed. Report: {}', textFile)
    }
}

tasks.named('check') {
    dependsOn stableSuiteAnalysis
}
