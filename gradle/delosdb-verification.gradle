// These are executable behavior smokes only.  Source-shape guard/report tasks were
// retired from the root build; the smokes remain because they exercise real paths.

ext.delosdbClosedPhaseRegressionModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbClosedPhaseRegressionRuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbClosedPhaseC7SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c7-stabilization-smoke')

ext.delosdbClosedPhaseC7SmokeClasspath = {
    files(
            delosdbClosedPhaseC7SmokeClassesDir,
            delosdbClosedPhaseRegressionModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbClosedPhaseRegressionModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbClosedPhaseRegressionModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-io.jar'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbClosedPhaseRegressionRuntimeJars())
}

