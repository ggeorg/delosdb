import org.gradle.api.tasks.JavaExec
import org.gradle.api.tasks.Copy
import org.gradle.api.tasks.bundling.Compression
import org.gradle.api.tasks.bundling.Tar
import org.gradle.api.tasks.bundling.Zip

def delosDbVersion = rootProject.ext.delosDbVersion
def runtimeJars = rootProject.ext.delosdbRuntimeJars
def moduleDirsForRuntime = rootProject.ext.delosdbModuleDirsForRuntime

def smokeSqlFile = file('examples/smoke.sql')
def legalFileNames = ['LICENSE', 'NOTICE', 'NOTICE-FORK.md']
def legalFiles = files(legalFileNames.collect { file(it) })


def runtimeBuildTasks = [
        ':delosdb-annotations:compileDelosDbAnnotations',
        ':delosdb-runtime-api:compileDelosDbRuntimeApi',
        ':delosdb-storage-io:compileDelosDbStorageIo',
        ':delosdb-storage-api:compileStorageApi',
        ':delosdb-engine:compileClassSizeCatalog',
        'splitEngineMessages',
        'generateOdbcMetadata',
        'ensureCatalogMetadataResources'
]

tasks.register('compileAll') {
    dependsOn runtimeBuildTasks
}

tasks.register('jars') {
    dependsOn ':delosdb-annotations:delosDbAnnotationsJar', ':delosdb-spi:delosDbSpiJar', ':delosdb-commons:derbySharedJar', ':delosdb-runtime-api:delosDbRuntimeApiJar', ':delosdb-storage-io:delosDbStorageIoJar', ':delosdb-storage-api:storageApiJar', ':delosdb-derby-store-api:derbyStoreApiJar', ':delosdb-engine:derbyJar',
            ':delosdb-client:derbyClientJar', ':delosdb-tools:derbyToolsJar',
            ':delosdb-server:derbyNetJar', ':delosdb-optionaltools:derbyOptionalToolsJar',
            ':delosdb-runner:derbyRunJar', ':delosdb-osgi-stub:osgiFrameworkStubJar'
}

tasks.named('assemble') {
    dependsOn 'jars'
}


tasks.register('sysinfoFromJars', JavaExec) {
    dependsOn 'jars'
    group = 'verification'
    description = 'Runs DelosDB sysinfo from the assembled jars in build/libs.'
    classpath = runtimeJars()
    mainClass = 'org.apache.derby.run.run'
    args 'sysinfo'
}

tasks.register('smokeFromJars', JavaExec) {
    dependsOn 'jars'
    mustRunAfter 'smoke'
    group = 'verification'
    description = 'Runs the embedded JDBC smoke script from the assembled jars in build/libs.'
    classpath = runtimeJars()
    mainClass = 'org.apache.derby.run.run'
    args 'ij', smokeSqlFile.absolutePath
    workingDir = projectDir
    doFirst {
        delete file('build/smoke-db')
    }
}



def distributionBaseName = "delosdb-${delosDbVersion}"
def distributionStagingDir = layout.buildDirectory.dir("release/${distributionBaseName}")
def distributionDocFiles = files(
        'README.md',
        'CONTRIBUTING.md',
        'GOVERNANCE.md',
        'SECURITY.md',
        'NOTICE-FORK.md'
)

tasks.register('prepareBinaryDistribution', Copy) {
    dependsOn 'jars'
    group = 'distribution'
    description = 'Stages the DelosDB binary distribution layout under build/release.'
    into distributionStagingDir
    from(distributionDocFiles)
    from(legalFiles)
    from('docs') {
        into 'docs'
    }
    from('bin') {
        into 'bin'
    }
    from(runtimeJars()) {
        into 'lib'
    }
    from(smokeSqlFile) {
        into 'examples'
    }
    doFirst {
        delete distributionStagingDir.get().asFile
    }
}

tasks.register('delosdbBinaryZip', Zip) {
    dependsOn 'prepareBinaryDistribution'
    group = 'distribution'
    description = 'Assembles the DelosDB binary ZIP distribution.'
    archiveBaseName = 'delosdb'
    archiveVersion = delosDbVersion
    archiveClassifier = 'bin'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(distributionStagingDir) {
        into distributionBaseName
    }
}

tasks.register('delosdbBinaryTar', Tar) {
    dependsOn 'prepareBinaryDistribution'
    group = 'distribution'
    description = 'Assembles the DelosDB binary tar.gz distribution.'
    archiveBaseName = 'delosdb'
    archiveVersion = delosDbVersion
    archiveClassifier = 'bin'
    archiveExtension = 'tar.gz'
    compression = Compression.GZIP
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(distributionStagingDir) {
        into distributionBaseName
    }
}


tasks.register('dist') {
    dependsOn 'delosdbBinaryZip', 'delosdbBinaryTar'
    group = 'distribution'
    description = 'Builds the DelosDB binary distribution archives.'
}

tasks.register('sysinfo', JavaExec) {
    dependsOn 'compileAll'
    group = 'verification'
    description = 'Runs DelosDB sysinfo from Gradle-built classes.'
    classpath = moduleDirsForRuntime
    mainClass = 'org.apache.derby.run.run'
    args 'sysinfo'
}

tasks.register('smoke', JavaExec) {
    dependsOn 'jars'
    group = 'verification'
    description = 'Runs a small embedded JDBC create/insert/select script using assembled runtime jars.'
    classpath = runtimeJars()
    mainClass = 'org.apache.derby.run.run'
    args 'ij', smokeSqlFile.absolutePath
    workingDir = projectDir
    doFirst {
        delete file('build/smoke-db')
    }
}
