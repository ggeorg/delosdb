import org.gradle.api.tasks.compile.JavaCompile

// Phase F0/F1a native integration start.
// Non-behavioral bridge freeze plus parser-owned provider-syntax confirmation.

ext.delosdbStoragePhaseF0F1aReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseF0F1aReportFile =
        ext.delosdbStoragePhaseF0F1aReportDir.map { it.file('storage-phase-f0-f1a-native-start.txt') }
ext.delosdbStoragePhaseF0F1aSmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-f1a-provider-syntax-smoke')

ext.delosdbStoragePhaseF0F1aRelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseF0F1aRequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF0F1aRelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseF0F1aForbidTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        return
    }
    def text = sourceFile.text
    tokens.each { token ->
        if (text.contains(token)) {
            errors << "${label} must not contain forbidden token: ${token}"
        }
    }
}

ext.delosdbStoragePhaseF0F1aModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseF0F1aRuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseF0F1aClasspath = {
    files(
            delosdbStoragePhaseF0F1aSmokeClassesDir,
            delosdbStoragePhaseF0F1aModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseF0F1aModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseF0F1aModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseF0F1aModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseF0F1aRuntimeJars())
}

ext.delosdbStoragePhaseF0F1aProof = {
    def errors = []
    def lines = []

    def buildFile = file('build.gradle')
    def bridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def grammar = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/sqlgrammar.jj')
    def createTableNode = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/CreateTableNode.java')
    def tableDescriptor = file('delosdb-engine/src/main/java/org/apache/derby/iapi/sql/dictionary/TableDescriptor.java')
    def sysTables = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/catalog/SYSTABLESRowFactory.java')
    def planDoc = file('docs/storage-phase-f-native-integration-plan.md')
    def startDoc = file('docs/storage-phase-f0-f1a-start.md')
    def roadmap = file('docs/ROADMAP.md')
    def gitignore = file('.gitignore')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')
    def smokeSource = file('dev/storage-phase-f1a-provider-syntax-smoke/src/main/java/delosdb/smoke/StoragePhaseF1aProviderSyntaxSmoke.java')

    delosdbStoragePhaseF0F1aRequireTokens(errors, buildFile, [
            "apply from: file('gradle/storage-phase-c37-route-retirement-closeout.gradle')",
            "apply from: file('gradle/storage-phase-f0-f1a-native-start.gradle')"
    ], 'root build F0/F1a wiring')
    if (buildFile.exists()) {
        def text = buildFile.text
        def c37 = text.indexOf("apply from: file('gradle/storage-phase-c37-route-retirement-closeout.gradle')")
        def f0 = text.indexOf("apply from: file('gradle/storage-phase-f0-f1a-native-start.gradle')")
        if (c37 < 0 || f0 < 0 || f0 < c37) {
            errors << 'F0/F1a apply must appear after C37 in build.gradle'
        }
    }

    delosdbStoragePhaseF0F1aRequireTokens(errors, bridge, [
            'Transitional SQL/JDBC bridge',
            'Phase F freezes this bridge',
            'do not add new bridge-only SQL routes or new regex routes',
            'private static final Pattern CREATE_TABLE',
            'private static final Pattern CREATE_INDEX',
            'private static final Pattern SELECT_ALL',
            'private static final Pattern SELECT_COUNT',
            'private static final Pattern SELECT_WHERE_RANGE',
            'private static final Pattern SELECT_WHERE_BETWEEN'
    ], 'F0 transitional bridge boundary')
    delosdbStoragePhaseF0F1aForbidTokens(errors, bridge, [
            'private static final Pattern INSERT_VALUES',
            'private static final Pattern DELETE_WHERE_EQUALS',
            'private static final Pattern UPDATE_WHERE_EQUALS',
            'private static final Pattern SELECT_WHERE_EQUALS'
    ], 'F0 retired regex routes remain retired')

    delosdbStoragePhaseF0F1aRequireTokens(errors, grammar, [
            'storageProviderClause() throws StandardException',
            '<USING> storageProviderName = identifier',
            '[ storageProviderName = storageProviderClause() ]',
            'storageProviderName,'
    ], 'F1a parser-owned storage provider clause')
    delosdbStoragePhaseF0F1aRequireTokens(errors, createTableNode, [
            'String           storageProviderName',
            'this.storageProviderName = SqlExtensionProviderValidation.normalizeStorageProviderName(storageProviderName)',
            'SqlExtensionProviderValidation.requireStorageProvider(storageProviderName)',
            'storageProviderName,'
    ], 'F1a CreateTableNode provider handoff')
    delosdbStoragePhaseF0F1aRequireTokens(errors, tableDescriptor, [
            'private String                  storageProviderName',
            'getStorageProviderName()',
            'setStorageProviderName(String storageProviderName)',
            'normalizeStorageProviderName(storageProviderName)'
    ], 'F1a TableDescriptor in-memory provider field')
    delosdbStoragePhaseF0F1aRequireTokens(errors, sysTables, [
            'SYSTABLES_COLUMN_COUNT = 6',
            'SYSTABLES_STORAGEPROVIDER = 6',
            'SystemColumnImpl.getIdentifierColumn("STORAGEPROVIDER", true)'
    ], 'F2.1 catalog provider column is present after F2 starts')

    delosdbStoragePhaseF0F1aRequireTokens(errors, planDoc, [
            'Phase F is the clean-design correction',
            'F1a — parser-owned provider syntax confirmation',
            'F2 — persist provider identity in catalog',
            'Add a nullable provider-name column to SYSTABLES',
            'F3 — provider-aware ResultSetFactory proof',
            'GenericResultSetFactory.getTableScanResultSet',
            'Qualifier.getColumnId() ordinal',
            'Qualifier.getOrderable() returns StoreDataValue',
            'Native mode bypasses bridge interception globally'
    ], 'Phase F native integration plan')
    delosdbStoragePhaseF0F1aRequireTokens(errors, startDoc, [
            'no new bridge-only SQL routes',
            'no new regex route declarations',
            'sqlgrammar.jj has storageProviderClause()',
            'Do not commit generated database binaries'
    ], 'F0/F1a start document')
    delosdbStoragePhaseF0F1aRequireTokens(errors, roadmap, [
            'Active lane: storage Phase F native Derby execution integration',
            'F1 grammar work is already done',
            'F2  — persist storageProviderName across restart',
            'provider-aware ResultSetFactory'
    ], 'ROADMAP Phase F update')
    delosdbStoragePhaseF0F1aRequireTokens(errors, gitignore, [
            '/storage-phase-*-db',
            '/storage-phase-*-db/**'
    ], 'storage smoke DB gitignore')
    delosdbStoragePhaseF0F1aRequireTokens(errors, cleanupScript, [
            'storage-phase-f1a-provider-syntax-db'
    ], 'F1a smoke DB cleanup entry')
    delosdbStoragePhaseF0F1aRequireTokens(errors, smokeSource, [
            'StoragePhaseF1aProviderSyntaxSmoke',
            'CREATE TABLE F1A_PROVIDER_SYNTAX (id INT, value VARCHAR(32)) USING delos_mvcc',
            'connection.prepareStatement',
            'lastRouteClassifierForTesting().isEmpty()',
            'storage_phase_f1a_provider_syntax: PASS'
    ], 'F1a provider syntax smoke')

    lines << 'DelosDB Storage Phase F0/F1a Native Integration Start'
    lines << '====================================================='
    lines << ''
    lines << 'Purpose:'
    lines << '  Freeze bridge expansion and confirm provider syntax is already parser-owned.'
    lines << ''
    lines << 'Verified facts:'
    lines << '  sqlgrammar.jj already has storageProviderClause().' 
    lines << '  CreateTableNode and TableDescriptor already carry storageProviderName in memory.'
    lines << '  F2.1 has started catalog persistence by adding SYSTABLES.STORAGEPROVIDER.'
    lines << '  VersionedStorageSqlBridge is transitional scaffolding, not the Phase F target.'
    lines << ''
    lines << 'Next real architecture step:'
    lines << '  Continue F2 provider-name catalog persistence toward native ResultSetFactory integration.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseF0F1aNativeStartReport') {
    group = 'verification'
    description = 'Writes the Phase F0/F1a native integration start report.'
    dependsOn 'verifyStoragePhaseC37RouteRetirementCloseout'
    outputs.file(delosdbStoragePhaseF0F1aReportFile)
    doLast {
        def result = delosdbStoragePhaseF0F1aProof()
        def outputFile = delosdbStoragePhaseF0F1aReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase F0/F1a native integration start failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseF1aProviderSyntaxSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase F1a provider syntax parser smoke test.'
    source = files('dev/storage-phase-f1a-provider-syntax-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseF0F1aSmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseF0F1aClasspath()
}

tasks.register('storagePhaseF1aProviderSyntaxSmoke', JavaExec) {
    dependsOn 'storagePhaseF0F1aNativeStartReport', 'compileStoragePhaseF1aProviderSyntaxSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase F1a provider syntax parser smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseF1aProviderSyntaxSmoke'
    classpath = delosdbStoragePhaseF0F1aClasspath()
}

tasks.register('verifyStoragePhaseF0F1aNativeStart') {
    group = 'verification'
    description = 'Verifies Phase F0/F1a native integration start.'
    dependsOn 'storagePhaseF0F1aNativeStartReport', 'storagePhaseF1aProviderSyntaxSmoke'
    doLast {
        println 'Verified Phase F0/F1a native integration start; next step is F2 provider catalog persistence'
    }
}
