// DelosDB generated-class compiler modernisation inventory and final gates.
//
// Compiler Phase 6 closes the backend migration: ClassFileJava is the sole
// production implementation and no external ASM source, dependency, module
// edge, runtime artifact, test oracle, or backend selector may remain.

def delosCompilerRepositoryRoot = rootProject.projectDir
def delosCompilerBuildRoot = rootProject.layout.buildDirectory.get().asFile

def delosCompilerRelative = { File file ->
    delosCompilerRepositoryRoot.toPath()
            .relativize(file.toPath())
            .toString()
            .replace('\\', '/')
}

def delosCompilerProductionJavaFiles = {
    rootProject.fileTree(delosCompilerRepositoryRoot) {
        include 'delosdb-*/src/main/java/**/*.java'
        exclude 'delosdb-buildtools/**'
        exclude 'delosdb-tests/**'
    }.files.sort { left, right -> left.path <=> right.path }
}

def delosCompilerTestJavaFiles = {
    rootProject.fileTree(new File(delosCompilerRepositoryRoot,
            'delosdb-tests/src/test/java')) {
        include '**/*.java'
    }.files.sort { left, right -> left.path <=> right.path }
}

def delosCompilerRuntimeBuildFiles = {
    List<File> files = []
    files.add(new File(delosCompilerRepositoryRoot, 'build.gradle'))
    files.add(new File(delosCompilerRepositoryRoot,
            'gradle/delosdb-runtime-artifacts.gradle'))
    rootProject.fileTree(delosCompilerRepositoryRoot) {
        include 'delosdb-*/build.gradle'
        include 'benchmarks/**/build.gradle'
        include 'delosdb-*/src/main/java/module-info.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
    }.files.each { files.add(it) }
    files.findAll { it.isFile() }
            .unique { it.canonicalPath }
            .sort { left, right -> left.path <=> right.path }
}

def delosCompilerManifestRows = {
    File manifest = new File(delosCompilerRepositoryRoot,
            'gradle/static-analysis/delosdb-generated-class-modernization.txt')
    if (!manifest.isFile()) {
        return []
    }
    manifest.readLines('UTF-8')
            .findAll { line -> line.trim() && !line.startsWith('#') }
            .collect { line ->
                def parts = line.split('\\|', -1)
                if (parts.length != 5) {
                    throw new GradleException(
                            'Invalid generated-class modernisation manifest row: ' + line)
                }
                [id: parts[0], category: parts[1], path: parts[2],
                 marker: parts[3], reason: parts[4]]
            }
}

def delosCompilerForbiddenSourceTokens = [
        'org.objectweb.asm',
        'org.apache.derby.impl.services.bytecode.asm',
        'jdk.internal.org.objectweb.asm'
]

def delosCompilerForbiddenBuildTokens = [
        'org.ow2.asm:asm',
        'asmVersion',
        'delosdbAsm',
        'requires org.objectweb.asm'
]

tasks.register('delosGeneratedClassModernizationInventory') {
    group = 'verification'
    description = 'Reports the sole Class-File API generated-class backend and the final zero-external-ASM dependency surface.'
    dependsOn tasks.named('delosSharedRawStoreProductionCloseoutStaticAnalysis')

    File reportFile = new File(delosCompilerBuildRoot,
            'reports/delosdb/compiler/generated-class-modernization-inventory.txt')
    outputs.file(reportFile)
    outputs.upToDateWhen { false }

    doLast {
        List<File> productionJava = delosCompilerProductionJavaFiles()
        List<File> testJava = delosCompilerTestJavaFiles()
        List<File> runtimeBuildFiles = delosCompilerRuntimeBuildFiles()
        List<File> classFileImportFiles = productionJava.findAll { file ->
            file.getText('UTF-8').contains('import java.lang.classfile.')
        }
        List<String> forbiddenSourceRows = []
        (productionJava + testJava).each { file ->
            String text = file.getText('UTF-8')
            delosCompilerForbiddenSourceTokens.each { token ->
                if (text.contains(token)) {
                    forbiddenSourceRows.add(delosCompilerRelative(file) + ': ' + token)
                }
            }
        }
        List<String> forbiddenBuildRows = []
        runtimeBuildFiles.each { file ->
            String text = file.getText('UTF-8')
            delosCompilerForbiddenBuildTokens.each { token ->
                if (text.contains(token)) {
                    forbiddenBuildRows.add(delosCompilerRelative(file) + ': ' + token)
                }
            }
        }
        File methodBuilder = new File(delosCompilerRepositoryRoot,
                'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/compiler/MethodBuilder.java')
        String methodBuilderSource = methodBuilder.getText('UTF-8')
                .replaceAll('(?s)/\\*.*?\\*/', '')
                .replaceAll('(?m)//.*$', '')
        int methodBuilderOperations = 0
        def matcher = java.util.regex.Pattern.compile(
                '(?m)^\\s*(?:public\\s+)?[A-Za-z0-9_<>?,.\\[\\] ]+\\s+'
                        + '[A-Za-z0-9_]+\\s*\\([^;{}]*\\)\\s*;')
                .matcher(methodBuilderSource)
        while (matcher.find()) {
            methodBuilderOperations++
        }

        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB generated-class modernisation inventory')
            writer.println('================================================')
            writer.println('Phase: COMPILER_PHASE_6_ASM_REMOVAL')
            writer.println('Production authority: CLASSFILE_API_SOLE_BACKEND')
            writer.println('Existing abstraction: JavaFactory/ClassBuilder/MethodBuilder/LocalField')
            writer.println('Normal runtime backend selector: none')
            writer.println('Production Java files scanned: ' + productionJava.size())
            writer.println('Test Java files scanned: ' + testJava.size())
            writer.println('Runtime build/module files scanned: ' + runtimeBuildFiles.size())
            writer.println('Class-File API production import files: ' + classFileImportFiles.size())
            classFileImportFiles.each { writer.println('- ' + delosCompilerRelative(it)) }
            writer.println('MethodBuilder declared operations: ' + methodBuilderOperations)
            writer.println('Forbidden source rows: ' + forbiddenSourceRows.size())
            forbiddenSourceRows.each { writer.println('- ' + it) }
            writer.println('Forbidden build/module rows: ' + forbiddenBuildRows.size())
            forbiddenBuildRows.each { writer.println('- ' + it) }
        }
        logger.lifecycle('Generated-class modernisation inventory written: {}', reportFile)
    }
}

tasks.register('delosGeneratedClassModernizationStaticAnalysis') {
    group = 'verification'
    description = 'Validates the final Class-File API-only generated-class architecture and zero external ASM dependency surface.'
    dependsOn tasks.named('delosGeneratedClassModernizationInventory')

    doLast {
        List<String> failures = []
        List<Map<String, String>> rows = delosCompilerManifestRows()
        Set<String> ids = [] as Set
        Set<String> categories = [] as Set

        if (rows.size() < 18) {
            failures.add('Generated-class modernisation manifest must contain at least 18 final-state rows; found ' + rows.size())
        }
        rows.each { row ->
            if (!ids.add(row.id)) {
                failures.add('Duplicate generated-class manifest id: ' + row.id)
            }
            categories.add(row.category)
            File proof = new File(delosCompilerRepositoryRoot, row.path)
            if (!proof.isFile()) {
                failures.add('Generated-class proof path is missing for ' + row.id + ': ' + row.path)
            } else if (!proof.getText('UTF-8').contains(row.marker)) {
                failures.add('Generated-class proof marker is missing for ' + row.id + ': ' + row.marker)
            }
            if (row.reason.length() < 90) {
                failures.add('Generated-class manifest reason is too thin for ' + row.id)
            }
        }
        ['CONTRACT', 'CLASSFILE_BACKEND', 'BACKEND_REGISTRATION',
         'BEHAVIOR_TEST', 'PRODUCTION_TEST', 'DEPENDENCY_REMOVAL',
         'MODULE_REMOVAL', 'RUNTIME_MODEL', 'ACCEPTANCE', 'SQLANCER',
         'DESIGN', 'POLICY', 'ROADMAP', 'STATIC_GATE', 'ROOT_WIRING'].each { category ->
            if (!categories.contains(category)) {
                failures.add('Generated-class manifest is missing final category: ' + category)
            }
        }

        List<File> productionJava = delosCompilerProductionJavaFiles()
        List<File> testJava = delosCompilerTestJavaFiles()
        (productionJava + testJava).each { file ->
            String text = file.getText('UTF-8')
            delosCompilerForbiddenSourceTokens.each { token ->
                if (text.contains(token)) {
                    failures.add('Forbidden ASM source reference remains in '
                            + delosCompilerRelative(file) + ': ' + token)
                }
            }
        }
        delosCompilerRuntimeBuildFiles().each { file ->
            String text = file.getText('UTF-8')
            delosCompilerForbiddenBuildTokens.each { token ->
                if (text.contains(token)) {
                    failures.add('Forbidden ASM build/module reference remains in '
                            + delosCompilerRelative(file) + ': ' + token)
                }
            }
        }

        File retiredBackend = new File(delosCompilerRepositoryRoot,
                'delosdb-engine/src/main/java/org/apache/derby/impl/services/bytecode/asm/AsmJava.java')
        if (retiredBackend.exists()) {
            failures.add('Retired AsmJava source remains: ' + retiredBackend)
        }

        File classFileBackend = new File(delosCompilerRepositoryRoot,
                'delosdb-engine/src/main/java/org/apache/derby/impl/services/bytecode/classfile/ClassFileJava.java')
        String classFileText = classFileBackend.isFile()
                ? classFileBackend.getText('UTF-8') : ''
        ['implements JavaFactory', 'COMPILER_PHASE_6_ASM_REMOVAL',
         'CLASSFILE_PRODUCTION_SOLE_BACKEND', 'import java.lang.classfile.ClassFile;'].each { marker ->
            if (!classFileText.contains(marker)) {
                failures.add('Sole Class-File API backend is missing: ' + marker)
            }
        }

        File modules = new File(delosCompilerRepositoryRoot,
                'delosdb-engine/src/main/java/org/apache/derby/modules.properties')
        List<String> registrations = modules.readLines('UTF-8').findAll { line ->
            line.startsWith('derby.module.javaCompiler=')
        }
        if (registrations != [
                'derby.module.javaCompiler=org.apache.derby.impl.services.bytecode.classfile.ClassFileJava']) {
            failures.add('Exactly one Class-File API production registration is required; found ' + registrations)
        }

        File compilerRoot = new File(delosCompilerRepositoryRoot,
                'delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile')
        rootProject.fileTree(compilerRoot) { include '**/*.java' }.files.each { file ->
            String text = file.getText('UTF-8')
            if (text.contains('java.lang.classfile')) {
                failures.add('SQL compiler node imports the Class-File API directly: '
                        + delosCompilerRelative(file))
            }
        }
        productionJava.each { file ->
            String text = file.getText('UTF-8')
            ['GeneratedClassBackend', 'GeneratedClassPlan', 'GeneratedClassBytes'].each { forbidden ->
                if (text.contains(forbidden)) {
                    failures.add('Duplicate generation abstraction remains in '
                            + delosCompilerRelative(file) + ': ' + forbidden)
                }
            }
            if (text.contains('delosdb.compiler.backend')) {
                failures.add('Normal runtime backend selector remains in '
                        + delosCompilerRelative(file))
            }
        }

        File rootBuild = new File(delosCompilerRepositoryRoot, 'build.gradle')
        String rootBuildText = rootBuild.getText('UTF-8')
        if (!rootBuildText.contains(
                "apply from: 'gradle/delosdb-compiler-modernization-static-analysis.gradle'")) {
            failures.add('Root build must apply the dedicated compiler-modernisation script')
        }
        if (!rootBuildText.contains(
                "dependsOn 'delosGeneratedClassModernizationStaticAnalysis'")) {
            failures.add('S0 must include the generated-class modernisation gate')
        }

        File reportFile = new File(delosCompilerBuildRoot,
                'reports/delosdb/compiler/generated-class-modernization-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB generated-class modernisation static analysis')
            writer.println('=====================================================')
            writer.println('Phase: COMPILER_PHASE_6_ASM_REMOVAL')
            writer.println('Manifest rows: ' + rows.size())
            writer.println('Categories: ' + categories.sort().join(', '))
            writer.println('Production backend count: 1')
            writer.println('External ASM source references: 0')
            writer.println('External ASM dependency/module references: 0')
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { writer.println('- ' + it) }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(
                    'Generated-class modernisation static analysis failed. Report: ' + reportFile)
        }
        logger.lifecycle('Generated-class modernisation static analysis passed. Report: {}', reportFile)
    }
}
