// Phase C37 route-retirement closeout.
// Non-behavioral consolidation for C27-C36: guarantee honesty, leftover predicate
// evaluation, JavaCC classifier expansion, and controlled regex deletion inventory.

ext.delosdbStoragePhaseC37ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC37ReportFile =
        ext.delosdbStoragePhaseC37ReportDir.map { it.file('storage-phase-c37-route-retirement-closeout.txt') }

ext.delosdbStoragePhaseC37RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC37RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC37RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC37ForbidTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        return
    }
    def text = sourceFile.text
    tokens.each { token ->
        if (text.contains(token)) {
            errors << "${label} must not contain forbidden token: ${token}"
        }
    }
}

ext.delosdbStoragePhaseC37Proof = {
    def errors = []
    def lines = []

    def buildFile = file('build.gradle')
    def closeoutDoc = file('docs/storage-phase-c27-c36-closeout.md')
    def phaseEPlan = file('docs/storage-phase-e-plan.md')
    def tableAccess = file('delosdb-engine-kernel/src/main/java/org/apache/derby/iapi/store/types/DelosTableAccess.java')
    def guarantee = file('delosdb-engine-kernel/src/main/java/org/apache/derby/iapi/store/types/DelosTableGuarantee.java')
    def mvccAdapter = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/storetypes/EngineMvccTableAccess.java')
    def heapProof = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/storetypes/EngineHeapTableAccessProof.java')
    def classifier = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/DelosVersionedStorageQueryTreeClassifier.java')
    def bridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')
    def gitignore = file('.gitignore')

    delosdbStoragePhaseC37RequireTokens(errors, buildFile, [
            "apply from: file('gradle/storage-phase-c36-update-regex-deletion.gradle')",
            "apply from: file('gradle/storage-phase-c37-route-retirement-closeout.gradle')"
    ], 'root build Phase C37 wiring')
    if (buildFile.exists()) {
        def text = buildFile.text
        def c36 = text.indexOf("apply from: file('gradle/storage-phase-c36-update-regex-deletion.gradle')")
        def c37 = text.indexOf("apply from: file('gradle/storage-phase-c37-route-retirement-closeout.gradle')")
        if (c36 < 0 || c37 < 0 || c37 < c36) {
            errors << 'C37 apply must appear after C36 in build.gradle'
        }
    }

    delosdbStoragePhaseC37RequireTokens(errors, closeoutDoc, [
            'C27 — guarantee honesty',
            'C28 — caller-side NOT_EQUAL leftover-predicate evaluation',
            'C29 — JavaCC / QueryTreeNode range SELECT classifier',
            'C30 — first range-regex deletion: standalone >',
            'C31 — JavaCC / QueryTreeNode INSERT VALUES classifier',
            'C32 — INSERT VALUES regex deletion',
            'C33 — JavaCC / QueryTreeNode DELETE equality classifier',
            'C34 — DELETE equality regex deletion',
            'C35 — JavaCC / QueryTreeNode UPDATE equality classifier',
            'C36 — UPDATE equality regex deletion',
            'SELECT * FROM table WHERE column = literal',
            'SELECT * FROM table WHERE column > literal',
            'INSERT INTO table VALUES (...)',
            'DELETE FROM table WHERE column = literal',
            'UPDATE table SET column = literal WHERE column = literal',
            'Remaining regex fallback routes',
            'EmbedStatement -> VersionedStorageSqlBridge.tryExecute(...)'
    ], 'C27-C36 closeout document')

    delosdbStoragePhaseC37RequireTokens(errors, phaseEPlan, [
            'C37 is non-behavioral',
            'C36 deletes the matching direct UPDATE regex branch',
            'Remaining regex routes stay as explicit temporary fallbacks'
    ], 'Phase E plan C37 update')

    delosdbStoragePhaseC37RequireTokens(errors, tableAccess, [
            'DelosTableCapabilities capabilities()',
            'default Set<DelosTableGuarantee> guarantees()',
            'semantic guarantees',
            'structural'
    ], 'C27 DelosTableAccess capability/guarantee split')
    delosdbStoragePhaseC37RequireTokens(errors, guarantee, [
            'ROW_LOCKING',
            'DURABLE_RECOVERY_LOG',
            'SNAPSHOT_ISOLATION'
    ], 'C27 DelosTableGuarantee enum')
    delosdbStoragePhaseC37ForbidTokens(errors, guarantee, [
            'DURABLE_WAL',
            'POINT_IN_TIME_RECOVERY'
    ], 'C27 guarantee enum')

    delosdbStoragePhaseC37RequireTokens(errors, mvccAdapter, [
            'DelosTableGuarantee.SNAPSHOT_ISOLATION',
            'DelosTableGuarantee.DURABLE_RECOVERY_LOG',
            'mutableFilters.remove(equality.predicate())'
    ], 'C27/C28 MVCC adapter guarantees and pushdown')
    delosdbStoragePhaseC37ForbidTokens(errors, mvccAdapter, [
            'DelosTableGuarantee.ROW_LOCKING'
    ], 'MVCC adapter guarantee honesty')
    delosdbStoragePhaseC37RequireTokens(errors, heapProof, [
            'DelosTableGuarantee.ROW_LOCKING',
            'DelosTableGuarantee.DURABLE_RECOVERY_LOG',
            'UnsupportedOperationException'
    ], 'C27 heap proof guarantees')

    delosdbStoragePhaseC37RequireTokens(errors, classifier, [
            'selectWhereComparison(String sql)',
            'insertValues(String sql)',
            'deleteWhereEquals(String sql)',
            'updateWhereEquals(String sql)',
            'classifySelectWhereComparison',
            'classifyInsertValues',
            'classifyDeleteWhereEquals',
            'classifyUpdateWhereEquals',
            'compilerContext.getParser().parseStatement(sql)'
    ], 'C29/C31/C33/C35 JavaCC classifiers')
    delosdbStoragePhaseC37ForbidTokens(errors, classifier, [
            'Pattern.compile(',
            '.matcher(',
            'DelosTableGuarantee',
            'guarantees()',
            'FunctionCall',
            'RexNode'
    ], 'classifier remains parser-tree classification only')

    delosdbStoragePhaseC37RequireTokens(errors, bridge, [
            'DelosVersionedStorageQueryTreeClassifier.selectWhereComparison(normalizedSql)',
            'DelosVersionedStorageQueryTreeClassifier.insertValues(normalizedSql)',
            'DelosVersionedStorageQueryTreeClassifier.deleteWhereEquals(normalizedSql)',
            'DelosVersionedStorageQueryTreeClassifier.updateWhereEquals(normalizedSql)',
            'requireTableGuarantee(tableAccess, DelosTableGuarantee.SNAPSHOT_ISOLATION, "SELECT equality")',
            'case NOT_EQUAL -> !Objects.equals(expected, actual)',
            'private static final Pattern CREATE_TABLE',
            'private static final Pattern CREATE_INDEX',
            'private static final Pattern SELECT_ALL',
            'private static final Pattern SELECT_COUNT',
            'private static final Pattern SELECT_WHERE_RANGE',
            'private static final Pattern SELECT_WHERE_BETWEEN'
    ], 'C37 bridge final route inventory')
    if (bridge.exists()) {
        def bridgeText = bridge.text
        [
                'private static final Pattern SELECT_WHERE_EQUALS',
                'private static final Pattern INSERT_VALUES',
                'private static final Pattern DELETE_WHERE_EQUALS',
                'private static final Pattern UPDATE_WHERE_EQUALS',
                'SELECT_WHERE_EQUALS.matcher(normalizedSql)',
                'INSERT_VALUES.matcher(normalizedSql)',
                'DELETE_WHERE_EQUALS.matcher(normalizedSql)',
                'UPDATE_WHERE_EQUALS.matcher(normalizedSql)',
                'insert\\s+into',
                'delete\\s+from',
                'update\\s+'
        ].each { token ->
            if (bridgeText.contains(token)) {
                errors << "C37 retired route regression in VersionedStorageSqlBridge: ${token}"
            }
        }
        def rangePatternToken = '>=|<=|<)'
        if (!bridgeText.contains(rangePatternToken)) {
            errors << 'C37 expects remaining range regex fallback to cover >=, <=, and < only'
        }
        if (bridgeText.contains('>=|>|<=|<') || bridgeText.contains('>|>=')) {
            errors << 'C37 standalone > range regex must remain deleted after C30'
        }
    }

    delosdbStoragePhaseC37RequireTokens(errors, cleanupScript, [
            'storage-phase-c36-update-regex-deletion-db'
    ], 'storage smoke DB cleanup script')
    delosdbStoragePhaseC37RequireTokens(errors, gitignore, [
            '/storage-phase-*-db',
            '/storage-phase-*-db/**'
    ], 'storage smoke DB gitignore')

    lines << 'DelosDB Storage Phase C37 Route-Retirement Closeout'
    lines << '==================================================='
    lines << ''
    lines << 'Purpose:'
    lines << '  Consolidate C27-C36 without adding behavior.'
    lines << ''
    lines << 'Verified closed slice:'
    lines << '  C27 separates structural capabilities from semantic guarantees.'
    lines << '  C28 evaluates NOT_EQUAL leftover predicates above table access.'
    lines << '  C29/C31/C33/C35 add QueryTreeNode routes for range SELECT, INSERT, DELETE, and UPDATE.'
    lines << '  C30/C32/C34/C36 delete only the matching proven regex routes.'
    lines << ''
    lines << 'Remaining regex fallbacks:'
    lines << '  CREATE TABLE, CREATE INDEX, SELECT *, SELECT COUNT(*), SELECT BETWEEN, and selected range forms.'
    lines << ''
    lines << 'Honest boundary:'
    lines << '  MVCC still enters through EmbedStatement -> VersionedStorageSqlBridge.tryExecute(...).'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC37RouteRetirementCloseoutReport') {
    group = 'verification'
    description = 'Writes the Phase C37 C27-C36 route-retirement closeout report.'
    dependsOn 'verifyStoragePhaseC36UpdateRegexDeletion'
    outputs.file(delosdbStoragePhaseC37ReportFile)
    doLast {
        def result = delosdbStoragePhaseC37Proof()
        def outputFile = delosdbStoragePhaseC37ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C37 route-retirement closeout failed; see ${outputFile}")
        }
    }
}

tasks.register('verifyStoragePhaseC37RouteRetirementCloseout') {
    group = 'verification'
    description = 'Verifies the Phase C37 C27-C36 route-retirement closeout and remaining regex inventory.'
    dependsOn 'storagePhaseC37RouteRetirementCloseoutReport'
    doLast {
        println 'Verified Phase C37 route-retirement closeout; next step should reassess remaining regex routes before extending D again'
    }
}
