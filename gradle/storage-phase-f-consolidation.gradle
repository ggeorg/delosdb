// Phase F consolidation closeout.
// Non-behavioral closeout for F0/F1a-F8: native Derby execution integration,
// bridge bypass strategy, stale guard cleanup, and explicit smoke DB cleanup.

ext.delosdbStoragePhaseFConsolidationReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseFConsolidationReportFile =
        ext.delosdbStoragePhaseFConsolidationReportDir.map { it.file('storage-phase-f-consolidation.txt') }

ext.delosdbStoragePhaseFConsolidationRelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseFConsolidationRequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseFConsolidationRelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseFConsolidationRejectTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseFConsolidationRelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def present = tokens.findAll { token -> text.contains(token) }
    if (!present.isEmpty()) {
        errors << "${label} contains forbidden tokens: ${present.join(', ')}"
    }
}

ext.delosdbStoragePhaseFConsolidationProof = {
    def errors = []
    def lines = []

    def buildFile = file('build.gradle')
    def roadmap = file('docs/ROADMAP.md')
    def planDoc = file('docs/storage-phase-f-native-integration-plan.md')
    def closeoutDoc = file('docs/storage-phase-f-consolidation.md')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')
    def gitignore = file('.gitignore')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def embedStatement = file('delosdb-engine/src/main/java/org/apache/derby/impl/jdbc/EmbedStatement.java')
    def tableScan = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosTableScanResultSet.java')
    def insertRs = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosInsertResultSet.java')
    def deleteRs = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosDeleteResultSet.java')
    def updateRs = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosUpdateResultSet.java')
    def factory = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/GenericResultSetFactory.java')

    delosdbStoragePhaseFConsolidationRequireTokens(errors, buildFile, [
            "apply from: file('gradle/storage-phase-f0-f1a-native-start.gradle')",
            "apply from: file('gradle/storage-phase-f2-provider-catalog-persistence.gradle')",
            "apply from: file('gradle/storage-phase-f2-resultset-metadata-lookup.gradle')",
            "apply from: file('gradle/storage-phase-f3-factory-branch-proof.gradle')",
            "apply from: file('gradle/storage-phase-f3-delos-table-scan-skeleton.gradle')",
            "apply from: file('gradle/storage-phase-f4-native-select-equality.gradle')",
            "apply from: file('gradle/storage-phase-f5-native-insert.gradle')",
            "apply from: file('gradle/storage-phase-f6-native-delete-equality.gradle')",
            "apply from: file('gradle/storage-phase-f7-native-update-equality.gradle')",
            "apply from: file('gradle/storage-phase-f8-bridge-bypass.gradle')",
            "apply from: file('gradle/storage-phase-f-consolidation.gradle')"
    ], 'root build Phase F consolidation wiring')
    if (buildFile.exists()) {
        def text = buildFile.text
        def f8 = text.indexOf("apply from: file('gradle/storage-phase-f8-bridge-bypass.gradle')")
        def consolidation = text.indexOf("apply from: file('gradle/storage-phase-f-consolidation.gradle')")
        if (f8 < 0 || consolidation < 0 || consolidation < f8) {
            errors << 'Phase F consolidation apply must appear after F8 in build.gradle'
        }
    }

    delosdbStoragePhaseFConsolidationRequireTokens(errors, roadmap, [
            'Completed lane: storage Phase F native Derby execution integration',
            'F0  — freeze bridge expansion and clean generated smoke DB artifacts',
            'F1a — parser-owned provider syntax confirmation smoke only',
            'F2.1 landed — persist storageProviderName across restart via nullable SYSTABLES.STORAGEPROVIDER',
            'F2.2 landed — add DelosTableScanProviderLookup for ResultSetFactory metadata lookup preparation',
            'F3.1 landed — provider-aware ResultSetFactory branch proof',
            'F3.2 landed — DelosTableScanResultSet skeleton',
            'F4 landed — native MVCC SELECT equality through generated activation/result-set path',
            'F5 landed — native INSERT through provider-owned table access',
            'F6 landed — native DELETE equality through provider-owned row identity delete',
            'F7 landed — native UPDATE equality through provider-owned row identity update',
            'F8 landed — bridge bypass for native mode, compatibility bridge explicit only',
            'Active lane: storage Phase G native predicate coverage',
            'Next: G1 — native remaining range predicates'
    ], 'ROADMAP Phase F closeout and Phase G handoff')

    delosdbStoragePhaseFConsolidationRequireTokens(errors, planDoc, [
            'F0/F1a through F8 are closed',
            'F8 native mode bypasses bridge interception globally at EmbedStatement',
            'Phase F is complete after F8',
            'VersionedStorageSqlBridge remains compatibility/test scaffolding only',
            'G1 — native remaining range predicates'
    ], 'Phase F native integration plan closeout')

    delosdbStoragePhaseFConsolidationRequireTokens(errors, closeoutDoc, [
            'Storage Phase F consolidation',
            'F0/F1a through F8 are closed',
            'Native Derby execution path now covers',
            'SELECT equality',
            'INSERT',
            'DELETE equality',
            'UPDATE equality',
            'Bridge interception is globally bypassed in native mode',
            'No new bridge SQL routes',
            'Next phase is G1'
    ], 'Phase F consolidation document')

    delosdbStoragePhaseFConsolidationRequireTokens(errors, sqlBridge, [
            'NATIVE_EXECUTION_MODE_PROPERTY',
            'BRIDGE_INTERCEPTION_COMPATIBILITY_PROPERTY',
            'public static boolean isInterceptionEnabled()',
            'Boolean.getBoolean(NATIVE_EXECUTION_MODE_PROPERTY)',
            'Pattern.compile'
    ], 'VersionedStorageSqlBridge F8 compatibility scaffold')
    delosdbStoragePhaseFConsolidationRequireTokens(errors, embedStatement, [
            'VersionedStorageSqlBridge.isInterceptionEnabled()',
            'VersionedStorageSqlBridge.tryExecute('
    ], 'EmbedStatement bridge bypass gate')
    delosdbStoragePhaseFConsolidationRejectTokens(errors, sqlBridge, [
            'metadataBackedTableBypass',
            'lookupTableDescriptorBeforeParse'
    ], 'no metadata-backed pre-parse bypass')

    delosdbStoragePhaseFConsolidationRequireTokens(errors, factory, [
            'DelosTableScanResultSet.createIfEnabled(',
            'DelosInsertResultSet.createIfEnabled(',
            'DelosDeleteResultSet.createIfEnabled(',
            'DelosUpdateResultSet.createIfEnabled('
    ], 'GenericResultSetFactory native result-set seams')
    delosdbStoragePhaseFConsolidationRequireTokens(errors, tableScan, [
            'implements CursorResultSet',
            'Qualifier[][]',
            'qualifier.getColumnId()',
            'EngineMvccTableAccess.scan(',
            'currentDelosRowIdentity',
            'EngineStoreRowLocationBridge.newEngineRowLocation()'
    ], 'DelosTableScanResultSet native scan/mutation identity seam')
    delosdbStoragePhaseFConsolidationRequireTokens(errors, insertRs, [
            'EngineMvccTableAccess.insert(',
            'params.source.getNextRowCore()'
    ], 'DelosInsertResultSet native insert seam')
    delosdbStoragePhaseFConsolidationRequireTokens(errors, deleteRs, [
            'EngineMvccTableAccess.delete(',
            'row.rowIdentity().orElseThrow('
    ], 'DelosDeleteResultSet native delete seam')
    delosdbStoragePhaseFConsolidationRequireTokens(errors, updateRs, [
            'EngineMvccTableAccess.update(',
            'currentDelosRowIdentityForNativeMutation()',
            'changedColumnIds',
            'replacementNativeValues'
    ], 'DelosUpdateResultSet native update seam')

    def phaseFDbNames = [
            'storage-phase-f1a-provider-syntax-db',
            'storage-phase-f2-provider-catalog-db',
            'storage-phase-f2-resultset-lookup-db',
            'storage-phase-f3-factory-branch-db',
            'storage-phase-f3-delos-table-scan-skeleton-db',
            'storage-phase-f4-native-select-equality-db',
            'storage-phase-f5-native-insert-db',
            'storage-phase-f6-native-delete-equality-db',
            'storage-phase-f7-native-update-equality-db',
            'storage-phase-f8-bridge-bypass-db'
    ]
    delosdbStoragePhaseFConsolidationRequireTokens(errors, cleanupScript, phaseFDbNames, 'Phase F smoke DB cleanup entries')
    delosdbStoragePhaseFConsolidationRequireTokens(errors, gitignore, [
            '/storage-phase-*-db',
            '/storage-phase-*-db/**'
    ], 'storage smoke DB gitignore')
    if (cleanupScript.exists()) {
        cleanupScript.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed.startsWith('rm -rf ')) {
                def target = trimmed.substring('rm -rf '.length()).trim()
                if (target.contains('*') || target.contains('?') || target.contains('[') || target.startsWith('/') || target.contains('..')) {
                    errors << "cleanup script contains broad or unsafe rm target: ${trimmed}"
                }
            }
        }
    }

    lines << 'DelosDB Storage Phase F Consolidation Closeout'
    lines << '============================================='
    lines << ''
    lines << 'Purpose:'
    lines << '  Consolidate F0/F1a-F8 without adding behavior.'
    lines << ''
    lines << 'Verified closed slice:'
    lines << '  F0/F1a confirm parser-owned provider syntax and freeze bridge expansion.'
    lines << '  F2.1/F2.2 persist provider identity and expose ResultSetFactory metadata lookup.'
    lines << '  F3.1/F3.2 prove provider-aware ResultSetFactory scan branching and DelosTableScanResultSet.'
    lines << '  F4-F7 prove native SELECT equality, INSERT, DELETE equality, and UPDATE equality.'
    lines << '  F8 proves native mode bypasses EmbedStatement bridge interception globally.'
    lines << ''
    lines << 'Cleanup:'
    lines << '  scripts/delete-stale-storage-smoke-dbs.sh covers each Phase F smoke database explicitly.'
    lines << ''
    lines << 'Next step:'
    lines << '  G1 native remaining range predicates through DelosTableScanResultSet.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseFConsolidationReport') {
    group = 'verification'
    description = 'Writes the Phase F native Derby execution consolidation report.'
    dependsOn 'verifyStoragePhaseF8BridgeBypass'
    outputs.file(delosdbStoragePhaseFConsolidationReportFile)
    doLast {
        def result = delosdbStoragePhaseFConsolidationProof()
        def outputFile = delosdbStoragePhaseFConsolidationReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase F consolidation failed; see ${outputFile}")
        }
    }
}

tasks.register('verifyStoragePhaseFConsolidation') {
    group = 'verification'
    description = 'Verifies the Phase F native Derby execution closeout and cleanup inventory.'
    dependsOn 'storagePhaseFConsolidationReport'
    doLast {
        println 'Verified Phase F consolidation; next step is G1 native remaining range predicates'
    }
}
