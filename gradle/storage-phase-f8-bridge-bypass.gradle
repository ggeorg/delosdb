import org.gradle.api.tasks.compile.JavaCompile

// Phase F8 bridge-bypass proof.
// The EmbedStatement pre-parse VersionedStorageSqlBridge hook is globally
// bypassed in native mode. Compatibility/test mode can keep the old bridge
// explicitly enabled while native execution continues to move behind Derby
// parser/binder/optimizer/generated activation execution.

ext.delosdbStoragePhaseF8ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseF8ReportFile =
        ext.delosdbStoragePhaseF8ReportDir.map { it.file('storage-phase-f8-bridge-bypass.txt') }
ext.delosdbStoragePhaseF8SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-f8-bridge-bypass-smoke')

ext.delosdbStoragePhaseF8RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseF8RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF8RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseF8RejectTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF8RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def present = tokens.findAll { token -> text.contains(token) }
    if (!present.isEmpty()) {
        errors << "${label} contains forbidden tokens: ${present.join(', ')}"
    }
}

ext.delosdbStoragePhaseF8ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseF8RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseF8Classpath = {
    files(
            delosdbStoragePhaseF8SmokeClassesDir,
            delosdbStoragePhaseF8ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseF8ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseF8ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseF8ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseF8RuntimeJars())
}

ext.delosdbStoragePhaseF8Proof = {
    def errors = []
    def lines = []

    def buildFile = file('build.gradle')
    def embedStatement = file('delosdb-engine/src/main/java/org/apache/derby/impl/jdbc/EmbedStatement.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def smokeSource = file('dev/storage-phase-f8-bridge-bypass-smoke/src/main/java/delosdb/smoke/StoragePhaseF8BridgeBypassSmoke.java')
    def f8Gradle = file('gradle/storage-phase-f8-bridge-bypass.gradle')
    def f8Doc = file('docs/storage-phase-f8-bridge-bypass.md')
    def planDoc = file('docs/storage-phase-f-native-integration-plan.md')
    def roadmap = file('docs/ROADMAP.md')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')

    delosdbStoragePhaseF8RequireTokens(errors, buildFile, [
            "apply from: file('gradle/storage-phase-f7-native-update-equality.gradle')",
            "apply from: file('gradle/storage-phase-f8-bridge-bypass.gradle')"
    ], 'root build F8 wiring')
    if (buildFile.exists()) {
        def text = buildFile.text
        def f7 = text.indexOf("apply from: file('gradle/storage-phase-f7-native-update-equality.gradle')")
        def f8 = text.indexOf("apply from: file('gradle/storage-phase-f8-bridge-bypass.gradle')")
        if (f7 < 0 || f8 < 0 || f8 < f7) {
            errors << 'F8 apply must appear after F7 in build.gradle'
        }
    }

    delosdbStoragePhaseF8RequireTokens(errors, embedStatement, [
            'VersionedStorageSqlBridge.isInterceptionEnabled()',
            'VersionedStorageSqlBridge.tryExecute(',
            'lcc.prepareInternalStatement'
    ], 'EmbedStatement F8 bypass gate')
    delosdbStoragePhaseF8RequireTokens(errors, sqlBridge, [
            'NATIVE_EXECUTION_MODE_PROPERTY',
            'BRIDGE_INTERCEPTION_COMPATIBILITY_PROPERTY',
            'public static boolean isInterceptionEnabled()',
            'Boolean.getBoolean(NATIVE_EXECUTION_MODE_PROPERTY)',
            'BRIDGE_INTERCEPTION_COMPATIBILITY_PROPERTY,',
            '"true"'
    ], 'VersionedStorageSqlBridge F8 interception gate')
    delosdbStoragePhaseF8RequireTokens(errors, smokeSource, [
            'proveNativeModeBypassesEmbedStatementBridge()',
            'proveCompatibilityModeCanStillUseBridge()',
            'NATIVE_EXECUTION_MODE_PROPERTY',
            'BRIDGE_INTERCEPTION_COMPATIBILITY_PROPERTY',
            'VersionedStorageSqlBridge.resetRouteClassifierForTesting()',
            'VersionedStorageSqlBridge.lastRouteClassifierForTesting().isEmpty()',
            'VersionedStorageSqlBridge.lastRouteClassifierForTesting().isPresent()',
            'CREATE TABLE F8_NATIVE_BYPASS',
            'CREATE TABLE APP.F8_COMPAT_BRIDGE'
    ], 'F8 smoke proof')
    delosdbStoragePhaseF8RejectTokens(errors, sqlBridge, [
            'metadataBackedTableBypass',
            'lookupTableDescriptorBeforeParse'
    ], 'no per-table pre-parse metadata bypass')
    delosdbStoragePhaseF8RequireTokens(errors, f8Gradle, [
            'storagePhaseF8BridgeBypassSmoke',
            'verifyStoragePhaseF8BridgeBypass'
    ], 'F8 Gradle proof wiring')
    delosdbStoragePhaseF8RequireTokens(errors, f8Doc, [
            'F8 — bridge bypass strategy',
            'EmbedStatement',
            'native mode bypasses bridge interception globally',
            'compatibility/test mode',
            'does not inspect TableDescriptor before parse'
    ], 'F8 document')
    delosdbStoragePhaseF8RequireTokens(errors, planDoc, [
            'F8 landed',
            'native mode bypasses bridge interception globally',
            'G1 — native remaining range predicates'
    ], 'Phase F plan after F8')
    delosdbStoragePhaseF8RequireTokens(errors, roadmap, [
            'F8 landed',
            'Next: G1 — native remaining range predicates'
    ], 'ROADMAP after F8')
    delosdbStoragePhaseF8RequireTokens(errors, cleanupScript, [
            'storage-phase-f8-bridge-bypass-db'
    ], 'F8 smoke DB cleanup entry')

    lines << 'DelosDB Storage Phase F8 Bridge Bypass Proof'
    lines << '============================================='
    lines << ''
    lines << 'Purpose:'
    lines << '  Prove native mode disables the EmbedStatement pre-parse VersionedStorageSqlBridge hook globally.'
    lines << ''
    lines << 'Verified implementation shape:'
    lines << '  EmbedStatement gates VersionedStorageSqlBridge.tryExecute(...) behind VersionedStorageSqlBridge.isInterceptionEnabled().'
    lines << '  Native mode bypasses bridge interception before Derby parse/bind without trying metadata lookup first.'
    lines << '  Compatibility/test mode can keep the old bridge explicitly enabled while earlier transitional smokes remain available.'
    lines << '  No per-table metadata-backed pre-parse bypass is introduced.'
    lines << ''
    lines << 'Next step:'
    lines << '  G1 adds native range predicates through DelosTableScanResultSet.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseF8BridgeBypassReport') {
    group = 'verification'
    description = 'Writes the Phase F8 bridge-bypass proof report.'
    dependsOn 'verifyStoragePhaseF7NativeUpdateEquality'
    outputs.file(delosdbStoragePhaseF8ReportFile)
    doLast {
        def result = delosdbStoragePhaseF8Proof()
        def outputFile = delosdbStoragePhaseF8ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase F8 bridge-bypass proof failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseF8BridgeBypassSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase F8 bridge-bypass smoke test.'
    source = files('dev/storage-phase-f8-bridge-bypass-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseF8SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseF8Classpath()
}

tasks.register('storagePhaseF8BridgeBypassSmoke', JavaExec) {
    dependsOn 'storagePhaseF8BridgeBypassReport', 'compileStoragePhaseF8BridgeBypassSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase F8 bridge-bypass smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseF8BridgeBypassSmoke'
    classpath = delosdbStoragePhaseF8Classpath()
}

tasks.register('verifyStoragePhaseF8BridgeBypass') {
    group = 'verification'
    description = 'Verifies Phase F8 bridge-bypass proof.'
    dependsOn 'storagePhaseF8BridgeBypassReport', 'storagePhaseF8BridgeBypassSmoke'
    doLast {
        println 'Verified Phase F8 bridge bypass; next step is G1 native remaining range predicates'
    }
}
