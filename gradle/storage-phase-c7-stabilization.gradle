import org.gradle.api.tasks.compile.JavaCompile

// Phase C7S stabilization guard.
//
// This is the small bug-fix slice before DELETE/UPDATE work. It does not add
// new storage behavior. It locks down row-location adapter behavior at runtime
// and removes the empty-registry execution-bridge footgun from the transitional
// MVCC SQL bridge.

ext.delosdbStoragePhaseC7SReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC7SReportFile =
        ext.delosdbStoragePhaseC7SReportDir.map { it.file('storage-phase-c7-stabilization.txt') }
ext.delosdbStoragePhaseC7SSmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c7-stabilization-smoke')

ext.delosdbStoragePhaseC7SRelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC7SRequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC7SRelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC7SForbidTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC7SRelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def found = tokens.findAll { token -> text.contains(token) }
    if (!found.isEmpty()) {
        errors << "${label} contains forbidden tokens: ${found.join(', ')}"
    }
}

ext.delosdbStoragePhaseC7SForbiddenSourceHits = { Collection<File> sourceFiles, Collection<String> tokens ->
    sourceFiles.collectMany { sourceFile ->
        def text = sourceFile.text
        tokens.findAll { token -> text.contains(token) }.collect { token ->
            "${delosdbStoragePhaseC7SRelPath(sourceFile)} contains forbidden token ${token}"
        }
    }.sort()
}

ext.delosdbStoragePhaseC7SModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC7SRuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC7SClasspath = {
    files(
            delosdbStoragePhaseC7SSmokeClassesDir,
            delosdbStoragePhaseC7SModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC7SModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC7SModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC7SRuntimeJars())
}

ext.delosdbStoragePhaseC7SProof = {
    def errors = []
    def lines = []

    def smokeSource = file('dev/storage-phase-c7-stabilization-smoke/src/main/java/delosdb/smoke/StoragePhaseC7StabilizationSmoke.java')
    def rowLocationBridge = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/storetypes/EngineStoreRowLocationBridge.java')
    def rowLocationInterface = file('delosdb-engine/src/main/java/org/apache/derby/iapi/types/RowLocation.java')
    def executionBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/execution/VersionedStorageExecutionBridge.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def storelessRoot = file('delosdb-storeless/src/main/java')

    delosdbStoragePhaseC7SRequireTokens(errors, smokeSource, [
            'verifyEngineRowLocationAdapterBehavior',
            'adapter.compare(adapter)',
            'adapter.equals(adapter)',
            'raw HeapRowLocation.equals(adapter)',
            'verifyResolvedTableBridgeRejectsProviderLookup',
            'resolvedTableOperations()',
            'provider lookup is unavailable'
    ], 'Phase C7S stabilization smoke')

    delosdbStoragePhaseC7SRequireTokens(errors, rowLocationInterface, [
            'public interface RowLocation extends DataValueDescriptor, StoreRowLocation'
    ], 'RowLocation store-neutral inheritance contract')

    delosdbStoragePhaseC7SRequireTokens(errors, rowLocationBridge, [
            'public static StoreRowLocation requireStoreRowLocation(Object value)',
            'if (value instanceof StoreRowLocation storeRowLocation)',
            'return storeRowLocation.unwrapStoreRowLocation();',
            'implements RowLocation, RefDataValue'
    ], 'EngineStoreRowLocationBridge adapter shape')

    delosdbStoragePhaseC7SRequireTokens(errors, executionBridge, [
            'private static final String PROVIDER_LOOKUP_UNAVAILABLE',
            'private VersionedStorageExecutionBridge()',
            'public static VersionedStorageExecutionBridge resolvedTableOperations()',
            'throw new IllegalStateException(PROVIDER_LOOKUP_UNAVAILABLE);'
    ], 'VersionedStorageExecutionBridge resolved-table operation mode')

    delosdbStoragePhaseC7SRequireTokens(errors, sqlBridge, [
            'private static final VersionedStorageExecutionBridge PLANNED_TABLE_OPERATION_BRIDGE',
            'VersionedStorageExecutionBridge.resolvedTableOperations()',
            'PLANNED_TABLE_OPERATION_BRIDGE.insert(',
            'PLANNED_TABLE_OPERATION_BRIDGE.scanAll('
    ], 'VersionedStorageSqlBridge resolved-table bridge usage')
    delosdbStoragePhaseC7SForbidTokens(errors, sqlBridge, [
            'VersionedStorageProviderRegistry.empty().resolver()',
            'import io.github.ggeorg.delosdb.engine.extension.storage.versioned.VersionedStorageProviderRegistry;'
    ], 'VersionedStorageSqlBridge empty-registry footgun removal')

    if (!storelessRoot.exists()) {
        errors << 'missing storeless source root: delosdb-storeless/src/main/java'
    } else {
        def storelessProviderHits = fileTree(storelessRoot).matching { include '**/*.java' }.files.findAll { sourceFile ->
            def text = sourceFile.text
            text.contains('implements StorageProvider') || text.contains('implements VersionedStorageProvider')
        }.collect { delosdbStoragePhaseC7SRelPath(it) }.sort()
        if (!storelessProviderHits.isEmpty()) {
            errors << 'storeless must remain no-store and not become a provider during C7S: ' + storelessProviderHits
        }
    }

    if (smokeSource.exists()) {
        errors.addAll(delosdbStoragePhaseC7SForbiddenSourceHits([smokeSource], [
                'DriverManager',
                'Connection',
                'Statement',
                'Pattern.compile',
                'Matcher'
        ]))
    }

    def engineStoreSourceRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
    if (engineStoreSourceRoot.exists()) {
        errors << 'Phase C7S must not add engine-side org/apache/derby/impl/store sources: '
                + delosdbStoragePhaseC7SRelPath(engineStoreSourceRoot)
    }

    def thirdIslandNames = [
            'DelosStorageEngine.java',
            'DelosMutationAccess.java',
            'TableAccessProfile.java',
            'StorageExecutionProfile.java',
            'StorelessStorageProvider.java',
            'StorelessVersionedStorageProvider.java'
    ] as Set
    def thirdIslandFiles = fileTree(rootProject.projectDir).matching {
        include '**/*.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
        exclude '**/.idea/**'
        exclude '**/__MACOSX/**'
    }.files.findAll { thirdIslandNames.contains(it.name) }
            .collect { delosdbStoragePhaseC7SRelPath(it) }.sort()
    if (!thirdIslandFiles.isEmpty()) {
        errors << 'Phase C7S must not introduce the third SPI/profile island: ' + thirdIslandFiles
    }

    lines << 'DelosDB Storage Phase C7S Stabilization'
    lines << '========================================'
    lines << ''
    lines << 'C7S mechanic:'
    lines << '  lock down row-location adapter behavior and remove the empty-registry execution-bridge footgun before DELETE/UPDATE work.'
    lines << ''
    lines << 'Behavioral smoke:'
    lines << '  adapter-vs-adapter compare/equals is exercised at runtime.'
    lines << '  adapter-vs-raw HeapRowLocation equality is exercised at runtime.'
    lines << '  resolved-table bridge create/open provider lookup fails explicitly instead of hiding an empty registry.'
    lines << ''
    lines << 'Preserved boundaries:'
    lines << '  storeless remains no-store and not a provider.'
    lines << '  SQL bridge still owns temporary routing, but its resolved-table operation bridge no longer uses an empty registry.'
    lines << '  no new third SPI/profile island is introduced.'
    lines << ''
    lines << 'Next step:'
    lines << '  after C7S is green, resume with one planned DELETE operation proof.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC7StabilizationReport') {
    group = 'verification'
    description = 'Writes the Phase C7S stabilization report.'
    dependsOn 'verifyStoragePhaseC7SelectBridgeShrink'
    outputs.file(delosdbStoragePhaseC7SReportFile)
    doLast {
        def result = delosdbStoragePhaseC7SProof()
        def outputFile = delosdbStoragePhaseC7SReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C7S stabilization failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC7StabilizationSmoke', JavaCompile) {
    dependsOn 'jars', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C7S stabilization smoke test.'
    source = files('dev/storage-phase-c7-stabilization-smoke/src/main/java')
    destinationDirectory = delosdbStoragePhaseC7SSmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC7SClasspath()
}

tasks.register('storagePhaseC7StabilizationSmoke', JavaExec) {
    dependsOn 'compileStoragePhaseC7StabilizationSmoke'
    group = 'verification'
    description = 'Runs the Phase C7S stabilization smoke test.'
    classpath = delosdbStoragePhaseC7SClasspath()
    mainClass = 'delosdb.smoke.StoragePhaseC7StabilizationSmoke'
}

tasks.register('verifyStoragePhaseC7Stabilization') {
    group = 'verification'
    description = 'Verifies the Phase C7S stabilization slice.'
    dependsOn 'storagePhaseC7StabilizationReport', 'storagePhaseC7StabilizationSmoke'
    doLast {
        println 'Verified Phase C7S stabilization; next step can be one planned DELETE operation proof'
    }
}
