import org.gradle.api.tasks.compile.JavaCompile

// Phase C36 UPDATE regex deletion.
// C36 deletes the direct regex route for UPDATE table SET column = literal WHERE column = literal only after
// C35 proved the equivalent Derby JavaCC / QueryTreeNode route.

ext.delosdbStoragePhaseC36ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC36ReportFile =
        ext.delosdbStoragePhaseC36ReportDir.map { it.file('storage-phase-c36-update-regex-deletion.txt') }
ext.delosdbStoragePhaseC36SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c36-update-regex-deletion-smoke')

ext.delosdbStoragePhaseC36RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC36RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC36RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC36ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC36RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC36Classpath = {
    files(
            delosdbStoragePhaseC36SmokeClassesDir,
            delosdbStoragePhaseC36ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC36ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseC36ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC36ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC36RuntimeJars())
}

ext.delosdbStoragePhaseC36Proof = {
    def errors = []
    def lines = []

    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def classifier = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/DelosVersionedStorageQueryTreeClassifier.java')
    def c23SmokeSource = file('dev/storage-phase-c23-mvcc-contract-mutation-smoke/src/main/java/delosdb/smoke/StoragePhaseC23MvccContractMutationSmoke.java')
    def c35SmokeSource = file('dev/storage-phase-c35-javacc-update-classifier-smoke/src/main/java/delosdb/smoke/StoragePhaseC35JavaCcUpdateClassifierSmoke.java')
    def smokeSource = file('dev/storage-phase-c36-update-regex-deletion-smoke/src/main/java/delosdb/smoke/StoragePhaseC36UpdateRegexDeletionSmoke.java')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')

    delosdbStoragePhaseC36RequireTokens(errors, classifier, [
            'updateWhereEquals(String sql)',
            'classifyUpdateWhereEquals(String sql, Visitable parsed)',
            'parsed instanceof UpdateNode update',
            'update.getResultSetNode() instanceof SelectNode select',
            'return Optional.of(new UpdateWhereEqualsRoute(',
            'public record UpdateWhereEqualsRoute('
    ], 'C36 JavaCC UPDATE classifier replacement')
    if (classifier.exists()) {
        def classifierText = classifier.text
        ['Pattern.compile(', '.matcher(', 'DelosTableGuarantee', 'guarantees()', 'FunctionCall', 'RexNode'].each { token ->
            if (classifierText.contains(token)) {
                errors << "C36 classifier must remain parser-tree only and must not include token: ${token}"
            }
        }
    }

    delosdbStoragePhaseC36RequireTokens(errors, sqlBridge, [
            'DelosVersionedStorageQueryTreeClassifier.updateWhereEquals(normalizedSql)',
            'PlannedRoute.updateWhereEquals(',
            'case UPDATE_WHERE_EQUALS:',
            'return updateWhereEquals(',
            'plannedRoute.setColumnName()',
            'plannedRoute.setValue()',
            'plannedRoute.predicateColumnName()',
            'plannedRoute.predicateValue()'
    ], 'C36 bridge JavaCC UPDATE route')
    if (sqlBridge.exists()) {
        def bridgeText = sqlBridge.text
        [
                'private static final Pattern UPDATE_WHERE_EQUALS',
                'UPDATE_WHERE_EQUALS.matcher(normalizedSql)',
                'update\\s+',
                'update\\\\s+'
        ].each { token ->
            if (bridgeText.contains(token)) {
                errors << "C36 must delete UPDATE regex token from VersionedStorageSqlBridge: ${token}"
            }
        }
    }

    delosdbStoragePhaseC36RequireTokens(errors, c23SmokeSource, [
            'updateFixtureRowThroughDerbyParser',
            'update id=2 should be handled through Derby parser after UPDATE regex deletion',
            'deleteFixtureRowThroughDerbyParser',
            'verifySqlUpdateAndDeleteUseContractMutationPath'
    ], 'C23 smoke remains valid after UPDATE regex deletion')
    if (c23SmokeSource.exists()) {
        def c23SmokeText = c23SmokeSource.text
        if (c23SmokeText.contains('plan.execute("UPDATE " + plan.tableName()')) {
            errors << 'C23 smoke must not require the deleted direct UPDATE regex fallback after C36'
        }
    }

    delosdbStoragePhaseC36RequireTokens(errors, c35SmokeSource, [
            'StoragePhaseC35JavaCcUpdateClassifierSmoke',
            'UPDATE equality route should be classified by Derby JavaCC / QueryTreeNode',
            'javacc-query-tree',
            'storage_phase_c35_javacc_update_classifier: PASS'
    ], 'C35 smoke remains classifier-based after C36')
    if (c35SmokeSource.exists()) {
        def c35SmokeText = c35SmokeSource.text
        if (c35SmokeText.contains('regex route remains as fallback') || c35SmokeText.contains('direct UPDATE regex route remains as fallback')) {
            errors << 'C35 smoke must not require the deleted direct UPDATE regex fallback after C36'
        }
    }

    delosdbStoragePhaseC36RequireTokens(errors, smokeSource, [
            'StoragePhaseC36UpdateRegexDeletionSmoke',
            'direct bridge UPDATE equality without Derby parser context must not be handled by a regex fallback',
            'UPDATE C36_DIRECT_UPDATE SET value = \'after\' WHERE id = 1',
            'UPDATE C36_UPDATE_REGEX_DELETION SET value = \'parser\' WHERE id = 2',
            'UPDATE equality route must use Derby JavaCC / QueryTreeNode after regex deletion',
            'javacc-query-tree',
            'storage_phase_c36_update_regex_deletion: PASS'
    ], 'C36 UPDATE regex deletion smoke')
    if (smokeSource.exists()) {
        def smokeText = smokeSource.text
        ['Pattern.compile(', '.matcher(', 'FunctionCall', 'RexNode'].each { token ->
            if (smokeText.contains(token)) {
                errors << "C36 smoke must not add regex or expression-model token: ${token}"
            }
        }
    }

    delosdbStoragePhaseC36RequireTokens(errors, cleanupScript, [
            'storage-phase-c36-update-regex-deletion-db'
    ], 'C36 cleanup script smoke DB entry')

    lines << 'DelosDB Storage Phase C36 UPDATE Regex Deletion'
    lines << '================================================'
    lines << ''
    lines << 'C36 mechanic:'
    lines << '  Delete the direct regex route for UPDATE table SET column = literal WHERE column = literal.'
    lines << '  Keep UPDATE execution through the already-proven Derby JavaCC / QueryTreeNode route.'
    lines << ''
    lines << 'Boundaries preserved:'
    lines << '  No function-call predicates or expression model.'
    lines << '  No guarantee/capability checks inside the JavaCC classifier.'
    lines << '  Mutation still flows through the C23 row-identity table-access path.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC36UpdateRegexDeletionReport') {
    group = 'verification'
    description = 'Writes the Phase C36 UPDATE regex deletion report.'
    dependsOn 'verifyStoragePhaseC35JavaCcUpdateClassifier'
    outputs.file(delosdbStoragePhaseC36ReportFile)
    doLast {
        def result = delosdbStoragePhaseC36Proof()
        def outputFile = delosdbStoragePhaseC36ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C36 UPDATE regex deletion failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC36UpdateRegexDeletionSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C36 UPDATE regex deletion smoke test.'
    source = files('dev/storage-phase-c36-update-regex-deletion-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseC36SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC36Classpath()
}

tasks.register('storagePhaseC36UpdateRegexDeletionSmoke', JavaExec) {
    dependsOn 'storagePhaseC36UpdateRegexDeletionReport', 'compileStoragePhaseC36UpdateRegexDeletionSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase C36 UPDATE regex deletion smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseC36UpdateRegexDeletionSmoke'
    classpath = delosdbStoragePhaseC36Classpath()
}

tasks.register('verifyStoragePhaseC36UpdateRegexDeletion') {
    group = 'verification'
    description = 'Verifies Phase C36 UPDATE regex deletion.'
    dependsOn 'storagePhaseC36UpdateRegexDeletionReport', 'storagePhaseC36UpdateRegexDeletionSmoke'
    doLast {
        println 'Verified Phase C36 UPDATE regex deletion; D-track core regex retirement slice is complete'
    }
}
