// Streamlined Storage Phase F native execution verification.
// Phase F is closed; keep executable smoke coverage and remove brittle
// per-step text-token report guards.

ext.delosdbStoragePhaseFNativeExecutionModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseFNativeExecutionRuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseFNativeExecutionClasspath = { Object smokeClassesDir ->
    files(
            smokeClassesDir,
            delosdbStoragePhaseFNativeExecutionModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseFNativeExecutionModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseFNativeExecutionModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseFNativeExecutionModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseFNativeExecutionRuntimeJars())
}

ext.delosdbStoragePhaseFNativeExecutionRegisterSmoke = { Map<String, Object> spec ->
    def classesDir = layout.buildDirectory.dir("classes/${spec.classesDirName}")

    tasks.register((String) spec.compileTask, JavaCompile) {
        dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
        group = 'verification'
        description = (String) spec.compileDescription
        source = files((String) spec.sourceDir, rootProject.ext.delosdbSmokeUtilsSourceDir)
        destinationDirectory = classesDir
        sourceCompatibility = javaRelease.toString()
        targetCompatibility = javaRelease.toString()
        options.release = javaRelease
        options.encoding = 'UTF-8'
        classpath = delosdbStoragePhaseFNativeExecutionClasspath(classesDir)
    }

    tasks.register((String) spec.smokeTask, JavaExec) {
        dependsOn spec.dependsOn, spec.compileTask, 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
        group = 'verification'
        description = (String) spec.smokeDescription
        mainClass = (String) spec.mainClass
        classpath = delosdbStoragePhaseFNativeExecutionClasspath(classesDir)
    }

    tasks.register((String) spec.verifyTask) {
        group = 'verification'
        description = (String) spec.verifyDescription
        dependsOn spec.smokeTask
        doLast {
            println((String) spec.successMessage)
        }
    }
}

