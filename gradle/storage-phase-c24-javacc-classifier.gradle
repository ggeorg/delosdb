import org.gradle.api.tasks.compile.JavaCompile

// Phase C24 JavaCC / QueryTreeNode classifier proof.
// This proves one already-supported delos_mvcc statement can be classified by
// Derby's real parser output before the temporary regex fallback runs.

ext.delosdbStoragePhaseC24ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC24ReportFile =
        ext.delosdbStoragePhaseC24ReportDir.map { it.file('storage-phase-c24-javacc-classifier.txt') }
ext.delosdbStoragePhaseC24SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c24-javacc-classifier-smoke')

ext.delosdbStoragePhaseC24RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC24ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC24RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC24RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC24RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC24Classpath = {
    files(
            delosdbStoragePhaseC24SmokeClassesDir,
            delosdbStoragePhaseC24ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC24ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseC24ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC24ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC24RuntimeJars())
}

ext.delosdbStoragePhaseC24Proof = {
    def errors = []
    def lines = []

    def bridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def classifier = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/DelosVersionedStorageQueryTreeClassifier.java')
    def smoke = file('dev/storage-phase-c24-javacc-classifier-smoke/src/main/java/delosdb/smoke/StoragePhaseC24JavaCcClassifierSmoke.java')

    delosdbStoragePhaseC24RequireTokens(errors, classifier, [
            'compilerContext = lcc.pushCompilerContext()',
            'compilerContext.getParser().parseStatement(sql)',
            'classifySelectWhereEquals(sql, parsed)',
            'parsed instanceof CursorNode cursor',
            'cursor.getResultSetNode() instanceof SelectNode select',
            'select.fromList.elementAt(0) instanceof FromBaseTable fromBaseTable',
            'select.whereClause instanceof BinaryRelationalOperatorNode comparison',
            'comparison.kind != BinaryRelationalOperatorNode.K_EQUALS',
            'ColumnReference column',
            'ConstantNode literal',
            'new SelectWhereEqualsRoute(',
            'sql.substring(begin, end + 1).trim()'
    ], 'C24 Derby JavaCC / QueryTreeNode classifier')

    if (classifier.exists()) {
        def classifierText = classifier.text
        ['Pattern.compile(', '.matcher('].each { token ->
            if (classifierText.contains(token)) {
                errors << "C24 classifier must not add regex classification token: ${token}"
            }
        }
    }

    delosdbStoragePhaseC24RequireTokens(errors, bridge, [
            'private static final String ROUTE_CLASSIFIER_REGEX = "regex"',
            'private static final String ROUTE_CLASSIFIER_JAVACC_QUERY_TREE = "javacc-query-tree"',
            'lastRouteClassifierForTesting()',
            'private static Optional<PlannedRoute> routeStatementWithJavaCcQueryTree(String normalizedSql)',
            'DelosVersionedStorageQueryTreeClassifier.selectWhereEquals(normalizedSql)',
            'PlannedRoute.selectWhereEquals(',
            'Optional<PlannedRoute> javaCcRoute = routeStatementWithJavaCcQueryTree(normalizedSql)',
            'lastRouteClassifier = ROUTE_CLASSIFIER_JAVACC_QUERY_TREE',
            'lastRouteClassifier = ROUTE_CLASSIFIER_REGEX',
            'tableAccess.scan('
    ], 'VersionedStorageSqlBridge C24 parser-first routing with regex fallback')

    if (bridge.exists()) {
        def text = bridge.text
        def javaCcIndex = text.indexOf('Optional<PlannedRoute> javaCcRoute = routeStatementWithJavaCcQueryTree(normalizedSql)')
        def regexIndex = text.indexOf('Matcher create = CREATE_TABLE.matcher(normalizedSql)')
        if (javaCcIndex < 0 || regexIndex < 0 || javaCcIndex > regexIndex) {
            errors << 'C24 parser route must run before the regex fallback inside routeStatement(...)'
        }
        if (!text.contains('Pattern.compile(')) {
            errors << 'C24 must not delete regex fallback routes; Pattern.compile must remain until C25 replacement deletion'
        }
    }

    delosdbStoragePhaseC24RequireTokens(errors, smoke, [
            'SmokeUtils.loadEmbeddedDriver()',
            'CREATE TABLE C24_JAVACC_ROUTE',
            'USING delos_mvcc',
            'CREATE INDEX C24_JAVACC_ROUTE_ID_IDX',
            'SELECT * FROM C24_JAVACC_ROUTE WHERE id = 2',
            'VersionedStorageSqlBridge.lastRouteClassifierForTesting().orElseThrow()',
            '"javacc-query-tree"',
            'VersionedStorageSqlBridge.lastAccessPath()',
            'VersionedStorageAccessPath.INDEX_SCAN'
    ], 'C24 JavaCC classifier JDBC smoke')

    def engineImplStoreSourceRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
    if (engineImplStoreSourceRoot.exists()) {
        errors << 'C24 must not add engine-side org/apache/derby/impl/store sources: '
                + delosdbStoragePhaseC24RelPath(engineImplStoreSourceRoot)
    }

    lines << 'DelosDB Storage Phase C24 JavaCC Classifier'
    lines << '============================================='
    lines << ''
    lines << 'C24 mechanic:'
    lines << '  classify one SELECT WHERE equality statement using Derby JavaCC / QueryTreeNode inspection.'
    lines << ''
    lines << 'Boundary preserved:'
    lines << '  VersionedStorageSqlBridge remains the temporary interception point.'
    lines << '  regex routes remain as fallback.'
    lines << '  no regex route is deleted in C24.'
    lines << '  the JavaCC route feeds the existing DelosFilterableTableAccess.scan(...) SELECT path.'
    lines << '  Derby heap SQL remains untouched.'
    lines << ''
    lines << 'Proof smoke:'
    lines << '  dev/storage-phase-c24-javacc-classifier-smoke/src/main/java/delosdb/smoke/StoragePhaseC24JavaCcClassifierSmoke.java'
    lines << ''
    lines << 'Next step:'
    lines << '  C25 may delete the exact SELECT equality regex route because this QueryTreeNode replacement route is green.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC24JavaCcClassifierReport') {
    group = 'verification'
    description = 'Writes the Phase C24 JavaCC / QueryTreeNode classifier proof report.'
    dependsOn 'verifyStoragePhaseC23MvccContractMutation'
    outputs.file(delosdbStoragePhaseC24ReportFile)
    doLast {
        def result = delosdbStoragePhaseC24Proof()
        def outputFile = delosdbStoragePhaseC24ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C24 JavaCC classifier proof failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC24JavaCcClassifierSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C24 JavaCC classifier smoke test.'
    source = files('dev/storage-phase-c24-javacc-classifier-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseC24SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC24Classpath()
}

tasks.register('storagePhaseC24JavaCcClassifierSmoke', JavaExec) {
    dependsOn 'compileStoragePhaseC24JavaCcClassifierSmoke', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase C24 JavaCC / QueryTreeNode classifier smoke test.'
    classpath = delosdbStoragePhaseC24Classpath()
    mainClass = 'delosdb.smoke.StoragePhaseC24JavaCcClassifierSmoke'
    workingDir = layout.buildDirectory.dir('storage-phase-c24-javacc-classifier-smoke').get().asFile
    doFirst {
        delete file('build/storage-phase-c24-javacc-classifier-smoke')
        workingDir.mkdirs()
    }
}

tasks.register('verifyStoragePhaseC24JavaCcClassifier') {
    group = 'verification'
    description = 'Verifies the Phase C24 JavaCC / QueryTreeNode classifier route proof.'
    dependsOn 'storagePhaseC24JavaCcClassifierReport', 'storagePhaseC24JavaCcClassifierSmoke'
    doLast {
        println 'Verified Phase C24 JavaCC/QueryTreeNode classifier; next step is C25 first regex deletion'
    }
}
