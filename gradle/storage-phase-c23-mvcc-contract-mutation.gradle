import org.gradle.api.tasks.compile.JavaCompile

// Phase C23 MVCC mutation through the C20/C21 table-access contracts.
// Routing still enters through VersionedStorageSqlBridge and its existing regex
// classifier.  C23 changes UPDATE/DELETE internals into read-then-mutate:
// DelosFilterableTableAccess.scan(...) produces row identities, then
// DelosMutableTableAccess.update/delete(...) mutates those identities.

ext.delosdbStoragePhaseC23ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC23ReportFile =
        ext.delosdbStoragePhaseC23ReportDir.map { it.file('storage-phase-c23-mvcc-contract-mutation.txt') }
ext.delosdbStoragePhaseC23SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c23-mvcc-contract-mutation-smoke')

ext.delosdbStoragePhaseC23RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC23RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC23RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC23ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC23RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC23Classpath = {
    files(
            delosdbStoragePhaseC23SmokeClassesDir,
            delosdbStoragePhaseC23ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC23ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseC23ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC23ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC23RuntimeJars())
}

ext.delosdbStoragePhaseC23Proof = {
    def errors = []
    def lines = []

    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def adapter = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/storetypes/EngineMvccTableAccess.java')
    def smokeSource = file('dev/storage-phase-c23-mvcc-contract-mutation-smoke/src/main/java/delosdb/smoke/StoragePhaseC23MvccContractMutationSmoke.java')

    delosdbStoragePhaseC23RequireTokens(errors, sqlBridge, [
            'private static final Pattern UPDATE_WHERE_EQUALS',
            'return PlannedRoute.updateWhereEquals(',
            'return PlannedRoute.deleteWhereEquals(',
            'private static VersionedStorageSqlResult updateWhereEquals(',
            'private static VersionedStorageSqlResult deleteWhereEquals(',
            'EngineMvccTableAccess tableAccess = table.tableAccess()',
            'DelosAccessContext accessContext = delosAccessContext(statementTx)',
            'scanRowsForMutationIdentity(',
            'tableAccess.update(',
            'tableAccess.delete(',
            'requireMutationRowIdentity(row)',
            'DelosRow.withoutIdentity(List.copyOf(replacement))',
            'private static List<DelosRow> scanRowsForMutationIdentity(',
            'tableAccess.scan(accessContext, mutableFilters, DelosProjection.all())',
            'private static DelosRowIdentity requireMutationRowIdentity(DelosRow row)'
    ], 'VersionedStorageSqlBridge C23 mutation contract path')

    if (sqlBridge.exists()) {
        def bridgeText = sqlBridge.text
        if (!bridgeText.contains('Pattern.compile(')) {
            errors << 'C23 still expects at least one temporary regex route to remain until all QueryTreeNode replacements are complete'
        }
        def updateStart = bridgeText.indexOf('private static VersionedStorageSqlResult updateWhereEquals(')
        def deleteStart = bridgeText.indexOf('private static VersionedStorageSqlResult deleteWhereEquals(')
        def selectAllStart = bridgeText.indexOf('private static VersionedStorageSqlResult selectAll(')
        if (updateStart < 0 || deleteStart < 0 || selectAllStart < 0) {
            errors << 'C23 requires updateWhereEquals/deleteWhereEquals/selectAll methods to remain visible for inspection'
        } else {
            def mutationText = bridgeText.substring(updateStart, selectAllStart)
            [
                    'PLANNED_TABLE_OPERATION_BRIDGE.update(',
                    'PLANNED_TABLE_OPERATION_BRIDGE.delete(',
                    'table.indexedRows(',
                    'table.table().update(',
                    'table.table().delete('
            ].each { token ->
                if (mutationText.contains(token)) {
                    errors << "C23 mutation branch must not bypass row-identity contract with ${token}"
                }
            }
            if (!mutationText.contains('tableAccess.scan(accessContext, mutableFilters, DelosProjection.all())')) {
                errors << 'C23 mutation branch must scan through DelosFilterableTableAccess before mutating'
            }
            if (!mutationText.contains('tableAccess.update(') || !mutationText.contains('tableAccess.delete(')) {
                errors << 'C23 mutation branch must mutate through DelosMutableTableAccess update/delete'
            }
        }
    }

    delosdbStoragePhaseC23RequireTokens(errors, adapter, [
            'implements DelosFilterableTableAccess, DelosIndexableTableAccess, DelosMutableTableAccess',
            'public DelosMutationResult update(',
            'public DelosMutationResult delete(',
            'executionBridge.update(table, requireNativeRowKey(rowIdentity), nativeValues(replacement), tx)',
            'executionBridge.delete(table, requireNativeRowKey(rowIdentity), tx)',
            'DelosRow.withIdentity(new MvccRowIdentity(row.key()), values)'
    ], 'EngineMvccTableAccess row-identity mutation adapter')

    delosdbStoragePhaseC23RequireTokens(errors, smokeSource, [
            'verifyAdapterReadThenMutateDirectly',
            'verifySqlUpdateAndDeleteUseContractMutationPath',
            'singleContractRow(access, context, "ID", 2)',
            'rowIdentity().orElseThrow()',
            'access.update(context, updateIdentity, DelosRow.withoutIdentity',
            'singleContractRow(access, context, "ID", 1)',
            'access.delete(context, deleteIdentity)',
            'UPDATE ',
            'DELETE FROM ',
            'WHERE id = 2',
            'WHERE id = 1',
            'deleteFixtureRowThroughDerbyParser',
            'delete id=1 should be handled through Derby parser after DELETE regex deletion',
            'VersionedStorageSqlBridge.tryExecute(sql, this, true, Connection.TRANSACTION_READ_COMMITTED)'
    ], 'C23 MVCC contract mutation smoke')

    if (smokeSource.exists()) {
        def smokeText = smokeSource.text
        ['Pattern.compile(', '.matcher('].each { token ->
            if (smokeText.contains(token)) {
                errors << "C23 smoke must not add its own SQL classifier token: ${token}"
            }
        }
    }

    def engineImplStoreSourceRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
    if (engineImplStoreSourceRoot.exists()) {
        errors << 'C23 must not add engine-side org/apache/derby/impl/store sources: '
                + delosdbStoragePhaseC23RelPath(engineImplStoreSourceRoot)
    }

    def storelessRoot = file('delosdb-storeless/src/main/java')
    if (storelessRoot.exists()) {
        def storelessLeaks = fileTree(storelessRoot).matching { include '**/*.java' }.files.findAll { sourceFile ->
            def text = sourceFile.text
            text.contains('implements StorageProvider') ||
                    text.contains('implements VersionedStorageProvider') ||
                    text.contains('implements DelosFilterableTableAccess') ||
                    text.contains('implements DelosIndexableTableAccess') ||
                    text.contains('implements DelosMutableTableAccess')
        }.collect { delosdbStoragePhaseC23RelPath(it) }.sort()
        if (!storelessLeaks.isEmpty()) {
            errors << 'Storeless must remain a no-store/base-only constraint after C23: ' + storelessLeaks
        }
    }

    lines << 'DelosDB Storage Phase C23 MVCC Contract Mutation'
    lines << '================================================'
    lines << ''
    lines << 'C23 mechanic:'
    lines << '  route MVCC UPDATE/DELETE internals through the C20/C21 table-access contracts.'
    lines << ''
    lines << 'Mutation flow proven:'
    lines << '  DelosFilterableTableAccess.scan(...) -> DelosRowIdentity -> DelosMutableTableAccess.update/delete(...).'
    lines << ''
    lines << 'Boundaries preserved:'
    lines << '  VersionedStorageSqlBridge remains the temporary SQL interception point.'
    lines << '  routeStatement(...) still uses the existing regex classifier.'
    lines << '  no regex route is deleted.'
    lines << '  Derby heap execution remains untouched.'
    lines << '  storeless remains a no-store/base-only constraint.'
    lines << ''
    lines << 'Proof smoke:'
    lines << '  dev/storage-phase-c23-mvcc-contract-mutation-smoke/src/main/java/delosdb/smoke/StoragePhaseC23MvccContractMutationSmoke.java'
    lines << ''
    lines << 'Next step:'
    lines << '  C24 should classify one delos_mvcc statement with Derby JavaCC / QueryTreeNode instead of regex.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC23MvccContractMutationReport') {
    group = 'verification'
    description = 'Writes the Phase C23 MVCC contract mutation proof report.'
    dependsOn 'verifyStoragePhaseC22HeapHonesty'
    outputs.file(delosdbStoragePhaseC23ReportFile)
    doLast {
        def result = delosdbStoragePhaseC23Proof()
        def outputFile = delosdbStoragePhaseC23ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C23 MVCC contract mutation proof failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC23MvccContractMutationSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C23 MVCC contract mutation smoke test.'
    source = files('dev/storage-phase-c23-mvcc-contract-mutation-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseC23SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC23Classpath()
}

tasks.register('storagePhaseC23MvccContractMutationSmoke', JavaExec) {
    dependsOn 'compileStoragePhaseC23MvccContractMutationSmoke', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase C23 MVCC contract mutation smoke test.'
    classpath = delosdbStoragePhaseC23Classpath()
    mainClass = 'delosdb.smoke.StoragePhaseC23MvccContractMutationSmoke'
}

tasks.register('verifyStoragePhaseC23MvccContractMutation') {
    group = 'verification'
    description = 'Verifies the Phase C23 MVCC read-then-mutate contract path.'
    dependsOn 'storagePhaseC23MvccContractMutationReport', 'storagePhaseC23MvccContractMutationSmoke'
    doLast {
        println 'Verified Phase C23 MVCC contract mutation; next step is C24 JavaCC/QueryTreeNode classifier proof'
    }
}
