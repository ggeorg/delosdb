/*
 * Permanent DelosDB module and architecture verification.
 *
 * Gradle configuration is intentionally limited to lazy task registration.
 * The executable audit runs only when its verification task is selected.
 */
final File delosArchitectureAudit = rootProject.file(
        'scripts/delos-permanent-architecture-audit.py')
final Object delosModuleDependencyReportDir = rootProject.layout.buildDirectory.dir(
        'reports/delosdb-module-dependencies')
final Object delosModuleBoundaryReport = rootProject.layout.buildDirectory.file(
        'reports/delosdb/module-dependency-boundary-static-analysis.txt')
final Object delosV1ArchitectureReport = rootProject.layout.buildDirectory.file(
        'reports/delosdb/v1-module-architecture-static-analysis.txt')
final File delosV1ModuleTarget = rootProject.file(
        'gradle/static-analysis/delosdb-v1-final-module-target.txt')

tasks.register('delosModuleDependencyReport', Exec) {
    group = 'verification'
    description = 'Generates the module dependency and resource ownership report.'

    inputs.file('scripts/module-dependency-tree.py')
    inputs.file('settings.gradle')
    inputs.files(rootProject.fileTree(rootProject.projectDir) {
        include '*/build.gradle'
        include '*/src/main/java/**/*.java'
        include '*/src/test/java/**/*.java'
        include '*/src/main/resources/**'
        include '*/src/test/resources/**'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
    })
    outputs.dir(delosModuleDependencyReportDir)

    commandLine 'python3', 'scripts/module-dependency-tree.py'
}

tasks.register('delosModuleDependencyBoundaryStaticAnalysis', Exec) {
    group = 'verification'
    description = 'Verifies durable module dependency and resource-boundary invariants.'
    dependsOn 'delosModuleDependencyReport'

    inputs.file(delosArchitectureAudit)
    inputs.files(delosModuleDependencyReportDir)
    inputs.file(
            'delosdb-engine/src/main/java/org/apache/derby/impl/services/monitor/BaseMonitor.java')
    outputs.file(delosModuleBoundaryReport)

    doFirst {
        setCommandLine([
                'python3', delosArchitectureAudit.absolutePath,
                '--mode', 'boundary',
                '--root', rootProject.projectDir.absolutePath,
                '--dependency-report-dir',
                delosModuleDependencyReportDir.get().asFile.absolutePath,
                '--output', delosModuleBoundaryReport.get().asFile.absolutePath
        ])
    }
}

tasks.register('delosV1ModuleArchitectureStaticAnalysis', Exec) {
    group = 'verification'
    description = 'Verifies the permanent v1 module and storage-authority structure.'
    dependsOn 'delosModuleDependencyReport'

    inputs.file(delosArchitectureAudit)
    inputs.file(delosV1ModuleTarget)
    inputs.file('settings.gradle')
    inputs.file('gradle/delosdb-runtime-artifacts.gradle')
    inputs.file(delosModuleDependencyReportDir.map {
        it.file('module-source-edge-summary.tsv')
    })
    inputs.files(rootProject.fileTree(rootProject.projectDir) {
        include 'build.gradle'
        include 'delosdb-*/build.gradle'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
    })
    outputs.file(delosV1ArchitectureReport)

    doFirst {
        List<String> auditArgs = [
                delosArchitectureAudit.absolutePath,
                '--mode', 'v1',
                '--root', rootProject.projectDir.absolutePath,
                '--dependency-report-dir',
                delosModuleDependencyReportDir.get().asFile.absolutePath,
                '--target', delosV1ModuleTarget.absolutePath,
                '--output', delosV1ArchitectureReport.get().asFile.absolutePath
        ]
        rootProject.ext.delosdbRuntimeJarArtifacts.each { artifact ->
            auditArgs.add('--runtime-artifact')
            auditArgs.add(artifact.jarName.toString())
        }
        rootProject.ext.delosdbAssembledSupportJarArtifacts.each { artifact ->
            auditArgs.add('--support-artifact')
            auditArgs.add(artifact.jarName.toString())
        }
        setCommandLine(['python3'] + auditArgs)
    }
}
