import org.gradle.api.tasks.compile.JavaCompile

// Phase C35 JavaCC UPDATE equality classifier.
// C35 adds a Derby JavaCC / QueryTreeNode route for UPDATE table SET column = literal WHERE column = literal.
// The direct UPDATE regex route remains fallback until C36.

ext.delosdbStoragePhaseC35ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC35ReportFile =
        ext.delosdbStoragePhaseC35ReportDir.map { it.file('storage-phase-c35-javacc-update-classifier.txt') }
ext.delosdbStoragePhaseC35SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c35-javacc-update-classifier-smoke')

ext.delosdbStoragePhaseC35RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC35RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC35RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC35ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC35RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC35Classpath = {
    files(
            delosdbStoragePhaseC35SmokeClassesDir,
            delosdbStoragePhaseC35ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC35ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseC35ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC35ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC35RuntimeJars())
}

ext.delosdbStoragePhaseC35Proof = {
    def errors = []
    def lines = []

    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def classifier = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/DelosVersionedStorageQueryTreeClassifier.java')
    def smokeSource = file('dev/storage-phase-c35-javacc-update-classifier-smoke/src/main/java/delosdb/smoke/StoragePhaseC35JavaCcUpdateClassifierSmoke.java')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')

    delosdbStoragePhaseC35RequireTokens(errors, classifier, [
            'updateWhereEquals(String sql)',
            'classifyUpdateWhereEquals(String sql, Visitable parsed)',
            'parsed instanceof UpdateNode update',
            'update.getResultSetNode() instanceof SelectNode select',
            'setColumns.size() != 1',
            'setColumn.getExpression() instanceof ConstantNode setLiteral',
            'select.whereClause instanceof BinaryRelationalOperatorNode comparison',
            '!"=".equals(pair.operator())',
            'return Optional.of(new UpdateWhereEqualsRoute(',
            'public record UpdateWhereEqualsRoute('
    ], 'C35 JavaCC UPDATE equality classifier')
    if (classifier.exists()) {
        def classifierText = classifier.text
        ['Pattern.compile(', '.matcher(', 'DelosTableGuarantee', 'guarantees()', 'FunctionCall', 'RexNode'].each { token ->
            if (classifierText.contains(token)) {
                errors << "C35 classifier must remain parser-tree only and must not include token: ${token}"
            }
        }
    }

    delosdbStoragePhaseC35RequireTokens(errors, sqlBridge, [
            'DelosVersionedStorageQueryTreeClassifier.updateWhereEquals(normalizedSql)',
            'PlannedRoute.updateWhereEquals(',
            'case UPDATE_WHERE_EQUALS:',
            'private static VersionedStorageSqlResult updateWhereEquals('
    ], 'C35 bridge JavaCC UPDATE route')
    if (sqlBridge.exists()) {
        def bridgeText = sqlBridge.text
        if (!bridgeText.contains('UPDATE_WHERE_EQUALS.matcher(normalizedSql)')) {
            errors << 'C35 must keep the direct UPDATE regex fallback until C36 deletes it'
        }
    }

    delosdbStoragePhaseC35RequireTokens(errors, smokeSource, [
            'StoragePhaseC35JavaCcUpdateClassifierSmoke',
            'UPDATE C35_JAVACC_UPDATE SET value = \'parser\' WHERE id = 2',
            'UPDATE equality route should be classified by Derby JavaCC / QueryTreeNode',
            'javacc-query-tree',
            'storage_phase_c35_javacc_update_classifier: PASS'
    ], 'C35 JavaCC UPDATE classifier smoke')
    if (smokeSource.exists()) {
        def smokeText = smokeSource.text
        ['Pattern.compile(', '.matcher(', 'FunctionCall', 'RexNode'].each { token ->
            if (smokeText.contains(token)) {
                errors << "C35 smoke must not add regex or expression-model token: ${token}"
            }
        }
    }

    delosdbStoragePhaseC35RequireTokens(errors, cleanupScript, [
            'storage-phase-c35-javacc-update-classifier-db'
    ], 'C35 cleanup script smoke DB entry')

    lines << 'DelosDB Storage Phase C35 JavaCC UPDATE Equality Classifier'
    lines << '========================================================='
    lines << ''
    lines << 'C35 mechanic:'
    lines << '  Add a Derby JavaCC / QueryTreeNode route for UPDATE table SET column = literal WHERE column = literal.'
    lines << '  Keep the direct UPDATE regex route as fallback until C36, but prove C35 through the Derby JDBC/parser path.'
    lines << ''
    lines << 'Boundaries preserved:'
    lines << '  No UPDATE regex deletion.'
    lines << '  No function-call predicates or expression model.'
    lines << '  No guarantee/capability checks inside the JavaCC classifier.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC35JavaCcUpdateClassifierReport') {
    group = 'verification'
    description = 'Writes the Phase C35 JavaCC UPDATE equality classifier report.'
    dependsOn 'verifyStoragePhaseC34DeleteRegexDeletion'
    outputs.file(delosdbStoragePhaseC35ReportFile)
    doLast {
        def result = delosdbStoragePhaseC35Proof()
        def outputFile = delosdbStoragePhaseC35ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C35 JavaCC UPDATE equality classifier failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC35JavaCcUpdateClassifierSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C35 JavaCC UPDATE equality classifier smoke test.'
    source = files('dev/storage-phase-c35-javacc-update-classifier-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseC35SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC35Classpath()
}

tasks.register('storagePhaseC35JavaCcUpdateClassifierSmoke', JavaExec) {
    dependsOn 'storagePhaseC35JavaCcUpdateClassifierReport', 'compileStoragePhaseC35JavaCcUpdateClassifierSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase C35 JavaCC UPDATE equality classifier smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseC35JavaCcUpdateClassifierSmoke'
    classpath = delosdbStoragePhaseC35Classpath()
}

tasks.register('verifyStoragePhaseC35JavaCcUpdateClassifier') {
    group = 'verification'
    description = 'Verifies Phase C35 JavaCC UPDATE equality classifier.'
    dependsOn 'storagePhaseC35JavaCcUpdateClassifierReport', 'storagePhaseC35JavaCcUpdateClassifierSmoke'
    doLast {
        println 'Verified Phase C35 JavaCC UPDATE equality classifier; next step is C36 UPDATE regex deletion'
    }
}
