// Phase C18 delegation closeout gate.
//
// C18 is intentionally a review checkpoint, not a runtime rewrite.  The SQL
// bridge still owns temporary regex routing, but the actual MVCC table and
// index operations must be delegated through VersionedStorageExecutionBridge.

ext.delosdbStoragePhaseC18ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC18ReportFile =
        ext.delosdbStoragePhaseC18ReportDir.map { it.file('storage-phase-c18-delegation-closeout.txt') }

ext.delosdbStoragePhaseC18RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC18RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC18RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC18JavaFiles = { String projectPath ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [] as Set<File>
    }
    fileTree(sourceRoot).matching { include '**/*.java' }.files as Set<File>
}

ext.delosdbStoragePhaseC18Proof = {
    def errors = []
    def lines = []

    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def executionBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/execution/VersionedStorageExecutionBridge.java')
    def heapProvider = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/LegacyDerbyHeapStorageProvider.java')
    def mvccProvider = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccStorageProvider.java')
    def storelessRoot = file('delosdb-storeless/src/main/java')

    delosdbStoragePhaseC18RequireTokens(errors, executionBridge, [
            'public static VersionedStorageExecutionBridge resolvedTableOperations()',
            'provider lookup is unavailable on a resolved-table operation bridge',
            'public <K, V> VersionedTable<K, V> createTable(',
            'VersionedStorageProvider provider,',
            'public <K, V> VersionedTable<K, V> openTable(',
            'public <K, V> void insert(',
            'public <K, V> void update(',
            'public <K, V> void delete(',
            'public <K, V> Optional<V> read(',
            'public <K, V> List<VersionedRow<K, V>> scanAll(',
            'public <K, V> VersionedTableStats stats(',
            'public <K, V> VersionedIndex<K, V> createIndex('
    ], 'VersionedStorageExecutionBridge complete delegated operation surface')

    delosdbStoragePhaseC18RequireTokens(errors, sqlBridge, [
            'private static final VersionedStorageExecutionBridge PLANNED_TABLE_OPERATION_BRIDGE =',
            'VersionedStorageExecutionBridge.resolvedTableOperations()',
            'private static PlannedRoute routeStatement(String normalizedSql)',
            'private static VersionedStorageSqlResult executePlannedRouteInternal(',
            'static VersionedStorageSqlResult executePlannedRoute(',
            'return executePlannedRouteInternal(',
            'Pattern.compile(',
            'PLANNED_TABLE_OPERATION_BRIDGE.createTable(',
            'PLANNED_TABLE_OPERATION_BRIDGE.insert(',
            'PLANNED_TABLE_OPERATION_BRIDGE.createIndex(',
            'PLANNED_TABLE_OPERATION_BRIDGE.scanAll(',
            'PLANNED_TABLE_OPERATION_BRIDGE.stats(',
            'PLANNED_TABLE_OPERATION_BRIDGE.delete(',
            'PLANNED_TABLE_OPERATION_BRIDGE.update('
    ], 'VersionedStorageSqlBridge post-C17 delegation state')

    if (sqlBridge.exists()) {
        def bridgeText = sqlBridge.text
        [
                'VersionedStorageProviderRegistry.empty().resolver()',
                'provider.createTable(metadata)',
                'provider.openTable(metadata)',
                'cachedProvider.createTable(',
                'cachedProvider.openTable(',
                'table.table().insert(',
                'table.table().update(',
                'table.table().delete(',
                'table.table().openScan(',
                'table.table().stats(',
                'table.table().createIndex('
        ].each { token ->
            if (bridgeText.contains(token)) {
                errors << "VersionedStorageSqlBridge must not contain direct provider/table operation token after C18: ${token}"
            }
        }
        def routeStart = bridgeText.indexOf('private static PlannedRoute routeStatement(String normalizedSql)')
        def executeStart = bridgeText.indexOf('private static VersionedStorageSqlResult executePlannedRouteInternal(')
        def plannedStart = bridgeText.indexOf('static VersionedStorageSqlResult executePlannedRoute(')
        if (routeStart < 0 || executeStart < 0 || executeStart < routeStart) {
            errors << 'C18 requires the C14 routing boundary: routeStatement before executePlannedRouteInternal'
        }
        if (plannedStart < 0 || plannedStart > executeStart) {
            errors << 'C18 requires the C15 planned-route entry point before executePlannedRouteInternal'
        }
        if (!bridgeText.contains('Pattern.compile(')) {
            errors << 'C18 must not pretend regex routing is removed; routing retirement starts after review'
        }
    }

    delosdbStoragePhaseC18RequireTokens(errors, heapProvider, [
            'implements StorageProvider',
            'StorageCapabilities'
    ], 'Derby heap provider remains metadata path')

    delosdbStoragePhaseC18RequireTokens(errors, mvccProvider, [
            'implements VersionedStorageProvider',
            'VersionedTable<K, V> createTable(',
            'VersionedTable<K, V> openTable('
    ], 'MVCC provider remains VersionedStorageProvider path')

    if (storelessRoot.exists()) {
        def storelessHits = fileTree(storelessRoot).matching { include '**/*.java' }.files.findAll { sourceFile ->
            def text = sourceFile.text
            text.contains('implements StorageProvider') || text.contains('implements VersionedStorageProvider')
        }.collect { delosdbStoragePhaseC18RelPath(it) }.sort()
        if (!storelessHits.isEmpty()) {
            errors << 'Storeless must remain a no-store constraint, not a storage provider: ' + storelessHits
        }
    }

    def engineStoreSourceRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
    if (engineStoreSourceRoot.exists()) {
        errors << 'Phase C18 must not add engine-side org/apache/derby/impl/store sources: '
                + delosdbStoragePhaseC18RelPath(engineStoreSourceRoot)
    }

    def thirdIslandNames = [
            'DelosStorageEngine.java',
            'DelosTableAccess.java',
            'DelosScan.java',
            'DelosMutationAccess.java',
            'TableAccessProfile.java',
            'StorageExecutionProfile.java',
            'StorelessStorageProvider.java',
            'StorelessVersionedStorageProvider.java'
    ] as Set
    def thirdIslandFiles = fileTree(rootProject.projectDir).matching {
        include '**/*.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
        exclude '**/.idea/**'
        exclude '**/__MACOSX/**'
    }.files.findAll { thirdIslandNames.contains(it.name) }
            .collect { delosdbStoragePhaseC18RelPath(it) }.sort()
    if (!thirdIslandFiles.isEmpty()) {
        errors << 'Phase C18 must not introduce a third SPI/profile island before review: '
                + thirdIslandFiles
    }

    def allEngineVersionedFiles = delosdbStoragePhaseC18JavaFiles('delosdb-engine').findAll { sourceFile ->
        delosdbStoragePhaseC18RelPath(sourceFile).contains('/versioned/')
    }
    def sqlRegexOwners = allEngineVersionedFiles.findAll { sourceFile ->
        sourceFile.name != 'VersionedStorageSqlBridge.java' && sourceFile.text.contains('Pattern.compile(')
    }.collect { delosdbStoragePhaseC18RelPath(it) }.sort()
    if (!sqlRegexOwners.isEmpty()) {
        errors << 'C18 must not add SQL regex owners outside VersionedStorageSqlBridge: '
                + sqlRegexOwners
    }

    lines << 'DelosDB Storage Phase C18 Delegation Closeout'
    lines << '============================================='
    lines << ''
    lines << 'C18 mechanic:'
    lines << '  close the execution-bridge delegation slice with an inventory gate before review.'
    lines << ''
    lines << 'Expected post-C18 state:'
    lines << '  VersionedStorageSqlBridge remains the temporary SQL regex router.'
    lines << '  VersionedStorageSqlBridge can also enter execution through the typed planned route.'
    lines << '  MVCC table/index operations are delegated through VersionedStorageExecutionBridge.'
    lines << '  The bridge does not regain direct VersionedTable insert/update/delete/openScan/stats/createIndex calls.'
    lines << ''
    lines << 'Not done in C18:'
    lines << '  no regex route is removed.'
    lines << '  no parser/compiler route is introduced.'
    lines << '  no new storage SPI/profile family is introduced.'
    lines << ''
    lines << 'Pause point:'
    lines << '  after this gate is green, review VersionedStorageSqlBridge and VersionedStorageExecutionBridge before routing retirement.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC18DelegationCloseoutReport') {
    group = 'verification'
    description = 'Writes the Phase C18 execution-bridge delegation closeout report.'
    dependsOn 'verifyStoragePhaseC17IndexDelegation'
    outputs.file(delosdbStoragePhaseC18ReportFile)
    doLast {
        def result = delosdbStoragePhaseC18Proof()
        def outputFile = delosdbStoragePhaseC18ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C18 delegation closeout failed; see ${outputFile}")
        }
    }
}

tasks.register('verifyStoragePhaseC18DelegationCloseout') {
    group = 'verification'
    description = 'Verifies the Phase C18 execution-bridge delegation closeout checkpoint.'
    dependsOn 'storagePhaseC18DelegationCloseoutReport'
    doLast {
        println 'Verified Phase C18 delegation closeout; pause for review before routing-retirement work'
    }
}
