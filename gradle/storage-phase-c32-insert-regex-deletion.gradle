import org.gradle.api.tasks.compile.JavaCompile

// Phase C32 INSERT regex deletion.
// C32 deletes the direct regex route for INSERT INTO table VALUES (...) only after
// C31 proved the equivalent Derby JavaCC / QueryTreeNode route.

ext.delosdbStoragePhaseC32ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC32ReportFile =
        ext.delosdbStoragePhaseC32ReportDir.map { it.file('storage-phase-c32-insert-regex-deletion.txt') }
ext.delosdbStoragePhaseC32SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c32-insert-regex-deletion-smoke')

ext.delosdbStoragePhaseC32RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC32RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC32RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC32ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC32RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC32Classpath = {
    files(
            delosdbStoragePhaseC32SmokeClassesDir,
            delosdbStoragePhaseC32ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC32ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseC32ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC32ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC32RuntimeJars())
}

ext.delosdbStoragePhaseC32Proof = {
    def errors = []
    def lines = []

    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def classifier = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/DelosVersionedStorageQueryTreeClassifier.java')
    def c31SmokeSource = file('dev/storage-phase-c31-javacc-insert-classifier-smoke/src/main/java/delosdb/smoke/StoragePhaseC31JavaCcInsertClassifierSmoke.java')
    def smokeSource = file('dev/storage-phase-c32-insert-regex-deletion-smoke/src/main/java/delosdb/smoke/StoragePhaseC32InsertRegexDeletionSmoke.java')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')

    delosdbStoragePhaseC32RequireTokens(errors, classifier, [
            'insertValues(String sql)',
            'classifyInsertValues(String sql, Visitable parsed)',
            'parsed instanceof InsertNode insert',
            'return Optional.of(new InsertValuesRoute(',
            'public record InsertValuesRoute(String tableName, String values)'
    ], 'C32 JavaCC INSERT classifier replacement')
    if (classifier.exists()) {
        def classifierText = classifier.text
        ['Pattern.compile(', '.matcher(', 'DelosTableGuarantee', 'guarantees()', 'FunctionCall', 'RexNode'].each { token ->
            if (classifierText.contains(token)) {
                errors << "C32 classifier must remain parser-tree only and must not include token: ${token}"
            }
        }
    }

    delosdbStoragePhaseC32RequireTokens(errors, sqlBridge, [
            'DelosVersionedStorageQueryTreeClassifier.insertValues(normalizedSql)',
            'PlannedRoute.insertValues(route.tableName(), route.values())',
            'case INSERT_VALUES:',
            'return insertValues(table.get(), plannedRoute.values(), transactionOwner, autoCommit, transactionIsolation);'
    ], 'C32 bridge JavaCC INSERT route')
    if (sqlBridge.exists()) {
        def bridgeText = sqlBridge.text
        [
                'private static final Pattern INSERT_VALUES',
                'INSERT_VALUES.matcher(normalizedSql)',
                'insert\\s+into\\s+',
                'insert\\\\s+into\\\\s+'
        ].each { token ->
            if (bridgeText.contains(token)) {
                errors << "C32 must delete INSERT regex token from VersionedStorageSqlBridge: ${token}"
            }
        }
    }

    delosdbStoragePhaseC32RequireTokens(errors, c31SmokeSource, [
            'StoragePhaseC31JavaCcInsertClassifierSmoke',
            'INSERT VALUES route should be classified by Derby JavaCC / QueryTreeNode',
            'javacc-query-tree',
            'storage_phase_c31_javacc_insert_classifier: PASS'
    ], 'C31 smoke remains classifier-based after C32')
    if (c31SmokeSource.exists()) {
        def c31SmokeText = c31SmokeSource.text
        if (c31SmokeText.contains('should keep using regex fallback in C31')) {
            errors << 'C31 smoke must not require the deleted direct INSERT regex fallback after C32'
        }
    }

    delosdbStoragePhaseC32RequireTokens(errors, smokeSource, [
            'StoragePhaseC32InsertRegexDeletionSmoke',
            'direct bridge INSERT without Derby parser context must not be handled by a regex fallback',
            'INSERT INTO C32_INSERT_REGEX_DELETION VALUES (1, \'alpha\')',
            'INSERT VALUES route must use Derby JavaCC / QueryTreeNode after regex deletion',
            'javacc-query-tree',
            'storage_phase_c32_insert_regex_deletion: PASS'
    ], 'C32 INSERT regex deletion smoke')
    if (smokeSource.exists()) {
        def smokeText = smokeSource.text
        ['Pattern.compile(', '.matcher(', 'FunctionCall', 'RexNode'].each { token ->
            if (smokeText.contains(token)) {
                errors << "C32 smoke must not add regex or expression-model token: ${token}"
            }
        }
    }

    delosdbStoragePhaseC32RequireTokens(errors, cleanupScript, [
            'storage-phase-c32-insert-regex-deletion-db'
    ], 'C32 cleanup script smoke DB entry')

    lines << 'DelosDB Storage Phase C32 INSERT Regex Deletion'
    lines << '================================================'
    lines << ''
    lines << 'C32 mechanic:'
    lines << '  Delete the direct regex route for INSERT INTO table VALUES (...).'
    lines << '  Keep INSERT execution through the already-proven Derby JavaCC / QueryTreeNode route.'
    lines << ''
    lines << 'Boundaries preserved:'
    lines << '  No UPDATE/DELETE classifier work.'
    lines << '  No function-call predicates or expression model.'
    lines << '  No guarantee/capability checks inside the JavaCC classifier.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC32InsertRegexDeletionReport') {
    group = 'verification'
    description = 'Writes the Phase C32 INSERT regex deletion report.'
    dependsOn 'verifyStoragePhaseC31JavaCcInsertClassifier'
    outputs.file(delosdbStoragePhaseC32ReportFile)
    doLast {
        def result = delosdbStoragePhaseC32Proof()
        def outputFile = delosdbStoragePhaseC32ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C32 INSERT regex deletion failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC32InsertRegexDeletionSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C32 INSERT regex deletion smoke test.'
    source = files('dev/storage-phase-c32-insert-regex-deletion-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseC32SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC32Classpath()
}

tasks.register('storagePhaseC32InsertRegexDeletionSmoke', JavaExec) {
    dependsOn 'storagePhaseC32InsertRegexDeletionReport', 'compileStoragePhaseC32InsertRegexDeletionSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase C32 INSERT regex deletion smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseC32InsertRegexDeletionSmoke'
    classpath = delosdbStoragePhaseC32Classpath()
}

tasks.register('verifyStoragePhaseC32InsertRegexDeletion') {
    group = 'verification'
    description = 'Verifies Phase C32 INSERT regex deletion.'
    dependsOn 'storagePhaseC32InsertRegexDeletionReport', 'storagePhaseC32InsertRegexDeletionSmoke'
    doLast {
        println 'Verified Phase C32 INSERT regex deletion; next step is C33 DELETE equality classifier'
    }
}
