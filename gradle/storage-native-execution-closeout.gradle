// Closed native delos_mvcc execution lane verification.
// F/G/H/I phase-step Gradle files were retired after bridge deletion.
// Keep only the final executable closeout smokes plus C7 regression.

ext.delosdbStorageNativeCloseoutModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStorageNativeCloseoutRuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStorageNativeCloseoutClasspath = { Object smokeClassesDir ->
    files(
            smokeClassesDir,
            delosdbStorageNativeCloseoutModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStorageNativeCloseoutModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStorageNativeCloseoutModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStorageNativeCloseoutModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            project(':delosdb-storage-derby').layout.buildDirectory.dir('classes/main'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStorageNativeCloseoutRuntimeJars())
}

ext.delosdbStorageNativeCloseoutRegisterSmoke = { Map<String, Object> spec ->
    def classesDir = layout.buildDirectory.dir("classes/${spec.classesDirName}")

    tasks.register((String) spec.compileTask, JavaCompile) {
        dependsOn 'jars',
                'processDerbyResources',
                ':delosdb-spi:compileDelosDbSpi',
                ':delosdb-storage-derby:compileLegacyDerbyStorage',
                ':delosdb-storage-mvcc:delosDbStorageMvccJar'
        group = 'verification'
        description = (String) spec.compileDescription
        source = files((String) spec.sourceDir, rootProject.ext.delosdbSmokeUtilsSourceDir)
        destinationDirectory = classesDir
        sourceCompatibility = javaRelease.toString()
        targetCompatibility = javaRelease.toString()
        options.release = javaRelease
        options.encoding = 'UTF-8'
        classpath = delosdbStorageNativeCloseoutClasspath(classesDir)
    }

    tasks.register((String) spec.smokeTask, JavaExec) {
        dependsOn spec.dependsOn,
                spec.compileTask,
                'jars',
                'processDerbyResources',
                ':delosdb-storage-mvcc:delosDbStorageMvccJar'
        group = 'verification'
        description = (String) spec.smokeDescription
        mainClass = (String) spec.mainClass
        classpath = delosdbStorageNativeCloseoutClasspath(classesDir)
    }

    tasks.register((String) spec.verifyTask) {
        group = 'verification'
        description = (String) spec.verifyDescription
        dependsOn spec.smokeTask
        doLast {
            println((String) spec.successMessage)
        }
    }
}

