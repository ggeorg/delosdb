// Compact native execution closeout verification.
// Compensation cleanup after O5: the permanent route verifies the final provider-parity
// behavior directly instead of re-running every historical milestone smoke.

ext.delosdbStorageNativeCloseoutModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStorageNativeCloseoutRuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStorageNativeCloseoutClasspath = { Object smokeClassesDir ->
    files(
            smokeClassesDir,
            delosdbStorageNativeCloseoutModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStorageNativeCloseoutModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStorageNativeCloseoutModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStorageNativeCloseoutModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            project(':delosdb-storage-derby').layout.buildDirectory.dir('classes/main'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-io.jar'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStorageNativeCloseoutRuntimeJars())
}

def o5SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-o5-full-provider-parity-closeout-smoke')

tasks.register('compileStoragePhaseO5FullProviderParityCloseoutSmoke', JavaCompile) {
    dependsOn 'jars',
            'processDerbyResources',
            ':delosdb-spi:compileDelosDbSpi',
            ':delosdb-storage-derby:compileLegacyDerbyStorage',
            ':delosdb-storage-io:delosDbStorageIoJar',
            ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the O5 full provider-parity closeout smoke test.'
    source = files(
            'dev/storage-phase-o5-full-provider-parity-closeout-smoke/src/main/java',
            rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = o5SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStorageNativeCloseoutClasspath(o5SmokeClassesDir)
}

tasks.register('storagePhaseO5FullProviderParityCloseoutSmoke', JavaExec) {
    dependsOn 'storagePhaseC7StabilizationSmoke',
            'compileStoragePhaseO5FullProviderParityCloseoutSmoke',
            'jars',
            'processDerbyResources',
            ':delosdb-storage-io:delosDbStorageIoJar',
            ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the O5 full provider-parity closeout behavior smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseO5FullProviderParityCloseoutSmoke'
    classpath = delosdbStorageNativeCloseoutClasspath(o5SmokeClassesDir)
}

tasks.register('verifyStoragePhaseO5FullProviderParityCloseout') {
    group = 'verification'
    description = 'Verifies O5 full provider parity without heap MVCC-locking claims.'
    dependsOn 'storagePhaseO5FullProviderParityCloseoutSmoke'
    doLast {
        println 'Verified O5 full provider parity without heap MVCC-locking claims'
    }
}

tasks.register('verifyStorageNativeExecutionCloseout') {
    group = 'verification'
    description = 'Verifies the closed native execution lane and final O5 provider-parity behavior.'
    dependsOn 'verifyStoragePhaseO5FullProviderParityCloseout'
    doLast {
        println 'Verified compact native execution closeout through O5 provider parity'
    }
}
