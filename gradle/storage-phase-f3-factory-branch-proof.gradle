import org.gradle.api.tasks.compile.JavaCompile

// Phase F3.1 provider-aware ResultSetFactory branch proof.
// This is the first native execution-seam proof after F2 catalog persistence:
// generated Derby activations keep emitting getTableScanResultSet(...), and the
// existing GenericResultSetFactory seam can observe persisted provider metadata
// without changing FromBaseTable.generate(), AsmJava, or the bytecode call shape.

ext.delosdbStoragePhaseF31ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseF31ReportFile =
        ext.delosdbStoragePhaseF31ReportDir.map { it.file('storage-phase-f3-factory-branch-proof.txt') }
ext.delosdbStoragePhaseF31SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-f3-factory-branch-smoke')

ext.delosdbStoragePhaseF31RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseF31RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF31RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseF31RejectTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF31RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def present = tokens.findAll { token -> text.contains(token) }
    if (!present.isEmpty()) {
        errors << "${label} contains forbidden tokens: ${present.join(', ')}"
    }
}

ext.delosdbStoragePhaseF31ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseF31RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseF31Classpath = {
    files(
            delosdbStoragePhaseF31SmokeClassesDir,
            delosdbStoragePhaseF31ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseF31ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseF31ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseF31ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseF31RuntimeJars())
}

ext.delosdbStoragePhaseF31Proof = {
    def errors = []
    def lines = []

    def buildFile = file('build.gradle')
    def lookup = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosTableScanProviderLookup.java')
    def genericFactory = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/GenericResultSetFactory.java')
    def resultSetFactory = file('delosdb-engine/src/main/java/org/apache/derby/iapi/sql/execute/ResultSetFactory.java')
    def fromBaseTable = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/FromBaseTable.java')
    def f22Gradle = file('gradle/storage-phase-f2-resultset-metadata-lookup.gradle')
    def f31Gradle = file('gradle/storage-phase-f3-factory-branch-proof.gradle')
    def smokeSource = file('dev/storage-phase-f3-factory-branch-smoke/src/main/java/delosdb/smoke/StoragePhaseF3FactoryBranchSmoke.java')
    def f31Doc = file('docs/storage-phase-f3-factory-branch-proof.md')
    def planDoc = file('docs/storage-phase-f-native-integration-plan.md')
    def roadmap = file('docs/ROADMAP.md')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')

    delosdbStoragePhaseF31RequireTokens(errors, buildFile, [
            "apply from: file('gradle/storage-phase-f2-resultset-metadata-lookup.gradle')",
            "apply from: file('gradle/storage-phase-f3-factory-branch-proof.gradle')"
    ], 'root build F3.1 wiring')
    if (buildFile.exists()) {
        def text = buildFile.text
        def f22 = text.indexOf("apply from: file('gradle/storage-phase-f2-resultset-metadata-lookup.gradle')")
        def f31 = text.indexOf("apply from: file('gradle/storage-phase-f3-factory-branch-proof.gradle')")
        if (f22 < 0 || f31 < 0 || f31 < f22) {
            errors << 'F3.1 apply must appear after F2.2 in build.gradle'
        }
    }

    delosdbStoragePhaseF31RequireTokens(errors, lookup, [
            'FACTORY_PROBE_PROPERTY',
            'observeFactoryLookupIfEnabled(Activation activation, String tableName)',
            'Boolean.getBoolean(FACTORY_PROBE_PROPERTY)',
            'LAST_FACTORY_LOOKUP',
            'LAST_NON_DEFAULT_FACTORY_LOOKUP',
            'FACTORY_LOOKUP_COUNT',
            'resetFactoryLookupForTesting()',
            'factoryLookupCountForTesting()',
            'lastNonDefaultFactoryLookupForTesting()'
    ], 'Delos table-scan provider lookup F3.1 diagnostics')
    delosdbStoragePhaseF31RequireTokens(errors, genericFactory, [
            'DelosTableScanProviderLookup.observeFactoryLookupIfEnabled(activation, tableName);',
            'return new TableScanResultSet(',
            'tableScanParameters('
    ], 'GenericResultSetFactory branch observation seam')
    // F3.1 originally rejected DelosTableScanResultSet because the branch was
    // observation-only.  F3.2 may add a DelosTableScanResultSet skeleton while
    // preserving the F3.1 proof: generated bytecode shape is unchanged and the
    // provider lookup still happens at GenericResultSetFactory.
    delosdbStoragePhaseF31RejectTokens(errors, resultSetFactory, [
            'getDelosTableScanResultSet'
    ], 'ResultSetFactory interface must keep generated bytecode shape unchanged in F3.1')
    delosdbStoragePhaseF31RejectTokens(errors, fromBaseTable, [
            'getDelosTableScanResultSet'
    ], 'FromBaseTable must keep emitting the existing table-scan factory method in F3.1')
    delosdbStoragePhaseF31RequireTokens(errors, f22Gradle, [
            'verifyStoragePhaseF2ResultSetMetadataLookup'
    ], 'F2.2 prerequisite task')
    delosdbStoragePhaseF31RequireTokens(errors, f31Gradle, [
            'storagePhaseF3FactoryBranchSmoke',
            'verifyStoragePhaseF3FactoryBranchProof'
    ], 'F3.1 Gradle task definitions')
    delosdbStoragePhaseF31RequireTokens(errors, smokeSource, [
            'StoragePhaseF3FactoryBranchSmoke',
            'System.setProperty(DelosTableScanProviderLookup.FACTORY_PROBE_PROPERTY, "true")',
            'CREATE TABLE " + TABLE_NAME + " (id INT, value VARCHAR(32)) USING delos_mvcc',
            'INSERT INTO " + TABLE_NAME + " VALUES (1, \'alpha\')',
            'SELECT id, value FROM " + TABLE_NAME + " WHERE id = ?',
            'DelosTableScanProviderLookup.lastNonDefaultFactoryLookupForTesting()',
            'VersionedStorageSqlBridge.lastRouteClassifierForTesting().isEmpty()',
            'storage_phase_f3_factory_branch: PASS'
    ], 'F3.1 factory branch smoke')
    delosdbStoragePhaseF31RequireTokens(errors, f31Doc, [
            'F3.1 — provider-aware ResultSetFactory branch proof',
            'GenericResultSetFactory.getTableScanResultSet',
            'observeFactoryLookupIfEnabled',
            'no FromBaseTable.generate() change',
            'no AsmJava change'
    ], 'F3.1 document')
    delosdbStoragePhaseF31RequireTokens(errors, planDoc, [
            'F3.1 landed',
            'provider-aware ResultSetFactory branch proof',
            'F3.2 — DelosTableScanResultSet skeleton'
    ], 'Phase F plan after F3.1')
    delosdbStoragePhaseF31RequireTokens(errors, roadmap, [
            'F3.1 landed',
            'F3.2 — DelosTableScanResultSet skeleton'
    ], 'ROADMAP after F3.1')
    delosdbStoragePhaseF31RequireTokens(errors, cleanupScript, [
            'storage-phase-f3-factory-branch-db'
    ], 'F3.1 smoke DB cleanup entry')

    lines << 'DelosDB Storage Phase F3.1 Provider-Aware ResultSetFactory Branch Proof'
    lines << '======================================================================='
    lines << ''
    lines << 'Purpose:'
    lines << '  Prove the native Derby table-scan factory seam can observe persisted Delos provider metadata without changing generated bytecode.'
    lines << ''
    lines << 'Verified implementation shape:'
    lines << '  Generated activation still calls the existing ResultSetFactory.getTableScanResultSet(...) signature.'
    lines << '  GenericResultSetFactory calls DelosTableScanProviderLookup.observeFactoryLookupIfEnabled(...) at the branch point.'
    lines << '  The F3.1 branch is proof-gated by a system property and still returns Derby TableScanResultSet.'
    lines << '  FromBaseTable.generate(), AsmJava, and ResultSetFactory method shape remain unchanged.'
    lines << ''
    lines << 'Next step:'
    lines << '  F3.2 replaces the proof-only observation with a DelosTableScanResultSet skeleton branch for delos_mvcc tables.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseF3FactoryBranchProofReport') {
    group = 'verification'
    description = 'Writes the Phase F3.1 provider-aware ResultSetFactory branch proof report.'
    dependsOn 'verifyStoragePhaseF2ResultSetMetadataLookup'
    outputs.file(delosdbStoragePhaseF31ReportFile)
    doLast {
        def result = delosdbStoragePhaseF31Proof()
        def outputFile = delosdbStoragePhaseF31ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase F3.1 provider-aware ResultSetFactory branch proof failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseF3FactoryBranchSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase F3.1 provider-aware ResultSetFactory branch smoke test.'
    source = files('dev/storage-phase-f3-factory-branch-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseF31SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseF31Classpath()
}

tasks.register('storagePhaseF3FactoryBranchSmoke', JavaExec) {
    dependsOn 'storagePhaseF3FactoryBranchProofReport', 'compileStoragePhaseF3FactoryBranchSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase F3.1 provider-aware ResultSetFactory branch smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseF3FactoryBranchSmoke'
    classpath = delosdbStoragePhaseF31Classpath()
}

tasks.register('verifyStoragePhaseF3FactoryBranchProof') {
    group = 'verification'
    description = 'Verifies Phase F3.1 provider-aware ResultSetFactory branch proof.'
    dependsOn 'storagePhaseF3FactoryBranchProofReport', 'storagePhaseF3FactoryBranchSmoke'
    doLast {
        println 'Verified Phase F3.1 provider-aware ResultSetFactory branch proof; next step is F3.2 DelosTableScanResultSet skeleton'
    }
}
