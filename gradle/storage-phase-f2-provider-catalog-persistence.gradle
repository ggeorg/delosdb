import org.gradle.api.tasks.compile.JavaCompile

// Phase F2.1 provider catalog persistence.
// First catalog surgery step: persist storageProviderName in SYSTABLES and
// prove descriptor reconstruction sees it after database restart.

ext.delosdbStoragePhaseF2ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseF2ReportFile =
        ext.delosdbStoragePhaseF2ReportDir.map { it.file('storage-phase-f2-provider-catalog-persistence.txt') }
ext.delosdbStoragePhaseF2SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-f2-provider-catalog-smoke')

ext.delosdbStoragePhaseF2RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseF2RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF2RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}


ext.delosdbStoragePhaseF2RequirePatterns = { List<String> errors, File sourceFile, Map<String, String> patterns, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF2RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = []
    patterns.each { description, regex ->
        if (!(text =~ regex).find()) {
            missing << description
        }
    }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected patterns: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseF2ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseF2RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseF2Classpath = {
    files(
            delosdbStoragePhaseF2SmokeClassesDir,
            delosdbStoragePhaseF2ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseF2ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseF2ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseF2ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseF2RuntimeJars())
}

ext.delosdbStoragePhaseF2Proof = {
    def errors = []
    def lines = []

    def buildFile = file('build.gradle')
    def sysTables = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/catalog/SYSTABLESRowFactory.java')
    def tableDescriptor = file('delosdb-engine/src/main/java/org/apache/derby/iapi/sql/dictionary/TableDescriptor.java')
    def createTableConstantAction = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/CreateTableConstantAction.java')
    def f0Gradle = file('gradle/storage-phase-f0-f1a-native-start.gradle')
    def f2Gradle = file('gradle/storage-phase-f2-provider-catalog-persistence.gradle')
    def f2Doc = file('docs/storage-phase-f2-provider-catalog-persistence.md')
    def planDoc = file('docs/storage-phase-f-native-integration-plan.md')
    def roadmap = file('docs/ROADMAP.md')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')
    def smokeSource = file('dev/storage-phase-f2-provider-catalog-smoke/src/main/java/delosdb/smoke/StoragePhaseF2ProviderCatalogSmoke.java')

    delosdbStoragePhaseF2RequireTokens(errors, buildFile, [
            "apply from: file('gradle/storage-phase-f0-f1a-native-start.gradle')",
            "apply from: file('gradle/storage-phase-f2-provider-catalog-persistence.gradle')"
    ], 'root build F2 wiring')
    if (buildFile.exists()) {
        def text = buildFile.text
        def f0 = text.indexOf("apply from: file('gradle/storage-phase-f0-f1a-native-start.gradle')")
        def f2 = text.indexOf("apply from: file('gradle/storage-phase-f2-provider-catalog-persistence.gradle')")
        if (f0 < 0 || f2 < 0 || f2 < f0) {
            errors << 'F2 apply must appear after F0/F1a in build.gradle'
        }
    }

    delosdbStoragePhaseF2RequirePatterns(errors, sysTables, [
            'SYSTABLES column count is six': ~/SYSTABLES_COLUMN_COUNT\s*=\s*6/,
            'SYSTABLES storage provider column ordinal is six': ~/SYSTABLES_STORAGEPROVIDER\s*=\s*6/,
            'provider name is written as nullable SQLVarchar': ~/row\.setColumn\(SYSTABLES_STORAGEPROVIDER,\s*new SQLVarchar\(storageProviderName\)\)/,
            'descriptor provider is normalized for catalog storage': ~/storageProviderName\s*=\s*providerNameForCatalog\(descriptor\.getStorageProviderName\(\)\)/,
            'provider name is read back from the catalog row': ~/storageProviderName\s*=\s*col\s*==\s*null\s*\?\s*null\s*:\s*col\.getString\(\)/,
            'descriptor reconstruction calls DataDescriptorGenerator.newTableDescriptor': ~/ddg\.newTableDescriptor\(/,
            'descriptor reconstruction passes storage provider name': ~/lockGranularity\.charAt\(0\),\s*storageProviderName/,
            'catalog helper exists': ~/providerNameForCatalog\(String storageProviderName\)/,
            'default provider is stored as catalog null': ~/TableDescriptor\.DEFAULT_STORAGE_PROVIDER_NAME\.equals\(storageProviderName\)/,
            'STORAGEPROVIDER catalog column exists': ~/SystemColumnImpl\.getIdentifierColumn\("STORAGEPROVIDER",\s*true\)/
    ], 'SYSTABLES provider-name persistence')
    delosdbStoragePhaseF2RequireTokens(errors, tableDescriptor, [
            'public static final String DEFAULT_STORAGE_PROVIDER_NAME = "heap"',
            'getStorageProviderName()',
            'normalizeStorageProviderName(storageProviderName)'
    ], 'TableDescriptor provider normalization')
    delosdbStoragePhaseF2RequireTokens(errors, createTableConstantAction, [
            'ddg.newTableDescriptor(tableName, sd, tableType, lockGranularity, storageProviderName)',
            'dd.addDescriptor(td, sd, DataDictionary.SYSTABLES_CATALOG_NUM, false, tc)'
    ], 'CREATE TABLE provider descriptor write path')
    delosdbStoragePhaseF2RequireTokens(errors, f0Gradle, [
            'SYSTABLES_COLUMN_COUNT = 6',
            'SYSTABLES_STORAGEPROVIDER = 6'
    ], 'F0/F1a guard updated after F2.1')
    delosdbStoragePhaseF2RequireTokens(errors, f2Gradle, [
            'verifyStoragePhaseF2ProviderCatalogPersistence',
            'storagePhaseF2ProviderCatalogSmoke'
    ], 'F2 Gradle task definitions')
    delosdbStoragePhaseF2RequireTokens(errors, smokeSource, [
            'StoragePhaseF2ProviderCatalogSmoke',
            'CREATE TABLE " + TABLE_NAME + " (id INT, value VARCHAR(32)) USING delos_mvcc',
            'SELECT STORAGEPROVIDER FROM SYS.SYSTABLES WHERE TABLENAME = ?',
            'TableStorageMetadataResolver.resolve(connection, "APP", tableName)',
            'SmokeUtils.shutdown(DATABASE_PATH)',
            'storage_phase_f2_provider_catalog: PASS'
    ], 'F2 restart persistence smoke')
    delosdbStoragePhaseF2RequireTokens(errors, f2Doc, [
            'F2.1 — Provider catalog persistence',
            'SYSTABLES.STORAGEPROVIDER',
            'nullable',
            'database restart',
            'ResultSetFactory'
    ], 'F2 catalog persistence document')
    delosdbStoragePhaseF2RequireTokens(errors, planDoc, [
            'F2.1 landed',
            'SYSTABLES.STORAGEPROVIDER',
            'F2.2',
            'F3 — provider-aware ResultSetFactory proof'
    ], 'Phase F plan after F2.1')
    delosdbStoragePhaseF2RequireTokens(errors, roadmap, [
            'F2.1 landed',
            'SYSTABLES.STORAGEPROVIDER',
            'F2.2'
    ], 'ROADMAP after F2.1')
    delosdbStoragePhaseF2RequireTokens(errors, cleanupScript, [
            'storage-phase-f2-provider-catalog-db'
    ], 'F2 smoke DB cleanup entry')

    lines << 'DelosDB Storage Phase F2.1 Provider Catalog Persistence'
    lines << '========================================================'
    lines << ''
    lines << 'Purpose:'
    lines << '  Persist TableDescriptor.storageProviderName through SYSTABLES so provider identity survives database restart.'
    lines << ''
    lines << 'Verified implementation shape:'
    lines << '  SYSTABLES_COLUMN_COUNT is 6.'
    lines << '  Column 6 is nullable STORAGEPROVIDER.'
    lines << '  Non-default providers are written to SYSTABLES.'
    lines << '  Null/default providers reconstruct as TableDescriptor.DEFAULT_STORAGE_PROVIDER_NAME.'
    lines << '  Descriptor reconstruction passes storageProviderName into DataDescriptorGenerator.newTableDescriptor(...).'
    lines << ''
    lines << 'Next step:'
    lines << '  F2.2 harden provider validation and prepare the conglomId/tableName metadata lookup needed by F3.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseF2ProviderCatalogPersistenceReport') {
    group = 'verification'
    description = 'Writes the Phase F2.1 provider catalog persistence report.'
    dependsOn 'verifyStoragePhaseF0F1aNativeStart'
    outputs.file(delosdbStoragePhaseF2ReportFile)
    doLast {
        def result = delosdbStoragePhaseF2Proof()
        def outputFile = delosdbStoragePhaseF2ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase F2.1 provider catalog persistence failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseF2ProviderCatalogSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase F2.1 provider catalog persistence smoke test.'
    source = files('dev/storage-phase-f2-provider-catalog-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseF2SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseF2Classpath()
}

tasks.register('storagePhaseF2ProviderCatalogSmoke', JavaExec) {
    dependsOn 'storagePhaseF2ProviderCatalogPersistenceReport', 'compileStoragePhaseF2ProviderCatalogSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase F2.1 provider catalog persistence smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseF2ProviderCatalogSmoke'
    classpath = delosdbStoragePhaseF2Classpath()
}

tasks.register('verifyStoragePhaseF2ProviderCatalogPersistence') {
    group = 'verification'
    description = 'Verifies Phase F2.1 provider catalog persistence.'
    dependsOn 'storagePhaseF2ProviderCatalogPersistenceReport', 'storagePhaseF2ProviderCatalogSmoke'
    doLast {
        println 'Verified Phase F2.1 provider catalog persistence; next step is F2.2 provider validation and ResultSetFactory metadata lookup preparation'
    }
}
