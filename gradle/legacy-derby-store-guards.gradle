tasks.register('verifyLegacyDerbyKernelB5tBtreeScanBoundaryBridge') {
    group = 'verification'
    description = 'B5t: verifies StoreDataValue/StoreRowLocation bridge progress for B-tree scan init/fetch boundaries.'
    dependsOn 'legacyDerbyStoreKernelB5tBtreeScanBoundaryBridgeReport'
    doLast {
        delosdbB5tTouchedFiles.each { source ->
            if (!source.isFile()) {
                throw new GradleException('B5t missing required source file: ' + delosdbB5tRelPath(source))
            }
        }

        def btreeScan = delosdbB5tRead(delosdbB5tBTreeScan)
        if (!btreeScan.contains('StoreDataValue[]                startKeyValue') ||
            !btreeScan.contains('StoreDataValue[]                stopKeyValue') ||
            !btreeScan.contains('StoreRowLocation[]      rowloc_array')) {
            throw new GradleException('B5t BTreeScan must expose store-facing scan boundary parameters')
        }
        def hasStartKeyAdaptation = btreeScan.contains('(DataValueDescriptor[]) startKeyValue') ||
            btreeScan.contains('(org.apache.derby.iapi.types.DataValueDescriptor[]) startKeyValue')
        def hasStopKeyAdaptation = btreeScan.contains('(DataValueDescriptor[]) stopKeyValue') ||
            btreeScan.contains('(org.apache.derby.iapi.types.DataValueDescriptor[]) stopKeyValue')
        def hasLaterStoreNativeScanPath = !btreeScan.contains('DataValueDescriptor') &&
            !btreeScan.contains('org.apache.derby.iapi.types.DataValueDescriptor') &&
            btreeScan.contains('StoreDataValue[][]') &&
            btreeScan.contains('fetchNext_one_slot_array')
        if ((!hasStartKeyAdaptation || !hasStopKeyAdaptation) && !hasLaterStoreNativeScanPath) {
            throw new GradleException('B5t BTreeScan must keep internal DataValueDescriptor adaptation explicit, fully qualified after direct-import closeout, or retired by the later B6f store-native scan path')
        }

        [delosdbB5tBTreeForwardScan, delosdbB5tBTreeMaxScan].each { source ->
            def text = delosdbB5tRead(source)
            if (!text.contains('StoreRowLocation[]      rowloc_array') ||
                text.contains('import org.apache.derby.iapi.types.RowLocation;')) {
                throw new GradleException('B5t ' + delosdbB5tRelPath(source) + ' must use StoreRowLocation[] at fetchRows boundary')
            }
        }

        [delosdbB5tB2IForwardScan, delosdbB5tB2IMaxScan].each { source ->
            def text = delosdbB5tRead(source)
            if (!text.contains('StoreDataValue') ||
                text.contains('import org.apache.derby.iapi.types.DataValueDescriptor;')) {
                throw new GradleException('B5t ' + delosdbB5tRelPath(source) + ' must use StoreDataValue at scan init boundary')
            }
        }

        def remainingStoreTypeImports = delosdbB5tStoreTypeImportLines()
        if (remainingStoreTypeImports.size() >= delosdbB5tBaselineImportCount) {
            throw new GradleException('B5t relocated-store iapi.types import count did not decrease from baseline ' + delosdbB5tBaselineImportCount + ': ' + remainingStoreTypeImports.size())
        }

        def reportText = delosdbB5tRead(delosdbB5tReportFile.get().asFile)
        if (!reportText.contains('B6 readiness') || !reportText.contains('NOT YET')) {
            throw new GradleException('B5t report must preserve the historical B5/B6 transition marker')
        }
        logger.lifecycle('Verified B5t B-tree scan boundary bridge; relocated-store iapi.types imports now ' + remainingStoreTypeImports.size() + '; Phase B successor closeout is handled by B6/B7/B8 proofs')
    }
}

