        def duplicateDefinitions = delosdbB9DuplicateTopLevelDefinitions()
        if (!duplicateDefinitions.isEmpty()) {
            throw new GradleException('B9 expected unique top-level Gradle definitions; found ' + duplicateDefinitions.collect { name, count -> name + ' x' + count }.join(', '))
        }
        def duplicateStoreSources = delosdbB9DuplicateStoreSourceOwnership()
        if (!duplicateStoreSources.isEmpty()) {
            throw new GradleException('B9 expected legacy Derby store source ownership not to be duplicated; found:\n' +
                    duplicateStoreSources.collect { relativePath, owners -> '  ' + relativePath + ' -> ' + owners.join(', ') }.join('\n'))
        }
        def staleArtifacts = delosdbB9StaleWorkspaceArtifacts()
        if (!staleArtifacts.isEmpty()) {
            throw new GradleException('B9 found stale workspace artifacts. Run ./scripts/cleanup-overlay-b9-stale-files.sh first. Found: ' + staleArtifacts.join(', '))
        }
        logger.lifecycle('Verified B9 static analysis; stale proof text, duplicate Gradle registrations, duplicate helpers, duplicate store source ownership, and stale workspace artifacts are clean')
    }
}


tasks.register('legacyDerbyStorePhaseBCloseoutReport') {
    group = 'Verification'
    description = 'Writes the consolidated Phase B legacy Derby store closeout report.'
    dependsOn 'verifyLegacyDerbyStoreB6oCloseout'
    dependsOn 'verifyLegacyDerbyStoreB7RuntimePackaging'
    dependsOn 'verifyLegacyDerbyStoreB8Closeout'
    dependsOn 'verifyLegacyDerbyStoreNoStaleEngineSources'
    dependsOn 'verifyLegacyDerbyStoreSourceRelocation'
    dependsOn 'verifyLegacyDerbyStoreB9StaticAnalysis'
    outputs.file(layout.buildDirectory.file('reports/delosdb/legacy-store-phase-b-closeout.txt'))
    doLast {
        def report = layout.buildDirectory.file('reports/delosdb/legacy-store-phase-b-closeout.txt').get().asFile
        report.parentFile.mkdirs()
        report.text = '''DelosDB Phase B legacy Derby store closeout
================================================

Phase B complete
----------------
The real Derby storage module boundary and compatibility runtime packaging are
closed.

Closed proofs
-------------
- B6 real relocated-store compilation in delosdb-storage-derby
- B6 engine source compile removal
- B7 compatibility runtime packaging
- B8 real Derby storage module boundary closeout
- stale engine store source cleanup
- stable relocated store inventory
- B9 static-analysis cleanup

Compatibility
-------------
- derby.jar carries legacy Derby store runtime classes without requiring users
  to add delosdb-storage-derby.jar manually.
- delosdb-engine consumes compiled storage output instead of compiling relocated
  store sources directly.
- the full Derby language suite is part of the B8 closeout gate.
- MVCC/versioned-storage smoke proofs remain green as part of the B8 closeout
  gate.

Phase C entry rule
------------------
Phase C may start only after verifyLegacyDerbyStorePhaseBCloseout is green.
'''
        logger.lifecycle("Wrote ${report}")
    }
}

tasks.register('verifyLegacyDerbyStorePhaseBCloseout') {
    group = 'Verification'
    description = 'Verifies consolidated Phase B legacy Derby store closeout.'
    dependsOn 'legacyDerbyStorePhaseBCloseoutReport'
    doLast {
        def report = layout.buildDirectory.file('reports/delosdb/legacy-store-phase-b-closeout.txt').get().asFile
        if (!report.isFile()) {
            throw new GradleException('Missing Phase B closeout report: ' + report)
        }
        def text = report.getText('UTF-8')
        [
                'Phase B complete',
                'B6 real relocated-store compilation',
                'B6 engine source compile removal',
                'B7 compatibility runtime packaging',
                'B8 real Derby storage module boundary closeout',
                'B9 static-analysis cleanup',
                'The real Derby storage module boundary and compatibility runtime packaging are',
                'Phase C may start only after verifyLegacyDerbyStorePhaseBCloseout is green.'
        ].each { required ->
            if (!text.contains(required)) {
                throw new GradleException('Phase B closeout report is missing required text: ' + required)
            }
        }
        logger.lifecycle('Verified Phase B closeout; legacy Derby store source ownership, real storage-module compilation, engine source compile removal, runtime packaging, B8 closeout, and B9 cleanup are closed')
    }
}

tasks.register('verifyLegacyDerbyStoreB9Consolidation') {
    group = 'Verification'
    description = 'B9: verifies static cleanup and consolidated Phase B closeout.'
    dependsOn 'verifyLegacyDerbyStoreB9StaticAnalysis'
    dependsOn 'verifyLegacyDerbyStorePhaseBCloseout'
    doLast {
        logger.lifecycle('Verified B9 consolidation; Phase B proof language, static analysis, closeout report, and Phase C entry gate are clean')
    }
}

