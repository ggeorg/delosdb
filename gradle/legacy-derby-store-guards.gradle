tasks.register('verifyLegacyDerbyKernelB5sScanFetchLocationBridge') {
    group = 'verification'
    description = 'B5s: verifies StoreDataValue/StoreRowLocation bridge progress for scan fetch/location APIs.'
    dependsOn 'legacyDerbyStoreKernelB5sScanFetchLocationBridgeReport'
    doLast {
        delosdbB5sTouchedFiles.each { source ->
            if (!source.isFile()) {
                throw new GradleException('B5s missing required source file: ' + delosdbB5sRelPath(source))
            }
        }

        def apiTypeImportsRemaining = delosdbB5sApiTypeImportsRemaining()
        if (!apiTypeImportsRemaining.isEmpty()) {
            throw new GradleException('B5s retired direct scan API/sort type imports still remain: ' + apiTypeImportsRemaining.join('; '))
        }

        def scanApi = delosdbB5sRead(delosdbB5sScanControllerApi)
        if (!scanApi.contains('void fetch(StoreDataValue[] destRow)') ||
            !scanApi.contains('boolean fetchNext(StoreDataValue[] destRow)') ||
            !scanApi.contains('void fetchLocation(StoreRowLocation destRowLocation)') ||
            !scanApi.contains('boolean positionAtRowLocation(StoreRowLocation rl)')) {
            throw new GradleException('B5s ScanController must expose store-facing fetch/location signatures')
        }

        def genericScanApi = delosdbB5sRead(delosdbB5sGenericScanControllerApi)
        if (!genericScanApi.contains('StoreRowLocation newRowLocationTemplate()') ||
            !genericScanApi.contains('StoreDataValue[]        startKeyValue') ||
            !genericScanApi.contains('StoreDataValue[]        stopKeyValue')) {
            throw new GradleException('B5s GenericScanController must expose store-facing reopen/location signatures')
        }

        def groupFetchApi = delosdbB5sRead(delosdbB5sGroupFetchScanControllerApi)
        if (!groupFetchApi.contains('StoreDataValue[][]') || !groupFetchApi.contains('StoreRowLocation[]')) {
            throw new GradleException('B5s GroupFetchScanController must expose store-facing group fetch arrays')
        }

        [delosdbB5sGenericScanControllerImpl, delosdbB5sBTreeScan, delosdbB5sHeapScan, delosdbB5sHeapCompressScan].each { source ->
            def text = delosdbB5sRead(source)
            if (!text.contains('StoreDataValue') || !text.contains('StoreRowLocation')) {
                throw new GradleException('B5s ' + delosdbB5sRelPath(source) + ' must participate in the scan bridge')
            }
        }

        [delosdbB5sCreateIndexConstantAction, delosdbB5sAlterTableConstantAction, delosdbB5sTemporaryRowHolderResultSet, delosdbB5sTableScanResultSet, delosdbB5sSortResultSet, delosdbB5sGroupedAggregateResultSet, delosdbB5sInsertResultSet, delosdbB5sConsistencyChecker].each { source ->
            def text = delosdbB5sRead(source)
            def hasRowLocationBoundaryAdaptation = text.contains('(RowLocation)') ||
                    text.contains('EngineStoreRowLocationBridge.requireEngineRowLocation(')
            if (!hasRowLocationBoundaryAdaptation || !text.contains('newRowLocationTemplate()')) {
                throw new GradleException('B5s ' + delosdbB5sRelPath(source) + ' must adapt StoreRowLocation back to RowLocation at the SQL execution boundary')
            }
        }

        def remainingStoreTypeImports = delosdbB5sStoreTypeImportLines()
        if (remainingStoreTypeImports.size() >= delosdbB5sBaselineImportCount) {
            throw new GradleException('B5s relocated-store iapi.types import count did not decrease from baseline ' + delosdbB5sBaselineImportCount + ': ' + remainingStoreTypeImports.size())
        }

        def reportText = delosdbB5sRead(delosdbB5sReportFile.get().asFile)
        if (!reportText.contains('B6 readiness') || !reportText.contains('NOT YET')) {
            throw new GradleException('B5s report must preserve the historical B5/B6 transition marker')
        }
        logger.lifecycle('Verified B5s scan fetch/location bridge; relocated-store iapi.types imports now ' + remainingStoreTypeImports.size() + '; Phase B successor closeout is handled by B6/B7/B8 proofs')
    }
}

