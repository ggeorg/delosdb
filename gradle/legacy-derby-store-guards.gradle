    def text = delosdbB6nEngineBuildText()
    def hits = []
    [
            "legacyDerbyStorageSourceRoot",
            "fileTree(legacyDerbyStorageSourceRoot)",
            "include 'org/apache/derby/iapi/store/**/*.java'",
            "include \"org/apache/derby/iapi/store/**/*.java\"",
            "include 'org/apache/derby/impl/store/**/*.java'",
            "include \"org/apache/derby/impl/store/**/*.java\""
    ].each { marker ->
        if (text.contains(marker)) {
            hits << marker
        }
    }
    hits
}

def delosdbB6nStorageCompilesRealStoreSources = {
    def text = delosdbB6nStorageBuildText()
    text.contains("include 'org/apache/derby/iapi/store/**/*.java'") &&
            text.contains("include 'org/apache/derby/impl/store/**/*.java'") &&
            !text.contains("exclude 'org/apache/derby/iapi/store/**/*.java'") &&
            !text.contains("exclude 'org/apache/derby/impl/store/**/*.java'")
}

def delosdbB6nStorageDependsOnEngineOutput = {
    def text = delosdbB6nStorageBuildText()
    text.contains(":delosdb-engine:compileDerbyEngine") ||
            text.contains("engineModuleClassDir") ||
            text.contains("classes/modules/org.apache.derby.engine")
}

def delosdbB6nEngineConsumesCompiledStorageOutput = {
    def text = delosdbB6nEngineBuildText()
    text.contains(":delosdb-storage-derby:compileLegacyDerbyStorage") &&
            text.contains("--patch-module") &&
            text.contains("storageDerbyClassDir")
}

def delosdbB6nDerbyJarPackagesCompiledStorageOutput = {
    def text = delosdbB6nEngineBuildText()
    text.contains("from(storageDerbyClassDir)") &&
            text.contains("include 'org/apache/derby/iapi/store/**'") &&
            text.contains("include 'org/apache/derby/impl/store/**'")
}

