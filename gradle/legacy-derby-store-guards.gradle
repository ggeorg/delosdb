tasks.register('verifyLegacyDerbyKernelB5rRowSourceCreateTemplateBridge') {
    group = 'verification'
    description = 'B5r: verifies StoreDataValue bridge progress for row-source drains and create templates.'
    dependsOn 'legacyDerbyStoreKernelB5rRowSourceCreateTemplateBridgeReport'
    doLast {
        delosdbB5rTouchedFiles.each { source ->
            if (!source.isFile()) {
                throw new GradleException('B5r missing required source file: ' + delosdbB5rRelPath(source))
            }
        }

        def retiredImportsRemaining = delosdbB5rRetiredImportsRemaining()
        if (!retiredImportsRemaining.isEmpty()) {
            throw new GradleException('B5r retired direct store type imports still remain: ' + retiredImportsRemaining.join('; '))
        }

        if (!delosdbB5rRead(delosdbB5rRowSource).contains('StoreDataValue[] getNextRowFromRowSource()')) {
            throw new GradleException('B5r RowSource must return StoreDataValue[]')
        }
        if (!delosdbB5rRead(delosdbB5rMergeScanRowSource).contains('StoreDataValue[] getNextRowFromRowSource()')) {
            throw new GradleException('B5r MergeScanRowSource must expose StoreDataValue[] at the row-source boundary')
        }
        [delosdbB5rBackingStoreHashtable, delosdbB5rBTreeController, delosdbB5rHeapController, delosdbB5rCardinalityCounter].each { source ->
            def text = delosdbB5rRead(source)
            if (!text.contains('getNextRowFromRowSource()')) {
                throw new GradleException('B5r ' + delosdbB5rRelPath(source) + ' must still participate in the row-source boundary')
            }
            if (!text.contains('StoreDataValue[]') && !text.contains('(DataValueDescriptor[])')) {
                throw new GradleException('B5r ' + delosdbB5rRelPath(source) + ' must adapt row-source rows through StoreDataValue[] or the old explicit concrete row cast')
            }
        }
        [delosdbB5rConglomerateFactory, delosdbB5rHeapConglomerateFactory, delosdbB5rB2IFactory, delosdbB5rHeap, delosdbB5rBTree, delosdbB5rB2I, delosdbB5rConglomerateUtil].each { source ->
            def text = delosdbB5rRead(source)
            if (!text.contains('StoreDataValue[]')) {
                throw new GradleException('B5r ' + delosdbB5rRelPath(source) + ' must use StoreDataValue[] for create/template boundaries')
            }
        }
        if (!delosdbB5rRead(delosdbB5rB2I).contains('StoreRowLocation')) {
            throw new GradleException('B5r B2I create-time row-location assertion must use StoreRowLocation')
        }

        def remainingStoreTypeImports = delosdbB5rStoreTypeImportLines()
        if (remainingStoreTypeImports.size() >= delosdbB5rBaselineImportCount) {
            throw new GradleException('B5r relocated-store iapi.types import count did not decrease from baseline ' + delosdbB5rBaselineImportCount + ': ' + remainingStoreTypeImports.size())
        }

        def reportText = delosdbB5rRead(delosdbB5rReportFile.get().asFile)
        if (!reportText.contains('B6 readiness') || !reportText.contains('NOT YET')) {
            throw new GradleException('B5r report must preserve the historical B5/B6 transition marker')
        }
        logger.lifecycle('Verified B5r row-source/create-template bridge; relocated-store iapi.types imports now ' + remainingStoreTypeImports.size() + '; Phase B successor closeout is handled by B6/B7/B8 proofs')
    }
}

