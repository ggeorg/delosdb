tasks.register('verifyLegacyDerbyKernelB5wRawPageValueIoBridge') {
    group = 'verification'
    description = 'B5w: verifies StoredPage raw value IO uses StoreTypeUtil instead of direct DataValueDescriptor imports.'
    dependsOn 'legacyDerbyStoreKernelB5wRawPageValueIoBridgeReport'
    doLast {
        delosdbB5wTouchedFiles.each { source ->
            if (!source.isFile()) {
                throw new GradleException('B5w missing required source file: ' + delosdbB5wRelPath(source))
            }
        }

        def storedPageText = delosdbB5wRead(delosdbB5wStoredPage)
        if (storedPageText.contains('import org.apache.derby.iapi.types.DataValueDescriptor;')) {
            throw new GradleException('B5w StoredPage must not import DataValueDescriptor directly')
        }
        if (!storedPageText.contains('import org.apache.derby.iapi.store.types.StoreDataValue;')) {
            throw new GradleException('B5w StoredPage must use StoreDataValue as the raw-page value marker')
        }
        if (!storedPageText.contains('StoreTypeUtil.readExternal(column,') ||
            !storedPageText.contains('StoreTypeUtil.readExternalFromArray(column,') ||
            !storedPageText.contains('StoreTypeUtil.writeExternal(column, logicalDataOut)') ||
            !storedPageText.contains('StoreTypeUtil.restoreToNull(column)')) {
            throw new GradleException('B5w StoredPage must route raw value read/write/null operations through StoreTypeUtil')
        }

        def supportText = delosdbB5wRead(delosdbB5wStoreTypeSupport)
        if (!supportText.contains('void restoreToNull(Object value)') ||
            !supportText.contains('void readExternal(Object value, ObjectInput input)') ||
            !supportText.contains('void readExternalFromArray(Object value, ArrayInputStream input)') ||
            !supportText.contains('void writeExternal(Object value, ObjectOutput output)')) {
            throw new GradleException('B5w StoreTypeSupport must expose raw value IO bridge operations')
        }

        def engineSupportText = delosdbB5wRead(delosdbB5wEngineStoreTypeSupport)
        if (!engineSupportText.contains('dataValue(value).readExternalFromArray(input)') ||
            !engineSupportText.contains('dataValue(value).writeExternal(output)')) {
            throw new GradleException('B5w EngineStoreTypeSupport must keep concrete DataValueDescriptor IO implementation engine-owned')
        }

        def remainingStoreTypeImports = delosdbB5wStoreTypeImportLines()
        if (remainingStoreTypeImports.size() >= delosdbB5wBaselineImportCount) {
            throw new GradleException('B5w relocated-store iapi.types import count did not decrease from baseline ' + delosdbB5wBaselineImportCount + ': ' + remainingStoreTypeImports.size())
        }

        def reportText = delosdbB5wRead(delosdbB5wReportFile.get().asFile)
        if (!reportText.contains('B6 readiness') || !reportText.contains('NOT YET')) {
            throw new GradleException('B5w report must preserve the historical B5/B6 transition marker')
        }
        logger.lifecycle('Verified B5w raw-page value IO bridge; relocated-store iapi.types imports now ' + remainingStoreTypeImports.size() + '; Phase B successor closeout is handled by B6/B7/B8 proofs')
    }
}

