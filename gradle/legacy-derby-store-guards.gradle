            def text = delosdbB5aeRead(source)
            if (text.contains('import org.apache.derby.iapi.types.')) {
                throw new GradleException('B5ae file still has a direct iapi.types import: ' + delosdbB5aeRelPath(source))
            }
        }

        def imports = delosdbB5aeStoreTypeImportLines()
        if (imports.size() != 0) {
            throw new GradleException('B5ae expected zero direct relocated-store iapi.types imports, found ' + imports.size() + ': ' + imports.join('; '))
