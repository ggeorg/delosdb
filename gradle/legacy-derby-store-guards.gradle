tasks.register('verifyLegacyDerbyKernelB5bLoaderSplit') {
    group = 'verification'
    description = 'B5b: verifies the loader service API is kernel-owned and the ByteArray boundary was erased.'
    dependsOn ':delosdb-engine-kernel:compileDelosDbEngineKernel', 'legacyDerbyStoreKernelB5bLoaderSplitReport'
