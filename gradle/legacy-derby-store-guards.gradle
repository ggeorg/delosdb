-------
B6j records the final inherited type seam after B6i. The measured B6i state leaves ten executable fully-qualified inherited type references, all intentionally isolated to HeapRowLocation. HeapRowLocation is special:
it is not only a store row-location object. Engine/catalog code still uses it as
an inherited Derby RowLocation/DataValueDescriptor value when building index rows,
sequence row locations, and catalog lookup keys.

Current source state
--------------------
delosdb-storage-derby compiles real store source: ${file('delosdb-storage-derby/build.gradle').text.contains("include 'org/apache/derby/impl/store/**/*.java'") ? 'YES' : 'NO'}
delosdb-engine still compiles relocated store source directly: ${file('delosdb-engine/build.gradle').text.contains("fileTree(legacyDerbyStorageSourceRoot) { include 'org/apache/derby/impl/store/**/*.java' }") ? 'YES' : 'NO'}

