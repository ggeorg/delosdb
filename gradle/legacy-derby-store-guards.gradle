// B6c — independent storage compile blocker map.
// B5 closed the direct iapi.types import blocker. B6a/B6b removed known direct
// store-to-engine imports. Before flipping compilation ownership, keep the next
// truth gate honest: fully qualified inherited type references still make the
// real storage-module compile depend on the engine type package unless the type
// core is moved to the kernel or the concrete internals are rewritten.
def delosdbB6cStoreRoots = [
        file('delosdb-storage-derby/src/main/java/org/apache/derby/iapi/store'),
        file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store')
]

def delosdbB6cStoreFiles = {
    delosdbB6cStoreRoots.findAll { it.exists() }.collectMany { root ->
        fileTree(root) { include '**/*.java' }.files.findAll { it.isFile() }
    }.sort { a, b -> a.path <=> b.path }
}

def delosdbB6cRead = { File source ->
    source.exists() ? source.getText('UTF-8') : ''
}

def delosdbB6cCodeOnly = { String text ->
    text
            .replaceAll(/(?s)\/\*.*?\*\//, '')
            .replaceAll(/(?m)\/\/.*$/, '')
}

def delosdbB6cDirectTypeImports = {
    delosdbB6cStoreFiles().collectMany { source ->
        delosdbB6cRead(source).readLines().findAll { line ->
            line ==~ /\s*import\s+org\.apache\.derby\.iapi\.types\..*;/
        }.collect { line -> [source: source, line: line.trim()] }
    }
}

def delosdbB6cDirectEngineImports = {
    def forbiddenPrefixes = [
            'org.apache.derby.database.',
            'org.apache.derby.iapi.sql.',
            'org.apache.derby.impl.sql.',
            'io.github.ggeorg.delosdb.engine.'
    ]
    delosdbB6cStoreFiles().collectMany { source ->
        delosdbB6cRead(source).readLines().findAll { line ->
            def trimmed = line.trim()
            trimmed.startsWith('import ') && forbiddenPrefixes.any { prefix -> trimmed.contains(prefix) }
        }.collect { line -> [source: source, line: line.trim()] }
    }
}

def delosdbB6cFullyQualifiedTypeRefs = {
    def pattern = ~/org\.apache\.derby\.iapi\.types\.([A-Za-z0-9_]+)/
    delosdbB6cStoreFiles().collectMany { source ->
        def code = delosdbB6cCodeOnly(delosdbB6cRead(source))
        def refs = []
        def matcher = pattern.matcher(code)
        while (matcher.find()) {
            refs << [source: source, type: matcher.group(1)]
        }
        refs
    }
}

