tasks.register('verifyLegacyDerbyStoreB6jHeapRowLocationCompatibility') {
    group = 'Verification'
    description = 'B6j: verifies the final inherited type seam is isolated to HeapRowLocation and remains runtime-compatible.'
    dependsOn 'legacyDerbyStoreB6jHeapRowLocationCompatibilityReport'
    doLast {
        def directTypeImports = delosdbB6cDirectTypeImports()
        if (!directTypeImports.isEmpty()) {
            throw new GradleException('B6j requires direct relocated-store org.apache.derby.iapi.types imports to remain zero; found:\n' +
                    directTypeImports.collect { "${it.source}: ${it.line}" }.join('\n'))
        }
        def fqRefs = delosdbB6cFullyQualifiedTypeRefs()
        if (fqRefs.size() > delosdbB6jBaselineQualifiedTypeCodeRefs) {
            throw new GradleException("B6j expected at most ${delosdbB6jBaselineQualifiedTypeCodeRefs} fully-qualified inherited type refs, found ${fqRefs.size()}")
        }
        def remainingFiles = fqRefs.collect { it.source.name }.toSet()
        if (!fqRefs.isEmpty() && remainingFiles != ['HeapRowLocation.java'] as Set) {
            throw new GradleException("B6j expected remaining inherited type refs to be isolated in HeapRowLocation.java, found ${remainingFiles}")
        }
        def heapCode = delosdbB6cCodeOnly(delosdbB6cRead(delosdbB6jHeapRowLocationFile))
        if (!fqRefs.isEmpty()) {
            if (!heapCode.contains('extends org.apache.derby.iapi.types.DataType')) {
                throw new GradleException('B6j expected HeapRowLocation to keep inherited DataType compatibility until engine RowLocation consumers are bridged')
            }
            if (!heapCode.contains('org.apache.derby.iapi.types.RowLocation') ||
