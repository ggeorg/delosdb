// -----------------------------------------------------------------------------
// A0 — Legacy Derby store module reality gate
// -----------------------------------------------------------------------------
// A0 is intentionally read-only. It performs no file movement, no dependency
// changes, and no provider facade work. It records the corrected post-DS12
// reality: source ownership moved, but independent storage-module compilation
// is not yet complete.

def delosdbA0StoreApiRoot = file('delosdb-storage-derby/src/main/java/org/apache/derby/iapi/store')
def delosdbA0StoreImplRoot = file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store')
def delosdbA0EngineStoreApiRoot = file('delosdb-engine/src/main/java/org/apache/derby/iapi/store')
def delosdbA0EngineStoreImplRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
def delosdbA0RelocatedStoreRoots = [delosdbA0StoreApiRoot, delosdbA0StoreImplRoot]

def delosdbA0JavaSourcesUnder = { File root ->
    if (!root.exists()) {
        return [] as List<File>
    }
    return fileTree(root) { include '**/*.java' }.files.sort { it.path }
}

def delosdbA0RelocatedStoreSources = {
    def result = []
    delosdbA0RelocatedStoreRoots.each { root -> result.addAll(delosdbA0JavaSourcesUnder(root)) }
    return result.unique { it.canonicalPath }.sort { it.path }
}

def delosdbA0RelPath = { File source ->
    return rootDir.toPath().relativize(source.toPath()).toString().replace(File.separatorChar, '/' as char)
}

def delosdbA0Imports = { Collection<File> sources ->
    def imports = []
    sources.each { source ->
        int lineNumber = 0
        source.eachLine { line ->
            lineNumber++
            def matcher = line =~ /^\s*import\s+([^;]+);\s*$/
            if (matcher.matches()) {
                imports << [file: delosdbA0RelPath(source), line: lineNumber, importedType: matcher[0][1].trim()]
            }
        }
    }
    return imports
}

def delosdbA0ImportMatches = { Collection<File> sources, Collection<String> prefixes, Collection<String> exactTypes = [] ->
    return delosdbA0Imports(sources).findAll { imported ->
        exactTypes.contains(imported.importedType) || prefixes.any { prefix -> imported.importedType.startsWith(prefix) }
    }
}

def delosdbA0GroupedImportSummary = { Collection<Map> imports ->
    if (imports.isEmpty()) {
        return '(none)'
    }
    return imports.groupBy { it.importedType }.collect { importedType, entries ->
        def files = entries.collect { it.file }.unique().sort()
        def locations = entries.collect { "  ${it.file}:${it.line}" }.sort().join('\n')
        "${importedType}: ${entries.size()} import(s), ${files.size()} file(s)\n${locations}"
    }.sort().join('\n')
}

def delosdbA0SimpleImportCounts = { Collection<Map> imports ->
    if (imports.isEmpty()) {
        return '(none)'
    }
    return imports.groupBy { it.importedType }.collect { importedType, entries ->
        "${importedType}: ${entries.size()} import(s), ${entries.collect { it.file }.unique().size()} file(s)"
    }.sort().join('\n')
}

def delosdbA0BuildFileContains = { String relativePath, String text ->
    def buildFile = file(relativePath)
    return buildFile.isFile() && buildFile.text.contains(text)
}

def delosdbA0EngineCompilesRelocatedStoreSources = {
    return delosdbA0BuildFileContains('delosdb-engine/build.gradle', "fileTree(legacyDerbyStorageSourceRoot) { include 'org/apache/derby/iapi/store/**/*.java' }")
            || delosdbA0BuildFileContains('delosdb-engine/build.gradle', 'include \'org/apache/derby/iapi/store/**/*.java\'')
            || delosdbA0BuildFileContains('delosdb-engine/build.gradle', "include 'org/apache/derby/iapi/store/**/*.java'")
            || delosdbA0BuildFileContains('delosdb-engine/build.gradle', "include 'org/apache/derby/impl/store/**/*.java'")
}

def delosdbA0StorageDerbyExcludesRealStoreSources = {
    return delosdbA0BuildFileContains('delosdb-storage-derby/build.gradle', "exclude 'org/apache/derby/iapi/store/**/*.java'")
            || delosdbA0BuildFileContains('delosdb-storage-derby/build.gradle', "exclude 'org/apache/derby/impl/store/**/*.java'")
}

def delosdbA0FacadeClassPresent = { String simpleName ->
    def candidates = []
    ['delosdb-spi/src/main/java', 'delosdb-engine/src/main/java', 'delosdb-storage-mvcc/src/main/java'].each { root ->
        def sourceRoot = file(root)
        if (sourceRoot.exists()) {
            candidates.addAll(fileTree(sourceRoot) { include '**/*.java' }.files)
        }
    }
    return candidates.any { source ->
        source.name == "${simpleName}.java" || source.text.contains("interface ${simpleName}") || source.text.contains("class ${simpleName}")
    }
}

tasks.register('verifyLegacyDerbyStoreSourceRelocation') {
    group = 'verification'
    description = 'A0: verifies inherited Derby store source ownership lives under delosdb-storage-derby and not delosdb-engine.'
    doLast {
        def apiFiles = delosdbA0JavaSourcesUnder(delosdbA0StoreApiRoot)
        def implFiles = delosdbA0JavaSourcesUnder(delosdbA0StoreImplRoot)
        if (apiFiles.isEmpty()) {
            throw new GradleException('A0 source relocation failed: missing relocated org.apache.derby.iapi.store sources under delosdb-storage-derby')
        }
        if (implFiles.isEmpty()) {
            throw new GradleException('A0 source relocation failed: missing relocated org.apache.derby.impl.store sources under delosdb-storage-derby')
        }
        def staleRoots = [delosdbA0EngineStoreApiRoot, delosdbA0EngineStoreImplRoot].findAll { it.exists() }
        if (!staleRoots.isEmpty()) {
            throw new GradleException('A0 source relocation failed: stale engine-side inherited store roots remain:\n'
                    + staleRoots.collect { delosdbA0RelPath(it) }.join('\n'))
        }
        logger.lifecycle('A0 source relocation: PASS — relocated store tree has ' + apiFiles.size()
                + ' iapi.store source files and ' + implFiles.size() + ' impl.store source files')
    }
}

tasks.register('verifyLegacyDerbyStoreNoUpwardSqlImports') {
    group = 'verification'
