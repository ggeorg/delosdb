tasks.register('verifyLegacyDerbyKernelB5mFactoryCollationBridge') {
    group = 'verification'
    description = 'B5m: verifies the larger factory/collation bridge batch and import-count decrease.'
    dependsOn 'legacyDerbyStoreKernelB5mFactoryCollationBridgeReport'
    doLast {
        ([delosdbB5mStoreDataValueFactory, delosdbB5mStoreStringDataValue,
          delosdbB5mStoreTypeSupport, delosdbB5mStoreTypeUtil, delosdbB5mEngineProvider] + delosdbB5mTouchedStoreFiles).each { source ->
            if (!source.isFile()) {
                throw new GradleException('B5m missing required source file: ' + delosdbB5mRelPath(source))
            }
        }

        def factoryText = delosdbB5mRead(delosdbB5mStoreDataValueFactory)
        if (!factoryText.contains('StoreDataValue getNull(int formatId, int collationType)')) {
            throw new GradleException('B5m StoreDataValueFactory must expose store-facing getNull(formatId, collationType)')
        }

        def stringText = delosdbB5mRead(delosdbB5mStoreStringDataValue)
        if (!stringText.contains('COLLATION_TYPE_UCS_BASIC')) {
            throw new GradleException('B5m StoreStringDataValue must expose COLLATION_TYPE_UCS_BASIC')
        }

        def supportText = delosdbB5mRead(delosdbB5mStoreTypeSupport)
        def utilText = delosdbB5mRead(delosdbB5mStoreTypeUtil)
        def providerText = delosdbB5mRead(delosdbB5mEngineProvider)
        delosdbB5mRequiredBridgeMethods.each { method ->
            if (!supportText.contains(method)) {
                throw new GradleException('B5m StoreTypeSupport missing bridge method: ' + method)
            }
            if (!utilText.contains(method)) {
                throw new GradleException('B5m StoreTypeUtil missing bridge method: ' + method)
            }
            if (!providerText.contains(method)) {
                throw new GradleException('B5m EngineStoreTypeSupport missing bridge method: ' + method)
            }
        }

        def retiredImportsRemaining = delosdbB5mRetiredImportsRemaining()
        if (!retiredImportsRemaining.isEmpty()) {
            throw new GradleException('B5m retired direct store type imports still remain: ' + retiredImportsRemaining.join('; '))
        }

        def forbiddenKernelImports = delosdbB5mForbiddenKernelImports()
        if (!forbiddenKernelImports.isEmpty()) {
            throw new GradleException('B5m kernel store type bridge must stay SQL/type/catalog neutral: ' + forbiddenKernelImports.join('; '))
        }

        def diskText = delosdbB5mRead(file('delosdb-storage-derby/src/main/java/org/apache/derby/iapi/store/access/DiskHashtable.java'))
        if (!diskText.contains('StoreStringDataValue.COLLATION_TYPE_UCS_BASIC') ||
                !diskText.contains('StoreTypeUtil.newSQLInteger()')) {
            throw new GradleException('B5m DiskHashtable must use store bridge constants and SQLInteger construction')
        }

        def branchRowText = delosdbB5mRead(file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/btree/BranchRow.java'))
        if (!branchRowText.contains('StoreTypeUtil.newSQLLongint') ||
                branchRowText.contains('import org.apache.derby.iapi.types.SQLLongint;')) {
            throw new GradleException('B5m BranchRow must route child-page SQLLongint construction through StoreTypeUtil')
        }

        def propertyText = delosdbB5mRead(file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/PropertyConglomerate.java'))
        if (!propertyText.contains('StoreTypeUtil.newUserType') || !propertyText.contains('StoreTypeUtil.getObject')) {
            throw new GradleException('B5m PropertyConglomerate must route UserType allocation/access through StoreTypeUtil')
        }

        def templateText = delosdbB5mRead(file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store/access/conglomerate/TemplateRow.java'))
        if (!templateText.contains('StoreDataValueFactory') || !templateText.contains('StoreTypeUtil.newSQLLongint')) {
            throw new GradleException('B5m TemplateRow must use StoreDataValueFactory and StoreTypeUtil.newSQLLongint')
        }

        def remainingStoreTypeImports = delosdbB5mStoreTypeImportLines()
        if (remainingStoreTypeImports.size() >= delosdbB5mBaselineImportCount) {
            throw new GradleException('B5m relocated-store iapi.types import count did not decrease from baseline ' + delosdbB5mBaselineImportCount + ': ' + remainingStoreTypeImports.size())
        }

        def reportText = delosdbB5mRead(delosdbB5mReportFile.get().asFile)
        if (!reportText.contains('B6 readiness') || !reportText.contains('NOT YET')) {
            throw new GradleException('B5m report must preserve the historical B5/B6 transition marker')
        }
        logger.lifecycle('Verified B5m factory/collation bridge; relocated-store iapi.types imports now ' + remainingStoreTypeImports.size() + '; Phase B successor closeout is handled by B6/B7/B8 proofs')
    }
}

