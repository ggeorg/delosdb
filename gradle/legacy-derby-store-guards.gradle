// B5h — Seed the SQL-neutral store-facing type boundary before B6
//
// B5g selected Option C: do not move the whole inherited Derby type system
// into delosdb-engine-kernel. B5h creates the neutral kernel-owned type
// boundary and adapts the engine-owned iapi.types contracts to it. This is a
// preparatory bridge only; relocated store sources still import iapi.types until
// the follow-up rewrite swaps them to the store-facing contracts.
def delosdbB5hKernelTypeRoot = file('delosdb-engine-kernel/src/main/java/org/apache/derby/iapi/store/types')
def delosdbB5hEngineTypeRoot = file('delosdb-engine/src/main/java/org/apache/derby/iapi/types')
def delosdbB5hReportFile = layout.buildDirectory.file('reports/delosdb/legacy-store-kernel-b5h-type-bridge.txt')

