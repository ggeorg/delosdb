// -----------------------------------------------------------------------------
// DS7 — Legacy Derby storage module scaffold
// -----------------------------------------------------------------------------
// This is Phase 2's first physical step. It creates the Gradle/JPMS scaffold for
// delosdb-storage-derby, but intentionally moves no store packages yet. The
// inherited Derby store still lives in delosdb-engine until DS8/DS9.

tasks.register('verifyLegacyDerbyStorageModuleScaffold') {
    group = 'verification'
    description = 'Verifies the delosdb-storage-derby scaffold and DS8/DS9 whole-package store source moves.'
    dependsOn ':delosdb-storage-derby:compileLegacyDerbyStorage'
    doLast {
        def storageProjectDir = file('delosdb-storage-derby')
        def moduleInfo = file('delosdb-storage-derby/src/main/java/module-info.java')
        def buildFile = file('delosdb-storage-derby/build.gradle')
        if (!storageProjectDir.isDirectory()) {
            throw new GradleException('Missing delosdb-storage-derby project directory')
        }
        if (!buildFile.isFile()) {
            throw new GradleException('Missing delosdb-storage-derby/build.gradle')
        }
        if (!moduleInfo.isFile()) {
            throw new GradleException('Missing delosdb-storage-derby/src/main/java/module-info.java')
        }
        def storageApiRoot = file('delosdb-storage-derby/src/main/java/org/apache/derby/iapi/store')
        def storageImplRoot = file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store')
