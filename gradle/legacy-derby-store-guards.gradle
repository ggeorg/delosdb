${directTypeImports ? directTypeImports.collect { "  - ${it.source}: ${it.line}" }.join('\n') : '  none'}

Fully-qualified inherited type references in executable relocated-store source
-----------------------------------------------------------------------------
  B6j baseline: ${delosdbB6jBaselineQualifiedTypeCodeRefs}
  current:      ${fqRefs.size()}

By type:
${byType ? byType.collect { type, count -> "  - ${type}: ${count}" }.join('\n') : '  none'}

By file:
${byFile ? byFile.collect { path, typed -> "${path}\n" + typed.collect { type, count -> "  - ${type}: ${count}" }.join('\n') }.join('\n') : 'none'}

HeapRowLocation compatibility contract
--------------------------------------
extends inherited DataType: ${heapCode.contains('extends org.apache.derby.iapi.types.DataType') ? 'YES' : 'NO'}
implements inherited RowLocation: ${heapCode.contains('org.apache.derby.iapi.types.RowLocation') ? 'YES' : 'NO'}
implements inherited RefDataValue: ${heapCode.contains('org.apache.derby.iapi.types.RefDataValue') ? 'YES' : 'NO'}

Engine/catalog RowLocation consumers still present
--------------------------------------------------
  count: ${engineConsumers.size()}
${engineConsumers ? engineConsumers.collect { "  - ${it.path - rootDir.path - File.separator}" }.join('\n') : '  none'}

