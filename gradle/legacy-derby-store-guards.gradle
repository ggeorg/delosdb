Decision
--------
B9 static analysis is clean when stale B6 readiness text is gone, Gradle task
and top-level helper names are unique, legacy Derby store source ownership is
not duplicated, and stale workspace artifacts have been cleaned or explicitly
reported.
"""
        logger.lifecycle("Wrote ${report}")
    }
}

