// -----------------------------------------------------------------------------
// B6k — Engine/catalog row-location bridge
// -----------------------------------------------------------------------------
// B6j froze the final HeapRowLocation compatibility seam. B6k moves direct
// engine/catalog casts of store-created row-location templates behind one
// engine-owned bridge. HeapRowLocation remains inherited-compatible for now;
// the point of this slice is to create the adaptation point needed before B6l.

def delosdbB6kBridgeFile = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/storetypes/EngineStoreRowLocationBridge.java')
def delosdbB6kEngineBridgeFiles = [
        delosdbB6kBridgeFile,
        file('delosdb-engine/src/main/java/org/apache/derby/impl/services/storetypes/EngineStoreTypeSupport.java'),
        file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/catalog/DataDictionaryImpl.java'),
        file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/catalog/TabInfoImpl.java'),
        file('delosdb-engine/src/main/java/org/apache/derby/impl/services/daemon/IndexStatisticsDaemonImpl.java')
]

def delosdbB6kEngineRowLocationCastHits = {
    def hits = []
    delosdbB6jEngineRowLocationConsumerRoots.findAll { it.exists() }.each { root ->
        root.eachFileRecurse { source ->
            if (source.isFile() && source.name.endsWith('.java')) {
                def code = delosdbB6cCodeOnly(delosdbB6cRead(source))
                if (code.contains('(RowLocation)')) {
                    hits << [source: source, count: code.count('(RowLocation)')]
                }
            }
        }
    }
    hits.sort { a, b -> a.source.path <=> b.source.path }
}

def delosdbB6kNonBridgeRowLocationCastHits = {
    delosdbB6kEngineRowLocationCastHits().findAll { it.source != delosdbB6kBridgeFile }
}

