def delosdbB5hRelPath = { File f -> rootDir.toPath().relativize(f.toPath()).toString() }

def delosdbB5hKernelTypeSources = { ->
    fileTree(delosdbB5hKernelTypeRoot) { include '**/*.java' }.files.findAll { it.isFile() }.sort { it.path }
}

def delosdbB5hForbiddenKernelTypeImports = { ->
    def forbidden = [
        'org.apache.derby.iapi.sql.',
        'org.apache.derby.impl.sql.',
        'org.apache.derby.iapi.sql.dictionary.',
        'org.apache.derby.iapi.types.',
        'org.apache.derby.catalog.',
        'java.sql.'
    ]
    def result = new TreeMap<String, List<String>>()
    delosdbB5hKernelTypeSources().each { source ->
        def matches = source.readLines().findAll { line ->
            def trimmed = line.trim()
            trimmed.startsWith('import ') && forbidden.any { prefix -> trimmed.contains(prefix) }
        }.collect { it.trim() }.sort()
        if (!matches.isEmpty()) {
            result[delosdbB5hRelPath(source)] = matches
        }
    }
    result
}

