            throw new GradleException('B5b expected Java sources in kernel-owned loader package: ' + delosdbB5bRelPath(kernelDir))
        }
        def staleEngineDir = new File(delosdbB5bEngineSourceRoot, packagePath)
        if (staleEngineDir.exists()) {
            throw new GradleException('B5b stale engine loader package remains after cleanup: ' + delosdbB5bRelPath(staleEngineDir))
        }

        def classFactory = delosdbB5bRead(file('delosdb-engine-kernel/src/main/java/org/apache/derby/iapi/services/loader/ClassFactory.java'))
        if (classFactory.contains('org.apache.derby.iapi.util.ByteArray') || classFactory.contains('ByteArray classDump')) {
            throw new GradleException('B5b ClassFactory must not expose iapi.util.ByteArray from the kernel boundary')
        }
        if (!classFactory.contains('loadGeneratedClass(String fullyQualifiedName, Object classDump)')) {
            throw new GradleException('B5b ClassFactory must expose Object classDump at the kernel boundary')
        }

        def databaseClasses = delosdbB5bRead(file('delosdb-engine/src/main/java/org/apache/derby/impl/services/reflect/DatabaseClasses.java'))
