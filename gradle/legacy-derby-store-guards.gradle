tasks.register('verifyLegacyDerbyKernelB5lLocatedRowBridge') {
    group = 'verification'
    description = 'B5l: verifies the LocatedRow bridge slice and import-count decrease.'
    dependsOn 'legacyDerbyStoreKernelB5lLocatedRowBridgeReport'
    doLast {
        [delosdbB5lStoreTypeSupport, delosdbB5lStoreTypeUtil, delosdbB5lStoreLocatedRow,
         delosdbB5lEngineProvider, delosdbB5lBackingStoreHashtable].each { source ->
            if (!source.isFile()) {
                throw new GradleException('B5l missing required source file: ' + delosdbB5lRelPath(source))
            }
        }

        def supportText = delosdbB5lRead(delosdbB5lStoreTypeSupport)
        def utilText = delosdbB5lRead(delosdbB5lStoreTypeUtil)
        def providerText = delosdbB5lRead(delosdbB5lEngineProvider)
        delosdbB5lRequiredBridgeMethods.each { method ->
            if (!supportText.contains(method)) {
                throw new GradleException('B5l StoreTypeSupport missing bridge method: ' + method)
            }
            if (!utilText.contains(method)) {
                throw new GradleException('B5l StoreTypeUtil missing bridge method: ' + method)
            }
            if (!providerText.contains(method)) {
                throw new GradleException('B5l EngineStoreTypeSupport missing bridge method: ' + method)
            }
        }

        def backingText = delosdbB5lRead(delosdbB5lBackingStoreHashtable)
        if (backingText.contains('import org.apache.derby.iapi.types.LocatedRow;')) {
            throw new GradleException('B5l BackingStoreHashtable must not import engine-owned LocatedRow directly')
        }
        if (!backingText.contains('import org.apache.derby.iapi.store.types.StoreLocatedRow;') ||
                !backingText.contains('import org.apache.derby.iapi.store.types.StoreTypeUtil;')) {
            throw new GradleException('B5l BackingStoreHashtable must use StoreLocatedRow and StoreTypeUtil')
        }
        if (!backingText.contains('StoreTypeUtil.newLocatedRow') ||
                !backingText.contains('StoreTypeUtil.flattenLocatedRow') ||
                !backingText.contains('StoreTypeUtil.locatedRowColumnValues') ||
                !backingText.contains('StoreTypeUtil.locatedRowLocation')) {
            throw new GradleException('B5l BackingStoreHashtable must route LocatedRow operations through StoreTypeUtil')
        }

        def forbiddenKernelImports = delosdbB5lForbiddenKernelImports()
        if (!forbiddenKernelImports.isEmpty()) {
            throw new GradleException('B5l kernel store type bridge must stay SQL/type/catalog neutral: ' + forbiddenKernelImports.join('; '))
        }

        def remainingStoreTypeImports = delosdbB5lStoreTypeImportLines()
        if (remainingStoreTypeImports.size() >= delosdbB5lBaselineImportCount) {
            throw new GradleException('B5l relocated-store iapi.types import count did not decrease from baseline ' + delosdbB5lBaselineImportCount + ': ' + remainingStoreTypeImports.size())
        }

        def reportText = delosdbB5lRead(delosdbB5lReportFile.get().asFile)
        if (!reportText.contains('B6 readiness') || !reportText.contains('NOT YET')) {
            throw new GradleException('B5l report must preserve the historical B5/B6 transition marker')
        }
        logger.lifecycle('Verified B5l LocatedRow bridge; relocated-store iapi.types imports now ' + remainingStoreTypeImports.size() + '; Phase B successor closeout is handled by B6/B7/B8 proofs')
    }
}

