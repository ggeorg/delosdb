        def kernelDir = new File(delosdbB5bKernelSourceRoot, packagePath)
        if (!kernelDir.isDirectory()) {
            throw new GradleException('B5b expected kernel-owned loader package: ' + delosdbB5bRelPath(kernelDir))
        }
