        if (fileTree(kernelUtilDir) { include '*.java' }.files.size() < 10) {
            throw new GradleException('B5d expected full iapi.util source package in kernel: ' + delosdbB5dRelPath(kernelUtilDir))
        }

        def staleEngineUtilDir = new File(delosdbB5dEngineSourceRoot, utilPackagePath)
        if (staleEngineUtilDir.exists()) {
            throw new GradleException('B5d stale engine util package remains after cleanup: ' + delosdbB5dRelPath(staleEngineUtilDir))
        }

        def interruptStatus = file('delosdb-engine-kernel/src/main/java/org/apache/derby/iapi/util/InterruptStatus.java')
        if (!interruptStatus.isFile()) {
            throw new GradleException('B5d expected kernel-owned InterruptStatus: ' + delosdbB5dRelPath(interruptStatus))
        }
        if (delosdbB5dRead(interruptStatus).contains('org.apache.derby.iapi.sql.conn.LanguageConnectionContext')) {
            throw new GradleException('B5d InterruptStatus must not import LanguageConnectionContext from the SQL layer')
        }
        if (!delosdbB5dRead(interruptStatus).contains('InterruptStatusKernelSupport')) {
            throw new GradleException('B5d InterruptStatus must use the kernel support seam')
        }

        def support = file('delosdb-engine-kernel/src/main/java/org/apache/derby/iapi/util/InterruptStatusKernelSupport.java')
        if (!support.isFile()) {
            throw new GradleException('B5d expected InterruptStatusKernelSupport in the kernel util package')
        }

        def engineSupport = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/conn/EngineInterruptStatusKernelSupport.java')
        if (!engineSupport.isFile()) {
            throw new GradleException('B5d expected engine-side InterruptStatusKernelSupport implementation')
        }
        if (!delosdbB5dRead(engineSupport).contains('LanguageConnectionContext')) {
            throw new GradleException('B5d engine support must remain the only side that touches LanguageConnectionContext')
        }

        def serviceDescriptor = file('delosdb-engine/src/main/resources/META-INF/services/org.apache.derby.iapi.util.InterruptStatusKernelSupport')
        if (!serviceDescriptor.isFile()) {
            throw new GradleException('B5d expected classpath service descriptor for InterruptStatusKernelSupport')
        }
        if (!serviceDescriptor.text.contains('org.apache.derby.impl.sql.conn.EngineInterruptStatusKernelSupport')) {
            throw new GradleException('B5d InterruptStatusKernelSupport descriptor must name the engine provider')
        }

        def kernelModuleInfo = delosdbB5dRead(file('delosdb-engine-kernel/src/main/java/module-info.java'))
        if (!kernelModuleInfo.contains('exports org.apache.derby.iapi.util;')) {
            throw new GradleException('B5d kernel module-info must export org.apache.derby.iapi.util')
        }
        if (!kernelModuleInfo.contains('uses org.apache.derby.iapi.util.InterruptStatusKernelSupport')) {
            throw new GradleException('B5d kernel module-info must use InterruptStatusKernelSupport')
        }

        def engineModuleInfo = delosdbB5dRead(file('delosdb-engine/src/main/java/module-info.java'))
        if (engineModuleInfo.contains('    exports org.apache.derby.iapi.util;')) {
            throw new GradleException('B5d engine module-info still exports moved util package')
        }
        if (!engineModuleInfo.contains('provides org.apache.derby.iapi.util.InterruptStatusKernelSupport')) {
            throw new GradleException('B5d engine module-info must provide InterruptStatusKernelSupport')
        }

        def reportFile = delosdbB5dReportFile.get().asFile
        if (!reportFile.isFile() || !reportFile.text.contains('B6 readiness') || !reportFile.text.contains('NOT YET')) {
            throw new GradleException('B5d report must preserve the historical B5/B6 transition marker')
        }
        logger.lifecycle('Verified B5d util split into delosdb-engine-kernel')
    }
}

