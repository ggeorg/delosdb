                throw new GradleException('B6j expected HeapRowLocation to keep inherited RowLocation/RefDataValue compatibility until engine consumers are bridged')
            }
        }
        def engineConsumers = delosdbB6jEngineRowLocationConsumerHits()
        if (engineConsumers.isEmpty()) {
            throw new GradleException('B6j expected engine/catalog RowLocation consumers to be visible before removing HeapRowLocation compatibility')
        }
        logger.lifecycle("Verified B6j HeapRowLocation compatibility seam; remaining inherited type references stay isolated at ${fqRefs.size()} / ${delosdbB6jBaselineQualifiedTypeCodeRefs}")
    }
}

