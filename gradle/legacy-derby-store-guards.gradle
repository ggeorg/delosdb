tasks.register('verifyLegacyDerbyStoreInventory') {
    group = 'verification'
    description = 'Verifies the inherited Derby store package inventory is present before modularization.'
    doLast {
        def apiFiles = delosdbDs1StoreApiFiles()
        def implFiles = delosdbDs1StoreImplFiles()
        if (apiFiles.isEmpty()) {
            throw new GradleException('Legacy Derby store API inventory is empty: org.apache.derby.iapi.store.*')
        }
        if (implFiles.isEmpty()) {
            throw new GradleException('Legacy Derby store implementation inventory is empty: org.apache.derby.impl.store.*')
        }
        logger.lifecycle("Legacy Derby store inventory: ${apiFiles.size()} iapi.store files, ${implFiles.size()} impl.store files")
    }
}

tasks.register('verifyNoSplitStorePackages') {
    group = 'verification'
    description = 'Verifies inherited Derby store packages are not split across runtime main-source modules.'
    doLast {
        def ownersByPackage = [:].withDefault { [] as Set<String> }
        def buildToolsSourceRoot = file('delosdb-buildtools/src/main/java').canonicalPath
        delosdbDs1MainSourceRoots().findAll { sourceRoot -> sourceRoot.canonicalPath != buildToolsSourceRoot }.each { sourceRoot ->
            def owner = rootDir.toPath().relativize(sourceRoot.toPath()).toString().replace(File.separatorChar, '/' as char)
            fileTree(sourceRoot) { include '**/*.java' }.files.each { source ->
                def packageName = delosdbDs1PackageName(source)
                if (packageName != null
                        && (packageName == 'org.apache.derby.iapi.store'
                        || packageName.startsWith('org.apache.derby.iapi.store.')
                        || packageName == 'org.apache.derby.impl.store'
                        || packageName.startsWith('org.apache.derby.impl.store.'))) {
                    ownersByPackage[packageName] << owner
                }
            }
        }
        def splitPackages = ownersByPackage.findAll { packageName, owners -> owners.size() > 1 }
        if (!splitPackages.isEmpty()) {
            def detail = splitPackages.collect { packageName, owners ->
                "${packageName} -> ${owners.toList().sort().join(', ')}"
            }.sort().join('\n')
            throw new GradleException("Inherited Derby store packages are split across runtime source modules:\n${detail}")
        }
    }
}

tasks.register('legacyStoreDependencyReport') {
    group = 'verification'
    description = 'Writes a DS1 inventory report for inherited Derby store modularization surgery.'
    outputs.file(layout.buildDirectory.file('reports/delosdb/legacy-store-dependencies.txt'))
    doLast {
        def reportFile = layout.buildDirectory.file('reports/delosdb/legacy-store-dependencies.txt').get().asFile
        reportFile.parentFile.mkdirs()

        def apiFiles = delosdbDs1StoreApiFiles()
        def implFiles = delosdbDs1StoreImplFiles()
        def storeFiles = []
        storeFiles.addAll(apiFiles)
        storeFiles.addAll(implFiles)

        def allMainJava = delosdbDs1AllMainJavaFiles()
        def engineJava = delosdbDs1JavaFiles('delosdb-engine/src/main/java')
        def nonStoreEngineJava = engineJava.findAll { source ->
            !delosdbDs1IsInheritedStoreSource(source)
        }
        def nonStoreEngineImports = delosdbDs1ImportMatches(
                nonStoreEngineJava,
                ['org.apache.derby.iapi.store.', 'org.apache.derby.impl.store.'])

        def upwardLeakImports = delosdbDs1ImportMatches(
                storeFiles,
                ['org.apache.derby.iapi.sql.dictionary.',
                 'org.apache.derby.iapi.sql.conn.',
                 'org.apache.derby.impl.sql.execute.',
                 'io.github.ggeorg.delosdb.storage.mvcc.'])

        def providerImplStoreImports = delosdbDs1ImportMatches(
                delosdbDs1JavaFiles('delosdb-spi/src/main/java')
                        + delosdbDs1JavaFiles('delosdb-storage-mvcc/src/main/java')
                        + delosdbDs1JavaFiles('delosdb-engine/src/main/java/io/github'),
                ['org.apache.derby.impl.store.raw.', 'org.apache.derby.impl.store.access.'])

        def moduleInfoLines = []
        fileTree(rootDir) {
            include '**/src/main/java/module-info.java'
            include '**/module-info.java'
            exclude '**/build/**'
            exclude '**/.gradle/**'
        }.files.unique { it.canonicalPath }.sort { it.path }.each { moduleInfo ->
            int lineNumber = 0
            moduleInfo.eachLine { line ->
                lineNumber++
                if (line.contains('org.apache.derby.iapi.store') || line.contains('org.apache.derby.impl.store')) {
                    moduleInfoLines << "${delosdbDs1RelPath(moduleInfo)}:${lineNumber}: ${line.trim()}"
                }
            }
        }

        def bootLines = []
        fileTree(rootDir) {
            include '**/modules.properties'
            exclude '**/build/**'
            exclude '**/.gradle/**'
        }.files.sort { it.path }.each { propertiesFile ->
            int lineNumber = 0
            propertiesFile.eachLine { line ->
                lineNumber++
                if (line.contains('org.apache.derby.iapi.store') || line.contains('org.apache.derby.impl.store')) {
                    bootLines << "${delosdbDs1RelPath(propertiesFile)}:${lineNumber}: ${line.trim()}"
                }
            }
        }

        reportFile.text = """DelosDB DS1 legacy Derby store dependency report
=================================================

Store package inventory
-----------------------
org.apache.derby.iapi.store.* files: ${apiFiles.size()}
org.apache.derby.impl.store.* files: ${implFiles.size()}

Engine files importing inherited Derby store
--------------------------------------------
Count: ${nonStoreEngineImports.collect { it.file }.unique().size()} files, ${nonStoreEngineImports.size()} imports
${nonStoreEngineImports.collect { "${it.file}:${it.line}: import ${it.importedType};" }.join('\n') ?: '(none)'}

Upward dependency leaks from inherited Derby store
-------------------------------------------------
These are the known Phase 1 surgery targets, not DS1 failures.
${upwardLeakImports.collect { "${it.file}:${it.line}: import ${it.importedType};" }.join('\n') ?: '(none)'}

Provider/SPI imports of Derby raw/access implementation internals
-----------------------------------------------------------------
${providerImplStoreImports.collect { "${it.file}:${it.line}: import ${it.importedType};" }.join('\n') ?: '(none)'}

module-info entries involving inherited Derby store packages
-----------------------------------------------------------
${moduleInfoLines.join('\n') ?: '(none)'}

modules.properties entries involving inherited Derby store packages
------------------------------------------------------------------
${bootLines.join('\n') ?: '(none)'}
"""
        logger.lifecycle("Wrote ${delosdbDs1RelPath(reportFile)}")
    }
}

