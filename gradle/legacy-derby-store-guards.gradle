// -----------------------------------------------------------------------------
// B9 — Phase B consolidation and static-analysis closeout
// -----------------------------------------------------------------------------
// B9 is intentionally non-runtime work. It cleans stale proof language from the
// B5/B6 transition era and adds a single Phase-B closeout/static-analysis gate
// before Phase C opens the common operational storage facade.

def delosdbB9BuildText() {
    [
            file('build.gradle'),
            file('gradle/legacy-derby-store-guards.gradle')
    ].findAll { it.isFile() }.collect { it.getText('UTF-8') }.join('\n')
}

def delosdbB9StaleB6ReadinessPhrase() {
    'B6 readiness' + ' is NOT YET'
}

def delosdbB9RelPath(File f) {
    rootDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
}

def delosdbB9TaskRegistrations() {
    def matcher = delosdbB9BuildText() =~ /tasks\.register\('([^']+)'\)/
    matcher.collect { it[1] }
}

def delosdbB9DuplicateTaskRegistrations() {
    delosdbB9TaskRegistrations().countBy { it }.findAll { name, count -> count > 1 }
}

def delosdbB9TopLevelDefinitions() {
    def matcher = delosdbB9BuildText() =~ /(?m)^def\s+([A-Za-z_][A-Za-z0-9_]*)\s*(?:=|\()/
    matcher.collect { it[1] }
}

def delosdbB9DuplicateTopLevelDefinitions() {
    delosdbB9TopLevelDefinitions().countBy { it }.findAll { name, count -> count > 1 }
}

def delosdbB9DuplicateStoreSourceOwnership() {
    def sourceRoots = [
            file('delosdb-engine/src/main/java'),
            file('delosdb-engine-kernel/src/main/java'),
            file('delosdb-storage-derby/src/main/java')
    ]
    def byRelativePath = [:].withDefault { [] }
    sourceRoots.findAll { it.isDirectory() }.each { root ->
        fileTree(root) {
            include '**/*.java'
        }.files.each { sourceFile ->
            def relativePath = root.toPath().relativize(sourceFile.toPath()).toString().replace('\\', '/')
            if (relativePath.startsWith('org/apache/derby/iapi/store/') ||
                    relativePath.startsWith('org/apache/derby/impl/store/')) {
                byRelativePath[relativePath] << delosdbB9RelPath(sourceFile)
            }
        }
    }
    byRelativePath.findAll { relativePath, owners -> owners.size() > 1 }
}

def delosdbB9StaleWorkspaceArtifacts() {
    def stale = []
    def ignoredPrefixes = [
            './.git/', './.gradle/', './.idea/', './build/', './out/'
    ]
    fileTree('.') {
        include '**/.DS_Store'
        include '**/__MACOSX/**'
        include '**/*.orig'
        include '**/*.rej'
        include '**/*~'
        include 'derby.log'
    }.files.each { candidate ->
        def rel = './' + delosdbB9RelPath(candidate)
        if (!ignoredPrefixes.any { rel.startsWith(it) } && !rel.contains('/build/')) {
            stale << rel.substring(2)
        }
    }
    stale.sort()
}

tasks.register('legacyDerbyStoreB9StaticAnalysisReport') {
    group = 'Verification'
    description = 'B9: writes the Phase B static-analysis and cleanup report.'
    outputs.file(layout.buildDirectory.file('reports/delosdb/legacy-store-b9-static-analysis.txt'))
    doLast {
        def staleB6ReadinessPhraseCount = delosdbB9BuildText().count(delosdbB9StaleB6ReadinessPhrase())
        def duplicateTasks = delosdbB9DuplicateTaskRegistrations()
        def duplicateDefinitions = delosdbB9DuplicateTopLevelDefinitions()
        def duplicateStoreSources = delosdbB9DuplicateStoreSourceOwnership()
        def staleArtifacts = delosdbB9StaleWorkspaceArtifacts()
        def report = layout.buildDirectory.file('reports/delosdb/legacy-store-b9-static-analysis.txt').get().asFile
        report.parentFile.mkdirs()
        report.text = """DelosDB B9 Phase B static-analysis report
==========================================

Scope
-----
B9 is a non-runtime consolidation pass. It checks the Gradle proof layer and
source ownership signals before Phase C starts.

Checks
------
stale exact B6 readiness phrase count: ${staleB6ReadinessPhraseCount}
duplicate Gradle task registrations: ${duplicateTasks.isEmpty() ? 'none' : duplicateTasks.collect { name, count -> name + ' x' + count }.join(', ')}
duplicate top-level Gradle definitions: ${duplicateDefinitions.isEmpty() ? 'none' : duplicateDefinitions.collect { name, count -> name + ' x' + count }.join(', ')}
duplicate legacy Derby store source ownership: ${duplicateStoreSources.isEmpty() ? 'none' : duplicateStoreSources.collect { relativePath, owners -> relativePath + ' -> ' + owners.join(', ') }.join('\n')}
stale workspace artifacts: ${staleArtifacts.isEmpty() ? 'none' : staleArtifacts.join(', ')}

Dead-code policy
----------------
No Java production code is deleted in B9. Inherited Derby code is removed only
behind a behavior proof. This pass instead proves that the Phase-B store sources
