        }
        def engineModuleInfo = delosdbB5bRead(file('delosdb-engine/src/main/java/module-info.java'))
        if (engineModuleInfo.contains('    exports org.apache.derby.iapi.services.loader;')) {
            throw new GradleException('B5b engine module-info still exports moved loader package')
        }

        def reportFile = delosdbB5bReportFile.get().asFile
        if (!reportFile.isFile() || !reportFile.text.contains('B6 readiness') || !reportFile.text.contains('NOT YET')) {
            throw new GradleException('B5b report must preserve the historical B5/B6 transition marker')
        }
        logger.lifecycle('Verified B5b loader service split into delosdb-engine-kernel')
    }
}

