        def importLines = imports.collect { imported, count -> String.format('  %-90s %5d', imported, count) }.join('\n')
        reportFile.text = """DelosDB B3b legacy Derby monitor extraction report
===================================================

Moved in B3b
------------
org.apache.derby.iapi.services.monitor

Why B3b needs a support seam
----------------------------
The inherited Monitor facade is store-facing boot infrastructure, but the
concrete boot implementation still lives in org.apache.derby.impl.services.monitor
inside delosdb-engine. Moving Monitor directly would create a kernel-to-engine
cycle through FileMonitor, SecurityUtil, PropertyUtil, and loader InstanceGetter.

B3b therefore moves the whole monitor API/facade package and adds a small
kernel-owned MonitorKernelSupport seam. The engine provides
EngineMonitorKernelSupport through ServiceLoader and keeps FileMonitor and the
boot implementation in delosdb-engine.

Still deferred after B3b
------------------------
org.apache.derby.iapi.services.property remains in delosdb-engine for B4.
org.apache.derby.iapi.services.loader remains in delosdb-engine; ModuleFactory
uses Object for classFromIdentifier at the kernel boundary so B3b does not force
loader movement.

Kernel monitor imports by exact class
-------------------------------------
${importLines ?: '  <none>'}

B3b rule applied
----------------
Move whole monitor package only. Do not move FileMonitor or monitor
implementation classes. Avoid a kernel-to-engine cycle through the
MonitorKernelSupport seam. Later B6 preparation may add small kernel-owned
facades under this package, such as StoreServiceProperties, as long as they do
not reintroduce engine implementation dependencies.
"""
        logger.lifecycle('Wrote ' + reportFile)
    }
}

tasks.register('verifyLegacyDerbyKernelMonitorExtraction') {
    group = 'verification'
    description = 'B3b: verifies org.apache.derby.iapi.services.monitor moved as a whole package into delosdb-engine-kernel.'
    dependsOn ':delosdb-engine-kernel:compileDelosDbEngineKernel', 'legacyDerbyStoreKernelB3bMonitorReport'
    doLast {
        def expectedFiles = [
                'DerbyObservable.java',
                'DerbyObserver.java',
                'ModuleControl.java',
                'ModuleFactory.java',
                'ModuleSupportable.java',
                'Monitor.java',
                'MonitorKernelSupport.java',
                'MonitorKernelSupportRegistry.java',
                'PersistentService.java'
        ]
        def laterKernelFacadeFiles = [
                'StoreServiceProperties.java'
        ]
        def missing = expectedFiles.findAll { name -> !new File(delosdbB3bKernelMonitorRoot, name).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException('B3b missing kernel-owned monitor source file(s): ' + missing.join(', '))
        }
        def kernelFiles = delosdbB3bJavaSourcesUnder(delosdbB3bKernelMonitorRoot)
        def allowedFiles = (expectedFiles + laterKernelFacadeFiles) as Set
        def unexpected = kernelFiles.collect { it.name }.findAll { name -> !allowedFiles.contains(name) }
        if (!unexpected.isEmpty()) {
            throw new GradleException('B3b found unexpected kernel-owned monitor source file(s): ' + unexpected.join(', '))
        }
        if (delosdbB3bEngineMonitorRoot.exists() && !delosdbB3bJavaSourcesUnder(delosdbB3bEngineMonitorRoot).isEmpty()) {
            throw new GradleException('B3b stale org.apache.derby.iapi.services.monitor source files remain under delosdb-engine. Run scripts/cleanup-legacy-derby-kernel-b3b.sh')
        }
        def forbiddenImports = [
                'org.apache.derby.impl.services.monitor.',
                'org.apache.derby.iapi.security.',
                'org.apache.derby.iapi.services.property.',
                'org.apache.derby.iapi.services.loader.'
        ]
        def offenders = []
        kernelFiles.each { source ->
            source.eachLine { line ->
                def trimmed = line.trim()
                if (trimmed.startsWith('import ')) {
                    forbiddenImports.each { forbidden ->
                        if (trimmed.contains(forbidden)) {
                            offenders << source.path + ': ' + trimmed
                        }
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('B3b kernel-owned monitor package must not import engine monitor/security/property/loader directly:\n' + offenders.join('\n'))
        }
        def kernelModuleText = delosdbB3bKernelModuleInfo.text
        if (!kernelModuleText.contains('exports org.apache.derby.iapi.services.monitor')) {
            throw new GradleException('B3b kernel module must export org.apache.derby.iapi.services.monitor')
        }
        if (!kernelModuleText.contains('uses org.apache.derby.iapi.services.monitor.MonitorKernelSupport;')) {
            throw new GradleException('B3b kernel module must use MonitorKernelSupport via ServiceLoader')
        }
        if (!kernelModuleText.contains('requires io.github.ggeorg.delosdb.spi;')) {
            throw new GradleException('B3b kernel module must read delosdb-spi for inherited @LegacyInternal annotations')
        }
        def engineModuleText = delosdbB3bEngineModuleInfo.text
        if (engineModuleText.contains('exports org.apache.derby.iapi.services.monitor')) {
            throw new GradleException('B3b engine module must no longer export org.apache.derby.iapi.services.monitor')
        }
        if (!engineModuleText.contains('provides org.apache.derby.iapi.services.monitor.MonitorKernelSupport')) {
            throw new GradleException('B3b engine module must provide EngineMonitorKernelSupport')
        }
        if (!new File(delosdbB3bEngineImplMonitorRoot, 'EngineMonitorKernelSupport.java').isFile()) {
            throw new GradleException('B3b missing engine-side EngineMonitorKernelSupport')
        }
        if (!new File(delosdbB3bEngineImplMonitorRoot, 'EngineContextKernelSupport.java').isFile()) {
            throw new GradleException('B3b missing repackaged engine-side EngineContextKernelSupport')
        }
        def engineServiceDescriptor = file('delosdb-engine/src/main/resources/META-INF/services/org.apache.derby.iapi.services.monitor.MonitorKernelSupport')
        if (!engineServiceDescriptor.isFile()) {
            throw new GradleException('B3b missing classpath ServiceLoader descriptor for MonitorKernelSupport')
        }
        if (!engineServiceDescriptor.text.contains('org.apache.derby.impl.services.monitor.EngineMonitorKernelSupport')) {
            throw new GradleException('B3b MonitorKernelSupport service descriptor must name EngineMonitorKernelSupport')
        }
        def registryText = new File(delosdbB3bKernelMonitorRoot, 'MonitorKernelSupportRegistry.java').text
        if (!registryText.contains('classPathFallbackSupport()')) {
            throw new GradleException('B3b MonitorKernelSupportRegistry must support classpath-era Derby boot')
        }
        def monitorText = new File(delosdbB3bKernelMonitorRoot, 'Monitor.java').text
        ['FileMonitor', 'SecurityUtil', 'PropertyUtil', 'InstanceGetter'].each { forbidden ->
            if (monitorText.contains(forbidden) && forbidden != 'FileMonitor') {
                throw new GradleException('B3b kernel Monitor must not directly reference ' + forbidden)
            }
        }
        if (monitorText.contains('new org.apache.derby.impl.services.monitor.FileMonitor')) {
            throw new GradleException('B3b kernel Monitor must create FileMonitor through MonitorKernelSupport')
        }
        logger.lifecycle('Verified B3b monitor service extraction into delosdb-engine-kernel')
    }
}

