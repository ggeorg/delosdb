        reportFile.parentFile.mkdirs()
        reportFile.text = """DelosDB B5af B6 preflight after type-import closeout
=====================================================

Purpose
-------
B5af is the transition gate after B5ae. B5ae closed the direct relocated-store
org.apache.derby.iapi.types import blocker. B5af records what is still true
before the B6 real-module compilation switch.

Direct relocated-store iapi.types imports
----------------------------------------
  count: ${directImports.size()}
${directImports ? directImports.collect { '  - ' + it }.join('\n') : '  none'}

Fully-qualified inherited type references in executable source
-------------------------------------------------------------
  count: ${qualifiedRefs.size()}

By type:
${qualifiedRefs ? delosdbB5afQualifiedTypeRefsByType(qualifiedRefs) : '  none'}

By file:
${qualifiedRefs ? delosdbB5afQualifiedTypeRefsByFile(qualifiedRefs) : '  none'}

Boundary ownership state
------------------------
  delosdb-storage-derby still excludes real store packages: ${storageExcludes ? 'YES' : 'NO'}
  delosdb-storage-derby compiles real store packages: ${storageCompilesRealStore ? 'YES' : 'NO'}
  delosdb-engine still references delosdb-storage-derby source roots: ${engineCompilesRelocatedStore ? 'YES' : 'NO'}

B6 interpretation
-----------------
DIRECT IMPORT BLOCKER: GONE.
REAL MODULE COMPILATION: ${storageCompilesRealStore ? 'SWITCHED BY B6g' : 'NOT YET'}.

The remaining fully-qualified references are no longer import leaks. Before B6g,
they were pre-switch compatibility seams. After B6g, :delosdb-storage-derby:classes
is the owner-side compile proof and may use the temporary compatibility classpath
until B6h removes direct engine-side source compilation.

Next expected step
------------------
B6 should stop delosdb-storage-derby from excluding org/apache/derby/iapi/store/**
and org/apache/derby/impl/store/**, then run:

  ./gradlew :delosdb-storage-derby:classes
  ./gradlew :delosdb-engine:compileDerbyEngine
  ./gradlew verifyLegacyDerbyStoreIndependentCompilation
  ./gradlew verifyLegacyDerbyStoreBoundary
"""
        logger.lifecycle('Wrote ' + delosdbB5afRelPath(reportFile))
    }
}

tasks.register('verifyLegacyDerbyKernelB5afB6Preflight') {
    group = 'verification'
    description = 'B5af: verifies B6 preflight after direct relocated-store type import closeout.'
    dependsOn 'legacyDerbyStoreKernelB5afB6PreflightReport'
    doLast {
        def directImports = delosdbB5afDirectTypeImports()
        if (!directImports.isEmpty()) {
            throw new GradleException('B5af expected zero direct relocated-store iapi.types imports, found ' + directImports.size() + ': ' + directImports.join('; '))
        }

        def storageExcludes = delosdbB5afStorageBuildExcludesRealStore()
        def storageCompilesRealStore = delosdbB5afStorageBuildCompilesRealStore()
        if (!storageExcludes && !storageCompilesRealStore) {
            throw new GradleException('B5af expected either the original pre-B6 excludes or the later B6g real-store compile switch')
        }

        def reportText = delosdbB5afRead(delosdbB5afReportFile.get().asFile)
        if (!reportText.contains('DIRECT IMPORT BLOCKER: GONE')) {
            throw new GradleException('B5af report must state that the direct import blocker is gone')
        }
        if (!reportText.contains('REAL MODULE COMPILATION: NOT YET') &&
                !reportText.contains('REAL MODULE COMPILATION: SWITCHED BY B6g')) {
            throw new GradleException('B5af report must state whether real module compilation is pre-switch or switched by B6g')
        }
        if (!reportText.contains(':delosdb-storage-derby:classes')) {
            throw new GradleException('B5af report must name the B6 independent compilation proof')
        }

        logger.lifecycle('Verified B5af B6 preflight/evolved B6g state; direct relocated-store iapi.types imports are zero')
    }
}

