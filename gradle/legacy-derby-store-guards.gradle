    dependsOn 'verifyLegacyDerbyStoreSourceRelocation'
    doLast {
        def storeSources = delosdbA0RelocatedStoreSources()
        def matches = delosdbA0ImportMatches(storeSources,
                ['org.apache.derby.impl.sql.execute.', 'io.github.ggeorg.delosdb.storage.mvcc.'],
                ['org.apache.derby.iapi.sql.dictionary.DataDictionary',
