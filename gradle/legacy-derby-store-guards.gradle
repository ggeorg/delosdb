// B5af — B6 preflight after direct relocated-store type import closeout.
def delosdbB5afReportFile = layout.buildDirectory.file('reports/delosdb/legacy-store-kernel-b5af-b6-preflight.txt')

def delosdbB5afRelPath = { File f -> rootDir.toPath().relativize(f.toPath()).toString().replace('\\\\', '/') }

def delosdbB5afRead = { File f -> f.exists() ? f.getText('UTF-8') : '' }

def delosdbB5afStoreRoots = {
    [
        file('delosdb-storage-derby/src/main/java/org/apache/derby/iapi/store'),
        file('delosdb-storage-derby/src/main/java/org/apache/derby/impl/store')
    ]
}

def delosdbB5afStoreJavaFiles = {
    delosdbB5afStoreRoots().collectMany { root ->
        root.exists() ? fileTree(root).matching { include '**/*.java' }.files : []
    }.sort { a, b -> a.path <=> b.path }
}

def delosdbB5afStripJavaComments = { String text ->
    text = text.replaceAll(/(?s)\/\*.*?\*\//, '')
    text = text.replaceAll(/(?m)\/\/.*$/, '')
    text
}

def delosdbB5afDirectTypeImports = {
    delosdbB5afStoreJavaFiles().collectMany { source ->
        source.readLines('UTF-8').withIndex().findAll { entry ->
            entry[0].trim().startsWith('import org.apache.derby.iapi.types.')
        }.collect { entry -> delosdbB5afRelPath(source) + ':' + (entry[1] + 1) + ': ' + entry[0].trim() }
    }
}

def delosdbB5afQualifiedTypeCodeRefs = {
    def pattern = ~/org\.apache\.derby\.iapi\.types\.[A-Za-z0-9_]+/
    delosdbB5afStoreJavaFiles().collectMany { source ->
        def stripped = delosdbB5afStripJavaComments(source.getText('UTF-8'))
        def refs = []
        stripped.readLines().eachWithIndex { line, index ->
            def matcher = pattern.matcher(line)
            while (matcher.find()) {
                refs << [file: delosdbB5afRelPath(source), line: index + 1, type: matcher.group(), text: line.trim()]
            }
        }
        refs
    }
}

def delosdbB5afQualifiedTypeRefsByFile = { refs ->
    refs.groupBy { it.file }.collect { fileName, fileRefs ->
        '  - ' + fileName + ': ' + fileRefs.size()
    }.sort().join('\n')
}

def delosdbB5afQualifiedTypeRefsByType = { refs ->
    refs.groupBy { it.type }.collect { typeName, typeRefs ->
        '  - ' + typeName + ': ' + typeRefs.size()
    }.sort().join('\n')
}

def delosdbB5afStorageBuildFile = file('delosdb-storage-derby/build.gradle')

def delosdbB5afStorageBuildExcludesRealStore = {
    def text = delosdbB5afRead(delosdbB5afStorageBuildFile)
    text.contains("exclude 'org/apache/derby/iapi/store/**/*.java'") ||
        text.contains("exclude 'org/apache/derby/impl/store/**/*.java'")
}

def delosdbB5afStorageBuildCompilesRealStore = {
    def text = delosdbB5afRead(delosdbB5afStorageBuildFile)
    text.contains("include 'org/apache/derby/iapi/store/**/*.java'") &&
        text.contains("include 'org/apache/derby/impl/store/**/*.java'") &&
        !text.contains("exclude 'org/apache/derby/iapi/store/**/*.java'") &&
        !text.contains("exclude 'org/apache/derby/impl/store/**/*.java'")
}

def delosdbB5afEngineBuildFile = file('delosdb-engine/build.gradle')

def delosdbB5afEngineStillCompilesRelocatedStore = {
    def text = delosdbB5afRead(delosdbB5afEngineBuildFile)
    text.contains("delosdb-storage-derby/src/main/java") ||
        text.contains('delosdb-storage-derby')
}

tasks.register('legacyDerbyStoreKernelB5afB6PreflightReport') {
