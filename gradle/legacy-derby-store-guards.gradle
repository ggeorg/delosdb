tasks.register('verifyLegacyDerbyKernelB5kRawTypeImportCleanup') {
    group = 'verification'
    description = 'B5k: verifies raw-store dead/avoidable iapi.types imports were removed and the count decreased.'
    dependsOn 'legacyDerbyStoreKernelB5kRawTypeImportCleanupReport'
    doLast {
        delosdbB5kFullyClearedFiles.each { source ->
            if (!source.isFile()) {
                throw new GradleException('B5k missing raw-store cleanup file: ' + delosdbB5kRelPath(source))
            }
        }
        if (!delosdbB5kBranchRow.isFile()) {
            throw new GradleException('B5k missing partially reduced file: ' + delosdbB5kRelPath(delosdbB5kBranchRow))
        }

        def fullyClearedRemainingImports = delosdbB5kFullyClearedRemainingImports()
        if (!fullyClearedRemainingImports.isEmpty()) {
            throw new GradleException('B5k fully cleared files still import iapi.types: ' + fullyClearedRemainingImports.join('; '))
        }

        def branchRowText = delosdbB5kRead(delosdbB5kBranchRow)
        if (branchRowText.contains('import org.apache.derby.iapi.types.DataValueFactory;')) {
            throw new GradleException('B5k BranchRow must not keep the unused DataValueFactory import')
        }
        // B5k originally left DataValueDescriptor and SQLLongint in BranchRow for
        // later slices. Later B5 slices may legitimately retire either import through
        // store-facing bridge operations. Keep this guard monotonic: B5k only owns
        // the removal of the stale DataValueFactory import.

        def dStoredPageText = delosdbB5kRead(delosdbB5kDStoredPage)
        if (dStoredPageText.contains('new DataValueDescriptor[0]')) {
            throw new GradleException('B5k D_StoredPage must not allocate DataValueDescriptor[] for zero-column raw fetch validation')
        }
        if (!dStoredPageText.contains('new Object[0]')) {
            throw new GradleException('B5k D_StoredPage must use Object[] for zero-column raw fetch validation')
        }

        def remainingStoreTypeImports = delosdbB5kStoreTypeImportLines()
        if (remainingStoreTypeImports.size() >= delosdbB5kBaselineImportCount) {
            throw new GradleException('B5k relocated-store iapi.types import count did not decrease from baseline ' + delosdbB5kBaselineImportCount + ': ' + remainingStoreTypeImports.size())
        }

        def reportText = delosdbB5kRead(delosdbB5kReportFile.get().asFile)
        if (!reportText.contains('B6 readiness') || !reportText.contains('NOT YET')) {
            throw new GradleException('B5k report must preserve the historical B5/B6 transition marker')
        }
        logger.lifecycle('Verified B5k raw-store type import cleanup; relocated-store iapi.types imports now ' + remainingStoreTypeImports.size() + '; Phase B successor closeout is handled by B6/B7/B8 proofs')
    }
}

