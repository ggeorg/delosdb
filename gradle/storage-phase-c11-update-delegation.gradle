import org.gradle.api.tasks.compile.JavaCompile

// Phase C11 SQL UPDATE operation delegation proof.
//
// This keeps VersionedStorageSqlBridge as the temporary regex router, but proves
// the UPDATE mutation itself no longer calls VersionedTable.update directly.
// UPDATE delegates through VersionedStorageExecutionBridge after C10 proved the
// direct planned update operation.

ext.delosdbStoragePhaseC11ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC11ReportFile =
        ext.delosdbStoragePhaseC11ReportDir.map { it.file('storage-phase-c11-update-delegation.txt') }
ext.delosdbStoragePhaseC11SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c11-update-delegation-smoke')

ext.delosdbStoragePhaseC11RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC11RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC11RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC11ForbiddenSourceHits = { Collection<File> sourceFiles, Collection<String> tokens ->
    sourceFiles.collectMany { sourceFile ->
        def text = sourceFile.text
        tokens.findAll { token -> text.contains(token) }.collect { token ->
            "${delosdbStoragePhaseC11RelPath(sourceFile)} contains forbidden token ${token}"
        }
    }.sort()
}

ext.delosdbStoragePhaseC11JavaFiles = { String projectPath ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [] as Set<File>
    }
    fileTree(sourceRoot).matching { include '**/*.java' }.files as Set<File>
}

ext.delosdbStoragePhaseC11ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC11RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC11Classpath = {
    files(
            delosdbStoragePhaseC11SmokeClassesDir,
            delosdbStoragePhaseC11ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC11ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC11ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC11RuntimeJars())
}

ext.delosdbStoragePhaseC11Proof = {
    def errors = []
    def lines = []

    def smokeSource = file('dev/storage-phase-c11-update-delegation-smoke/src/main/java/delosdb/smoke/StoragePhaseC11UpdateDelegationSmoke.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def executionBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/execution/VersionedStorageExecutionBridge.java')
    def embedStatement = file('delosdb-engine/src/main/java/org/apache/derby/impl/jdbc/EmbedStatement.java')
    def heapProvider = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/LegacyDerbyHeapStorageProvider.java')
    def mvccProvider = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccStorageProvider.java')
    def storelessRoot = file('delosdb-storeless/src/main/java')

    delosdbStoragePhaseC11RequireTokens(errors, smokeSource, [
            'SqlBridgePlan',
            'VersionedStorageSqlBridge.tryExecute(sql, this, true)',
            'CREATE TABLE ',
            'USING delos_mvcc',
            'CREATE INDEX C11_UPDATE_VALUE_IDX',
            'INSERT INTO ',
            'UPDATE ',
            'WHERE value =',
            'SELECT * FROM ',
            'requireUpdateCount',
            'requireSingleRow',
            'requireNoRows'
    ], 'Phase C11 SQL UPDATE delegation smoke')

    delosdbStoragePhaseC11RequireTokens(errors, sqlBridge, [
            'private static final Pattern UPDATE_WHERE_EQUALS',
            'return updateWhereEquals(',
            'PLANNED_TABLE_OPERATION_BRIDGE.update(table.table(), row.key(), List.copyOf(replacement), statementTx.context());',
            'PLANNED_TABLE_OPERATION_BRIDGE.insert(',
            'PLANNED_TABLE_OPERATION_BRIDGE.scanAll('
    ], 'VersionedStorageSqlBridge UPDATE operation delegation')

    if (sqlBridge.exists() && sqlBridge.text.contains('table.table().update(row.key(), List.copyOf(replacement), statementTx.context());')) {
        errors << 'VersionedStorageSqlBridge UPDATE branch must not call VersionedTable.update directly after C11'
    }

    delosdbStoragePhaseC11RequireTokens(errors, executionBridge, [
            'public <K, V> void update(',
            'requireTable(table).update(requireKey(key), requireValue(value), requireTransaction(transaction));',
            'public static VersionedStorageExecutionBridge resolvedTableOperations()'
    ], 'VersionedStorageExecutionBridge update operation')

    delosdbStoragePhaseC11RequireTokens(errors, embedStatement, [
            'VersionedStorageSqlBridge.tryExecute('
    ], 'current transitional EmbedStatement bridge hook')

    delosdbStoragePhaseC11RequireTokens(errors, heapProvider, [
            'implements StorageProvider',
            'StorageCapabilities'
    ], 'Derby heap provider remains metadata path')

    delosdbStoragePhaseC11RequireTokens(errors, mvccProvider, [
            'implements VersionedStorageProvider',
            'public VersionedTransactionCoordinator transactionCoordinator()',
            'public synchronized <K, V> VersionedTable<K, V> openTable('
    ], 'MVCC provider remains versioned operational path')

    if (!storelessRoot.exists()) {
        errors << 'missing storeless source root: delosdb-storeless/src/main/java'
    } else {
        def storelessProviderHits = fileTree(storelessRoot).matching { include '**/*.java' }.files.findAll { sourceFile ->
            def text = sourceFile.text
            text.contains('implements StorageProvider') || text.contains('implements VersionedStorageProvider')
        }.collect { delosdbStoragePhaseC11RelPath(it) }.sort()
        if (!storelessProviderHits.isEmpty()) {
            errors << 'storeless must remain a no-store negative proof, not a provider: ' + storelessProviderHits
        }
    }

    if (smokeSource.exists()) {
        errors.addAll(delosdbStoragePhaseC11ForbiddenSourceHits([smokeSource], [
                'DriverManager',
                'Connection',
                'Statement',
                'Pattern.compile',
                'Matcher'
        ]))
    }

    def engineStoreSourceRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
    if (engineStoreSourceRoot.exists()) {
        errors << 'Phase C11 must not add engine-side org/apache/derby/impl/store sources: '
                + delosdbStoragePhaseC11RelPath(engineStoreSourceRoot)
    }

    def thirdIslandNames = [
            'DelosStorageEngine.java',
            'DelosMutationAccess.java',
            'TableAccessProfile.java',
            'StorageExecutionProfile.java',
            'StorelessStorageProvider.java',
            'StorelessVersionedStorageProvider.java'
    ] as Set
    def thirdIslandFiles = fileTree(rootProject.projectDir).matching {
        include '**/*.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
        exclude '**/.idea/**'
        exclude '**/__MACOSX/**'
    }.files.findAll { thirdIslandNames.contains(it.name) }
            .collect { delosdbStoragePhaseC11RelPath(it) }.sort()
    if (!thirdIslandFiles.isEmpty()) {
        errors << 'Phase C11 must not introduce a third SPI/profile island while delegating UPDATE: '
                + thirdIslandFiles
    }

    def allEngineVersionedFiles = delosdbStoragePhaseC11JavaFiles('delosdb-engine').findAll { sourceFile ->
        delosdbStoragePhaseC11RelPath(sourceFile).contains('/versioned/')
    }
    def sqlRegexOwners = allEngineVersionedFiles.findAll { sourceFile ->
        sourceFile.name != 'VersionedStorageSqlBridge.java' && sourceFile.text.contains('Pattern.compile(')
    }.collect { delosdbStoragePhaseC11RelPath(it) }.sort()
    if (!sqlRegexOwners.isEmpty()) {
        errors << 'C11 UPDATE delegation must not add SQL regex owners outside VersionedStorageSqlBridge: '
                + sqlRegexOwners
    }

    lines << 'DelosDB Storage Phase C11 UPDATE Delegation Proof'
    lines << '================================================='
    lines << ''
    lines << 'C11 mechanic:'
    lines << '  keep the temporary SQL UPDATE regex router, but delegate the actual UPDATE mutation through VersionedStorageExecutionBridge.'
    lines << ''
    lines << 'Preserved behavior:'
    lines << '  SQL bridge still owns temporary regex statement routing.'
    lines << '  UPDATE update count and post-update SELECT visibility are preserved by the smoke.'
    lines << '  Derby heap execution remains untouched.'
    lines << ''
    lines << 'Boundary checked:'
    lines << '  old direct call removed: table.table().update(row.key(), List.copyOf(replacement), statementTx.context())'
    lines << '  new planned call used: PLANNED_TABLE_OPERATION_BRIDGE.update(table.table(), row.key(), List.copyOf(replacement), statementTx.context())'
    lines << ''
    lines << 'Not done in C11:'
    lines << '  UPDATE regex routing is intentionally not removed yet; that belongs to a later routing-retirement slice.'
    lines << ''
    lines << 'Proof smoke:'
    lines << '  dev/storage-phase-c11-update-delegation-smoke/src/main/java/delosdb/smoke/StoragePhaseC11UpdateDelegationSmoke.java'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC11UpdateDelegationReport') {
    group = 'verification'
    description = 'Writes the Phase C11 SQL UPDATE delegation report.'
    dependsOn 'verifyStoragePhaseC10UpdateProof'
    outputs.file(delosdbStoragePhaseC11ReportFile)
    doLast {
        def result = delosdbStoragePhaseC11Proof()
        def outputFile = delosdbStoragePhaseC11ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C11 UPDATE delegation failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC11UpdateDelegationSmoke', JavaCompile) {
    dependsOn 'jars', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C11 SQL UPDATE delegation smoke test.'
    source = files('dev/storage-phase-c11-update-delegation-smoke/src/main/java')
    destinationDirectory = delosdbStoragePhaseC11SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC11Classpath()
}

tasks.register('storagePhaseC11UpdateDelegationSmoke', JavaExec) {
    dependsOn 'compileStoragePhaseC11UpdateDelegationSmoke'
    group = 'verification'
    description = 'Runs the Phase C11 SQL UPDATE delegation smoke test.'
    classpath = delosdbStoragePhaseC11Classpath()
    mainClass = 'delosdb.smoke.StoragePhaseC11UpdateDelegationSmoke'
}

tasks.register('verifyStoragePhaseC11UpdateDelegation') {
    group = 'verification'
    description = 'Verifies the Phase C11 SQL UPDATE operation delegation.'
    dependsOn 'storagePhaseC11UpdateDelegationReport', 'storagePhaseC11UpdateDelegationSmoke'
    doLast {
        println 'Verified Phase C11 UPDATE delegation; next step should reassess before routing-retirement work'
    }
}
