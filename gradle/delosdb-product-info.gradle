import org.gradle.api.tasks.WriteProperties

def productInfo = project.extensions.extraProperties.get('delosdbProductInfo')
def outputRoot = layout.buildDirectory.dir('generated/resources/product-info')
def outputFile = outputRoot.map { it.file(productInfo.resourcePath.toString()) }
def buildRevision = rootProject.ext.buildNumberProvider.get().toString()
def delosDbVersion = rootProject.ext.delosDbVersion.toString()

def productInfoTask = tasks.register(productInfo.taskName.toString(), WriteProperties) {
    destinationFile.set(outputFile)
    comment = 'Generated by Gradle. Do not edit.'
    encoding = 'UTF-8'
    lineSeparator = '\n'
    properties([
            'derby.version.major'            : '10',
            'derby.version.minor'            : '17',
            'derby.version.maint'            : '1000000',
            'derby.version.drdamaint'         : '0',
            'derby.build.number'             : buildRevision,
            'derby.product.technology.name'  : productInfo.technologyName.toString(),
            'derby.product.external.name'    : 'DelosDB',
            'derby.product.external.version' : delosDbVersion,
            'delosdb.version'                : delosDbVersion,
            'derby.version.beta'             : 'false',
            'derby.product.vendor'           : 'DelosDB Project',
            'derby.product.file'             : productInfo.productFile.toString()
    ])
}

ext.delosdbProductInfoTask = productInfoTask
ext.delosdbProductInfoResourceDir = outputRoot
