// DelosDB runtime artifact model.
//
// This script is the single source of truth for jars that are assembled and
// jars that are placed on Derby-compatible runtime/test classpaths. Keep this
// separate from the inherited Derby build mechanics in root build.gradle so
// provider jars cannot drift between :jars, SQL integration tests, smoke tasks,
// distributions, and verification gates.

ext.delosdbRuntimeJarArtifacts = [
        [key: 'annotations', gradleProject: 'delosdb-annotations',   jarTask: 'jar',  jarName: 'delosdb-annotations.jar'],
        [key: 'spi',         gradleProject: 'delosdb-spi',           jarTask: 'jar',          jarName: 'delosdb-spi.jar'],
        [key: 'osgi',        gradleProject: 'delosdb-osgi-stub',     jarTask: 'jar',   jarName: 'osgi-framework-stub.jar'],
        [key: 'commons',     gradleProject: 'delosdb-commons',       jarTask: 'jar',         jarName: 'derbyshared.jar'],
        [key: 'runtimeApi',  gradleProject: 'delosdb-runtime-api',   jarTask: 'delosDbRuntimeApiJar',   jarName: 'delosdb-runtime-api.jar'],
        [key: 'engine',      gradleProject: 'delosdb-engine',        jarTask: 'derbyJar',               jarName: 'derby.jar'],
        [key: 'client',      gradleProject: 'delosdb-client',        jarTask: 'jar',         jarName: 'derbyclient.jar'],
        [key: 'tools',       gradleProject: 'delosdb-tools',         jarTask: 'jar',          jarName: 'derbytools.jar'],
        [key: 'server',      gradleProject: 'delosdb-server',        jarTask: 'jar',            jarName: 'derbynet.jar'],
        [key: 'optional',    gradleProject: 'delosdb-optionaltools', jarTask: 'jar',  jarName: 'derbyoptionaltools.jar'],
        [key: 'runner',      gradleProject: 'delosdb-runner',        jarTask: 'jar',            jarName: 'derbyrun.jar']
]

// These jars are assembled but are not placed directly on the current
// Derby-compatible runtime classpath. derby-store-api is patched into
// derby.jar. The production MVCC provider is also published independently,
// while its org.apache.derby implementation package is patched into derby.jar
// until the final distribution/module-path packaging step. No retained Phase 8
// implementation remains in the active source tree.
ext.delosdbAssembledSupportJarArtifacts = [
        [key: 'storeApi',    gradleProject: 'delosdb-derby-store-api', jarTask: 'jar', jarName: 'delosdb-derby-store-api.jar'],
        [key: 'mvcc',        gradleProject: 'delosdb-storage-mvcc',     jarTask: 'jar', jarName: 'delosdb-storage-mvcc.jar']
]

ext.delosdbAssembledJarArtifacts = ext.delosdbRuntimeJarArtifacts + ext.delosdbAssembledSupportJarArtifacts
ext.delosdbRuntimeJarNames = ext.delosdbRuntimeJarArtifacts.collect { it.jarName }
ext.delosdbAssembledJarTaskPaths = ext.delosdbAssembledJarArtifacts.collect { ":${it.gradleProject}:${it.jarTask}" }

ext.delosdbRuntimeJarFiles = {
    project.files(project.ext.delosdbRuntimeJarNames.collect { project.layout.buildDirectory.file("libs/${it}") })
}


ext.delosdbRuntimeJars = {
    // derby.jar contains the transitional ASM bytecode backend. Keep ASM on the
    // runtime classpath for jar-based smokes instead of relying on the old
    // optional/static module edge.
    project.files(project.ext.delosdbRuntimeJarFiles.call(), project.configurations.delosdbAsm)
}

ext.delosdbRuntimeBuildTasks = [
        ':delosdb-osgi-stub:classes',
        ':delosdb-commons:classes',
        ':delosdb-runtime-api:classes',
        ':delosdb-storage-mvcc:classes',
        ':delosdb-engine:classes',
        ':delosdb-client:classes',
        ':delosdb-tools:classes',
        ':delosdb-server:classes',
        ':delosdb-optionaltools:classes',
        ':delosdb-runner:classes',
        ':delosdb-engine:compileClassSizeCatalog'
]

tasks.register('compileAll') {
    dependsOn project.ext.delosdbRuntimeBuildTasks
}

tasks.register('jars') {
    dependsOn project.ext.delosdbAssembledJarTaskPaths
}

def delosdbRuntimeJarFileCollection = objects.fileCollection().from(ext.delosdbRuntimeJarFiles.call())
def delosdbAsmRuntimeFileCollection = objects.fileCollection().from(configurations.delosdbAsm)

tasks.register('verifyDelosRuntimeStorageProviders') {
    group = 'verification'
    description = 'Verifies the production MVCC provider artifact, derby.jar discovery, and retained-provider absence.'
    dependsOn 'jars'

    def accessMethodServiceResource =
            'META-INF/services/org.apache.derby.iapi.store.access.conglomerate.ExternalAccessMethodProvider'
    def accessMethodServiceType =
            'org.apache.derby.iapi.store.access.conglomerate.ExternalAccessMethodProvider'
    def expectedAccessMethodProvider =
            'org.apache.derby.impl.store.access.mvcc.DerbyMvccAccessMethodProvider'
    def diagnosticsServiceResource =
            'META-INF/services/org.apache.derby.iapi.store.types.DelosStorageDiagnostics'
    def expectedMvccDiagnosticsProvider =
            'org.apache.derby.impl.store.access.mvcc.MvccStorageDiagnostics'
    def expectedDerbyDiagnosticsProviders = [
            'org.apache.derby.impl.store.access.provider.DerbyHeapStorageDiagnostics',
            expectedMvccDiagnosticsProvider
    ]
    def retiredProviderServiceResource =
            'META-INF/services/org.apache.derby.iapi.store.types.DelosStorageProviderFactory'
    def engineJar = layout.buildDirectory.file('libs/derby.jar')
    def mvccJar = layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar')

    inputs.files(delosdbRuntimeJarFileCollection).withPropertyName('runtimeJars')
    inputs.file(mvccJar).withPropertyName('mvccProviderJar')
    inputs.files(delosdbAsmRuntimeFileCollection).withPropertyName('asmRuntime')

    doLast {
        def derbyJar = engineJar.get().asFile
        if (!derbyJar.isFile()) {
            throw new GradleException('Missing Derby runtime jar: ' + derbyJar)
        }
        def providerJar = mvccJar.get().asFile
        if (!providerJar.isFile()) {
            throw new GradleException('Missing MVCC provider jar: ' + providerJar)
        }
        new java.util.zip.ZipFile(providerJar).withCloseable { zip ->
            def entry = zip.getEntry(accessMethodServiceResource)
            if (entry == null) {
                throw new GradleException('Missing ' + accessMethodServiceResource + ' in ' + providerJar)
            }
            def lines = zip.getInputStream(entry).getText('UTF-8')
                    .readLines()
                    .collect { it.trim() }
                    .findAll { it && !it.startsWith('#') }
            if (lines != [expectedAccessMethodProvider]) {
                throw new GradleException(providerJar + ' must advertise exactly '
                        + expectedAccessMethodProvider + '; found ' + lines)
            }
            def diagnosticsEntry = zip.getEntry(diagnosticsServiceResource)
            if (diagnosticsEntry == null) {
                throw new GradleException('Missing ' + diagnosticsServiceResource + ' in ' + providerJar)
            }
            def diagnosticsLines = zip.getInputStream(diagnosticsEntry).getText('UTF-8')
                    .readLines().collect { it.trim() }.findAll { it && !it.startsWith('#') }
            if (diagnosticsLines != [expectedMvccDiagnosticsProvider]) {
                throw new GradleException(providerJar + ' must advertise exactly '
                        + expectedMvccDiagnosticsProvider + '; found ' + diagnosticsLines)
            }
            if (zip.getEntry(retiredProviderServiceResource) != null) {
                throw new GradleException('Retired provider service remains in ' + providerJar)
            }
            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                if (entries.nextElement().name.startsWith('io/github/ggeorg/delosdb/storage/mvcc/')) {
                    throw new GradleException('Retired io.github storage classes remain in production MVCC provider jar')
                }
            }
        }

        new java.util.zip.ZipFile(derbyJar).withCloseable { zip ->
            def entry = zip.getEntry(accessMethodServiceResource)
            if (entry == null) {
                throw new GradleException('Missing ' + accessMethodServiceResource + ' in ' + derbyJar)
            }
            def lines = zip.getInputStream(entry).getText('UTF-8')
                    .readLines()
                    .collect { it.trim() }
                    .findAll { it && !it.startsWith('#') }
            if (!lines.contains(expectedAccessMethodProvider)) {
                throw new GradleException(derbyJar + ' does not advertise '
                        + expectedAccessMethodProvider + '; found ' + lines)
            }
            def diagnosticsEntry = zip.getEntry(diagnosticsServiceResource)
            if (diagnosticsEntry == null) {
                throw new GradleException('Missing ' + diagnosticsServiceResource + ' in ' + derbyJar)
            }
            def diagnosticsLines = zip.getInputStream(diagnosticsEntry).getText('UTF-8')
                    .readLines().collect { it.trim() }.findAll { it && !it.startsWith('#') }
            if (diagnosticsLines != expectedDerbyDiagnosticsProviders) {
                throw new GradleException(derbyJar + ' must advertise heap and MVCC diagnostics; found '
                        + diagnosticsLines)
            }
        }

        def runtimeFiles = delosdbRuntimeJarFileCollection.files.toList()
        runtimeFiles.addAll(delosdbAsmRuntimeFileCollection.files)
        def missingRuntimeFiles = runtimeFiles.findAll { !it.isFile() }
        if (!missingRuntimeFiles.isEmpty()) {
            throw new GradleException('DelosDB runtime jar set has missing file(s): '
                    + missingRuntimeFiles)
        }
        if (runtimeFiles.any { it.name == 'delosdb-storage-io.jar' }) {
            throw new GradleException('Retired page-volume storage jar remains on the runtime classpath')
        }
        runtimeFiles.each { runtimeFile ->
            new java.util.zip.ZipFile(runtimeFile).withCloseable { zip ->
                if (zip.getEntry(retiredProviderServiceResource) != null) {
                    throw new GradleException('Retired external MVCC provider service remains in '
                            + runtimeFile + ': ' + retiredProviderServiceResource)
                }
            }
        }

        def loader = new java.net.URLClassLoader(
                runtimeFiles.collect { it.toURI().toURL() } as java.net.URL[],
                ClassLoader.getPlatformClassLoader())
        try {
            def serviceType = Class.forName(accessMethodServiceType, true, loader)
            def providers = []
            java.util.ServiceLoader.load(serviceType, loader).each { provider ->
                providers << provider.getClass().getName()
            }
            if (!providers.contains(expectedAccessMethodProvider)) {
                throw new GradleException('Runtime jar set does not load RawStore MVCC access method; found '
                        + providers)
            }
        } finally {
            loader.close()
        }
    }
}
