// DelosDB runtime artifact model.
//
// This script is the single source of truth for jars that are assembled and
// jars that are placed on Derby-compatible runtime/test classpaths. Keep this
// separate from the inherited Derby build mechanics in root build.gradle so
// provider jars cannot drift between :jars, SQL integration tests, smoke tasks,
// distributions, and verification gates.

ext.delosdbRuntimeJarArtifacts = [
        [key: 'annotations', gradleProject: 'delosdb-annotations',   jarTask: 'delosDbAnnotationsJar',  jarName: 'delosdb-annotations.jar'],
        [key: 'spi',         gradleProject: 'delosdb-spi',           jarTask: 'delosDbSpiJar',          jarName: 'delosdb-spi.jar'],
        [key: 'storageIo',   gradleProject: 'delosdb-storage-io',    jarTask: 'delosDbStorageIoJar',    jarName: 'delosdb-storage-io.jar'],
        [key: 'osgi',        gradleProject: 'delosdb-osgi-stub',     jarTask: 'osgiFrameworkStubJar',   jarName: 'osgi-framework-stub.jar'],
        [key: 'commons',     gradleProject: 'delosdb-commons',       jarTask: 'derbySharedJar',         jarName: 'derbyshared.jar'],
        [key: 'runtimeApi',  gradleProject: 'delosdb-runtime-api',   jarTask: 'delosDbRuntimeApiJar',   jarName: 'delosdb-runtime-api.jar'],
        [key: 'storageMvcc', gradleProject: 'delosdb-storage-mvcc',  jarTask: 'delosDbStorageMvccJar',  jarName: 'delosdb-storage-mvcc.jar'],
        [key: 'engine',      gradleProject: 'delosdb-engine',        jarTask: 'derbyJar',               jarName: 'derby.jar'],
        [key: 'client',      gradleProject: 'delosdb-client',        jarTask: 'derbyClientJar',         jarName: 'derbyclient.jar'],
        [key: 'tools',       gradleProject: 'delosdb-tools',         jarTask: 'derbyToolsJar',          jarName: 'derbytools.jar'],
        [key: 'server',      gradleProject: 'delosdb-server',        jarTask: 'derbyNetJar',            jarName: 'derbynet.jar'],
        [key: 'optional',    gradleProject: 'delosdb-optionaltools', jarTask: 'derbyOptionalToolsJar',  jarName: 'derbyoptionaltools.jar'],
        [key: 'runner',      gradleProject: 'delosdb-runner',        jarTask: 'derbyRunJar',            jarName: 'derbyrun.jar']
]

// These jars are assembled and published/checked, but are not placed directly
// on Derby-compatible runtime classpaths because their packages are patched or
// merged into derby.jar. Keeping them separate avoids split-package drift while
// still making root :jars build the complete artifact set.
ext.delosdbAssembledSupportJarArtifacts = [
        [key: 'storageApi', gradleProject: 'delosdb-storage-api',     jarTask: 'storageApiJar',   jarName: 'delosdb-storage-api.jar'],
        [key: 'storeApi',   gradleProject: 'delosdb-derby-store-api', jarTask: 'derbyStoreApiJar', jarName: 'delosdb-derby-store-api.jar']
]

ext.delosdbAssembledJarArtifacts = ext.delosdbRuntimeJarArtifacts + ext.delosdbAssembledSupportJarArtifacts
ext.delosdbRuntimeJarNames = ext.delosdbRuntimeJarArtifacts.collect { it.jarName }
ext.delosdbAssembledJarTaskPaths = ext.delosdbAssembledJarArtifacts.collect { ":${it.gradleProject}:${it.jarTask}" }

ext.delosdbRuntimeJarFiles = {
    project.files(project.ext.delosdbRuntimeJarNames.collect { project.layout.buildDirectory.file("libs/${it}") })
}

ext.delosdbRuntimeJars = {
    // derby.jar contains the permanent ASM bytecode backend. Keep ASM on the
    // runtime classpath for jar-based smokes instead of relying on the old
    // optional/static module edge.
    project.files(project.ext.delosdbRuntimeJarFiles.call(), project.configurations.delosdbAsm)
}

ext.delosdbExtensionRuntimeJars = {
    project.ext.delosdbRuntimeJars.call()
}

ext.delosdbRuntimeBuildTasks = [
        ':delosdb-storage-io:compileDelosDbStorageIo',
        ':delosdb-runtime-api:compileDelosDbRuntimeApi',
        ':delosdb-storage-api:compileStorageApi',
        ':delosdb-engine:compileClassSizeCatalog',
        'splitEngineMessages',
        'generateOdbcMetadata',
        'ensureCatalogMetadataResources'
]

tasks.register('compileAll') {
    dependsOn project.ext.delosdbRuntimeBuildTasks
}

tasks.register('jars') {
    dependsOn project.ext.delosdbAssembledJarTaskPaths
}

tasks.register('verifyDelosRuntimeStorageProviders') {
    group = 'verification'
    description = 'Verifies that storage-provider jars are modeled in the DelosDB runtime jar set and discoverable through ServiceLoader.'
    dependsOn 'jars'

    def serviceResource = 'META-INF/services/org.apache.derby.iapi.store.types.DelosStorageProviderFactory'
    def serviceTypeName = 'org.apache.derby.iapi.store.types.DelosStorageProviderFactory'
    def expectedProviderClass = 'io.github.ggeorg.delosdb.storage.mvcc.bridge.MvccInheritedStorageProviderFactory'
    def expectedProviderName = 'delos_mvcc'
    def mvccProviderJar = project.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar')

    inputs.files(project.ext.delosdbRuntimeJarFiles.call())
    inputs.files(project.configurations.delosdbAsm)

    doLast {
        def mvccJar = mvccProviderJar.get().asFile
        if (!mvccJar.isFile()) {
            throw new GradleException("Missing MVCC provider runtime jar: ${mvccJar}. The root :jars task must model :delosdb-storage-mvcc:delosDbStorageMvccJar.")
        }

        def serviceLines = []
        new java.util.zip.ZipFile(mvccJar).withCloseable { zip ->
            def entry = zip.getEntry(serviceResource)
            if (entry == null) {
                throw new GradleException("Missing ${serviceResource} in ${mvccJar}")
            }
            serviceLines = zip.getInputStream(entry).getText('UTF-8')
                    .readLines()
                    .collect { it.trim() }
                    .findAll { it && !it.startsWith('#') }
        }

        if (!serviceLines.contains(expectedProviderClass)) {
            throw new GradleException("${mvccJar} does not advertise ${expectedProviderClass} in ${serviceResource}; found ${serviceLines}")
        }

        def runtimeFiles = project.ext.delosdbRuntimeJarNames.collect { project.layout.buildDirectory.file("libs/${it}").get().asFile }
        runtimeFiles.addAll(project.configurations.delosdbAsm.files)
        def missingRuntimeFiles = runtimeFiles.findAll { !it.isFile() }
        if (!missingRuntimeFiles.isEmpty()) {
            throw new GradleException('DelosDB runtime jar set has missing file(s): ' + missingRuntimeFiles)
        }

        def loader = new java.net.URLClassLoader(
                runtimeFiles.collect { it.toURI().toURL() } as java.net.URL[],
                ClassLoader.getPlatformClassLoader())
        try {
            def serviceType = Class.forName(serviceTypeName, true, loader)
            def providerNames = []
            java.util.ServiceLoader.load(serviceType, loader).each { provider ->
                providerNames << provider.providerName()
            }
            if (!providerNames.contains(expectedProviderName)) {
                throw new GradleException("Runtime jar set does not load storage provider '${expectedProviderName}' through ServiceLoader; found ${providerNames}")
            }
        } finally {
            loader.close()
        }
    }
}
