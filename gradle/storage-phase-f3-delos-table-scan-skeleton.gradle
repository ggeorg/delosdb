import org.gradle.api.tasks.compile.JavaCompile

// Phase F3.2 DelosTableScanResultSet skeleton branch proof.
// This keeps the generated bytecode shape unchanged and proves the existing
// ResultSetFactory table-scan seam can return a Delos-owned NoPutResultSet for
// delos_mvcc tables.  The result set is an honest skeleton: it fails loudly at
// open time until F4 implements real MVCC scan materialization.

ext.delosdbStoragePhaseF32ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseF32ReportFile =
        ext.delosdbStoragePhaseF32ReportDir.map { it.file('storage-phase-f3-delos-table-scan-skeleton.txt') }
ext.delosdbStoragePhaseF32SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-f3-delos-table-scan-skeleton-smoke')

ext.delosdbStoragePhaseF32RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseF32RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF32RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseF32RejectTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseF32RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def present = tokens.findAll { token -> text.contains(token) }
    if (!present.isEmpty()) {
        errors << "${label} contains forbidden tokens: ${present.join(', ')}"
    }
}

ext.delosdbStoragePhaseF32ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseF32RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseF32Classpath = {
    files(
            delosdbStoragePhaseF32SmokeClassesDir,
            delosdbStoragePhaseF32ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseF32ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseF32ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseF32ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseF32RuntimeJars())
}

ext.delosdbStoragePhaseF32Proof = {
    def errors = []
    def lines = []

    def buildFile = file('build.gradle')
    def delosResultSet = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosTableScanResultSet.java')
    def lookup = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/DelosTableScanProviderLookup.java')
    def genericFactory = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/GenericResultSetFactory.java')
    def resultSetFactory = file('delosdb-engine/src/main/java/org/apache/derby/iapi/sql/execute/ResultSetFactory.java')
    def fromBaseTable = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/FromBaseTable.java')
    def f31Gradle = file('gradle/storage-phase-f3-factory-branch-proof.gradle')
    def f32Gradle = file('gradle/storage-phase-f3-delos-table-scan-skeleton.gradle')
    def smokeSource = file('dev/storage-phase-f3-delos-table-scan-skeleton-smoke/src/main/java/delosdb/smoke/StoragePhaseF3DelosTableScanSkeletonSmoke.java')
    def f32Doc = file('docs/storage-phase-f3-delos-table-scan-skeleton.md')
    def planDoc = file('docs/storage-phase-f-native-integration-plan.md')
    def roadmap = file('docs/ROADMAP.md')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')

    delosdbStoragePhaseF32RequireTokens(errors, buildFile, [
            "apply from: file('gradle/storage-phase-f3-factory-branch-proof.gradle')",
            "apply from: file('gradle/storage-phase-f3-delos-table-scan-skeleton.gradle')"
    ], 'root build F3.2 wiring')
    if (buildFile.exists()) {
        def text = buildFile.text
        def f31 = text.indexOf("apply from: file('gradle/storage-phase-f3-factory-branch-proof.gradle')")
        def f32 = text.indexOf("apply from: file('gradle/storage-phase-f3-delos-table-scan-skeleton.gradle')")
        if (f31 < 0 || f32 < 0 || f32 < f31) {
            errors << 'F3.2 apply must appear after F3.1 in build.gradle'
        }
    }

    delosdbStoragePhaseF32RequireTokens(errors, delosResultSet, [
            'final class DelosTableScanResultSet extends NoPutResultSetImpl',
            'SKELETON_BRANCH_PROPERTY',
            'SKELETON_REACHED_MESSAGE',
            'createIfEnabled(TableScanResultSetParameters params)',
            'DelosTableScanProviderLookup.find(params.activation, params.tableName)',
            'lookup.isEmpty() || lookup.get().isDefaultStorageProvider()',
            'return Optional.of(new DelosTableScanResultSet(params, lookup.get()))',
            'public void openCore() throws StandardException',
            'UnsupportedOperationException(SKELETON_REACHED_MESSAGE)',
            'F4 must implement real MVCC scan materialization'
    ], 'DelosTableScanResultSet skeleton')
    delosdbStoragePhaseF32RequireTokens(errors, lookup, [
            'FACTORY_SKELETON_BRANCH_PROPERTY',
            'FACTORY_SKELETON_REACHED_MESSAGE',
            'DelosTableScanResultSet.SKELETON_BRANCH_PROPERTY'
    ], 'Delos table-scan provider lookup F3.2 public proof gate')
    delosdbStoragePhaseF32RequireTokens(errors, genericFactory, [
            'NoPutResultSet delosTableScan = DelosTableScanResultSet.createIfEnabled(params).orElse(null);',
            'if (delosTableScan != null) { return delosTableScan; }',
            'return new TableScanResultSet(params);',
            'return new BulkTableScanResultSet(params, rowsPerRead, disableForHoldable);'
    ], 'GenericResultSetFactory Delos skeleton branch')
    delosdbStoragePhaseF32RejectTokens(errors, resultSetFactory, [
            'getDelosTableScanResultSet'
    ], 'ResultSetFactory interface must keep generated bytecode shape unchanged in F3.2')
    delosdbStoragePhaseF32RejectTokens(errors, fromBaseTable, [
            'getDelosTableScanResultSet'
    ], 'FromBaseTable must keep emitting the existing table-scan factory method in F3.2')
    delosdbStoragePhaseF32RequireTokens(errors, f31Gradle, [
            'F3.2 may add a DelosTableScanResultSet skeleton'
    ], 'F3.1 historical guard updated for F3.2')
    delosdbStoragePhaseF32RequireTokens(errors, f32Gradle, [
            'storagePhaseF3DelosTableScanSkeletonSmoke',
            'verifyStoragePhaseF3DelosTableScanSkeleton'
    ], 'F3.2 Gradle task definitions')
    delosdbStoragePhaseF32RequireTokens(errors, smokeSource, [
            'StoragePhaseF3DelosTableScanSkeletonSmoke',
            'System.setProperty(DelosTableScanProviderLookup.FACTORY_SKELETON_BRANCH_PROPERTY, "true")',
            'CREATE TABLE " + TABLE_NAME + " (id INT, value VARCHAR(32)) USING delos_mvcc',
            'SELECT id, value FROM " + TABLE_NAME + " WHERE id = ?',
            'DelosTableScanProviderLookup.FACTORY_SKELETON_REACHED_MESSAGE',
            'VersionedStorageSqlBridge.lastRouteClassifierForTesting().isEmpty()',
            'storage_phase_f3_delos_table_scan_skeleton: PASS'
    ], 'F3.2 skeleton branch smoke')
    delosdbStoragePhaseF32RequireTokens(errors, f32Doc, [
            'F3.2 — DelosTableScanResultSet skeleton',
            'property-gated',
            'GenericResultSetFactory',
            'no FromBaseTable.generate() change',
            'no AsmJava change',
            'F4 replaces this sentinel'
    ], 'F3.2 document')
    delosdbStoragePhaseF32RequireTokens(errors, planDoc, [
            'F3.2 landed',
            'DelosTableScanResultSet skeleton',
            'F4 — native MVCC SELECT equality'
    ], 'Phase F plan after F3.2')
    delosdbStoragePhaseF32RequireTokens(errors, roadmap, [
            'F3.2 landed',
            'F4 landed — native MVCC SELECT equality'
    ], 'ROADMAP after F3.2')
    delosdbStoragePhaseF32RequireTokens(errors, cleanupScript, [
            'storage-phase-f3-delos-table-scan-skeleton-db'
    ], 'F3.2 smoke DB cleanup entry')

    lines << 'DelosDB Storage Phase F3.2 DelosTableScanResultSet Skeleton Proof'
    lines << '=================================================================='
    lines << ''
    lines << 'Purpose:'
    lines << '  Prove the existing Derby ResultSetFactory table-scan seam can return a Delos-owned NoPutResultSet for delos_mvcc tables.'
    lines << ''
    lines << 'Verified implementation shape:'
    lines << '  Generated activation still calls the existing ResultSetFactory table-scan method shape.'
    lines << '  GenericResultSetFactory may return DelosTableScanResultSet only when the F3.2 proof property is enabled and the provider is non-default.'
    lines << '  The skeleton fails loudly at open time; F4 must implement real MVCC scan materialization.'
    lines << '  FromBaseTable.generate(), AsmJava, and ResultSetFactory interface shape remain unchanged.'
    lines << ''
    lines << 'Next step:'
    lines << '  F4 translates Qualifier[][] to DelosPredicate and materializes EngineMvccTableAccess.scan(...) rows into Derby ExecRow output.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseF3DelosTableScanSkeletonReport') {
    group = 'verification'
    description = 'Writes the Phase F3.2 DelosTableScanResultSet skeleton proof report.'
    dependsOn 'verifyStoragePhaseF3FactoryBranchProof'
    outputs.file(delosdbStoragePhaseF32ReportFile)
    doLast {
        def result = delosdbStoragePhaseF32Proof()
        def outputFile = delosdbStoragePhaseF32ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase F3.2 DelosTableScanResultSet skeleton proof failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseF3DelosTableScanSkeletonSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase F3.2 DelosTableScanResultSet skeleton smoke test.'
    source = files('dev/storage-phase-f3-delos-table-scan-skeleton-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseF32SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseF32Classpath()
}

tasks.register('storagePhaseF3DelosTableScanSkeletonSmoke', JavaExec) {
    dependsOn 'storagePhaseF3DelosTableScanSkeletonReport', 'compileStoragePhaseF3DelosTableScanSkeletonSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase F3.2 DelosTableScanResultSet skeleton smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseF3DelosTableScanSkeletonSmoke'
    classpath = delosdbStoragePhaseF32Classpath()
}

tasks.register('verifyStoragePhaseF3DelosTableScanSkeleton') {
    group = 'verification'
    description = 'Verifies Phase F3.2 DelosTableScanResultSet skeleton proof.'
    dependsOn 'storagePhaseF3DelosTableScanSkeletonReport', 'storagePhaseF3DelosTableScanSkeletonSmoke'
    doLast {
        println 'Verified Phase F3.2 DelosTableScanResultSet skeleton; next step is F4 native MVCC SELECT equality through DelosTableScanResultSet'
    }
}
