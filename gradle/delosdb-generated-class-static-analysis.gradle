// DelosDB generated-class architecture, contract, and dependency gate.
//
// One permanent gate owns the stable JavaFactory/ClassBuilder/MethodBuilder/
// LocalField contract, the sole ClassFileJava backend, and zero-external-ASM
// policy. Migration-only tasks and manifests are intentionally retired.

import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.HexFormat
import java.util.regex.Pattern

final File gcRoot = rootProject.projectDir
final File gcBuild = rootProject.layout.buildDirectory.get().asFile
final String gcExpectedDigest =
        '13871aded0743d1c5da22687d8e05a525bb115649397708d487c44261fc57cc6'

final Map<String, String> gcTypeNames = [
        'String': 'java.lang.String',
        'Object': 'java.lang.Object',
        'ClassFactory': 'org.apache.derby.iapi.services.loader.ClassFactory',
        'ClassBuilder': 'org.apache.derby.iapi.services.compiler.ClassBuilder',
        'MethodBuilder': 'org.apache.derby.iapi.services.compiler.MethodBuilder',
        'LocalField': 'org.apache.derby.iapi.services.compiler.LocalField',
        'GeneratedClass': 'org.apache.derby.iapi.services.loader.GeneratedClass',
        'ByteArray': 'org.apache.derby.iapi.util.ByteArray',
        'StandardException': 'org.apache.derby.shared.common.error.StandardException'
]

final Map<String, File> gcInterfaces = [
        'JavaFactory': new File(gcRoot,
                'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/compiler/JavaFactory.java'),
        'ClassBuilder': new File(gcRoot,
                'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/compiler/ClassBuilder.java'),
        'MethodBuilder': new File(gcRoot,
                'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/compiler/MethodBuilder.java'),
        'LocalField': new File(gcRoot,
                'delosdb-runtime-api/src/main/java/org/apache/derby/iapi/services/compiler/LocalField.java')
]

final Closure<String> gcRelative = { File file ->
    gcRoot.toPath().relativize(file.toPath()).toString().replace('\\', '/')
}

final Closure<String> gcLexicalCode = { String source, boolean retainLiterals ->
    def code = new StringBuilder(source.length())
    boolean blockComment = false
    boolean lineComment = false
    boolean singleQuoted = false
    boolean doubleQuoted = false
    boolean textBlock = false
    boolean escaped = false
    int offset = 0
    while (offset < source.length()) {
        char current = source.charAt(offset)
        char next = offset + 1 < source.length()
                ? source.charAt(offset + 1) : Character.MIN_VALUE
        boolean tripleQuote = offset + 2 < source.length()
                && current == ('"' as char)
                && next == ('"' as char)
                && source.charAt(offset + 2) == ('"' as char)

        if (lineComment) {
            if (current == ('\n' as char)) {
                lineComment = false
                code.append(current)
            } else {
                code.append(' ')
            }
            offset++
            continue
        }
        if (blockComment) {
            if (current == ('*' as char) && next == ('/' as char)) {
                code.append('  ')
                blockComment = false
                offset += 2
            } else {
                code.append(current == ('\n' as char) ? '\n' : ' ')
                offset++
            }
            continue
        }
        if (textBlock) {
            if (tripleQuote) {
                code.append(retainLiterals ? '"""' : '   ')
                textBlock = false
                offset += 3
            } else {
                code.append(retainLiterals || current == ('\n' as char)
                        ? current : (' ' as char))
                offset++
            }
            continue
        }
        if (singleQuoted || doubleQuoted) {
            code.append(retainLiterals || current == ('\n' as char)
                    ? current : (' ' as char))
            if (escaped) {
                escaped = false
            } else if (current == ('\\' as char)) {
                escaped = true
            } else if (singleQuoted && current == ('\'' as char)) {
                singleQuoted = false
            } else if (doubleQuoted && current == ('"' as char)) {
                doubleQuoted = false
            }
            offset++
            continue
        }
        if (tripleQuote) {
            code.append(retainLiterals ? '"""' : '   ')
            textBlock = true
            offset += 3
        } else if (current == ('\'' as char)) {
            code.append(retainLiterals ? current : (' ' as char))
            singleQuoted = true
            offset++
        } else if (current == ('"' as char)) {
            code.append(retainLiterals ? current : (' ' as char))
            doubleQuoted = true
            offset++
        } else if (current == ('/' as char) && next == ('/' as char)) {
            code.append('  ')
            lineComment = true
            offset += 2
        } else if (current == ('/' as char) && next == ('*' as char)) {
            code.append('  ')
            blockComment = true
            offset += 2
        } else {
            code.append(current)
            offset++
        }
    }
    code.toString()
}

final Closure<String> gcCodeWithoutComments = { String source ->
    gcLexicalCode(source, true)
}

final Closure<String> gcStructureWithoutCommentsOrLiterals = { String source ->
    gcLexicalCode(source, false)
}
final Closure<String> gcCanonicalType = { String raw ->
    String type = raw.trim().replaceAll('\\s+', ' ')
    int dimensions = 0
    while (type.endsWith('[]')) {
        dimensions++
        type = type.substring(0, type.length() - 2)
    }
    gcTypeNames.getOrDefault(type, type) + ('[]' * dimensions)
}

final Closure<List<Map<String, Object>>> gcParseMethods = { File file ->
    String source = gcCodeWithoutComments(file.getText('UTF-8'))
    Pattern declaration = Pattern.compile([
            '(?m)^\\s*(?:public\\s+)?',
            '([A-Za-z0-9_<>?,.\\[\\] ]+)\\s+',
            '([A-Za-z0-9_]+)\\s*',
            '\\(([^;{}]*)\\)\\s*',
            '(?:throws\\s+([^;{}]+))?\\s*;'
    ].join(''))
    def matcher = declaration.matcher(source)
    List<Map<String, Object>> methods = []
    while (matcher.find()) {
        List<String> parameterTypes = []
        String arguments = matcher.group(3)
        if (arguments != null && !arguments.trim().isEmpty()) {
            arguments.split(',').each { String argument ->
                List<String> tokens = argument.trim()
                        .replaceAll('\\s+', ' ').split(' ') as List<String>
                String sourceType = tokens.size() > 1
                        ? tokens[0..-2].join(' ') : tokens[0]
                parameterTypes.add(gcCanonicalType(sourceType))
            }
        }
        List<String> exceptions = []
        String declaredThrows = matcher.group(4)
        if (declaredThrows != null && !declaredThrows.trim().isEmpty()) {
            declaredThrows.split(',').each { String exception ->
                exceptions.add(gcCanonicalType(exception))
            }
            exceptions.sort()
        }
        String signature = gcCanonicalType(matcher.group(1)) + ' ' +
                matcher.group(2) + '(' + parameterTypes.join(',') + ')'
        if (!exceptions.isEmpty()) {
            signature += ' throws ' + exceptions.join(',')
        }
        methods.add([name: matcher.group(2), signature: signature,
                     exceptions: exceptions])
    }
    methods.sort { left, right ->
        left.signature.toString() <=> right.signature.toString()
    }
}

final Closure<Map<String, List<Map<String, Object>>>> gcSnapshot = {
    Map<String, List<Map<String, Object>>> snapshot = [:]
    gcInterfaces.each { String owner, File file ->
        snapshot[owner] = file.isFile() ? gcParseMethods(file) : []
    }
    snapshot
}

final Closure<String> gcCanonicalContract = {
        Map<String, List<Map<String, Object>>> snapshot ->
    List<String> lines = []
    snapshot.each { String owner, List<Map<String, Object>> methods ->
        methods.each { Map<String, Object> method ->
            lines.add(owner + ':' + method.signature)
        }
    }
    lines.sort()
    lines.join('\n') + '\n'
}

final Closure<String> gcSha256 = { String value ->
    HexFormat.of().formatHex(MessageDigest.getInstance('SHA-256')
            .digest(value.getBytes(StandardCharsets.UTF_8)))
}

final Closure<List<List<String>>> gcRows = {
        String relative, int fields ->
    File file = new File(gcRoot, relative)
    if (!file.isFile()) {
        return []
    }
    file.readLines('UTF-8')
            .findAll { String line ->
                !line.trim().isEmpty() && !line.startsWith('#')
            }
            .collect { String line ->
                def parts = line.split('\\|', -1)
                if (parts.length != fields) {
                    throw new GradleException(
                            'Invalid generated-class manifest row: ' + line)
                }
                parts as List<String>
            }
}

final Closure<List<File>> gcJavaFiles = {
    List<File> files = []
    rootProject.subprojects.each { project ->
        File main = new File(project.projectDir, 'src/main/java')
        File test = new File(project.projectDir, 'src/test/java')
        [main, test].findAll { it.isDirectory() }.each { dir ->
            files.addAll(rootProject.fileTree(dir) { include '**/*.java' }.files)
        }
    }
    files.sort { left, right -> gcRelative(left) <=> gcRelative(right) }
}

final Closure<List<File>> gcBuildFiles = {
    List<File> files = [
            new File(gcRoot, 'build.gradle'),
            new File(gcRoot, 'gradle/delosdb-runtime-artifacts.gradle'),
            new File(gcRoot, 'benchmarks/jmh/build.gradle')
    ]
    rootProject.subprojects.each { project ->
        [new File(project.projectDir, 'build.gradle'),
         new File(project.projectDir, 'src/main/java/module-info.java')].each { file ->
            if (file.isFile()) { files.add(file) }
        }
    }
    files.findAll { it.isFile() }.unique().sort { left, right ->
        gcRelative(left) <=> gcRelative(right)
    }
}

tasks.register('delosGeneratedClassInventory') {
    group = 'verification'
    description = 'Reports the stable generated-class contract and architecture.'

    File reportFile = new File(gcBuild,
            'reports/delosdb/compiler/generated-class-inventory.txt')
    outputs.file(reportFile)
    outputs.upToDateWhen { false }

    doLast {
        Map<String, List<Map<String, Object>>> snapshot = gcSnapshot()
        List<List<String>> operations = gcRows(
                'gradle/static-analysis/delosdb-methodbuilder-operation-inventory.txt', 5)
        List<List<String>> behavior = gcRows(
                'gradle/static-analysis/delosdb-methodbuilder-behavior-fixtures.txt', 5)
        int totalMethods = snapshot.values().sum { List<?> methods ->
            methods.size()
        } as int
        int exceptionMethods = snapshot.values().sum {
                List<Map<String, Object>> methods ->
            methods.count { Map<String, Object> method ->
                !((List<?>) method.exceptions).isEmpty()
            }
        } as int
        String digest = gcSha256(gcCanonicalContract(snapshot))

        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB generated-class inventory')
            writer.println('=================================')
            writer.println('Architecture: JDK25_CLASSFILE')
            writer.println('Production authority: SOLE_BACKEND')
            writer.println('Generation boundary: JavaFactory/ClassBuilder/MethodBuilder/LocalField')
            writer.println('Normal runtime backend selector: none')
            snapshot.each { String owner, List<Map<String, Object>> methods ->
                writer.println(owner + ' methods: ' + methods.size())
            }
            writer.println('Total declared methods: ' + totalMethods)
            writer.println('Methods declaring checked exceptions: ' + exceptionMethods)
            writer.println('MethodBuilder signatures: ' + operations.size())
            writer.println('MethodBuilder operation names: ' +
                    operations.collect { it[3] }.toSet().size())
            writer.println('Behavior fixture rows: ' + behavior.size())
            writer.println('Behavior fixture groups: ' +
                    behavior.collect { it[2] }.toSet().size())
            writer.println('Contract SHA-256: ' + digest)
        }
        logger.lifecycle('Generated-class inventory written: {}', reportFile)
    }
}

tasks.register('delosGeneratedClassStaticAnalysis') {
    group = 'verification'
    description = 'Validates the stable generated-class contract, sole backend, import boundary, and zero-external-ASM policy.'
    dependsOn tasks.named('delosGeneratedClassInventory')

    doLast {
        List<String> failures = []
        Map<String, List<Map<String, Object>>> snapshot = gcSnapshot()
        Map<String, Integer> expectedCounts = [
                'JavaFactory': 1, 'ClassBuilder': 8,
                'MethodBuilder': 43, 'LocalField': 0
        ]
        expectedCounts.each { String owner, Integer expected ->
            int actual = snapshot.getOrDefault(owner, []).size()
            if (actual != expected) {
                failures.add(owner + ' method count changed: expected '
                        + expected + ', found ' + actual)
            }
        }
        int totalMethods = snapshot.values().sum { List<?> methods ->
            methods.size()
        } as int
        if (totalMethods != 52) {
            failures.add('Generated-class contract must contain 52 methods; found '
                    + totalMethods)
        }
        int exceptionMethods = snapshot.values().sum {
                List<Map<String, Object>> methods ->
            methods.count { Map<String, Object> method ->
                !((List<?>) method.exceptions).isEmpty()
            }
        } as int
        if (exceptionMethods != 2) {
            failures.add('Generated-class contract must retain two checked-exception methods; found '
                    + exceptionMethods)
        }
        String digest = gcSha256(gcCanonicalContract(snapshot))
        if (digest != gcExpectedDigest) {
            failures.add('Generated-class contract digest changed: expected '
                    + gcExpectedDigest + ', found ' + digest)
        }

        List<List<String>> operations = gcRows(
                'gradle/static-analysis/delosdb-methodbuilder-operation-inventory.txt', 5)
        List<List<String>> behavior = gcRows(
                'gradle/static-analysis/delosdb-methodbuilder-behavior-fixtures.txt', 5)
        if (operations.size() != 43) {
            failures.add('MethodBuilder operation inventory must contain 43 rows; found '
                    + operations.size())
        }
        if (operations.collect { it[0] }.toSet().size() != operations.size()) {
            failures.add('MethodBuilder operation inventory contains duplicate ids')
        }
        if (operations.collect { it[3] }.toSet().size() != 32) {
            failures.add('MethodBuilder operation inventory must contain 32 operation names')
        }
        if (behavior.size() != 43) {
            failures.add('MethodBuilder behavior manifest must contain 43 rows; found '
                    + behavior.size())
        }
        if (behavior.collect { it[0] }.toSet().size() != behavior.size()) {
            failures.add('MethodBuilder behavior manifest contains duplicate ids')
        }
        Set<String> operationSignatures = operations.collect { it[2] }.toSet()
        Set<String> behaviorSignatures = behavior.collect { it[1] }.toSet()
        if (operationSignatures != behaviorSignatures) {
            failures.add('MethodBuilder operation and behavior signatures differ')
        }
        Set<String> expectedFixtures = [
                'method-lifecycle', 'parameter-constants', 'field-access',
                'object-and-array', 'receiver-and-conversion',
                'stack-and-statement', 'control-flow', 'invocation',
                'constructor', 'statement-splitting'
        ] as Set
        if (behavior.collect { it[2] }.toSet() != expectedFixtures) {
            failures.add('MethodBuilder behavior fixture groups changed')
        }



        File modules = new File(gcRoot,
                'delosdb-engine/src/main/java/org/apache/derby/modules.properties')
        List<String> registrations = modules.readLines('UTF-8').findAll { String line ->
            line.startsWith('derby.module.javaCompiler=')
        }
        if (registrations != [
                'derby.module.javaCompiler=org.apache.derby.impl.services.bytecode.classfile.ClassFileJava']) {
            failures.add('Exactly one ClassFileJava registration is required; found '
                    + registrations)
        }

        List<String> forbiddenSourceTokens = [
                'org.objectweb.asm', 'jdk.internal.org.objectweb.asm',
                'impl.services.bytecode.asm', 'AsmJava'
        ]
        gcJavaFiles().each { File file ->
            String code = gcCodeWithoutComments(file.getText('UTF-8'))
            String structure = gcStructureWithoutCommentsOrLiterals(
                    file.getText('UTF-8'))
            forbiddenSourceTokens.each { String token ->
                if (structure.contains(token)) {
                    failures.add('Forbidden bytecode source reference in '
                            + gcRelative(file) + ': ' + token)
                }
            }
            if (gcRelative(file).contains('/impl/sql/compile/')
                    && structure.contains('java.lang.classfile')) {
                failures.add('SQL compiler node imports java.lang.classfile directly: '
                        + gcRelative(file))
            }
            ['GeneratedClassBackend', 'GeneratedClassPlan',
             'GeneratedClassBytes'].each { String token ->
                if (structure.contains(token)) {
                    failures.add('Forbidden duplicate generation abstraction in '
                            + gcRelative(file) + ': ' + token)
                }
            }
            if (code.contains('delosdb.compiler.backend')) {
                failures.add('Forbidden generated-class runtime selector in '
                        + gcRelative(file) + ': delosdb.compiler.backend')
            }
        }
        List<String> forbiddenBuildTokens = [
                'org.ow2.asm', 'org.objectweb.asm', 'asmVersion',
                'delosdbAsm', 'jdk.internal.org.objectweb.asm'
        ]
        gcBuildFiles().each { File file ->
            String text = gcCodeWithoutComments(file.getText('UTF-8'))
            forbiddenBuildTokens.each { String token ->
                if (text.contains(token)) {
                    failures.add('Forbidden bytecode build/module reference in '
                            + gcRelative(file) + ': ' + token)
                }
            }
        }

        Set<String> directClassFileApiUsers = gcJavaFiles().findAll { File file ->
            gcRelative(file).contains('/src/main/java/')
                    && gcStructureWithoutCommentsOrLiterals(
                            file.getText('UTF-8')).contains('java.lang.classfile')
        }.collect { File file -> gcRelative(file) }.toSet()
        Set<String> authorizedClassFileApiUsers = [
                'delosdb-engine/src/main/java/org/apache/derby/impl/services/bytecode/classfile/ClassFileJava.java',
                'delosdb-buildtools/src/main/java/org/apache/derbyBuild/DelosJdk25ClassFileVerifier.java'
        ] as Set
        if (directClassFileApiUsers != authorizedClassFileApiUsers) {
            failures.add('Direct java.lang.classfile users changed: expected '
                    + authorizedClassFileApiUsers + ', found '
                    + directClassFileApiUsers)
        }

        Pattern javaFactoryImplementation = Pattern.compile(
                /(?s)\bimplements\b[^{}]*\bJavaFactory\b/)

        Set<String> javaFactoryImplementations = gcJavaFiles().findAll { File file ->
            gcRelative(file).contains('/src/main/java/')
                    && javaFactoryImplementation.matcher(
                            gcStructureWithoutCommentsOrLiterals(
                                    file.getText('UTF-8'))).find()
        }.collect { File file -> gcRelative(file) }.toSet()
        Set<String> expectedJavaFactoryImplementations = [
                'delosdb-engine/src/main/java/org/apache/derby/impl/services/bytecode/classfile/ClassFileJava.java'
        ] as Set
        if (javaFactoryImplementations != expectedJavaFactoryImplementations) {
            failures.add('JavaFactory implementations changed: expected '
                    + expectedJavaFactoryImplementations + ', found '
                    + javaFactoryImplementations)
        }

        List<String> retiredPaths = [
                'gradle/delosdb-compiler-modernization-static-analysis.gradle',
                'gradle/delosdb-generated-class-contract-static-analysis.gradle',
                'gradle/static-analysis/delosdb-generated-class-modernization.txt',
                'gradle/static-analysis/delosdb-classfile-asm-removal.txt',
                'delosdb-tests/src/test/java/org/apache/derbyTesting/functionTests/tests/delos/GeneratedClassClassFileProductionTest.java',
                'scripts/cleanup-phase10-compiler-phase6-external-asm-removal.sh'
        ]
        retiredPaths.each { String relative ->
            if (new File(gcRoot, relative).exists()) {
                failures.add('Retired compiler migration artifact remains: ' + relative)
            }
        }

        File reportFile = new File(gcBuild,
                'reports/delosdb/compiler/generated-class-static-analysis.txt')
        reportFile.parentFile.mkdirs()
        reportFile.withPrintWriter('UTF-8') { writer ->
            writer.println('DelosDB generated-class static analysis')
            writer.println('========================================')
            writer.println('Architecture: JDK25_CLASSFILE')
            writer.println('Production authority: SOLE_BACKEND')
            writer.println('Contract methods: ' + totalMethods)
            writer.println('Checked-exception methods: ' + exceptionMethods)
            writer.println('Contract SHA-256: ' + digest)
            writer.println('MethodBuilder signatures: ' + operations.size())
            writer.println('MethodBuilder operation names: ' +
                    operations.collect { it[3] }.toSet().size())
            writer.println('Behavior fixture groups: ' +
                    behavior.collect { it[2] }.toSet().size())
            writer.println('External bytecode dependency: none')
            writer.println('Normal runtime backend selector: none')
            writer.println(failures.isEmpty() ? 'Status: PASS' : 'Status: FAIL')
            failures.each { String failure -> writer.println('- ' + failure) }
        }
        if (!failures.isEmpty()) {
            logger.error('Generated-class static-analysis failures ({}):',
                    failures.size())
            failures.each { String failure -> logger.error('  - {}', failure) }
            throw new GradleException(
                    'Generated-class static analysis failed. Report: ' + reportFile)
        }
        logger.lifecycle('Generated-class static analysis passed. Report: {}',
                reportFile)
    }
}
