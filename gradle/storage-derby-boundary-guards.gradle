// Compact permanent storage-Derby Phase-B boundary guards.
//
// This file intentionally replaces the long historical B5/B6/B7/B8 proof
// archive. Keep only the invariants that must remain true after Phase B:
//   - delosdb-storage-derby owns the relocated Derby store source tree.
//   - delosdb-engine does not own/compile relocated store source files.
//   - derby.jar still packages the store runtime classes for compatibility.
//   - runtimeJars() does not require delosdb-storage-derby.jar.

import java.util.zip.ZipFile

ext.delosdbStorageDerbyBoundaryReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStorageDerbyBoundaryReportFile =
        ext.delosdbStorageDerbyBoundaryReportDir.map { it.file('storage-derby-boundary.txt') }
ext.delosdbStorageDerbyStaticAnalysisReportFile =
        ext.delosdbStorageDerbyBoundaryReportDir.map { it.file('storage-derby-static-analysis.txt') }

ext.delosdbStorageDerbyRelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStorageDerbyStoreSources = { String projectPath ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [] as Set
    }
    fileTree(sourceRoot).matching {
        include 'org/apache/derby/iapi/store/**/*.java'
        include 'org/apache/derby/impl/store/**/*.java'
    }.files
}

ext.delosdbStorageDerbyStoreSourceCounts = { String projectPath ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [iapi: 0, impl: 0]
    }
    [
            iapi: fileTree(sourceRoot).matching { include 'org/apache/derby/iapi/store/**/*.java' }.files.size(),
            impl: fileTree(sourceRoot).matching { include 'org/apache/derby/impl/store/**/*.java' }.files.size()
    ]
}

ext.delosdbStorageDerbyRuntimeJarNames = {
    if (!rootProject.ext.has('delosdbRuntimeJarNames')) {
        throw new GradleException('Missing root ext.delosdbRuntimeJarNames; apply storage Derby boundary guards after runtime jar helpers are defined')
    }
    rootProject.ext.delosdbRuntimeJarNames
}

ext.delosdbStorageDerbyRuntimeJars = {
    if (!rootProject.ext.has('delosdbRuntimeJars')) {
        throw new GradleException('Missing root ext.delosdbRuntimeJars; apply storage Derby boundary guards after runtime jar helpers are defined')
    }
    rootProject.ext.delosdbRuntimeJars.call()
}

ext.delosdbStorageDerbyDerbyJarFile = {
    layout.buildDirectory.file('libs/derby.jar').get().asFile
}

ext.delosdbStorageDerbyRequiredRuntimeEntries = [
        'org/apache/derby/iapi/store/access/TransactionController.class',
        'org/apache/derby/iapi/store/raw/ContainerHandle.class',
        'org/apache/derby/impl/store/access/heap/HeapController.class',
        'org/apache/derby/impl/store/access/heap/HeapRowLocation.class',
        'org/apache/derby/impl/store/access/btree/BTreeController.class'
]

ext.delosdbStorageDerbyCheckBoundary = {
    def errors = []
    def lines = []

    def storageCounts = delosdbStorageDerbyStoreSourceCounts('delosdb-storage-derby')
    def engineCounts = delosdbStorageDerbyStoreSourceCounts('delosdb-engine')
    def engineStoreSources = delosdbStorageDerbyStoreSources('delosdb-engine') as Set<File>

    lines << 'Storage-Derby Phase-B boundary report'
    lines << '======================================'
    lines << "storage-derby iapi.store source files : ${storageCounts.iapi}"
    lines << "storage-derby impl.store source files : ${storageCounts.impl}"
    lines << "engine iapi.store source files        : ${engineCounts.iapi}"
    lines << "engine impl.store source files        : ${engineCounts.impl}"

    if (storageCounts.iapi == 0 || storageCounts.impl == 0) {
        errors << 'delosdb-storage-derby no longer owns a real relocated Derby store source tree'
    }
    if (!engineStoreSources.isEmpty()) {
        errors << 'delosdb-engine owns relocated Derby store source files: ' +
                engineStoreSources.collect { delosdbStorageDerbyRelPath(it) }.sort().take(10).join(', ')
    }

    def storageCompileTask = tasks.findByPath(':delosdb-storage-derby:compileLegacyDerbyStorage')
    lines << "storage compile task                  : ${storageCompileTask == null ? 'MISSING' : 'present'}"
    if (storageCompileTask == null) {
        errors << 'missing :delosdb-storage-derby:compileLegacyDerbyStorage task'
    }

    def runtimeNames = delosdbStorageDerbyRuntimeJarNames()
    lines << "runtime jar names                     : ${runtimeNames.join(', ')}"
    if (runtimeNames.contains('delosdb-storage-derby.jar')) {
        errors << 'runtimeJars() names still include delosdb-storage-derby.jar'
    }

    def runtimeFiles = delosdbStorageDerbyRuntimeJars().files.collect { it.name }.sort()
    lines << "runtime jar files                     : ${runtimeFiles.join(', ')}"
    if (runtimeFiles.contains('delosdb-storage-derby.jar')) {
        errors << 'runtimeJars() files include delosdb-storage-derby.jar'
    }

    def derbyJar = delosdbStorageDerbyDerbyJarFile()
    lines << "derby.jar                             : ${delosdbStorageDerbyRelPath(derbyJar)}"
    if (!derbyJar.exists()) {
        errors << "derby.jar does not exist at ${derbyJar}; run :delosdb-engine:derbyJar"
    } else {
        def entries = new ZipFile(derbyJar).withCloseable { zip ->
            zip.entries().collect { it.name } as Set
        }
        def missingEntries = delosdbStorageDerbyRequiredRuntimeEntries.findAll { !entries.contains(it) }
        lines << "required store runtime entries        : ${missingEntries.isEmpty() ? 'present' : 'missing ' + missingEntries.join(', ')}"
        if (!missingEntries.isEmpty()) {
            errors << 'derby.jar is missing required relocated store runtime entries: ' + missingEntries.join(', ')
        }
    }

    lines << ''
    lines << "result                                : ${errors.isEmpty() ? 'PASS' : 'FAIL'}"
    if (!errors.isEmpty()) {
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "- ${it}" }
    }

    [lines: lines, errors: errors]
}

ext.delosdbStorageDerbyCheckStaticAnalysis = {
    def errors = []
    def lines = []
    def guardFiles = [
            file('build.gradle'),
            file('gradle/storage-derby-boundary-guards.gradle')
    ].findAll { it.exists() }
    def staleGuard = file('gradle/legacy-derby-store-guards.gradle')

    lines << 'Storage-Derby compact guard static-analysis report'
    lines << '=================================================='
    lines << "guard files                           : ${guardFiles.collect { delosdbStorageDerbyRelPath(it) }.join(', ')}"

    if (staleGuard.exists()) {
        def staleLines = staleGuard.readLines().size()
        lines << "stale extracted guard file            : present (${staleLines} lines)"
        if (staleLines > 80) {
            errors << 'gradle/legacy-derby-store-guards.gradle is still the large historical guard archive; run scripts/delete-stale-b10-legacy-guard-file.sh or overwrite it with the compact stub'
        }
    } else {
        lines << 'stale extracted guard file            : absent'
    }

    def registrationCounts = [:].withDefault { 0 }
    guardFiles.each { guardFile ->
        def matcher = guardFile.text =~ /tasks\.register\('([^']+)'/
        matcher.each { match -> registrationCounts[match[1]] = registrationCounts[match[1]] + 1 }
    }
    def duplicateRegistrations = registrationCounts.findAll { it.value > 1 }.keySet().sort()
    lines << "duplicate task registrations          : ${duplicateRegistrations.isEmpty() ? 'none' : duplicateRegistrations.join(', ')}"
    if (!duplicateRegistrations.isEmpty()) {
        errors << 'duplicate Gradle task registrations remain: ' + duplicateRegistrations.join(', ')
    }

    def buildText = file('build.gradle').text
    def appliesOldGuard = buildText.contains("gradle/legacy-derby-store-guards.gradle")
    lines << "root applies historical guard file    : ${appliesOldGuard ? 'YES' : 'NO'}"
    if (appliesOldGuard) {
        errors << 'root build.gradle still applies gradle/legacy-derby-store-guards.gradle'
    }

    def storageCounts = delosdbStorageDerbyStoreSourceCounts('delosdb-storage-derby')
    def engineCounts = delosdbStorageDerbyStoreSourceCounts('delosdb-engine')
    lines << "storage source counts                 : iapi=${storageCounts.iapi}, impl=${storageCounts.impl}"
    lines << "engine store source counts            : iapi=${engineCounts.iapi}, impl=${engineCounts.impl}"
    if (storageCounts.iapi == 0 || storageCounts.impl == 0) {
        errors << 'storage source ownership is missing'
    }
    if (engineCounts.iapi != 0 || engineCounts.impl != 0) {
        errors << 'engine still owns relocated store source files'
    }

    lines << ''
    lines << "result                                : ${errors.isEmpty() ? 'PASS' : 'FAIL'}"
    if (!errors.isEmpty()) {
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "- ${it}" }
    }

    [lines: lines, errors: errors]
}

tasks.register('storageDerbyBoundaryReport') {
    group = 'verification'
    description = 'Writes the compact storage-Derby Phase-B boundary report.'
    dependsOn ':delosdb-engine:derbyJar'
    outputs.file(delosdbStorageDerbyBoundaryReportFile)
    doLast {
        def result = delosdbStorageDerbyCheckBoundary()
        def reportFile = delosdbStorageDerbyBoundaryReportFile.get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${reportFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException('Storage-Derby boundary check failed; see ' + reportFile)
        }
    }
}

tasks.register('verifyStorageDerbyBoundary') {
    group = 'verification'
    description = 'Verifies the compact permanent storage-Derby Phase-B module boundary.'
    dependsOn 'storageDerbyBoundaryReport'
    doLast {
        println 'Verified storage-Derby Phase-B boundary; storage owns the store, engine consumes the runtime-compatible jar path'
    }
}

tasks.register('storageDerbyStaticAnalysisReport') {
    group = 'verification'
    description = 'Writes compact storage-Derby guard static-analysis report.'
    outputs.file(delosdbStorageDerbyStaticAnalysisReportFile)
    doLast {
        def result = delosdbStorageDerbyCheckStaticAnalysis()
        def reportFile = delosdbStorageDerbyStaticAnalysisReportFile.get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${reportFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException('Storage-Derby static analysis failed; see ' + reportFile)
        }
    }
}

tasks.register('legacyDerbyStoreB9StaticAnalysisReport') {
    group = 'verification'
    description = 'Compatibility alias for the compact storage-Derby static-analysis report.'
    dependsOn 'storageDerbyStaticAnalysisReport'
}

tasks.register('verifyLegacyDerbyStoreB9StaticAnalysis') {
    group = 'verification'
    description = 'Compatibility alias for compact storage-Derby static analysis.'
    dependsOn 'storageDerbyStaticAnalysisReport'
    doLast {
        println 'Verified B9 static analysis using compact storage-Derby boundary guards'
    }
}

[
        'legacyDerbyStoreB6oCloseoutReport',
        'legacyDerbyStoreB7RuntimePackagingReport',
        'legacyDerbyStoreB8CloseoutReport',
        'legacyDerbyStorePhaseBCloseoutReport',
        'legacyDerbyStoreB9ConsolidationReport'
].each { aliasName ->
    tasks.register(aliasName) {
        group = 'verification'
        description = 'Compatibility alias for the compact storage-Derby boundary report.'
        dependsOn 'storageDerbyBoundaryReport'
    }
}

[
        'verifyLegacyDerbyStoreBoundary',
        'verifyLegacyDerbyStoreB6oCloseout',
        'verifyLegacyDerbyStoreB7RuntimePackaging',
        'verifyLegacyDerbyStoreB8Closeout'
].each { aliasName ->
    tasks.register(aliasName) {
        group = 'verification'
        description = 'Compatibility alias for verifyStorageDerbyBoundary.'
        dependsOn 'verifyStorageDerbyBoundary'
    }
}

tasks.register('verifyLegacyDerbyStorePhaseBCloseout') {
    group = 'verification'
    description = 'Verifies the compact Phase-B closeout boundary.'
    dependsOn 'verifyLegacyDerbyStoreB9StaticAnalysis', 'verifyStorageDerbyBoundary'
    doLast {
        println 'Verified compact Phase-B closeout; historical B5/B6/B7/B8 proof archive is retired'
    }
}

tasks.register('verifyLegacyDerbyStoreB9Consolidation') {
    group = 'verification'
    description = 'Verifies compact B9/B10 storage-Derby boundary consolidation.'
    dependsOn 'verifyLegacyDerbyStorePhaseBCloseout'
    doLast {
        println 'Verified storage-Derby guard consolidation; root build stays small and final boundary gates remain'
    }
}
