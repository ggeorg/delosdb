// Phase C1 storage contract-shape proof.
//
// This is intentionally a proof/report, not a runtime facade. It keeps Phase C
// aligned with the small-verifiable-step rule: heap maps, MVCC maps, storeless
// declines physical access, and no third permanent storage SPI island appears.

ext.delosdbStoragePhaseC1ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC1ReportFile =
        ext.delosdbStoragePhaseC1ReportDir.map { it.file('storage-phase-c1-contract-shape.txt') }

ext.delosdbStoragePhaseC1RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC1JavaFiles = { String projectPath ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [] as Set<File>
    }
    fileTree(sourceRoot).matching { include '**/*.java' }.files as Set<File>
}

ext.delosdbStoragePhaseC1FilesContaining = { Collection<File> sourceFiles, Collection<String> tokens ->
    sourceFiles.findAll { sourceFile ->
        def text = sourceFile.text
        tokens.any { text.contains(it) }
    }.collect { delosdbStoragePhaseC1RelPath(it) }.sort()
}

ext.delosdbStoragePhaseC1ThirdIslandCandidates = {
    def candidateNames = [
            'DelosStorageEngine.java',
            'DelosTableAccess.java',
            'DelosScan.java',
            'DelosMutation.java',
            'DelosMutationAccess.java',
            'OperationalStorageProvider.java',
            'OperationalTableAccess.java',
            'TableAccessProfile.java',
            'StorageExecutionProfile.java',
            'StorelessStorageProvider.java',
            'StorelessVersionedStorageProvider.java'
    ] as Set
    def candidatePathFragments = [
            '/spi/storage/engine/',
            '/spi/storage/operational/',
            '/spi/storage/profile/',
            '/engine/extension/storage/operational/',
            '/engine/extension/storage/profile/'
    ]
    fileTree(rootProject.projectDir).matching {
        include '**/*.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/__MACOSX/**'
    }.files.findAll { sourceFile ->
        candidateNames.contains(sourceFile.name) ||
                candidatePathFragments.any { delosdbStoragePhaseC1RelPath(sourceFile).contains(it) }
    }.collect { delosdbStoragePhaseC1RelPath(it) }.sort()
}

ext.delosdbStoragePhaseC1ContractShape = {
    def errors = []
    def lines = []

    def storageProvider = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/StorageProvider.java')
    def storageCapabilities = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/StorageCapabilities.java')
    def tableStorageMetadata = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/TableStorageMetadata.java')
    def versionedProvider = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/VersionedStorageProvider.java')
    def versionedTable = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/VersionedTable.java')
    def versionedScan = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/VersionedScan.java')
    def txContext = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/TxContext.java')
    def txView = file('delosdb-spi/src/main/java/io/github/ggeorg/delosdb/spi/storage/versioned/TxView.java')
    def heapProvider = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/LegacyDerbyHeapStorageProvider.java')
    def mvccProvider = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccStorageProvider.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def engineStoreTypeSupport = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/storetypes/EngineStoreTypeSupport.java')
    def engineRowLocationBridge = file('delosdb-engine/src/main/java/org/apache/derby/impl/services/storetypes/EngineStoreRowLocationBridge.java')
    def storeTypeSupport = file('delosdb-engine-kernel/src/main/java/org/apache/derby/iapi/store/types/StoreTypeSupport.java')
    def storeRowLocation = file('delosdb-engine-kernel/src/main/java/org/apache/derby/iapi/store/types/StoreRowLocation.java')
    def genericLanguageConnectionFactory = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/conn/GenericLanguageConnectionFactory.java')
    def genericExecutionFactory = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/execute/GenericExecutionFactory.java')
    def storelessBuild = file('delosdb-storeless/build.gradle')
    def storelessReadme = file('delosdb-storeless/README.md')
    def storelessService = file('delosdb-storeless/src/main/java/org/apache/derby/impl/storeless/StorelessService.java')
    def storelessDatabase = file('delosdb-storeless/src/main/java/org/apache/derby/impl/storeless/StorelessDatabase.java')
    def emptyDictionary = file('delosdb-storeless/src/main/java/org/apache/derby/impl/storeless/EmptyDictionary.java')
    def noOpTransaction = file('delosdb-storeless/src/main/java/org/apache/derby/impl/storeless/NoOpTransaction.java')
    def storelessSmoke = file('dev/storeless-prototype-smoke/src/main/java/delosdb/smoke/StorelessPrototypeSmoke.java')

    def heapFiles = delosdbStoragePhaseC1JavaFiles('delosdb-engine')
    def mvccFiles = delosdbStoragePhaseC1JavaFiles('delosdb-storage-mvcc')
    def storelessFiles = delosdbStoragePhaseC1JavaFiles('delosdb-storeless')

    lines << 'Phase C1 storage contract-shape proof'
    lines << '====================================='
    lines << ''
    lines << 'C1 mechanic:'
    lines << '  Heap maps. MVCC maps. Storeless declines. No behavior changes.'
    lines << ''
    lines << 'Minimal operational vocabulary being tested:'
    lines << '  - engine identity'
    lines << '  - table access'
    lines << '  - scan access'
    lines << '  - mutation access'
    lines << '  - row identity'
    lines << '  - transaction/isolation semantics'
    lines << '  - explicit unsupported physical access'
    lines << ''
    lines << 'Current participant mapping:'
    lines << '  heap:'
    lines << "    provider SPI     : ${delosdbStoragePhaseC1RelPath(storageProvider)}"
    lines << "    implementation   : ${heapProvider.exists() ? delosdbStoragePhaseC1RelPath(heapProvider) : 'MISSING'}"
    lines << '    physical access  : inherited Derby raw/access heap store'
    lines << '    transaction      : Derby TransactionController / lock manager / isolation rules'
    lines << '    row identity     : RowLocation / StoreRowLocation bridge'
    lines << '  mvcc:'
    lines << "    provider SPI     : ${delosdbStoragePhaseC1RelPath(versionedProvider)}"
    lines << "    implementation   : ${mvccProvider.exists() ? delosdbStoragePhaseC1RelPath(mvccProvider) : 'MISSING'}"
    lines << '    physical access  : VersionedTable / VersionedScan'
    lines << '    transaction      : VersionedTransactionCoordinator / TxContext / TxView'
    lines << '    row identity     : provider key plus visible version row'
    lines << '  storeless:'
    lines << "    module           : ${storelessBuild.exists() ? delosdbStoragePhaseC1RelPath(storelessBuild) : 'MISSING'}"
    lines << "    service          : ${storelessService.exists() ? delosdbStoragePhaseC1RelPath(storelessService) : 'MISSING'}"
    lines << '    physical access  : none; compile/planner prototype only'
    lines << '    transaction      : NoOpTransaction, not storage semantics'
    lines << '    row identity     : none'
    lines << '    contract result  : must cleanly decline physical scan/mutation access'
    lines << ''

    [storageProvider, storageCapabilities, tableStorageMetadata, versionedProvider, versionedTable, versionedScan,
     txContext, txView, heapProvider, mvccProvider, sqlBridge, engineStoreTypeSupport, engineRowLocationBridge,
     storeTypeSupport, storeRowLocation, genericLanguageConnectionFactory, genericExecutionFactory,
     storelessBuild, storelessReadme, storelessService, storelessDatabase, emptyDictionary, noOpTransaction,
     storelessSmoke].each { sourceFile ->
        if (!sourceFile.exists()) {
            errors << 'missing C1 contract-shape participant: ' + delosdbStoragePhaseC1RelPath(sourceFile)
        }
    }

    if (storageProvider.exists()) {
        def text = storageProvider.text
        ['String name()', 'StorageCapabilities capabilities()', 'capabilities(TableStorageMetadata metadata)'].each { token ->
            if (!text.contains(token)) {
                errors << 'StorageProvider is missing metadata/capability token: ' + token
            }
        }
        def forbidden = ['createTable(', 'openTable(', 'VersionedTable', 'VersionedScan', 'TxContext', 'TxView', 'transactionCoordinator(']
        def leaks = forbidden.findAll { text.contains(it) }
        lines << "StorageProvider operational leakage    : ${leaks.isEmpty() ? 'none' : leaks.join(', ')}"
        if (!leaks.isEmpty()) {
            errors << 'StorageProvider must remain metadata/capability-only during C1: ' + leaks.join(', ')
        }
    }

    if (versionedProvider.exists()) {
        def text = versionedProvider.text
        ['VersionedStorageCapabilities capabilities()', 'VersionedTransactionCoordinator transactionCoordinator()',
         'List<VersionedTableMetadata> listTables()', 'createTable(', 'openTable('].each { token ->
            if (!text.contains(token)) {
                errors << 'VersionedStorageProvider is missing operational MVCC token: ' + token
            }
        }
    }

    if (versionedTable.exists()) {
        def text = versionedTable.text
        ['read(K key, TxView view)', 'openScan(TxView view)', 'insert(K key, V value, TxContext transaction)',
         'update(K key, V value, TxContext transaction)', 'delete(K key, TxContext transaction)'].each { token ->
            if (!text.contains(token)) {
                errors << 'VersionedTable is missing expected scan/mutation token: ' + token
            }
        }
    }

    if (versionedScan.exists()) {
        def text = versionedScan.text
        ['boolean next()', 'VersionedRow<K, V> row()', 'void close()'].each { token ->
            if (!text.contains(token)) {
                errors << 'VersionedScan is missing expected cursor token: ' + token
            }
        }
    }

    if (heapProvider.exists()) {
        def text = heapProvider.text
        if (!text.contains('implements StorageProvider')) {
            errors << 'LegacyDerbyHeapStorageProvider must remain the metadata StorageProvider implementation'
        }
        if (text.contains('VersionedStorageProvider') || text.contains('VersionedTable')) {
            errors << 'LegacyDerbyHeapStorageProvider must not become MVCC/versioned during C1'
        }
    }

    if (mvccProvider.exists()) {
        def text = mvccProvider.text
        if (!text.contains('implements VersionedStorageProvider')) {
            errors << 'DelosMvccStorageProvider must remain the operational VersionedStorageProvider implementation'
        }
        if (text.contains('implements StorageProvider')) {
            errors << 'DelosMvccStorageProvider must not be folded into metadata StorageProvider during C1'
        }
    }

    if (storelessService.exists()) {
        def text = storelessService.text
        ['return "storeless";', 'return EngineType.STORELESS_ENGINE;', 'return false;'].each { token ->
            if (!text.contains(token)) {
                errors << 'StorelessService is missing expected no-store token: ' + token
            }
        }
    }

    if (storelessDatabase.exists()) {
        def text = storelessDatabase.text
        ['return EngineType.STORELESS_ENGINE;', 'return new NoOpTransaction();', 'return true;'].each { token ->
            if (!text.contains(token)) {
                errors << 'StorelessDatabase is missing expected no-store database token: ' + token
            }
        }
    }

    if (genericLanguageConnectionFactory.exists() &&
            !genericLanguageConnectionFactory.text.contains('EngineType.STORELESS_ENGINE')) {
        errors << 'GenericLanguageConnectionFactory no longer recognizes STORELESS_ENGINE'
    }
    if (genericExecutionFactory.exists() &&
            !genericExecutionFactory.text.contains('EngineType.STORELESS_ENGINE')) {
        errors << 'GenericExecutionFactory no longer recognizes STORELESS_ENGINE'
    }

    def storelessProviderTokens = ['implements StorageProvider', 'implements VersionedStorageProvider',
                                   'StorelessStorageProvider', 'StorelessVersionedStorageProvider']
    def storelessProviderLeaks = delosdbStoragePhaseC1FilesContaining(storelessFiles, storelessProviderTokens)
    lines << "Storeless provider leakage             : ${storelessProviderLeaks.isEmpty() ? 'none' : storelessProviderLeaks.join(', ')}"
    if (!storelessProviderLeaks.isEmpty()) {
        errors << 'storeless must remain a no-store prototype, not a storage provider: ' + storelessProviderLeaks.join(', ')
    }

    def thirdIslandCandidates = delosdbStoragePhaseC1ThirdIslandCandidates()
    lines << "Third SPI island candidates            : ${thirdIslandCandidates.isEmpty() ? 'none' : thirdIslandCandidates.join(', ')}"
    if (!thirdIslandCandidates.isEmpty()) {
        errors << 'C1 contract-shape proof must not add a concrete third SPI/profile island: ' + thirdIslandCandidates.take(10).join(', ')
    }

    def engineImplStoreSources = fileTree(file('delosdb-engine/src/main/java')).matching {
        include 'org/apache/derby/impl/store/**/*.java'
    }.files.collect { delosdbStoragePhaseC1RelPath(it) }.sort()
    lines << "Engine impl/store sources              : ${engineImplStoreSources.isEmpty() ? 'none' : engineImplStoreSources.join(', ')}"
    if (!engineImplStoreSources.isEmpty()) {
        errors << 'C1 must not add Derby impl.store sources back under delosdb-engine: ' + engineImplStoreSources.take(10).join(', ')
    }

    def runtimeNames = []
    if (rootProject.ext.has('delosdbRuntimeJarNames')) {
        runtimeNames = rootProject.ext.delosdbRuntimeJarNames.call().collect { it.toString() }.sort()
        def storelessRuntime = runtimeNames.findAll { it.contains('storeless') }
        lines << "Runtime jar names                       : ${runtimeNames.join(', ')}"
        lines << "Storeless runtime jar entry             : ${storelessRuntime.isEmpty() ? 'none' : storelessRuntime.join(', ')}"
        if (!storelessRuntime.isEmpty()) {
            errors << 'storeless must not become a required runtime jar during C1: ' + storelessRuntime.join(', ')
        }
    } else {
        lines << 'Runtime jar names                       : unavailable'
    }

    def sqlBridgeStatus = sqlBridge.exists() ? 'present, transitional' : 'MISSING'
    lines << "VersionedStorageSqlBridge status        : ${sqlBridgeStatus}"
    if (!sqlBridge.exists()) {
        errors << 'VersionedStorageSqlBridge disappeared before planned-path replacement proofs exist'
    }

    lines << ''
    lines << 'C1 conclusion:'
    lines << '  The next executable contract must be convergence-oriented:'
    lines << '    - heap maps through real Derby store semantics;'
    lines << '    - MVCC maps through versioned table/scan/transaction semantics;'
    lines << '    - storeless declines physical access without fake storage;'
    lines << '    - SQL-string MVCC routing remains transitional until planned access proofs replace it.'
    lines << ''
    lines << "result: ${errors.isEmpty() ? 'PASS' : 'FAIL'}"
    if (!errors.isEmpty()) {
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "- ${it}" }
    }

    [lines: lines, errors: errors]
}

tasks.register('storagePhaseC1ContractShapeReport') {
    group = 'verification'
    description = 'Writes the Phase C1 storage contract-shape report.'
    outputs.file(delosdbStoragePhaseC1ReportFile)
    doLast {
        def result = delosdbStoragePhaseC1ContractShape()
        def reportFile = delosdbStoragePhaseC1ReportFile.get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${reportFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException('Phase C1 storage contract-shape proof failed; see ' + reportFile)
        }
    }
}

tasks.register('verifyStoragePhaseC1ContractShape') {
    group = 'verification'
    description = 'Verifies the Phase C1 contract shape: heap maps, MVCC maps, storeless declines, no third island.'
    dependsOn 'verifyStoragePhaseC0TruthMap', 'storagePhaseC1ContractShapeReport'
    doLast {
        println 'Verified Phase C1 contract shape; next step must be one small heap or MVCC mapping proof, not a broad rewrite'
    }
}
