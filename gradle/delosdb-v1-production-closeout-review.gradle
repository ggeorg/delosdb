// Production-closeout review is intentionally isolated from the main test task catalog.
def delosV1CaptureDirectory = project.ext.delosV1BaselineCaptureDirectoryForReview
def delosV1ReviewSha256 = project.ext.delosV1Sha256ForReview
def delosV1ReviewVerifyBundleChecksums = project.ext.delosV1VerifyBundleChecksumsForReview
def delosV1ReviewGitOutput = project.ext.delosV1GitOutputForReview

def delosV1ProductionCloseoutReviewDirectory = rootProject.layout.buildDirectory.dir(
        'reports/delosdb/v1-baseline/production-closeout-review')

tasks.register('reviewDelosV1ProductionCloseoutCapture') {
    group = 'verification'
    description = 'Reviews the clean production-closeout capture without promoting it.'

    dependsOn tasks.named('captureDelosV1Baseline')
    inputs.dir(delosV1CaptureDirectory)
    inputs.file(rootProject.layout.projectDirectory.file(
            'benchmarks/v1-baseline/provisional-thresholds.json'))
    inputs.dir(rootProject.layout.projectDirectory.dir('benchmarks/v1-baseline/accepted'))
    outputs.upToDateWhen { false }
    outputs.dir(delosV1ProductionCloseoutReviewDirectory)

    doLast {
        File captureRoot = delosV1CaptureDirectory.get().asFile
        File reviewRoot = delosV1ProductionCloseoutReviewDirectory.get().asFile
        File acceptedRoot = rootProject.file('benchmarks/v1-baseline/accepted')
        File trackedThresholds = rootProject.file(
                'benchmarks/v1-baseline/provisional-thresholds.json')
        File captureManifestFile = new File(captureRoot, 'manifest.json')
        File acceptedManifestFile = new File(acceptedRoot, 'manifest.json')
        File operationalFile = new File(
                captureRoot, 'raw/operational/v1-baseline-operational-results.json')
        File modularFile = new File(
                captureRoot, 'raw/modular-image-drda/modular-image-drda-results.json')

        delete reviewRoot
        reviewRoot.mkdirs()

        def failures = []
        def require = { boolean condition, String message ->
            if (!condition) {
                failures << message
            }
        }
        def parseJson = { File file, String label ->
            if (!file.isFile()) {
                failures << "Missing ${label}: ${file}"
                return null
            }
            try {
                new groovy.json.JsonSlurper().parse(file)
            } catch (Exception failure) {
                failures << "Invalid ${label}: ${failure.message}"
                null
            }
        }
        def verifyBundle = { File root, String label ->
            try {
                delosV1ReviewVerifyBundleChecksums(root, label)
            } catch (Exception failure) {
                failures << failure.message
                null
            }
        }
        def normalizeArtifacts = { artifacts ->
            artifacts instanceof Collection ? artifacts.collect { row -> [
                    name: String.valueOf(row.name),
                    bytes: row.bytes instanceof Number ? row.bytes.longValue() : -1L,
                    sha256: String.valueOf(row.sha256)
            ] }.sort { left, right -> left.name <=> right.name } : []
        }

        def captureVerification = verifyBundle(captureRoot, 'Production-closeout v1 capture')
        def acceptedVerification = verifyBundle(acceptedRoot, 'Historical accepted v1 baseline')
        def manifest = parseJson(captureManifestFile, 'production-closeout manifest')
        def acceptedManifest = parseJson(acceptedManifestFile, 'historical accepted manifest')
        def thresholds = parseJson(trackedThresholds, 'tracked threshold policy')
        def operational = parseJson(operationalFile, 'operational closeout evidence')
        def modular = parseJson(modularFile, 'modular-image DRDA evidence')

        def requiredLanes = [
                'operational', 'jdbc-lifecycle', 'jdbc-batch-scaling',
                'jdbc-transactions', 'jdbc-row-scaling', 'mvcc-buffer-cache',
                'mvcc-page-codec', 'drda-stress', 'modular-image-drda',
                'recovery-differential', 'failure-replay', 'low-level-failure-replay'
        ]
        def expectedMatrix = [
                writers: [1, 2, 4, 8, 16],
                providers: ['heap', 'delos_mvcc'],
                topologies: ['same-table', 'different-tables', 'different-databases'],
                workloads: ['single-row-insert', 'multi-row-insert', 'mixed-insert-update']
        ]
        String currentRevision = delosV1ReviewGitOutput(['git', 'rev-parse', 'HEAD'])
        String currentStatus = delosV1ReviewGitOutput(['git', 'status', '--porcelain'])
        require(currentRevision ==~ /[0-9a-f]{40,64}/,
                'Production-closeout review requires a Git source revision')
        require(currentStatus.isBlank(),
                'Only a clean source tree can pass production-closeout review')

        if (manifest != null) {
            require(manifest.schemaVersion == 1,
                    'Production-closeout manifest schema must be 1')
            require(manifest.baselineId == 'phase8-v1-production-closeout',
                    'Production-closeout manifest has the wrong identity')
            require(manifest.status == 'CAPTURED_NOT_ACCEPTED',
                    'Production-closeout capture must remain CAPTURED_NOT_ACCEPTED')
            require(manifest.source?.dirty == false,
                    'Production-closeout capture must be clean')
            require(manifest.source?.revision == currentRevision,
                    'Capture revision must equal the current checkout revision')
            String javaVersion = String.valueOf(manifest.environment?.javaVersion ?: '')
            require(javaVersion.tokenize('.')[0] == '25',
                    'Production-closeout capture must use JDK 25, found ' + javaVersion)
            require(String.valueOf(manifest.environment?.gradleVersion ?: '')
                            == gradle.gradleVersion,
                    'Capture Gradle version must equal the executing wrapper version')
            require(manifest.matrix == expectedMatrix,
                    'Capture matrix differs from the fixed v1 matrix')
            require(manifest.lanes == requiredLanes,
                    'Capture lane inventory is incomplete or reordered')
            require(manifest.profilingAndFaultDefaults?.runtimeStatisticsDefault == 'disabled'
                            && manifest.profilingAndFaultDefaults?.failureControls
                            == 'test-only-unreachable',
                    'Normal profiling/failure-control defaults changed')
            require(String.valueOf(manifest.semanticChecksum ?: '') ==~ /[0-9a-f]{64}/
                            && manifest.semanticTokenCount instanceof Number
                            && manifest.semanticTokenCount.intValue() > 0,
                    'Capture semantic evidence is missing or malformed')

            def rows = manifest.files instanceof Collection ? manifest.files : []
            def paths = rows.collect { String.valueOf(it.path) }
            def actualPaths = [] as Set
            captureRoot.eachFileRecurse(groovy.io.FileType.FILES) { File file ->
                String relative = captureRoot.toPath().relativize(file.toPath())
                        .toString().replace('\\', '/')
                if (relative != 'manifest.json' && relative != 'checksums.sha256') {
                    actualPaths.add(relative)
                }
            }
            require(paths.size() == paths.toSet().size() && paths.toSet() == actualPaths,
                    'Manifest file inventory does not exactly match the capture bundle')
            rows.each { row ->
                String relative = String.valueOf(row.path)
                File evidence = new File(captureRoot, relative)
                require(evidence.isFile()
                                && row.bytes instanceof Number
                                && row.bytes.longValue() == evidence.length()
                                && String.valueOf(row.sha256) == delosV1ReviewSha256(evidence),
                        'Manifest evidence fingerprint mismatch: ' + relative)
                require(relative == 'provisional-thresholds.json'
                                || relative.startsWith('raw/'),
                        'Capture contains an unexpected non-evidence path: ' + relative)
            }

            def semanticTokens = []
            rows.findAll { String.valueOf(it.path).endsWith('.json') }.each { row ->
                String relative = String.valueOf(row.path)
                String text = new File(captureRoot, relative).getText('UTF-8')
                (text =~ /"semanticFingerprint"\s*:\s*(-?\d+)/).each { match ->
                    semanticTokens << "${relative}:fingerprint:${match[1]}"
                }
                (text =~ /"semanticDigest"\s*:\s*"([0-9a-f]{64})"/).each { match ->
                    semanticTokens << "${relative}:digest:${match[1]}"
                }
            }
            semanticTokens.sort()
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            semanticTokens.each { String token ->
                digest.update(token.getBytes(java.nio.charset.StandardCharsets.UTF_8))
                digest.update((byte) '\n')
            }
            require(semanticTokens.size() == manifest.semanticTokenCount
                            && java.util.HexFormat.of().formatHex(digest.digest())
                            == manifest.semanticChecksum,
                    'Aggregate semantic checksum does not match the raw evidence')

            def currentArtifacts = rootProject.ext.delosdbRuntimeJarFiles.call().files
                    .findAll { it.isFile() }
                    .collect { jar -> [
                            name: jar.name,
                            bytes: jar.length(),
                            sha256: delosV1ReviewSha256(jar)
                    ] }
            require(normalizeArtifacts(manifest.runtimeArtifacts)
                            == normalizeArtifacts(currentArtifacts),
                    'Captured runtime fingerprints do not match the assembled runtime')
        }

        File capturedThresholds = new File(captureRoot, 'provisional-thresholds.json')
        require(capturedThresholds.isFile() && trackedThresholds.isFile()
                        && delosV1ReviewSha256(capturedThresholds) == delosV1ReviewSha256(trackedThresholds),
                'Captured threshold policy differs from the tracked policy')
        if (thresholds != null) {
            require(thresholds.schemaVersion == 1 && thresholds.status == 'PROVISIONAL',
                    'Threshold policy must remain schema 1 and PROVISIONAL')
            require(thresholds.comparisonRequirements?.semanticChecksumMustMatch == true,
                    'Semantic mismatches must remain acceptance blockers')
            require(thresholds.decisionPolicy?.minimumComparableCapturesBeforePromotion == 3,
                    'Promotion must require three comparable captures')
            require(thresholds.decisionPolicy?.automaticReleaseFailure == false,
                    'Machine-specific timings must not become automatic release failures')
        }

        if (operational != null) {
            def decision = operational.decisionPublication
            def writerRows = operational.writerMatrix instanceof Collection
                    ? operational.writerMatrix : []
            def writerKeys = writerRows.collect { row ->
                [row.provider, row.topology, row.workload, row.writers].join('|')
            }
            require(operational.schemaVersion == 2
                            && operational.captureId == 'phase8-v1-production-closeout',
                    'Operational evidence schema or identity is wrong')
            require(operational.configuration?.writerCounts == [1, 2, 4, 8, 16]
                            && writerRows.size() == 90
                            && writerKeys.toSet().size() == 90,
                    'Operational writer matrix is incomplete')
            require(decision?.transactions == 32
                            && decision?.rawDecisionForceSamples == 32
                            && decision?.participantPublicationSamples == 32,
                    'Split decision/publication evidence must contain 32 samples per interval')
            require(decision?.rawDecisionForceAverageNanos instanceof Number
                            && decision.rawDecisionForceAverageNanos.longValue() > 0L
                            && decision?.participantPublicationAverageNanos instanceof Number
                            && decision.participantPublicationAverageNanos.longValue() > 0L,
                    'Split decision/publication timings must be positive')
            require(String.valueOf(decision?.semanticDigest ?: '') ==~ /[0-9a-f]{64}/,
                    'Decision/publication semantic digest is malformed')
        }

        if (modular != null) {
            require(modular.schemaVersion == 1
                            && modular.imageKind == 'jlink-runtime-image'
                            && modular.launchMode == 'JPMS module path',
                    'Modular evidence does not prove jlink plus JPMS execution')
            ['applicationJarCount', 'resolvedModuleCount', 'imageBytes',
             'serverStartNanos', 'clientRoundTripNanos'].each { String field ->
                require(modular[field] instanceof Number
                                && modular[field].longValue() > 0L,
                        'Modular evidence field must be positive: ' + field)
            }
            File ijOutput = new File(captureRoot, 'raw/modular-image-drda/ij-output.txt')
            File resolvedModules = new File(
                    captureRoot, 'raw/modular-image-drda/resolved-modules.txt')
            require(ijOutput.isFile()
                            && ijOutput.getText('UTF-8').contains('DELOSDB_MODULAR_OK')
                            && !ijOutput.getText('UTF-8').contains('ERROR ')
                            && !ijOutput.getText('UTF-8').contains('IJ ERROR'),
                    'Modular ij evidence is missing or contains an error')
            String modulesText = resolvedModules.isFile()
                    ? resolvedModules.getText('UTF-8') : ''
            [
                    'org.apache.derby.engine', 'org.apache.derby.server',
                    'org.apache.derby.tools', 'org.apache.derby.client',
                    'io.github.ggeorg.delosdb.storage.mvcc',
                    'io.github.ggeorg.delosdb.storage.io'
            ].each { String moduleName ->
                require(modulesText.contains(moduleName),
                        'Modular resolution is missing ' + moduleName)
            }
        }

        ['drda-stress', 'recovery-differential',
         'failure-replay', 'low-level-failure-replay'].each { String lane ->
            File laneRoot = new File(captureRoot, 'raw/' + lane)
            def xmlFiles = []
            if (laneRoot.isDirectory()) {
                laneRoot.eachFileRecurse(groovy.io.FileType.FILES) { File file ->
                    if (file.name.endsWith('.xml')) {
                        xmlFiles << file
                    }
                }
            }
            require(!xmlFiles.isEmpty(), 'Missing JUnit XML evidence for ' + lane)
            xmlFiles.each { File file ->
                String text = file.getText('UTF-8')
                require((text =~ /<testsuite\s+[^>]*tests="[1-9][0-9]*"/).find()
                                && text.contains('failures="0"')
                                && text.contains('errors="0"'),
                        'JUnit evidence is not green: ' + file.name)
            }
        }

        if (acceptedManifest != null) {
            require(acceptedManifest.schemaVersion == 1
                            && acceptedManifest.baselineId == 'phase8-v1-post-correction'
                            && acceptedManifest.status == 'ACCEPTED_V1',
                    'Historical accepted baseline identity or status changed')
            require(acceptedManifest.source?.revision
                            == '358e919692d970000fe92bd71edeb1b813633ff1'
                            && acceptedManifest.semanticChecksum
                            == 'e4103b829c3a4b9952507fa837b9187bc9deff872fe19d8daf0a76e99e2f6b17',
                    'Historical accepted baseline revision or semantic checksum changed')
        }

        def comparisonReasons = []
        if (manifest != null && acceptedManifest != null) {
            if (normalizeArtifacts(manifest.runtimeArtifacts)
                    != normalizeArtifacts(acceptedManifest.runtimeArtifacts)) {
                comparisonReasons << 'runtime artifact fingerprints differ'
            }
            if (manifest.semanticChecksum != acceptedManifest.semanticChecksum) {
                comparisonReasons << 'semantic checksum differs'
            }
            if (manifest.lanes != acceptedManifest.lanes) {
                comparisonReasons << 'evidence lane inventory differs'
            }
        } else {
            comparisonReasons << 'capture or historical manifest unavailable'
        }

        def reviewFailures = new ArrayList(failures)
        def review = [
                schemaVersion: 1,
                reviewId: 'phase8-v1-production-closeout-review',
                status: reviewFailures.isEmpty() ? 'REVIEWED_NOT_ACCEPTED' : 'FAILED',
                reviewedAtUtc: java.time.Instant.now().toString(),
                capture: [
                        baselineId: manifest?.baselineId,
                        sourceRevision: manifest?.source?.revision,
                        semanticChecksum: manifest?.semanticChecksum,
                        manifestSha256: captureManifestFile.isFile()
                                ? delosV1ReviewSha256(captureManifestFile) : null,
                        checksumsSha256: new File(captureRoot, 'checksums.sha256').isFile()
                                ? delosV1ReviewSha256(new File(captureRoot, 'checksums.sha256')) : null,
                        verifiedFileCount: captureVerification?.fileCount
                ],
                historicalAcceptedBaseline: [
                        baselineId: acceptedManifest?.baselineId,
                        semanticChecksum: acceptedManifest?.semanticChecksum,
                        verifiedFileCount: acceptedVerification?.fileCount,
                        immutable: reviewFailures.findAll {
                            String.valueOf(it).startsWith('Historical accepted')
                        }.isEmpty()
                ],
                evidence: [
                        completeLaneInventory: manifest?.lanes == requiredLanes,
                        fixedMatrix: manifest?.matrix == expectedMatrix,
                        rawDecisionForceSamples:
                                operational?.decisionPublication?.rawDecisionForceSamples,
                        participantPublicationSamples:
                                operational?.decisionPublication?.participantPublicationSamples,
                        modularImageKind: modular?.imageKind,
                        modularLaunchMode: modular?.launchMode
                ],
                historicalComparison: [
                        comparable: comparisonReasons.isEmpty(),
                        reasons: comparisonReasons,
                        policy: 'provisional-thresholds.json'
                ],
                promotion: [
                        eligible: false,
                        reason: 'Review does not promote evidence; policy requires three comparable captures and a separately pinned candidate.'
                ],
                failures: reviewFailures
        ]

        File jsonReport = new File(reviewRoot, 'review.json')
        jsonReport.setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(review)) + '\n',
                'UTF-8')
        File textReport = new File(reviewRoot, 'review.txt')
        textReport.withWriter('UTF-8') { writer ->
            writer.println('DelosDB Phase 8 production-closeout review')
            writer.println('==========================================')
            writer.println()
            writer.println('Status: ' + review.status)
            writer.println('Capture: ' + String.valueOf(review.capture.baselineId))
            writer.println('Source revision: ' + String.valueOf(review.capture.sourceRevision))
            writer.println('Semantic checksum: ' + String.valueOf(review.capture.semanticChecksum))
            writer.println('Verified files: ' + String.valueOf(review.capture.verifiedFileCount))
            writer.println('Historical accepted bundle immutable: '
                    + String.valueOf(review.historicalAcceptedBaseline.immutable))
            writer.println('Comparable to historical accepted bundle: '
                    + String.valueOf(review.historicalComparison.comparable))
            if (!comparisonReasons.isEmpty()) {
                writer.println('Comparison limits: ' + comparisonReasons.join('; '))
            }
            writer.println('Promotion eligible: false')
            writer.println('Promotion is intentionally outside this review.')
            if (!reviewFailures.isEmpty()) {
                writer.println()
                writer.println('Failures:')
                reviewFailures.each { writer.println('- ' + it) }
            }
        }

        if (!reviewFailures.isEmpty()) {
            throw new GradleException(
                    'DelosDB production-closeout capture review failed. Report: ' + textReport)
        }
        logger.lifecycle(
                'DelosDB production-closeout capture review passed without promotion. Report: {}',
                textReport)
    }
}

tasks.register('verifyDelosV1ProductionCloseout') {
    group = 'verification'
    description = 'Runs normal gates, S0, a clean authoritative capture, and final Phase 8 evidence review in one command.'

    dependsOn rootProject.tasks.named('s0CloseoutVerification'),
            project(':delosdb-engine').tasks.named('check'),
            project(':delosdb-storage-mvcc').tasks.named('check'),
            tasks.named('check'),
            tasks.named('runDelosMvccTransactionParticipationTest'),
            tasks.named('runDelosMvccRawStoreSqlTransactionCutoverTest'),
            tasks.named('reviewDelosV1ProductionCloseoutCapture')

    outputs.upToDateWhen { false }

    doLast {
        logger.lifecycle('DelosDB Phase 8 production closeout passed. The reviewed capture remains CAPTURED_NOT_ACCEPTED and the historical accepted baseline remains immutable.')
    }
}
