import org.gradle.api.tasks.compile.JavaCompile

// Phase C31 JavaCC INSERT classifier.
// C31 adds a Derby JavaCC / QueryTreeNode route for INSERT INTO table VALUES (...)
// while keeping the existing INSERT regex fallback. No regex is deleted here.

ext.delosdbStoragePhaseC31ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC31ReportFile =
        ext.delosdbStoragePhaseC31ReportDir.map { it.file('storage-phase-c31-javacc-insert-classifier.txt') }
ext.delosdbStoragePhaseC31SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c31-javacc-insert-classifier-smoke')

ext.delosdbStoragePhaseC31RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC31RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC31RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC31ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC31RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC31Classpath = {
    files(
            delosdbStoragePhaseC31SmokeClassesDir,
            delosdbStoragePhaseC31ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC31ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseC31ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC31ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC31RuntimeJars())
}

ext.delosdbStoragePhaseC31Proof = {
    def errors = []
    def lines = []

    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def classifier = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/DelosVersionedStorageQueryTreeClassifier.java')
    def smokeSource = file('dev/storage-phase-c31-javacc-insert-classifier-smoke/src/main/java/delosdb/smoke/StoragePhaseC31JavaCcInsertClassifierSmoke.java')
    def cleanupScript = file('scripts/delete-stale-storage-smoke-dbs.sh')

    delosdbStoragePhaseC31RequireTokens(errors, classifier, [
            'insertValues(String sql)',
            'classifyInsertValues(String sql, Visitable parsed)',
            'parsed instanceof InsertNode insert',
            'privateFieldValue(insert, "targetColumnList")',
            'source instanceof RowResultSetNode row',
            'ResultColumnList resultColumns = row.getResultColumns()',
            'resultColumn.getExpression() instanceof ConstantNode literal',
            'return Optional.of(new InsertValuesRoute(',
            'public record InsertValuesRoute(String tableName, String values)'
    ], 'C31 JavaCC INSERT classifier')
    if (classifier.exists()) {
        def classifierText = classifier.text
        ['Pattern.compile(', '.matcher(', 'DelosTableGuarantee', 'guarantees()', 'FunctionCall', 'RexNode'].each { token ->
            if (classifierText.contains(token)) {
                errors << "C31 classifier must remain parser-tree only and must not include token: ${token}"
            }
        }
    }

    delosdbStoragePhaseC31RequireTokens(errors, sqlBridge, [
            'private static final Pattern INSERT_VALUES',
            'INSERT_VALUES.matcher(normalizedSql)',
            'DelosVersionedStorageQueryTreeClassifier.insertValues(normalizedSql)',
            'PlannedRoute.insertValues(route.tableName(), route.values())'
    ], 'C31 bridge JavaCC INSERT route plus regex fallback')
    if (sqlBridge.exists()) {
        def bridgeText = sqlBridge.text
        if (!bridgeText.contains('INSERT_VALUES.matcher(normalizedSql)')) {
            errors << 'C31 must keep INSERT regex fallback until C32 deletes it after this proof is green'
        }
    }

    delosdbStoragePhaseC31RequireTokens(errors, smokeSource, [
            'StoragePhaseC31JavaCcInsertClassifierSmoke',
            'direct bridge INSERT without Derby parser context should keep using regex fallback in C31',
            'INSERT INTO C31_JAVACC_INSERT VALUES (1, \'alpha\')',
            'INSERT VALUES route should be classified by Derby JavaCC / QueryTreeNode',
            'javacc-query-tree',
            'storage_phase_c31_javacc_insert_classifier: PASS'
    ], 'C31 JavaCC INSERT classifier smoke')
    if (smokeSource.exists()) {
        def smokeText = smokeSource.text
        ['Pattern.compile(', '.matcher(', 'FunctionCall', 'RexNode'].each { token ->
            if (smokeText.contains(token)) {
                errors << "C31 smoke must not add regex or expression-model token: ${token}"
            }
        }
    }

    delosdbStoragePhaseC31RequireTokens(errors, cleanupScript, [
            'storage-phase-c31-javacc-insert-classifier-db'
    ], 'C31 cleanup script smoke DB entry')

    lines << 'DelosDB Storage Phase C31 JavaCC INSERT Classifier'
    lines << '=================================================='
    lines << ''
    lines << 'C31 mechanic:'
    lines << '  Add a Derby JavaCC / QueryTreeNode route for INSERT INTO table VALUES (...).'
    lines << '  Keep the existing INSERT regex fallback for direct bridge paths without Derby parser context.'
    lines << ''
    lines << 'Boundaries preserved:'
    lines << '  No INSERT regex deletion; that belongs to C32.'
    lines << '  No UPDATE/DELETE classifier work.'
    lines << '  No function-call predicates or expression model.'
    lines << '  No guarantee/capability checks inside the JavaCC classifier.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC31JavaCcInsertClassifierReport') {
    group = 'verification'
    description = 'Writes the Phase C31 JavaCC INSERT classifier report.'
    dependsOn 'verifyStoragePhaseC30RangeRegexDeletion'
    outputs.file(delosdbStoragePhaseC31ReportFile)
    doLast {
        def result = delosdbStoragePhaseC31Proof()
        def outputFile = delosdbStoragePhaseC31ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C31 JavaCC INSERT classifier failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC31JavaCcInsertClassifierSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C31 JavaCC INSERT classifier smoke test.'
    source = files('dev/storage-phase-c31-javacc-insert-classifier-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseC31SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC31Classpath()
}

tasks.register('storagePhaseC31JavaCcInsertClassifierSmoke', JavaExec) {
    dependsOn 'storagePhaseC31JavaCcInsertClassifierReport', 'compileStoragePhaseC31JavaCcInsertClassifierSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase C31 JavaCC INSERT classifier smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseC31JavaCcInsertClassifierSmoke'
    classpath = delosdbStoragePhaseC31Classpath()
}

tasks.register('verifyStoragePhaseC31JavaCcInsertClassifier') {
    group = 'verification'
    description = 'Verifies Phase C31 JavaCC INSERT classifier.'
    dependsOn 'storagePhaseC31JavaCcInsertClassifierReport', 'storagePhaseC31JavaCcInsertClassifierSmoke'
    doLast {
        println 'Verified Phase C31 JavaCC INSERT classifier; next step is C32 INSERT regex deletion'
    }
}
