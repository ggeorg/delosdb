import org.gradle.api.tasks.compile.JavaCompile

// Phase C6 SQL bridge shrink proof.
//
// This is intentionally one tiny bridge-reduction step. It proves the INSERT
// branch inside the quarantined VersionedStorageSqlBridge delegates the actual
// provider mutation through VersionedStorageExecutionBridge, while preserving
// the existing SQL-bridge behavior until planned Derby execution owns it.

ext.delosdbStoragePhaseC6ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC6ReportFile =
        ext.delosdbStoragePhaseC6ReportDir.map { it.file('storage-phase-c6-sql-bridge-shrink.txt') }
ext.delosdbStoragePhaseC6SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c6-sql-bridge-shrink-smoke')

ext.delosdbStoragePhaseC6RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC6RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC6RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC6ForbiddenSourceHits = { Collection<File> sourceFiles, Collection<String> tokens ->
    sourceFiles.collectMany { sourceFile ->
        def text = sourceFile.text
        tokens.findAll { token -> text.contains(token) }.collect { token ->
            "${delosdbStoragePhaseC6RelPath(sourceFile)} contains forbidden token ${token}"
        }
    }.sort()
}

ext.delosdbStoragePhaseC6JavaFiles = { String projectPath ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [] as Set<File>
    }
    fileTree(sourceRoot).matching { include '**/*.java' }.files as Set<File>
}

ext.delosdbStoragePhaseC6ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC6RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC6Classpath = {
    files(
            delosdbStoragePhaseC6SmokeClassesDir,
            delosdbStoragePhaseC6ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC6ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC6ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC6RuntimeJars())
}

ext.delosdbStoragePhaseC6Proof = {
    def errors = []
    def lines = []

    def smokeSource = file('dev/storage-phase-c6-sql-bridge-shrink-smoke/src/main/java/delosdb/smoke/StoragePhaseC6SqlBridgeShrinkSmoke.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def executionBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/execution/VersionedStorageExecutionBridge.java')
    def embedStatement = file('delosdb-engine/src/main/java/org/apache/derby/impl/jdbc/EmbedStatement.java')
    def heapProvider = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/LegacyDerbyHeapStorageProvider.java')
    def mvccProvider = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccStorageProvider.java')
    def storelessRoot = file('delosdb-storeless/src/main/java')

    delosdbStoragePhaseC6RequireTokens(errors, smokeSource, [
            'SqlBridgePlan',
            'VersionedStorageSqlBridge.tryExecute(sql, this, true)',
            'CREATE TABLE ',
            'USING delos_mvcc',
            'INSERT INTO ',
            'SELECT * FROM ',
            'requireUpdateCount',
            'requireRow'
    ], 'Phase C6 SQL bridge shrink smoke')

    delosdbStoragePhaseC6RequireTokens(errors, sqlBridge, [
            'import io.github.ggeorg.delosdb.engine.extension.storage.versioned.execution.VersionedStorageExecutionBridge;',
            'private static final VersionedStorageExecutionBridge PLANNED_TABLE_OPERATION_BRIDGE',
            'PLANNED_TABLE_OPERATION_BRIDGE.insert(table.table(), rowKey, values, statementTx.context());',
            'private static final Pattern INSERT_VALUES',
            'Minimal SQL/JDBC bridge for the experimental'
    ], 'VersionedStorageSqlBridge planned INSERT delegation')

    if (sqlBridge.exists() && sqlBridge.text.contains('table.table().insert(rowKey, values, statementTx.context());')) {
        errors << 'VersionedStorageSqlBridge INSERT branch must not call VersionedTable.insert directly after C6'
    }

    delosdbStoragePhaseC6RequireTokens(errors, executionBridge, [
            'public <K, V> void insert(',
            'requireTable(table).insert(requireKey(key), requireValue(value), requireTransaction(transaction));'
    ], 'VersionedStorageExecutionBridge insert operation')

    delosdbStoragePhaseC6RequireTokens(errors, embedStatement, [
            'VersionedStorageSqlBridge.tryExecute('
    ], 'current transitional EmbedStatement bridge hook')

    delosdbStoragePhaseC6RequireTokens(errors, heapProvider, [
            'implements StorageProvider',
            'StorageCapabilities'
    ], 'Derby heap provider remains metadata path')

    delosdbStoragePhaseC6RequireTokens(errors, mvccProvider, [
            'implements VersionedStorageProvider',
            'public VersionedTransactionCoordinator transactionCoordinator()',
            'public synchronized <K, V> VersionedTable<K, V> openTable('
    ], 'MVCC provider remains versioned operational path')

    if (!storelessRoot.exists()) {
        errors << 'missing storeless source root: delosdb-storeless/src/main/java'
    } else {
        def storelessProviderHits = fileTree(storelessRoot).matching { include '**/*.java' }.files.findAll { sourceFile ->
            def text = sourceFile.text
            text.contains('implements StorageProvider') || text.contains('implements VersionedStorageProvider')
        }.collect { delosdbStoragePhaseC6RelPath(it) }.sort()
        if (!storelessProviderHits.isEmpty()) {
            errors << 'storeless must remain a no-store negative proof, not a provider: ' + storelessProviderHits
        }
    }

    if (smokeSource.exists()) {
        errors.addAll(delosdbStoragePhaseC6ForbiddenSourceHits([smokeSource], [
                'DriverManager',
                'Connection',
                'Statement',
                'Pattern.compile',
                'Matcher'
        ]))
    }

    def engineStoreSourceRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
    if (engineStoreSourceRoot.exists()) {
        errors << 'Phase C6 must not add engine-side org/apache/derby/impl/store sources: '
                + delosdbStoragePhaseC6RelPath(engineStoreSourceRoot)
    }

    def thirdIslandNames = [
            'DelosStorageEngine.java',
            'DelosTableAccess.java',
            'DelosScan.java',
            'DelosMutationAccess.java',
            'TableAccessProfile.java',
            'StorageExecutionProfile.java',
            'StorelessStorageProvider.java',
            'StorelessVersionedStorageProvider.java'
    ] as Set
    def thirdIslandFiles = fileTree(rootProject.projectDir).matching {
        include '**/*.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
        exclude '**/.idea/**'
        exclude '**/__MACOSX/**'
    }.files.findAll { thirdIslandNames.contains(it.name) }
            .collect { delosdbStoragePhaseC6RelPath(it) }.sort()
    if (!thirdIslandFiles.isEmpty()) {
        errors << 'Phase C6 must not introduce the third SPI/profile island while shrinking the SQL bridge: '
                + thirdIslandFiles
    }

    def allEngineVersionedFiles = delosdbStoragePhaseC6JavaFiles('delosdb-engine').findAll { sourceFile ->
        delosdbStoragePhaseC6RelPath(sourceFile).contains('/versioned/')
    }
    def sqlRegexOwners = allEngineVersionedFiles.findAll { sourceFile ->
        sourceFile.name != 'VersionedStorageSqlBridge.java' && sourceFile.text.contains('Pattern.compile(')
    }.collect { delosdbStoragePhaseC6RelPath(it) }.sort()
    if (!sqlRegexOwners.isEmpty()) {
        errors << 'C6 SQL bridge shrink must not add SQL regex owners outside VersionedStorageSqlBridge: '
                + sqlRegexOwners
    }

    lines << 'DelosDB Storage Phase C6 SQL Bridge Shrink Proof'
    lines << '================================================='
    lines << ''
    lines << 'C6 mechanic:'
    lines << '  shrink exactly one proven bridge path: SQL INSERT now delegates its provider mutation through VersionedStorageExecutionBridge.'
    lines << ''
    lines << 'Preserved behavior:'
    lines << '  SQL bridge still owns temporary regex statement routing.'
    lines << '  INSERT update count and SELECT visibility are preserved by the smoke.'
    lines << '  Derby heap execution remains untouched.'
    lines << ''
    lines << 'Boundary checked:'
    lines << '  old direct call removed: table.table().insert(rowKey, values, statementTx.context())'
    lines << '  new planned call used: PLANNED_TABLE_OPERATION_BRIDGE.insert(table.table(), rowKey, values, statementTx.context())'
    lines << ''
    lines << 'Next step:'
    lines << '  only after this remains green, shrink the next proven SQL bridge path or add the next tiny planned operation proof.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC6SqlBridgeShrinkReport') {
    group = 'verification'
    description = 'Writes the Phase C6 SQL bridge shrink proof report.'
    dependsOn 'verifyStoragePhaseC5InsertProof'
    outputs.file(delosdbStoragePhaseC6ReportFile)
    doLast {
        def result = delosdbStoragePhaseC6Proof()
        def outputFile = delosdbStoragePhaseC6ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C6 SQL bridge shrink proof failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC6SqlBridgeShrinkSmoke', JavaCompile) {
    dependsOn 'jars', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C6 SQL bridge shrink smoke test.'
    source = files('dev/storage-phase-c6-sql-bridge-shrink-smoke/src/main/java')
    destinationDirectory = delosdbStoragePhaseC6SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC6Classpath()
}

tasks.register('storagePhaseC6SqlBridgeShrinkSmoke', JavaExec) {
    dependsOn 'compileStoragePhaseC6SqlBridgeShrinkSmoke'
    group = 'verification'
    description = 'Runs the Phase C6 SQL bridge shrink smoke test.'
    classpath = delosdbStoragePhaseC6Classpath()
    mainClass = 'delosdb.smoke.StoragePhaseC6SqlBridgeShrinkSmoke'
}

tasks.register('verifyStoragePhaseC6SqlBridgeShrink') {
    group = 'verification'
    description = 'Verifies the Phase C6 first SQL bridge shrink proof.'
    dependsOn 'storagePhaseC6SqlBridgeShrinkReport', 'storagePhaseC6SqlBridgeShrinkSmoke'
    doLast {
        println 'Verified Phase C6 SQL bridge shrink; next step must stay one tiny planned path at a time'
    }
}
