import org.gradle.api.tasks.compile.JavaCompile

// Phase C14 routing boundary extraction.
//
// This is still not regex removal. C14 keeps VersionedStorageSqlBridge as the
// temporary regex router, but separates statement classification/routing from
// routed-statement execution so a later slice can replace one route at a time.

ext.delosdbStoragePhaseC14ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC14ReportFile =
        ext.delosdbStoragePhaseC14ReportDir.map { it.file('storage-phase-c14-routing-boundary.txt') }
ext.delosdbStoragePhaseC14SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c14-routing-boundary-smoke')

ext.delosdbStoragePhaseC14RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC14RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC14RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC14JavaFiles = { String projectPath ->
    def sourceRoot = file("${projectPath}/src/main/java")
    if (!sourceRoot.exists()) {
        return [] as Set<File>
    }
    fileTree(sourceRoot).matching { include '**/*.java' }.files as Set<File>
}

ext.delosdbStoragePhaseC14ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC14RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC14Classpath = {
    files(
            delosdbStoragePhaseC14SmokeClassesDir,
            delosdbStoragePhaseC14ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC14ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC14ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC14RuntimeJars())
}

ext.delosdbStoragePhaseC14Proof = {
    def errors = []
    def lines = []

    def smokeSource = file('dev/storage-phase-c14-routing-boundary-smoke/src/main/java/delosdb/smoke/StoragePhaseC14RoutingBoundarySmoke.java')
    def sqlBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def executionBridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/execution/VersionedStorageExecutionBridge.java')
    def heapProvider = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/LegacyDerbyHeapStorageProvider.java')
    def mvccProvider = file('delosdb-storage-mvcc/src/main/java/io/github/ggeorg/delosdb/storage/mvcc/DelosMvccStorageProvider.java')
    def storelessRoot = file('delosdb-storeless/src/main/java')

    delosdbStoragePhaseC14RequireTokens(errors, smokeSource, [
            'StoragePhaseC14RoutingBoundarySmoke',
            'VersionedStorageSqlBridge.tryExecute(sql, this, true)',
            'CREATE TABLE ',
            'CREATE INDEX ',
            'INSERT INTO ',
            'SELECT * FROM ',
            'SELECT COUNT(*) FROM ',
            'UPDATE ',
            'DELETE FROM ',
            'ORDER BY value DESC',
            'WHERE value BETWEEN',
            'requireRows',
            'requireCount'
    ], 'Phase C14 routing boundary smoke')

    delosdbStoragePhaseC14RequireTokens(errors, sqlBridge, [
            'enum RoutedStatementType',
            'static record PlannedRoute(',
            'private static PlannedRoute routeStatement(String normalizedSql)',
            'private static VersionedStorageSqlResult executePlannedRouteInternal(',
            'PlannedRoute plannedRoute = routeStatement(normalizedSql);',
            'return executePlannedRoute(',
            'case CREATE_TABLE:',
            'case INSERT_VALUES:',
            'case CREATE_INDEX:',
            'case UPDATE_WHERE_EQUALS:',
            'case DELETE_WHERE_EQUALS:',
            'case SELECT_WHERE_BETWEEN:',
            'case SELECT_WHERE_RANGE:',
            'case SELECT_WHERE_EQUALS:',
            'case SELECT_ALL:',
            'case SELECT_COUNT:',
            'VersionedStorageExecutionBridge.resolvedTableOperations()',
            'PLANNED_TABLE_OPERATION_BRIDGE.insert(',
            'PLANNED_TABLE_OPERATION_BRIDGE.scanAll(',
            'PLANNED_TABLE_OPERATION_BRIDGE.stats(',
            'tableAccess.delete(',
            'tableAccess.update('
    ], 'VersionedStorageSqlBridge routing boundary')

    if (sqlBridge.exists()) {
        def bridgeText = sqlBridge.text
        def routeStart = bridgeText.indexOf('private static PlannedRoute routeStatement(String normalizedSql)')
        def executeStart = bridgeText.indexOf('private static VersionedStorageSqlResult executePlannedRouteInternal(')
        if (routeStart < 0 || executeStart < 0 || executeStart < routeStart) {
            errors << 'VersionedStorageSqlBridge must isolate routing before routed-statement execution'
        }
        if (routeStart >= 0) {
            def beforeRoute = bridgeText.substring(0, routeStart)
            if (beforeRoute.contains('.matcher(normalizedSql)')) {
                errors << 'tryExecute must not perform regex matcher dispatch directly after C14; use routeStatement instead'
            }
        }
        if (routeStart >= 0 && executeStart > routeStart) {
            def routeBody = bridgeText.substring(routeStart, executeStart)
            [
                    'CREATE_TABLE.matcher(normalizedSql)',
                    'INSERT_VALUES.matcher(normalizedSql)',
                    'CREATE_INDEX.matcher(normalizedSql)',
                    'UPDATE_WHERE_EQUALS.matcher(normalizedSql)',
                    'DELETE_WHERE_EQUALS.matcher(normalizedSql)',
                    'SELECT_WHERE_BETWEEN.matcher(normalizedSql)',
                    'SELECT_WHERE_RANGE.matcher(normalizedSql)',
                    'DelosVersionedStorageQueryTreeClassifier.selectWhereEquals(normalizedSql)',
                    'SELECT_ALL.matcher(normalizedSql)',
                    'SELECT_COUNT.matcher(normalizedSql)'
            ].each { token ->
                if (!routeBody.contains(token)) {
                    errors << "routeStatement must own SQL dispatch token: ${token}"
                }
            }
            [
                    'return createTable(',
                    'return insertValues(',
                    'return createIndex(',
                    'return updateWhereEquals(',
                    'return deleteWhereEquals(',
                    'return selectWhereRange(',
                    'return selectWhereEquals(',
                    'return selectAll(',
                    'return selectCount('
            ].each { token ->
                if (routeBody.contains(token)) {
                    errors << "routeStatement must classify only and not execute ${token}"
                }
            }
        }
        [
                'table.table().insert(',
                'table.table().update(',
                'table.table().delete(',
                'table.table().openScan(',
                'table.table().stats('
        ].each { token ->
            if (bridgeText.contains(token)) {
                errors << "VersionedStorageSqlBridge must not call ${token} directly after C14"
            }
        }
    }

    delosdbStoragePhaseC14RequireTokens(errors, executionBridge, [
            'public static VersionedStorageExecutionBridge resolvedTableOperations()',
            'private static final String PROVIDER_LOOKUP_UNAVAILABLE',
            'public <K, V> void insert(',
            'public <K, V> void update(',
            'public <K, V> void delete(',
            'public <K, V> List<VersionedRow<K, V>> scanAll(',
            'public <K, V> VersionedTableStats stats('
    ], 'VersionedStorageExecutionBridge table operation surface')

    delosdbStoragePhaseC14RequireTokens(errors, heapProvider, [
            'implements StorageProvider',
            'StorageCapabilities'
    ], 'Derby heap provider remains metadata path')

    delosdbStoragePhaseC14RequireTokens(errors, mvccProvider, [
            'implements VersionedStorageProvider',
            'VersionedTable<K, V> createTable(',
            'VersionedTable<K, V> openTable('
    ], 'MVCC provider remains VersionedStorageProvider path')

    if (storelessRoot.exists()) {
        def storelessHits = fileTree(storelessRoot).matching { include '**/*.java' }.files.findAll { sourceFile ->
            def text = sourceFile.text
            text.contains('implements StorageProvider') || text.contains('implements VersionedStorageProvider')
        }.collect { delosdbStoragePhaseC14RelPath(it) }.sort()
        if (!storelessHits.isEmpty()) {
            errors << 'Storeless must remain a no-store constraint, not a storage provider: ' + storelessHits
        }
    }

    def engineStoreSourceRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
    if (engineStoreSourceRoot.exists()) {
        errors << 'Phase C14 must not add engine-side org/apache/derby/impl/store sources: '
                + delosdbStoragePhaseC14RelPath(engineStoreSourceRoot)
    }

    def thirdIslandNames = [
            'DelosStorageEngine.java',
            'DelosMutationAccess.java',
            'TableAccessProfile.java',
            'StorageExecutionProfile.java',
            'StorelessStorageProvider.java',
            'StorelessVersionedStorageProvider.java'
    ] as Set
    def thirdIslandFiles = fileTree(rootProject.projectDir).matching {
        include '**/*.java'
        exclude '**/build/**'
        exclude '**/.gradle/**'
        exclude '**/.git/**'
        exclude '**/.idea/**'
        exclude '**/__MACOSX/**'
    }.files.findAll { thirdIslandNames.contains(it.name) }
            .collect { delosdbStoragePhaseC14RelPath(it) }.sort()
    if (!thirdIslandFiles.isEmpty()) {
        errors << 'Phase C14 must not introduce a third SPI/profile island while extracting the routing boundary: '
                + thirdIslandFiles
    }

    def allEngineVersionedFiles = delosdbStoragePhaseC14JavaFiles('delosdb-engine').findAll { sourceFile ->
        delosdbStoragePhaseC14RelPath(sourceFile).contains('/versioned/')
    }
    def sqlRegexOwners = allEngineVersionedFiles.findAll { sourceFile ->
        sourceFile.name != 'VersionedStorageSqlBridge.java' && sourceFile.text.contains('Pattern.compile(')
    }.collect { delosdbStoragePhaseC14RelPath(it) }.sort()
    if (!sqlRegexOwners.isEmpty()) {
        errors << 'C14 routing boundary must not add SQL regex owners outside VersionedStorageSqlBridge: '
                + sqlRegexOwners
    }

    lines << 'DelosDB Storage Phase C14 Routing Boundary'
    lines << '==========================================='
    lines << ''
    lines << 'C14 mechanic:'
    lines << '  keep regex routing temporary, but isolate statement classification from routed-statement execution.'
    lines << ''
    lines << 'Expected boundary:'
    lines << '  tryExecute -> routeStatement -> executePlannedRoute -> executePlannedRouteInternal.'
    lines << '  routeStatement owns Pattern/Matcher dispatch only.'
    lines << '  executePlannedRouteInternal resolves tables and calls the existing statement handlers.'
    lines << ''
    lines << 'Not done in C14:'
    lines << '  no regex routing is removed.'
    lines << '  no parser/compiler replacement route is introduced.'
    lines << '  no new storage SPI/profile family is introduced.'
    lines << ''
    lines << 'Next legal move:'
    lines << '  prove one non-regex routing replacement path, not a whole-bridge retirement.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC14RoutingBoundaryReport') {
    group = 'verification'
    description = 'Writes the Phase C14 routing boundary report.'
    dependsOn 'verifyStoragePhaseC13RoutingInventory'
    outputs.file(delosdbStoragePhaseC14ReportFile)
    doLast {
        def result = delosdbStoragePhaseC14Proof()
        def outputFile = delosdbStoragePhaseC14ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C14 routing boundary failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC14RoutingBoundarySmoke', JavaCompile) {
    dependsOn 'jars', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C14 routing boundary smoke test.'
    source = files('dev/storage-phase-c14-routing-boundary-smoke/src/main/java')
    destinationDirectory = delosdbStoragePhaseC14SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC14Classpath()
}

tasks.register('storagePhaseC14RoutingBoundarySmoke', JavaExec) {
    dependsOn 'compileStoragePhaseC14RoutingBoundarySmoke'
    group = 'verification'
    description = 'Runs the Phase C14 routing boundary smoke test.'
    classpath = delosdbStoragePhaseC14Classpath()
    mainClass = 'delosdb.smoke.StoragePhaseC14RoutingBoundarySmoke'
}

tasks.register('verifyStoragePhaseC14RoutingBoundary') {
    group = 'verification'
    description = 'Verifies the Phase C14 routing boundary extraction.'
    dependsOn 'storagePhaseC14RoutingBoundaryReport', 'storagePhaseC14RoutingBoundarySmoke'
    doLast {
        println 'Verified Phase C14 routing boundary; next step must prove one replacement route, not remove the whole SQL bridge'
    }
}
