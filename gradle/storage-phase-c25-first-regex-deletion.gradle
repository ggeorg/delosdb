import org.gradle.api.tasks.compile.JavaCompile

// Phase C25 first regex deletion.
// Deletes exactly one regex route only after C24 proved an equivalent Derby
// JavaCC / QueryTreeNode classifier for that statement type.

ext.delosdbStoragePhaseC25ReportDir = layout.buildDirectory.dir('reports/delosdb')
ext.delosdbStoragePhaseC25ReportFile =
        ext.delosdbStoragePhaseC25ReportDir.map { it.file('storage-phase-c25-first-regex-deletion.txt') }
ext.delosdbStoragePhaseC25SmokeClassesDir = layout.buildDirectory.dir('classes/storage-phase-c25-first-regex-deletion-smoke')

ext.delosdbStoragePhaseC25RelPath = { File sourceFile ->
    rootProject.projectDir.toPath().relativize(sourceFile.toPath()).toString().replace(File.separator, '/')
}

ext.delosdbStoragePhaseC25RequireTokens = { List<String> errors, File sourceFile, Collection<String> tokens, String label ->
    if (!sourceFile.exists()) {
        errors << "missing ${label}: ${delosdbStoragePhaseC25RelPath(sourceFile)}"
        return
    }
    def text = sourceFile.text
    def missing = tokens.findAll { token -> !text.contains(token) }
    if (!missing.isEmpty()) {
        errors << "${label} is missing expected tokens: ${missing.join(', ')}"
    }
}

ext.delosdbStoragePhaseC25ModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseC25RuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseC25Classpath = {
    files(
            delosdbStoragePhaseC25SmokeClassesDir,
            delosdbStoragePhaseC25ModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseC25ModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseC25ModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseC25ModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseC25RuntimeJars())
}

ext.delosdbStoragePhaseC25Proof = {
    def errors = []
    def lines = []

    def bridge = file('delosdb-engine/src/main/java/io/github/ggeorg/delosdb/engine/extension/storage/versioned/sql/VersionedStorageSqlBridge.java')
    def classifier = file('delosdb-engine/src/main/java/org/apache/derby/impl/sql/compile/DelosVersionedStorageQueryTreeClassifier.java')
    def smoke = file('dev/storage-phase-c25-first-regex-deletion-smoke/src/main/java/delosdb/smoke/StoragePhaseC25FirstRegexDeletionSmoke.java')

    delosdbStoragePhaseC25RequireTokens(errors, classifier, [
            'compilerContext.getParser().parseStatement(sql)',
            'classifySelectWhereEquals(sql, parsed)',
            'parsed instanceof CursorNode cursor',
            'select.whereClause instanceof BinaryRelationalOperatorNode comparison',
            'comparison.kind != BinaryRelationalOperatorNode.K_EQUALS',
            'ColumnReference column',
            'ConstantNode literal',
            'new SelectWhereEqualsRoute('
    ], 'C25 JavaCC / QueryTreeNode replacement classifier')

    delosdbStoragePhaseC25RequireTokens(errors, bridge, [
            'private static Optional<PlannedRoute> routeStatementWithJavaCcQueryTree(String normalizedSql)',
            'DelosVersionedStorageQueryTreeClassifier.selectWhereEquals(normalizedSql)',
            'PlannedRoute.selectWhereEquals(',
            'case SELECT_WHERE_EQUALS:',
            'tableAccess.scan(',
            'private static final Pattern SELECT_WHERE_RANGE',
            'private static final Pattern SELECT_WHERE_BETWEEN',
            'private static final Pattern SELECT_ALL',
            'private static final Pattern SELECT_COUNT'
    ], 'VersionedStorageSqlBridge after first regex deletion')

    if (bridge.exists()) {
        def text = bridge.text
        [
                'private static final Pattern SELECT_WHERE_EQUALS',
                'SELECT_WHERE_EQUALS.matcher(normalizedSql)',
                'Matcher selectWhere =',
                'selectWhere.group(1)',
                'selectWhere.group(2)',
                'selectWhere.group(3)'
        ].each { token ->
            if (text.contains(token)) {
                errors << "C25 must delete the SELECT WHERE equality regex fallback token: ${token}"
            }
        }
        if (!text.contains('Pattern.compile(')) {
            errors << 'C25 must delete one regex route only, not the whole temporary regex fallback family'
        }
        def javaCcIndex = text.indexOf('Optional<PlannedRoute> javaCcRoute = routeStatementWithJavaCcQueryTree(normalizedSql)')
        def regexIndex = text.indexOf('Matcher create = CREATE_TABLE.matcher(normalizedSql)')
        if (javaCcIndex < 0 || regexIndex < 0 || javaCcIndex > regexIndex) {
            errors << 'C25 must keep the JavaCC classifier before the remaining regex fallback routes'
        }
    }

    delosdbStoragePhaseC25RequireTokens(errors, smoke, [
            'SmokeUtils.loadEmbeddedDriver()',
            'CREATE TABLE C25_FIRST_REGEX_DELETION',
            'USING delos_mvcc',
            'SELECT * FROM C25_FIRST_REGEX_DELETION WHERE id = 2',
            'VersionedStorageSqlBridge.lastRouteClassifierForTesting().orElseThrow()',
            '"javacc-query-tree"',
            'directWithoutDerbyContext == null',
            'must not be handled by a regex fallback'
    ], 'C25 first regex deletion smoke')

    def engineImplStoreSourceRoot = file('delosdb-engine/src/main/java/org/apache/derby/impl/store')
    if (engineImplStoreSourceRoot.exists()) {
        errors << 'C25 must not add engine-side org/apache/derby/impl/store sources: '
                + delosdbStoragePhaseC25RelPath(engineImplStoreSourceRoot)
    }

    lines << 'DelosDB Storage Phase C25 First Regex Deletion'
    lines << '================================================'
    lines << ''
    lines << 'C25 mechanic:'
    lines << '  delete exactly one regex route after its Derby JavaCC / QueryTreeNode route is green.'
    lines << ''
    lines << 'Deleted route:'
    lines << '  SELECT * FROM table WHERE column = literal'
    lines << ''
    lines << 'Boundary preserved:'
    lines << '  VersionedStorageSqlBridge remains the temporary interception point.'
    lines << '  remaining regex routes stay as fallback.'
    lines << '  no heap SQL routing changes.'
    lines << '  the JavaCC route still feeds DelosFilterableTableAccess.scan(...).'
    lines << ''
    lines << 'Next step:'
    lines << '  continue replacing routes one by one; do not delete another regex route without a QueryTreeNode replacement.'
    lines << ''
    if (errors.isEmpty()) {
        lines << 'Result: PASS'
    } else {
        lines << 'Result: FAIL'
        lines << ''
        lines << 'Errors:'
        errors.each { lines << "  - ${it}" }
    }

    [errors: errors, lines: lines]
}

tasks.register('storagePhaseC25FirstRegexDeletionReport') {
    group = 'verification'
    description = 'Writes the Phase C25 first regex deletion proof report.'
    dependsOn 'verifyStoragePhaseC24JavaCcClassifier'
    outputs.file(delosdbStoragePhaseC25ReportFile)
    doLast {
        def result = delosdbStoragePhaseC25Proof()
        def outputFile = delosdbStoragePhaseC25ReportFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = result.lines.join(System.lineSeparator()) + System.lineSeparator()
        println "Wrote ${outputFile}"
        if (!result.errors.isEmpty()) {
            throw new GradleException("Phase C25 first regex deletion failed; see ${outputFile}")
        }
    }
}

tasks.register('compileStoragePhaseC25FirstRegexDeletionSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase C25 first regex deletion smoke test.'
    source = files('dev/storage-phase-c25-first-regex-deletion-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseC25SmokeClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseC25Classpath()
}

tasks.register('storagePhaseC25FirstRegexDeletionSmoke', JavaExec) {
    dependsOn 'compileStoragePhaseC25FirstRegexDeletionSmoke', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Runs the Phase C25 first regex deletion smoke test.'
    classpath = delosdbStoragePhaseC25Classpath()
    mainClass = 'delosdb.smoke.StoragePhaseC25FirstRegexDeletionSmoke'
    workingDir = layout.buildDirectory.dir('storage-phase-c25-first-regex-deletion-smoke').get().asFile
    doFirst {
        delete file('build/storage-phase-c25-first-regex-deletion-smoke')
        workingDir.mkdirs()
    }
}

tasks.register('verifyStoragePhaseC25FirstRegexDeletion') {
    group = 'verification'
    description = 'Verifies the Phase C25 first regex deletion proof.'
    dependsOn 'storagePhaseC25FirstRegexDeletionReport', 'storagePhaseC25FirstRegexDeletionSmoke'
    doLast {
        println 'Verified Phase C25 first regex deletion; next route replacement must also use Derby QueryTreeNode first'
    }
}
