// Storage Phase G native predicate verification.
// Active G-phase executable smoke gates only; no source/doc text-token guards.

ext.delosdbStoragePhaseGNativePredicatesModuleClassDir = { String projectPath, String moduleName ->
    project(projectPath).layout.buildDirectory.dir("classes/modules/${moduleName}")
}

ext.delosdbStoragePhaseGNativePredicatesRuntimeJars = {
    def runtimeJarsValue = rootProject.ext.delosdbRuntimeJars
    if (runtimeJarsValue instanceof Closure) {
        return runtimeJarsValue.call()
    }
    files(runtimeJarsValue ?: [])
}

ext.delosdbStoragePhaseGNativePredicatesClasspath = { Object smokeClassesDir ->
    files(
            smokeClassesDir,
            delosdbStoragePhaseGNativePredicatesModuleClassDir(':delosdb-engine', 'org.apache.derby.engine'),
            delosdbStoragePhaseGNativePredicatesModuleClassDir(':delosdb-engine-kernel', 'io.github.ggeorg.delosdb.engine.kernel'),
            delosdbStoragePhaseGNativePredicatesModuleClassDir(':delosdb-commons', 'org.apache.derby.commons'),
            delosdbStoragePhaseGNativePredicatesModuleClassDir(':delosdb-osgi-stub', 'org.osgi.framework'),
            project(':delosdb-spi').layout.buildDirectory.dir('classes/spi'),
            rootProject.layout.buildDirectory.file('libs/delosdb-storage-mvcc.jar'),
            delosdbStoragePhaseGNativePredicatesRuntimeJars())
}

ext.delosdbStoragePhaseG0QualifierConjunctionClassesDir =
        layout.buildDirectory.dir('classes/storage-phase-g0-native-qualifier-conjunction-smoke')

tasks.register('compileStoragePhaseG0NativeQualifierConjunctionSmoke', JavaCompile) {
    dependsOn 'jars', 'processDerbyResources', ':delosdb-spi:compileDelosDbSpi', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
    group = 'verification'
    description = 'Compiles the Phase G0 native qualifier conjunction smoke test.'
    source = files('dev/storage-phase-g0-native-qualifier-conjunction-smoke/src/main/java', rootProject.ext.delosdbSmokeUtilsSourceDir)
    destinationDirectory = delosdbStoragePhaseG0QualifierConjunctionClassesDir
    sourceCompatibility = javaRelease.toString()
    targetCompatibility = javaRelease.toString()
    options.release = javaRelease
    options.encoding = 'UTF-8'
    classpath = delosdbStoragePhaseGNativePredicatesClasspath(delosdbStoragePhaseG0QualifierConjunctionClassesDir)
}

tasks.register('storagePhaseG0NativeQualifierConjunctionSmoke', JavaExec) {
    dependsOn 'verifyStoragePhaseFConsolidation', 'compileStoragePhaseG0NativeQualifierConjunctionSmoke', 'jars', 'processDerbyResources', ':delosdb-storage-mvcc:delosDbStorageMvccJar'
