    description = 'Runs the Phase G0 native qualifier conjunction smoke test.'
    mainClass = 'delosdb.smoke.StoragePhaseG0NativeQualifierConjunctionSmoke'
    classpath = delosdbStoragePhaseGNativePredicatesClasspath(delosdbStoragePhaseG0QualifierConjunctionClassesDir)
}

