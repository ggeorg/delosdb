tasks.register('classes') {
    dependsOn 'compileDelosDbStorageMvcc'
}

tasks.register('delosDbStorageMvccJar', Jar) {
    dependsOn 'compileDelosDbStorageMvcc'
    archiveFileName = 'delosdb-storage-mvcc.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from mainClassDir
    from('src/main/resources')
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Experimental MVCC Storage')
    }
}

tasks.named('assemble') {
    dependsOn 'classes', 'delosDbStorageMvccJar'
}

tasks.named('check') {
    dependsOn 'runMvccCoreModelTest', 'runMvccTableScanModelTest', 'runVersionedStorageProviderSpiTest', 'runMvccRecoveryLogTest', 'runDelosMvccProviderOwnedIndexTest', 'runDelosMvccSnapshotIsolationTest', 'runDelosMvccCleanupVacuumTest', 'runDelosMvccRecoveryHardeningTest', 'runDelosMvccWriteConflictTest', 'runDelosMvccIndexStatsTest'
}
