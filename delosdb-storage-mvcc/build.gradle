plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.testing.Test

version = rootProject.version
group = rootProject.group

// Real Gradle Java module for the experimental DelosDB MVCC storage provider.
// Keep legacy compile/jar task names while downstream scripts are migrated.
def mainClassDir = layout.buildDirectory.dir('classes/main')
def testClassDir = layout.buildDirectory.dir('classes/test')

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

dependencies {
    implementation project(':delosdb-commons')
    implementation project(':delosdb-runtime-api')
    api project(':delosdb-storage-api')
    api project(':delosdb-storage-io')
    testImplementation project(':delosdb-storage-io')
    testImplementation "org.junit.platform:junit-platform-console-standalone:${rootProject.ext.junitPlatformConsoleVersion}"
}

sourceSets {
    main {
        java {
            destinationDirectory.set(mainClassDir)
        }
    }
    test {
        java {
            destinationDirectory.set(testClassDir)
        }
    }
}


tasks.named('compileJava', JavaCompile) {
    destinationDirectory.set(mainClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.named('compileTestJava', JavaCompile) {
    destinationDirectory.set(testClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
}

// The MVCC module intentionally uses named proof tasks below. The Java plugin
// adds a default `test` task, but this module's verification contract is the
// explicit runMvcc* tasks wired into `check`, matching the pre-conversion build.
tasks.named('test', Test) {
    enabled = false
}

// Compatibility aliases used by existing verification tasks.
tasks.register('compileDelosDbStorageMvcc') {
    dependsOn tasks.named('compileJava')
}

tasks.register('compileDelosDbStorageMvccTests') {
    dependsOn tasks.named('testClasses')
}

tasks.register('runMvccCoreModelTest', Test) {
    group = 'verification'
    description = 'Runs the experimental DelosDB MVCC core model tests.'
    dependsOn 'compileDelosDbStorageMvccTests'

    useJUnitPlatform()
    testClassesDirs = files(testClassDir)
    classpath = sourceSets.test.runtimeClasspath
    include '**/MvccCoreModelTest.class'

    binaryResultsDirectory.set(layout.buildDirectory.dir('test-results/binary/runMvccCoreModelTest'))
    reports {
        junitXml.required.set(true)
        junitXml.outputLocation.set(layout.buildDirectory.dir('test-results/runMvccCoreModelTest'))
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.dir('reports/tests/runMvccCoreModelTest'))
    }

    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}


