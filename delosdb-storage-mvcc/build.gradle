plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.jvm.tasks.Jar

version = rootProject.version
group = rootProject.group

// Production RawStore-backed MVCC access method. The retired Phase 8 oracle
// was removed after convergence; this module now contains one production
// source set and one provider artifact only.
def sourceRoot = file('src/main/java')
def resourceRoot = file('src/main/resources')
def mainClassDir = layout.buildDirectory.dir('classes/main')

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

configurations {
    derbyRuntimePatchElements {
        canBeConsumed = true
        canBeResolved = false
        transitive = false
    }
}

sourceSets {
    main {
        java {
            srcDir sourceRoot
            include 'org/apache/derby/impl/store/access/mvcc/**/*.java'
            destinationDirectory.set(mainClassDir)
        }
        resources {
            setSrcDirs([resourceRoot])
            include 'META-INF/services/org.apache.derby.iapi.store.access.conglomerate.ExternalAccessMethodProvider'
            include 'META-INF/services/org.apache.derby.iapi.store.types.DelosStorageDiagnostics'
        }
    }
}

dependencies {
    implementation project(':delosdb-commons')
    implementation project(':delosdb-runtime-api')
    implementation project(':delosdb-derby-store-api')
}

tasks.named('compileJava', JavaCompile) {
    destinationDirectory.set(mainClassDir)
    modularity.inferModulePath = false
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

// Compatibility alias consumed by root assembly and engine patch-module tasks.
tasks.register('compileStorageMvcc') {
    dependsOn tasks.named('compileJava')
}

tasks.named('jar', Jar) {
    archiveFileName = 'delosdb-storage-mvcc.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB RawStore MVCC Access Method')
        attributes 'Automatic-Module-Name': 'io.github.ggeorg.delosdb.storage.mvcc'
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('classes'), tasks.named('jar')
}

artifacts {
    derbyRuntimePatchElements(tasks.named('jar')) {
        builtBy tasks.named('jar')
    }
}
