plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.testing.Test

version = rootProject.version
group = rootProject.group

def sourceRoot = file('src/main/java')
def testSourceRoot = file('src/test/java')
def mainClassDir = layout.buildDirectory.dir('classes/main')
def testClassDir = layout.buildDirectory.dir('classes/test')
def spiClassDir = project(':delosdb-spi').layout.buildDirectory.dir('classes/spi')

tasks.register('compileDelosDbStorageMvcc', JavaCompile) {
    dependsOn ':delosdb-spi:compileDelosDbSpi'
    source = fileTree(sourceRoot) { include '**/*.java' }
    destinationDirectory = mainClassDir
    rootProject.ext.delosdbConfigureJavaCompile(delegate)
    // delosdbConfigureJavaCompile centralizes Java 21 settings and intentionally
    // clears the default classpath. Restore the SPI classes afterwards because
    // this experimental storage module is not a JPMS module yet; it consumes
    // delosdb-spi as normal compile classpath.
    classpath = rootProject.files(spiClassDir)
}

tasks.register('compileDelosDbStorageMvccTests', JavaCompile) {
    dependsOn 'compileDelosDbStorageMvcc'
    source = fileTree(testSourceRoot) { include '**/*.java' }
    destinationDirectory = testClassDir
    sourceCompatibility = rootProject.ext.javaRelease.toString()
    targetCompatibility = rootProject.ext.javaRelease.toString()
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    classpath = rootProject.files(mainClassDir, spiClassDir, rootProject.configurations.delosdbJunit5Console)
}

tasks.register('runMvccCoreModelTest', Test) {
    group = 'verification'
    description = 'Runs the experimental DelosDB MVCC core model tests.'
    dependsOn 'compileDelosDbStorageMvccTests'

    useJUnitPlatform()
    testClassesDirs = files(testClassDir)
    classpath = files(mainClassDir, testClassDir, spiClassDir, rootProject.configurations.delosdbJunit5Console)
    include '**/MvccCoreModelTest.class'

    binaryResultsDirectory.set(layout.buildDirectory.dir('test-results/binary/runMvccCoreModelTest'))
    reports {
        junitXml.required.set(true)
        junitXml.outputLocation.set(layout.buildDirectory.dir('test-results/runMvccCoreModelTest'))
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.dir('reports/tests/runMvccCoreModelTest'))
    }

    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}


