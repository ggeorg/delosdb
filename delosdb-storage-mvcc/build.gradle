tasks.named('jar', Jar) {
    archiveFileName = 'delosdb-storage-mvcc.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Experimental MVCC Storage')
    }
}

// Compatibility alias used by the root `jars` task.
tasks.register('delosDbStorageMvccJar') {
    dependsOn tasks.named('jar')
}

tasks.named('assemble') {
    dependsOn tasks.named('classes'), tasks.named('delosDbStorageMvccJar')
}

tasks.named('check') {
    dependsOn 'runMvccCoreModelTest', 'runMvccTableScanModelTest', 'runMvccSnapshotVisibilityTest', 'runMvccKernelReviewCloseoutTest', 'runMvccHistoryPrunedSafetyTest', 'runMvccVacuumWatermarkTest', 'runMvccCommandSequenceTest', 'runMvccStatementSnapshotVisibilityTest', 'runMvccTransactionOutcomeLogTest', 'runMvccUnresolvedOutcomeRecoveryTest', 'runMvccCapturedVisibilitySnapshotTest', 'runMvccPageFileTest', 'runMvccVersionRecordCodecTest', 'runMvccOverflowPayloadTest', 'runPageBackedMvccTableTest', 'runMvccPageRecoveryTest', 'runMvccPageMutationLogContractTest', 'runMvccRecoveryBootProof', 'runMvccStaticAnalysisHardeningTest'
}

