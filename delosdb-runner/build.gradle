plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

def javaRelease = rootProject.ext.javaRelease as Integer
def moduleName = 'org.apache.derby.runner'
def sourceRoot = rootProject.file('java/org.apache.derby.runner')
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")
def commonsModuleClassDir = rootProject.project(':delosdb-commons').layout.buildDirectory.dir('classes/modules/org.apache.derby.commons')
def toolsModuleClassDir = rootProject.project(':delosdb-tools').layout.buildDirectory.dir('classes/modules/org.apache.derby.tools')
def serverModuleClassDir = rootProject.project(':delosdb-server').layout.buildDirectory.dir('classes/modules/org.apache.derby.server')

def configureJavaCompile = { JavaCompile task ->
    task.sourceCompatibility = javaRelease.toString()
    task.targetCompatibility = javaRelease.toString()
    task.options.release = javaRelease
    task.options.encoding = 'UTF-8'
    task.options.deprecation = false
    task.options.warnings = true
    task.classpath = files()
    task.doFirst {
        task.options.compilerArgs.addAll(['--module-path', files(
                commonsModuleClassDir,
                toolsModuleClassDir,
                serverModuleClassDir
        ).asPath])
        task.options.compilerArgs.add('-Xlint:deprecation')
    }
}

tasks.register('compileDerbyRunner', JavaCompile) {
    dependsOn ':delosdb-commons:compileDerbyCommons', ':delosdb-tools:compileDerbyTools', ':delosdb-server:compileDerbyServer'
    source = fileTree(sourceRoot) { include '**/*.java' }
    destinationDirectory = moduleClassDir
    configureJavaCompile(delegate)
}

tasks.register('classes') {
    dependsOn 'compileDerbyRunner'
}

tasks.named('assemble') {
    dependsOn 'classes'
}


def runnerArchiveName = 'derbyrun.jar'
def legalFiles = rootProject.files(
        rootProject.file('LICENSE'),
        rootProject.file('NOTICE'),
        rootProject.file('NOTICE-FORK.md')
)

def releaseManifestAttributes = {
    [
            'Implementation-Title'      : 'DelosDB Runner',
            'Implementation-Version'    : rootProject.ext.delosDbVersion,
            'Implementation-Vendor'     : 'DelosDB Project',
            'Specification-Title'       : 'DelosDB Runner',
            'Specification-Version'     : rootProject.ext.derbyCompatibilityVersion,
            'Specification-Vendor'      : 'DelosDB Project',
            'DelosDB-Version'           : rootProject.ext.delosDbVersion,
            'DelosDB-Build-Revision'    : rootProject.ext.buildNumberProvider.get(),
            'DelosDB-Origin'            : 'Forked from Apache Derby 10.17.1.0',
            'DelosDB-Repository'        : 'https://github.com/ggeorg/delosdb',
            'Apache-Derby-Base-Version' : rootProject.ext.derbyCompatibilityVersion,
            'Built-By'                  : System.getProperty('user.name', 'unknown'),
            'Build-Jdk'                 : System.getProperty('java.version'),
            'Build-Jdk-Vendor'          : System.getProperty('java.vendor'),
            'Main-Class'                : 'org.apache.derby.run.run'
    ]
}

tasks.register('derbyRunJar', Jar) {
    dependsOn 'compileDerbyRunner', ':processDerbyResources'
    archiveFileName = runnerArchiveName
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from moduleClassDir
    from(legalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes releaseManifestAttributes()
    }
}

tasks.named('assemble') {
    dependsOn 'derbyRunJar'
}
