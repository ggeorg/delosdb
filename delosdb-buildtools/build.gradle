plugins {
    id 'base'
}

version = rootProject.version
group = rootProject.group

def buildToolsSourceRoot = file('src/main/java')
def buildToolsClassDir = layout.buildDirectory.dir('classes/build-tools')
def commonsModuleClassDir = rootProject.project(':delosdb-commons').layout.buildDirectory.dir('classes/modules/org.apache.derby.commons')
def engineModuleClassDir = rootProject.project(':delosdb-engine').layout.buildDirectory.dir('classes/modules/org.apache.derby.engine')
def kernelModuleClassDir = rootProject.project(':delosdb-engine-kernel').layout.buildDirectory.dir('classes/modules/io.github.ggeorg.delosdb.engine.kernel')
def storageDerbyClassDir = rootProject.project(':delosdb-storage-derby').layout.buildDirectory.dir('classes/main')


tasks.register('compileDerbyBuildTools', JavaCompile) {
    // The build-tools compiler reads the assembled module output directories, not
    // just javac class directories. Gradle 8.14 also tracks resources copied into
    // those same module output directories by the root processDerbyResources task,
    // so keep the dependency explicit instead of relying on task ordering through
    // aggregate verification tasks.
    dependsOn ':processDerbyResources',
            ':delosdb-commons:compileDerbyCommons',
            ':delosdb-engine-kernel:compileDelosDbEngineKernel',
            ':delosdb-storage-derby:compileLegacyDerbyStorage',
            ':delosdb-engine:compileDerbyEngine'
    source = files(
            'src/main/java/org/apache/derbyBuild/splitmessages.java',
            'src/main/java/org/apache/derbyBuild/EnglishMessagePropertiesGenerator.java',
            'src/main/java/org/apache/derbyBuild/ODBCMetadataGenerator.java',
            'src/main/java/org/apache/derbyBuild/ClassSizeCrawler.java',
            'src/main/java/org/apache/derbyBuild/SecureXmlFactoryProbe.java',
            'src/main/java/org/apache/derby/impl/store/access/sort/SortMemoryPolicyProbe.java'
    )
    destinationDirectory = buildToolsClassDir
    sourceCompatibility = rootProject.ext.javaRelease.toString()
    targetCompatibility = rootProject.ext.javaRelease.toString()
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    classpath = rootProject.files(commonsModuleClassDir, kernelModuleClassDir, engineModuleClassDir, storageDerbyClassDir)
    doLast {
        copy {
            from 'src/main/java/org/apache/derbyBuild/odbcgen_fragments.properties'
            into new File(buildToolsClassDir.get().asFile, 'org/apache/derbyBuild')
        }
    }
}

tasks.register('classes') {
    dependsOn 'compileDerbyBuildTools'
}

tasks.named('check') {
    dependsOn 'compileDerbyBuildTools'
}
