plugins {
    id 'base'
}

version = rootProject.version
group = rootProject.group

def buildToolsSourceRoot = file('src/main/java')
def buildToolsClassDir = layout.buildDirectory.dir('classes/build-tools')
def commonsModuleClassDir = rootProject.project(':delosdb-commons').layout.buildDirectory.dir('classes/modules/org.apache.derby.commons')
def engineModuleClassDir = rootProject.project(':delosdb-engine').layout.buildDirectory.dir('classes/modules/org.apache.derby.engine')

tasks.register('verifyDerbyBuildToolsSourceLayout') {
    group = 'verification'
    description = 'Verifies that inherited Derby build helper sources are owned by delosdb-buildtools.'
    inputs.dir(buildToolsSourceRoot)
    doLast {
        if (!buildToolsSourceRoot.isDirectory()) {
            throw new GradleException("Missing Derby build tools source root: ${buildToolsSourceRoot}")
        }
        [
            'org/apache/derbyBuild/splitmessages.java',
            'org/apache/derbyBuild/ClassSizeCrawler.java',
            'org/apache/derbyBuild/MessageBuilder.java',
            'org/apache/derbyBuild/MessageVetter.java',
            'org/apache/derbyPreBuild/ReleaseProperties.java'
        ].each { relativePath ->
            def source = new File(buildToolsSourceRoot, relativePath)
            if (!source.isFile()) {
                throw new GradleException("Missing moved Derby build helper source: ${source}")
            }
        }
    }
}

tasks.register('compileDerbyBuildTools', JavaCompile) {
    dependsOn 'verifyDerbyBuildToolsSourceLayout',
            ':delosdb-commons:compileDerbyCommons',
            ':delosdb-engine:compileDerbyEngine'
    source = files(
            'src/main/java/org/apache/derbyBuild/splitmessages.java',
            'src/main/java/org/apache/derbyBuild/ClassSizeCrawler.java'
    )
    destinationDirectory = buildToolsClassDir
    sourceCompatibility = rootProject.ext.javaRelease.toString()
    targetCompatibility = rootProject.ext.javaRelease.toString()
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    classpath = rootProject.files(commonsModuleClassDir, engineModuleClassDir)
}

tasks.register('classes') {
    dependsOn 'compileDerbyBuildTools'
}

tasks.named('check') {
    dependsOn 'verifyDerbyBuildToolsSourceLayout', 'compileDerbyBuildTools'
}
