plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// Gradle Java module for the small Derby build tools used by root
// resource and code generation. The retained compile alias is consumed by
// existing root generation and verification tasks.
def buildToolsClassDir = layout.buildDirectory.dir('classes/build-tools')

def buildToolSourceIncludes = [
        'org/apache/derbyBuild/splitmessages.java',
        'org/apache/derbyBuild/EnglishMessagePropertiesGenerator.java',
        'org/apache/derbyBuild/ODBCMetadataGenerator.java',
        'org/apache/derbyBuild/ClassSizeCrawler.java',
        'org/apache/derbyBuild/SecureXmlFactoryProbe.java',
        'org/apache/derbyBuild/DelosJdk25ClassFileVerifier.java',
        'org/apache/derby/impl/store/access/sort/SortMemoryPolicyProbe.java'
]

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

dependencies {
    implementation project(':delosdb-commons')
    implementation project(':delosdb-runtime-api')
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            setIncludes(buildToolSourceIncludes)
            destinationDirectory.set(buildToolsClassDir)
        }
        resources {
            srcDir 'src/main/java'
            include 'org/apache/derbyBuild/odbcgen_fragments.properties'
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    destinationDirectory.set(buildToolsClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

// Compatibility alias used by the root build.
tasks.register('compileDerbyBuildTools') {
    dependsOn tasks.named('classes')
}

tasks.named('check') {
    dependsOn tasks.named('classes')
}
