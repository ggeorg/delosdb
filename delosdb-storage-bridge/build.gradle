plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// Storage bridge for Derby-facing MVCC access-method wiring. This module
// deliberately sits above inherited Derby storage and native MVCC storage so
// neither implementation module depends directly on the other.
def sourceRoot = file('src/main/java')
def mainClassDir = layout.buildDirectory.dir('classes/main')

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

dependencies {
    implementation project(':delosdb-commons')
    implementation project(':delosdb-spi')
    implementation project(':delosdb-engine-api')
    implementation project(':delosdb-engine-storage-api')
    implementation project(':delosdb-derby-store-api')
    implementation project(':delosdb-storage-derby')
    implementation project(':delosdb-storage-mvcc')
}

sourceSets {
    main {
        java {
            srcDir sourceRoot
            include 'org/apache/derby/impl/store/access/mvcc/**/*.java'
            destinationDirectory.set(mainClassDir)
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    destinationDirectory.set(mainClassDir)
    modularity.inferModulePath = false
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

// Compatibility alias used by root assembly and patch-module tasks.
tasks.register('compileStorageBridge') {
    dependsOn tasks.named('compileJava')
}

tasks.named('jar', Jar) {
    archiveFileName = 'delosdb-storage-bridge.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Storage Bridge')
    }
}

// Compatibility runtime jar used by the root `jars` task.
tasks.register('storageBridgeJar', Jar) {
    dependsOn tasks.named('compileJava'), tasks.named('processResources')
    archiveFileName = 'delosdb-storage-bridge.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(mainClassDir)
    from(sourceSets.main.output.resourcesDir)
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Storage Bridge')
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('storageBridgeJar')
}

tasks.named('check') {
    dependsOn tasks.named('classes')
}
