plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// The inherited Derby storeless prototype is Gradle-owned now. Keep it as a
// classpath-compiled legacy prototype because it intentionally reaches into
// engine internals and is not a runtime JPMS module. It is not a supported
// DelosDB storage provider yet; it is a compile-gated research seed for future
// no-store compiler/planner experiments.
def storelessSourceRoot = file('src/main/java')
def storelessResourcesRoot = file('src/main/resources')
def storelessClassDir = layout.buildDirectory.dir('classes/storeless')
def storelessResourceDir = layout.buildDirectory.dir('resources/storeless')
def commonsModuleClassDir = rootProject.project(':delosdb-commons').layout.buildDirectory.dir('classes/modules/org.apache.derby.commons')
def kernelModuleClassDir = rootProject.project(':delosdb-engine-kernel').layout.buildDirectory.dir('classes/modules/io.github.ggeorg.delosdb.engine.kernel')
def engineModuleClassDir = rootProject.project(':delosdb-engine').layout.buildDirectory.dir('classes/modules/org.apache.derby.engine')
def storeApiClassDir = rootProject.project(':delosdb-derby-store-api').layout.buildDirectory.dir('classes/store-api')
def engineStorageApiClassDir = rootProject.project(':delosdb-engine-storage-api').layout.buildDirectory.dir('classes/engine-storage-api')
def osgiModuleClassDir = rootProject.project(':delosdb-osgi-stub').layout.buildDirectory.dir('classes/modules/org.osgi.framework')

def storelessClasspath = {
    rootProject.files(
            commonsModuleClassDir,
            kernelModuleClassDir,
            engineModuleClassDir,
            engineStorageApiClassDir,
            storeApiClassDir,
            osgiModuleClassDir
    )
}

tasks.register('compileDerbyStoreless', JavaCompile) {
    dependsOn ':delosdb-osgi-stub:compileOsgiStubs',
            ':delosdb-commons:compileDerbyCommons',
            ':delosdb-engine-kernel:compileDelosDbEngineKernel',
            ':delosdb-engine:compileDerbyEngine',
            ':delosdb-engine:copyEngineServiceDescriptors',
            ':delosdb-engine-storage-api:compileEngineStorageApi',
            ':delosdb-derby-store-api:compileDerbyStoreApi',
            ':delosdb-engine:compileClassSizeCatalog',
            ':splitEngineMessages'
    source = fileTree(storelessSourceRoot) { include '**/*.java' }
    destinationDirectory = storelessClassDir
    sourceCompatibility = rootProject.ext.javaRelease.toString()
    targetCompatibility = rootProject.ext.javaRelease.toString()
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
    classpath = storelessClasspath()
}

tasks.register('processStorelessResources', Copy) {
    from storelessResourcesRoot
    into storelessResourceDir
}


tasks.register('classes') {
    dependsOn 'compileDerbyStoreless', 'processStorelessResources'
}

tasks.named('assemble') {
    dependsOn 'classes'
}

tasks.named('check') {
    dependsOn 'classes'
}
