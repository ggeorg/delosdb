plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// The inherited Derby storeless prototype is Gradle-owned now. Keep it as a
// classpath-compiled legacy prototype because it intentionally reaches into
// engine internals and is not a runtime JPMS module.
def storelessSourceRoot = file('src/main/java')
def storelessResourcesRoot = file('src/main/resources')
def storelessClassDir = layout.buildDirectory.dir('classes/storeless')
def commonsModuleClassDir = rootProject.project(':delosdb-commons').layout.buildDirectory.dir('classes/modules/org.apache.derby.commons')
def engineModuleClassDir = rootProject.project(':delosdb-engine').layout.buildDirectory.dir('classes/modules/org.apache.derby.engine')
def osgiModuleClassDir = rootProject.project(':delosdb-osgi-stub').layout.buildDirectory.dir('classes/modules/org.osgi.framework')

tasks.register('verifyDerbyStorelessSourceLayout') {
    group = 'verification'
    description = 'Verifies that the inherited Derby storeless prototype is owned by delosdb-storeless.'
    inputs.dir(storelessSourceRoot)
    inputs.dir(storelessResourcesRoot)
    doLast {
        if (!storelessSourceRoot.isDirectory()) {
            throw new GradleException("Missing Derby storeless source root: ${storelessSourceRoot}")
        }
        if (!storelessResourcesRoot.isDirectory()) {
            throw new GradleException("Missing Derby storeless resources root: ${storelessResourcesRoot}")
        }
        def service = new File(storelessSourceRoot, 'org/apache/derby/impl/storeless/StorelessService.java')
        if (!service.isFile()) {
            throw new GradleException("Missing storeless service source: ${service}")
        }
        def database = new File(storelessSourceRoot, 'org/apache/derby/impl/storeless/StorelessDatabase.java')
        if (!database.isFile()) {
            throw new GradleException("Missing storeless database source: ${database}")
        }
        def dictionary = new File(storelessSourceRoot, 'org/apache/derby/impl/storeless/EmptyDictionary.java')
        if (!dictionary.isFile()) {
            throw new GradleException("Missing storeless dictionary source: ${dictionary}")
        }
        def moduleProperties = new File(storelessResourcesRoot, 'org/apache/derby/modules.properties')
        if (!moduleProperties.isFile()) {
            throw new GradleException("Missing storeless modules.properties resource: ${moduleProperties}")
        }
        if (!moduleProperties.text.contains('derby.module.storeless.service')) {
            throw new GradleException("Storeless modules.properties is missing service registration: ${moduleProperties}")
        }
    }
}

tasks.register('compileDerbyStoreless', JavaCompile) {
    dependsOn 'verifyDerbyStorelessSourceLayout', ':delosdb-osgi-stub:compileOsgiStubs', ':delosdb-commons:compileDerbyCommons', ':delosdb-engine:compileDerbyEngine'
    source = fileTree(storelessSourceRoot) { include '**/*.java' }
    destinationDirectory = storelessClassDir
    sourceCompatibility = rootProject.ext.javaRelease.toString()
    targetCompatibility = rootProject.ext.javaRelease.toString()
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
    classpath = rootProject.files(
            commonsModuleClassDir,
            engineModuleClassDir,
            osgiModuleClassDir
    )
}

tasks.register('classes') {
    dependsOn 'compileDerbyStoreless'
}

tasks.named('assemble') {
    dependsOn 'classes'
}

tasks.named('check') {
    dependsOn 'verifyDerbyStorelessSourceLayout', 'compileDerbyStoreless'
}
