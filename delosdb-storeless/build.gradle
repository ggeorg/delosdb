plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// Real Gradle Java module for the inherited Derby storeless prototype. It is
// still classpath-compiled because the prototype intentionally reaches engine
// internals and is not a runtime JPMS module.
def storelessClassDir = layout.buildDirectory.dir('classes/storeless')
def storelessResourceDir = layout.buildDirectory.dir('resources/storeless')

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

dependencies {
    implementation project(':delosdb-commons')
    implementation project(':delosdb-runtime-api')
    implementation project(':delosdb-storage-api')
    implementation project(':delosdb-derby-store-api')
    compileOnly project(path: ':delosdb-engine', configuration: 'derbyEngineClasses')
}

sourceSets {
    main {
        java {
            setSrcDirs(['src/main/java'])
            destinationDirectory.set(storelessClassDir)
        }
        resources {
            setSrcDirs(['src/main/resources'])
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn ':delosdb-engine:compileDerbyEngine', ':delosdb-engine:copyEngineServiceDescriptors', ':delosdb-engine:compileClassSizeCatalog', ':splitEngineMessages'
    destinationDirectory.set(storelessClassDir)
    modularity.inferModulePath = false
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.named('processResources') {
    destinationDir = storelessResourceDir.get().asFile
}

// Compatibility aliases used by the existing root and verification wiring.
tasks.register('compileDerbyStoreless') {
    dependsOn tasks.named('compileJava')
}

tasks.register('processStorelessResources') {
    dependsOn tasks.named('processResources')
}

tasks.named('check') {
    dependsOn tasks.named('classes')
}
