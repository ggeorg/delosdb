plugins {
    id 'base'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

def moduleName = 'org.apache.derby.optionaltools'
def sourceRoot = project.file('src/main/java')
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")
def commonsModuleClassDir = rootProject.project(':delosdb-commons').layout.buildDirectory.dir('classes/modules/org.apache.derby.commons')
def kernelModuleClassDir = rootProject.project(':delosdb-engine-kernel').layout.buildDirectory.dir('classes/modules/io.github.ggeorg.delosdb.engine.kernel')
def engineModuleClassDir = rootProject.project(':delosdb-engine').layout.buildDirectory.dir('classes/modules/org.apache.derby.engine')
def storageDerbyClassDir = rootProject.project(':delosdb-storage-derby').layout.buildDirectory.dir('classes/main')
def storeApiClassDir = rootProject.project(':delosdb-derby-store-api').layout.buildDirectory.dir('classes/store-api')
def engineStorageApiClassDir = rootProject.project(':delosdb-engine-storage-api').layout.buildDirectory.dir('classes/engine-storage-api')
def toolsModuleClassDir = rootProject.project(':delosdb-tools').layout.buildDirectory.dir('classes/modules/org.apache.derby.tools')
def externalModulePath = rootProject.files(
        'tools/java/json_simple-1.1.jar',
        'tools/java/lucene-analyzers-common.jar',
        'tools/java/lucene-core.jar',
        'tools/java/lucene-queryparser.jar'
)

tasks.register('compileDerbyOptionalTools', JavaCompile) {
    dependsOn ':delosdb-commons:compileDerbyCommons', ':delosdb-engine-kernel:compileDelosDbEngineKernel', ':delosdb-engine:compileDerbyEngine', ':delosdb-engine-storage-api:compileEngineStorageApi', ':delosdb-derby-store-api:compileDerbyStoreApi', ':delosdb-storage-derby:compileLegacyDerbyStorage', ':delosdb-tools:compileDerbyTools'
    source = fileTree(sourceRoot) { include '**/*.java' }
    destinationDirectory = moduleClassDir
    rootProject.ext.delosdbConfigureJavaCompile(delegate, [
            commonsModuleClassDir,
            kernelModuleClassDir,
            engineModuleClassDir,
            toolsModuleClassDir,
            externalModulePath,
            rootProject.configurations.delosdbAsm
    ])
    doFirst {
        options.compilerArgs.addAll(['--patch-module', "org.apache.derby.engine=${rootProject.files(engineStorageApiClassDir, storeApiClassDir, storageDerbyClassDir).asPath}"])
    }
}

tasks.register('classes') {
    dependsOn 'compileDerbyOptionalTools'
}

tasks.named('assemble') {
    dependsOn 'classes'
}


def optionalToolsArchiveName = 'derbyoptionaltools.jar'

tasks.register('derbyOptionalToolsJar', Jar) {
    dependsOn 'compileDerbyOptionalTools', ':processDerbyResources'
    archiveFileName = optionalToolsArchiveName
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from moduleClassDir
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Optional Tools')
    }
}

tasks.named('assemble') {
    dependsOn 'derbyOptionalToolsJar'
}
