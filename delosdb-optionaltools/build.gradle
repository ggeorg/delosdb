plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// Real Gradle Java module for derbyoptionaltools.jar. Patch-module inputs are
// resolved through Gradle configurations instead of hard-coded sibling output
// dirs.
def moduleName = 'org.apache.derby.optionaltools'
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")
def externalModulePath = rootProject.files(
        'tools/java/json_simple-1.1.jar',
        'tools/java/lucene-analyzers-common.jar',
        'tools/java/lucene-core.jar',
        'tools/java/lucene-queryparser.jar'
)

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

configurations {
    enginePatchModule {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    implementation project(':delosdb-commons')
    implementation project(':delosdb-tools')
    implementation project(':delosdb-runtime-api')
    compileOnly project(path: ':delosdb-engine', configuration: 'derbyEngineClasses')
    compileOnly externalModulePath

    // Optional dump tools compile against inherited Derby raw-store contracts
    // and implementation helpers patched into org.apache.derby.engine.
    // DataValueDescriptor's inherited Store* interfaces are owned by
    // delosdb-derby-store-api, which is already a patch-module input.
    enginePatchModule project(':delosdb-derby-store-api')
    enginePatchModule project(':delosdb-storage-derby')
}

def compileModulePathFiles = objects.fileCollection().from(configurations.compileClasspath)
def enginePatchModuleFiles = objects.fileCollection().from(configurations.enginePatchModule)

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            destinationDirectory.set(moduleClassDir)
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    inputs.files(compileModulePathFiles).withPropertyName('compileModulePath')
    inputs.files(enginePatchModuleFiles).withPropertyName('enginePatchModule')
    destinationDirectory.set(moduleClassDir)
    modularity.inferModulePath = false
    classpath = files()
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
    doFirst {
        options.compilerArgs.addAll(['--module-path', compileModulePathFiles.asPath])
        options.compilerArgs.addAll(['--patch-module', "org.apache.derby.engine=${enginePatchModuleFiles.asPath}"])
        // DataFileVTI is an inherited Derby optional dump tool. It reads raw data
        // helpers from the storage implementation patched into the engine module
        // for this compile, without making delosdb-engine export all store internals.
        options.compilerArgs.addAll([
                '--add-exports',
                'org.apache.derby.engine/org.apache.derby.impl.store.raw.data=org.apache.derby.optionaltools'
        ])
    }
}

ext.delosdbProductInfo = [
        taskName      : 'generateOptionalToolsInfoProperties',
        resourcePath  : 'org/apache/derby/optional/info.properties',
        technologyName: 'DelosDB Optional Tools',
        productFile   : 'derbyoptionaltools.jar'
]
apply from: rootProject.file('gradle/delosdb-product-info.gradle')

tasks.named('processResources') {
    dependsOn project.ext.delosdbProductInfoTask
    from project.ext.delosdbProductInfoResourceDir
}

// Compatibility alias used by the existing root build.
tasks.register('compileDerbyOptionalTools') {
    dependsOn tasks.named('compileJava')
}

def optionalToolsArchiveName = 'derbyoptionaltools.jar'

tasks.named('jar', Jar) {
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    archiveFileName = optionalToolsArchiveName
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Optional Tools')
    }
}
