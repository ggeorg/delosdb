plugins {
    id 'java-library'
}

import org.gradle.api.tasks.compile.JavaCompile

version = rootProject.version
group = rootProject.group

// Real Gradle Java module for derbyoptionaltools.jar. Patch-module inputs are
// resolved through Gradle configurations instead of hard-coded sibling output
// dirs.
def moduleName = 'org.apache.derby.optionaltools'
def moduleClassDir = layout.buildDirectory.dir("classes/modules/${moduleName}")
def externalModulePath = rootProject.files(
        'tools/java/json_simple-1.1.jar',
        'tools/java/lucene-analyzers-common.jar',
        'tools/java/lucene-core.jar',
        'tools/java/lucene-queryparser.jar'
)

java {
    sourceCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
    targetCompatibility = JavaVersion.toVersion(rootProject.ext.javaRelease)
}

configurations {
    enginePatchModule {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation project(':delosdb-commons')
    implementation project(':delosdb-tools')
    implementation project(':delosdb-engine-api')
    compileOnly project(path: ':delosdb-engine', configuration: 'derbyEngineClasses')
    compileOnly externalModulePath
    compileOnly "org.ow2.asm:asm:${rootProject.ext.asmVersion}"

    enginePatchModule(project(':delosdb-engine-storage-api')) { transitive = false }
    enginePatchModule(project(':delosdb-derby-store-api')) { transitive = false }
    enginePatchModule(project(':delosdb-storage-derby')) { transitive = false }
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            destinationDirectory.set(moduleClassDir)
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    destinationDirectory.set(moduleClassDir)
    options.release = rootProject.ext.javaRelease
    options.encoding = 'UTF-8'
    options.deprecation = false
    options.warnings = true
    options.compilerArgs.add('-Xlint:deprecation')
    doFirst {
        options.compilerArgs.addAll(['--patch-module', "org.apache.derby.engine=${configurations.enginePatchModule.asPath}"])
    }
}

// Compatibility alias used by the existing root build.
tasks.register('compileDerbyOptionalTools') {
    dependsOn tasks.named('compileJava')
}

def optionalToolsArchiveName = 'derbyoptionaltools.jar'

tasks.named('jar', Jar) {
    archiveFileName = optionalToolsArchiveName
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Optional Tools')
    }
}

// Compatibility runtime jar used by the root `jars` task. Keep root Derby
// resource processing out of the normal Gradle jar consumed by project deps.
tasks.register('derbyOptionalToolsJar', Jar) {
    dependsOn tasks.named('compileJava'), tasks.named('processResources'), ':processDerbyResources'
    archiveFileName = optionalToolsArchiveName
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(moduleClassDir)
    from(sourceSets.main.output.resourcesDir)
    from(rootProject.ext.delosdbLegalFiles) {
        into 'META-INF'
    }
    manifest {
        attributes rootProject.ext.delosdbRuntimeJarAttributes('DelosDB Optional Tools')
    }
}
